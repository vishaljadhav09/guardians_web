<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Guardians of Gala</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/styles.css" />
    <style>
      :root {
        --gog-lime: #a3e635;
        --gog-sun: #facc15;
        --gog-ink: #1e293b;
        --gog-white: rgba(255, 255, 255, 0.85);
        --gog-glass: rgba(15, 23, 42, 0.45);
        --gog-text-light: #f8fafc;
        --fx-pink: #f43f5e;
        --fx-tangerine: #f97316;
        --fx-cobalt: #3b82f6;
        --fx-lavender: #a855f7;
        --gog-shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.3),
          0 8px 10px -6px rgba(0, 0, 0, 0.3);
      }

      body {
        margin: 0;
        font-family: "Quicksand", sans-serif;
        background-color: #56595e;
        color: var(--gog-text-light);
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
      }

      /* ---- Parallax Background Canvas ---- */
      .parallax-bg {
        position: fixed;
        inset: -30px;
        z-index: -2;
        overflow: hidden;
        pointer-events: none;
        background-color: #090d16;
      }
      .parallax-layer {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
      }

      /* Decorative Aurora Ambient Blurs */
      body::after {
        content: "";
        position: fixed;
        inset: -15%;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(
            circle at 15% 20%,
            rgba(163, 230, 53, 0.12) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 85% 15%,
            rgba(244, 63, 94, 0.12) 0%,
            transparent 40%
          ),
          radial-gradient(
            circle at 75% 85%,
            rgba(59, 130, 246, 0.12) 0%,
            transparent 40%
          );
        filter: blur(90px);
        animation: auroraDrift 30s ease-in-out infinite alternate;
      }

      @keyframes auroraDrift {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(2%, -2%) scale(1.04);
        }
      }

      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 20px 80px;
      }

      /* ---------- Modern Glassmorphic HUD ---------- */
      .hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        flex-wrap: wrap;
        margin-bottom: 24px;
        background: var(--gog-glass);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        padding: 16px 24px;
        border-radius: 24px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: var(--gog-shadow);
        animation: popIn 0.6s cubic-bezier(0.2, 1.2, 0.4, 1) both;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        position: relative;
      }
      .brand .owl {
        font-size: 2.5rem;
        filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
        display: inline-block;
        transform-origin: 50% 50%;
        animation: owlFlyIn 0.9s ease-out both;
      }
      .brand h1 {
        font-family: "Baloo 2", sans-serif;
        font-weight: 800;
        font-size: 1.8rem;
        line-height: 1.1;
        margin: 0;
        background: linear-gradient(
          90deg,
          var(--gog-lime),
          #4ade80,
          var(--fx-lavender),
          var(--gog-lime)
        );
        background-size: 300% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: titleRainbow 8s linear infinite;
      }
      .brand small {
        font-family: "Caveat", cursive;
        font-size: 1.25rem;
        color: #cbd5e1;
        display: block;
        margin-top: 2px;
      }

      .hud-right {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      .chip {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: var(--gog-text-light);
        padding: 8px 16px;
        border-radius: 999px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        transition:
          transform 0.2s ease,
          background 0.2s ease;
      }
      .chip:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.14);
      }

      .smog-meter {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        padding: 6px 16px;
        min-width: 200px;
      }
      .smog-meter .label {
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 1px;
        color: #94a3b8;
      }
      .smog-track {
        flex: 1;
        height: 12px;
        border-radius: 999px;
        background: #334155;
        overflow: hidden;
        position: relative;
      }
      .smog-fill {
        height: 100%;
        background: linear-gradient(90deg, #ef4444, #f97316, var(--gog-lime));
        width: 0%;
        transition: width 0.8s cubic-bezier(0.3, 1, 0.4, 1);
        position: relative;
      }
      .smog-fill::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          110deg,
          transparent 30%,
          rgba(255, 255, 255, 0.3) 50%,
          transparent 70%
        );
        background-size: 200% 100%;
        animation: smogShimmer 2s linear infinite;
      }

      .icon-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: white;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .icon-btn:hover {
        background: var(--gog-lime);
        color: #0f172a;
      }

      @keyframes titleRainbow {
        0% {
          background-position: 0% center;
        }
        50% {
          background-position: 100% center;
        }
        100% {
          background-position: 0% center;
        }
      }

      @keyframes popIn {
        0% {
          opacity: 0;
          transform: scale(0.92);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes owlFlyIn {
        0% {
          transform: translate(-180px, -180px) rotate(-45deg) scale(0.4);
          opacity: 0;
        }
        60% {
          transform: translate(20px, 20px) rotate(15deg) scale(1.2);
          opacity: 1;
        }
        100% {
          transform: translate(0, 0) rotate(0deg) scale(1);
          opacity: 1;
        }
      }

      @keyframes smogShimmer {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: calc(200% - 200px) 0;
        }
      }

      @keyframes markerPulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.15);
        }
      }

      @keyframes markerPulseRing {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(1.8);
          opacity: 0;
        }
      }

      @keyframes constellationPulse {
        0% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: -16;
        }
      }

      @keyframes blobFloat {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.1);
        }
      }

      @keyframes blobGlow {
        0%,
        100% {
          filter: blur(18px) drop-shadow(0 0 20px rgba(163, 230, 53, 0.3));
        }
        50% {
          filter: blur(18px) drop-shadow(0 0 35px rgba(163, 230, 53, 0.6));
        }
      }

      @keyframes treeSway {
        0%,
        100% {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        50% {
          transform: translate(-50%, -50%) rotate(1deg);
        }
      }

      @keyframes treeHaloPulse {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
          opacity: 0.25;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.15);
          opacity: 0.4;
        }
      }

      @keyframes clearedRingSpin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* === NEW: SPIKA EMOTIONAL ANIMATIONS === */
      @keyframes spikaExcited {
        0%,
        100% {
          transform: scale(1) rotate(0deg);
        }
        25% {
          transform: scale(1.15) rotate(-3deg);
        }
        75% {
          transform: scale(1.15) rotate(3deg);
        }
      }

      @keyframes spikaThinking {
        0%,
        100% {
          transform: rotate(0deg);
        }
        50% {
          transform: rotate(-8deg);
        }
      }

      @keyframes spikaPointing {
        0% {
          transform: rotate(0deg) scaleX(1);
        }
        100% {
          transform: rotate(-25deg) scaleX(1);
        }
      }

      .spika-emotion-excited {
        animation: spikaExcited 0.5s ease-in-out !important;
      }

      .spika-emotion-thinking {
        animation: spikaThinking 1.2s ease-in-out infinite !important;
      }

      .spika-emotion-pointing {
        animation: spikaPointing 0.6s ease-out forwards !important;
        transform-origin: 50% 60% !important;
      }

      /* === NEW: GUIDE BAR ENHANCEMENTS === */
      .guideBar {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        margin-bottom: 20px;
        padding: 14px 16px;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(12px);
        border-radius: 16px;
        border: 1px solid rgba(163, 230, 53, 0.2);
        animation: popIn 0.6s cubic-bezier(0.2, 1.2, 0.4, 1) 0.3s both;
        min-height: 56px;
      }

      .guideAvatar {
        font-size: 2.2rem;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 50px;
        height: 50px;
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.3));
      }

      .guideBubble {
        flex: 1;
        font-size: 0.95rem;
        line-height: 1.5;
        /* color: var(--gog-text-light); */
        display: flex;
        align-items: center;
        word-break: break-word;
        max-height: 100%;
        animation: guideFadeIn 0.4s ease-out both;
      }

      @keyframes guideFadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* === NEW: INTRO OVERLAY === */
      .intro-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        animation: fadeIn 0.3s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      .intro-content {
        text-align: center;
        color: white;
        max-width: 80%;
        animation: slideUp 0.5s ease-out 0.2s both;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .intro-step {
        display: none;
        animation: fadeIn 0.4s ease-out;
      }

      .intro-step.active {
        display: block;
      }

      .intro-step-emoji {
        font-size: 4rem;
        margin-bottom: 16px;
        animation: pulse 1s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }

      .intro-step-text {
        font-size: 1.3rem;
        line-height: 1.6;
        margin: 16px 0;
      }

      .intro-controls {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-top: 24px;
      }

      .intro-btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .intro-btn-primary {
        background: var(--gog-lime);
        color: #0f172a;
      }

      .intro-btn-primary:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(163, 230, 53, 0.4);
      }

      .intro-btn-secondary {
        background: rgba(255, 255, 255, 0.2);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .intro-btn-secondary:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      /* === NEW: RESET CONFIRMATION MODAL === */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999;
        animation: fadeIn 0.3s ease-out;
      }

      .modal-content {
        background: linear-gradient(135deg, #1e293b, #0f172a);
        border: 1px solid rgba(163, 230, 53, 0.2);
        border-radius: 16px;
        padding: 32px;
        max-width: 400px;
        text-align: center;
        color: white;
        animation: slideUp 0.4s ease-out;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }

      .modal-emoji {
        font-size: 3rem;
        margin-bottom: 12px;
      }

      .modal-title {
        font-family: "Baloo 2", sans-serif;
        font-size: 1.4rem;
        font-weight: 700;
        margin: 12px 0;
      }

      .modal-text {
        font-size: 0.95rem;
        line-height: 1.6;
        color: #cbd5e1;
        margin: 16px 0 24px;
      }

      .modal-buttons {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .modal-btn {
        padding: 10px 24px;
        border: none;
        border-radius: 8px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .modal-btn-safe {
        background: var(--gog-lime);
        color: #0f172a;
        flex: 1;
        min-width: 120px;
      }

      .modal-btn-safe:hover {
        transform: scale(1.05);
        box-shadow: 0 0 20px rgba(163, 230, 53, 0.4);
      }

      .modal-btn-caution {
        background: rgba(255, 255, 255, 0.15);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.3);
        flex: 1;
        min-width: 120px;
      }

      .modal-btn-caution:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      /* ---------- Map Main Viewport Section ---------- */
      .map-stage {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 10;
        border-radius: 32px;
        overflow: hidden;
        background-image: url("https://images.unsplash.com/photo-1448375240586-882707db888b?auto=format&fit=crop&w=1200&q=80");
        background-size: cover;
        background-position: center;
        box-shadow:
          var(--gog-shadow),
          inset 0 0 100px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
        animation: popIn 0.8s cubic-bezier(0.2, 1.2, 0.4, 1) 0.1s both;
      }

      /* Constellation Dynamic Vectors */
      .constellation-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 4;
      }
      .constellation-line {
        stroke-dasharray: 8, 8;
        animation: constellationPulse 35s linear infinite;
        filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.2));
      }

      .biome-blob {
        position: absolute;
        border-radius: 50%;
        mix-blend-mode: screen;
        filter: blur(30px);
        opacity: 0.2;
        transition: all 1s ease;
        transform: translate(-50%, -50%);
        animation: blobFloat 14s ease-in-out infinite alternate;
      }
      .biome-blob.cleared {
        opacity: 0.6;
        filter: blur(18px);
        animation:
          blobFloat 8s ease-in-out infinite alternate,
          blobGlow 4s ease-in-out infinite;
      }

      /* ---------- Centerpiece: The Guardian Tree ---------- */
      .tree-zone {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 22%;
        z-index: 10;
        pointer-events: none;
        transform-origin: bottom center;
        animation: treeSway 6s ease-in-out infinite;
        cursor: pointer;
      }
      .tree-zone::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        width: 160%;
        height: 160%;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle,
          rgba(163, 230, 53, 0.25) 0%,
          rgba(168, 85, 247, 0.08) 45%,
          transparent 70%
        );
        filter: blur(20px);
        z-index: -1;
        animation: treeHaloPulse 4s ease-in-out infinite;
      }

      .tree-svg {
        width: 100%;
        height: auto;
        filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.4));
      }
      .leaf-bud {
        transition: all 0.6s cubic-bezier(0.3, 1.5, 0.4, 1);
        transform-origin: center;
      }
      .leaf-bud.bloom {
        fill: #22c55e;
        filter: drop-shadow(0 0 8px rgba(34, 197, 94, 0.8));
        animation: leafPop 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }
      @keyframes leafPop {
        0% {
          transform: scale(0.4);
          opacity: 0.4;
        }
        70% {
          transform: scale(1.25);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      /* === NEW: TREE GLOW ON PROGRESS === */
      @keyframes treeGrowGlow {
        0% {
          filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 30px rgba(163, 230, 53, 0.8));
        }
        100% {
          filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.4));
        }
      }

      .tree-svg.grow-pulse {
        animation: treeGrowGlow 0.6s ease-out !important;
      }

      /* ---------- Strategic Interface Markers ---------- */
      .marker {
        position: absolute;
        transform: translate(-50%, -50%) scale(1);
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.8rem;
        cursor: pointer;
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(8px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        z-index: 15;
      }
      .marker:not(.locked):hover {
        transform: translate(-50%, -50%) scale(1.2);
        background: #ffffff;
        border-color: var(--gog-ink);
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
      }

      .marker.locked {
        filter: grayscale(1) opacity(0.35);
        cursor: not-allowed;
        background: rgba(30, 41, 59, 0.85);
        animation: lockedBreathe 3s ease-in-out infinite;
      }

      /* === NEW: LOCKED STAGE BREATHING === */
      @keyframes lockedBreathe {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1);
        }
        50% {
          transform: translate(-50%, -50%) scale(1.05);
        }
      }

      .marker.locked::after {
        content: "😴";
        position: absolute;
        bottom: -2px;
        right: -2px;
        font-size: 0.8rem;
        background: #334155;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .marker.unlocked-ready {
        border-color: var(--gog-lime);
        box-shadow: 0 0 20px rgba(163, 230, 53, 0.4);
        animation: markerPulse 2s ease-in-out infinite;
      }
      .marker.unlocked-ready::before {
        content: "";
        position: absolute;
        inset: -6px;
        border-radius: 50%;
        border: 2px solid var(--gog-lime);
        animation: markerPulseRing 2s cubic-bezier(0.24, 0, 0.38, 1) infinite;
      }

      .marker.unlocked-upcoming {
        border-color: var(--gog-sun);
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 18px rgba(250, 204, 21, 0.35);
      }
      .marker.unlocked-upcoming::after {
        content: "⭐";
        position: absolute;
        bottom: -8px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.8rem;
      }

      .marker.cleared::after {
        content: "";
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        border: 1.5px dashed rgba(163, 230, 53, 0.4);
        animation: clearedRingSpin 24s linear infinite;
      }

      /* === NEW: GUARDIAN AWAKENING PULSE === */
      @keyframes guardianAwaken {
        0% {
          transform: translate(-50%, -50%) scale(1) rotate(0deg);
          opacity: 0.5;
        }
        50% {
          transform: translate(-50%, -50%) scale(1.3) rotate(180deg);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -50%) scale(1) rotate(360deg);
          opacity: 1;
        }
      }

      .marker.newly-cleared {
        animation: guardianAwaken 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
      }

      /* Engaging Story Narrative Tooltip Cards */
      .marker-label {
        position: absolute;
        top: 115%;
        left: 50%;
        transform: translateX(-50%) translateY(5px);
        font-size: 0.8rem;
        font-weight: 700;
        line-height: 1.3;
        white-space: nowrap;
        color: white;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-left: 3px solid var(--gog-lime);
        padding: 6px 12px;
        border-radius: 8px;
        pointer-events: none;
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        opacity: 0;
        transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      }
      .marker:hover .marker-label {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }

      /* ---------- Fog Canvas Overlays ---------- */
      .fog-layer {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 12;
      }
      .fog-blob {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(
          circle at 40% 40%,
          rgba(255, 255, 255, 0.35),
          rgba(255, 255, 255, 0) 70%
        );
        filter: blur(25px);
        transform: translate(-50%, -50%);
        opacity: 0.85;
        transition: opacity 0.6s ease-out;
        pointer-events: none;
        animation: fogFloat 12s ease-in-out infinite;
      }

      @keyframes fogFloat {
        0%,
        100% {
          transform: translate(-50%, -50%);
        }
        50% {
          transform: translate(-50%, calc(-50% + 20px));
        }
      }

      /* === NEW: BLOOM CELEBRATION === */
      .bloomSweep {
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at center,
          rgba(163, 230, 53, 0.15) 0%,
          transparent 70%
        );
        pointer-events: none;
        opacity: 0;
        z-index: 8;
      }

      .bloomSweep.run {
        animation: bloomExpand 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94)
          forwards;
      }

      @keyframes bloomExpand {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.4);
        }
      }

      /* Drifting map fog layers */
      .fog {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.25) 0%,
          rgba(255, 255, 255, 0) 70%
        );
        filter: blur(10px);
        pointer-events: none;
        mix-blend-mode: screen;
        z-index: 5;
      }
      .fog1 {
        width: 50%;
        height: 35%;
        top: 5%;
        left: -10%;
        animation:
          driftA 26s ease-in-out infinite,
          hazeBlur 9s ease-in-out infinite;
      }
      .fog2 {
        width: 60%;
        height: 40%;
        top: 40%;
        left: 50%;
        animation:
          driftB 34s ease-in-out infinite,
          hazeBlur 11s ease-in-out infinite reverse;
        opacity: 0.6;
      }
      .fog3 {
        width: 45%;
        height: 30%;
        top: 65%;
        left: 10%;
        animation:
          driftC 22s ease-in-out infinite,
          hazeBlur 7s ease-in-out infinite;
        opacity: 0.45;
      }

      @keyframes driftA {
        0% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(15vw, 2vh);
        }
        100% {
          transform: translate(0, 0);
        }
      }
      @keyframes driftB {
        0% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(-15vw, -3vh);
        }
        100% {
          transform: translate(0, 0);
        }
      }
      @keyframes driftC {
        0% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(12vw, -4vh);
        }
        100% {
          transform: translate(0, 0);
        }
      }
      @keyframes hazeBlur {
        0%,
        100% {
          filter: blur(10px);
        }
        50% {
          filter: blur(18px);
        }
      }

      /* Spika Flying Character */
      .spika-flyer {
        position: absolute;
        font-size: 2.2rem;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 20;
        opacity: 0;
        transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }
      .spika-flyer.active {
        opacity: 1;
      }

      .spika-sparkle {
        position: absolute;
        font-size: 0.9rem;
        pointer-events: none;
        z-index: 19;
        animation: sparkleFloat 0.6s ease-out forwards;
      }
      @keyframes sparkleFloat {
        0% {
          opacity: 1;
          transform: translate(var(--tx), var(--ty)) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(calc(var(--tx) * 2), calc(var(--ty) * 2))
            scale(0.3);
        }
      }

      .owl-feather {
        position: absolute;
        font-size: 1rem;
        pointer-events: none;
        z-index: 19;
        animation: featherFloat 0.85s ease-out forwards;
      }
      @keyframes featherFloat {
        0% {
          opacity: 1;
          transform: translate(0, 0) rotate(0deg) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(var(--tx), var(--ty)) rotate(45deg) scale(0.6);
        }
      }

      .smog-puff {
        position: absolute;
        border-radius: 50%;
        background: rgba(200, 200, 200, 0.4);
        pointer-events: none;
        z-index: 8;
        animation: puffFloat 1.1s ease-out forwards;
      }
      @keyframes puffFloat {
        0% {
          opacity: 0.8;
          transform: translate(0, 0) scale(1);
        }
        100% {
          opacity: 0;
          transform: translate(var(--tx), var(--ty)) scale(0.4);
        }
      }

      .leaf-sparkle {

        font-size: 0.8rem;
        pointer-events: none;
        z-index: 9;
        animation: leafFloat 0.75s ease-out forwards;
      }

          opacity: 1;
          transform: translate(0, 0) scale(1);
        }

          opacity: 0;
          transform: translate(var(--tx), var(--ty)) scale(0.4);
        }

      .ambient-bubble {
        position: absolute;
        font-size: 1.2rem;
        pointer-events: none;

      }

        0% {
          opacity: 1;
          transform: translateX(0) translateY(0) scale(1);
        }

          opacity: 0;

        100% {
          opacity: 0;

      /* Overlay Messaging System */
      .overlay-container {
        position: fixed;
        inset: 0;

        pointer-events: none;
        display: flex;
        align-items: center;

        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);

          rgba(30, 41, 59, 0.95),

        to {

          transform: translateY(0);
        }
      }

      .toast-exit {
        animation: toastSlideUp 0.3s cubic-bezier(0.6, -0.28, 0.735, 0.045)

      }

      @keyframes toastSlideUp {
        from {
          opacity: 1;
          transform: translateY(0);
        }
        to {
          opacity: 0;
          transform: translateY(-20px);
        }
      }

      .bottom-row {
        display: flex;
        justify-content: space-between;
        align-items: center;

        gap: 20px;
        flex-wrap: wrap;
      }

      .legend {

      }

      @media (max-width: 768px) {

          align-items: stretch;

        }

          text-align: center;
        }
      }

      /* Cleared Marker Bobbing */
      .marker.cleared {
        animation: clearedBob 3s ease-in-out infinite;
      }
      @keyframes clearedBob {
        0%,
        100% {
          transform: translate(-50%, -50%) rotate(-2deg);
        }
        50% {
          transform: translate(-50%, calc(-50% - 6px)) rotate(2deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>

    <script>
      (function () {
        "use strict";

        var STAGES = GOGContent.STAGES;
        var save = GOGSave.load();

        var biomeLayer = document.getElementById("biomeLayer");
        var markerLayer = document.getElementById("markerLayer");
        var fogLayer = document.getElementById("fogLayer");

        // === NEW: STORY DIRECTOR SYSTEM ===
        var StoryDirector = {
          messageQueue: [],
          currentMessageTimeout: null,
          lastMessageTime: {},
          isPlayingSequence: false,

          init: function () {
            // Check if first visit story has been seen
            if (!sessionStorage.getItem("gog_story_intro_seen")) {
              this.playFirstVisit();
            }
          },

          playFirstVisit: function () {
            if (this.isPlayingSequence) return;
            this.isPlayingSequence = true;

            var overlay = document.createElement("div");
            overlay.className = "intro-overlay";
            overlay.id = "introOverlay";

            var content = document.createElement("div");
            content.className = "intro-content";

            var stepDefinitions = [
              {
                emoji: "🌍",
                text: "Oh no...",
                delay: 500,
              },
              {
                emoji: "🌍😢",
                text: "Gala is losing her color!",
                delay: 1200,
              },
              {
                emoji: "💤",
                text: "The Guardians have fallen asleep.",
                delay: 1200,
              },
              {
                emoji: "🌱✨",
                text: "But we can wake them!",
                delay: 1200,
              },
              {
                emoji: "🦉",
                text: "I'm Spika! Let's find our first Guardian! 🌊",
                delay: 1500,
                showControls: true,
              },
            ];

            var currentStep = 0;
            var stepElements = [];

            function showNextStep() {
              if (currentStep >= stepDefinitions.length) {
                cleanup();
                return;
              }

              var def = stepDefinitions[currentStep];
              var step = document.createElement("div");
              step.className = "intro-step active";

              var emoji = document.createElement("div");
              emoji.className = "intro-step-emoji";
              emoji.textContent = def.emoji;

              var text = document.createElement("div");
              text.className = "intro-step-text";
              text.textContent = def.text;

              step.appendChild(emoji);
              step.appendChild(text);

              if (def.showControls) {
                var controls = document.createElement("div");
                controls.className = "intro-controls";

                var playBtn = document.createElement("button");
                playBtn.className = "intro-btn intro-btn-primary";
                playBtn.textContent = "Let's Help Gala! 🌟";
                playBtn.addEventListener("click", cleanup);

                var skipBtn = document.createElement("button");
                skipBtn.className = "intro-btn intro-btn-secondary";
                skipBtn.textContent = "Skip ⏭";
                skipBtn.addEventListener("click", cleanup);

                controls.appendChild(playBtn);
                controls.appendChild(skipBtn);
                step.appendChild(controls);
              }

              content.innerHTML = "";
              content.appendChild(step);
              currentStep++;

              if (def.showControls) {
                return;
              }

              setTimeout(showNextStep, def.delay);
            }

            function cleanup() {
              overlay.classList.remove("intro-overlay");
              setTimeout(function () {
                if (overlay.parentElement)
                  overlay.parentElement.removeChild(overlay);
                StoryDirector.isPlayingSequence = false;
                sessionStorage.setItem("gog_story_intro_seen", "true");
                SpikaGuide.show("Ready? Tap the glowing ocean! 🌊", {
                  priority: 8,
                  duration: 4000,
                });
              }, 300);
            }

            overlay.appendChild(content);
            document.body.appendChild(overlay);

            setTimeout(showNextStep, 800);
          },

          playStageReturn: function (stage, isNewGuardian) {
            if (this.isPlayingSequence) return;
            this.isPlayingSequence = true;

            var sequence = [
              {
                delay: 0,
                msg: "You're back! 🦉✨",
                priority: 9,
                duration: 2500,
              },
              {
                delay: 1000,
                msg: "Look what you brought!",
                priority: 9,
                duration: 2000,
              },
              {
                delay: 2500,
                msg: "A Seed of Life! 🌱",
                priority: 9,
                duration: 2500,
              },
              {
                delay: 4200,
                msg: "The Guardian Tree is growing!",
                priority: 9,
                duration: 2500,
              },
              {
                delay: 6000,
                msg: stage.guardian + " is awake! " + stage.icon + "✨",
                priority: 9,
                duration: 2500,
              },
              {
                delay: 7700,
                msg: "Look! The Smog is moving back! 🌫️→☀️",
                priority: 9,
                duration: 2500,
              },
              {
                delay: 9400,
                msg: "YOU did that! 🌟",
                priority: 10,
                duration: 2500,
              },
              {
                delay: 11100,
                msg: "Gala is getting stronger!",
                priority: 9,
                duration: 2500,
              },
            ];

            var nextStageHint = this.getNextStageName();
            if (nextStageHint) {
              sequence.push({
                delay: 12800,
                msg: "Wait... " + nextStageHint + " needs us!",
                priority: 9,
                duration: 3000,
              });
            }

            sequence.forEach(function (item) {
              setTimeout(function () {
                SpikaGuide.show(item.msg, {
                  priority: item.priority,
                  duration: item.duration,
                });
              }, item.delay);
            });

            setTimeout(function () {
              StoryDirector.isPlayingSequence = false;
            }, 13500);

          playTone: function (freq, dur, type, peak, glideTo, delay) {
            if (save.settings && save.settings.sound === false) return;
            this.init();
            if (this.ctx.state === "suspended")
              this.ctx.resume().catch(function () {});

            var t0 = this.ctx.currentTime + (delay || 0);
            var osc = this.ctx.createOscillator();
            var g = this.ctx.createGain();
            osc.type = type || "sine";
            osc.frequency.setValueAtTime(freq, t0);
            if (glideTo) {
              osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
            }
            var p = peak != null ? peak : 0.05;
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(
              p,
              t0 + Math.min(0.02, dur * 0.15),
            );
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(g);
            g.connect(this.ctx.destination);
            osc.start(t0);
            osc.stop(t0 + dur + 0.03);

            osc.onended = function () {
              osc.disconnect();
              g.disconnect();
            };
          },

              }
            }
          }

          drawConstellationLines();
          startAmbientEffects();
          sessionStorage.setItem(
            "gog_prev_cleared",
            JSON.stringify(save.stagesCleared),
          );
          sessionStorage.setItem("gog_prev_seeds", save.seeds.toString());
          prevCleared = save.stagesCleared.slice();
          prevSeeds = save.seeds;
        }

        buildMarkers();
        renderState();

        // === NEW: Safe Reset Confirmation Modal ===
        document
          .getElementById("resetBtn")
          .addEventListener("click", function () {
            var modal = document.createElement("div");
            modal.className = "modal-overlay";

            var content = document.createElement("div");
            content.className = "modal-content";

            var emoji = document.createElement("div");
            emoji.className = "modal-emoji";
            emoji.textContent = "🌍";

            var title = document.createElement("div");
            title.className = "modal-title";
            title.textContent = "Start Gala's adventure again?";

            var text = document.createElement("div");
            text.className = "modal-text";
            text.textContent = "Your Seeds and Guardian progress will restart.";

            var buttons = document.createElement("div");
            buttons.className = "modal-buttons";

            var keepBtn = document.createElement("button");
            keepBtn.className = "modal-btn modal-btn-safe";
            keepBtn.textContent = "Keep My World 🌍";
            keepBtn.addEventListener("click", function () {
              modal.parentElement.removeChild(modal);
            });

            var restartBtn = document.createElement("button");
            restartBtn.className = "modal-btn modal-btn-caution";
            restartBtn.textContent = "Restart Adventure";
            restartBtn.addEventListener("click", function () {
              save = GOGSave.reset();
              buildMarkers();
              renderState();
              GaiaAudio.playWhoosh();
              SpikaGuide.show("Let's make Gala bloom again! 🌱", {
                priority: 8,
                duration: 3000,
              });
              modal.parentElement.removeChild(modal);
            });

            buttons.appendChild(keepBtn);
            buttons.appendChild(restartBtn);
            content.appendChild(emoji);
            content.appendChild(title);
            content.appendChild(text);
            content.appendChild(buttons);
            modal.appendChild(content);
            document.body.appendChild(modal);
          });

        document
          .getElementById("settingsBtn")
          .addEventListener("click", function () {
            var overlay = GOGUi.showOverlay({
              title: "⚙️ Settings",
              body:
                '<div class="settings-panel"><div class="settings-row"><span>🔊 Sound FX Engine</span><label class="switch"><input type="checkbox" id="soundToggle" ' +
                (save.settings.sound ? "checked" : "") +
                '><span class="track"></span><span class="knob"></span></label></div><div class="settings-row"><span>🧘 Calm mode</span><label class="switch"><input type="checkbox" id="calmToggle" ' +
                (save.settings.calmMode ? "checked" : "") +
                '><span class="track"></span><span class="knob"></span></label></div></div>',
              primaryLabel: "Done",
              onPrimary: function () {
                GOGUi.closeOverlay(overlay);
              },
            });
            overlay
              .querySelector("#soundToggle")
              .addEventListener("change", function (e) {
                save = GOGSave.patch({ settings: { sound: e.target.checked } });
              });
            overlay
              .querySelector("#calmToggle")
              .addEventListener("change", function (e) {
                save = GOGSave.patch({
                  settings: { calmMode: e.target.checked },
                });
              });
          });

        // === NEW: Tree zone click interaction ===
        document
          .getElementById("treeZone")
          .addEventListener("click", function () {
            var messages = [
              "The Guardian Tree grows with every Seed we bring! 🌳✨",
              "Each Seed is a piece of Gala waking up... 🌱💚",
              "Look how many Guardians we've awakened! 🌟",
              "The Tree glows brighter with hope! ✨",
            ];
            var msg = messages[Math.floor(Math.random() * messages.length)];
            SpikaGuide.show(msg, { priority: 3, duration: 2500 });
          });

        window.addEventListener("focus", function () {
          save = GOGSave.load();
          buildMarkers();
          renderState();
        });

        // === NEW: Initialize Story Director ===
        StoryDirector.init();
      })();
    </script>
  </body>
</html>

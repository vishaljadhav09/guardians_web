        function drawForestBackground(elapsed) {
          // Dynamic greyscale/barren background filter depending on wave progress
          var activeFilter = "none";
          if (
            GOGStage2.gameState === "WAVE_ACTIVE" ||
            GOGStage2.gameState === "WAVE_CLEARED" ||
            GOGStage2.gameState === "STAGE_WON_CUTSCENE"
          ) {
            if (GOGStage2.wave === 1) {
              activeFilter = "grayscale(0.8) sepia(0.3) saturate(0.5) contrast(0.9) brightness(0.95)";
            } else if (GOGStage2.wave === 2) {
              activeFilter = "sepia(0.15) saturate(0.85) contrast(0.95) brightness(0.98)";
            } else {
              activeFilter = "saturate(1.25) contrast(1.05) brightness(1.02)";
            }
          }

          ctx.save();
          ctx.filter = activeFilter;

          ctx.fillStyle = "#1e4d2b"; // fallback fill
          ctx.fillRect(0, 0, W, H);

          var windShear = Math.sin(elapsed * 0.4) * 0.012;
          ctx.save();
          ctx.transform(1, 0, windShear, 1, 0, 0);
          layers.forEach(function (layer) {
            if (!layer.img) return;
            var img = layer.img;
            var tileW = img.width;
            var x = (scrollX * (layer.speed * 0.1)) % tileW;
            if (x > 0) x -= tileW;
            for (var dx = x; dx < W; dx += tileW) {
              // Floor the x-coordinate and ceil the width + 1 to prevent floating-point sub-pixel gaps (vertical lines)
              ctx.drawImage(img, Math.floor(dx), layer.y, Math.ceil(tileW) + 1, H);
            }
          });
          ctx.restore();
          ctx.restore();
        }

        /* ---------------- ambient canopy wildlife ---------------- */
        // Only one animal is "in play" at a time — whichever one matches
        // the current wave (1=deer, 2=giraffe, 3=tiger) — and it's only
        // ever placed and moved within the horizontal span of columns
        // that currently have connected, grown trees. No connected trees
        // yet ⇒ no animal on screen.
        function getConnectedCanopyBounds() {
          var minCol = null;
          var maxCol = null;
          var minRow = null;
          var maxRow = null;

          for (var r = 0; r < GOGStage2.rows; r++) {
            for (var c = 0; c < GOGStage2.cols; c++) {
              var cell = GOGStage2.grid[r][c];

              if (cell.state === "tree" && cell.connected) {
                if (minCol === null || c < minCol) minCol = c;
                if (maxCol === null || c > maxCol) maxCol = c;
                if (minRow === null || r < minRow) minRow = r;
                if (maxRow === null || r > maxRow) maxRow = r;
              }
            }
          }

          if (minCol === null) return null;

          return {
            minCol: minCol,
            maxCol: maxCol,
            minRow: minRow,
            maxRow: maxRow,
          };
        }

        function updateWildlife(dt) {
          var waveIdx =
            Math.min(Math.max(GOGStage2.wave, 1), WILDLIFE_DEFS.length) - 1;

          var bounds = getConnectedCanopyBounds();
          if (!bounds) {
            state.wildlife.forEach(function (w) {
              w.visible = false;
              w.placed = false;
            });
            return;
          }

          if (state.wildlifeCount === 0) {
            state.wildlifeCount = 2 + Math.floor(Math.random() * 2);
          }

          while (state.wildlife.length < state.wildlifeCount) {
            state.wildlife.push({
              defIndex: waveIdx,
              visible: false,
              placed: false,
              revealed: false,
              x: 0,
              y: 0,
              dir: Math.random() < 0.5 ? 1 : -1,
              vPhase: Math.random() * Math.PI * 2,
              row: 0,
              targetRow: 0,
              rowMoveTimer: 1 + Math.random() * 3,
              anim: { frameIndex: 0, elapsedFrameTime: 0 },
              opacity: 0,
              state: "WALKING",
              stateTimer: 2 + Math.random() * 3
            });
          }

          var cellW = W / GOGStage2.cols;
          var gridH = GRID_H;
          var cellH = gridH / GOGStage2.rows;
          var gridYOffset = GRID_Y_OFFSET;

          var def = WILDLIFE_DEFS[waveIdx];

          state.wildlife.forEach(function (w, idx) {
            if (w.defIndex !== waveIdx) {
              w.defIndex = waveIdx;
              w.revealed = false;
              w.placed = false;
              w.dir = Math.random() < 0.5 ? 1 : -1;
              w.anim.frameIndex = 0;
              w.anim.elapsedFrameTime = 0;
              w.opacity = 0;
              w.state = "WALKING";
              w.stateTimer = 2 + Math.random() * 3;
            }

            var defLocal = WILDLIFE_DEFS[w.defIndex];

            var destW = cellW * defLocal.widthScale;
            var margin = destW * 0.5 + 8;
            var rangeMinX = bounds.minCol * cellW + margin;
            
            // Limit right boundary to smog position (run away!)
            var smogLimitX = GOGStage2.smogPosition * cellW - margin;
            var rangeMaxX = Math.min((bounds.maxCol + 1) * cellW - margin, smogLimitX);

            if (rangeMaxX < rangeMinX) {
              var mid = ((bounds.minCol + bounds.maxCol + 1) / 2) * cellW;
              rangeMinX = Math.min(mid, smogLimitX);
              rangeMaxX = rangeMinX;
            }

            w.visible = true;
            
            // Entry fade in
            if (w.opacity === undefined) w.opacity = 0;
            if (w.opacity < 1) {
              w.opacity = Math.min(1.0, w.opacity + dt * 1.0);
              if (Math.random() < 0.04) {
                particles.burst(w.x, w.y, {
                  glyphs: ["🍃"],
                  count: 1,
                  lift: 8
                });
              }
            }

            var minY = gridYOffset + bounds.minRow * cellH + cellH * 0.25;
            var maxY = gridYOffset + (bounds.maxRow + 1) * cellH - cellH * 0.25;
            
            w.rowMoveTimer -= dt;

            if (w.rowMoveTimer <= 0) {
              w.rowMoveTimer = 2 + Math.random() * 3;
              var dir = Math.random() < 0.5 ? -1 : 1;
              w.targetRow = Math.max(
                bounds.minRow,
                Math.min(bounds.maxRow, w.row + dir),
              );
            }

            var targetY = gridYOffset + w.targetRow * cellH + cellH * 0.85;
            w.y += (targetY - w.y) * 4 * dt;

            if (Math.abs(w.y - targetY) < 2) {
              w.y = targetY;
              w.row = w.targetRow;
            }

            if (!w.placed) {
              // Place behind a tree/bush on entry
              w.x = rangeMinX + Math.random() * (rangeMaxX - rangeMinX);
              w.row = Math.floor(
                bounds.minRow +
                  Math.random() * (bounds.maxRow - bounds.minRow + 1),
              );
              w.targetRow = w.row;
              w.y = gridYOffset + w.row * cellH + cellH * 0.85;
              w.rowMoveTimer = 2 + Math.random() * 3;
              w.placed = true;
              w.opacity = 0;
              w.state = "WALKING";
              w.stateTimer = 2 + Math.random() * 3;
            }

            if (!w.revealed) {
              w.revealed = true;
              GOGUi.say(defLocal.revealMsg);
              audio.collect();
              particles.burst(w.x, w.y, {
                glyphs: [defLocal.revealGlyph, "✨"],
                count: 10,
                lift: 22,
              });
            }

            // Wildlife state machine reactions
            if (!w.state) {
              w.state = "WALKING";
              w.stateTimer = 3 + Math.random() * 4;
            }
            w.stateTimer -= dt;

            // Fleeing trigger if smog gets close
            var isFleeing = false;
            var smogX = GOGStage2.smogPosition * cellW;
            if (!calmMode && (smogX - w.x) < 130) {
              w.state = "WALKING";
              w.stateTimer = 1.0;
              w.dir = -1; // run leftward
              isFleeing = true;
            }

            if (w.stateTimer <= 0) {
              if (w.state === "WALKING") {
                w.state = "IDLE";
                w.stateTimer = 1.5 + Math.random() * 2.0;
                w.idleType = Math.random() < 0.5 ? "LOOK" : "EAT";
                w.idlePhase = 0;
              } else {
                w.state = "WALKING";
                w.stateTimer = 3.0 + Math.random() * 4.0;
                w.dir = Math.random() < 0.5 ? 1 : -1;
              }
            }

            if (w.state === "WALKING") {
              var walkFps = isFleeing ? defLocal.fps * 1.5 : defLocal.fps;
              GOGSpriteSheet.advanceTimeLoop(w.anim, dt, walkFps, 6);
              var curSpeed = isFleeing ? defLocal.speed * 2.0 : defLocal.speed;
              w.x += w.dir * curSpeed * dt;
              if (w.x > rangeMaxX) {
                w.x = rangeMaxX;
                w.dir = -1;
              }
              if (w.x < rangeMinX) {
                w.x = rangeMinX;
                w.dir = 1;
              }
            } else {
              w.idlePhase += dt * 6;
              w.anim.frameIndex = 0; // pause animation loop

              if (w.idleType === "EAT") {
                if (Math.random() < 0.04) {
                  particles.burst(w.x + w.dir * 12, w.y - 12, {
                    glyphs: ["🍃"],
                    count: 1,
                    lift: 5,
                    minSpeed: 10,
                    maxSpeed: 20
                  });
                  if (Math.random() < 0.15 && w.revealed) {
                    GOGUi.floatLabel(canvasFrame, w.x, w.y - 30, "Munch... 🍃", "rgba(76, 175, 80, 0.9)");
                  }
                }
              } else if (w.idleType === "LOOK") {
                if (Math.random() < 0.015 && w.revealed) {
                  GOGUi.floatLabel(canvasFrame, w.x, w.y - 45, "👀", "#ffeb3b");
                }
              }
            }
          });
        }

        function drawWildlife(filterRow) {
          if (!state.wildlife || state.wildlife.length === 0) return;

          var cellW = W / GOGStage2.cols;
          var cellH = GRID_H / GOGStage2.rows;

          state.wildlife.forEach(function (w) {
            if (!w.visible || w.defIndex < 0) return;

            // Determine which row layer the animal is in dynamically from its Y coordinate
            var animalRow = Math.floor((w.y - GRID_Y_OFFSET) / cellH);
            animalRow = Math.max(0, Math.min(GOGStage2.rows - 1, animalRow));

            if (filterRow !== undefined && animalRow !== filterRow) return;

            var def = WILDLIFE_DEFS[w.defIndex];
            var img = def.getImg();
            if (!img || !img.complete || img.width === 0) return;

            var cols = 2;
            var rows = 3;
            var frameW = img.width / cols;
            var frameH = img.height / rows;
            var frame = GOGSpriteSheet.gridFrame(
              w.anim.frameIndex,
              cols,
              frameW,
              frameH,
            );

            var destW = cellW * def.widthScale;
            var destH = (frameH / frameW) * destW;
            var flip = w.dir < 0;

            ctx.save();
            ctx.globalAlpha = w.opacity !== undefined ? w.opacity : 1.0;

            ctx.fillStyle = "rgba(20, 30, 15, 0.28)";
            ctx.beginPath();
            ctx.ellipse(w.x, w.y + 4, destW * 0.32, 6, 0, 0, Math.PI * 2);
            ctx.fill();

            ctx.translate(w.x, w.y);
            if (flip) ctx.scale(-1, 1);

            // Apply visual adjustments for idle behaviors!
            if (w.state === "IDLE") {
              if (w.idleType === "EAT") {
                // Tilt down to eat leaves/grass
                ctx.rotate(0.12 * Math.sin(w.idlePhase * 0.5) + 0.12);
              } else if (w.idleType === "LOOK") {
                // Stretch or bob slightly
                ctx.translate(0, Math.sin(w.idlePhase) * 2.5);
              }
            }

            ctx.drawImage(
              img,
              frame.x,
              frame.y,
              frame.w,
              frame.h,
              -destW / 2,
              -destH,
              destW,
              destH,
            );
            ctx.restore();
          });
        }

        /* ---------------- ambient butterflies & birds ---------------- */
        // Purely decorative flutter/flight over the connected canopy —
        // population scales up with canopy progress so the scene feels
        // more alive the more trees a child reconnects. Confined to the
        // same connected-tree bounds as the big wildlife, so they read as
        // part of that canopy rather than generic screen-wide decoration.
        function updateAmbientCreatures(dt) {
          var bounds = getConnectedCanopyBounds();
          var pct = state.canopyPercent;

          if (!bounds) {
            // Nothing connected yet — park everyone off screen.
            state.birds.forEach(function (bird) {
              bird.x = null;
            });
            return;
          }

          var cellW = W / GOGStage2.cols;
          var gridH = GRID_H;
          var cellH = gridH / GOGStage2.rows;
          var gridYOffset = GRID_Y_OFFSET;

          var spanMinX = bounds.minCol * cellW;
          var spanMaxX = (bounds.maxCol + 1) * cellW;
          var canopyTopY = gridYOffset + bounds.minRow * cellH;

          if (state.ambientButterflyCount === 0) {
            state.ambientButterflyCount = 2 + Math.floor(Math.random() * 2);
          }
          if (state.ambientBirdCount === 0) {
            state.ambientBirdCount = 2 + Math.floor(Math.random() * 2);
          }

          var butterflyUnlocked = Math.min(
            BUTTERFLY_MAX,
            state.ambientButterflyCount,
          );
          var birdUnlocked = Math.min(BIRD_MAX, state.ambientBirdCount);

          state.butterflies.forEach(function (b, i) {
            if (i >= butterflyUnlocked) {
              b.active = false;
              return;
            }
            b.active = true;
            b.phase += dt * (1.6 + b.speedMul);
            b.wingPhase += dt * 13;
            var slotFrac = (i + 0.5) / Math.max(1, butterflyUnlocked);
            var homeX = spanMinX + slotFrac * (spanMaxX - spanMinX);
            var homeY = canopyTopY - 6 + Math.sin(b.phase * 0.7 + i) * 8;
            b.x =
              homeX +
              Math.sin(b.phase * 0.6) * 28 +
              Math.cos(b.phase * 0.37 + i) * 16;
            b.y = homeY + Math.sin(b.phase * 0.9 + i) * 14;
          });

          state.birds.forEach(function (bird, i) {
            if (i >= birdUnlocked) {
              bird.x = null;
              return;
            }
            var rangeMinX = spanMinX - 50;
            var rangeMaxX = spanMaxX + 50;
            if (bird.x === null) {
              bird.x = rangeMinX + Math.random() * (rangeMaxX - rangeMinX);
              bird.y = canopyTopY - 34 - i * 14 + Math.random() * 8;
              bird.vx =
                (Math.random() < 0.5 ? 1 : -1) *
                (30 + i * 8 + Math.random() * 10);
            }
            bird.phase += dt * 2.2;
            bird.x += bird.vx * dt;
            if (bird.vx > 0 && bird.x > rangeMaxX) {
              bird.x = rangeMinX;
            } else if (bird.vx < 0 && bird.x < rangeMinX) {
              bird.x = rangeMaxX;
            }
            bird.y =
              canopyTopY -
              34 -
              i * 14 +
              Math.sin(bird.phase) * 8 +
              Math.cos(bird.phase * 0.7 + i) * 4;
          });
        }

        function drawAmbientCreatures() {
          ctx.save();
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";

          ctx.font = "20px Arial";
          state.butterflies.forEach(function (b) {
            if (!b.active) return;
            var flap = Math.sin(b.wingPhase);
            ctx.save();
            ctx.translate(b.x, b.y);
            ctx.rotate(flap * 0.2);
            ctx.scale(1, 0.72 + Math.abs(flap) * 0.28);
            ctx.fillText("🦋", 0, 0);
            ctx.restore();
          });

          ctx.font = "22px Arial";
          state.birds.forEach(function (bird) {
            if (bird.x === null) return;
            ctx.save();
            ctx.translate(bird.x, bird.y);
            if (bird.vx < 0) ctx.scale(-1, 1);
            // ctx.fillText("🐦", 0, 0);
            ctx.restore();
          });

          ctx.restore();
        }

        /* ---------------- rain clouds spawning ---------------- */
        function spawnCloud() {
          var fromLeft = Math.random() < 0.5;
          var x = fromLeft ? -80 : W + 80;
          var y = 60 + Math.random() * 120;
          var vx = (fromLeft ? 1 : -1) * (40 + Math.random() * 50);
          state.clouds.push({
            x: x,
            y: y,
            vx: vx,
            vy: (Math.random() - 0.5) * 8,
            size: 50,
            active: true,
            // Rain only starts once a child taps this cloud — see the
            // click handler and updateClouds() below.
            raining: false,
            rainTimer: 0,
            dropSpawnTimer: 0,
            drops: [],
          });
        }

        function updateClouds(dt) {
          state.cloudSpawnTimer -= dt;
          if (state.cloudSpawnTimer <= 0) {
            spawnCloud();
            state.cloudSpawnTimer = 3.0 + Math.random() * 3.0;
          }

          for (var i = state.clouds.length - 1; i >= 0; i--) {
            var c = state.clouds[i];

            if (c.raining) {
              // Tapped: the cloud eases to a gentle drift while it empties
              // itself out as an animated shower, then disperses.
              c.x += c.vx * dt;
              c.vx *= Math.max(0, 1 - dt * 3);
              c.y += c.vy * dt * 0.3;

              c.dropSpawnTimer -= dt;
              if (c.dropSpawnTimer <= 0 && c.rainTimer > 0.15) {
                c.drops.push({
                  dx: -18 + Math.random() * 36,
                  y: 0,
                  speed: 130 + Math.random() * 60,
                });
                c.dropSpawnTimer = 0.045 + Math.random() * 0.04;
              }

              for (var d = c.drops.length - 1; d >= 0; d--) {
                var drop = c.drops[d];
                drop.y += drop.speed * dt;
                if (drop.y > 95) {
                  // A little splash where each raindrop lands.
                  if (Math.random() < 0.5) {
                    particles.burst(c.x + drop.dx, c.y + 14 + 95, {
                      glyphs: ["💧"],
                      count: 1,
                      lift: 6,
                    });
                  }
                  c.drops.splice(d, 1);
                }
              }

              c.rainTimer -= dt;
              if (c.rainTimer <= 0 && c.drops.length === 0) {
                state.clouds.splice(i, 1);
              }
            } else {
              c.x += c.vx * dt;
              c.y += c.vy * dt;
              if ((c.vx > 0 && c.x > W + 100) || (c.vx < 0 && c.x < -100)) {
                state.clouds.splice(i, 1);
              }
            }
          }
        }

        /* ---------------- cutscene and end states ---------------- */
        var cutsceneTimer = null;
        function triggerSeedReturnCutscene(onComplete) {
          var overlay = document.getElementById("cutscene");
          var treeIcon = document.getElementById("csTreeIcon");
          if (!overlay) {
            onComplete();
            return;
          }
          overlay.classList.add("show");
          if (treeIcon) {
            GOGUi.restartAnimation(treeIcon, "pulse");
          }
          GOGUi.say("A seed is heading home to the Tree… 🌱");

          function closeCutscene() {
            overlay.classList.remove("show");
            if (cutsceneTimer) clearTimeout(cutsceneTimer);
            onComplete();
          }

          var skipBtn = document.getElementById("csSkipBtn");
          if (skipBtn) {
            var newSkip = skipBtn.cloneNode(true);
            skipBtn.parentNode.replaceChild(newSkip, skipBtn);
            newSkip.addEventListener("click", closeCutscene);
          }

          cutsceneTimer = setTimeout(closeCutscene, 2200);
        }

        function showIntro() {
          GOGUi.say(
            "Welcome! Plant trees to shield the rainforest from the Smog! 🌳",
          );
          var intro = GOGUi.showOverlay({
            accent: "var(--gog-lime)",
            title: "🐯 Ravi & the Canopy Call",
            body: "The Smog is creeping in! Spend saplings to plant trees on the grid. Fully grown trees link together to create a canopy barrier that blocks the smog. Tap passing rain clouds to gather more saplings!",
            primaryLabel: "Start Wave 1",
            onPrimary: function () {
              GOGUi.closeOverlay(intro);
              startWave(1);
            },
          });
        }

        function startWave(waveNum) {
          if (waveNum === 1) {
            GOGStage2.init(4, 10);
            GOGStage2.saplings = 12;
          } else {
            GOGStage2.wave = waveNum;
            GOGStage2.timer = GOGConstants.STAGE2.timePerWave;
            // Set starting saplings: Wave 2 -> 8, Wave 3 -> 4
            if (waveNum === 2) {
              GOGStage2.saplings = 8;
            } else if (waveNum === 3) {
              GOGStage2.saplings = 4;
            } else {
              GOGStage2.saplings = 4;
            }
            GOGStage2.transitionTo("WAVE_ACTIVE");
          }
          state.clouds = [];
          state.cloudSpawnTimer = 1.0;
          state.lastSmogCol = Math.floor(GOGStage2.smogPosition);
          state.running = true;
          state.cutsceneTime = undefined;
          state.cutsceneBirds = null;
          initAmbientFauna();
          GOGStage2.transitionTo("WAVE_ACTIVE");
          GOGUi.say("Wave " + waveNum + " starts! Tap clouds and plant trees!");
        }

        function endWaveCleared() {
          state.running = false;
          audio.heal();
          var nextWave = GOGStage2.wave + 1;
          
          var factText = "";
          if (GOGStage2.wave === 1) {
            factText = "🐯 \"Animals need forests. Trees provide safe homes and food for many forest creatures!\"";
          } else if (GOGStage2.wave === 2) {
            factText = "🌳 \"Trees clean our air. Their leaves absorb greenhouse gases and release fresh oxygen!\"";
          }

          var clearedOverlay = GOGUi.showOverlay({
            accent: "var(--gog-lime)",
            title: "🌳 Wave " + GOGStage2.wave + " Cleared!",
            body: "The canopy held! Ravi is recovering. Reach a " + (GOGStage2.canopyTargets[nextWave - 1] || 50) + "% connected canopy in the next wave!<br><br><b>Forest Fact:</b><br>" + factText,
            primaryLabel: "Start Wave " + nextWave,
            onPrimary: function () {
              GOGUi.closeOverlay(clearedOverlay);
              startWave(nextWave);
            },
          });
        }

        function endWin() {
          audio.stopBgm();
          if (winWiping || winWipeDone) return;
          state.running = false;
          audio.win();
          winWipeRadius = 0;
          winWiping = true;
        }

        function finishWin() {
          var connectedCount = 0;
          var totalCells = GOGStage2.rows * GOGStage2.cols;
          for (var r = 0; r < GOGStage2.rows; r++) {
            for (var c = 0; c < GOGStage2.cols; c++) {
              if (
                GOGStage2.grid[r][c].state === "tree" &&
                GOGStage2.grid[r][c].connected
              ) {
                connectedCount++;
              }
            }
          }
          var canopyPercent = Math.round((connectedCount / totalCells) * 100);

          var stars = 1;
          if (!calmMode) {
            if (canopyPercent >= 70) stars = 3;
            else if (canopyPercent >= 40) stars = 2;
          }

          var nextSave = GOGSave.recordStageClear(STAGE_ID, {
            stars: stars,
            sprouts: 15,
            smogDrop: 10,
          });

          GOGUi.say(
            "Incredible! You reforested the canopy and saved Ravi! 🐯🎉",
          );

          setTimeout(function () {
            triggerSeedReturnCutscene(function () {
              GOGUi.showOverlay({
                accent: "var(--gog-white)",
                title: "🌳 Canopy Restored!",
                body: "Ravi wakes up and a Seed of Life flies back to the Guardian Tree.<br><br><b>Did you know?</b><br>🦜 \"Rainforests are home to more than half of the world's plant and animal species!\"",
                stars: stars,
                factText: stageMeta.fact,
                primaryLabel: "Back to Map",
                secondaryLabel: "Play Again",
                onPrimary: function () {
                  window.location.href = "../index.html";
                },
                onSecondary: function () {
                  window.location.reload();
                },
              });
            });
          }, 600);
        }

        function endLose() {
          audio.stopBgm();
          state.running = false;
          audio.lose();
          canvasFrame.classList.add("flash-lose");
          var canopyNow = GOGStage2.getCanopyPercent();
          var canopyTarget = GOGStage2.getCanopyTarget();
          var loseGuide;
          if (GOGStage2.failureReason === "CANOPY_TARGET_MISSED") {
            loseGuide = "Time ran out at " + canopyNow + "% canopy - next time, plant early and connect more grown trees to reach " + canopyTarget + "%.";
          } else if (GOGStage2.failureReason === "SMOG_REACHED_RAVI") {
            loseGuide = "The Smog reached Ravi through an open column - next time, grow connected trees in every row to block it.";
          } else {
            loseGuide = "Ravi still needs a stronger canopy - next time, connect more grown trees before the Smog arrives.";
          }
          GOGUi.say(loseGuide);
          GOGUi.showOverlay({
            title: "🌫️ The forest is cloudy",
            body: loseGuide,
            primaryLabel: "Try Again",
            secondaryLabel: "Back to Map",
            onPrimary: function () {
              window.location.reload();
            },
            onSecondary: function () {
              window.location.href = "../index.html";
            },
          });
        }

        /* ---------------- input handling ---------------- */
        function updateInputs() {
          if (!state.running) return;

          if (input.pointer.down) {
            if (!state.pointerWasDown) {
              state.pointerWasDown = true;
              var ptX = input.pointer.x;
              var ptY = input.pointer.y;

              // 1. Check cloud click
              var hitCloud = false;
              for (var i = state.clouds.length - 1; i >= 0; i--) {
                var c = state.clouds[i];
                // Enlarge cloud hitbox detection to 60px for kid-friendly touch interaction
                if (
                  c.active &&
                  !c.raining &&
                  GOGEngine.Collision.distance(ptX, ptY, c.x, c.y) < 60
                ) {
                  hitCloud = true;
                  GOGStage2.saplings++;
                  audio.collect();
                  particles.burst(c.x, c.y, {
                    glyphs: ["💧", "✨"],
                    count: 12,
                    lift: 45,
                  });
                  GOGUi.floatLabel(
                    canvasFrame,
                    ptX,
                    ptY,
                    "+1 Sapling 🌱",
                    "#2fbf71",
                  );
                  // Start the rain now — the cloud lingers and shows an
                  // animated shower instead of just vanishing.
                  c.raining = true;
                  c.rainTimer = 1.4;
                  c.dropSpawnTimer = 0;
                  break;
                }
              }

              // 2. Check grid click
              // 2. Check grid click
              if (!hitCloud) {
                var cellW = W / GOGStage2.cols;
                var gridH = GRID_H;
                var cellH = gridH / GOGStage2.rows;

                // Shift calculation by subtracting the grid Y offset
                var col = Math.floor(ptX / cellW);
                var row = Math.floor((ptY - GRID_Y_OFFSET) / cellH);

                // Ensure click is inside the bounds of the grid
                if (
                  ptY >= GRID_Y_OFFSET &&
                  col >= 0 &&
                  col < GOGStage2.cols &&
                  row >= 0 &&
                  row < GOGStage2.rows
                ) {
                  // Cell lock: Smog-engulfed column check
                  if (!calmMode && col >= Math.floor(GOGStage2.smogPosition)) {
                    audio.blip(180, 150, "sawtooth");
                    GOGUi.floatLabel(
                      canvasFrame,
                      ptX,
                      ptY,
                      "Engulfed by Smog! 🌫️",
                      "#e82e5d",
                    );
                  } else {
                    var success = GOGStage2.plant(row, col);
                    if (success) {
                      audio.blip(440, 120, "triangle");
                      var cx = col * cellW + cellW / 2;
                      var cy = GRID_Y_OFFSET + row * cellH + cellH / 2; // Adjusted particle center
                      particles.burst(cx, cy, {
                        glyphs: ["🌱", "🍃"],
                        count: 8,
                        lift: 30,
                      });
                      GOGUi.floatLabel(
                        canvasFrame,
                        ptX,
                        ptY,
                        "Planted!",
                        "var(--gog-lime)",
                      );
                    } else if (
                      GOGStage2.saplings <= 0 &&
                      GOGStage2.grid[row][col].state === "empty"
                    ) {
                      audio.blip(180, 150, "sawtooth");
                      GOGUi.floatLabel(
                        canvasFrame,
                        ptX,
                        ptY,
                        "No saplings! Tap clouds ☁️",
                        "#e82e5d",
                      );
                    } else if (GOGStage2.grid[row][col].state === "rock") {
                      audio.blip(180, 150, "sawtooth");
                      GOGUi.floatLabel(
                        canvasFrame,
                        ptX,
                        ptY,
                        "Cannot plant on rocks! ⛰️",
                        "#e82e5d",
                      );
                    }
                  }
                }
              }
            }
          } else {
            state.pointerWasDown = false;
          }
        }

        /* ---------------- update loop ---------------- */
        function update(dt) {
          particles.update(dt);

          // Update juice effects
          state.screenShake = Math.max(0, state.screenShake - dt * 14);
          state.desaturateTime = Math.max(0, state.desaturateTime - dt);

          if (winWiping) {
            winWipeRadius += dt * winWipeMax * 1.6;
            if (winWipeRadius >= winWipeMax) {
              winWiping = false;
              winWipeDone = true;
              finishWin();
            }
          }

          // STAGE WON CUTSCENE UPDATE
          if (GOGStage2.gameState === "STAGE_WON_CUTSCENE") {
            if (state.cutsceneTime === undefined) {
              state.cutsceneTime = 0;
              state.cutsceneSparkleTimer = 0;
              state.wildlife.forEach(function (w, idx) {
                w.state = "IDLE";
                w.idleType = "LOOK";
                w.x = W / 2 - 80 + idx * 80;
                w.y = H / 2 + 100;
              });
              state.cutsceneBirds = [];
              for (var k = 0; k < 6; k++) {
                state.cutsceneBirds.push({
                  x: -50 - k * 30,
                  y: 60 + Math.random() * 50,
                  speed: 140 + Math.random() * 40
                });
              }
            }

            state.cutsceneTime += dt;
            state.cutsceneSparkleTimer -= dt;
            if (state.cutsceneSparkleTimer <= 0) {
              // particles.burst(W / 2 + (Math.random() - 0.5) * 160, H / 2 + (Math.random() - 0.5) * 80, {
              //   glyphs: ["✨", "🍃", "🌸", "❤️"],
              //   count: 3,
              //   lift: 15
              // });
              // state.cutsceneSparkleTimer = 0.15;
            }

            if (state.cutsceneBirds) {
              state.cutsceneBirds.forEach(function (b) {
                b.x += b.speed * dt;
              });
            }

            state.ambientFauna.forEach(function (f) {
              f.x += (W / 2 + (Math.sin(f.x + state.elapsed) * 60) - f.x) * 2 * dt;
            });

            if (state.cutsceneTime >= 5.0) {
              GOGStage2.transitionTo("STAGE_WON");
            }
          }

          if (!state.running) return;

          state.elapsed += dt;
          scrollX += 45 * dt;

          updateClouds(dt);
          updateInputs();

          // Advance logic model (growth, smog, timer) and read connection snaps
          if (GOGStage2.gameState === "WAVE_ACTIVE") {
            var grown = [];
            if (calmMode) {
              grown = GOGStage2.advanceGrowth(dt);
              if (GOGStage2.getCanopyPercent() >= GOGStage2.getCanopyTarget()) {
                GOGStage2.winWave();
              }
            } else {
              grown = GOGStage2.tick(dt);
            }

            // Nature Soundscape Tickers
            if (!state.birdSoundTimer) state.birdSoundTimer = 3 + Math.random() * 4;
            state.birdSoundTimer -= dt;
            if (state.birdSoundTimer <= 0) {
              var smogRatio = GOGStage2.smogPosition / GOGStage2.cols;
              if (smogRatio > 0.2) {
                playProceduralBird();
              }
              state.birdSoundTimer = 4 + Math.random() * 5 + (1.0 - smogRatio) * 6;
            }

            if (!state.frogSoundTimer) state.frogSoundTimer = 5 + Math.random() * 5;
            state.frogSoundTimer -= dt;
            if (state.frogSoundTimer <= 0) {
              var smogRatio = GOGStage2.smogPosition / GOGStage2.cols;
              if (smogRatio > 0.25) {
                playProceduralFrog();
              }
              state.frogSoundTimer = 6 + Math.random() * 8 + (1.0 - smogRatio) * 8;
            }

            if (!state.windSoundTimer) state.windSoundTimer = 2 + Math.random() * 3;
            state.windSoundTimer -= dt;
            if (state.windSoundTimer <= 0) {
              playProceduralWind();
              state.windSoundTimer = 10 + Math.random() * 8;
            }

            // Dynamic BGM volume based on smog distance (forest gets quieter)
            var smogRatio = GOGStage2.smogPosition / GOGStage2.cols;
            if (audio._bgMusic) {
              audio._bgMusic.volume = audio.muted ? 0 : audio._bgmMaxVol * Math.max(0.15, smogRatio);
            }

            // Update ambient fauna
            updateAmbientFauna(dt);

            // Connection snaps: Leaf / sparkle burst when tree grows
            var cellW = W / GOGStage2.cols;
            var gridH = H / 2;
            var cellH = gridH / GOGStage2.rows;
            grown.forEach(function (coord) {
              var cx = coord.c * cellW + cellW / 2;
              var cy = H / 2 + coord.r * cellH + cellH / 2;
              particles.burst(cx, cy, {
                glyphs: ["🍃", "✨", "🟢"],
                count: 18,
                lift: 20,
              });
              audio.heal();
            });

            // Smog deflection curls
            if (!calmMode && GOGStage2.smogPosition > 0) {
              var colIndex = Math.floor(GOGStage2.smogPosition - 0.05);
              if (GOGStage2.isColumnBlocked(colIndex)) {
                var bx = GOGStage2.smogPosition * cellW;
                if (Math.random() < 0.18) {
                  particles.burst(bx, Math.random() * H, {
                    glyphs: ["💨", "🌫️"],
                    count: 1,
                    lift: 12,
                    minSpeed: 45,
                    maxSpeed: 85,
                    angle: 0,
                    spread: Math.PI / 4,
                    life: 500,
                  });
                }
              }
            }

            // Smog breach detection
            if (!calmMode) {
              var currSmogCol = Math.floor(GOGStage2.smogPosition);
              if (currSmogCol < state.lastSmogCol) {
                if (!GOGStage2.isColumnBlocked(currSmogCol)) {
                  state.screenShake = 12;
                  state.desaturateTime = 0.25;
                  audio.hazard();
                  GOGUi.say("The Smog broke through a column! 🌫️⚠️");
                }
                state.lastSmogCol = currSmogCol;
              }
            }
          }

          // Handle state machine changes
          if (GOGStage2.gameState === "WAVE_CLEARED") {
            endWaveCleared();
          } else if (GOGStage2.gameState === "STAGE_WON") {
            endWin();
          } else if (GOGStage2.gameState === "STAGE_LOST") {
            endLose();
          }

          // Update HUD
          var connectedCount = 0;
          var totalCells = GOGStage2.rows * GOGStage2.cols;
          for (var r = 0; r < GOGStage2.rows; r++) {
            for (var c = 0; c < GOGStage2.cols; c++) {
              if (
                GOGStage2.grid[r][c].state === "tree" &&
                GOGStage2.grid[r][c].connected
              ) {
                connectedCount++;
              }
            }
          }
          var canopyPercent = Math.round((connectedCount / totalCells) * 100);
          canopyFill.style.width = canopyPercent + "%";
          canopyPct.textContent = canopyPercent + "% / " + GOGStage2.getCanopyTarget() + "%";
          state.canopyPercent = canopyPercent;
          updateWildlife(dt);
          updateAmbientCreatures(dt);

          sproutsChip.textContent = GOGStage2.saplings;
          if (GOGStage2.smogDelay > 0 && !calmMode) {
            timerChip.textContent = Math.ceil(GOGStage2.timer) + "s";
            timerChip.style.backgroundColor = "var(--gog-sun)";
            timerChip.style.color = "var(--gog-ink)";
          } else {
            timerChip.textContent = calmMode
              ? "∞"
              : Math.ceil(GOGStage2.timer) + "s";
            timerChip.style.backgroundColor = "";
            timerChip.style.color = "";
          }
          difficultyChip.textContent = "⚡ Wave " + GOGStage2.wave;
        }

        /* ---------------- draw loop ---------------- */
        /* ---------------- draw loop ---------------- */
        function drawWinWipe() {
          if (!winWiping && !winWipeDone) return;
          var r = winWipeDone ? winWipeMax : winWipeRadius;
          ctx.save();
          ctx.beginPath();
          ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2);
          ctx.clip();
          var grad = ctx.createRadialGradient(
            W / 2,
            H / 2,
            0,
            W / 2,
            H / 2,
            r || 1,
          );
          grad.addColorStop(0, "#FFD23F");
          grad.addColorStop(0.55, "#a3e635");
          grad.addColorStop(1, "#2E7D32");
          ctx.globalAlpha = 0.85;
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, W, H);
          ctx.restore();

          if (winWiping) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2);
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#111";
            ctx.stroke();
            ctx.restore();
          }
        }

        function draw() {
          var shakeX = 0,
            shakeY = 0;
          if (state.screenShake > 0) {
            shakeX = (Math.random() - 0.5) * state.screenShake;
            shakeY = (Math.random() - 0.5) * state.screenShake;
          }

          ctx.save();
          ctx.translate(shakeX, shakeY);

          // Apply desaturation filter on breach events
          if (state.desaturateTime > 0) {
            ctx.filter = "grayscale(1) contrast(1.15)";
          }

          drawForestBackground(state.elapsed);
          drawFog(state.elapsed);

          // Grid dimension recalculations
          var cellW = W / GOGStage2.cols;
          var gridH = GRID_H; // Height of the actionable zone
          var cellH = gridH / GOGStage2.rows; // Scale rows within the grid height
          var gridYOffset = GRID_Y_OFFSET; // Shift everything downwards past the sky

          // 1. Draw Grid Cells
          for (var r = 0; r < GOGStage2.rows; r++) {
            for (var c = 0; c < GOGStage2.cols; c++) {
              var cell = GOGStage2.grid[r][c];
              var x = c * cellW;
              var y = gridYOffset + r * cellH;

              // Empty planting spots - premium organic glowing vine plot design
              if (cell.state === "empty") {
                var cx = x + cellW / 2;
                var cy = y + cellH / 2;
                var radius = Math.min(cellW, cellH) * 0.38;

                ctx.save();
                // 1. Pulsing scale for organic/alive feedback
                var pulse = 1.0 + Math.sin(state.elapsed * 3.0 + (r * 1.7 + c * 2.3)) * 0.05;
                var rScale = radius * pulse;

                // 2. Soft earthy/soil radial gradient patch that fades out into grass
                var soilGrad = ctx.createRadialGradient(cx, cy, 2, cx, cy, radius * 1.15);
                soilGrad.addColorStop(0, "rgba(80, 50, 30, 0.35)"); 
                soilGrad.addColorStop(0.6, "rgba(100, 70, 45, 0.15)");
                soilGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
                ctx.fillStyle = soilGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, radius * 1.15, 0, Math.PI * 2);
                ctx.fill();

                // 3. Glowing circular vine indicator border (wavy, pulsing green/gold ring)
                var alphaPulse = 0.32 + Math.sin(state.elapsed * 2.8 + (r + c)) * 0.12;
                ctx.strokeStyle = "rgba(47, 191, 113, " + alphaPulse + ")";
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                
                // Draw a beautiful slightly irregular/organic ring
                var ringSteps = 16;
                for (var i = 0; i <= ringSteps; i++) {
                  var angle = (i / ringSteps) * Math.PI * 2;
                  var wave = Math.sin(angle * 4 + state.elapsed * 1.8) * 1.2;
                  var currR = rScale + wave;
                  var wx = cx + Math.cos(angle) * currR;
                  var wy = cy + Math.sin(angle) * currR;
                  if (i === 0) ctx.moveTo(wx, wy);
                  else ctx.lineTo(wx, wy);
                }
                ctx.stroke();

                // 4. Soft glowing ghost sprout emoji in the center
                ctx.shadowColor = "rgba(47, 191, 113, 0.4)";
                ctx.shadowBlur = 5;
                var fontSize = Math.max(14, Math.floor(Math.min(cellW, cellH) * 0.26));
                ctx.font = fontSize + "px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.globalAlpha = 0.45 + Math.sin(state.elapsed * 2.8 + (r + c)) * 0.15;
                ctx.fillText("🌱", cx, cy - 2);
                ctx.restore();
              }

              // Rock background tint
              if (cell.state === "rock") {
                // Draw rock image centered in the cell. use cx/cy (cell center)
                var cx = x + cellW / 2;
                var cy = y + cellH / 2;
                if (rockImg && rockImg.complete && rockImg.width > 0) {
                  var rockScale = Math.min(
                    (cellW - 12) / rockImg.width,
                    (cellH - 12) / rockImg.height,
                  );
                  rockScale *= 2;
                  var destW = rockImg.width * rockScale;
                  var destH = rockImg.height * rockScale;
                  ctx.drawImage(
                    rockImg,
                    cx - destW / 2,
                    cy - destH / 2,
                    destW,
                    destH,
                  );
                } else {
                  ctx.save();
                  ctx.font = "24px Arial";
                  ctx.textAlign = "center";
                  ctx.textBaseline = "middle";
                  ctx.fillStyle = "#555"; // visible fallback if image missing
                  ctx.fillText("⛰️", cx, cy);
                  ctx.restore();
                }
              }

              // Connected tree backdrop highlight - seamless green background
              if (cell.state === "tree" && cell.connected) {
                ctx.fillStyle = "rgba(47, 191, 113, 0.28)";
                ctx.fillRect(x, y, cellW, cellH);
              }

              // Smog locking visualization — haze-matched tint plus a full
              // hazard X, so "you can't plant here" reads from the shape
              // itself, not just a faint tint (colorblind-safe, per spec).
              if (!calmMode && c >= Math.floor(GOGStage2.smogPosition)) {
                ctx.fillStyle = "rgba(92, 86, 70, 0.22)";
                ctx.fillRect(x + 2, y + 2, cellW - 4, cellH - 4);
                ctx.strokeStyle = "rgba(40, 36, 30, 0.55)";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(x + 9, y + 9);
                ctx.lineTo(x + cellW - 9, y + cellH - 9);
                ctx.moveTo(x + cellW - 9, y + 9);
                ctx.lineTo(x + 9, y + cellH - 9);
                ctx.stroke();
              }
            }
          }

          // 2. Draw Connectivity Vine Links (Branches, vines, and canopy overlapping leaves)
          for (var r = 0; r < GOGStage2.rows; r++) {
            for (var c = 0; c < GOGStage2.cols; c++) {
              var cell = GOGStage2.grid[r][c];
              if (cell.state === "tree" && cell.connected) {
                var cx = c * cellW + cellW / 2;
                var cy = gridYOffset + r * cellH + cellH / 2;
                var windSway1 = Math.sin(state.elapsed * 1.8 + (r * 4.3 + c * 2.7)) * 2.5;

                // draw link to right neighbor
                if (c + 1 < GOGStage2.cols) {
                  var right = GOGStage2.grid[r][c + 1];
                  if (right.state === "tree" && right.connected) {
                    var ncx = (c + 1) * cellW + cellW / 2;
                    var ncy = gridYOffset + r * cellH + cellH / 2;
                    var windSway2 = Math.sin(state.elapsed * 1.8 + (r * 4.3 + (c + 1) * 2.7)) * 2.5;
                    drawTreeConnection(ctx, cx + windSway1, cy, ncx + windSway2, ncy);
                  }
                }
                // draw link to down neighbor
                if (r + 1 < GOGStage2.rows) {
                  var down = GOGStage2.grid[r + 1][c];
                  if (down.state === "tree" && down.connected) {
                    var ncx = c * cellW + cellW / 2;
                    var ncy = gridYOffset + (r + 1) * cellH + cellH / 2;
                    var windSway2 = Math.sin(state.elapsed * 1.8 + ((r + 1) * 4.3 + c * 2.7)) * 2.5;
                    drawTreeConnection(ctx, cx + windSway1, cy, ncx, ncy + windSway2);
                  }
                }
              }
            }
          }

          // 3. Draw Sprites / Glyphs (Saplings, Rocks and Trees)
          for (var r = 0; r < GOGStage2.rows; r++) {
            // Draw wildlife for this row (behind this row's trees, but in front of previous rows)
            drawWildlife(r);

            for (var c = 0; c < GOGStage2.cols; c++) {
              var cell = GOGStage2.grid[r][c];
              var cx = c * cellW + cellW / 2;
              var cy = gridYOffset + r * cellH + cellH / 2;

              var plantOffsetX = (r + c) % 2 === 0 ? -cellW * 0.15 : cellW * 0.15;
              var pcx = cx + plantOffsetX;

              if (cell.state === "rock") {
                ctx.save();
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("⛰️", cx, cy - 4);
                ctx.restore();
              } else if (cell.state === "sapling") {
                // Growth progress arc
                var pct = 1 - cell.growTimer / GOGStage2.growthTime;
                ctx.strokeStyle = "rgba(47, 191, 113, 0.7)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(
                  pcx,
                  cy + 12,
                  16,
                  -Math.PI / 2,
                  -Math.PI / 2 + pct * Math.PI * 2,
                );
                ctx.stroke();

                // Draw growing roots tendrils branching outwards into the soil
                ctx.save();
                ctx.strokeStyle = "rgba(120, 80, 50, " + (0.3 + pct * 0.5) + ")";
                ctx.lineWidth = 2.2;
                ctx.lineCap = "round";
                // Left root
                ctx.beginPath();
                ctx.moveTo(pcx, cy + cellH / 2 - 4);
                ctx.quadraticCurveTo(pcx - 8, cy + cellH / 2 + 2, pcx - 12 - pct * 12, cy + cellH / 2 + 5 + pct * 6);
                ctx.stroke();
                // Right root
                ctx.beginPath();
                ctx.moveTo(pcx, cy + cellH / 2 - 4);
                ctx.quadraticCurveTo(pcx + 8, cy + cellH / 2 + 2, pcx + 12 + pct * 12, cy + cellH / 2 + 5 + pct * 6);
                ctx.stroke();
                ctx.restore();

                // Draw growing sprites dynamically from GrowingPlants1 sheet
                if (
                  growingPlantsImg &&
                  growingPlantsImg.complete &&
                  growingPlantsImg.width > 0
                ) {
                  var frame = GOGSpriteSheet.progressFrame(
                    GROWING_PLANT_FRAMES,
                    pct,
                  );
                  var lastFrame =
                    GROWING_PLANT_FRAMES[GROWING_PLANT_FRAMES.length - 1];
                  var plantScale = Math.min(
                    (cellW - 16) / lastFrame.w,
                    (cellH - 10) / lastFrame.h,
                  );
                  var destW = frame.w * plantScale;

                  GOGSpriteSheet.drawFrame(
                    ctx,
                    growingPlantsImg,
                    frame,
                    pcx,
                    cy + cellH / 2 - 6,
                    destW,
                    "bottom",
                  );
                } else {
                  ctx.save();
                  ctx.font = "26px Arial";
                  ctx.textAlign = "center";
                  ctx.textBaseline = "middle";
                  ctx.fillText("🌱", pcx, cy);
                  ctx.restore();
                }
              } else if (cell.state === "tree") {
                // Determine scale based on grow pop timer
                var popScale = 1.0;
                if (cell.growPopTimer > 0) {
                  var progress = 1.0 - cell.growPopTimer / 0.5;
                  // Bouncy scale: pop up to 1.25, settle to 1.0
                  if (progress < 0.6) {
                    popScale = 0.1 + (progress / 0.6) * 1.15;
                  } else {
                    popScale = 1.25 - ((progress - 0.6) / 0.4) * 0.25;
                  }
                }

                // Gentle staggered wind sway (2-3px)
                var windSway = Math.sin(state.elapsed * 1.8 + (r * 4.3 + c * 2.7)) * 2.5;

                // Check if tree is engulfed by smog
                var isEngulfed = !calmMode && c >= Math.floor(GOGStage2.smogPosition);

                // Draw seaweed from Stage 1 in between connected trees to build a thick canopy
                if (cell.connected && !isEngulfed) {
                  // Horizontal seaweed connection
                  if (c + 1 < GOGStage2.cols) {
                    var right = GOGStage2.grid[r][c + 1];
                    if (right.state === "tree" && right.connected) {
                      var midX = (c + 1) * cellW;
                      var midY = gridYOffset + r * cellH + cellH / 2;
                      var windSwayMid = Math.sin(state.elapsed * 1.8 + (r * 4.3 + (c + 0.5) * 2.7)) * 2.5;

                      ctx.save();
                      var seaImg = (r + c) % 2 === 0 ? seaWedImg1 : seaWedImg2;
                      if (seaImg && seaImg.complete && seaImg.width > 0) {
                        var seaW = cellW * 0.9;
                        var seaH = (seaImg.height / seaImg.width) * seaW;
                        ctx.translate(midX + windSwayMid, midY + cellH / 2 - 6);
                        ctx.filter = "brightness(0.85) saturate(0.9) hue-rotate(-5deg)";
                        ctx.drawImage(seaImg, -seaW / 2, -seaH + 12, seaW, seaH);
                      }
                      ctx.restore();
                    }
                  }
                  // Vertical seaweed connection
                  if (r + 1 < GOGStage2.rows) {
                    var down = GOGStage2.grid[r + 1][c];
                    if (down.state === "tree" && down.connected) {
                      var midX = c * cellW + cellW / 2;
                      var midY = gridYOffset + (r + 1) * cellH;
                      var windSwayMid = Math.sin(state.elapsed * 1.8 + ((r + 0.5) * 4.3 + c * 2.7)) * 2.5;

                      ctx.save();
                      var seaImg = (r + c) % 2 === 0 ? seaWedImg2 : seaWedImg1;
                      if (seaImg && seaImg.complete && seaImg.width > 0) {
                        var seaW = cellW * 0.95;
                        var seaH = (seaImg.height / seaImg.width) * seaW;
                        ctx.translate(midX + windSwayMid, midY + cellH / 2 - 6);
                        ctx.filter = "brightness(0.85) saturate(0.9) hue-rotate(-5deg)";
                        ctx.drawImage(seaImg, -seaW / 2, -seaH + 12, seaW, seaH);
                      }
                      ctx.restore();
                    }
                  }
                }

                // Draw procedural tree style
                drawProceduralTree(ctx, cx, cy, cellW, cellH, cell.variation, cell.connected, windSway, isEngulfed, popScale);

                // Draw healthy roots for fully grown trees if connected!
                if (cell.connected && !isEngulfed) {
                  ctx.save();
                  ctx.strokeStyle = "rgba(47, 191, 113, 0.55)"; // glowing root lines
                  ctx.lineWidth = 2.5;
                  ctx.lineCap = "round";
                  // Left root
                  ctx.beginPath();
                  ctx.moveTo(cx + windSway, cy + cellH / 2 - 4);
                  ctx.quadraticCurveTo(cx + windSway - 10, cy + cellH / 2 + 2, cx + windSway - 22, cy + cellH / 2 + 10);
                  ctx.stroke();
                  // Right root
                  ctx.beginPath();
                  ctx.moveTo(cx + windSway, cy + cellH / 2 - 4);
                  ctx.quadraticCurveTo(cx + windSway + 10, cy + cellH / 2 + 2, cx + windSway + 22, cy + cellH / 2 + 10);
                  ctx.stroke();
                  ctx.restore();
                }
              }
            }
          }

          // 3b. Draw ambient canopy wildlife — layered on top of the grown
          // trees so it visibly stands within the connected canopy patch.
          drawAmbientCreatures();
          drawAmbientFauna(ctx);

          // 4. Draw Blossoms & Wildlife in Win/Cleared state (Phase 5 Juice)
          if (
            GOGStage2.gameState === "STAGE_WON" ||
            GOGStage2.gameState === "WAVE_CLEARED"
          ) {
            // Draw colorful blossoms on top of connected trees
            for (var r = 0; r < GOGStage2.rows; r++) {
              for (var c = 0; c < GOGStage2.cols; c++) {
                var cell = GOGStage2.grid[r][c];
                if (cell.state === "tree" && cell.connected) {
                  var cx = c * cellW + cellW / 2;
                  var cy = gridYOffset + r * cellH + cellH / 2;
                  ctx.save();
                  ctx.font = "16px Arial";
                  ctx.fillText("🌸", cx - 12, cy - 24);
                  if (c % 2 === 0) ctx.fillText("🌼", cx + 12, cy - 28);
                  ctx.restore();
                }
              }
            }

            // Draw birds and butterflies returning
            ctx.save();
            ctx.font = "24px Arial";
            var birdX = ((state.elapsed * 60) % (W + 200)) - 100;
            // ctx.fillText("🐦", birdX, 50);
            // ctx.fillText("🐦", birdX - 35, 75);
            // ctx.fillText("🦋", birdX + 20, 110);
            ctx.restore();
          }

          // 5. Draw Rain Clouds and Falling Rain — rain is only ever drawn
          // once a cloud has actually been tapped (state.raining), and it
          // animates as real falling drops rather than a static drizzle
          // glyph frozen under the cloud.
          state.clouds.forEach(function (c) {
            if (!c.active) return;

            if (c.raining) {
              ctx.save();
              ctx.strokeStyle = "rgba(100, 180, 255, 0.85)";
              ctx.lineCap = "round";
              c.drops.forEach(function (d) {
                var fade = Math.max(0, 1 - d.y / 95);
                if (fade <= 0) return;
                ctx.globalAlpha = fade;
                ctx.lineWidth = 2.4;
                ctx.beginPath();
                ctx.moveTo(c.x + d.dx, c.y + 14 + d.y);
                ctx.lineTo(c.x + d.dx - 3, c.y + 14 + d.y + 15);
                ctx.stroke();
              });
              ctx.restore();
            }

            // Vector outlined cloud — gently dims and cools in color while
            // it rains, then fades as its shower finishes.
            ctx.save();
            ctx.globalAlpha = c.raining
              ? Math.max(0.35, Math.min(1, c.rainTimer / 1.4))
              : 1;
            ctx.fillStyle = c.raining ? "#eaf3ff" : "#ffffff";
            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(c.x - 20, c.y + 8);
            ctx.bezierCurveTo(
              c.x - 38,
              c.y + 8,
              c.x - 38,
              c.y - 12,
              c.x - 20,
              c.y - 12,
            );
            ctx.bezierCurveTo(
              c.x - 20,
              c.y - 30,
              c.x + 20,
              c.y - 30,
              c.x + 20,
              c.y - 12,
            );
            ctx.bezierCurveTo(
              c.x + 38,
              c.y - 12,
              c.x + 38,
              c.y + 8,
              c.x + 20,
              c.y + 8,
            );
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          });

          // 6. Draw creeping Smog — INDUSTRIAL HAZE theme.
          // Grey-brown/khaki palette (not purple/lavender) so the color
          // itself reads as "dirty air" on sight, plus a hazard-stripe
          // boundary and rising soot below. Still soft cartoon, never a
          // monster — per brand — but now unmistakably pollution, not a
          // friendly rain cloud.
          if (!calmMode && GOGStage2.smogPosition < GOGStage2.cols) {
            var smogX = GOGStage2.smogPosition * cellW;

            ctx.save();

            // --- LAYER A: Murky Haze Body, wavy undulating leading edge
            // instead of a flat rectangle wall. The edge is a sine-based
            // path that ripples over time, and a few translucent wave
            // bands roll through the body itself so the whole
            // grid-covering fill reads as living haze, not a flat block.
            var frontWaveTime = state.elapsed * 3.5;
            var edgeSteps = 26;
            var edgeTop = gridYOffset - 6;
            var edgeBottom = gridYOffset + gridH + 6;

            function smogEdgeX(y) {
              return (
                smogX +
                Math.sin(y * 0.045 + frontWaveTime) * 12 +
                Math.cos(y * 0.09 - frontWaveTime * 0.7) * 6
              );
            }

            ctx.fillStyle = "rgba(92, 86, 70, 0.78)"; // murky charcoal-khaki
            ctx.beginPath();
            ctx.moveTo(W + 4, edgeTop);
            for (var wsY = 0; wsY <= edgeSteps; wsY++) {
              var wy = edgeTop + ((edgeBottom - edgeTop) * wsY) / edgeSteps;
              ctx.lineTo(smogEdgeX(wy), wy);
            }
            ctx.lineTo(W + 4, edgeBottom);
            ctx.closePath();
            ctx.fill();

            // Rolling wave bands + drifting soot flecks, both clipped to
            // the fog body's own wavy silhouette, each drifting at a
            // slightly different phase and speed for layered motion.
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(W + 4, edgeTop);
            for (var wcY = 0; wcY <= edgeSteps; wcY++) {
              var wcy = edgeTop + ((edgeBottom - edgeTop) * wcY) / edgeSteps;
              ctx.lineTo(smogEdgeX(wcy), wcy);
            }
            ctx.lineTo(W + 4, edgeBottom);
            ctx.closePath();
            ctx.clip();

            var smogBandColors = [
              "rgba(132, 120, 90, 0.30)", // murky khaki-brown
              "rgba(48, 44, 38, 0.30)", // sooty dark
              "rgba(170, 158, 118, 0.20)", // sickly pale haze highlight
            ];
            for (var band = 0; band < smogBandColors.length; band++) {
              var bandPhase = frontWaveTime * (0.6 + band * 0.25) + band * 2.1;
              var bandHeight = gridH / smogBandColors.length;
              var bandStartY =
                gridYOffset + band * bandHeight - 10 + Math.sin(bandPhase) * 8;

              ctx.fillStyle = smogBandColors[band];
              ctx.beginPath();
              ctx.moveTo(smogX - 30, bandStartY);
              for (var bx = smogX - 30; bx <= W + 20; bx += 16) {
                ctx.lineTo(
                  bx,
                  bandStartY + Math.sin(bx * 0.05 + bandPhase) * 10,
                );
              }
              ctx.lineTo(W + 20, bandStartY + bandHeight * 0.6 + 30);
              for (var bx2 = W + 20; bx2 >= smogX - 30; bx2 -= 16) {
                ctx.lineTo(
                  bx2,
                  bandStartY +
                    bandHeight * 0.6 +
                    30 +
                    Math.sin(bx2 * 0.05 + bandPhase + 1.4) * 10,
                );
              }
              ctx.closePath();
              ctx.fill();
            }

            // Drifting soot flecks — small dark ash specks sinking slowly
            // through the haze. Cheap: fixed count, no per-frame arrays,
            // positions are a pure function of time + index (no
            // allocations, matches the perf discipline used elsewhere).
            ctx.fillStyle = "rgba(28, 25, 21, 0.5)";
            var sootCount = 16;
            for (var si = 0; si < sootCount; si++) {
              var sootSpanX = W - smogX + 60;
              var sootX =
                smogX - 20 + ((si * 53 + frontWaveTime * 6) % sootSpanX);
              var sootY =
                gridYOffset -
                10 +
                ((si * 37 + frontWaveTime * 14) % (gridH + 20));
              var sootR = 1.4 + (si % 3) * 0.7;
              ctx.beginPath();
              ctx.arc(sootX, sootY, sootR, 0, Math.PI * 2);
              ctx.fill();
            }
            ctx.restore();

            // --- LAYER B: Fluffy Haze Front (grey-brown, not lavender) ---
            var waveTime = state.elapsed * 3.5;

            // We use a slightly wider vertical step to stack big, fluffy compound shapes
            for (var sy = gridYOffset - 15; sy <= H + 40; sy += 35) {
              // Calculate a dynamic, organic wobble for this cloud cluster
              var clusterX = smogX + Math.sin(sy * 0.04 + waveTime) * 14;
              var baseRadius = 42 + Math.cos(sy * 0.08 + waveTime) * 5;

              // 1. Draw the Main Central Puff
              ctx.fillStyle = "rgba(76, 71, 58, 0.93)";
              ctx.beginPath();
              ctx.arc(clusterX, sy, baseRadius, 0, Math.PI * 2);
              ctx.fill();

              // 2. Add an Overlapping Top-Right Secondary Puff (Creates the cartoon cloud cluster effect)
              ctx.beginPath();
              ctx.arc(
                clusterX + 15,
                sy - 15,
                baseRadius * 0.75,
                0,
                Math.PI * 2,
              );
              ctx.fill();

              // 3. Add an Overlapping Bottom-Left Puff to break up any straight lines
              ctx.beginPath();
              ctx.arc(clusterX - 12, sy + 12, baseRadius * 0.6, 0, Math.PI * 2);
              ctx.fill();

              // 4. Sickly khaki highlight — the "toxic" tint that visually
              // separates this from a plain grey rain cloud.
              ctx.fillStyle = "rgba(158, 148, 108, 0.4)";
              ctx.beginPath();
              ctx.arc(clusterX - 5, sy - 5, baseRadius * 0.8, 0, Math.PI * 2);
              ctx.fill();
            }

            // --- LAYER B.2: Hazard-Stripe Boundary ---
            // A thick black-and-amber marching dashed line traced along the
            // exact leading edge — the single most universally recognized
            // "danger / do-not-cross" visual there is, so kids read "this
            // line means stop" before they read a word of text. Drawn on
            // top of the puffs so it's never swallowed by the cloud art,
            // and colorblind-safe since the pattern (not just hue) carries
            // the meaning.
            ctx.save();
            ctx.lineCap = "round";
            ctx.lineJoin = "round";
            ctx.beginPath();
            ctx.moveTo(smogEdgeX(edgeTop), edgeTop);
            for (var hzY = 0; hzY <= edgeSteps; hzY++) {
              var hy = edgeTop + ((edgeBottom - edgeTop) * hzY) / edgeSteps;
              ctx.lineTo(smogEdgeX(hy), hy);
            }
            ctx.strokeStyle = "#241c30";
            ctx.lineWidth = 7;
            ctx.stroke();
            ctx.strokeStyle = "#ffb020";
            ctx.lineWidth = 7;
            ctx.setLineDash([13, 13]);
            ctx.lineDashOffset = -state.elapsed * 45;
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.restore();

            // --- LAYER B.3: Rising Soot Plume ---
            // A few dark tendrils drift up and fade off the top of the
            // haze — reads instantly as chimney/exhaust smoke rather than
            // weather, reinforcing "pollution" at a glance.
            ctx.save();
            for (var pl = 0; pl < 3; pl++) {
              var plumePhase = state.elapsed * 0.9 + pl * 2.3;
              var plumeBaseX = smogX + 10 + pl * 26 + Math.sin(plumePhase) * 10;
              var plumeTopY = gridYOffset - 55 - (pl % 2) * 15;
              var plumeGrad = ctx.createLinearGradient(
                plumeBaseX,
                gridYOffset,
                plumeBaseX,
                plumeTopY,
              );
              plumeGrad.addColorStop(0, "rgba(70, 65, 55, 0.45)");
              plumeGrad.addColorStop(1, "rgba(70, 65, 55, 0)");
              ctx.strokeStyle = plumeGrad;
              ctx.lineWidth = 10 - pl * 2;
              ctx.beginPath();
              ctx.moveTo(plumeBaseX, gridYOffset + 4);
              ctx.quadraticCurveTo(
                plumeBaseX + Math.sin(plumePhase * 1.6) * 18,
                (gridYOffset + plumeTopY) / 2,
                plumeBaseX + Math.sin(plumePhase * 2.1) * 10,
                plumeTopY,
              );
              ctx.stroke();
            }
            ctx.restore();

            // --- LAYER B.5: Cartoon Smog Face (big, focal, left-facing) ---
            // The face sits on its own contrasting "face-plate" disc (not
            // just floating on the puff texture) so it reads instantly as
            // the character, and it leans/gazes toward the left — the
            // direction the smog is actually creeping — for a strong
            // sense of forward motion and intent.
            var faceBobY = Math.sin(state.elapsed * 3.2) * 3; // idle bob, nothing sits still
            var faceCenterY = gridYOffset + gridH / 2 + faceBobY;
            var faceLead = Math.sin(faceCenterY * 0.04 + waveTime) * 14;
            // Pull the face out ahead of the body's center toward the left
            // (direction of travel) so it visibly leads the cloud.
            var faceCenterX = smogX + faceLead - 22;
            var faceHappy = !!GOGStage2.smogMoving;
            var faceR = 46;
            var lookDX = -9; // pupils/features shifted left = gazing the way it's moving

            ctx.save();
            ctx.translate(faceCenterX, faceCenterY);
            ctx.rotate(-0.09); // slight forward lean into the direction of travel
            ctx.lineCap = "round";
            ctx.lineJoin = "round";

            // Hard offset drop-shadow disc behind the face-plate (flat,
            // no blur, per the toy-brutalist shadow style used elsewhere).
            ctx.fillStyle = "#241c30";
            ctx.beginPath();
            // ctx.arc(6, 7, faceR, 0, Math.PI * 2);
            // ctx.fill();

            // Face-plate: a lighter, higher-contrast disc so the face
            // pops clear of the busy cloud texture behind it.
            ctx.fillStyle = faceHappy ? "#cbbf9a" : "#8a8067";
            ctx.strokeStyle = "#241c30";
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(0, 0, faceR, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            var eyeDX = 17,
              eyeY = -8;

            if (faceHappy) {
              // Happy: big round mischievous eyes gazing left, raised brows, wide grin
              [-1, 1].forEach(function (dir) {
                var ex = dir * eyeDX;
                // Eyebrow: raised and swept back (glee / gathering speed)
                ctx.strokeStyle = "#241c30";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(ex - 10, eyeY - 17);
                ctx.lineTo(ex + 9, eyeY - 21);
                ctx.stroke();

                // Eye white
                ctx.fillStyle = "#fdfaff";
                ctx.beginPath();
                ctx.arc(ex, eyeY, 11, 0, Math.PI * 2);
                ctx.fill();
                // Pupil shifted left = looking the way the smog moves
                ctx.fillStyle = "#241c30";
                ctx.beginPath();
                ctx.arc(ex + lookDX, eyeY, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "rgba(255,255,255,0.95)";
                ctx.beginPath();
                ctx.arc(ex + lookDX - 2, eyeY - 2, 2.2, 0, Math.PI * 2);
                ctx.fill();
              });

              // Big gleeful open grin
              ctx.fillStyle = "#241c30";
              ctx.beginPath();
              ctx.moveTo(-19, 16);
              ctx.quadraticCurveTo(-6, 32, 12, 20);
              ctx.quadraticCurveTo(20, 15, 15, 10);
              ctx.quadraticCurveTo(-4, 22, -19, 8);
              ctx.closePath();
              ctx.fill();
            } else {
              // Upset: heavy furrowed brows, narrowed worried eyes, deep frown
              [-1, 1].forEach(function (dir) {
                var ex = dir * eyeDX;
                // Furrowed brow angled sharply down toward the center
                ctx.strokeStyle = "#241c30";
                ctx.lineWidth = 2;
                ctx.beginPath();
                if (dir < 0) {
                  ctx.moveTo(ex - 12, eyeY - 12);
                  ctx.lineTo(ex + 9, eyeY - 3);
                } else {
                  ctx.moveTo(ex + 12, eyeY - 12);
                  ctx.lineTo(ex - 9, eyeY - 3);
                }
                ctx.stroke();

                // Narrowed eye white (squint)
                ctx.fillStyle = "#fdfaff";
                ctx.beginPath();
                ctx.ellipse(ex, eyeY + 3, 9, 6, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "#241c30";
                ctx.beginPath();
                ctx.arc(ex + lookDX * 0.7, eyeY + 3, 5, 0, Math.PI * 2);
                ctx.fill();
              });

              // Deep downturned frown
              ctx.strokeStyle = "#241c30";
              ctx.lineWidth = 6;
              ctx.beginPath();
              ctx.arc(-2, 34, 18, 1.12 * Math.PI, 1.88 * Math.PI);
              ctx.stroke();
            }

            ctx.restore();

            // --- LAYER C: High-Contrast Warning Label ---
            // Bold, dark-outlined text pinned just behind the hazard
            // stripe (not buried deep in the fog body) at full opacity,
            // so the stage's message — this is smog, and it's spreading —
            // is legible at a glance instead of the old 0.4-alpha text
            // that all but disappeared against the cloud art.
            ctx.save();
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            var labelX = Math.min(smogX + 74, W - 66);
            var labelY = gridYOffset + gridH * 0.32;

            ctx.lineJoin = "round";
            ctx.font = "800 24px 'Baloo 2', sans-serif";
            ctx.lineWidth = 5;
            ctx.strokeStyle = "#241c30";
            ctx.fillStyle = "#fdfaef";
            ctx.strokeText("⚠️ SMOG!", labelX, labelY);
            ctx.fillText("⚠️ SMOG!", labelX, labelY);

            ctx.font = "700 16px 'Quicksand', sans-serif";
            ctx.lineWidth = 4;
            ctx.strokeText("😷 dirty air — keep it out!", labelX, labelY + 27);
            ctx.fillText("😷 dirty air — keep it out!", labelX, labelY + 27);

            ctx.restore();
            ctx.restore();
          }

          if (GOGStage2.gameState === "STAGE_WON_CUTSCENE") {
            drawStageWonCutscene();
          }

          drawForegroundGrass(state.elapsed);
          particles.draw(ctx);
          drawWinWipe();
          ctx.restore();
        }
        /* ---------------- start ---------------- */
        var loop = new GOGEngine.GameLoop({
          update: update,
          draw: draw,
        });

        initBackground().finally(function () {
          audio.playBgm();
          loop.start();
          showIntro();
        });
      })();
    </script>
  </body>
</html>

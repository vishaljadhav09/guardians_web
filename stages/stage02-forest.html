<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Ravi & the Canopy Call - Guardians of Gaia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/styles.css" />
    <style>
      .stage-wrap {
        width: min(1180px, calc(100vw - 28px));
        max-width: 1180px;
        margin: 0 auto;
        padding: 12px 0 32px;
        animation: pageFadeIn 0.5s ease both;
      }

      .stage-hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .stage-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .stage-title h1 {
        font-size: 1.25rem;
      }

      .stage-title small {
        display: block;
        font-family: var(--gog-font-hand);
        font-size: 1rem;
        color: #4d5c37;
      }

      .hud-mid {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .meter {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--gog-white);
        border: 3px solid var(--gog-ink);
        border-radius: 999px;
        padding: 6px 14px 6px 10px;
        box-shadow: var(--gog-shadow-sm);
        min-width: 168px;
        position: relative;
      }

      .meter .label,
      .meter .meter-track {
        position: relative;
        z-index: 2;
      }

      .meter .label {
        font-size: 0.78rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .meter-track {
        flex: 1;
        height: 10px;
        border-radius: 999px;
        background: #dfe8cf;
        border: 2px solid var(--gog-ink);
        overflow: hidden;
      }

      .meter-fill {
        height: 100%;
        width: 42%;
        background: linear-gradient(90deg, #c9f23d, #2fbf71);
      }

      .timer-chip {
        font-weight: 700;
        min-width: 64px;
        text-align: center;
      }

      .canvas-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 10;
        overflow: hidden;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: crosshair;
      }

      .stage-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        gap: 10px;
        flex-wrap: wrap;
      }

      .calm-badge {
        font-size: 0.78rem;
        font-weight: 700;
        animation: fadeInUp 0.6s ease both;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        min-width: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--gog-white);
        border: 3px solid var(--gog-ink);
        border-radius: 50%;
        box-shadow: 3px 3px 0 var(--gog-ink);
        font-size: 1.15rem;
        line-height: 1;
        touch-action: manipulation;
      }

      @media (max-width: 700px) {
        .stage-wrap {
          width: calc(100vw - 12px);
          max-width: 100%;
          padding: 6px 0 18px;
        }

        .stage-hud {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 6px;
          margin-bottom: 8px;
        }

        .stage-title {
          gap: 6px;
          min-width: 0;
        }

        .stage-title .emoji-float {
          font-size: 1.35rem !important;
        }

        .stage-title h1 {
          font-size: 0.98rem;
          line-height: 1;
        }

        .stage-title small {
          display: none;
        }

        .hud-mid {
          display: grid;
          grid-template-columns: minmax(128px, 1fr) repeat(4, auto);
          gap: 5px;
          align-items: center;
          width: 100%;
        }

        .meter {
          min-width: 0;
          gap: 5px;
          padding: 4px 8px 4px 7px;
          border-width: 2px;
          box-shadow: 2px 2px 0 var(--gog-ink);
        }

        .meter .label {
          font-size: 0.66rem;
        }

        .meter-track {
          height: 8px;
          border-width: 2px;
        }

        .chip {
          padding: 4px 7px;
          border-width: 2px;
          box-shadow: 2px 2px 0 var(--gog-ink);
          font-size: 0.72rem;
          min-height: 30px;
        }

        .timer-chip {
          min-width: 44px;
        }

        .icon-btn {
          width: 32px;
          height: 32px;
          min-width: 32px;
          font-size: 0.92rem;
          border-width: 2px;
          box-shadow: 2px 2px 0 var(--gog-ink);
        }

        .guideBar {
          gap: 6px;
          padding: 3px 4px;
          margin-bottom: 8px;
          border-width: 2px;
          border-radius: 8px;
          box-shadow: 1px 1px 0 var(--gog-ink);
        }

        .guideAvatar {
          font-size: 1.25rem;
        }

        .guideBubble {
          padding: 5px 8px;
          border-width: 2px;
          border-radius: 10px;
          font-size: 1rem;
          line-height: 1.1;
        }

        .canvas-frame {
          border-width: 3px;
          border-radius: 12px;
          box-shadow: 4px 4px 0 var(--gog-ink);
        }

        .stage-controls {
          margin-top: 8px;
          gap: 6px;
        }

        .stage-controls .brutal-btn {
          padding: 8px 12px;
          min-height: 38px;
          border-width: 3px;
          border-radius: 10px;
          font-size: 0.86rem;
          box-shadow: 3px 3px 0 var(--gog-ink);
        }

        .calm-badge {
          font-size: 0.72rem;
        }
      }

      @media (max-width: 420px) {
        .hud-mid {
          grid-template-columns: minmax(118px, 1fr) repeat(3, auto);
        }

        #difficultyChip {
          display: none;
        }
      }

      @keyframes pageFadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .emoji-float {
        display: inline-block;
        animation: emojiFloat 2.6s ease-in-out infinite;
      }

      @keyframes emojiFloat {
        0%,
        100% {
          transform: translateY(0) rotate(-4deg);
        }
        50% {
          transform: translateY(-5px) rotate(5deg);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      body {
        position: relative;
      }

      .page-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at 50% -8%,
            #efffdd 0%,
            #d4f0bd 42%,
            #fdf6e6 100%
          ),
          linear-gradient(
            180deg,
            rgba(60, 135, 67, 0.1),
            rgba(36, 99, 55, 0.16)
          );
      }

      .page-bubble {
        position: absolute;
        bottom: -10vh;
        border-radius: 999px;
        background: radial-gradient(
          circle at 32% 28%,
          rgba(255, 255, 255, 0.95),
          rgba(201, 242, 61, 0.14) 70%
        );
        opacity: 0;
        animation: pageBubbleRise linear infinite;
      }

      @keyframes pageBubbleRise {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 0;
        }
        8% {
          opacity: 0.5;
        }
        90% {
          opacity: 0.35;
        }
        100% {
          transform: translateY(-125vh) translateX(var(--drift, 24px));
          opacity: 0;
        }
      }

      .page-fx {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .page-bubble {
          animation: none;
          opacity: 0;
        }
      }
    </style>

    <script >
/* ============================================================
   GUARDIANS OF GAIA — STAGE 2 CORE LOGIC & STATE MACHINE
   Build: Isolated, pure logic layer, testable in browser console.
   Controls grid state, growth timer, BFS connectivity, and waves.
   ============================================================ */

(function (global) {
  "use strict";

  // Reusable flat array for BFS exploration (Phase 8 Performance Pass)
  var bfsQueue = [];

  var GOGStage2 = {
    // State variables
    grid: [],
    saplings: 0,
    wave: 0,
    maxWaves: 3,
    smogPosition: 0,
    smogDelay: 0.0, // Prep phase delay before smog moves (Phase 7 Balance Pass)
    gameState: "INTRO", // INTRO, WAVE_ACTIVE, WAVE_CLEARED, STAGE_WON, STAGE_LOST
    timer: 0,
    rows: 6,
    cols: 10,
    growthTime: 3.0, // current growth time (sec)
    growthTimes: [2.5, 3.0, 3.5], // wave-specific growth time difficulty tuning (Phase 7)
    smogSpeed: [0.08, 0.14, 0.22], // smog speeds per wave (cols per second) (Phase 7)

    // Initialize state
    init: function (rows, cols) {
      this.rows = rows || 6;
      this.cols = cols || 10;
      this.grid = [];
      for (var r = 0; r < this.rows; r++) {
        var row = [];
        for (var c = 0; c < this.cols; c++) {
          row.push({
            state: "empty",      // 'empty', 'sapling', 'tree', 'rock'
            growTimer: 0,
            connected: false
          });
        }
        this.grid.push(row);
      }

      // Add rock obstacles for default 6x10 hillside layout
  // Add rock obstacles for default 6x10 hillside layout[cite: 2]
if (this.rows === 6 && this.cols === 10) {
  // Moved rows 1 and 2 down to rows 3, 4, and 5 to sit on the grass field layout
  var rockCoords = [[3, 1], [3, 7], [4, 3], [5, 5], [5, 8]];
  var self = this;
  rockCoords.forEach(function (coord) {
    var rr = coord[0], cc = coord[1];
    if (rr >= 0 && rr < self.rows && cc >= 0 && cc < self.cols) {
      self.grid[rr][cc].state = "rock";
    }
  });
}

      this.saplings = 6; // starts with some saplings
      this.wave = 1;
      this.smogPosition = this.cols; // Smog starts at the right edge
      this.smogDelay = 5.0; // 5 seconds of pre-smog planting delay
      this.growthTime = this.growthTimes[0]; // starts with wave 1 growth time
      this.gameState = "INTRO";
      this.timer = 75; // 75 seconds wave length
      this.computeConnectivity();
    },

    // Transition state
    transitionTo: function (newState) {
      var validStates = ["INTRO", "WAVE_ACTIVE", "WAVE_CLEARED", "STAGE_WON", "STAGE_LOST"];
      if (validStates.indexOf(newState) === -1) {
        console.error("[GOGStage2] Invalid game state transition to: " + newState);
        return;
      }
      console.log("[GOGStage2] State transition: " + this.gameState + " -> " + newState);
      this.gameState = newState;

      if (newState === "WAVE_ACTIVE") {
        this.smogPosition = this.cols;
        this.smogDelay = 5.0;
        this.growthTime = this.growthTimes[this.wave - 1] || 3.0;
      }
    },

    // Plant a tree
    plant: function (r, c) {
      if (this.gameState !== "WAVE_ACTIVE") {
        console.warn("[GOGStage2] Cannot plant when wave is not active.");
        return false;
      }
      if (r < 0 || r >= this.rows || c < 0 || c >= this.cols) return false;
      if (this.grid[r][c].state !== "empty") return false;
      
      // Smog cell lock: disable planting if cell is engulfed by smog (crossed column)
      if (c >= Math.floor(this.smogPosition)) {
        console.log("[GOGStage2] Cannot plant: cell engulfed by smog.");
        return false;
      }

      if (this.saplings <= 0) {
        console.log("[GOGStage2] Cannot plant: 0 saplings remaining.");
        return false;
      }

      this.saplings--;
      this.grid[r][c].state = "sapling";
      this.grid[r][c].growTimer = this.growthTime;
      return true;
    },

    // Advance growth of saplings
    advanceGrowth: function (dt) {
      var grownCells = [];
      for (var r = 0; r < this.rows; r++) {
        for (var c = 0; c < this.cols; c++) {
          var cell = this.grid[r][c];
          if (cell.state === "sapling") {
            cell.growTimer -= dt;
            if (cell.growTimer <= 0) {
              cell.state = "tree";
              cell.growTimer = 0;
              grownCells.push({ r: r, c: c });
            }
          }
        }
      }
      if (grownCells.length > 0) {
        this.computeConnectivity();
      }
      return grownCells;
    },

    // Compute connectivity of grown trees (4-directional BFS starting from column 0, Phase 8 GC-Free Pass)
    computeConnectivity: function () {
      // 1. Reset connectivity flag for all cells
      for (var r = 0; r < this.rows; r++) {
        for (var c = 0; c < this.cols; c++) {
          this.grid[r][c].connected = false;
        }
      }

      // 2. Clear pre-allocated queue and set head index pointer
      bfsQueue.length = 0;
      var queueHead = 0;

      // 3. Find root trees in column 0, push encoded coordinates
      for (var r = 0; r < this.rows; r++) {
        var cell = this.grid[r][0];
        if (cell.state === "tree") {
          cell.connected = true;
          bfsQueue.push(r * this.cols + 0); // Encoded as: row * cols + col
        }
      }

      // 4. Standard BFS exploration directions (Up, Down, Left, Right)
      var dr = [-1, 1, 0, 0];
      var dc = [0, 0, -1, 1];

      while (queueHead < bfsQueue.length) {
        var currEncoded = bfsQueue[queueHead++];
        var cr = Math.floor(currEncoded / this.cols);
        var cc = currEncoded % this.cols;

        for (var i = 0; i < 4; i++) {
          var nr = cr + dr[i];
          var nc = cc + dc[i];

          // Check grid boundaries
          if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
            var neighbor = this.grid[nr][nc];
            // Connected if neighbor is a grown tree and not visited yet
            if (neighbor.state === "tree" && !neighbor.connected) {
              neighbor.connected = true;
              bfsQueue.push(nr * this.cols + nc); // Push encoded integer
            }
          }
        }
      }
    },

    // Helper: Check if a column forms a complete vertical canopy barrier (all rows have connected trees or rock obstacles)
    isColumnBlocked: function (c) {
      if (c < 0 || c >= this.cols) return false;
      for (var r = 0; r < this.rows; r++) {
        var cell = this.grid[r][c];
        if ((cell.state !== "tree" || !cell.connected) && cell.state !== "rock") {
          return false;
        }
      }
      return true;
    },

    // Creeps smog forward. Gaps let it through, full columns of connected trees block it.
    advanceSmog: function (dt) {
      if (this.gameState !== "WAVE_ACTIVE") return;

      var speed = this.smogSpeed[this.wave - 1] || 0.15;
      var targetPos = this.smogPosition - speed * dt;

      // Check if we hit any blocked columns as we move left
      var currentCol = Math.floor(this.smogPosition);
      var targetCol = Math.floor(targetPos);

      // Check each column between current and target (exclusive of starting, down to target)
      for (var c = currentCol; c >= targetCol; c--) {
        if (this.isColumnBlocked(c)) {
          // Blocked! Smog stops just at the right side of this column
          this.smogPosition = c + 1;
          return;
        }
      }

      this.smogPosition = Math.max(0, targetPos);

      // If smog reaches the left edge (column 0), the forest is overrun
      if (this.smogPosition <= 0) {
        this.loseWave();
      }
    },

    // Handle winning the current wave
    winWave: function () {
      if (this.wave >= this.maxWaves) {
        this.transitionTo("STAGE_WON");
      } else {
        this.transitionTo("WAVE_CLEARED");
      }
    },

    // Handle losing the wave
    loseWave: function () {
      this.transitionTo("STAGE_LOST");
    },

    // Wave progress ticker
    tick: function (dt) {
      if (this.gameState !== "WAVE_ACTIVE") return [];

      this.timer -= dt;
      var grown = this.advanceGrowth(dt);

      // Pre-smog delay: smog is frozen during preparation time (Phase 7 Balance Pass)
      if (this.smogDelay > 0) {
        this.smogDelay = Math.max(0, this.smogDelay - dt);
      } else {
        this.advanceSmog(dt);
      }

      if (this.timer <= 0) {
        this.winWave();
      }
      return grown;
    },

    // ------------------------------------------------------------
    // CHECKPOINT UNIT TESTS
    // ------------------------------------------------------------
    runTests: function () {
      console.log("%c--- STARTING GOG STAGE 2 TESTS ---", "font-weight: bold; color: #2e5ee8;");
      var passCount = 0;
      var totalTests = 0;

      function assert(desc, val) {
        totalTests++;
        if (val) {
          console.log("✅ PASS: " + desc);
          passCount++;
        } else {
          console.error("❌ FAIL: " + desc);
        }
      }

      // Test 1: All-Connected Grid
      (function () {
        GOGStage2.init(3, 3);
        // Fill entire grid with grown trees
        for (var r = 0; r < 3; r++) {
          for (var c = 0; c < 3; c++) {
            GOGStage2.grid[r][c].state = "tree";
          }
        }
        GOGStage2.computeConnectivity();

        var allConnected = true;
        for (var r = 0; r < 3; r++) {
          for (var c = 0; c < 3; c++) {
            if (!GOGStage2.grid[r][c].connected) allConnected = false;
          }
        }
        assert("Test 1 - All-Connected Grid (All trees connected)", allConnected);
      })();

      // Test 2: Grid with One Gap (full column gap splits connectivity)
      (function () {
        GOGStage2.init(3, 3);
        // Col 0: grown trees
        GOGStage2.grid[0][0].state = "tree";
        GOGStage2.grid[1][0].state = "tree";
        GOGStage2.grid[2][0].state = "tree";

        // Col 1: Empty (the gap)
        GOGStage2.grid[0][1].state = "empty";
        GOGStage2.grid[1][1].state = "empty";
        GOGStage2.grid[2][1].state = "empty";

        // Col 2: grown trees
        GOGStage2.grid[0][2].state = "tree";
        GOGStage2.grid[1][2].state = "tree";
        GOGStage2.grid[2][2].state = "tree";

        GOGStage2.computeConnectivity();

        assert("Test 2 - One Gap: Col 0 trees are connected",
          GOGStage2.grid[0][0].connected && GOGStage2.grid[1][0].connected && GOGStage2.grid[2][0].connected
        );
        assert("Test 2 - One Gap: Col 2 trees are NOT connected due to full gap column",
          !GOGStage2.grid[0][2].connected && !GOGStage2.grid[1][2].connected && !GOGStage2.grid[2][2].connected
        );
      })();

      // Test 3: Diagonal-Only Touching Grid
      (function () {
        GOGStage2.init(3, 3);
        // Diagonal trees
        GOGStage2.grid[0][0].state = "tree";

           out of a sheet, scaled into a destination rect" every tick — that
           part is identical and is factored out as drawFrame() below.

           Where they differ is how the *frame to show* gets picked:
             - The dolphin sheet is a uniform grid (every cell 128x128 or
               256x256) and steps forward on a timer (fps), looping forever.
               -> advanceTimeLoop() + gridFrame()
             - The plant sheet is an irregular atlas (each growth stage is a
               different pixel width) and picks a frame from 0..1 grow
               progress, no looping. -> progressFrame()

           than two copy-pasted drawing blocks. Recommended home long-term is

        var GOGSpriteSheet = {
          // Draws one source frame {x,y,w,h} scaled to destW (aspect-ratio

          // edge on cy (good for ground-rooted sprites like plants);
          // anchor "center" (default) centers it on cy (good for the
          // free-swimming dolphin).
          drawFrame: function (ctx, img, frame, cx, cy, destW, anchor) {
            var destH = (frame.h / frame.w) * destW;
            var dx = cx - destW / 2;
            var dy = anchor === "bottom" ? cy - destH : cy - destH / 2;
            ctx.drawImage(
              img,
              frame.x,
              frame.y,
              frame.w,
              frame.h,

          advanceTimeLoop: function (anim, dt, fps, totalFrames, onLoop) {

              grown = GOGStage2.tick(dt);
            }

            // Connection snaps: Leaf / sparkle burst when tree grows
            // Connection snaps: Leaf / sparkle burst when tree grows
            var cellW = W / GOGStage2.cols;
            var gridH = H / 2;
            var cellH = gridH / GOGStage2.rows;
            grown.forEach(function (coord) {
              var cx = coord.c * cellW + cellW / 2;
              var cy = H / 2 + coord.r * cellH + cellH / 2; // Offset to bottom half
              particles.burst(cx, cy, {
                glyphs: ["🍃", "✨", "🟢"],
                count: 18,
                lift: 20,
              });
              audio.heal();
            });

            // Smog deflection curls: deflect grey smoke at blocked column boundary
            if (!calmMode && GOGStage2.smogPosition > 0) {
              var colIndex = Math.floor(GOGStage2.smogPosition - 0.05);
              if (GOGStage2.isColumnBlocked(colIndex)) {
                var bx = GOGStage2.smogPosition * cellW;
                if (Math.random() < 0.18) {
                  particles.burst(bx, Math.random() * H, {
                    glyphs: ["💨", "🌫️"],
                    count: 1,
                    lift: 12,
                    minSpeed: 45,
                    maxSpeed: 85,
                    angle: 0, // deflecting rightwards
                    spread: Math.PI / 4,
                    life: 500,
                  });
                }
              }
            }

            // Smog breach detection
            if (!calmMode) {
              var currSmogCol = Math.floor(GOGStage2.smogPosition);
              if (currSmogCol < state.lastSmogCol) {
                if (!GOGStage2.isColumnBlocked(currSmogCol)) {
                  state.screenShake = 12;
                  state.desaturateTime = 0.25;
                  audio.hazard();
                  GOGUi.say("The Smog broke through a column! 🌫️⚠️");
                }
                state.lastSmogCol = currSmogCol;
              }
            }
          }

          // Handle state machine changes
          if (GOGStage2.gameState === "WAVE_CLEARED") {
            endWaveCleared();
          } else if (GOGStage2.gameState === "STAGE_WON") {
            endWin();
          } else if (GOGStage2.gameState === "STAGE_LOST") {
            endLose();
          }

          // Update HUD
          var connectedCount = 0;
          var totalCells = GOGStage2.rows * GOGStage2.cols;
          for (var r = 0; r < GOGStage2.rows; r++) {
            for (var c = 0; c < GOGStage2.cols; c++) {
              if (
                GOGStage2.grid[r][c].state === "tree" &&
                GOGStage2.grid[r][c].connected
              ) {
                connectedCount++;
              }
            }
          }
          var canopyPercent = Math.round((connectedCount / totalCells) * 100);
          canopyFill.style.width = canopyPercent + "%";
          canopyPct.textContent = canopyPercent + "%";

          sproutsChip.textContent = GOGStage2.saplings;
          if (GOGStage2.smogDelay > 0 && !calmMode) {
            timerChip.textContent =
              "Prep: " + Math.ceil(GOGStage2.smogDelay) + "s";
            timerChip.style.backgroundColor = "var(--gog-sun)"; // yellow highlight
            timerChip.style.color = "var(--gog-ink)";
          } else {
            timerChip.textContent = calmMode
              ? "∞"
              : Math.ceil(GOGStage2.timer) + "s";
            timerChip.style.backgroundColor = "";
            timerChip.style.color = "";
          }
          difficultyChip.textContent = "⚡ Wave " + GOGStage2.wave;
        }

        /* ---------------- draw loop ---------------- */
        /* ---------------- draw loop ---------------- */
        function draw() {
          var shakeX = 0,
            shakeY = 0;
          if (state.screenShake > 0) {
            shakeX = (Math.random() - 0.5) * state.screenShake;
            shakeY = (Math.random() - 0.5) * state.screenShake;
          }

          ctx.save();
          ctx.translate(shakeX, shakeY);

          // Apply desaturation filter on breach events
          if (state.desaturateTime > 0) {
            ctx.filter = "grayscale(1) contrast(1.15)";
          }

          drawForestBackground(state.elapsed);

          // Grid dimension recalculations to bound interaction to the bottom half
          var cellW = W / GOGStage2.cols;
          var gridH = H / 2; // Height of the actionable zone
          var cellH = gridH / GOGStage2.rows; // Scale rows within the half-screen height
          var gridYOffset = H / 2; // Shift everything downwards past the sky

          // 1. Draw Grid Cells
          for (var r = 0; r < GOGStage2.rows; r++) {
            for (var c = 0; c < GOGStage2.cols; c++) {
              var cell = GOGStage2.grid[r][c];
              var x = c * cellW;
              var y = gridYOffset + r * cellH;

              // Grid cell box
              ctx.strokeStyle = "rgba(40, 60, 40, 0.15)";
              ctx.lineWidth = 2;
              ctx.strokeRect(x, y, cellW, cellH);

              // Empty soil tint
              if (cell.state === "empty") {
                ctx.fillStyle = "rgba(139, 115, 85, 0.05)";
                ctx.fillRect(x + 2, y + 2, cellW - 4, cellH - 4);
              }

              // Rock background tint
              if (cell.state === "rock") {
                // Draw rock image centered in the cell. use cx/cy (cell center)
                var cx = x + cellW / 2;
                var cy = y + cellH / 2;
                if (rockImg && rockImg.complete && rockImg.width > 0) {
                  var rockScale = Math.min((cellW - 12) / rockImg.width, (cellH - 12) / rockImg.height);
                  rockScale *= 2;
                  var destW = rockImg.width * rockScale;
                  var destH = rockImg.height * rockScale;
                  ctx.drawImage(
                    rockImg,
                    cx - destW / 2,
                    cy - destH / 2,
                    destW,
                    destH,
                  );
                } else {
                  ctx.save();
                  ctx.font = "24px Arial";
                  ctx.textAlign = "center";
                  ctx.textBaseline = "middle";
                  ctx.fillStyle = "#555"; // visible fallback if image missing
                  ctx.fillText("⛰️", cx, cy);
                  ctx.restore();
                }
              }

              // Connected tree backdrop highlight
              if (cell.state === "tree" && cell.connected) {
                ctx.fillStyle = "rgba(47, 191, 113, 0.12)";
                ctx.fillRect(x + 2, y + 2, cellW - 4, cellH - 4);
              }

              // Smog locking visualization
              if (!calmMode && c >= Math.floor(GOGStage2.smogPosition)) {
                ctx.fillStyle = "rgba(220, 50, 50, 0.08)";
                ctx.fillRect(x + 2, y + 2, cellW - 4, cellH - 4);
                ctx.strokeStyle = "rgba(220, 50, 50, 0.18)";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x + 8, y + 8);
                ctx.lineTo(x + cellW - 8, y + cellH - 8);
                ctx.stroke();
              }
            }
          }

          // 2. Draw Connectivity Vine Links
          ctx.strokeStyle = "rgba(47, 191, 113, 0.65)";
          ctx.lineWidth = 6;
          ctx.lineCap = "round";
          for (var r = 0; r < GOGStage2.rows; r++) {
            for (var c = 0; c < GOGStage2.cols; c++) {
              var cell = GOGStage2.grid[r][c];
              if (cell.state === "tree" && cell.connected) {
                var cx = c * cellW + cellW / 2;
                var cy = gridYOffset + r * cellH + cellH / 2;

                // draw link to right neighbor
                if (c + 1 < GOGStage2.cols) {
                  var right = GOGStage2.grid[r][c + 1];
                  if (right.state === "tree" && right.connected) {
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.lineTo((c + 1) * cellW + cellW / 2, cy);
                    ctx.stroke();
                  }
                }
                // draw link to down neighbor
                if (r + 1 < GOGStage2.rows) {
                  var down = GOGStage2.grid[r + 1][c];
                  if (down.state === "tree" && down.connected) {
                    ctx.beginPath();
                    ctx.moveTo(cx, cy);
                    ctx.lineTo(cx, gridYOffset + (r + 1) * cellH + cellH / 2);
                    ctx.stroke();
                  }
                }
              }
            }
          }

          // 3. Draw Sprites / Glyphs (Saplings, Rocks and Trees)
          for (var r = 0; r < GOGStage2.rows; r++) {
            for (var c = 0; c < GOGStage2.cols; c++) {
              var cell = GOGStage2.grid[r][c];
              var cx = c * cellW + cellW / 2;
              var cy = gridYOffset + r * cellH + cellH / 2;

              if (cell.state === "rock") {
                ctx.save();
                ctx.font = "30px Arial";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("⛰️", cx, cy - 4);
                ctx.restore();
              } else if (cell.state === "sapling") {
                // Growth progress arc
                var pct = 1 - cell.growTimer / GOGStage2.growthTime;
                ctx.strokeStyle = "rgba(47, 191, 113, 0.7)";
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(
                  cx,
                  cy + 12,
                  16,
                  -Math.PI / 2,
                  -Math.PI / 2 + pct * Math.PI * 2,
                );
                ctx.stroke();

                // Draw growing sprites dynamically from GrowingPlants1 sheet.
                // Frame is chosen by grow progress (pct), not by a timer —
                // see GOGSpriteSheet.progressFrame above.
                if (
                  growingPlantsImg &&
                  growingPlantsImg.complete &&
                  growingPlantsImg.width > 0
                ) {
                  var frame = GOGSpriteSheet.progressFrame(
                    GROWING_PLANT_FRAMES,
                    pct,
                  );

                  // Scale so the final (widest/tallest) growth stage just
                  // fits the cell; earlier stages scale down proportionally,
                  // which is what actually reads as "growing" rather than
                  // every stage stretching to fill the same box.
                  var lastFrame =
                    GROWING_PLANT_FRAMES[GROWING_PLANT_FRAMES.length - 1];
                  var plantScale = Math.min(
                    (cellW - 16) / lastFrame.w,
                    (cellH - 10) / lastFrame.h,
                  );
                  var destW = frame.w * plantScale;

                  // Anchor to the bottom of the cell so the plant grows
                  // upward out of the soil instead of from its center.
                  GOGSpriteSheet.drawFrame(
                    ctx,
                    growingPlantsImg,
                    frame,
                    cx,
                    cy + cellH / 2 - 6,
                    destW,
                    "bottom",
                  );
                } else {
                  ctx.save();
                  ctx.font = "26px Arial";
                  ctx.textAlign = "center";
                  ctx.textBaseline = "middle";
                  ctx.fillText("🌱", cx, cy);
                  ctx.restore();
                }
              } else if (cell.state === "tree") {
                // Fully grown tree is always visually present at this cell —
                // connected trees show the healthy sprite, disconnected ones
                // show a muted/desaturated version, but neither should ever
                // fade down to "basically invisible" the way the old 0.45-
                // alpha single leaf glyph did.
                var treeDestW = cellW * TREE_SIZE_SCALE;

                if (cell.connected) {
                  // Connected: Draw Ravi's healthy tree sprite with overlapping canopy
                  if (treeImg && treeImg.complete && treeImg.width > 0) {
                    var destH = (treeImg.height / treeImg.width) * treeDestW;
                    ctx.drawImage(
                      treeImg,
                      cx - treeDestW / 2,
                      cy - destH / 2 - 10,
                      treeDestW,
                      destH,
                    );
                  } else {
                    ctx.save();
                    ctx.font = "52px Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.fillText("🌳", cx, cy);
                    ctx.restore();
                  }
                } else {
                  // Disconnected: same tree shape, just muted — it should
                  // still clearly read as "a tree" (just not yet linked
                  // into the canopy chain), not as an empty cell.
                  if (
                    treeDisImg &&
                    treeDisImg.complete &&
                    treeDisImg.width > 0
                  ) {
                    var destH =
                      (treeDisImg.height / treeDisImg.width) * treeDestW;
                    ctx.drawImage(
                      treeDisImg,
                      cx - treeDestW / 2,
                      cy - destH / 2 - 10,
                      treeDestW,
                      destH,
                    );
                  } else {
                    ctx.save();
                    ctx.font = "52px Arial";
                    ctx.textAlign = "center";
                    ctx.textBaseline = "middle";
                    ctx.filter = "grayscale(0.8) brightness(0.85)";
                    ctx.globalAlpha = 0.9;
                    ctx.fillText("🌳", cx, cy);
                    ctx.restore();
                  }
                }
              }
            }
          }

          // 4. Draw Blossoms & Wildlife in Win/Cleared state (Phase 5 Juice)
          if (
            GOGStage2.gameState === "STAGE_WON" ||
            GOGStage2.gameState === "WAVE_CLEARED"
          ) {
            // Draw colorful blossoms on top of connected trees
            for (var r = 0; r < GOGStage2.rows; r++) {
              for (var c = 0; c < GOGStage2.cols; c++) {
                var cell = GOGStage2.grid[r][c];
                if (cell.state === "tree" && cell.connected) {
                  var cx = c * cellW + cellW / 2;
                  var cy = gridYOffset + r * cellH + cellH / 2;
                  ctx.save();
                  ctx.font = "16px Arial";
                  ctx.fillText("🌸", cx - 12, cy - 24);
                  if (c % 2 === 0) ctx.fillText("🌼", cx + 12, cy - 28);
                  ctx.restore();
                }
              }
            }

            // Draw birds and butterflies returning
            ctx.save();
            ctx.font = "24px Arial";
            var birdX = ((state.elapsed * 60) % (W + 200)) - 100;
            ctx.fillText("🐦", birdX, 50);
            ctx.fillText("🐦", birdX - 35, 75);
            ctx.fillText("🦋", birdX + 20, 110);
            ctx.restore();
          }

          // 5. Draw Rain Clouds and Falling Rain (Unchanged, flows in upper atmosphere)
          state.clouds.forEach(function (c) {
            if (!c.active) return;
            // Rain drops
            ctx.strokeStyle = "rgba(100, 180, 255, 0.4)";
            ctx.lineWidth = 2;
            var rainY = c.y + 14;
            for (var dx = -18; dx <= 18; dx += 9) {
              ctx.beginPath();
              ctx.moveTo(c.x + dx, rainY);
              ctx.lineTo(c.x + dx - 2, rainY + 20);
              ctx.stroke();
            }

            // Vector outlined cloud
            ctx.fillStyle = "#ffffff";
            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(c.x - 20, c.y + 8);
            ctx.bezierCurveTo(
              c.x - 38,
              c.y + 8,
              c.x - 38,
              c.y - 12,
              c.x - 20,
              c.y - 12,
            );
            ctx.bezierCurveTo(
              c.x - 20,
              c.y - 30,
              c.x + 20,
              c.y - 30,
              c.x + 20,
              c.y - 12,
            );
            ctx.bezierCurveTo(
              c.x + 38,
              c.y - 12,
              c.x + 38,
              c.y + 8,
              c.x + 20,
              c.y + 8,
            );
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          });

          // 6. Draw creeping Smog (Restricted to bottom half grid zone)
          // 6. Draw creeping Smog (Super Cartoonish & Child-Friendly Rolling Storm Cloud)
          // 6. Draw creeping Smog (Soft cartoon cloud wall theme for children)
          if (!calmMode && GOGStage2.smogPosition < GOGStage2.cols) {
            var smogX = GOGStage2.smogPosition * cellW;

            ctx.save();

            // --- LAYER A: Soft Pastel Fog Body ---
            ctx.fillStyle = "rgba(125, 110, 145, 0.75)";
            ctx.fillRect(smogX, gridYOffset, W - smogX, gridH);

            // --- LAYER B: Fluffy Cartoon Cloud Front (No more single circles!) ---
            var waveTime = state.elapsed * 3.5;

            // We use a slightly wider vertical step to stack big, fluffy compound shapes
            for (var sy = gridYOffset - 15; sy <= H + 40; sy += 35) {
              // Calculate a dynamic, organic wobble for this cloud cluster
              var clusterX = smogX + Math.sin(sy * 0.04 + waveTime) * 14;
              var baseRadius = 42 + Math.cos(sy * 0.08 + waveTime) * 5;

              // 1. Draw the Main Central Puff
              ctx.fillStyle = "rgba(110, 95, 130, 0.92)";
              ctx.beginPath();
              ctx.arc(clusterX, sy, baseRadius, 0, Math.PI * 2);
              ctx.fill();

              // 2. Add an Overlapping Top-Right Secondary Puff (Creates the cartoon cloud cluster effect)
              ctx.beginPath();
              ctx.arc(
                clusterX + 15,
                sy - 15,
                baseRadius * 0.75,
                0,
                Math.PI * 2,
              );
              ctx.fill();

              // 3. Add an Overlapping Bottom-Left Puff to break up any straight lines
              ctx.beginPath();
              ctx.arc(clusterX - 12, sy + 12, baseRadius * 0.6, 0, Math.PI * 2);
              ctx.fill();

              // 4. Add a Soft Pastel Highlight layer to give the clusters a friendly, rounded 3D depth
              ctx.fillStyle = "rgba(150, 135, 170, 0.4)";
              ctx.beginPath();
              ctx.arc(clusterX - 5, sy - 5, baseRadius * 0.8, 0, Math.PI * 2);
              ctx.fill();
            }

            // --- LAYER C: Child-Friendly Visual Labels ---
            ctx.save();
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            var textCenterX = smogX + (W - smogX) / 2;

            // Soft warning text labels inside the body
            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            ctx.font = "bold 22px sans-serif";
            ctx.fillText("⚠️ OH NO!", textCenterX, gridYOffset + gridH * 0.4);
            ctx.fillText("💨 COUGH!", textCenterX, gridYOffset + gridH * 0.7);

            ctx.restore();
            ctx.restore();
          }

          particles.draw(ctx);
          ctx.restore();
        }
        /* ---------------- start ---------------- */
        var loop = new GOGEngine.GameLoop({
          update: update,
          draw: draw,
        });

        initBackground().finally(function () {
          loop.start();
          showIntro();
        });
      })();
    </script>
  </body>

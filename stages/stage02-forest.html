    <style>
      /* Page shell (HUD, title, meters, chips, buttons, canvas-frame base, the
         <=1200px compact HUD) lives in src/styles.css — only stage colours are
         styled here. */
      .stage-title small {
        color: #4d5c37;
      }

      .meter-track {
        background: #dfe8cf;
      }

      .meter-fill {
        height: 100%;
        width: 42%;
        background: linear-gradient(90deg, #c9f23d, #2fbf71);
      }

      body {
        position: relative;
      }

      .page-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at 50% -8%,
            #efffdd 0%,
            #d4f0bd 42%,
            #fdf6e6 100%
          ),
          linear-gradient(
            180deg,
            rgba(60, 135, 67, 0.1),
            rgba(36, 99, 55, 0.16)
          );
      }

      .page-bubble {
        position: absolute;
        bottom: -10vh;
        border-radius: 999px;
        background: radial-gradient(
          circle at 32% 28%,
          rgba(255, 255, 255, 0.95),
          rgba(201, 242, 61, 0.14) 70%
        );
        opacity: 0;
        animation: pageBubbleRise linear infinite;
      }

      @keyframes pageBubbleRise {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 0;
        }
        8% {
          opacity: 0.5;
        }
        90% {
          opacity: 0.35;
        }
        100% {
          transform: translateY(-125vh) translateX(var(--drift, 24px));
          opacity: 0;
        }
      }

      .page-fx {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .page-bubble {
          animation: none;
          opacity: 0;
        }
      }
    </style>

    <script>
      /* ============================================================
   GUARDIANS OF GAIA — STAGE 2 CORE LOGIC & STATE MACHINE
   Build: Isolated, pure logic layer, testable in browser console.
   Controls grid state, growth timer, BFS connectivity, and waves.
   ============================================================ */

      (function (global) {
        "use strict";

        // Reusable flat array for BFS exploration (Phase 8 Performance Pass)
        var bfsQueue = [];

        var GOGStage2 = {
          // State variables
          grid: [],
          saplings: 0,
          wave: 0,
          maxWaves: 3,
          smogPosition: 0,
          smogDelay: 0.0, // Prep phase delay before smog moves (Phase 7 Balance Pass)
          smogMoving: false, // true = smog creeping forward (happy face), false = blocked/paused (upset face)
          gameState: "INTRO", // INTRO, WAVE_ACTIVE, WAVE_CLEARED, STAGE_WON, STAGE_LOST
          failureReason: "",
          timer: 0,
          rows: 4,
          cols: 10,
          growthTime: 1.2, // current growth time (sec)
          growthTimes: [1.2, 1.4, 1.7], // wave-specific growth time difficulty tuning (Phase 7)
          smogSpeed: [0.18, 0.25, 0.35], // smog speeds per wave (cols per second)
          canopyTargets: [25, 45, 60], // Target canopy percentages to win each wave (kid-friendly)
          difficulty: {
            enemySpeedMul: function () {
              return 1;
            },
            goalMul: function () {
              return 1;
            },
          },

          setDifficulty: function (difficulty) {
            this.difficulty = difficulty || this.difficulty;
          },

          getCanopyPercent: function () {
            var connectedCount = 0;
            var totalCells = this.rows * this.cols;
            for (var r = 0; r < this.rows; r++) {
              for (var c = 0; c < this.cols; c++) {
                if (
                  this.grid[r][c] &&
                  this.grid[r][c].state === "tree" &&
                  this.grid[r][c].connected
                ) {
                  connectedCount++;
                }
              }
            }
            return Math.round((connectedCount / totalCells) * 100);
          },

          getCanopyTarget: function () {
            return this.canopyTargets[this.wave - 1] || 50;
          },

          // Initialize state
          init: function (rows, cols) {
            this.rows = rows || 4;
            this.cols = cols || 10;
            this.grid = [];
            for (var r = 0; r < this.rows; r++) {
              var row = [];
              for (var c = 0; c < this.cols; c++) {
                row.push({
                  state: "empty", // 'empty', 'sapling', 'tree', 'rock'
                  growTimer: 0,
                  connected: false,
                  variation: Math.floor(Math.random() * 5),
                  growPopTimer: 0
                });
              }
              this.grid.push(row);
            }

            // Add rock obstacles for default layouts
            if (this.cols === 6 && this.rows === 6) {
              // Phone-portrait layout (see startWave): same ~12% rock density
              [[1, 1], [2, 4], [3, 2], [4, 5], [5, 3]].forEach(function (coord) {
                this.grid[coord[0]][coord[1]].state = "rock";
              }, this);
            }
            if (this.cols === 10) {
              var rockCoords = [];
              if (this.rows === 4) {
                // Shifted coordinates for the 4-row layout (removing first 2 rows)
                rockCoords = [
                  [1, 1],
                  [1, 7],
                  [2, 3],
                  [3, 5],
                  [3, 8],
                ];
              } else if (this.rows === 6) {
                rockCoords = [
                  [0,1],
                  [0,2],
                  [0,3],
                  [0,4],
                  [0,7],
                  [0,8],
                  [3, 1],
                  [3, 7],
                  [4, 3],
                  [5, 5],
                  [5, 8],
                ];
              }
              var self = this;
              rockCoords.forEach(function (coord) {
                var rr = coord[0],
                  cc = coord[1];
                if (rr >= 0 && rr < self.rows && cc >= 0 && cc < self.cols) {
                  self.grid[rr][cc].state = "rock";
                }
              });
            }

            this.saplings = 12; // starts with 12 saplings (Requirement 3)
            this.wave = 1;
            this.smogPosition = this.cols; // Smog starts at the right edge
            this.smogDelay = 1.0; // short pre-smog planting delay
            this.smogMoving = false; // Starts frozen during prep delay -> upset face
            this.growthTime = this.growthTimes[0]; // starts with wave 1 growth time
            this.gameState = "INTRO";
            this.failureReason = "";
            this.timer = GOGConstants.STAGE2.gameTime; // 60 seconds from constants
            this.computeConnectivity();
          },

          // Transition state
          transitionTo: function (newState) {
            var validStates = [
              "INTRO",
              "WAVE_ACTIVE",
              "WAVE_CLEARED",
              "STAGE_WON_CUTSCENE",
              "STAGE_WON",
              "STAGE_LOST",
            ];
            if (validStates.indexOf(newState) === -1) {
              console.error(
                "[GOGStage2] Invalid game state transition to: " + newState,
              );
              return;
            }
            this.gameState = newState;

            if (newState === "WAVE_ACTIVE") {
              this.failureReason = "";
              this.smogDelay = 1.0;
              this.growthTime = this.growthTimes[this.wave - 1] || 1.5;
            }
          },

          // Plant a tree
          plant: function (r, c) {
            if (this.gameState !== "WAVE_ACTIVE") {
              console.warn("[GOGStage2] Cannot plant when wave is not active.");
              return false;
            }
            if (r < 0 || r >= this.rows || c < 0 || c >= this.cols)
              return false;
            if (this.grid[r][c].state !== "empty") return false;

            // Smog cell lock: disable planting if cell is engulfed by smog (crossed column)
            if (c >= Math.floor(this.smogPosition)) {
              return false;
            }

            if (this.saplings <= 0) {
              return false;
            }

            this.saplings--;
            this.grid[r][c].state = "sapling";
            this.grid[r][c].growTimer = this.growthTime;

            // NEW: "Grove bonus" — a sapling planted within 2 grid cells of
            // existing growth (tree or sapling) grows 25% faster, rewarding
            // clustered planting over scattering saplings thinly.
            var hasNearbyGrowth = false;
            for (var gr = r - 2; gr <= r + 2 && !hasNearbyGrowth; gr++) {
              for (var gc = c - 2; gc <= c + 2; gc++) {
                if (gr === r && gc === c) continue;
                if (gr < 0 || gr >= this.rows || gc < 0 || gc >= this.cols) continue;
                var neighborState = this.grid[gr][gc].state;
                if (neighborState === "tree" || neighborState === "sapling") {
                  hasNearbyGrowth = true;
                  break;
                }
              }
            }
            this.grid[r][c].groveBonus = hasNearbyGrowth;
            this.grid[r][c].growthSpeedMul = hasNearbyGrowth ? 1.25 : 1.0;
            return true;
          },

          // Advance growth of saplings
          advanceGrowth: function (dt) {
            var grownCells = [];
            for (var r = 0; r < this.rows; r++) {
              for (var c = 0; c < this.cols; c++) {
                var cell = this.grid[r][c];
                if (cell.growPopTimer > 0) {
                  cell.growPopTimer = Math.max(0, cell.growPopTimer - dt);
                }
                if (cell.state === "sapling") {
                  cell.growTimer -= dt * (cell.growthSpeedMul || 1.0);
                  if (cell.growTimer <= 0) {
                    cell.state = "tree";
                    cell.growTimer = 0;
                    cell.growPopTimer = 0.5; // initialize pop animation
                    grownCells.push({ r: r, c: c });
                  }
                }
              }
            }
            if (grownCells.length > 0) {
              this.computeConnectivity();
            }
            return grownCells;
          },

          // Compute connectivity of grown trees (4-directional BFS starting from column 0, Phase 8 GC-Free Pass)
          computeConnectivity: function () {
            // 1. Reset connectivity flag for all cells
            for (var r = 0; r < this.rows; r++) {
              for (var c = 0; c < this.cols; c++) {
                this.grid[r][c].connected = false;
              }
            }

            // 2. Clear pre-allocated queue and set head index pointer
            bfsQueue.length = 0;
            var queueHead = 0;

            // 3. Find root trees in column 0, push encoded coordinates
            for (var r = 0; r < this.rows; r++) {
              var cell = this.grid[r][0];
              if (cell.state === "tree") {
                cell.connected = true;
                bfsQueue.push(r * this.cols + 0); // Encoded as: row * cols + col
              }
            }

            // 4. Standard BFS exploration directions (Up, Down, Left, Right)
            var dr = [-1, 1, 0, 0];
            var dc = [0, 0, -1, 1];

            while (queueHead < bfsQueue.length) {
              var currEncoded = bfsQueue[queueHead++];
              var cr = Math.floor(currEncoded / this.cols);
              var cc = currEncoded % this.cols;

              for (var i = 0; i < 4; i++) {
                var nr = cr + dr[i];
                var nc = cc + dc[i];

                // Check grid boundaries
                if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
                  var neighbor = this.grid[nr][nc];
                  // Connected if neighbor is a grown tree and not visited yet
                  if (neighbor.state === "tree" && !neighbor.connected) {
                    neighbor.connected = true;
                    bfsQueue.push(nr * this.cols + nc); // Push encoded integer
                  }
                }
              }
            }
          },

          // Helper: Check if a column forms a complete vertical canopy barrier (all rows have connected trees or rock obstacles)
          isColumnBlocked: function (c) {
            if (c < 0 || c >= this.cols) return false;
            for (var r = 0; r < this.rows; r++) {
              var cell = this.grid[r][c];
              if (
                (cell.state !== "tree" || !cell.connected) &&
                cell.state !== "rock"
              ) {
                return false;
              }
            }
            return true;
          },

          // Creeps smog forward. Gaps let it through, full columns of connected trees block it.
          advanceSmog: function (dt) {
            if (this.gameState !== "WAVE_ACTIVE") return;

            var speed =
              (this.smogSpeed[this.wave - 1] || 0.15) *
              this.difficulty.enemySpeedMul();
            var targetPos = this.smogPosition - speed * dt;

            // Check if we hit any blocked columns as we move left
            var currentCol = Math.floor(this.smogPosition);
            var targetCol = Math.floor(targetPos);

            // Check each column between current and target (exclusive of starting, down to target)
            for (var c = currentCol; c >= targetCol; c--) {
              if (this.isColumnBlocked(c)) {
                // Blocked! Smog stops just at the right side of this column
                this.smogPosition = c + 1;
                this.smogMoving = false; // Blocked -> upset face
                return;
              }
            }

            this.smogMoving = speed * dt > 0.0001; // Actively creeping -> happy face
            this.smogPosition = Math.max(0, targetPos);

            // If smog reaches the left edge (column 0), the forest is overrun
            if (this.smogPosition < 1.0 && state.elapsed < 15 && !diff.softClutched) {
              diff.softClutch();
            }
            if (this.smogPosition <= 0) {
              this.loseWave("SMOG_REACHED_RAVI");
            }
          },

          // Handle winning the current wave
          winWave: function () {
            if (this.wave >= this.maxWaves) {
              this.transitionTo("STAGE_WON_CUTSCENE");
            } else {
              this.transitionTo("WAVE_CLEARED");
            }
          },

          // Handle losing the wave
          loseWave: function (reason) {
            this.failureReason = reason || "UNKNOWN";
            this.transitionTo("STAGE_LOST");
          },

          // Wave progress ticker
          tick: function (dt) {
            if (this.gameState !== "WAVE_ACTIVE") return [];

            this.timer -= dt;
            var grown = this.advanceGrowth(dt);

            // Pre-smog delay: smog is frozen during preparation time (Phase 7 Balance Pass)
            if (this.smogDelay > 0) {
              this.smogDelay = Math.max(0, this.smogDelay - dt);
              this.smogMoving = false; // Frozen during prep -> upset face
            } else {
              this.advanceSmog(dt);
            }

            if (this.gameState !== "WAVE_ACTIVE") return grown;

            var currentPct = this.getCanopyPercent();
            var targetPct = this.getCanopyTarget() * this.difficulty.goalMul();
            if (currentPct >= targetPct) {
              this.winWave();
            } else if (this.timer <= 0) {
              this.loseWave("CANOPY_TARGET_MISSED");
            }
             return grown;
           },

          // ------------------------------------------------------------
          // CHECKPOINT UNIT TESTS
          // ------------------------------------------------------------
          runTests: function () {
            console.log(
              "%c--- STARTING GOG STAGE 2 TESTS ---",
              "font-weight: bold; color: #2e5ee8;",
            );
            var passCount = 0;
            var totalTests = 0;

            function assert(desc, val) {
              totalTests++;
              if (val) {
                console.log("✅ PASS: " + desc);
                passCount++;
              } else {
                console.error("❌ FAIL: " + desc);
              }
            }

            // Test 1: All-Connected Grid
            (function () {
              GOGStage2.init(3, 3);
              // Fill entire grid with grown trees
              for (var r = 0; r < 3; r++) {
                for (var c = 0; c < 3; c++) {
                  GOGStage2.grid[r][c].state = "tree";
                }
              }
              GOGStage2.computeConnectivity();

              var allConnected = true;
              for (var r = 0; r < 3; r++) {
                for (var c = 0; c < 3; c++) {
                  if (!GOGStage2.grid[r][c].connected) allConnected = false;
                }
              }
              assert(
                "Test 1 - All-Connected Grid (All trees connected)",
                allConnected,
              );
            })();

            // Test 2: Grid with One Gap (full column gap splits connectivity)
            (function () {
              GOGStage2.init(3, 3);
              // Col 0: grown trees
              GOGStage2.grid[0][0].state = "tree";
              GOGStage2.grid[1][0].state = "tree";
              GOGStage2.grid[2][0].state = "tree";

              // Col 1: Empty (the gap)
              GOGStage2.grid[0][1].state = "empty";
              GOGStage2.grid[1][1].state = "empty";
              GOGStage2.grid[2][1].state = "empty";

              // Col 2: grown trees
              GOGStage2.grid[0][2].state = "tree";
              GOGStage2.grid[1][2].state = "tree";
              GOGStage2.grid[2][2].state = "tree";

              GOGStage2.computeConnectivity();

              assert(
                "Test 2 - One Gap: Col 0 trees are connected",
                GOGStage2.grid[0][0].connected &&
                  GOGStage2.grid[1][0].connected &&
                  GOGStage2.grid[2][0].connected,
              );
              assert(
                "Test 2 - One Gap: Col 2 trees are NOT connected due to full gap column",
                !GOGStage2.grid[0][2].connected &&
                  !GOGStage2.grid[1][2].connected &&
                  !GOGStage2.grid[2][2].connected,
              );
            })();

            // Test 3: Diagonal-Only Touching Grid
            (function () {
              GOGStage2.init(3, 3);
              // Diagonal trees
              GOGStage2.grid[0][0].state = "tree";
              GOGStage2.grid[1][1].state = "tree";
              GOGStage2.grid[2][2].state = "tree";

              GOGStage2.computeConnectivity();

              assert(
                "Test 3 - Diagonal: Root (0,0) is connected",
                GOGStage2.grid[0][0].connected,
              );
              assert(
                "Test 3 - Diagonal: (1,1) is NOT connected 4-directionally",
                !GOGStage2.grid[1][1].connected,
              );
              assert(
                "Test 3 - Diagonal: (2,2) is NOT connected 4-directionally",
                !GOGStage2.grid[2][2].connected,
              );
            })();

            // Test 4: Empty Grid / 0 Saplings
            (function () {
              GOGStage2.init(3, 3);
              GOGStage2.saplings = 0;
              GOGStage2.transitionTo("WAVE_ACTIVE");

              // Try to plant with 0 saplings
              var plantResult = GOGStage2.plant(0, 0);
              assert(
                "Test 4 - 0 Saplings: Planting fails",
                plantResult === false,
              );
              assert(
                "Test 4 - 0 Saplings: Grid cell remains empty",
                GOGStage2.grid[0][0].state === "empty",
              );

              GOGStage2.computeConnectivity();
              var noneConnected = true;
              for (var r = 0; r < 3; r++) {
                for (var c = 0; c < 3; c++) {
                  if (GOGStage2.grid[r][c].connected) noneConnected = false;
                }
              }
              assert(
                "Test 4 - Empty Grid: No cells are connected",
                noneConnected,
              );
            })();

            // Test 5: Smog Propagation & Column Blocking
            (function () {
              GOGStage2.init(3, 3);
              // Create a complete vertical canopy block at column 1
              GOGStage2.grid[0][0].state = "tree";
              GOGStage2.grid[1][0].state = "tree";
              GOGStage2.grid[2][0].state = "tree";

              GOGStage2.grid[0][1].state = "tree";
              GOGStage2.grid[1][1].state = "tree";
              GOGStage2.grid[2][1].state = "tree";

              GOGStage2.computeConnectivity();

              assert(
                "Test 5 - Canopy Block: Col 1 is blocked",
                GOGStage2.isColumnBlocked(1),
              );
              assert(
                "Test 5 - Canopy Block: Col 2 is NOT blocked",
                !GOGStage2.isColumnBlocked(2),
              );

              // Start wave active, smog position at col 3 (right edge)

          else if (variation === 4) f = "brightness(1.08) saturate(1.05)";

        function loadImage(src) {
          return new Promise(function (resolve, reject) {
            var img = new Image();
            img.onload = function () {
              // decode now, so the first draw that uses it never stalls
              if (typeof img.decode === "function") {
                img.decode().then(
                  function () { resolve(img); },
                  function () { resolve(img); },
                );
              } else {
                resolve(img);
              }
            };
            img.onerror = function () {
              reject(new Error("Failed to load image: " + src));
            };
            img.src = src;
          });
        }

        async function initBackground() {
          // Pixi needs WebGL: GOGRender.create() rejects (and explains it on screen) when it is missing.
          try {
            R = await GOGRender.create(canvas, W, H);
          } catch (e) {
            if (!(e && e.message === "webgl-unavailable")) console.error("Renderer setup failed:", e);
            return false;
          }
          // Every image loads in parallel and independently of the others, so a
          // single missing asset never stops the rest from appearing.
          function sprite(src, assign, what) {
            return loadImage(src).then(assign, function (e) {
              console.warn("[sprites] " + what + " failed to load (a fallback will be used):", e);
            });
          }
          await Promise.all([
            sprite("assets/sprites/stage02/canopy.png", function (img) { treeImg = img; }, "Canopy"),
            sprite("assets/sprites/stage02/branches.png", function (img) { treeDisImg = img; }, "Branches"),
            sprite("assets/sprites/stage02/GrowingPlants1.png", function (img) { growingPlantsImg = img; }, "GrowingPlants1"),
            sprite("assets/sprites/stage02/rock.png", function (img) { rockImg = img; }, "Rock"),
            sprite("assets/sprites/stage02/Deer-Spritesheet.png", function (img) { deerImg = img; }, "Deer"),
            sprite("assets/sprites/stage02/Giraffe-Spritesheet.png", function (img) { giraffeImg = img; }, "Giraffe"),
            sprite("assets/sprites/stage02/Tiger-Spritesheet.png", function (img) { tigerImg = img; }, "Tiger"),
            sprite("assets/sprites/stage05/flying-birds.png", function (img) { flyingBirdsImg = img; }, "flying-birds"),
            sprite("assets/sprites/stage03/Deer_Run_with_shadow.png", function (img) { deerRunImg = img; }, "Deer_Run_with_shadow"),
            sprite("assets/sprites/stage03/bees-flying.png", function (img) { beesFlyingImg = img; }, "bees-flying"),
          ]);
          try {
            buildScene();
          } catch (e) {
            console.error("Stage setup failed:", e);
            return false;
          }
          return true;
        }



        /* ---------------- ambient canopy wildlife ---------------- */
        // Only one animal is "in play" at a time — whichever one matches
        // the current wave (1=deer, 2=giraffe, 3=tiger) — and it's only
        // ever placed and moved within the horizontal span of columns
        // that currently have connected, grown trees. No connected trees
        // yet ⇒ no animal on screen.
        // One scan per step (refreshCanopy) shared by the HUD, wildlife,
        // ambient creatures and the draw code; the bounds object is reused.
        var canopyB = { minCol: 0, maxCol: 0, minRow: 0, maxRow: 0 };
        var canopyHas = false;
        var canopyCount = 0;
        function refreshCanopy() {
          var minCol = -1;
          var maxCol = -1;
          var minRow = -1;
          var maxRow = -1;
          var count = 0;
          var grid = GOGStage2.grid;
          for (var r = 0; r < GOGStage2.rows; r++) {
            var row = grid[r];
            for (var c = 0; c < GOGStage2.cols; c++) {
              var cell = row[c];
              if (cell.state === "tree" && cell.connected) {
                count++;
                if (minCol === -1 || c < minCol) minCol = c;
                if (maxCol === -1 || c > maxCol) maxCol = c;
                if (minRow === -1 || r < minRow) minRow = r;
                if (maxRow === -1 || r > maxRow) maxRow = r;
              }
            }
          }
          canopyCount = count;
          canopyHas = count > 0;
          canopyB.minCol = minCol;
          canopyB.maxCol = maxCol;
          canopyB.minRow = minRow;
          canopyB.maxRow = maxRow;
        }
        function getConnectedCanopyBounds() {
          return canopyHas ? canopyB : null;
        }

        function updateWildlife(dt) {
          var waveIdx =
            Math.min(Math.max(GOGStage2.wave, 1), WILDLIFE_DEFS.length) - 1;

          var bounds = getConnectedCanopyBounds();
          if (!bounds) {
            state.wildlife.forEach(function (w) {
              w.visible = false;
              w.placed = false;
            });
            return;
          }

          if (state.wildlifeCount === 0) {
            state.wildlifeCount = 2 + Math.floor(Math.random() * 2);
          }

          while (state.wildlife.length < state.wildlifeCount) {
            state.wildlife.push({
              defIndex: waveIdx,
              visible: false,
              placed: false,
              revealed: false,
              x: 0,
              y: 0,
              dir: Math.random() < 0.5 ? 1 : -1,
              vPhase: Math.random() * Math.PI * 2,
              row: 0,
              targetRow: 0,
              rowMoveTimer: 1 + Math.random() * 3,
              anim: { frameIndex: 0, elapsedFrameTime: 0 },
              opacity: 0,
              state: "WALKING",
              stateTimer: 2 + Math.random() * 3
            });
          }

          var cellW = W / GOGStage2.cols;
          var gridH = GRID_H;
          var cellH = gridH / GOGStage2.rows;
          var gridYOffset = GRID_Y_OFFSET;

          var def = WILDLIFE_DEFS[waveIdx];

          for (var idx = 0; idx < state.wildlife.length; idx++) {
            var w = state.wildlife[idx];
            if (w.defIndex !== waveIdx) {
              w.defIndex = waveIdx;
              w.revealed = false;
              w.placed = false;
              w.dir = Math.random() < 0.5 ? 1 : -1;
              w.anim.frameIndex = 0;
              w.anim.elapsedFrameTime = 0;
              w.opacity = 0;
              w.state = "WALKING";
              w.stateTimer = 2 + Math.random() * 3;
            }

            var defLocal = WILDLIFE_DEFS[w.defIndex];

            var destW = cellW * defLocal.widthScale;
            var margin = destW * 0.5 + 8;
            var rangeMinX = bounds.minCol * cellW + margin;
            
            // Limit right boundary to smog position (run away!)
            var smogLimitX = GOGStage2.smogPosition * cellW - margin;
            var rangeMaxX = Math.min((bounds.maxCol + 1) * cellW - margin, smogLimitX);

            if (rangeMaxX < rangeMinX) {
              var mid = ((bounds.minCol + bounds.maxCol + 1) / 2) * cellW;
              rangeMinX = Math.min(mid, smogLimitX);
              rangeMaxX = rangeMinX;
            }

            w.visible = true;
            
            // Entry fade in
            if (w.opacity === undefined) w.opacity = 0;
            if (w.opacity < 1) {
              w.opacity = Math.min(1.0, w.opacity + dt * 1.0);
              if (Math.random() < 0.04) {
                particles.burst(w.x, w.y, {
                  glyphs: ["🍃"],
                  count: 1,
                  lift: 8
                });
              }
            }

            var minY = gridYOffset + bounds.minRow * cellH + cellH * 0.25;
            var maxY = gridYOffset + (bounds.maxRow + 1) * cellH - cellH * 0.25;
            
            w.rowMoveTimer -= dt;

            if (w.rowMoveTimer <= 0) {
              w.rowMoveTimer = 2 + Math.random() * 3;
              var dir = Math.random() < 0.5 ? -1 : 1;
              w.targetRow = Math.max(
                bounds.minRow,
                Math.min(bounds.maxRow, w.row + dir),
              );
            }

            var targetY = gridYOffset + w.targetRow * cellH + cellH * 0.85;
            w.y += (targetY - w.y) * 4 * dt;

            if (Math.abs(w.y - targetY) < 2) {
              w.y = targetY;
              w.row = w.targetRow;
            }

            if (!w.placed) {
              // Place behind a tree/bush on entry
              w.x = rangeMinX + Math.random() * (rangeMaxX - rangeMinX);
              w.row = Math.floor(
                bounds.minRow +
                  Math.random() * (bounds.maxRow - bounds.minRow + 1),
              );
              w.targetRow = w.row;
              w.y = gridYOffset + w.row * cellH + cellH * 0.85;
              w.rowMoveTimer = 2 + Math.random() * 3;
              w.placed = true;
              w.opacity = 0;
              w.state = "WALKING";
              w.stateTimer = 2 + Math.random() * 3;
            }

            if (!w.revealed) {
              w.revealed = true;
              GOGUi.say(defLocal.revealMsg);
              audio.collect();
              particles.burst(w.x, w.y, {
                glyphs: [defLocal.revealGlyph, "✨"],
                count: 10,
                lift: 22,
              });
            }

            // Wildlife state machine reactions
            if (!w.state) {
              w.state = "WALKING";
              w.stateTimer = 3 + Math.random() * 4;
            }
            w.stateTimer -= dt;

            // Fleeing trigger if smog gets close
            var isFleeing = false;
            var smogX = GOGStage2.smogPosition * cellW;
            if (!calmMode && (smogX - w.x) < 130) {
              w.state = "WALKING";
              w.stateTimer = 1.0;
              w.dir = -1; // run leftward
              isFleeing = true;
            }

            if (w.stateTimer <= 0) {
              if (w.state === "WALKING") {
                w.state = "IDLE";
                w.stateTimer = 1.5 + Math.random() * 2.0;
                w.idleType = Math.random() < 0.5 ? "LOOK" : "EAT";
                w.idlePhase = 0;
              } else {
                w.state = "WALKING";
                w.stateTimer = 3.0 + Math.random() * 4.0;
                w.dir = Math.random() < 0.5 ? 1 : -1;
              }
            }

            if (w.state === "WALKING") {
              var walkFps = isFleeing ? defLocal.fps * 1.5 : defLocal.fps;
              GOGSpriteSheet.advanceTimeLoop(w.anim, dt, walkFps, 6);
              var curSpeed = isFleeing ? defLocal.speed * 2.0 : defLocal.speed;
              w.x += w.dir * curSpeed * dt;
              if (w.x > rangeMaxX) {
                w.x = rangeMaxX;
                w.dir = -1;
              }
              if (w.x < rangeMinX) {
                w.x = rangeMinX;
                w.dir = 1;
              }
            } else {
              w.idlePhase += dt * 6;
              w.anim.frameIndex = 0; // pause animation loop

              if (w.idleType === "EAT") {
                if (Math.random() < 0.04) {
                  particles.burst(w.x + w.dir * 12, w.y - 12, {
                    glyphs: ["🍃"],
                    count: 1,
                    lift: 5,
                    minSpeed: 10,
                    maxSpeed: 20
                  });
                  if (Math.random() < 0.15 && w.revealed) {
                    GOGUi.floatLabel(canvasFrame, w.x, w.y - 30, "Munch... 🍃", "rgba(76, 175, 80, 0.9)");
                  }
                }
              } else if (w.idleType === "LOOK") {
                if (Math.random() < 0.015 && w.revealed) {
                  GOGUi.floatLabel(canvasFrame, w.x, w.y - 45, "👀", "#ffeb3b");
                }
              }
            }
          }
        }


        /* ---------------- ambient butterflies & birds ---------------- */
        // Purely decorative flutter/flight over the connected canopy —
        // population scales up with canopy progress so the scene feels
        // more alive the more trees a child reconnects. Confined to the
        // same connected-tree bounds as the big wildlife, so they read as
        // part of that canopy rather than generic screen-wide decoration.
        function updateAmbientCreatures(dt) {
          var bounds = getConnectedCanopyBounds();

          if (!bounds) {
            // Nothing connected yet — park everyone off screen.
            for (var pi = 0; pi < state.birds.length; pi++) state.birds[pi].x = null;
            return;
          }

          var cellW = W / GOGStage2.cols;
          var gridH = GRID_H;
          var cellH = gridH / GOGStage2.rows;
          var gridYOffset = GRID_Y_OFFSET;

          var spanMinX = bounds.minCol * cellW;
          var spanMaxX = (bounds.maxCol + 1) * cellW;
          var canopyTopY = gridYOffset + bounds.minRow * cellH;

          if (state.ambientButterflyCount === 0) {
            state.ambientButterflyCount = 2 + Math.floor(Math.random() * 2);
          }
          if (state.ambientBirdCount === 0) {
            state.ambientBirdCount = 2 + Math.floor(Math.random() * 2);
          }

          var butterflyUnlocked = Math.min(
            BUTTERFLY_MAX,
            state.ambientButterflyCount,
          );
          var birdUnlocked = Math.min(BIRD_MAX, state.ambientBirdCount);

          var i;
          for (i = 0; i < state.butterflies.length; i++) {
            var b = state.butterflies[i];
            if (i >= butterflyUnlocked) {
              b.active = false;
              continue;
            }
            b.active = true;
            b.phase += dt * (1.6 + b.speedMul);
            b.wingPhase += dt * 13;
            var slotFrac = (i + 0.5) / Math.max(1, butterflyUnlocked);
            var homeX = spanMinX + slotFrac * (spanMaxX - spanMinX);
            var homeY = canopyTopY - 6 + Math.sin(b.phase * 0.7 + i) * 8;
            b.x =
              homeX +
              Math.sin(b.phase * 0.6) * 28 +
              Math.cos(b.phase * 0.37 + i) * 16;
            b.y = homeY + Math.sin(b.phase * 0.9 + i) * 14;
          }

          for (i = 0; i < state.birds.length; i++) {
            var bird = state.birds[i];
            if (i >= birdUnlocked) {
              bird.x = null;
              continue;
            }
            var rangeMinX = spanMinX - 50;
            var rangeMaxX = spanMaxX + 50;
            if (bird.x === null) {
              bird.x = rangeMinX + Math.random() * (rangeMaxX - rangeMinX);
              bird.y = canopyTopY - 34 - i * 14 + Math.random() * 8;
              bird.vx =
                (Math.random() < 0.5 ? 1 : -1) *
                (30 + i * 8 + Math.random() * 10);
            }
            bird.phase += dt * 2.2;
            bird.x += bird.vx * dt;
            if (bird.vx > 0 && bird.x > rangeMaxX) {
              bird.x = rangeMinX;
            } else if (bird.vx < 0 && bird.x < rangeMinX) {
              bird.x = rangeMaxX;
            }
            bird.y =
              canopyTopY -
              34 -
              i * 14 +
              Math.sin(bird.phase) * 8 +
              Math.cos(bird.phase * 0.7 + i) * 4;
          }
        }


        /* ---------------- rain clouds spawning ---------------- */
        function spawnCloud() {
          var fromLeft = Math.random() < 0.5;
          var x = fromLeft ? -80 : W + 80;
          var y = 60 + Math.random() * 120;
          var vx = (fromLeft ? 1 : -1) * (40 + Math.random() * 50);
          state.clouds.push({
            x: x,
            y: y,
            vx: vx,
            vy: (Math.random() - 0.5) * 8,
            size: 50,
            active: true,
            // Rain only starts once a child taps this cloud — see the
            // click handler and updateClouds() below.
            raining: false,
            rainTimer: 0,
            dropSpawnTimer: 0,
            drops: [],
          });
        }

        function updateClouds(dt) {
          state.cloudSpawnTimer -= dt;
          if (state.cloudSpawnTimer <= 0) {
            spawnCloud();
            state.cloudSpawnTimer = 3.0 + Math.random() * 3.0;
          }

          for (var i = state.clouds.length - 1; i >= 0; i--) {
            var c = state.clouds[i];

            if (c.raining) {
              // Tapped: the cloud eases to a gentle drift while it empties
              // itself out as an animated shower, then disperses.
              c.x += c.vx * dt;
              c.vx *= Math.max(0, 1 - dt * 3);
              c.y += c.vy * dt * 0.3;

              c.dropSpawnTimer -= dt;
              if (c.dropSpawnTimer <= 0 && c.rainTimer > 0.15) {
                c.drops.push({
                  dx: -18 + Math.random() * 36,
                  y: 0,
                  speed: 130 + Math.random() * 60,
                });
                c.dropSpawnTimer = 0.045 + Math.random() * 0.04;
              }

              for (var d = c.drops.length - 1; d >= 0; d--) {
                var drop = c.drops[d];
                drop.y += drop.speed * dt;
                if (drop.y > 95) {
                  // A little splash where each raindrop lands.
                  if (Math.random() < 0.5) {
                    particles.burst(c.x + drop.dx, c.y + 14 + 95, {
                      glyphs: ["💧"],
                      count: 1,
                      lift: 6,
                    });
                  }
                  c.drops.splice(d, 1);
                }
              }

              c.rainTimer -= dt;
              if (c.rainTimer <= 0 && c.drops.length === 0) {
                state.clouds.splice(i, 1);
              }
            } else {
              c.x += c.vx * dt;
              c.y += c.vy * dt;
              if ((c.vx > 0 && c.x > W + 100) || (c.vx < 0 && c.x < -100)) {
                state.clouds.splice(i, 1);
              }
            }
          }
        }

        /* ---------------- cutscene and end states ---------------- */
        var cutsceneTimer = null;

        // STREAMLINED: one popup before play, not two — the guardian beat
        // is now the only pre-game dialog (matches stage01's pattern) and

        function startWave(waveNum) {
          if (waveNum === 1) {
            GOGStage2.init(GRID_ROWS, GRID_COLS);
            if (GRID_COLS !== 10) {
              GOGStage2.smogSpeed = GOGStage2.smogSpeed.map(function (v) {
                return (v * GRID_COLS) / 10;
              });
            }
            GOGStage2.saplings = 12;
          } else {
            GOGStage2.wave = waveNum;
            GOGStage2.timer = GOGConstants.STAGE2.timePerWave;
            // Set starting saplings: Wave 2 -> 8, Wave 3 -> 4
            if (waveNum === 2) {
              GOGStage2.saplings = 8;
            } else if (waveNum === 3) {
              GOGStage2.saplings = 4;
            } else {
              GOGStage2.saplings = 4;
            }
            GOGStage2.transitionTo("WAVE_ACTIVE");
          }
          state.clouds = [];
          state.cloudSpawnTimer = 1.0;
          state.lastSmogCol = Math.floor(GOGStage2.smogPosition);
          state.running = true;
          state.cutsceneTime = undefined;
          state.cutsceneBirds = null;
          initAmbientFauna();
          GOGStage2.transitionTo("WAVE_ACTIVE");
          refreshCanopy();

          // NEW: reinforce the "next wave" speed preview right as it starts,
          // in case the wave-cleared overlay was tapped through quickly.
          var prevSpeed = GOGStage2.smogSpeed[waveNum - 2];
          var thisSpeed = GOGStage2.smogSpeed[waveNum - 1] || 0;
          var speedNote = (prevSpeed != null && thisSpeed > prevSpeed) ? " The Smog is faster now! 💨" : "";
          GOGUi.say("Wave " + waveNum + " starts! Tap clouds and plant trees!" + speedNote);
        }

        function endWaveCleared() {
          state.running = false;
          audio.heal();
          var nextWave = GOGStage2.wave + 1;

          var factText = "";
          if (GOGStage2.wave === 1) {
            factText = "🐯 \"Animals need forests. Trees provide safe homes and food for many forest creatures!\"";
          } else if (GOGStage2.wave === 2) {
            factText = "🌳 \"Trees clean our air. Their leaves absorb greenhouse gases and release fresh oxygen!\"";
          }

          // NEW: "next wave" preview — warn kids up front if the Smog is about
          // to creep faster, so a harder wave never feels like a surprise.
          var currSpeed = GOGStage2.smogSpeed[GOGStage2.wave - 1] || 0;
          var nextSpeed = GOGStage2.smogSpeed[nextWave - 1] || currSpeed;
          var speedPreview = nextSpeed > currSpeed
            ? "⚠️ <b>Heads up:</b> the Smog creeps faster in Wave " + nextWave + " — plant quickly!"
            : "😌 The Smog moves at the same steady pace next wave.";

          var clearedOverlay = GOGUi.showOverlay({
            accent: "var(--gog-lime)",
            title: "🌳 Wave " + GOGStage2.wave + " Cleared!",
            body: "The canopy held! Ravi is recovering. Reach a " + (GOGStage2.canopyTargets[nextWave - 1] || 50) + "% connected canopy in the next wave!<br><br>" + speedPreview + "<br><br><b>Forest Fact:</b><br>" + factText,
            primaryLabel: "Start Wave " + nextWave,
            onPrimary: function () {
              GOGUi.closeOverlay(clearedOverlay);
              startWave(nextWave);
            },
          });
        }

        function endWin() {
          audio.stopBgm();
          if (winWiping || winWipeDone) return;
          state.running = false;
          audio.win();
          winWipeRadius = 0;
          winWiping = true;
        }

        function finishWin() {
          var connectedCount = 0;
          var totalCells = GOGStage2.rows * GOGStage2.cols;
          for (var r = 0; r < GOGStage2.rows; r++) {
            for (var c = 0; c < GOGStage2.cols; c++) {
              if (
                GOGStage2.grid[r][c].state === "tree" &&
                GOGStage2.grid[r][c].connected
              ) {
                connectedCount++;
              }
            }
          }
          var canopyPercent = Math.round((connectedCount / totalCells) * 100);

          var treesLost = 0;
          for (var r = 0; r < GOGStage2.rows; r++) {
            for (var c = 0; c < GOGStage2.cols; c++) {
              var cell = GOGStage2.grid[r][c];
              if ((cell.state === "tree" || cell.state === "sapling") && c >= Math.floor(GOGStage2.smogPosition)) {
                treesLost++;
              }
            }
          }

          var stars = GOGProgress.stars.fromRules([
            { stars: 3, when: canopyPercent >= 70 && treesLost === 0 },
            { stars: 2, when: treesLost <= 2 },
            { stars: 1, when: true }
          ]);

          var rec = GOGProgress.finishStage(STAGE_ID, { stars: stars, diff: diff });

          var nextSave = GOGSave.recordStageClear(STAGE_ID, {
            stars: stars,
            sprouts: 15,
            smogDrop: 10,
          });

          // STREAMLINED: one popup on win, not two — Ravi's grateful line now
          // lives inside the same fact/stars card instead of its own dialog
          // first. The narration clip plays via the overlay itself, which
          // gates its buttons until it completes.
          setTimeout(function () {
            triggerSeedReturnCutscene(function () {
              var winOverlay = GOGUi.showOverlay({
                accent: "var(--gog-white)",
                title: "🌳 Canopy Restored!",
                body: "“You grew my forest back! Now my friends have a home again! 🌳”<br><br>Ravi wakes up and a Seed of Life flies back to the Guardian Tree.",
                stars: rec.stars,
                factText: stageMeta.fact,
                narrationAudio: audio,
                narrationPath: "assets/audio/stage02/ravi_outro_lines.mp3",
                primaryLabel: "Back to Map",
                secondaryLabel: "Play Again",
                onPrimary: function () {
                  window.location.href = "../index.html";
                },
                onSecondary: function () {
                  restartInPage(winOverlay);
                },
              });
            });
          }, 600);
        }

        // Retry without reloading the page, so the "meet Ravi" intro and its
        // narration don't replay every time (a reload also restarted the lesson).
        function resetStage() {
          raviArcStage = -1;
          raviPounce = 0;
          winWipeRadius = 0;
          winWiping = false;
          winWipeDone = false;
          state.elapsed = 0;
          state.canopyPercent = 0;
          state.screenShake = 0;
          state.desaturateTime = 0;
          canvasFrame.classList.remove("flash-lose");
          startWave(1);
        }
        function restartInPage(overlayEl) {
          GOGUi.closeOverlay(overlayEl);
          resetStage();
          audio.playBgm();
        }

        function endLose() {
          audio.stopBgm();
          state.running = false;
          audio.lose();
          
          GOGProgress.failStage(STAGE_ID, { diff: diff });

          canvasFrame.classList.add("flash-lose");
          var canopyNow = GOGStage2.getCanopyPercent();
          var canopyTarget = GOGStage2.getCanopyTarget();
          var loseGuide;
          if (GOGStage2.failureReason === "CANOPY_TARGET_MISSED") {
            loseGuide = "Time ran out at " + canopyNow + "% canopy - next time, plant early and connect more grown trees to reach " + canopyTarget + "%.";
          } else if (GOGStage2.failureReason === "SMOG_REACHED_RAVI") {
            loseGuide = "The Smog reached Ravi through an open column - next time, grow connected trees in every row to block it.";
          } else {
            loseGuide = "Ravi still needs a stronger canopy - next time, connect more grown trees before the Smog arrives.";
          }
          GOGUi.say(loseGuide);
          var loseOverlay = GOGUi.showOverlay({
            title: "🌫️ The forest is cloudy",
            body: loseGuide,
            primaryLabel: "Try Again",
            secondaryLabel: "Back to Map",
            onPrimary: function () {
              restartInPage(loseOverlay);
            },
            onSecondary: function () {
              window.location.href = "../index.html";
            },
          });
        }

        /* ---------------- input handling ---------------- */
        function updateInputs() {
          if (!state.running) return;

          if (input.pointer.down) {
            if (!state.pointerWasDown) {
              state.pointerWasDown = true;
              var ptX = input.pointer.x;
              var ptY = input.pointer.y;

              // 1. Check cloud click
              var hitCloud = false;
              for (var i = state.clouds.length - 1; i >= 0; i--) {
                var c = state.clouds[i];
                // Enlarge cloud hitbox detection to 60px for kid-friendly touch interaction
                if (
                  c.active &&
                  !c.raining &&
                  GOGEngine.Collision.distance(ptX, ptY, c.x, c.y) < 60 * diff.forgivenessMul()
                ) {
                  hitCloud = true;
                  GOGStage2.saplings++;
                  audio.collect();
                  particles.burst(c.x, c.y, {
                    glyphs: ["💧", "✨"],
                    count: 12,
                    lift: 45,
                  });
                  GOGUi.floatLabel(
                    canvasFrame,
                    ptX,
                    ptY,
                    "+1 Sapling 🌱",
                    "#2fbf71",
                  );
                  // Start the rain now — the cloud lingers and shows an
                  // animated shower instead of just vanishing.
                  c.raining = true;
                  c.rainTimer = 1.4;
                  c.dropSpawnTimer = 0;

                  // NEW: Rain cloud power-up — saplings under the shower
                  // instantly gain +50% growth (their remaining grow time
                  // is halved), rewarding tapping clouds near planted spots.
                  var rainCellW = W / GOGStage2.cols;
                  var rainCol = Math.floor(c.x / rainCellW);
                  var rainBoosted = false;
                  for (var rr = 0; rr < GOGStage2.rows; rr++) {
                    for (var rc = rainCol - 1; rc <= rainCol + 1; rc++) {
                      if (rc < 0 || rc >= GOGStage2.cols) continue;
                      var rainCell = GOGStage2.grid[rr][rc];
                      if (rainCell.state === "sapling") {
                        rainCell.growTimer = Math.max(0, rainCell.growTimer * 0.5);
                        rainBoosted = true;
                      }
                    }
                  }
                  if (rainBoosted) {
                    GOGUi.floatLabel(
                      canvasFrame,
                      ptX,
                      ptY - 30,
                      "Rain Boost! 💧 +50% growth",
                      "#5ec8f2",
                    );
                  }
                  break;
                }
              }

              // 2. Check grid click
              // 2. Check grid click
              if (!hitCloud) {
                var cellW = W / GOGStage2.cols;
                var gridH = GRID_H;
                var cellH = gridH / GOGStage2.rows;

                // Shift calculation by subtracting the grid Y offset
                var col = Math.floor(ptX / cellW);
                var row = Math.floor((ptY - GRID_Y_OFFSET) / cellH);

                // Ensure click is inside the bounds of the grid
                if (
                  ptY >= GRID_Y_OFFSET &&
                  col >= 0 &&
                  col < GOGStage2.cols &&
                  row >= 0 &&
                  row < GOGStage2.rows
                ) {
                  // Cell lock: Smog-engulfed column check
                  if (!calmMode && col >= Math.floor(GOGStage2.smogPosition)) {
                    audio.blip(180, 150, "sawtooth");
                    GOGUi.floatLabel(
                      canvasFrame,
                      ptX,
                      ptY,
                      "Engulfed by Smog! 🌫️",
                      "#e82e5d",
                    );
                  } else {
                    var success = GOGStage2.plant(row, col);
                    if (success) {
                      audio.blip(440, 120, "triangle");
                      var cx = col * cellW + cellW / 2;
                      var cy = GRID_Y_OFFSET + row * cellH + cellH / 2; // Adjusted particle center
                      var groveBonus = GOGStage2.grid[row][col].groveBonus;
                      particles.burst(cx, cy, {
                        glyphs: groveBonus ? ["🌱", "✨", "🍃"] : ["🌱", "🍃"],
                        count: groveBonus ? 12 : 8,
                        lift: 30,
                      });
                      GOGUi.floatLabel(
                        canvasFrame,
                        ptX,
                        ptY,
                        groveBonus ? "Grove Bonus! 🌿 +25% growth" : "Planted!",
                        "var(--gog-lime)",
                      );
                    } else if (
                      GOGStage2.saplings <= 0 &&
                      GOGStage2.grid[row][col].state === "empty"
                    ) {
                      audio.blip(180, 150, "sawtooth");
                      GOGUi.floatLabel(
                        canvasFrame,
                        ptX,
                        ptY,
                        "No saplings! Tap clouds ☁️",
                        "#e82e5d",
                      );
                    } else if (GOGStage2.grid[row][col].state === "rock") {
                      audio.blip(180, 150, "sawtooth");
                      GOGUi.floatLabel(
                        canvasFrame,
                        ptX,
                        ptY,
                        "Cannot plant on rocks! ⛰️",
                        "#e82e5d",
                      );
                    }
                  }
                }
              }
            }
          } else {
            state.pointerWasDown = false;
          }
        }

        /* ---------------- update loop ---------------- */
        function update(dt) {
          if (GOGUi.paused) return; // "How to play" pop-up is open
          particles.update(dt);

          // Update juice effects
          state.screenShake = Math.max(0, state.screenShake - dt * 14);
          state.desaturateTime = Math.max(0, state.desaturateTime - dt);

          if (winWiping) {
            winWipeRadius += dt * winWipeMax * 1.6;
            if (winWipeRadius >= winWipeMax) {
              winWiping = false;
              winWipeDone = true;
              finishWin();
            }
          }

          // STAGE WON CUTSCENE UPDATE
          if (GOGStage2.gameState === "STAGE_WON_CUTSCENE") {
            if (state.cutsceneTime === undefined) {
              state.cutsceneTime = 0;
              state.cutsceneSparkleTimer = 0;
              state.wildlife.forEach(function (w, idx) {
                w.state = "IDLE";
                w.idleType = "LOOK";
                w.x = W / 2 - 80 + idx * 80;
                w.y = H / 2 + 100;
              });
              state.cutsceneBirds = [];
              for (var k = 0; k < 6; k++) {
                state.cutsceneBirds.push({
                  x: -50 - k * 30,
                  y: 60 + Math.random() * 50,
                  speed: 140 + Math.random() * 40
                });
              }
            }

            state.cutsceneTime += dt;
            state.cutsceneSparkleTimer -= dt;
            if (state.cutsceneSparkleTimer <= 0) {
              // particles.burst(W / 2 + (Math.random() - 0.5) * 160, H / 2 + (Math.random() - 0.5) * 80, {
              //   glyphs: ["✨", "🍃", "🌸", "❤️"],
              //   count: 3,
              //   lift: 15
              // });
              // state.cutsceneSparkleTimer = 0.15;
            }

            if (state.cutsceneBirds) {
              state.cutsceneBirds.forEach(function (b) {
                b.x += b.speed * dt;
              });
            }

            state.ambientFauna.forEach(function (f) {
              f.x += (W / 2 + (Math.sin(f.x + state.elapsed) * 60) - f.x) * 2 * dt;
            });

            if (state.cutsceneTime >= 5.0) {
              GOGStage2.transitionTo("STAGE_WON");
            }
          }

          if (!state.running) return;

          state.elapsed += dt;
          scrollX += 45 * dt;

          updateClouds(dt);
          updateInputs();
          updateRaviCharacter(dt);
          updateCoach();

          // Advance logic model (growth, smog, timer) and read connection snaps
          if (GOGStage2.gameState === "WAVE_ACTIVE") {
            var grown = [];
            // Calm mode and the guided lesson both run growth only: no Smog and
            // no countdown, so nobody can lose while they are still learning.
            if (calmMode || coach.active) {
              grown = GOGStage2.advanceGrowth(dt);
              if (calmMode && GOGStage2.getCanopyPercent() >= GOGStage2.getCanopyTarget()) {
                GOGStage2.winWave();
              }
            } else {
              grown = GOGStage2.tick(dt);
            }

            // Nature Soundscape Tickers
            if (!state.birdSoundTimer) state.birdSoundTimer = 3 + Math.random() * 4;
            state.birdSoundTimer -= dt;
            if (state.birdSoundTimer <= 0) {
              var smogRatio = GOGStage2.smogPosition / GOGStage2.cols;
              if (smogRatio > 0.2) {
                playProceduralBird();
              }
              state.birdSoundTimer = 4 + Math.random() * 5 + (1.0 - smogRatio) * 6;
            }

            if (!state.frogSoundTimer) state.frogSoundTimer = 5 + Math.random() * 5;
            state.frogSoundTimer -= dt;
            if (state.frogSoundTimer <= 0) {
              var smogRatio = GOGStage2.smogPosition / GOGStage2.cols;
              if (smogRatio > 0.25) {
                playProceduralFrog();
              }
              state.frogSoundTimer = 6 + Math.random() * 8 + (1.0 - smogRatio) * 8;
            }

            if (!state.windSoundTimer) state.windSoundTimer = 2 + Math.random() * 3;
            state.windSoundTimer -= dt;
            if (state.windSoundTimer <= 0) {
              playProceduralWind();
              state.windSoundTimer = 10 + Math.random() * 8;
            }

            // Dynamic BGM volume based on smog distance (forest gets quieter).
            // setBgmVolume only touches the player when the value changes.
            var smogRatio = GOGStage2.smogPosition / GOGStage2.cols;
            audio.setBgmVolume(Math.round(audio._bgmMaxVol * Math.max(0.15, smogRatio) * 200) / 200);

            // Update ambient fauna
            updateAmbientFauna(dt);

            // Connection snaps: Leaf / sparkle burst when tree grows
            var cellW = W / GOGStage2.cols;
            var gridH = GRID_H;
            var cellH = gridH / GOGStage2.rows;
            grown.forEach(function (coord) {
              var cx = coord.c * cellW + cellW / 2;
              var cy = GRID_Y_OFFSET + coord.r * cellH + cellH / 2;
              particles.burst(cx, cy, {
                glyphs: ["🍃", "✨", "🟢"],
                count: 18,
                lift: 20,
              });
              audio.heal();
            });

            // Smog deflection curls
            if (!calmMode && GOGStage2.smogPosition > 0) {
              var colIndex = Math.floor(GOGStage2.smogPosition - 0.05);
              if (GOGStage2.isColumnBlocked(colIndex)) {
                var bx = GOGStage2.smogPosition * cellW;
                if (Math.random() < 0.18) {
                  particles.burst(bx, Math.random() * H, {
                    glyphs: ["💨", "🌫️"],
                    count: 1,
                    lift: 12,
                    minSpeed: 45,
                    maxSpeed: 85,
                    angle: 0,
                    spread: Math.PI / 4,
                    life: 500,
                  });
                }
              }
            }

            // Smog breach detection
            if (!calmMode) {
              var currSmogCol = Math.floor(GOGStage2.smogPosition);
              if (currSmogCol < state.lastSmogCol) {
                if (!GOGStage2.isColumnBlocked(currSmogCol)) {
                  state.screenShake = 12;
                  state.desaturateTime = 0.25;
                  audio.hazard();
                  GOGUi.say("The Smog broke through a column! 🌫️⚠️");
                }
                state.lastSmogCol = currSmogCol;
              }
            }
          }

          // Handle state machine changes
          if (GOGStage2.gameState === "WAVE_CLEARED") {
            endWaveCleared();
          } else if (GOGStage2.gameState === "STAGE_WON") {
            endWin();
          } else if (GOGStage2.gameState === "STAGE_LOST") {
            endLose();
          }

          // Update HUD — one shared grid scan; DOM writes only when a value changed
          refreshCanopy();
          var totalCells = GOGStage2.rows * GOGStage2.cols;
          var canopyPercent = Math.round((canopyCount / totalCells) * 100);
          var canopyTarget = GOGStage2.getCanopyTarget();
          if (canopyPercent !== hudLast.pct || canopyTarget !== hudLast.target) {
            hudLast.pct = canopyPercent;
            hudLast.target = canopyTarget;
            GOGUi.setStyle(canopyFill, "width", canopyPercent + "%");
            GOGUi.setText(canopyPct, canopyPercent + "% / " + canopyTarget + "%");
          }
          state.canopyPercent = canopyPercent;
          updateWildlife(dt);
          updateAmbientCreatures(dt);

          if (GOGStage2.saplings !== hudLast.sap) {
            hudLast.sap = GOGStage2.saplings;
            GOGUi.setText(sproutsChip, GOGStage2.saplings);
          }
          var delayShown = GOGStage2.smogDelay > 0 && !calmMode;
          var timerSecs = calmMode ? -1 : Math.ceil(GOGStage2.timer);
          if (timerSecs !== hudLast.timer || delayShown !== hudLast.delay) {
            hudLast.timer = timerSecs;
            hudLast.delay = delayShown;
            GOGUi.setText(timerChip, calmMode ? "∞" : timerSecs + "s");
            GOGUi.setStyle(timerChip, "backgroundColor", delayShown ? "var(--gog-sun)" : "");
            GOGUi.setStyle(timerChip, "color", delayShown ? "var(--gog-ink)" : "");
          }
          if (GOGStage2.wave !== hudLast.wave) {
            hudLast.wave = GOGStage2.wave;
            GOGUi.setText(difficultyChip, "⚡ Wave " + GOGStage2.wave);
          }
        }

        /* ---------------- draw loop ---------------- */
        /* ---------------- draw loop ---------------- */

        // NEW: "suggested spot" easy-mode helper — picks one empty, plantable
        // cell to glow: prefers cells next to existing growth (builds a
        // connected canopy), then the cell nearest the smog front (most urgent).
        // Shown only in calm mode or once auto-easing has kicked in, so it
        // stays a helping hand for struggling/young kids without removing the
        // planning challenge for everyone else.
        // Allocation-free (it runs every frame while the hint is showing); the
        // returned object is reused, so read it before calling again.
        var suggestBest = { r: 0, c: 0 };
        var DR4 = [-1, 1, 0, 0];
        var DC4 = [0, 0, -1, 1];
        function findSuggestedPlantCell() {
          if (GOGStage2.gameState !== "WAVE_ACTIVE") return null;
          if (GOGStage2.saplings <= 0) return null;
          var grid = GOGStage2.grid;
          var rows = GOGStage2.rows;
          var cols = GOGStage2.cols;
          var smogCol = Math.floor(GOGStage2.smogPosition);
          var found = false;
          var bestScore = -Infinity;
          // Before anything is planted, the best first move is next to Ravi's
          // root (column 0), so the first tree is connected from the start.
          var anyGrowth = false;
          for (var gr = 0; gr < rows && !anyGrowth; gr++) {
            for (var gc = 0; gc < cols; gc++) {
              var gs = grid[gr][gc].state;
              if (gs === "tree" || gs === "sapling") { anyGrowth = true; break; }
            }
          }
          for (var r = 0; r < rows; r++) {
            for (var c = 0; c < cols; c++) {
              var cell = grid[r][c];
              if (cell.state !== "empty" || c >= smogCol) continue;
              var adjacentGrowth = 0;
              for (var n = 0; n < 4; n++) {
                var nr = r + DR4[n], nc = c + DC4[n];
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                  var ns = grid[nr][nc].state;
                  if (ns === "tree" || ns === "sapling") adjacentGrowth++;
                }
              }
              var score = adjacentGrowth * 100 - (smogCol - c);
              if (!anyGrowth) score = (c === 0 ? 1000 : 0) - Math.abs(r - 1);
              if (score > bestScore) {
                bestScore = score;
                suggestBest.r = r;
                suggestBest.c = c;
                found = true;
              }
            }
          }
          return found ? suggestBest : null;
        }

        // NEW: Ravi's character arc — mood/pace tracks canopy health, with
        // a one-time dialogue line and pounce bounce at each threshold.
        function updateRaviCharacter(dt) {
          var pct = state.canopyPercent || 0;
          var stage = pct >= 80 ? 2 : pct >= 30 ? 1 : 0;

          // Walk-cycle speed reflects mood: slow/nervous when scared, brisk
          // and bouncy once the canopy is thriving.
          var animSpeed = stage === 0 ? 3.5 : stage === 1 ? 6 : 9;
          raviAnimTimer += dt * animSpeed;
          raviFrame = Math.floor(raviAnimTimer) % 6;

          if (raviPounce > 0) raviPounce = Math.max(0, raviPounce - dt * 1.6);

          if (stage > raviArcStage && GOGStage2.gameState === "WAVE_ACTIVE") {
            raviArcStage = stage;
            if (stage === 0) {
              GOGUi.say("They cut down my home… I'm scared, but I see you planting! 🐯");
            } else if (stage === 1) {
              GOGUi.say("The canopy's coming back — I feel braver already! 🌳");
            } else if (stage === 2) {
              raviPounce = 1;
              GOGUi.say("My forest is alive again! Thank you! 🐯🎉");
            }
          }
        }


        /* ================= render (PixiJS) =================
           Retained scene graph. Static art is painted ONCE with Canvas2D (bake) at the on-screen
           resolution and used as textures; per frame we only move sprites / redraw a few small
           Graphics. Look = the "Stage 3 recipe": bright flat jungle, ink outlines, a pastel haze that
           lifts as the canopy grows (never dark), a FACELESS soft lilac-grey Smog.
           Visual randomness uses the private `vis` RNG; the only Math.random calls that remain in the
           draw path are the original three (screen shake x/y, Ravi's tremble) so the gameplay
           random sequence stays exactly as before. */
        var R = null; // GOGRender handle, set in initBackground()
        var sceneReady = false;
        var vis = GOGScenery.seededRng(77131);
        var TAU = Math.PI * 2;
        var INK = "#111111";
        var art = null; // baked textures at the current R.scale
        var nodes = {}; // scene nodes (created once)
        var tinted = {}; // tree textures by look

        /* ---------- painters (Canvas2D, once per resolution) ---------- */
        function inkLine(g, w) {
          g.lineJoin = "round";
          g.lineCap = "round";
          g.strokeStyle = INK;
          g.lineWidth = w;
          g.stroke();
        }
        function paintSkyStrip(g) {
          var grad = g.createLinearGradient(0, 0, 0, 64);
          grad.addColorStop(0, "#8FDCF5");
          grad.addColorStop(0.6, "#C9F0E2");
          grad.addColorStop(1, "#F2F8C8");
          g.fillStyle = grad;
          g.fillRect(0, 0, 4, 64);
        }
        function paintHazeStrip(g) {
          var grad = g.createLinearGradient(0, 0, 0, 64);
          grad.addColorStop(0, "rgba(226,218,244,0.95)");
          grad.addColorStop(1, "rgba(196,200,226,0.85)");
          g.fillStyle = grad;
          g.fillRect(0, 0, 4, 64);
        }
        // hills + ground + a few round trees on the ridges, all flat and ink-outlined
        function paintBackdrop(g) {
          var floorY = H;
          // far hills (pale, hazy, no ink)
          GOGScenery.hills(g, W, floorY, H * 0.36, 46, "#C4ECD2", "#A5E0BA", 11, null);
          // mid hills with ink
          var crest2 = GOGScenery.hills(g, W, floorY, H * 0.44, 36, "#86D99F", "#5BC585", 23, INK);
          for (var i = 0; i < 7; i++) {
            var tx = (i + 0.5) * (W / 7) + (vis() - 0.5) * 40;
            GOGScenery.jungleTree(g, tx, crest2(tx) + 6, 0.55 + vis() * 0.2, { ink: true, lw: 2.5 });
          }
          // grove ground under the planting grid
          var top = GRID_Y_OFFSET - 14;
          function gy(x) { return top + Math.sin((x * 2 * TAU) / W) * 4 + Math.sin((x * 5 * TAU) / W + 1) * 2; }
          g.beginPath();
          g.moveTo(0, H + 4);
          for (var x = 0; x <= W; x += 6) g.lineTo(x, gy(x));
          g.lineTo(W, H + 4);
          g.closePath();
          var gg = g.createLinearGradient(0, top, 0, H);
          gg.addColorStop(0, "#A7E36E");
          gg.addColorStop(1, "#6FCB5B");
          g.fillStyle = gg;
          g.fill();
          g.save();
          g.clip();
          g.fillStyle = "rgba(255,255,255,0.13)";
          for (var s = 0; s < 14; s++) {
            g.beginPath();

          nodes.rings.end();

          nodes.rocks.end();

          var vg = nodes.vinesG;

                pg.moveTo(pcx + 16, cy + 12).arc(pcx, cy + 12, 16, -Math.PI / 2, -Math.PI / 2 + Math.max(0.001, pct) * TAU);

                if (growingPlantsImg && growingPlantsImg.width > 0) {

                  var gf = GROWING_PLANT_FRAMES[idx];

              } else if (cs3 === "tree") {

                }

                  if (c + 1 < cols) {

                    if (r2.state === "tree" && r2.connected) {
                      var wsm = Math.sin(t * 1.8 + (r * 4.3 + (c + 0.5) * 2.7)) * 2.5;
                      placeBush(row.bushes.next(), (r + c) % 2, (c + 1) * cellW + wsm, GRID_Y_OFFSET + r * cellH + cellH / 2 + cellH / 2 - 6 + 12, cellW * 0.9);

                var heightMultiplier = 0.88 + ((variation + 2) % 3) * 0.12;
                var tilt = ((variation % 4) - 1.5) * 0.045;

                  pg.moveTo(tx, ty - 4).quadraticCurveTo(tx - 10, ty + 2, tx - 22, ty + 10);

        function placeBush(s, variant, x, y, w) {

        function vineLink(g, x1, y1, x2, y2, phase) {
          g.moveTo(x1, y1 - 10).lineTo(x2, y2 - 10);
          g.stroke({ width: 5, color: 0x5c4033 });
          var dx = x2 - x1, dy = y2 - y1;
          var dist = Math.hypot(dx, dy) || 1;
          var px = -dy / dist, py = dx / dist;
          var steps = 12, i, t;
          for (i = 0; i <= steps; i++) {
            t = i / steps;
            var off = Math.sin(t * Math.PI * 4 + phase) * 5;
            var vx = x1 + dx * t + px * off, vy = y1 + dy * t - 10 + py * off;
            if (i === 0) g.moveTo(vx, vy);
            else g.lineTo(vx, vy);
          }
          g.stroke({ width: 2.5, color: 0x2fbf71 });
          for (i = 1; i < steps; i += 2) {
            t = i / steps;
            var lf = nodes.vineLeaves.next();
            lf.texture = art.leaf.tex;
            lf.width = lf.height = 22;
            lf.position.set(x1 + dx * t, y1 + dy * t - 22);
          }
        }

        function syncWildlife() {
          var rows = GOGStage2.rows;

          var r;
          for (r = 0; r < rows; r++) {

            nodes.rowsC[r].animals.begin();

          var list = state.wildlife;
          for (var i = 0; i < list.length; i++) {
            var w = list[i];
            if (!w.visible || w.defIndex < 0) continue;
            var animalRow = Math.max(0, Math.min(rows - 1, Math.floor((w.y - GRID_Y_OFFSET) / cellH)));
            var def = WILDLIFE_DEFS[w.defIndex];
            var img = def.getImg();
            if (!img || !img.width) continue;
            var frameW = img.width / 2, frameH = img.height / 3;
            var fi = w.anim.frameIndex;
            var destW = cellW * def.widthScale;
            var fr = outlinedFrame(img, (fi % 2) * frameW, Math.floor(fi / 2) * frameH, frameW, frameH, destW, def.id + fi);
            if (!fr) continue;
            var row = nodes.rowsC[animalRow];
            var op = w.opacity !== undefined ? w.opacity : 1;
            var sh = row.shadows.next();
            sh.texture = art.shadow.tex;
            sh.width = destW * 0.64;
            sh.height = 12;

            sh.alpha = op;
            var an = row.animals.next();

              fr2 = outlinedFrame(beesFlyingImg, (f.frameIndex % 4) * bw, Math.floor(f.frameIndex / 4) * bw, bw, bw, 56, "bee" + f.frameIndex);
              if (!fr2) continue;
              fs = nodes.fauna.next();
              fs.anchor.set(0.5, 0.5);
              fs.texture = fr2.tex;
              fs.scale.set(fr2.k * flip, fr2.k);

            for (var r = 0; r < rows; r++) {
              for (var c = 0; c < cols; c++) {
                var cell = grid[r][c];

                var cx = c * cellW + cellW / 2, cy = GRID_Y_OFFSET + r * cellH + cellH / 2;
                var bs = nodes.blossoms.next();
                bs.texture = pink.tex;
                bs.width = pink.w;
                bs.height = pink.h;

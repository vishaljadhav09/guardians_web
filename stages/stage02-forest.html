<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Ravi & the Canopy Call - Guardians of Gaia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/styles.css" />
    <style>
      .stage-wrap {
        width: min(1180px, calc(100vw - 28px));
        max-width: 1180px;
        margin: 0 auto;
        padding: 12px 0 32px;
        animation: pageFadeIn 0.5s ease both;
      }

      .stage-hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .stage-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .stage-title h1 {
        font-size: 1.25rem;
      }

      .stage-title small {
        display: block;
        font-family: var(--gog-font-hand);
        font-size: 1rem;
        color: #4d5c37;
      }

      .hud-mid {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }

      .meter {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--gog-white);
        border: 3px solid var(--gog-ink);
        border-radius: 999px;
        padding: 6px 14px 6px 10px;
        box-shadow: var(--gog-shadow-sm);
        min-width: 168px;
        position: relative;
      }

      .meter .label,
      .meter .meter-track {
        position: relative;
        z-index: 2;
      }

      .meter .label {
        font-size: 0.78rem;
        font-weight: 700;
        white-space: nowrap;
      }

      .meter-track {
        flex: 1;
        height: 10px;
        border-radius: 999px;
        background: #dfe8cf;
        border: 2px solid var(--gog-ink);
        overflow: hidden;
      }

      .meter-fill {
        height: 100%;
        width: 42%;
        background: linear-gradient(90deg, #c9f23d, #2fbf71);
      }

      .timer-chip {
        font-weight: 700;
        min-width: 64px;
        text-align: center;
      }

      .canvas-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 10;
        overflow: hidden;
        max-height: calc(100vh - 220px);

        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: crosshair;
      }

      .stage-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        gap: 10px;
        flex-wrap: wrap;
      }

      .calm-badge {
        font-size: 0.78rem;
        font-weight: 700;
        animation: fadeInUp 0.6s ease both;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        min-width: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--gog-white);
        border: 3px solid var(--gog-ink);
        border-radius: 50%;
        box-shadow: 3px 3px 0 var(--gog-ink);
        font-size: 1.15rem;
        line-height: 1;
        touch-action: manipulation;
      }

      @media (max-width: 700px) {
        .stage-wrap {
          width: calc(100vw - 12px);
          max-width: 100%;
          padding: 6px 0 18px;
        }

        .stage-hud {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 6px;
          margin-bottom: 8px;
        }

        .stage-title {
          gap: 6px;
          min-width: 0;
        }

        .stage-title .emoji-float {
          font-size: 1.35rem !important;
        }

        .stage-title h1 {
          font-size: 0.98rem;
          line-height: 1;
        }

        .stage-title small {
          display: none;
        }

        .hud-mid {
          display: grid;
          grid-template-columns: minmax(128px, 1fr) repeat(4, auto);
          gap: 5px;
          align-items: center;
          width: 100%;
        }

        .meter {
          min-width: 0;
          gap: 5px;
          padding: 4px 8px 4px 7px;
          border-width: 2px;
          box-shadow: 2px 2px 0 var(--gog-ink);
        }

        .meter .label {
          font-size: 0.66rem;
        }

        .meter-track {
          height: 8px;
          border-width: 2px;
        }

        .chip {
          padding: 4px 7px;
          border-width: 2px;
          box-shadow: 2px 2px 0 var(--gog-ink);
          font-size: 0.72rem;
          min-height: 30px;
        }

        .timer-chip {
          min-width: 44px;
        }

        .icon-btn {
          width: 32px;
          height: 32px;
          min-width: 32px;
          font-size: 0.92rem;
          border-width: 2px;
          box-shadow: 2px 2px 0 var(--gog-ink);
        }

        .guideBar {
          gap: 6px;
          padding: 3px 4px;
          margin-bottom: 8px;
          border-width: 2px;
          border-radius: 8px;
          box-shadow: 1px 1px 0 var(--gog-ink);
        }

        .guideAvatar {
          font-size: 1.25rem;
        }

        .guideBubble {
          padding: 5px 8px;
          border-width: 2px;
          border-radius: 10px;
          font-size: 1rem;
          line-height: 1.1;
        }

        .canvas-frame {
          border-width: 3px;
          border-radius: 12px;
          box-shadow: 4px 4px 0 var(--gog-ink);
        }

        .stage-controls {
          margin-top: 8px;
          gap: 6px;
        }

        .stage-controls .brutal-btn {
          padding: 8px 12px;
          min-height: 38px;
          border-width: 3px;
          border-radius: 10px;
          font-size: 0.86rem;
          box-shadow: 3px 3px 0 var(--gog-ink);
        }

        .calm-badge {
          font-size: 0.72rem;
        }
      }

      @media (max-width: 420px) {
        .hud-mid {
          grid-template-columns: minmax(118px, 1fr) repeat(3, auto);
        }

        #difficultyChip {
          display: none;
        }
      }

      @keyframes pageFadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .emoji-float {
        display: inline-block;
        animation: emojiFloat 2.6s ease-in-out infinite;
      }

      @keyframes emojiFloat {
        0%,
        100% {
          transform: translateY(0) rotate(-4deg);
        }
        50% {
          transform: translateY(-5px) rotate(5deg);
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      body {
        position: relative;
      }

      .page-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at 50% -8%,
            #efffdd 0%,
            #d4f0bd 42%,
            #fdf6e6 100%
          ),
          linear-gradient(
            180deg,
            rgba(60, 135, 67, 0.1),
            rgba(36, 99, 55, 0.16)
          );
      }

      .page-bubble {
        position: absolute;
        bottom: -10vh;
        border-radius: 999px;
        background: radial-gradient(
          circle at 32% 28%,
          rgba(255, 255, 255, 0.95),
          rgba(201, 242, 61, 0.14) 70%
        );
        opacity: 0;
        animation: pageBubbleRise linear infinite;
      }

      @keyframes pageBubbleRise {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 0;
        }
        8% {
          opacity: 0.5;
        }
        90% {
          opacity: 0.35;
        }
        100% {
          transform: translateY(-125vh) translateX(var(--drift, 24px));
          opacity: 0;
        }
      }

      .page-fx {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .page-bubble {
          animation: none;
          opacity: 0;
        }
      }
    </style>
  </head>

    <div class="stage-wrap">

    <!-- Seed Returns Cutscene Overlay -->

    <script src="../data/content.js"></script>

    <script>
      /* ============================================================
   GUARDIANS OF GAIA — STAGE 2 CORE LOGIC & STATE MACHINE
   Build: Isolated, pure logic layer, testable in browser console.
   Controls grid state, growth timer, BFS connectivity, and waves.
   ============================================================ */

      (function (global) {
        "use strict";

        // Reusable flat array for BFS exploration (Phase 8 Performance Pass)
        var bfsQueue = [];

        var GOGStage2 = {
          // State variables
          grid: [],
          saplings: 0,
          wave: 0,
          maxWaves: 3,
          smogPosition: 0,
          smogDelay: 0.0, // Prep phase delay before smog moves (Phase 7 Balance Pass)
          smogMoving: false, // true = smog creeping forward (happy face), false = blocked/paused (upset face)
          gameState: "INTRO", // INTRO, WAVE_ACTIVE, WAVE_CLEARED, STAGE_WON, STAGE_LOST
          failureReason: "",
          timer: 0,
          rows: 4,
          cols: 10,
          growthTime: 1.2, // current growth time (sec)
          growthTimes: [1.2, 1.4, 1.7], // wave-specific growth time difficulty tuning (Phase 7)
          smogSpeed: [0.18, 0.25, 0.35], // smog speeds per wave (cols per second)
          canopyTargets: [25, 45, 60], // Target canopy percentages to win each wave (kid-friendly)

          getCanopyPercent: function () {
            var connectedCount = 0;
            var totalCells = this.rows * this.cols;
            for (var r = 0; r < this.rows; r++) {
              for (var c = 0; c < this.cols; c++) {
                if (
                  this.grid[r][c] &&
                  this.grid[r][c].state === "tree" &&
                  this.grid[r][c].connected
                ) {
                  connectedCount++;
                }
              }
            }
            return Math.round((connectedCount / totalCells) * 100);
          },

          getCanopyTarget: function () {
            return this.canopyTargets[this.wave - 1] || 50;
          },

          // Initialize state
          init: function (rows, cols) {
            this.rows = rows || 4;
            this.cols = cols || 10;
            this.grid = [];
            for (var r = 0; r < this.rows; r++) {
              var row = [];
              for (var c = 0; c < this.cols; c++) {
                row.push({
                  state: "empty", // 'empty', 'sapling', 'tree', 'rock'
                  growTimer: 0,
                  connected: false,
                  variation: Math.floor(Math.random() * 5),
                  growPopTimer: 0
                });
              }
              this.grid.push(row);
            }

            // Add rock obstacles for default layouts
            if (this.cols === 10) {
              var rockCoords = [];
              if (this.rows === 4) {
                // Shifted coordinates for the 4-row layout (removing first 2 rows)
                rockCoords = [
                  [1, 1],
                  [1, 7],
                  [2, 3],
                  [3, 5],
                  [3, 8],
                ];
              } else if (this.rows === 6) {
                rockCoords = [
                  [0,1],
                  [0,2],
                  [0,3],
                  [0,4],
                  [0,7],
                  [0,8],
                  [3, 1],
                  [3, 7],
                  [4, 3],
                  [5, 5],
                  [5, 8],
                ];
              }
              var self = this;
              rockCoords.forEach(function (coord) {
                var rr = coord[0],
                  cc = coord[1];
                if (rr >= 0 && rr < self.rows && cc >= 0 && cc < self.cols) {
                  self.grid[rr][cc].state = "rock";
                }
              });
            }

            this.saplings = 12; // starts with 12 saplings (Requirement 3)
            this.wave = 1;
            this.smogPosition = this.cols; // Smog starts at the right edge
            this.smogDelay = 1.0; // short pre-smog planting delay
            this.smogMoving = false; // Starts frozen during prep delay -> upset face
            this.growthTime = this.growthTimes[0]; // starts with wave 1 growth time
            this.gameState = "INTRO";
            this.failureReason = "";
            this.timer = GOGConstants.STAGE2.gameTime; // 60 seconds from constants
            this.computeConnectivity();
          },

          // Transition state
          transitionTo: function (newState) {
            var validStates = [
              "INTRO",
              "WAVE_ACTIVE",
              "WAVE_CLEARED",
              "STAGE_WON_CUTSCENE",
              "STAGE_WON",
              "STAGE_LOST",
            ];
            if (validStates.indexOf(newState) === -1) {
              console.error(
                "[GOGStage2] Invalid game state transition to: " + newState,
              );
              return;
            }
            console.log(
              "[GOGStage2] State transition: " +
                this.gameState +
                " -> " +
                newState,
            );
            this.gameState = newState;

            if (newState === "WAVE_ACTIVE") {
              this.failureReason = "";
              this.smogDelay = 1.0;
              this.growthTime = this.growthTimes[this.wave - 1] || 1.5;
            }
          },

          // Plant a tree
          plant: function (r, c) {
            if (this.gameState !== "WAVE_ACTIVE") {
              console.warn("[GOGStage2] Cannot plant when wave is not active.");
              return false;
            }
            if (r < 0 || r >= this.rows || c < 0 || c >= this.cols)
              return false;
            if (this.grid[r][c].state !== "empty") return false;

            // Smog cell lock: disable planting if cell is engulfed by smog (crossed column)
            if (c >= Math.floor(this.smogPosition)) {
              console.log("[GOGStage2] Cannot plant: cell engulfed by smog.");
              return false;
            }

            if (this.saplings <= 0) {
              console.log("[GOGStage2] Cannot plant: 0 saplings remaining.");
              return false;
            }

            this.saplings--;
            this.grid[r][c].state = "sapling";
            this.grid[r][c].growTimer = this.growthTime;
            return true;
          },

          // Advance growth of saplings
          advanceGrowth: function (dt) {
            var grownCells = [];
            for (var r = 0; r < this.rows; r++) {
              for (var c = 0; c < this.cols; c++) {
                var cell = this.grid[r][c];
                if (cell.growPopTimer > 0) {
                  cell.growPopTimer = Math.max(0, cell.growPopTimer - dt);
                }
                if (cell.state === "sapling") {
                  cell.growTimer -= dt;
                  if (cell.growTimer <= 0) {
                    cell.state = "tree";
                    cell.growTimer = 0;
                    cell.growPopTimer = 0.5; // initialize pop animation
                    grownCells.push({ r: r, c: c });
                  }
                }
              }
            }
            if (grownCells.length > 0) {
              this.computeConnectivity();
            }
            return grownCells;
          },

          // Compute connectivity of grown trees (4-directional BFS starting from column 0, Phase 8 GC-Free Pass)
          computeConnectivity: function () {
            // 1. Reset connectivity flag for all cells
            for (var r = 0; r < this.rows; r++) {
              for (var c = 0; c < this.cols; c++) {
                this.grid[r][c].connected = false;
              }
            }

            // 2. Clear pre-allocated queue and set head index pointer
            bfsQueue.length = 0;
            var queueHead = 0;

            // 3. Find root trees in column 0, push encoded coordinates
            for (var r = 0; r < this.rows; r++) {
              var cell = this.grid[r][0];
              if (cell.state === "tree") {
                cell.connected = true;
                bfsQueue.push(r * this.cols + 0); // Encoded as: row * cols + col
              }
            }

            // 4. Standard BFS exploration directions (Up, Down, Left, Right)
            var dr = [-1, 1, 0, 0];
            var dc = [0, 0, -1, 1];

            while (queueHead < bfsQueue.length) {
              var currEncoded = bfsQueue[queueHead++];
              var cr = Math.floor(currEncoded / this.cols);
              var cc = currEncoded % this.cols;

              for (var i = 0; i < 4; i++) {
                var nr = cr + dr[i];
                var nc = cc + dc[i];

                // Check grid boundaries
                if (nr >= 0 && nr < this.rows && nc >= 0 && nc < this.cols) {
                  var neighbor = this.grid[nr][nc];
                  // Connected if neighbor is a grown tree and not visited yet
                  if (neighbor.state === "tree" && !neighbor.connected) {
                    neighbor.connected = true;
                    bfsQueue.push(nr * this.cols + nc); // Push encoded integer
                  }
                }
              }
            }
          },

          // Helper: Check if a column forms a complete vertical canopy barrier (all rows have connected trees or rock obstacles)
          isColumnBlocked: function (c) {
            if (c < 0 || c >= this.cols) return false;
            for (var r = 0; r < this.rows; r++) {
              var cell = this.grid[r][c];
              if (
                (cell.state !== "tree" || !cell.connected) &&
                cell.state !== "rock"
              ) {
                return false;
              }
            }
            return true;
          },

          // Creeps smog forward. Gaps let it through, full columns of connected trees block it.
          advanceSmog: function (dt) {
            if (this.gameState !== "WAVE_ACTIVE") return;

            var speed = this.smogSpeed[this.wave - 1] || 0.15;
            var targetPos = this.smogPosition - speed * dt;

            // Check if we hit any blocked columns as we move left
            var currentCol = Math.floor(this.smogPosition);
            var targetCol = Math.floor(targetPos);

            // Check each column between current and target (exclusive of starting, down to target)
            for (var c = currentCol; c >= targetCol; c--) {
              if (this.isColumnBlocked(c)) {
                // Blocked! Smog stops just at the right side of this column
                this.smogPosition = c + 1;
                this.smogMoving = false; // Blocked -> upset face
                return;
              }
            }

            this.smogMoving = speed * dt > 0.0001; // Actively creeping -> happy face
            this.smogPosition = Math.max(0, targetPos);

            // If smog reaches the left edge (column 0), the forest is overrun
            if (this.smogPosition <= 0) {
              this.loseWave("SMOG_REACHED_RAVI");
            }
          },

          // Handle winning the current wave
          winWave: function () {
            if (this.wave >= this.maxWaves) {
              this.transitionTo("STAGE_WON_CUTSCENE");
            } else {
              this.transitionTo("WAVE_CLEARED");
            }
          },

          // Handle losing the wave
          loseWave: function (reason) {
            this.failureReason = reason || "UNKNOWN";
            this.transitionTo("STAGE_LOST");
          },

          // Wave progress ticker
          tick: function (dt) {
            if (this.gameState !== "WAVE_ACTIVE") return [];

            this.timer -= dt;
            var grown = this.advanceGrowth(dt);

            // Pre-smog delay: smog is frozen during preparation time (Phase 7 Balance Pass)
            if (this.smogDelay > 0) {
              this.smogDelay = Math.max(0, this.smogDelay - dt);
              this.smogMoving = false; // Frozen during prep -> upset face
            } else {
              this.advanceSmog(dt);
            }

            if (this.gameState !== "WAVE_ACTIVE") return grown;

            var currentPct = this.getCanopyPercent();
            var targetPct = this.getCanopyTarget();
            if (currentPct >= targetPct) {
              this.winWave();
            } else if (this.timer <= 0) {
              this.loseWave("CANOPY_TARGET_MISSED");
            }
             return grown;
           },

          // ------------------------------------------------------------
          // CHECKPOINT UNIT TESTS
          // ------------------------------------------------------------
          runTests: function () {
            console.log(

           GOGSpriteSheet — shared sprite-sheet animation helper.

           Stage 1's dolphin (dolphine_swim.png / dolphine_attack.png) and
           Stage 2's growing plant (GrowingPlants1.png) both draw "one frame
           out of a sheet, scaled into a destination rect" every tick — that

           Where they differ is how the *frame to show* gets picked:
             - The dolphin sheet is a uniform grid (every cell 128x128 or
               256x256) and steps forward on a timer (fps), looping forever.
               -> advanceTimeLoop() + gridFrame()
             - The plant sheet is an irregular atlas (each growth stage is a
               different pixel width) and picks a frame from 0..1 grow
               progress, no looping. -> progressFrame()

           Both modes share drawFrame(), so this is one common module rather
           than two copy-pasted drawing blocks. Recommended home long-term is

        var GOGSpriteSheet = {
          // Draws one source frame {x,y,w,h} scaled to destW (aspect-ratio
          // preserved) at (cx,cy). anchor "bottom" sits the frame's bottom
          // edge on cy (good for ground-rooted sprites like plants);
          // anchor "center" (default) centers it on cy (good for the
          // free-swimming dolphin).
          drawFrame: function (ctx, img, frame, cx, cy, destW, anchor) {
            var destH = (frame.h / frame.w) * destW;
            var dx = cx - destW / 2;
            var dy = anchor === "bottom" ? cy - destH : cy - destH / 2;
            ctx.drawImage(
              img,
              frame.x,
              frame.y,
              frame.w,
              frame.h,
              dx,
              dy,
              destW,
              destH,
            );
            return destH;

          // MODE 1 — uniform grid, time-driven looping (dolphin-style).
          // anim = {frameIndex, elapsedFrameTime}, mutated in place.
          advanceTimeLoop: function (anim, dt, fps, totalFrames, onLoop) {
            anim.elapsedFrameTime += dt;
            var step = 1 / fps;
            while (anim.elapsedFrameTime >= step) {
              anim.frameIndex++;
              if (anim.frameIndex >= totalFrames) {
                anim.frameIndex = 0;
                if (onLoop) onLoop();

              anim.elapsedFrameTime -= step;

          },
          gridFrame: function (frameIndex, cols, frameW, frameH) {
            var col = frameIndex % cols;
            var row = Math.floor(frameIndex / cols);
            return { x: col * frameW, y: row * frameH, w: frameW, h: frameH };

          progressFrame: function (frames, pct) {

            if (idx < 0) idx = 0;
            if (idx >= frames.length) idx = frames.length - 1;

              var speedMultiplier = inSmog ? 1.8 : 1.0;
              f.x += f.vx * speedMultiplier * dt;
              f.frameTimer += dt * 12 * speedMultiplier;

              // Turn around at canopy edges
              if (f.vx > 0 && f.x >= maxX - 16) {
                f.x = maxX - 16;
                f.vx = -Math.abs(f.vx);
              } else if (f.vx < 0 && f.x <= minX + 16) {
                f.x = minX + 16;
                f.vx = Math.abs(f.vx);
              }
            } else if (f.type === "bees-flying") {
              if (GOGStage2.wave < 2 || minCol === -1) return;

              // Force bees inside canopy limits
              if (f.x < minX || f.x > maxX) {
                f.x = minX + Math.random() * (maxX - minX);
              }

              var speedMultiplier = inSmog ? 0.5 : 1.0;
              f.x += f.vx * speedMultiplier * dt;
              
              // Smooth hovering oscillation (fix jumping)
              f.wobble += dt * 3.5;
              f.y = f.baseY + Math.sin(f.wobble) * 6;
              f.frameIndex = Math.floor(state.elapsed * 12) % 8;

              // Turn around at canopy edges
              if (f.vx > 0 && f.x >= maxX - 12) {
                f.x = maxX - 12;
                f.vx = -Math.abs(f.vx);
              } else if (f.vx < 0 && f.x <= minX + 12) {
                f.x = minX + 12;
                f.vx = Math.abs(f.vx);
              }
            }
          });
        }

        function drawAmbientFauna(ctx) {
          ctx.save();

          // Find canopy bounds
          var minCol = -1;
          for (var c = 0; c < GOGStage2.cols; c++) {
            var hasConnected = false;
            for (var r = 0; r < GOGStage2.rows; r++) {
              if (
                GOGStage2.grid[r] &&
                GOGStage2.grid[r][c] &&
                GOGStage2.grid[r][c].state === "tree" &&
                GOGStage2.grid[r][c].connected
              ) {
                hasConnected = true;
                break;
              }
            }
            if (hasConnected) {
              minCol = c;
              break;
            }
          }

          state.ambientFauna.forEach(function (f) {
            ctx.save();
            if (f.type === "flying-bird") {
              if (GOGStage2.wave < 3) {
                ctx.restore();
                return;
              }
              var frame = Math.floor(f.flapTimer) % 2;
              var hasImage = flyingBirdsImg && flyingBirdsImg.complete && flyingBirdsImg.naturalWidth > 0;
              if (hasImage) {
                var sw = Math.round(flyingBirdsImg.naturalWidth / 2);
                var sh = flyingBirdsImg.naturalHeight;
                var sx = frame * sw;
                ctx.translate(f.x, f.y);
                if (f.vx < 0) ctx.scale(-1, 1);
                
                var displayH = f.h;
                var scale = displayH / sh;
                var dw = sw * scale;
                var dh = sh * scale;
                ctx.drawImage(flyingBirdsImg, sx, 0, sw, sh, -dw / 2, -dh / 2, dw, dh);
              } else {
                ctx.translate(f.x, f.y);
                if (f.vx < 0) ctx.scale(-1, 1);
                ctx.font = "24px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                // ctx.fillText("🐦", 0, 0);
              }
            } else if (f.type === "deer-run") {
              if (GOGStage2.wave < 2 || minCol === -1) {
                ctx.restore();
                return;
              }
              var frame = Math.floor(f.frameTimer) % 6;
              var hasImage = deerRunImg && deerRunImg.complete && deerRunImg.naturalWidth > 0;
              if (hasImage) {
                var sw = 32;
                var sh = 32;
                var sx = frame * sw;
                ctx.translate(f.x, f.y);
                if (f.vx < 0) ctx.scale(-1, 1);
                ctx.drawImage(deerRunImg, sx, 0, sw, sh, -40, -70, 80, 80);
              } else {
                ctx.translate(f.x, f.y);
                if (f.vx < 0) ctx.scale(-1, 1);
                ctx.font = "48px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                // ctx.fillText("🦌", 0, -12);
              }
            } else if (f.type === "bees-flying") {
              if (GOGStage2.wave < 2 || minCol === -1) {
                ctx.restore();
                return;
              }
              var col = f.frameIndex % 4;
              var row = Math.floor(f.frameIndex / 4);
              var hasImage = beesFlyingImg && beesFlyingImg.complete && beesFlyingImg.naturalWidth > 0;
              if (hasImage) {
                var sw = 256;
                var sh = 256;
                var sx = col * sw;
                var sy = row * sh;
                ctx.translate(f.x, f.y);
                if (f.vx < 0) ctx.scale(-1, 1);
                ctx.drawImage(beesFlyingImg, sx, sy, sw, sh, -28, -28, 56, 56);
              } else {
                ctx.translate(f.x, f.y);
                if (f.vx < 0) ctx.scale(-1, 1);
                ctx.font = "32px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                // ctx.fillText("🐝", 0, 0);
              }
            }
            ctx.restore();
          });
          ctx.restore();
        }

        // --- DIVERSE procedurally drawn trees & connections ---
        function drawTreeConnection(ctx, x1, y1, x2, y2) {
          ctx.save();
          ctx.strokeStyle = "#5c4033";
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(x1, y1 - 10);
          ctx.lineTo(x2, y2 - 10);
          ctx.stroke();

          ctx.strokeStyle = "#2fbf71";
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          var dist = Math.hypot(x2 - x1, y2 - y1);
          var steps = 12;
          for (var i = 0; i <= steps; i++) {
            var t = i / steps;
            var cx = x1 + (x2 - x1) * t;
            var cy = y1 + (y2 - y1) * t - 10;
            var offset = Math.sin(t * Math.PI * 4 + state.elapsed * 2) * 5;
            var px = -(y2 - y1) / dist;
            var py = (x2 - x1) / dist;
            ctx.lineTo(cx + px * offset, cy + py * offset);
          }
          ctx.stroke();

          ctx.fillStyle = "rgba(47, 191, 113, 0.85)";
          for (var i = 1; i < steps; i += 2) {
            var t = i / steps;
            var cx = x1 + (x2 - x1) * t;
            var cy = y1 + (y2 - y1) * t - 22;
            ctx.beginPath();
            ctx.arc(cx, cy, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(163, 230, 53, 0.4)";
            ctx.beginPath();
            ctx.arc(cx - 3, cy - 3, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "rgba(47, 191, 113, 0.85)";
          }
          ctx.restore();
        }

        function drawProceduralTree(ctx, cx, cy, cellW, cellH, variation, connected, sway, isEngulfed, popScale) {
          ctx.save();
          // Translate to center bottom of grid cell (where trunk roots grow)
          ctx.translate(cx + sway, cy + cellH / 2 - 6);
          ctx.scale(popScale, popScale);

          // Tree Diversity (Requirement 9): Randomize size, height, and tilt based on variation index
          var sizeMultiplier = 0.85 + (variation % 3) * 0.12; // 0.85x to 1.09x width
          var heightMultiplier = 0.88 + ((variation + 2) % 3) * 0.12; // 0.88x to 1.12x height
          var tilt = ((variation % 4) - 1.5) * 0.045; // slight organic tilt (-0.067 to +0.067 rad)
          ctx.rotate(tilt);

          var treeDestW = cellW * TREE_SIZE_SCALE * sizeMultiplier;

          // Apply filters for smog or dynamic color/shade diversity (Requirement 9 & 8)
          if (isEngulfed) {
            ctx.filter = "grayscale(1) brightness(0.58) contrast(0.95)";
          } else {
            var varietyFilter = "";
            if (variation === 1) {
              varietyFilter = "hue-rotate(-12deg) saturate(1.15)";
            } else if (variation === 2) {
              varietyFilter = "hue-rotate(18deg) brightness(0.92)";
            } else if (variation === 3) {
              varietyFilter = "hue-rotate(-25deg) saturate(1.25) brightness(1.04)";
            } else if (variation === 4) {
              varietyFilter = "brightness(1.08) saturate(1.05)";
            }
            
            if (!connected) {
              varietyFilter = "grayscale(0.4) saturate(0.6) " + varietyFilter;
            }
            ctx.filter = varietyFilter || "none";
          }

          // Pick the correct sprite image (connected canopy vs disconnected branches)
          var img = connected ? treeImg : treeDisImg;

          if (img && img.complete && img.width > 0) {
            var destH = (img.height / img.width) * treeDestW * heightMultiplier;
            ctx.drawImage(
              img,
              -treeDestW / 2,
              -destH,
              treeDestW,
              destH
            );
          } else {
            // Fallback to emoji if image is failed/missing
            ctx.save();
            ctx.font = Math.round(52 * sizeMultiplier) + "px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "bottom";
            ctx.fillText(connected ? "🌳" : "🌿", 0, 0);
            ctx.restore();
          }

          ctx.restore();
        }

        // --- PARALLAX, FOG & FOREGROUND SYSTEM ---
        function drawForegroundGrass(elapsed) {
          ctx.save();
          ctx.fillStyle = "#1b4322";
          ctx.strokeStyle = "#276332";
          ctx.lineWidth = 2.5;
          var bladeWidth = 14;
          var growthFactor = 0.5 + (state.canopyPercent / 100) * 0.8;
          for (var x = 0; x < W; x += 14) {
            var height = (24 + Math.sin(x * 0.05 + elapsed * 2.2) * 6) * growthFactor;
            var sway = Math.sin(elapsed * 1.6 + x * 0.1) * 5;
            ctx.beginPath();
            ctx.moveTo(x, H);
            ctx.quadraticCurveTo(x + sway, H - height * 0.65, x + sway * 1.4, H - height);
            ctx.quadraticCurveTo(x + sway * 0.5, H - height * 0.35, x + bladeWidth, H);
            ctx.fill();
            ctx.stroke();
          }
          if (state.canopyPercent > 12) {
            ctx.font = "14px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "bottom";
            var flowerSpacing = Math.max(30, 160 - Math.floor(state.canopyPercent / 100 * 120));
            for (var fx = 30; fx < W; fx += flowerSpacing) {
              var fGlyph = (fx % 3 === 0) ? "🌸" : "🌼";
              var swayY = Math.sin(elapsed * 1.5 + fx) * 1.5;
              ctx.fillText(fGlyph, fx, H - 2 + swayY);
            }
          }
          ctx.restore();
        }

        function drawFog(elapsed) {
          ctx.save();
          for (var i = 0; i < 2; i++) {
            var speed = (i === 0) ? 12 : 22;
            var fogY = H / 2 - 30 + i * 25;
            var smogRatio = GOGStage2.smogPosition / GOGStage2.cols;
            var fogColor = "rgba(220, 238, 220, " + (0.16 - i * 0.05) + ")";
            if (smogRatio < 0.6) {
              fogColor = "rgba(140, 148, 130, " + (0.24 - i * 0.05) + ")";
            }
            ctx.fillStyle = fogColor;
            ctx.beginPath();
            ctx.moveTo(0, fogY);
            for (var x = 0; x <= W; x += 40) {
              var waveY = fogY + Math.sin(x * 0.015 + elapsed * 0.7 + i * 2) * 12;
              ctx.lineTo(x, waveY);
            }
            ctx.lineTo(W, H);
            ctx.lineTo(0, H);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        }

        // --- VICTORY CINEMATIC ---
        function drawStageWonCutscene() {
          var time = state.cutsceneTime || 0;
          var cellW = W / GOGStage2.cols;
          var gridH = GRID_H;
          var gridYOffset = GRID_Y_OFFSET;
          var canopyProgress = Math.min(1.0, time / 1.5);
          ctx.save();
          ctx.fillStyle = "rgba(47, 191, 113, " + (canopyProgress * 0.35) + ")";
          ctx.fillRect(0, gridYOffset - 30, W, gridH + 30);
          ctx.restore();

          if (time > 1.0) {
            var rayAlpha = Math.min(0.4, (time - 1.0) / 1.2);
            ctx.save();
            ctx.globalAlpha = rayAlpha;
            var rayColors = ["rgba(255, 250, 200, 0.25)", "rgba(255, 240, 170, 0.2)", "rgba(255, 255, 225, 0.15)"];
            var rayPositions = [60, 220, 420, 680];
            rayPositions.forEach(function (ox, idx) {
              ctx.fillStyle = rayColors[idx % rayColors.length];
              ctx.beginPath();
              ctx.moveTo(ox, 0);
              ctx.lineTo(ox + 90, 0);
              ctx.lineTo(ox + 220, H);
              ctx.lineTo(ox + 80, H);
              ctx.closePath();
              ctx.fill();
            });
            ctx.restore();
          }

          if (state.cutsceneBirds) {
            ctx.save();
            // ctx.font = "24px sans-serif";
            // ctx.fillStyle = "#111";
            // state.cutsceneBirds.forEach(function (b) {
            //   ctx.fillText("🐦", b.x, b.y + Math.sin(b.x * 0.05) * 8);
            // });
            // ctx.restore();
          }

          if (time > 2.0) {
            var treeProgress = Math.min(1.0, (time - 2.0) / 1.5);
            var treeScale = treeProgress * 150;
            ctx.save();
            ctx.translate(W / 2, H / 2 + 50);
            ctx.font = treeScale + "px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "bottom";
            ctx.shadowColor = "gold";
            ctx.shadowBlur = 30;
            ctx.fillText("🌳", 0, 0);
            if (time > 3.0) {
              ctx.shadowBlur = 4;
              ctx.font = "800 24px 'Baloo 2', sans-serif";
              ctx.fillStyle = "gold";
              ctx.strokeStyle = "#111";
              ctx.lineWidth = 4.5;
              ctx.strokeText("Tree of Gala", 0, -170);
              ctx.fillText("Tree of Gala", 0, -170);
            }
            ctx.restore();
          }

          if (time > 2.8) {
            var seedProgress = Math.min(1.0, (time - 2.8) / 1.7);
            var seedY = H / 2 - 20 - seedProgress * 220;
            if (seedY > -50) {
              ctx.save();
              ctx.font = "30px sans-serif";
              ctx.shadowColor = "#a3e635";
              ctx.shadowBlur = 20;
              ctx.fillText("🌱", W / 2, seedY);
              ctx.restore();
            }
          }

          if (time > 1.5) {
            ctx.save();
            ctx.font = "18px sans-serif";
            for (var aIdx = 0; aIdx < state.wildlife.length; aIdx++) {
              var anim = state.wildlife[aIdx];
              if (Math.sin(time * 5 + aIdx) > 0.4) {
                ctx.fillText("❤️", anim.x, anim.y - 70 + Math.sin(time * 5) * 8);
              }
            }
            ctx.restore();
          }
        }

        var state = {

        /* ---------------- parallax background layers ---------------- */
        var layers = [

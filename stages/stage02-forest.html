        // hazard-stripe boundary: ink line with amber dashes marching along it
        function dashedPath(g, xs, ys, n, dash, gap, offset, color, width) {
          var total = 0, i;
          var period = dash + gap;
          var acc = ((offset % period) + period) % period; // distance already travelled into the pattern
          var drawing = acc < dash;
          var remain = drawing ? dash - acc : period - acc;
          for (i = 0; i < n; i++) {
            var x0 = xs[i], y0 = ys[i], x1 = xs[i + 1], y1 = ys[i + 1];
            var segLen = Math.hypot(x1 - x0, y1 - y0);
            var pos = 0;
            while (pos < segLen) {
              var step = Math.min(remain, segLen - pos);
              if (drawing) {
                g.moveTo(x0 + ((x1 - x0) * pos) / segLen, y0 + ((y1 - y0) * pos) / segLen);
                g.lineTo(x0 + ((x1 - x0) * (pos + step)) / segLen, y0 + ((y1 - y0) * (pos + step)) / segLen);
              }
              pos += step;
              remain -= step;
              if (remain <= 0.0001) {
                drawing = !drawing;
                remain = drawing ? dash : gap;
              }
            }
          }
          g.stroke({ width: width, color: color, cap: "round", join: "round" });
        }
        var smogEx = [], smogEy = [];
        function syncSmog() {
          var visible = !calmMode && GOGStage2.smogPosition < GOGStage2.cols;
          nodes.smogC.visible = visible;
          if (!visible) return;
          var cellW = W / GOGStage2.cols;
          var smogX = GOGStage2.smogPosition * cellW;
          var ft = state.elapsed * 3.5;
          var edgeTop = GRID_Y_OFFSET - 6, edgeBottom = GRID_Y_OFFSET + GRID_H + 6;
          var i, y;
          for (i = 0; i <= 26; i++) {
            y = edgeTop + ((edgeBottom - edgeTop) * i) / 26;
            smogEy[i] = y;
            smogEx[i] = smogX + Math.sin(y * 0.045 + ft) * 12 + Math.cos(y * 0.09 - ft * 0.7) * 6;
          }
          var g = nodes.smogBody;
          g.clear();
          g.moveTo(W + 4, edgeTop);
          for (i = 0; i <= 26; i++) g.lineTo(smogEx[i], smogEy[i]);
          g.lineTo(W + 4, edgeBottom);
          g.closePath();
          g.fill({ color: 0xa39dc0, alpha: 0.82 });
          // soft rolling bands inside the body
          var bandH = GRID_H / 3;
          var bandCols = [0xb8b2d0, 0x8f88ae, 0xd3cee6];
          for (var band = 0; band < 3; band++) {
            var bp = ft * (0.6 + band * 0.25) + band * 2.1;
            var by = GRID_Y_OFFSET + band * bandH - 10 + Math.sin(bp) * 8;
            g.moveTo(Math.max(smogX - 30, 0), by);
            for (var bx = Math.max(smogX - 30, 0); bx <= W + 20; bx += 16) g.lineTo(bx, by + Math.sin(bx * 0.05 + bp) * 10);
            g.lineTo(W + 20, by + bandH * 0.6 + 30);
            for (var bx2 = W + 20; bx2 >= Math.max(smogX - 30, 0); bx2 -= 16) g.lineTo(bx2, by + bandH * 0.6 + 30 + Math.sin(bx2 * 0.05 + bp + 1.4) * 10);
            g.closePath();
            g.fill({ color: bandCols[band], alpha: 0.35 });
          }
          // fluffy faceless puffs along the front
          nodes.smogPuffs.begin();
          for (var sy = GRID_Y_OFFSET - 15; sy <= H + 40; sy += 35) {
            var clusterX = smogX + Math.sin(sy * 0.04 + ft) * 14;
            var baseR = 42 + Math.cos(sy * 0.08 + ft) * 5;
            var ps = nodes.smogPuffs.next();
            ps.texture = art.smogCluster.tex;
            var k = baseR / 42;
            ps.width = art.smogCluster.w * k * 0.95;
            ps.height = art.smogCluster.h * k * 0.95;
            ps.position.set(clusterX - 4, sy);
          }
          nodes.smogPuffs.end();
          // hazard-stripe edge
          var eg = nodes.smogEdge;
          eg.clear();
          eg.moveTo(smogEx[0], edgeTop);
          for (i = 0; i <= 26; i++) eg.lineTo(smogEx[i], smogEy[i]);
          eg.stroke({ width: 8, color: 0x111111, cap: "round", join: "round" });
          dashedPath(eg, smogEx, smogEy, 26, 13, 13, state.elapsed * 45, 0xffb020, 6);
          // label pill: sits on the front edge, white so it reads on any background
          if (nodes.smogLabel.texture && art.smogLabel) {
            nodes.smogLabel.visible = true;
            nodes.smogLabel.position.set(Math.min(smogX + 90, W - art.smogLabel.w / 2 - 6), GRID_Y_OFFSET + GRID_H * 0.3);
          } else {
            nodes.smogLabel.visible = false;
          }
        }

        function syncCutscene() {
          var on = GOGStage2.gameState === "STAGE_WON_CUTSCENE";
          nodes.cutC.visible = on;
          if (!on) return;
          var time = state.cutsceneTime || 0;
          var g = nodes.cutG;
          g.clear();
          var cp = Math.min(1.0, time / 1.5);
          g.rect(0, GRID_Y_OFFSET - 30, W, GRID_H + 30).fill({ color: 0x2fbf71, alpha: cp * 0.35 });
          if (time > 1.0) {
            var ra = Math.min(0.4, (time - 1.0) / 1.2);
            var X = [60, 220, 420, 680];
            for (var ri = 0; ri < X.length; ri++) {
              var ox = X[ri];
              g.poly([ox, 0, ox + 90, 0, ox + 220, H, ox + 80, H]).fill({ color: 0xfff6c9, alpha: ra * 0.7 });
            }
          }
          // grown tree + label
          var tp = Math.min(1.0, (time - 2.0) / 1.5);
          var tree = nodes.cutTree;
          if (time > 2.0) {
            var te = GOGRender.emojiTex("🌳", 150);
            tree.visible = true;
            tree.texture = te.tex;
            tree.width = te.w * tp;
            tree.height = te.h * tp;
            tree.position.set(W / 2, H / 2 + 50);
          } else tree.visible = false;
          nodes.galaLabel.visible = time > 3.0 && !!art.galaLabel;
          if (nodes.galaLabel.visible) nodes.galaLabel.position.set(W / 2, H / 2 + 50 - 170);
          if (time > 2.8) {
            var sp = Math.min(1.0, (time - 2.8) / 1.7);
            var sy = H / 2 - 20 - sp * 220;
            var se = GOGRender.emojiTex("🌱", 30);
            nodes.cutSeed.visible = sy > -50;
            nodes.cutSeed.texture = se.tex;
            nodes.cutSeed.width = se.w;
            nodes.cutSeed.height = se.h;
            nodes.cutSeed.position.set(W / 2, sy);
          } else nodes.cutSeed.visible = false;
          nodes.cutHearts.begin();
          if (time > 1.5) {
            var he = GOGRender.emojiTex("❤️", 18);
            for (var ai = 0; ai < state.wildlife.length; ai++) {
              var an = state.wildlife[ai];
              if (Math.sin(time * 5 + ai) > 0.4) {
                var hs = nodes.cutHearts.next();
                hs.texture = he.tex;
                hs.width = he.w;
                hs.height = he.h;
                hs.position.set(an.x, an.y - 70 + Math.sin(time * 5) * 8);
              }
            }
          }
          nodes.cutHearts.end();
        }

        function syncGrass(t) {
          var growth = 0.5 + (state.canopyPercent / 100) * 0.8;
          nodes.grass.begin();
          var bi = 0;
          for (var x = 0; x < W; x += 14, bi++) {
            var height = (24 + Math.sin(x * 0.05 + t * 2.2) * 6) * growth;
            var sway = Math.sin(t * 1.6 + x * 0.1) * 5;
            var s = nodes.grass.next();
            s.anchor.set(0.5, 1);
            s.texture = art.blade.tex;
            s.width = 16;
            s.height = height * 1.25;
            s.position.set(x + 7, H + 2);
            s.rotation = sway * 0.03;
          }
          nodes.grass.end();
          nodes.flowers.begin();
          if (state.canopyPercent > 12) {
            var spacing = Math.max(30, 160 - Math.floor((state.canopyPercent / 100) * 120));
            var pink = GOGRender.emojiTex("🌸", 14), yellow = GOGRender.emojiTex("🌼", 14);
            for (var fx = 30; fx < W; fx += spacing) {
              var e = fx % 3 === 0 ? pink : yellow;
              var fs = nodes.flowers.next();
              fs.texture = e.tex;
              fs.width = e.w;
              fs.height = e.h;
              fs.position.set(fx, H - 14 + Math.sin(t * 1.5 + fx) * 1.5);
            }
          }
          nodes.flowers.end();
        }

        function syncOverlays() {
          // smog breach: brief grey wash + shake (replaces the live ctx.filter flash)
          var dt = state.desaturateTime > 0 ? Math.min(1, state.desaturateTime / 0.25) : 0;
          R.flash(0x8e86ac, dt * 0.35, "breach");
          if (!winWiping && !winWipeDone) {
            nodes.wipeFull.visible = nodes.wipeDisc.visible = nodes.wipeRing.visible = false;
            return;
          }
          if (winWipeDone) {
            nodes.wipeFull.visible = true;
            nodes.wipeDisc.visible = false;
            nodes.wipeRing.visible = false;
          } else {
            var r = winWipeRadius;
            nodes.wipeFull.visible = false;
            nodes.wipeDisc.visible = true;
            nodes.wipeDisc.width = nodes.wipeDisc.height = Math.max(2, r * 2);
            nodes.wipeRing.visible = true;
            nodes.wipeRing.clear().circle(W / 2, H / 2, r).stroke({ width: 6, color: 0x111111 });
          }
        }

        function syncAll() {
          var t = state.elapsed;
          syncBackdrop(t);
          syncRavi();
          syncGrid(t);
          syncWildlife();
          syncCreatures(t);
          syncClouds();
          syncSmog();
          syncCutscene();
          syncGrass(t);
          nodes.particles.sync();
          syncOverlays();
        }

        var staticDrawn = false;
        function particlesActive() {
          var pool = particles.pool;
          for (var i = 0; i < pool.length; i++) {
            if (pool[i].active) return true;
          }
          return false;
        }

        function draw() {
          if (GOGUi.paused || !sceneReady) return; // "How to play" pop-up is open / still loading
          // A finished / overlaid scene (intro, wave cleared, win, lose) stands
          // still: paint it once, then leave the canvas alone.
          if (state.running || winWiping || state.desaturateTime > 0 || state.screenShake > 0 || particlesActive()) {
            staticDrawn = false;
          } else if (staticDrawn) {
            return;
          } else {
            staticDrawn = true;
          }
          var shakeX = 0, shakeY = 0;
          if (state.screenShake > 0) {
            shakeX = (Math.random() - 0.5) * state.screenShake;
            shakeY = (Math.random() - 0.5) * state.screenShake;
          }
          R.shake(shakeX, shakeY);
          ensureLabels();
          syncAll();
          if (coach.active && state.running) drawCoachHints(nodes.coachOverlay.begin());
          else nodes.coachOverlay.hide();
          R.render();
        }

        /* ---------------- guided lesson ----------------
           Three short steps the first time the stage opens in a session (the
           ❓ button replays them): tap a cloud, plant a tree, keep it
           connected to Ravi's vine. Smog and the countdown are paused while
           it runs (see update()), so nobody can lose during the lesson. */
        var COACH_STEPS = [
          { icon: "☁️", title: "Tap a cloud", text: "Tap a <b>cloud</b> to get baby trees 🌱", say: "Tap a cloud to get baby trees." },
          { icon: "🌱", title: "Plant a tree", text: "Tap the <b>green ring</b> to plant your baby tree.", say: "Tap the green ring to plant your baby tree." },
          { icon: "🌳", title: "Make a chain", text: "Keep your trees in a chain, back to <b>Ravi</b> on the left.", say: "Keep your trees in a chain, back to Ravi on the left, so they stay green and strong." },
        ];
        var coachStartSaplings = 0;
        var coachStep2At = 0;

        var coach = GOGCoach.create({
          stageId: STAGE_ID,
          frame: canvasFrame,
          steps: COACH_STEPS,
          onStep: function (i) {
            if (i === 0) {
              coachStartSaplings = GOGStage2.saplings;
              ensureCoachCloud();
            } else if (i === 2) {
              coachStep2At = state.elapsed;
            }
          },
          onFinish: function (reason) {
            GOGUi.say(
              reason === "done"
                ? "Great! Keep planting trees before the smog arrives! 🌳"
                : "Let's plant trees before the smog arrives! 🌳",
            );
          },
        });

        function coachCloud() {
          for (var i = 0; i < state.clouds.length; i++) {
            var c = state.clouds[i];
            // below the lesson banner, so it can actually be tapped
            if (c.active && !c.raining && c.x > 70 && c.x < W - 70 && c.y > 125) return c;
          }
          return null;
        }
        function ensureCoachCloud() {
          if (coachCloud()) return;
          state.clouds.push({
            x: W * 0.62, y: 168, vx: -14, vy: 0, size: 50, active: true,
            raining: false, rainTimer: 0, dropSpawnTimer: 0, drops: [],
          });
        }
        function countPlanted() {
          var n = 0;
          for (var r = 0; r < GOGStage2.rows; r++) {
            for (var c = 0; c < GOGStage2.cols; c++) {
              var s = GOGStage2.grid[r][c].state;
              if (s === "sapling" || s === "tree") n++;
            }
          }
          return n;
        }

        function updateCoach() {
          if (!coach.active) return;
          var i = coach.index;
          if (i === 0) {
            var tapped = GOGStage2.saplings > coachStartSaplings || state.clouds.some(function (c) { return c.raining; });
            if (tapped || countPlanted() > 0) coach.advance();
            else ensureCoachCloud();
          } else if (i === 1) {
            if (countPlanted() > 0) coach.advance();
          } else if (i === 2) {
            if (state.elapsed - coachStep2At > 7) coach.advance();
          }
        }

        function drawCoachHints(ctx) {
          if (!coach.active || !state.running) return;
          var t = coach.t, i = coach.index;
          var cellW = W / GOGStage2.cols;
          var cellH = GRID_H / GOGStage2.rows;
          ctx.save();
          if (i === 0) {
            var cl = coachCloud();
            if (cl) {
              GOGCoach.ring(ctx, cl.x, cl.y, 54, t);
              GOGCoach.hand(ctx, cl.x, cl.y + 4, t, false);
              GOGCoach.tag(ctx, cl.x, cl.y - 62, "Tap the cloud!");
            }
          } else if (i === 1) {
            var spot = findSuggestedPlantCell();
            if (spot) {
              var sx = spot.c * cellW + cellW / 2;
              var sy = GRID_Y_OFFSET + spot.r * cellH + cellH / 2;
              GOGCoach.arrow(ctx, sx, sy - 34, t, "down");
              GOGCoach.tag(ctx, sx, Math.max(110, sy - 92), "Tap the ring!");
            } else if (GOGStage2.saplings <= 0) {
              var cl2 = coachCloud();
              if (cl2) GOGCoach.tag(ctx, cl2.x, cl2.y - 62, "Tap a cloud for saplings");
            }
          } else if (i === 2) {
            var vy = GRID_Y_OFFSET + GRID_H * 0.45;
            GOGCoach.arrow(ctx, 26, vy, t, "left");
            GOGCoach.tag(ctx, 160, vy, "Chain back to Ravi");
          }
          ctx.restore();
        }

        var helpBtn = document.getElementById("helpBtn");
        if (helpBtn) {
          helpBtn.addEventListener("click", function () {
            if (!state.running) return;
            resetStage();
            coach.start();
          });
        }

        /* ---------------- start ---------------- */
        var loop = new GOGEngine.GameLoop({
          update: update,
          draw: draw,
        });

        // The intro backdrop is drawn before the first wave starts; give it a real
        // (empty) grid instead of relying on the unit tests having left one behind.
        GOGStage2.init(GRID_ROWS, GRID_COLS);
        GOGStage2.gameState = "WAVE_ACTIVE";

        initBackground().then(function (ok) {
          if (!ok) return; // no WebGL: GOGRender already explained it on screen
          loop.start();
          showRaviIntroBeat();
        });
      })();
    </script>
  </body>
</html>

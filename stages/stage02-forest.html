          }

          // Handle state machine changes
          if (GOGStage2.gameState === "WAVE_CLEARED") {
            endWaveCleared();
          } else if (GOGStage2.gameState === "STAGE_WON") {
            endWin();
          } else if (GOGStage2.gameState === "STAGE_LOST") {
            endLose();
          }

          // Update HUD — one shared grid scan; DOM writes only when a value changed
          refreshCanopy();
          var totalCells = GOGStage2.rows * GOGStage2.cols;
          var canopyPercent = Math.round((canopyCount / totalCells) * 100);
          var canopyTarget = GOGStage2.getCanopyTarget();
          if (canopyPercent !== hudLast.pct || canopyTarget !== hudLast.target) {
            hudLast.pct = canopyPercent;
            hudLast.target = canopyTarget;
            GOGUi.setStyle(canopyFill, "width", canopyPercent + "%");
            GOGUi.setText(canopyPct, canopyPercent + "% / " + canopyTarget + "%");
          }
          state.canopyPercent = canopyPercent;
          updateWildlife(dt);
          updateAmbientCreatures(dt);

          if (GOGStage2.saplings !== hudLast.sap) {
            hudLast.sap = GOGStage2.saplings;
            GOGUi.setText(sproutsChip, GOGStage2.saplings);
          }
          var delayShown = GOGStage2.smogDelay > 0 && !calmMode;
          var timerSecs = calmMode ? -1 : Math.ceil(GOGStage2.timer);
          if (timerSecs !== hudLast.timer || delayShown !== hudLast.delay) {
            hudLast.timer = timerSecs;
            hudLast.delay = delayShown;
            GOGUi.setText(timerChip, calmMode ? "∞" : timerSecs + "s");
            GOGUi.setStyle(timerChip, "backgroundColor", delayShown ? "var(--gog-sun)" : "");
            GOGUi.setStyle(timerChip, "color", delayShown ? "var(--gog-ink)" : "");
          }
          if (GOGStage2.wave !== hudLast.wave) {
            hudLast.wave = GOGStage2.wave;
            GOGUi.setText(difficultyChip, "⚡ Wave " + GOGStage2.wave);
          }
        }

        /* ---------------- draw loop ---------------- */
        /* ---------------- draw loop ---------------- */
        var wipeGrad = null;
        function drawWinWipe() {
          if (!winWiping && !winWipeDone) return;
          var r = winWipeDone ? winWipeMax : winWipeRadius;
          // One gradient (built once at the final radius) scaled with the circle,
          // instead of a new radial gradient every frame.
          if (!wipeGrad) {
            wipeGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, winWipeMax);
            wipeGrad.addColorStop(0, "#FFD23F");
            wipeGrad.addColorStop(0.55, "#a3e635");
            wipeGrad.addColorStop(1, "#2E7D32");
          }
          var k = (r || 1) / winWipeMax;
          ctx.save();
          ctx.beginPath();
          ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2);
          ctx.clip();
          ctx.translate(W / 2, H / 2);
          ctx.scale(k, k);
          ctx.globalAlpha = 0.85;
          ctx.fillStyle = wipeGrad;
          ctx.fillRect(-W / (2 * k) - 2, -H / (2 * k) - 2, W / k + 4, H / k + 4);
          ctx.restore();

          if (winWiping) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2);
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#111";
            ctx.stroke();
            ctx.restore();
          }
        }

        // NEW: "suggested spot" easy-mode helper — picks one empty, plantable
        // cell to glow: prefers cells next to existing growth (builds a
        // connected canopy), then the cell nearest the smog front (most urgent).
        // Shown only in calm mode or once auto-easing has kicked in, so it
        // stays a helping hand for struggling/young kids without removing the
        // planning challenge for everyone else.
        // Allocation-free (it runs every frame while the hint is showing); the
        // returned object is reused, so read it before calling again.
        var suggestBest = { r: 0, c: 0 };
        var DR4 = [-1, 1, 0, 0];
        var DC4 = [0, 0, -1, 1];
        function findSuggestedPlantCell() {
          if (GOGStage2.gameState !== "WAVE_ACTIVE") return null;
          if (GOGStage2.saplings <= 0) return null;
          var grid = GOGStage2.grid;
          var rows = GOGStage2.rows;
          var cols = GOGStage2.cols;
          var smogCol = Math.floor(GOGStage2.smogPosition);
          var found = false;
          var bestScore = -Infinity;
          // Before anything is planted, the best first move is next to Ravi's
          // root (column 0), so the first tree is connected from the start.
          var anyGrowth = false;
          for (var gr = 0; gr < rows && !anyGrowth; gr++) {
            for (var gc = 0; gc < cols; gc++) {
              var gs = grid[gr][gc].state;
              if (gs === "tree" || gs === "sapling") { anyGrowth = true; break; }
            }
          }
          for (var r = 0; r < rows; r++) {
            for (var c = 0; c < cols; c++) {
              var cell = grid[r][c];
              if (cell.state !== "empty" || c >= smogCol) continue;
              var adjacentGrowth = 0;
              for (var n = 0; n < 4; n++) {
                var nr = r + DR4[n], nc = c + DC4[n];
                if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                  var ns = grid[nr][nc].state;
                  if (ns === "tree" || ns === "sapling") adjacentGrowth++;
                }
              }
              var score = adjacentGrowth * 100 - (smogCol - c);
              if (!anyGrowth) score = (c === 0 ? 1000 : 0) - Math.abs(r - 1);
              if (score > bestScore) {
                bestScore = score;
                suggestBest.r = r;
                suggestBest.c = c;
                found = true;
              }
            }
          }
          return found ? suggestBest : null;
        }

        // NEW: Ravi's character arc — mood/pace tracks canopy health, with
        // a one-time dialogue line and pounce bounce at each threshold.
        function updateRaviCharacter(dt) {
          var pct = state.canopyPercent || 0;
          var stage = pct >= 80 ? 2 : pct >= 30 ? 1 : 0;

          // Walk-cycle speed reflects mood: slow/nervous when scared, brisk
          // and bouncy once the canopy is thriving.
          var animSpeed = stage === 0 ? 3.5 : stage === 1 ? 6 : 9;
          raviAnimTimer += dt * animSpeed;
          raviFrame = Math.floor(raviAnimTimer) % 6;

          if (raviPounce > 0) raviPounce = Math.max(0, raviPounce - dt * 1.6);

          if (stage > raviArcStage && GOGStage2.gameState === "WAVE_ACTIVE") {
            raviArcStage = stage;
            if (stage === 0) {
              GOGUi.say("They cut down my home… I'm scared, but I see you planting! 🐯");
            } else if (stage === 1) {
              GOGUi.say("The canopy's coming back — I feel braver already! 🌳");
            } else if (stage === 2) {
              raviPounce = 1;
              GOGUi.say("My forest is alive again! Thank you! 🐯🎉");
            }
          }
        }

        function drawRaviCharacter() {
          if (!tigerImg || !tigerImg.complete || !tigerImg.width) return;
          var stage = state.canopyPercent >= 80 ? 2 : state.canopyPercent >= 30 ? 1 : 0;

          var frameW = tigerImg.width / 2;
          var frameH = tigerImg.height / 3;
          var col = raviFrame % 2;
          var row = Math.floor(raviFrame / 2);

          // Anchored in the sky band, left of the grid, watching his grove.
          var baseX = 58;
          var baseY = GRID_Y_OFFSET - 46;
          var drawSize = 72;

          var bob = Math.sin(state.elapsed * (stage === 0 ? 2 : stage === 1 ? 3 : 4.5)) * (stage === 0 ? 2 : 4);
          var pounceScale = 1 + raviPounce * 0.35;
          var pounceLift = raviPounce * 18;

          ctx.save();
          ctx.translate(baseX + drawSize / 2, baseY + drawSize / 2 + bob - pounceLift);
          ctx.scale(pounceScale, pounceScale);
          // Nervous trembling jitter while scared
          if (stage === 0) {
            ctx.translate((Math.random() - 0.5) * 1.5, 0);
          }
          ctx.drawImage(
            tigerImg,
            col * frameW,
            row * frameH,
            frameW,
            frameH,
            -drawSize / 2,
            -drawSize / 2,
            drawSize,
            drawSize,
          );
          ctx.restore();
        }

        // Smog block (INDUSTRIAL HAZE theme — grey-brown, not purple; still a soft
        // cartoon face, never a monster). Same shapes as before; the wavy edge
        // is computed once per frame and shared by the body, the clip and the
        // hazard stripe, the three plume gradients are built once, the face and
        // the label are baked sprites and the puffs are batched per cluster.
        var SMOG_STEPS = 26;
        var smogEdgeX = new Array(SMOG_STEPS + 1);
        var smogEdgeY = new Array(SMOG_STEPS + 1);
        var SMOG_BAND_COLORS = [
          "rgba(132, 120, 90, 0.30)", // murky khaki-brown
          "rgba(48, 44, 38, 0.30)", // sooty dark
          "rgba(170, 158, 118, 0.20)", // sickly pale haze highlight
        ];
        var SMOG_DASH = [13, 13];
        var NO_DASH = [];
        var plumeGrads = [null, null, null];
        var FACE_COS = Math.cos(-0.09);
        var FACE_SIN = Math.sin(-0.09);

        function drawSmog(cellW, gridH, gridYOffset) {
          var smogX = GOGStage2.smogPosition * cellW;
          var frontWaveTime = state.elapsed * 3.5;
          var edgeTop = gridYOffset - 6;
          var edgeBottom = gridYOffset + gridH + 6;
          var i, y;

          for (i = 0; i <= SMOG_STEPS; i++) {
            y = edgeTop + ((edgeBottom - edgeTop) * i) / SMOG_STEPS;
            smogEdgeY[i] = y;
            smogEdgeX[i] =
              smogX +
              Math.sin(y * 0.045 + frontWaveTime) * 12 +
              Math.cos(y * 0.09 - frontWaveTime * 0.7) * 6;
          }

          ctx.save();

          // --- LAYER A: Murky Haze Body, wavy undulating leading edge
          ctx.fillStyle = "rgba(92, 86, 70, 0.78)"; // murky charcoal-khaki
          ctx.beginPath();
          ctx.moveTo(W + 4, edgeTop);
          for (i = 0; i <= SMOG_STEPS; i++) ctx.lineTo(smogEdgeX[i], smogEdgeY[i]);
          ctx.lineTo(W + 4, edgeBottom);
          ctx.closePath();
          ctx.fill();

          // Rolling wave bands + drifting soot flecks, both clipped to the
          // fog body's own wavy silhouette (the path above is still current).
          ctx.save();
          ctx.clip();

          var bandHeight = gridH / SMOG_BAND_COLORS.length;
          for (var band = 0; band < SMOG_BAND_COLORS.length; band++) {
            var bandPhase = frontWaveTime * (0.6 + band * 0.25) + band * 2.1;
            var bandStartY = gridYOffset + band * bandHeight - 10 + Math.sin(bandPhase) * 8;

            ctx.fillStyle = SMOG_BAND_COLORS[band];
            ctx.beginPath();
            ctx.moveTo(smogX - 30, bandStartY);
            for (var bx = smogX - 30; bx <= W + 20; bx += 16) {
              ctx.lineTo(bx, bandStartY + Math.sin(bx * 0.05 + bandPhase) * 10);
            }
            ctx.lineTo(W + 20, bandStartY + bandHeight * 0.6 + 30);
            for (var bx2 = W + 20; bx2 >= smogX - 30; bx2 -= 16) {
              ctx.lineTo(
                bx2,
                bandStartY + bandHeight * 0.6 + 30 + Math.sin(bx2 * 0.05 + bandPhase + 1.4) * 10,
              );
            }
            ctx.closePath();
            ctx.fill();
          }

          // Drifting soot flecks — small dark ash specks (one path, one fill)
          ctx.fillStyle = "rgba(28, 25, 21, 0.5)";
          var sootCount = 16;
          var sootSpanX = W - smogX + 60;
          ctx.beginPath();
          for (var si = 0; si < sootCount; si++) {
            var sootX = smogX - 20 + ((si * 53 + frontWaveTime * 6) % sootSpanX);
            var sootY = gridYOffset - 10 + ((si * 37 + frontWaveTime * 14) % (gridH + 20));
            var sootR = 1.4 + (si % 3) * 0.7;
            ctx.moveTo(sootX + sootR, sootY);
            ctx.arc(sootX, sootY, sootR, 0, Math.PI * 2);
          }
          ctx.fill();
          ctx.restore();

          // --- LAYER B: Fluffy Haze Front (grey-brown, not lavender) ---
          var waveTime = frontWaveTime;
          for (var sy = gridYOffset - 15; sy <= H + 40; sy += 35) {
            // Calculate a dynamic, organic wobble for this cloud cluster
            var clusterX = smogX + Math.sin(sy * 0.04 + waveTime) * 14;
            var baseRadius = 42 + Math.cos(sy * 0.08 + waveTime) * 5;

            // Main central puff + overlapping top-right and bottom-left puffs (the
            // cartoon cloud cluster), filled together
            ctx.fillStyle = "rgba(76, 71, 58, 0.93)";
            ctx.beginPath();
            ctx.arc(clusterX, sy, baseRadius, 0, Math.PI * 2);
            ctx.moveTo(clusterX + 15 + baseRadius * 0.75, sy - 15);
            ctx.arc(clusterX + 15, sy - 15, baseRadius * 0.75, 0, Math.PI * 2);
            ctx.moveTo(clusterX - 12 + baseRadius * 0.6, sy + 12);
            ctx.arc(clusterX - 12, sy + 12, baseRadius * 0.6, 0, Math.PI * 2);
            ctx.fill();

            // Sickly khaki highlight — the "toxic" tint
            ctx.fillStyle = "rgba(158, 148, 108, 0.4)";
            ctx.beginPath();
            ctx.arc(clusterX - 5, sy - 5, baseRadius * 0.8, 0, Math.PI * 2);
            ctx.fill();
          }

          // --- LAYER B.2: Hazard-Stripe Boundary (black-and-amber marching dashes)
          ctx.save();
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.beginPath();
          ctx.moveTo(smogEdgeX[0], edgeTop);
          for (i = 0; i <= SMOG_STEPS; i++) ctx.lineTo(smogEdgeX[i], smogEdgeY[i]);
          ctx.strokeStyle = "#241c30";
          ctx.lineWidth = 7;
          ctx.stroke();
          ctx.strokeStyle = "#ffb020";
          ctx.lineWidth = 7;
          ctx.setLineDash(SMOG_DASH);
          ctx.lineDashOffset = -state.elapsed * 45;
          ctx.stroke();
          ctx.setLineDash(NO_DASH);
          ctx.restore();

          // --- LAYER B.3: Rising Soot Plume ---
          // The gradient is vertical, so it does not depend on x: built once per plume.
          ctx.save();
          for (var pl = 0; pl < 3; pl++) {
            var plumePhase = state.elapsed * 0.9 + pl * 2.3;
            var plumeBaseX = smogX + 10 + pl * 26 + Math.sin(plumePhase) * 10;
            var plumeTopY = gridYOffset - 55 - (pl % 2) * 15;
            var plumeGrad = plumeGrads[pl];
            if (!plumeGrad) {
              plumeGrad = plumeGrads[pl] = ctx.createLinearGradient(0, gridYOffset, 0, plumeTopY);
              plumeGrad.addColorStop(0, "rgba(70, 65, 55, 0.45)");
              plumeGrad.addColorStop(1, "rgba(70, 65, 55, 0)");
            }
            ctx.strokeStyle = plumeGrad;
            ctx.lineWidth = 10 - pl * 2;
            ctx.beginPath();
            ctx.moveTo(plumeBaseX, gridYOffset + 4);
            ctx.quadraticCurveTo(
              plumeBaseX + Math.sin(plumePhase * 1.6) * 18,
              (gridYOffset + plumeTopY) / 2,
              plumeBaseX + Math.sin(plumePhase * 2.1) * 10,
              plumeTopY,
            );
            ctx.stroke();
          }
          ctx.restore();

          // --- LAYER B.5: Cartoon Smog Face (big, focal, left-facing) ---
          var faceBobY = Math.sin(state.elapsed * 3.2) * 3; // idle bob, nothing sits still
          var faceCenterY = gridYOffset + gridH / 2 + faceBobY;
          var faceLead = Math.sin(faceCenterY * 0.04 + waveTime) * 14;
          // Pull the face out ahead of the body's center toward the left
          // (direction of travel) so it visibly leads the cloud.
          var faceCenterX = smogX + faceLead - 22;
          var face = smogFaceSprite(!!GOGStage2.smogMoving);
          // translate(face) * rotate(-0.09): slight forward lean into the direction of travel
          ctx.setTransform(FACE_COS, FACE_SIN, -FACE_SIN, FACE_COS, faceCenterX + gShX, faceCenterY + gShY);
          ctx.drawImage(face, -FACE_SIZE / 2, -FACE_SIZE / 2, FACE_SIZE, FACE_SIZE);
          resetXform();

          // --- LAYER C: High-Contrast Warning Label ---
          var labelX = Math.min(smogX + 74, W - 66);
          var labelY = gridYOffset + gridH * 0.32;
          var label = smogLabelSprite();
          if (label) {
            ctx.drawImage(label.c, Math.round(labelX - label.ox), Math.round(labelY - label.oy));
          } else {
            // fonts still loading: draw the text live this frame
            ctx.save();
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.lineJoin = "round";
            ctx.font = "800 24px 'Baloo 2', sans-serif";
            ctx.lineWidth = 5;
            ctx.strokeStyle = "#241c30";
            ctx.fillStyle = "#fdfaef";
            ctx.strokeText("⚠️ SMOG!", labelX, labelY);
            ctx.fillText("⚠️ SMOG!", labelX, labelY);
            ctx.font = "700 16px 'Quicksand', sans-serif";
            ctx.lineWidth = 4;
            ctx.strokeText("😷 dirty air — keep it out!", labelX, labelY + 27);
            ctx.fillText("😷 dirty air — keep it out!", labelX, labelY + 27);
            ctx.restore();
          }

          ctx.restore();
        }

        var staticDrawn = false;
        function particlesActive() {
          var pool = particles.pool;
          for (var i = 0; i < pool.length; i++) {
            if (pool[i].active) return true;
          }
          return false;
        }
        var swayTab = null;

        function draw() {
          if (GOGUi.paused) return; // "How to play" pop-up is open
          // A finished / overlaid scene (intro, wave cleared, win, lose) stands
          // still: paint it once, then leave the canvas alone.
          if (state.running || winWiping || state.desaturateTime > 0 || state.screenShake > 0 || particlesActive()) {
            staticDrawn = false;
          } else if (staticDrawn) {
            return;
          } else {
            staticDrawn = true;
          }

          var shakeX = 0,
            shakeY = 0;
          if (state.screenShake > 0) {
            shakeX = (Math.random() - 0.5) * state.screenShake;
            shakeY = (Math.random() - 0.5) * state.screenShake;
          }
          gShX = shakeX;
          gShY = shakeY;
          breachOn = state.desaturateTime > 0;
          emojiA = 1;

          ctx.save();
          ctx.translate(shakeX, shakeY);

          // Apply desaturation filter on breach events (background, trees and
          // seaweed opt out, exactly as before)
          if (breachOn) {
            ctx.filter = BREACH_FILTER;
          }

          var t = state.elapsed;
          drawForestBackground(t);
          drawDappledSunbeams(t); // NEW: light through the leaves, fades in with canopy growth
          drawFog(t);
          drawRaviCharacter(); // NEW: Ravi watches from the sky band, mood tracking canopy health

          // Grid dimension recalculations
          var rows = GOGStage2.rows;
          var cols = GOGStage2.cols;
          var grid = GOGStage2.grid;
          var cellW = W / cols;
          var gridH = GRID_H; // Height of the actionable zone
          var cellH = gridH / rows; // Scale rows within the grid height
          var gridYOffset = GRID_Y_OFFSET; // Shift everything downwards past the sky
          var smogCol = Math.floor(GOGStage2.smogPosition);
          var spr = layoutSprites(cellW, cellH);
          var rockSpr = null;
          var rockEmoji = null;
          var r, c, cell, cx, cy, x, y, i, ph;

          // NEW: suggested-spot glow — only for calm mode or once auto-easing
          // has kicked in (assist > 0), so it's a helping hand, not a spoiler.
          // Also shown for the first ~10 seconds (and during the lesson) for
          // everyone, so a first-time player always sees where to tap.
          var showSuggestedSpot = calmMode || diff.getAssist() > 0 || state.elapsed < 10 || coach.active;
          var suggestedSpot = showSuggestedSpot ? findSuggestedPlantCell() : null;
          var sugR = suggestedSpot ? suggestedSpot.r : -1;
          var sugC = suggestedSpot ? suggestedSpot.c : -1;

          // Per-frame tables shared by every cell: ring wobble + wind sway
          var ct = Math.cos(t * 1.8);
          var st = Math.sin(t * 1.8);
          for (i = 0; i <= RING_N; i++) ringWave[i] = (RING_S4[i] * ct + RING_C4[i] * st) * 1.2;
          if (!swayTab || swayTab.length !== rows * cols) swayTab = new Float64Array(rows * cols);
          for (r = 0; r < rows; r++) {
            for (c = 0; c < cols; c++) {
              swayTab[r * cols + c] = Math.sin(t * 1.8 + (r * 4.3 + c * 2.7)) * 2.5;
            }
          }
          var radius = spr.radius;

          // 1. Draw Grid Cells
          for (r = 0; r < rows; r++) {
            for (c = 0; c < cols; c++) {
              cell = grid[r][c];
              x = c * cellW;
              y = gridYOffset + r * cellH;
              var cstate = cell.state;

              // Empty planting spots - organic vine plot: soil patch, wobbling
              // ring and a ghost sprout (the soil and sprout are baked sprites)
              if (cstate === "empty") {
                cx = x + cellW / 2;
                cy = y + cellH / 2;
                ctx.drawImage(spr.soil, cx - spr.soilC, cy - spr.soilC);

                var pulse = 1.0 + Math.sin(t * 3.0 + (r * 1.7 + c * 2.3)) * 0.05;
                var rScale = radius * pulse;
                ph = Math.sin(t * 2.8 + (r + c));
                ctx.strokeStyle = RING_RGBA[aIdx(0.32 + ph * 0.12)];
                ctx.lineWidth = 1.8;
                ctx.beginPath();
                for (i = 0; i <= RING_N; i++) {
                  var currR = rScale + ringWave[i];
                  var wx = cx + RING_COS[i] * currR;
                  var wy = cy + RING_SIN[i] * currR;
                  if (i === 0) ctx.moveTo(wx, wy);
                  else ctx.lineTo(wx, wy);
                }
                ctx.stroke();

                ctx.globalAlpha = 0.45 + ph * 0.15;
                ctx.drawImage(spr.sprout, cx - spr.spC, cy - 2 - spr.spC);

                // NEW: suggested-spot glow — a brighter pulsing lime ring
                // singles out one good next move for struggling/young kids.
                if (r === sugR && c === sugC) {
                  ctx.globalAlpha = 0.55 + Math.sin(t * 5) * 0.35;
                  ctx.drawImage(spr.suggest, cx - spr.sgC, cy - spr.sgC);
                }
                ctx.globalAlpha = 1;
              } else if (cstate === "rock") {
                // Rock image centered in the cell (pre-scaled sprite)
                cx = x + cellW / 2;
                cy = y + cellH / 2;
                if (!rockSpr) rockSpr = rockSprite(cellW, cellH);
                if (rockSpr) {
                  ctx.drawImage(rockSpr.c, cx - rockSpr.w / 2, cy - rockSpr.h / 2);
                } else {
                  drawEmoji("⛰️", 24, "Arial", "center", "middle", cx, cy); // visible fallback if image missing
                }
              }

              // Connected tree backdrop highlight - seamless green background
              if (cstate === "tree" && cell.connected) {
                ctx.fillStyle = TREE_BACKDROP;
                ctx.fillRect(x, y, cellW, cellH);
                emojiA = 0.28;
              }

              // Smog locking visualization — haze-matched tint plus a full
              // hazard X, so "you can't plant here" reads from the shape
              // itself, not just a faint tint (colorblind-safe, per spec).
              if (!calmMode && c >= smogCol) {
                ctx.fillStyle = "rgba(92, 86, 70, 0.22)";
                ctx.fillRect(x + 2, y + 2, cellW - 4, cellH - 4);
                emojiA = 0.22;
                ctx.strokeStyle = "rgba(40, 36, 30, 0.55)";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(x + 9, y + 9);
                ctx.lineTo(x + cellW - 9, y + cellH - 9);
                ctx.moveTo(x + cellW - 9, y + 9);
                ctx.lineTo(x + 9, y + cellH - 9);
                ctx.stroke();
              }
            }
          }

          // 2. Draw Connectivity Vine Links (Branches, vines, and canopy overlapping leaves)
          ctx.save();
          for (r = 0; r < rows; r++) {
            for (c = 0; c < cols; c++) {
              cell = grid[r][c];
              if (cell.state === "tree" && cell.connected) {
                cx = c * cellW + cellW / 2;
                cy = gridYOffset + r * cellH + cellH / 2;
                var windSway1 = swayTab[r * cols + c];

                // draw link to right neighbor
                if (c + 1 < cols) {
                  var right = grid[r][c + 1];
                  if (right.state === "tree" && right.connected) {
                    var ncx = (c + 1) * cellW + cellW / 2;
                    drawTreeConnection(ctx, cx + windSway1, cy, ncx + swayTab[r * cols + c + 1], cy);
                  }
                }
                // draw link to down neighbor
                if (r + 1 < rows) {
                  var down = grid[r + 1][c];
                  if (down.state === "tree" && down.connected) {
                    var ncy = gridYOffset + (r + 1) * cellH + cellH / 2;
                    drawTreeConnection(ctx, cx + windSway1, cy, cx, ncy + swayTab[(r + 1) * cols + c]);
                  }
                }
              }
            }
          }
          ctx.restore();

          // 3. Draw Sprites / Glyphs (Saplings, Rocks and Trees)
          for (r = 0; r < rows; r++) {
            // Draw wildlife for this row (behind this row's trees, but in front of previous rows)
            drawWildlife(r);

            for (c = 0; c < cols; c++) {
              cell = grid[r][c];
              cx = c * cellW + cellW / 2;
              cy = gridYOffset + r * cellH + cellH / 2;

              var plantOffsetX = (r + c) % 2 === 0 ? -cellW * 0.15 : cellW * 0.15;
              var pcx = cx + plantOffsetX;
              var cs3 = cell.state;

              if (cs3 === "rock") {
                if (!rockEmoji) rockEmoji = emojiSpr("⛰️", 30, "Arial", "center", "middle");
                ctx.globalAlpha = emojiA;
                ctx.drawImage(rockEmoji.c, cx - rockEmoji.ox, cy - 4 - rockEmoji.oy);
                ctx.globalAlpha = 1;
              } else if (cs3 === "sapling") {
                // Growth progress arc
                var pct = 1 - cell.growTimer / GOGStage2.growthTime;
                ctx.strokeStyle = SAPLING_ARC;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(pcx, cy + 12, 16, -Math.PI / 2, -Math.PI / 2 + pct * Math.PI * 2);
                ctx.stroke();

                // Draw growing roots tendrils branching outwards into the soil
                var rootY = cy + cellH / 2;
                ctx.strokeStyle = ROOT_RGBA[aIdx(0.3 + pct * 0.5)];
                ctx.lineWidth = 2.2;
                ctx.lineCap = "round";
                ctx.beginPath();
                ctx.moveTo(pcx, rootY - 4);
                ctx.quadraticCurveTo(pcx - 8, rootY + 2, pcx - 12 - pct * 12, rootY + 5 + pct * 6);
                ctx.moveTo(pcx, rootY - 4);
                ctx.quadraticCurveTo(pcx + 8, rootY + 2, pcx + 12 + pct * 12, rootY + 5 + pct * 6);
                ctx.stroke();
                ctx.lineCap = "butt";

                // Draw growing sprites dynamically from GrowingPlants1 sheet
                if (
                  growingPlantsImg &&
                  growingPlantsImg.complete &&
                  growingPlantsImg.width > 0
                ) {
                  var frame = GOGSpriteSheet.progressFrame(GROWING_PLANT_FRAMES, pct);
                  var lastFrame = GROWING_PLANT_FRAMES[GROWING_PLANT_FRAMES.length - 1];
                  var plantScale = Math.min(
                    (cellW - 16) / lastFrame.w,
                    (cellH - 10) / lastFrame.h,
                  );
                  var destW = frame.w * plantScale;

                  GOGSpriteSheet.drawFrame(
                    ctx,
                    growingPlantsImg,
                    frame,
                    pcx,
                    cy + cellH / 2 - 6,
                    destW,
                    "bottom",
                  );
                } else {
                  drawEmoji("🌱", 26, "Arial", "center", "middle", pcx, cy);
                }
              } else if (cs3 === "tree") {
                // Determine scale based on grow pop timer
                var popScale = 1.0;
                if (cell.growPopTimer > 0) {
                  var progress = 1.0 - cell.growPopTimer / 0.5;
                  // Bouncy scale: pop up to 1.25, settle to 1.0
                  if (progress < 0.6) {
                    popScale = 0.1 + (progress / 0.6) * 1.15;
                  } else {
                    popScale = 1.25 - ((progress - 0.6) / 0.4) * 0.25;
                  }
                }

                // Gentle staggered wind sway (2-3px)
                var windSway = swayTab[r * cols + c];

                // Check if tree is engulfed by smog
                var isEngulfed = !calmMode && c >= smogCol;

                // Draw seaweed from Stage 1 in between connected trees to build a thick canopy
                if (cell.connected && !isEngulfed) {
                  // Horizontal seaweed connection
                  if (c + 1 < cols) {
                    var right2 = grid[r][c + 1];
                    if (right2.state === "tree" && right2.connected) {
                      var midX = (c + 1) * cellW;
                      var midY = gridYOffset + r * cellH + cellH / 2;
                      var windSwayMid = Math.sin(t * 1.8 + (r * 4.3 + (c + 0.5) * 2.7)) * 2.5;
                      var seaImg = (r + c) % 2 === 0 ? seaWedImg1 : seaWedImg2;
                      if (seaImg && seaImg.complete && seaImg.width > 0) {
                        var sea = seaSprite(seaImg, (r + c) % 2 === 0 ? 1 : 2, false, cellW);
                        exemptFromBreach(true);
                        ctx.drawImage(sea.c, midX + windSwayMid - sea.ox, midY + cellH / 2 - 6 - sea.h + 12);
                        exemptFromBreach(false);
                      }
                    }
                  }
                  // Vertical seaweed connection
                  if (r + 1 < rows) {
                    var down2 = grid[r + 1][c];
                    if (down2.state === "tree" && down2.connected) {
                      var midX2 = c * cellW + cellW / 2;
                      var midY2 = gridYOffset + (r + 1) * cellH;
                      var windSwayMid2 = Math.sin(t * 1.8 + ((r + 0.5) * 4.3 + c * 2.7)) * 2.5;
                      var seaImg2 = (r + c) % 2 === 0 ? seaWedImg2 : seaWedImg1;
                      if (seaImg2 && seaImg2.complete && seaImg2.width > 0) {
                        var sea2 = seaSprite(seaImg2, (r + c) % 2 === 0 ? 2 : 1, true, cellW);
                        exemptFromBreach(true);
                        ctx.drawImage(sea2.c, midX2 + windSwayMid2 - sea2.ox, midY2 + cellH / 2 - 6 - sea2.h + 12);
                        exemptFromBreach(false);
                      }
                    }
                  }
                }

                // Draw procedural tree style
                drawProceduralTree(ctx, cx, cy, cellW, cellH, cell.variation, cell.connected, windSway, isEngulfed, popScale);

                // Draw healthy roots for fully grown trees if connected!
                if (cell.connected && !isEngulfed) {
                  var tx = cx + windSway;
                  var ty = cy + cellH / 2;
                  ctx.strokeStyle = TREE_ROOT; // glowing root lines
                  ctx.lineWidth = 2.5;
                  ctx.lineCap = "round";
                  ctx.beginPath();
                  ctx.moveTo(tx, ty - 4);
                  ctx.quadraticCurveTo(tx - 10, ty + 2, tx - 22, ty + 10);
                  ctx.moveTo(tx, ty - 4);
                  ctx.quadraticCurveTo(tx + 10, ty + 2, tx + 22, ty + 10);
                  ctx.stroke();
                  ctx.lineCap = "butt";
                }
              }
            }
          }

          // 3b. Draw ambient canopy wildlife — layered on top of the grown
          // trees so it visibly stands within the connected canopy patch.
          drawAmbientCreatures();
          drawAmbientFauna(ctx);

          // 4. Draw Blossoms in Win/Cleared state (Phase 5 Juice)
          if (
            GOGStage2.gameState === "STAGE_WON" ||
            GOGStage2.gameState === "WAVE_CLEARED"
          ) {
            // Draw colorful blossoms on top of connected trees
            for (r = 0; r < rows; r++) {
              for (c = 0; c < cols; c++) {
                cell = grid[r][c];
                if (cell.state === "tree" && cell.connected) {
                  cx = c * cellW + cellW / 2;
                  cy = gridYOffset + r * cellH + cellH / 2;
                  ctx.globalAlpha = emojiA;
                  drawEmoji("🌸", 16, "Arial", "left", "alphabetic", cx - 12, cy - 24);
                  if (c % 2 === 0) drawEmoji("🌼", 16, "Arial", "left", "alphabetic", cx + 12, cy - 28);
                  ctx.globalAlpha = 1;
                }
              }
            }
          }

          // 5. Draw Rain Clouds and Falling Rain — rain is only ever drawn
          // once a cloud has actually been tapped (state.raining), and it
          // animates as real falling drops rather than a static drizzle
          // glyph frozen under the cloud.
          var clouds = state.clouds;
          for (i = 0; i < clouds.length; i++) {
            var cl = clouds[i];
            if (!cl.active) continue;

            if (cl.raining) {
              ctx.save();
              ctx.strokeStyle = "rgba(100, 180, 255, 0.85)";
              ctx.lineCap = "round";
              ctx.lineWidth = 2.4;
              for (var di = 0; di < cl.drops.length; di++) {
                var d = cl.drops[di];
                var fade = Math.max(0, 1 - d.y / 95);
                if (fade <= 0) continue;
                ctx.globalAlpha = fade;
                ctx.beginPath();
                ctx.moveTo(cl.x + d.dx, cl.y + 14 + d.y);
                ctx.lineTo(cl.x + d.dx - 3, cl.y + 14 + d.y + 15);
                ctx.stroke();
              }
              ctx.restore();
            }

            // Vector outlined cloud — gently dims and cools in color while
            // it rains, then fades as its shower finishes.
            ctx.save();
            ctx.globalAlpha = cl.raining
              ? Math.max(0.35, Math.min(1, cl.rainTimer / 1.4))
              : 1;
            ctx.fillStyle = cl.raining ? "#eaf3ff" : "#ffffff";
            ctx.strokeStyle = "#1e293b";
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(cl.x - 20, cl.y + 8);
            ctx.bezierCurveTo(cl.x - 38, cl.y + 8, cl.x - 38, cl.y - 12, cl.x - 20, cl.y - 12);
            ctx.bezierCurveTo(cl.x - 20, cl.y - 30, cl.x + 20, cl.y - 30, cl.x + 20, cl.y - 12);
            ctx.bezierCurveTo(cl.x + 38, cl.y - 12, cl.x + 38, cl.y + 8, cl.x + 20, cl.y + 8);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.restore();
          }

          // 6. Draw creeping Smog — INDUSTRIAL HAZE theme.
          if (!calmMode && GOGStage2.smogPosition < cols) {
            drawSmog(cellW, gridH, gridYOffset);
          }

          if (GOGStage2.gameState === "STAGE_WON_CUTSCENE") {
            drawStageWonCutscene();
          }

          drawForegroundGrass(t);
          particles.draw(ctx);
          drawCoachHints();
          drawWinWipe();
          ctx.restore();
        }
        /* ---------------- guided lesson ----------------
           Three short steps the first time the stage opens in a session (the
           ❓ button replays them): tap a cloud, plant a tree, keep it
           connected to Ravi's vine. Smog and the countdown are paused while
           it runs (see update()), so nobody can lose during the lesson. */
        var COACH_STEPS = [
          { icon: "☁️", title: "Tap a cloud", text: "Tap a <b>cloud</b> to get baby trees 🌱", say: "Tap a cloud to get baby trees." },
          { icon: "🌱", title: "Plant a tree", text: "Tap the <b>green ring</b> to plant your baby tree.", say: "Tap the green ring to plant your baby tree." },
          { icon: "🌳", title: "Make a chain", text: "Keep your trees in a chain, back to <b>Ravi</b> on the left.", say: "Keep your trees in a chain, back to Ravi on the left, so they stay green and strong." },
        ];
        var coachStartSaplings = 0;
        var coachStep2At = 0;

        var coach = GOGCoach.create({
          stageId: STAGE_ID,
          frame: canvasFrame,
          steps: COACH_STEPS,
          onStep: function (i) {
            if (i === 0) {
              coachStartSaplings = GOGStage2.saplings;
              ensureCoachCloud();
            } else if (i === 2) {
              coachStep2At = state.elapsed;
            }
          },
          onFinish: function (reason) {
            GOGUi.say(
              reason === "done"
                ? "Great! Keep planting trees before the smog arrives! 🌳"
                : "Let's plant trees before the smog arrives! 🌳",
            );
          },
        });

        function coachCloud() {
          for (var i = 0; i < state.clouds.length; i++) {
            var c = state.clouds[i];
            // below the lesson banner, so it can actually be tapped
            if (c.active && !c.raining && c.x > 70 && c.x < W - 70 && c.y > 125) return c;
          }
          return null;
        }
        function ensureCoachCloud() {
          if (coachCloud()) return;
          state.clouds.push({
            x: W * 0.62, y: 168, vx: -14, vy: 0, size: 50, active: true,
            raining: false, rainTimer: 0, dropSpawnTimer: 0, drops: [],
          });
        }
        function countPlanted() {
          var n = 0;
          for (var r = 0; r < GOGStage2.rows; r++) {
            for (var c = 0; c < GOGStage2.cols; c++) {
              var s = GOGStage2.grid[r][c].state;
              if (s === "sapling" || s === "tree") n++;
            }
          }
          return n;
        }

        function updateCoach() {
          if (!coach.active) return;
          var i = coach.index;
          if (i === 0) {
            var tapped = GOGStage2.saplings > coachStartSaplings || state.clouds.some(function (c) { return c.raining; });
            if (tapped || countPlanted() > 0) coach.advance();
            else ensureCoachCloud();
          } else if (i === 1) {
            if (countPlanted() > 0) coach.advance();
          } else if (i === 2) {
            if (state.elapsed - coachStep2At > 7) coach.advance();
          }
        }

        function drawCoachHints() {
          if (!coach.active || !state.running) return;
          var t = coach.t, i = coach.index;
          var cellW = W / GOGStage2.cols;
          var cellH = GRID_H / GOGStage2.rows;
          ctx.save();
          if (i === 0) {
            var cl = coachCloud();
            if (cl) {
              GOGCoach.ring(ctx, cl.x, cl.y, 54, t);
              GOGCoach.hand(ctx, cl.x, cl.y + 4, t, false);
              GOGCoach.tag(ctx, cl.x, cl.y - 62, "Tap the cloud!");
            }
          } else if (i === 1) {
            var spot = findSuggestedPlantCell();
            if (spot) {
              var sx = spot.c * cellW + cellW / 2;
              var sy = GRID_Y_OFFSET + spot.r * cellH + cellH / 2;
              GOGCoach.arrow(ctx, sx, sy - 34, t, "down");
              GOGCoach.tag(ctx, sx, Math.max(110, sy - 92), "Tap the ring!");
            } else if (GOGStage2.saplings <= 0) {
              var cl2 = coachCloud();
              if (cl2) GOGCoach.tag(ctx, cl2.x, cl2.y - 62, "Tap a cloud for saplings");
            }
          } else if (i === 2) {
            var vy = GRID_Y_OFFSET + GRID_H * 0.45;
            GOGCoach.arrow(ctx, 26, vy, t, "left");
            GOGCoach.tag(ctx, 160, vy, "Chain back to Ravi");
          }
          ctx.restore();
        }

        var helpBtn = document.getElementById("helpBtn");
        if (helpBtn) {
          helpBtn.addEventListener("click", function () {
            if (!state.running) return;
            resetStage();
            coach.start();
          });
        }

        /* ---------------- start ---------------- */
        var loop = new GOGEngine.GameLoop({
          update: update,
          draw: draw,
        });

        // The intro backdrop is drawn before the first wave starts; give it a real
        // (empty) grid instead of relying on the unit tests having left one behind.
        GOGStage2.init(GRID_ROWS, GRID_COLS);
        GOGStage2.gameState = "WAVE_ACTIVE";

        initBackground().finally(function () {
          loop.start();
          showRaviIntroBeat();
        });
      })();
    </script>
  </body>
</html>

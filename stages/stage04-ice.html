          // read "this place is unhappy/bad" at a glance, still soft
          // cartoon, never scary (per brand).
          ctx.fillStyle = "#241c30";
          circle(x + 55, y + 175, 7, true);
          circle(x + 105, y + 175, 7, true);
          ctx.save();
          ctx.strokeStyle = "#241c30";
          ctx.lineWidth = 5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.arc(x + 80, y + 210, 22, Math.PI * 1.1, Math.PI * 1.9);
          ctx.stroke();
          ctx.restore();

          // Smoke — sooty grey-brown with a sickly khaki tint, the same
          // palette family as the Smog itself, so factory smoke and the
          // Smog register as the same danger on sight.
          const smokePuffs = 3 + Math.floor(state.warmth * 5);
          for (let i = 0; i < smokePuffs; i++) {
            const sx = x + 46 + i * 20 + Math.sin(state.time * 1.4 + i) * 10;
            const sy =
              y + 20 - i * 10 - Math.cos(state.time * 1.5 + i * 0.5) * 8;
            ctx.globalAlpha = 0.2 + state.warmth * 0.25;
            ctx.fillStyle =
              i % 2 === 0 ? "rgba(70, 65, 55, 1)" : "rgba(150, 140, 108, 1)";
            circle(sx, sy, 18 + i * 3, true);
            ctx.globalAlpha = 1;
          }

          // T052: rising heat-wave shimmer above the stacks — makes the
          // *cause* of Warmth visibly hotter as it climbs, not just a meter.
          if (state.warmth > 0.15) {
            ctx.save();
            ctx.globalAlpha = 0.12 + state.warmth * 0.28;
            ctx.strokeStyle = "rgba(255, 210, 140, 0.8)";
            ctx.lineWidth = 2;
            const waveCount = 3;
            for (let w = 0; w < waveCount; w++) {
              const wx = x + 30 + w * 45;
              const topY = y - 90 - state.warmth * 40;
              ctx.beginPath();
              for (let hy = y - 10; hy > topY; hy -= 6) {
                const wobble = Math.sin(state.time * 6 + hy * 0.15 + w * 2) * (3 + state.warmth * 5);
                if (hy === y - 10) ctx.moveTo(wx + wobble, hy);
                else ctx.lineTo(wx + wobble, hy);
              }
              ctx.stroke();
            }
            ctx.restore();
          }
        }

        // The home iceberg's static look: warm halo, ice block, face, grass cap and the
        // welcome sign. Baked once (HOME_BOX) by drawHomeBase(); the parent penguins,
        // the jumping fish and the sparkles stay live.
        function drawHomeStatic() {
          const b = state.stableBase;
          
          // 1. Warm cozy sun glow halo over the safe iceberg
          ctx.save();
          const safeGrad = ctx.createRadialGradient(b.x + b.w/2, b.y - 10, 10, b.x + b.w/2, b.y - 10, 150);
          safeGrad.addColorStop(0, "rgba(255, 226, 110, 0.32)");
          safeGrad.addColorStop(0.5, "rgba(255, 185, 90, 0.12)");
          safeGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
          ctx.fillStyle = safeGrad;
          ctx.beginPath();
          ctx.arc(b.x + b.w/2, b.y - 10, 150, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // 2. Draw main safe base platform (3D block)
          ctx.save();
          const ibGrad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
          ibGrad.addColorStop(0, "#DDF5FF");
          ibGrad.addColorStop(0.3, "#A8DAF0");
          ibGrad.addColorStop(1, "#2C5E7A");
          
          ctx.fillStyle = ibGrad;
          roundedRect(b.x, b.y, b.w, b.h, 20, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(b.x, b.y, b.w, b.h, 20, false, true);

          // Crevice texture lines on the front face
          ctx.strokeStyle = "rgba(40, 110, 150, 0.4)";
          ctx.lineWidth = 3.5;
          for (let offset = 40; offset < b.w; offset += 55) {
            ctx.beginPath();
            ctx.moveTo(b.x + offset, b.y + 15);
            ctx.lineTo(b.x + offset + (offset % 12 - 6), b.y + b.h - 10);
            ctx.stroke();
          }
          ctx.restore();

          ctx.fillStyle = "#7CE6A6";
          roundedRect(b.x, b.y, b.w, 14, 7, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 3;
          roundedRect(b.x, b.y, b.w, 14, 7, false, true);

          ctx.fillStyle = "#241c30";
          circle(b.x + b.w * 0.32, b.y + b.h * 0.42, 6, true);
          circle(b.x + b.w * 0.5, b.y + b.h * 0.42, 6, true);
          ctx.save();
          ctx.strokeStyle = "#241c30";
          ctx.lineWidth = 4;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.arc(
            b.x + b.w * 0.41,
            b.y + b.h * 0.55,
            16,
            Math.PI * 0.1,
            Math.PI * 0.9,
          );
          ctx.stroke();
          ctx.restore();

          // Welcome sign on a little post, held high enough to clear the huddle.
          const signW = 156;
          const signH = 34;
          const signX = b.x + b.w / 2 - signW / 2;
          const signY = b.y - 118;
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(b.x + b.w / 2, signY + signH);
          ctx.lineTo(b.x + b.w / 2, b.y + 2);
          ctx.stroke();
          ctx.fillStyle = "#fff";
          roundedRect(signX, signY, signW, signH, 9, true, false);
          ctx.lineWidth = 4;
          roundedRect(signX, signY, signW, signH, 9, false, true);
          ctx.fillStyle = "#111";
          ctx.font = "900 14px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("💚 SAFE ICEBERG", b.x + b.w / 2, signY + signH / 2 + 1);
        }

        // Run drawFn with every ctx-based helper (roundedRect, circle, ...) painting into g.
        function withCtx(g, drawFn) {
          const prev = ctx;
          ctx = g;
          try {
            drawFn();
          } finally {
            ctx = prev;
          }
        }

        // World rect of the baked home sprite: halo (r=150 around x=160,y=370), block,
        // sign. Origin on multiples of 4 so it lands on whole device pixels.
        const HOME_BOX = { x: 8, y: 216, w: 304, h: 372 };
        let homeSprite = null;
        let homeEpoch = -1;

        // Blit a baked world-space bitmap 1:1 in device pixels (wx, wy: multiples of 4).
        function blitWorld(c, wx, wy) {
          const sc = hiDpi.scale;
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(c, Math.round(wx * sc) - Math.round(camX * sc), Math.round(wy * sc));
          ctx.restore();
        }

        function drawHomeBase() {
          const b = state.stableBase;
          if (!homeSprite || homeEpoch !== rasterEpoch) {
            releaseCanvas(homeSprite);
            homeSprite = GOGEngine.bake(
              HOME_BOX.w,
              HOME_BOX.h,
              function (g) {
                withCtx(g, function () {
                  ctx.translate(-HOME_BOX.x, -HOME_BOX.y);
                  drawHomeStatic();
                });
              },
              hiDpi.scale,
            );
            homeEpoch = rasterEpoch;
          }
          blitWorld(homeSprite, HOME_BOX.x, HOME_BOX.y);

          // 3. Draw Parent Penguins
          // Dad: waddles slightly
          const dadWaddle = Math.sin(state.time * 2.5) * 3;
          const dadX = b.x + b.w * 0.72;
          const dadY = b.y + FOOT_SINK;
          ctx.save();
          ctx.translate(dadX, dadY + Math.abs(dadWaddle));
          ctx.rotate(dadWaddle * 0.05);
          if (spriteSheets.idle.loaded) {
            const frame = Math.floor(state.time * 1.5) % 2; // alternates standing/smiling
            const col = frame % spriteSheets.idle.cols;
            const destW = 44; // Larger Dad
            const fs = frameSprite(spriteSheets.idle, col, destW);
            ctx.drawImage(fs, -fs.gw / 2, -fs.gh, fs.gw, fs.gh);
          } else {
            drawEmoji("🐧", 0, -18, 42); // Fallback Larger Dad
          }
          ctx.restore();

          // Mom: waves happily
          const momWave = Math.sin(state.time * 4.5) * 4;
          const momX = b.x + b.w * 0.85;
          const momY = b.y + FOOT_SINK;
          ctx.save();
          ctx.translate(momX, momY + Math.abs(momWave));
          ctx.scale(-1, 1);
          if (spriteSheets.idle.loaded) {
            const frame = Math.floor(state.time * 1.2 + 1) % 2;
            const col = frame % spriteSheets.idle.cols;
            const destW = 40; // Smaller Mom
            const fs = frameSprite(spriteSheets.idle, col, destW);
            ctx.drawImage(fs, -fs.gw / 2, -fs.gh, fs.gw, fs.gh);
          } else {
            drawEmoji("🐧", 0, -16, 38); // Fallback Mom
          }
          ctx.restore();

          // 4. Draw Rescued fish jumping
          if (state.fishJumpTimer > 0) {
            const progress = (1.5 - state.fishJumpTimer) / 1.5;
            const jumpHeight = 75;
            const fishX = b.x + b.w * 0.5 + (progress * 80 - 40);
            const fishY = b.y - Math.sin(progress * Math.PI) * jumpHeight - 10;
            ctx.save();
            ctx.translate(fishX, fishY);
            ctx.rotate(progress * Math.PI - Math.PI / 2);
            drawEmoji("🐟", 0, 0, 18);
            ctx.restore();
          }
        }

        // Snow sparkles rising off the home iceberg (spawned each frame, drawn as particles).
        function spawnHomeSparkles() {
          if (Math.random() < 0.12) {
            const b = state.stableBase;
            state.particles.push({
              x: b.x + Math.random() * b.w,
              y: b.y,
              vx: (Math.random() - 0.5) * 8,
              vy: -15 - Math.random() * 20,
              life: 1.0,
              maxLife: 1.0,
              color: "#FFF59D",
              size: 2 + Math.random() * 2,
              kind: "snow"
            });
          }
        }

        function drawValvePlatform() {
          const p = state.valvePlatform;
          ctx.fillStyle = "#CFEFFF";
          roundedRect(p.x, p.y, p.w, p.h, 12, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(p.x, p.y, p.w, p.h, 12, false, true);

          ctx.save();
          ctx.translate(state.valve.x, state.valve.y);
          const spin = state.valve.pulse * 1.3 + state.valve.activeFlash * 12.0;
          ctx.rotate(spin);
          
          if (state.valve.frozen) {
            ctx.fillStyle = "#B3F0FF";
          } else {
            ctx.fillStyle = state.coolingTimer > 0 ? "#87E1FF" : "#FFD84D";
          }
          
          circle(0, 0, state.valve.r, true);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          circle(0, 0, state.valve.r, false);
          
          for (let i = 0; i < 4; i++) {
            ctx.rotate(Math.PI / 2);
            ctx.fillRect(-4, -state.valve.r - 12, 8, 22);
            ctx.strokeRect(-4, -state.valve.r - 12, 8, 22);
          }
          
          if (state.valve.frozen) {
            ctx.save();
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            for (let j = 0; j < 6; j++) {
              ctx.rotate(Math.PI / 3);
              ctx.fillRect(-2, -state.valve.r + 4, 4, 14);
            }
            ctx.restore();
          }

          circle(0, 0, 8, true);
          circle(0, 0, 8, false);
          ctx.restore();

          ctx.fillStyle = "#fff";
          roundedRect(p.x + 105, p.y - 48, 120, 34, 8, true, false);
          ctx.strokeStyle = "#111";
          roundedRect(p.x + 105, p.y - 48, 120, 34, 8, false, true);
          ctx.fillStyle = "#111";
          ctx.font = "900 14px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(
            state.valve.frozen ? "FROZEN ❄️" : (state.coolingTimer > 0 ? "COOLING!" : "SPIN VALVE"),
            p.x + 165,
            p.y - 31,
          );
        }

        // Small deterministic PRNG so each floe's jagged edge and crack
        // pattern is generated once, cached, and never reshuffles frame
        // to frame (real Math.random() would make the ice "boil").
        function seededRandom(seed) {
          let s = seed % 2147483647;
          if (s <= 0) s += 2147483646;
          return function () {
            s = (s * 16807) % 2147483647;
            return (s - 1) / 2147483646;
          };
        }

        // Builds an irregular, organic outline for a floe (as normalized
        // 0..1 offsets around a rounded rect) plus a jagged snow-cap line
        // along the top edge, so no two platforms read as the same shape.
        function getIceShapePoints(pl) {
          if (pl.shapePts) return pl.shapePts;
          const rand = seededRandom(pl.seed || 1);
          const N = 14;
          const outline = [];
          for (let i = 0; i < N; i++) {
            const t = i / N;
            const bulge = 0.82 + rand() * 0.22;
            outline.push({ t, bulge });
          }
          const snowTeeth = [];
          const teeth = 6 + Math.floor(rand() * 3);
          for (let i = 0; i <= teeth; i++) {
            snowTeeth.push(0.55 + rand() * 0.45);
          }
          pl.shapePts = { outline, snowTeeth };
          return pl.shapePts;
        }

        // Cracks are generated once per melt-stage (not every frame) and
        // cached on the platform so they hold still until the ice actually
        // worsens to the next stage.
        function getCrackLines(pl, stage) {
          if (pl.cachedCrackStage === stage && pl.cachedCracks) {
            return pl.cachedCracks;
          }
          const rand = seededRandom((pl.crackSeed || 1) + stage * 911);
          const count = Math.min(stage * 2, 8);
          const lines = [];
          for (let i = 0; i < count; i++) {
            const cx = 0.15 + rand() * 0.7;
            const cy = 0.2 + rand() * 0.6;
            const len = 0.12 + rand() * 0.22;
            const ang = rand() * Math.PI * 2;
            lines.push({ cx, cy, len, ang, branch: rand() > 0.5 });
          }
          pl.cachedCrackStage = stage;
          pl.cachedCracks = lines;
          return lines;
        }

        const FLOE_PALETTE = [
          null,
          { lip: "#FFFFFF", top: "#E9F8FF", bot: "#80C6EE" },
          { lip: "#F2FAFF", top: "#D4EFFB", bot: "#6DB5E1" },
          { lip: "#DDEBF5", top: "#BADAEC", bot: "#5B9DC9" },
          { lip: "#C6D9E8", top: "#9FC5DE", bot: "#4B83AF" },
          { lip: "#B2C6DA", top: "#87AFCC", bot: "#3B6B94" },
        ];
        // One vertical gradient per (melt stage, slab height), created once. It is
        // defined in the floe's local space, so it follows the translate/rotate.
        const floeGradients = {};
        function floeBodyGradient(stage, palette, h) {
          const key = stage + "|" + h;
          let g = floeGradients[key];
          if (!g) {
            g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, palette.top);
            g.addColorStop(1, palette.bot);
            floeGradients[key] = g;
          }
          return g;
        }
        // Critical-floe warning outline: 41 pre-built alphas (0.50 .. 0.90) instead of a
        // template string per frame.
        const CRITICAL_STROKES = [];
        for (let i = 50; i <= 90; i++) {
          CRITICAL_STROKES.push("rgba(239, 68, 68, " + (i / 100).toFixed(2) + ")");
        }

        // Draws one organic ice floe: jagged silhouette, snow cap, interior
        // shading, and stage-appropriate cracks/puddles/fragment gaps.
        function drawIceFloe(pl, x, w, meltRatio) {
          const h = pl.h + SLAB_DEPTH; // whole visible slab; only the top pl.h is walkable
          const stage =
            meltRatio < 0.15
              ? 1
              : meltRatio < 0.35
                ? 2
                : meltRatio < 0.52
                  ? 3
                  : meltRatio < 0.68
                    ? 4
                    : 5;

          // Fresh white-blue ice greys and thins out as it melts.
          const palette = FLOE_PALETTE[stage];

          ctx.save();
          ctx.translate(x + w / 2, pl.y + pl.h / 2);
          ctx.rotate(pl.rot || 0);
          ctx.translate(-w / 2, -pl.h / 2);

          // 1. Hard offset shadow (flat, no blur)
          ctx.fillStyle = "rgba(10, 28, 60, 0.38)";
          roundedRect(4, 5, w, h, 14, true, false);

          // 2. One solid slab with a vertical ice gradient
          ctx.fillStyle = floeBodyGradient(stage, palette, h);
          roundedRect(0, 0, w, h, 14, true, false);

          // 3. Details, clipped to the slab
          ctx.save();
          roundedRect(0, 0, w, h, 14, false, false);
          ctx.clip();

          // snow lip along the top with a scalloped lower edge
          ctx.fillStyle = palette.lip;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(w, 0);
          ctx.lineTo(w, SLAB_LIP);
          const bumps = Math.max(4, Math.round(w / 26));
          const bw = w / bumps;
          for (let i = bumps - 1; i >= 0; i--) {
            ctx.quadraticCurveTo(i * bw + bw / 2, SLAB_LIP + 5 + (i % 2) * 2, i * bw, SLAB_LIP);
          }
          ctx.closePath();
          ctx.fill();

          // glossy streaks on the ice face
          ctx.globalAlpha = 0.42;
          ctx.strokeStyle = "#FFFFFF";
          ctx.lineWidth = 3;
          ctx.lineCap = "round";
          const streaks = Math.max(2, Math.floor(w / 60));
          ctx.beginPath(); // the streaks never overlap: one path, one stroke
          for (let i = 0; i < streaks; i++) {
            const sx = w * (0.14 + ((i + 0.3) / streaks) * 0.7);
            ctx.moveTo(sx, SLAB_LIP + 8);
            ctx.lineTo(sx + 9, SLAB_LIP + 20);
          }
          ctx.stroke();
          ctx.globalAlpha = 1;

          // cracks appear as the slab melts
          if (stage >= 2) {
            ctx.strokeStyle = stage >= 4 ? "#1D4F73" : "#3B7FB8";
            ctx.lineWidth = stage >= 4 ? 2.4 : 1.6;
            const cracks = getCrackLines(pl, stage);
            ctx.beginPath(); // all cracks share one colour/width: one path, one stroke
            for (let i = 0; i < cracks.length; i++) {
              const c = cracks[i];
              const cx = c.cx * w;
              const cy = SLAB_LIP + 4 + c.cy * (h - SLAB_LIP - 8);
              const dx = Math.cos(c.ang) * c.len * w;
              const dy = Math.sin(c.ang) * c.len * (h - SLAB_LIP);
              ctx.moveTo(cx - dx / 2, cy - dy / 2);
              ctx.lineTo(cx + dx / 2, cy + dy / 2);
              if (c.branch) {
                ctx.lineTo(cx + dx / 2 + dy * 0.3, cy + dy / 2 - dx * 0.3);
              }
            }
            ctx.stroke();
          }
          ctx.restore();

          // healing flash: a flat cyan ring just outside the outline
          if (pl.glowTimer > 0) {
            ctx.strokeStyle = "rgba(135, 225, 255, " + Math.min(1, pl.glowTimer / 1.5).toFixed(2) + ")";
            ctx.lineWidth = 10;
            roundedRect(0, 0, w, h, 14, false, true);
          }

          // 4. Outline
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(0, 0, w, h, 14, false, true);
          ctx.restore();
        }

        function drawPlatforms() {
          for (const pl of state.meltPlatforms) {
            if (pl.gone) continue;
            const x = pl.x + pl.shrink * 0.5;
            if (!inView(x - 30, x + pl.w + 30)) continue; // off screen
            const meltRatio = 1 - pl.w / pl.baseW;

            // Draw the beautiful, organic, bobbing/rotating ice floe!
            drawIceFloe(pl, x, pl.w, meltRatio);

            const critical = meltRatio > 0.55;
            if (critical) {
              const pulse = 0.5 + Math.sin(state.time * 9) * 0.5;
              ctx.save();
              ctx.strokeStyle = CRITICAL_STROKES[Math.round((0.5 + pulse * 0.4) * 100) - 50];
              ctx.lineWidth = 4;
              ctx.setLineDash([8, 6]);
              ctx.lineDashOffset = -state.time * 40;
              roundedRect(x - 3, pl.y - 3, pl.w + 6, pl.h + SLAB_DEPTH + 6, 16, false, true);
              ctx.setLineDash([]);
              ctx.restore();
            }

            // Draw visual segmented health bar underneath if it is melting
            if (meltRatio > 0.05) {
              const barW = pl.w * 0.65;
              const barH = 7;
              const bx = x + (pl.w - barW) / 2;
              const by = pl.y + pl.h + SLAB_DEPTH + 10 + (Math.sin(state.time * 2.0 + pl.phase) * 2);
              
              ctx.save();
              // Neo-brutalist health bar container
              ctx.fillStyle = "#1e293b";
              ctx.fillRect(bx - 2, by - 2, barW + 4, barH + 4);
              
              // Fill bar
              const healthPct = 1 - meltRatio;
              let fillCol = "#7CE6A6";
              if (healthPct < 0.35) {
                fillCol = "#FF3B30";
              } else if (healthPct < 0.65) {
                fillCol = "#FFCC00";
              }
              ctx.fillStyle = fillCol;
              ctx.fillRect(bx, by, barW * healthPct, barH);
              ctx.restore();
            }
          }
        }

        // T050: delivered chicks live on in a small hopping/cheering huddle
        // near the safe iceberg instead of just disappearing.
        function drawHuddleChick(chick) {
          const b = state.stableBase;
          const slot = chick.huddleSlot || 0;
          const cols = 3;
          const col = slot % cols;
          const row = Math.floor(slot / cols);
          const baseX = b.x + b.w * 0.28 + col * 30;
          const baseY = b.y + FOOT_SINK - row * 14;
          const cheering = chick.cheerTimer > 0;
          const hop = Math.abs(Math.sin(chick.bob * 1.8)) * (cheering ? 12 : 5);
          const drawX = baseX;
          const drawY = baseY - hop;

          drawContactShadow(drawX, baseY - 5, 16);

          if (chickSprite.loaded) {
            const destW = CHICK_W;
            const destH = (chickSprite.frameH / chickSprite.frameW) * destW;
            // hop frames (4/5) while cheering, a slow sleepy blink (2) otherwise
            const frame = cheering
              ? (Math.floor(chick.bob * 4) % 2 === 0 ? 4 : 5)
              : (Math.floor(chick.bob) % 6 === 5 ? 2 : 0);
            const fs = frameSprite(chickSprite, frame, destW);
            ctx.drawImage(fs, drawX - fs.gw / 2, drawY - fs.gh, fs.gw, fs.gh);
          } else {
            drawEmoji("🐥", drawX, drawY - 10, 26);
          }

          if (cheering && Math.random() < 0.12) {
            state.particles.push({
              x: drawX, y: drawY - 20,
              vx: (Math.random() - 0.5) * 20, vy: -30 - Math.random() * 15,
              life: 0.7, maxLife: 0.7, kind: "emoji", text: "🎉", size: 12,
            });
          }
        }

        // Grab prompts are queued while chicks draw and painted after Penny so
        // she can never cover the hint.
        const chickPrompts = [];
        function drawChickPrompts() {
          for (const pr of chickPrompts) GOGCoach.tag(ctx, pr.x, pr.y, "Tap GRAB / press E");
          chickPrompts.length = 0;
        }

        function drawChicks() {
          const p = state.player;
          chickPrompts.length = 0;
          for (const chick of state.chicks) {
            if (state.player.carrying.includes(chick)) continue;
            if (chick.delivered) {
              if (inView(-10, 340)) drawHuddleChick(chick);
              continue;
            }
            if (!inView(chick.x - 60, chick.x + 80)) continue; // off screen
            const bob = Math.sin(chick.bob) * 3;
            let shiver = 0;
            let crying = false;

            // Find the nearest floe under the chick to decide if it
            // should look scared (shiver + tear) or just wave happily.
            let nearest = null;
            let bestDist = Infinity;
            for (const pl of state.meltPlatforms) {
              if (pl.gone) continue;
              const d = Math.abs(pl.x + pl.w / 2 - chick.x);
              if (d < bestDist) {
                bestDist = d;
                nearest = pl;
              }
            }
            if (nearest && bestDist < 120) {
              const ratio = 1 - nearest.w / nearest.baseW;
              if (ratio > 0.35) {
                shiver = Math.sin(state.time * 26 + chick.bob) * 2.8;
                crying = ratio > 0.55;
              }
            }

            const destW = CHICK_W; // match the safe-iceberg chick size
            let destH = 34;
            if (chickSprite.loaded) {
              destH = (chickSprite.frameH / chickSprite.frameW) * destW;
            }

            // Calculate exact rotated positioning to stay glued to bobbing/tilting platforms
            let drawX = chick.x + 9 + shiver;
            let drawY = chick.y + 18 + bob + FOOT_SINK;
            let drawRot = 0;
            
            if (!chick.rescued && chick.platformIndex !== undefined) {
              const pl = state.meltPlatforms[chick.platformIndex];
              if (pl && !pl.gone) {
                const plX = pl.x + pl.shrink * 0.5;
                const plCenterW = pl.w / 2;
                const plCenterH = pl.h / 2;
                
                const relX = (chick.x + 9) - (plX + plCenterW);
                const relY = -plCenterH;
                
                const rot = pl.rot || 0;
                const cos = Math.cos(rot);
                const sin = Math.sin(rot);
                
                const rotX = relX * cos - relY * sin;
                const rotY = relX * sin + relY * cos;
                
                drawX = plX + plCenterW + rotX + shiver;
                drawY = pl.y + plCenterH + rotY + bob + FOOT_SINK;
                drawRot = rot;
              }
            }

            if (chickSprite.loaded) {
              let frame = 0; // Default standing
              if (crying) {
                // Worried fast-blink animation when platform is melting
                const worryTime = (state.time * 4.0 + chick.bob) % 3.0;
                if (worryTime < 1.5) {
                  frame = 1; // Worried eyes
                } else if (worryTime < 2.0) {
                  frame = 2; // Eyes shut tight
                } else {
                  frame = 0; // Normal standing
                }
              } else {
                // Happy normal idle cycle
                const chickTime = (state.time * 1.5 + chick.bob) % 5.0;
                if (chickTime < 3.5) {
                  frame = 0; // Normal look
                } else if (chickTime < 3.7) {
                  frame = 1; // Eyes half closed
                } else if (chickTime < 3.95) {
                  frame = 2; // Eyes closed
                } else if (chickTime < 4.15) {
                  frame = 1; // Eyes half closed
                } else {
                  frame = 0; // Happy open mouth
                }
              }

              ctx.save();
              ctx.translate(drawX, drawY);
              ctx.rotate(drawRot);
              // soft contact shadow stays on the slab while the chick bobs
              drawContactShadow(0, -bob - (FOOT_SINK - 4), 17);
              const fs = frameSprite(chickSprite, frame, destW);
              ctx.drawImage(fs, -fs.gw / 2, -fs.gh, fs.gw, fs.gh);

              // Draw Ice Left progress bar inside coordinate space so it tilts & stays glued
              if (!chick.rescued && nearest && bestDist < 120) {
                const icePct = Math.round((nearest.w / nearest.baseW) * 100);
                if (icePct < 100) {
                  const barW = destW;
                  const barH = 5;
                  const bx = -barW / 2;
                  const by = -destH - 8;

                  ctx.fillStyle = "rgba(15, 23, 42, 0.65)";
                  ctx.fillRect(bx, by, barW, barH);

                  let fillColor = "#80E0FF";
                  if (icePct < 35) {
                    fillColor = "#FF3B30";
                  } else if (icePct < 65) {
                    fillColor = "#FFCC00";
                  }

                  const fillW = (icePct / 100) * barW;
                  ctx.fillStyle = fillColor;
                  ctx.fillRect(bx, by, fillW, barH);

                  ctx.strokeStyle = "#1e293b";
                  ctx.lineWidth = 1;
                  ctx.strokeRect(bx, by, barW, barH);
                }
              }
              ctx.restore();
            } else {
              ctx.save();
              ctx.translate(drawX, drawY);
              ctx.rotate(drawRot);
              drawEmoji("🐥", 0, -11, 26);
              ctx.restore();
            }

            // "Tap GRAB" prompt while Penny is in reach (drawn after Penny, see drawChickPrompts)
            const maxCarry = getMaxCarryingCapacity();
            if (!calmMode && !chick.rescued && chickInReach(p, chick) && p.carrying.length < maxCarry) {
              chickPrompts.push({ x: drawX, y: drawY - destH - 16 });
            }

            if (crying) {
              drawEmoji("💧", chick.x + 16, chick.y + 20, 12);
            }
          }
        }

        // T051: draws the seal lift — a gentle ripple ring while it's about
        // to surface, the seal itself (rideable) once surfaced.
        function drawWaterLift() {
          const wl = state.waterLift;
          if (!wl) return;
          if (!inView(wl.x - 60, wl.x + wl.w + 60)) return; // off screen
          if (wl.surfaced) {
            ctx.save();
            ctx.globalAlpha = 0.9;
            drawEmoji("🦭", wl.x + wl.w / 2, wl.y + wl.h / 2 - 4, 46);
            ctx.restore();
          } else {
            const nextIn = wl.cycle - wl.phase;
            if (nextIn < 1.2) {
              ctx.save();
              ctx.globalAlpha = 0.35 * (1 - nextIn / 1.2);
              ctx.strokeStyle = "#BEEFFF";
              ctx.lineWidth = 2;
              circle(wl.x + wl.w / 2, state.seaLevel, 14 + (1.2 - nextIn) * 10, false);
              ctx.restore();
            }
          }
        }

        function drawPlayer() {
          const p = state.player;
          const x = p.x;
          const y = p.y;
          const sheet = getActiveSpriteSheet();

          // Nervous cue: a quick foot-slip jitter and a worried tilt while
          // standing on ice that's about to give way, so kids can read
          // "this spot is dangerous" straight from Penny's body language.
          const nervous = !!p.onCriticalIce;
          const jitterX = nervous ? Math.sin(state.time * 30) * 2.2 : 0;
          const tilt = nervous ? Math.sin(state.time * 16) * 0.06 : 0;

          // Exaggerated penguin waddle sway (tilt & lift feet)
          let waddleTilt = 0;
          let waddleY = 0;
          if (sheet === spriteSheets.running) {
            const runCycle = state.time * Math.max(9, Math.abs(p.vx) * 0.08);
            waddleTilt = Math.sin(runCycle) * 0.16; // side-to-side body tilt
            waddleY = -Math.abs(Math.cos(runCycle)) * 4.5; // waddle bounce
          }

          // Tilt of a bobbing/rotating platform Penny stands on. getSolids() entries
          // have never carried a `rot`, so this was always 0; the per-frame solids
          // rebuild + search that used to compute it is gone (add `rot` to the solids
          // in getSolids() and look it up with findUnder(p, getSolids(), 6) to use it).
          const platformRot = 0;

          // Mother penguin is visually larger
          const destW = 72;
          let destH = 108; // Fallback size

          if (p.onGround && state.state !== "failed") {
            drawContactShadow(x + p.w / 2 + jitterX, y + p.h + FOOT_SINK - 5, 28);
          }

          if (sheet.loaded) {
            destH = (sheet.frameH / sheet.frameW) * destW;
            let frame = penguinAnim.frameIndex;

            // Physics-based jump frame selection & fail frame override
            if (state.state === "failed") {
              frame = 0; // Crying
            } else if (sheet === spriteSheets.jump) {
              frame = p.vy < 0 ? 1 : 2; // Rising: Soaring (1), Falling/Landing: Sliding (2)
            } else {
              const totalFrames = sheet.cols * sheet.rows;
              frame = frame % totalFrames;
            }

            const fs = frameSprite(sheet, frame, destW);

            ctx.save();
            ctx.translate(x + p.w / 2 + jitterX, y + p.h + waddleY + FOOT_SINK);
            ctx.rotate(tilt + waddleTilt + platformRot);
            if (p.isSliding) ctx.scale(1, 0.82); // T049: belly-slide squash

            // Penny sprite sheets face right naturally, so scale direction directly matches facing
            let faceDirection = p.facing;

            ctx.scale(faceDirection, 1);
            ctx.drawImage(fs, -fs.gw / 2, -fs.gh, fs.gw, fs.gh);
            ctx.restore();
          } else {
            // Fallback render
            ctx.save();
            ctx.translate(x + p.w / 2 + jitterX, y + p.h + waddleY + FOOT_SINK);
            ctx.rotate(tilt + waddleTilt + platformRot);
            if (p.isSliding) ctx.scale(1, 0.82); // T049: belly-slide squash

            let faceDirection = p.facing;

            ctx.scale(faceDirection, 1);
            try {
              ctx.drawImage(sheet.img, -destW / 2, -destH, destW, destH);
            } catch (e) {
              // Safe secondary shape draw
              ctx.fillStyle = "#87D0FF";
              ctx.fillRect(-p.w / 2, -p.h, p.w, p.h);
            }
            ctx.restore();
          }

          if (nervous) {
            // Draw sweat drop relative to Mother Penguin's visual head height
            drawEmoji("💦", x + p.w / 2 + 18, y + p.h - destH + 8 + Math.sin(state.time * 10) * 2, 16);
          }

          if (p.carrying && p.carrying.length > 0) {
            // Draw hugging emoji above Penny
            drawEmoji("🤗", x + p.w / 2 - p.facing * 18, y + p.h - destH - 12 + Math.sin(state.time * 6) * 3, 18);

            for (let index = 0; index < p.carrying.length; index++) {
              const cW = 34; // a little smaller than a chick on the ice (CHICK_W)
              const cH = chickSprite.loaded
                ? (chickSprite.frameH / chickSprite.frameW) * cW
                : 30;

              // Hold the chick above the belly in front! Staggered for multiple carried chicks
              const offsetX = 12 + index * 4;
              const offsetY = -destH * 0.4 - index * 12;

              if (chickSprite.loaded) {
                // Alternately blink between the two idle frames
                const flapCycle = Math.floor(state.time * 8 + index) % 2;
                let frame = flapCycle === 0 ? 4 : 5; // wriggling feet while being carried

                const fs = frameSprite(chickSprite, frame, cW);

                ctx.save();
                ctx.translate(x + p.w / 2, y + p.h + waddleY + FOOT_SINK);
                ctx.scale(p.facing, 1); // Face same direction as Mother!
                ctx.translate(offsetX, offsetY);
                ctx.drawImage(fs, -fs.gw / 2, -fs.gh, fs.gw, fs.gh);
                ctx.restore();
              } else {
                drawEmoji("🐥", x + p.w / 2 + offsetX * p.facing, y + p.h + waddleY + offsetY - 10, 20);
              }
            }
          }
        }

        function drawParticles() {
          for (let i = 0; i < state.particles.length; i++) {
            const pt = state.particles[i];
            // off-screen: wind streaks reach `size` px to the right of x, the rest ~30px around
            if (pt.x + (pt.kind === "wind" ? pt.size : 30) < camX || pt.x - 30 > camX + VIEW_W) continue;
            const alpha = Math.max(0, Math.min(1, pt.life / (pt.maxLife || 0.8)));
            ctx.globalAlpha = alpha;
            if (pt.kind === "snow") {
              ctx.fillStyle = pt.color;
              circle(pt.x, pt.y, pt.size, true);
            } else if (pt.kind === "drip") {
              ctx.fillStyle = pt.color;
              ellipse(pt.x, pt.y, pt.size * 0.6, pt.size * 1.3, true, false);
            } else if (pt.kind === "wind") {
              ctx.strokeStyle = pt.color;
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.moveTo(pt.x, pt.y);
              ctx.lineTo(pt.x + pt.size, pt.y);
              ctx.stroke();
            } else if (pt.kind === "emoji") {
              const es = emojiSprite(pt.text, pt.size || 14, false);
              ctx.drawImage(es, pt.x - es.gw / 2, pt.y - es.gh / 2, es.gw, es.gh);
            } else if (pt.kind === "footprint") {
              ctx.fillStyle = pt.color;
              ctx.beginPath();
              ctx.ellipse(pt.x, pt.y, 4, 2, 0, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillStyle = pt.color;
              ctx.strokeStyle = "#111";
              ctx.lineWidth = 2;
              roundedRect(pt.x, pt.y, pt.size, pt.size, 3, true, false);
              roundedRect(pt.x, pt.y, pt.size, pt.size, 3, false, true);
            }
            ctx.globalAlpha = 1;
          }
        }

        // Water body gradient: rebuilt only when the (whole-pixel) sea level or the
        // warmth step changes, not every frame.
        let waterGrad = null;
        let waterGradTop = NaN;
        let waterGradIdx = -1;
        function getWaterGradient(top, wi) {
          const qTop = Math.round(top);
          if (!waterGrad || qTop !== waterGradTop || wi !== waterGradIdx) {
            waterGrad = ctx.createLinearGradient(0, qTop - 24, 0, VIEW_H);
            waterGrad.addColorStop(0, RAMP.water0[wi]);
            waterGrad.addColorStop(1, RAMP.water1[wi]);
            waterGradTop = qTop;
            waterGradIdx = wi;
          }
          return waterGrad;
        }

        // Waves move the surface at most (6 + 16) + 3 = 25 px from the sea level.
        const WATER_BAND = 26;
        const WATER_BAND_TOP = 24; // the gradient starts this far above the sea level
        const waterBody = { c: null, top: NaN, idx: -1, epoch: -1 };
        // The water below ySplit as a device-pixel bitmap blitted 1:1 (gradient colours
        // match getWaterGradient: same two ramp colours from qTop-24 down to the bottom).
        function drawWaterBody(qTop, wi, ySplit) {
          const sc = hiDpi.scale;
          const yDev = Math.round(ySplit * sc);
          const hDev = canvas.height - yDev;
          if (hDev <= 0) return;
          const wDev = canvas.width;
          let c = waterBody.c;
          if (
            !c ||
            waterBody.epoch !== rasterEpoch ||
            waterBody.top !== qTop ||
            waterBody.idx !== wi ||
            c.width !== wDev ||
            c.height !== hDev
          ) {
            if (!c) c = waterBody.c = document.createElement("canvas");
            if (c.width !== wDev || c.height !== hDev) {
              c.width = wDev;
              c.height = hDev;
            }
            const g = c.getContext("2d");
            const grad = g.createLinearGradient(0, (qTop - WATER_BAND_TOP) * sc - yDev, 0, canvas.height - yDev);
            grad.addColorStop(0, RAMP.water0[wi]);
            grad.addColorStop(1, RAMP.water1[wi]);
            g.fillStyle = grad;
            g.fillRect(0, 0, wDev, hDev);
            waterBody.top = qTop;
            waterBody.idx = wi;
            waterBody.epoch = rasterEpoch;
          }
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(c, 0, yDev);
          ctx.restore();
        }

        function drawWater() {
          const top = state.seaLevel;
          const warmthVal = state ? state.warmth : 0;
          const wi = warmIdx(warmthVal);
          const roughness = 1 + warmthVal * 2.2;
          
          const W = VIEW_W;
          const H = VIEW_H;
          const scrollVal = camX;
          ctx.save();
          // Below the wave band the water is a plain vertical gradient: blit it from a
          // bitmap (rebuilt only when the whole-pixel sea level / warmth step changes);
          // only the band the waves move in is a gradient-filled path. The band path runs
          // 2px past the split so the two opaque, same-colour pieces never leave a seam.
          const qTop = Math.round(top);
          const ySplit = qTop + WATER_BAND;
          drawWaterBody(qTop, wi, ySplit);
          ctx.fillStyle = getWaterGradient(top, wi);
          ctx.beginPath();

          ctx.moveTo(0, ySplit + 2);
          for (let x = 0; x <= W + 20; x += 15) {
            const worldX = x + scrollVal;
            const amp = (6 + warmthVal * 16) * Math.sin(worldX * 0.015 + state.time * (2.2 + warmthVal * 2.0));
            const amp2 = 3 * Math.cos(worldX * 0.04 - state.time * 3.5);
            ctx.lineTo(x, top + amp + amp2);
          }
          ctx.lineTo(W, ySplit + 2);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = RAMP.foam[wi]; // foam crest
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          for (let x = 0; x <= W + 20; x += 15) {
            const worldX = x + scrollVal;
            const amp = (6 + warmthVal * 16) * Math.sin(worldX * 0.015 + state.time * (2.2 + warmthVal * 2.0));
            const amp2 = 3 * Math.cos(worldX * 0.04 - state.time * 3.5);
            if (x === 0) ctx.moveTo(0, top + amp + amp2);
            else ctx.lineTo(x, top + amp + amp2);
          }
          ctx.stroke();

          ctx.fillStyle = "rgba(230, 248, 255, 0.85)";
          ctx.strokeStyle = "rgba(100, 180, 220, 0.5)";
          ctx.lineWidth = 1.5;
          for (const chunk of waterIceChunks) {
            const cx = ((chunk.x - scrollVal) % (W + 200) + (W + 200)) % (W + 200) - 100;
            const worldX = cx + scrollVal;
            const amp = (6 + warmthVal * 16) * Math.sin(worldX * 0.015 + state.time * (2.2 + warmthVal * 2.0));
            const cy = top + amp - 4 + Math.sin(state.time * 2.5 + chunk.wobble) * 3;
            
            ctx.beginPath();
            ctx.moveTo(cx - chunk.w/2, cy);
            ctx.lineTo(cx - chunk.w/4, cy - chunk.h);
            ctx.lineTo(cx + chunk.w/4, cy - chunk.h);
            ctx.lineTo(cx + chunk.w/2, cy);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }

          const sealX = ((900 - scrollVal) % (W + 500) + (W + 500)) % (W + 500) - 100;
          const sealWorldX = sealX + scrollVal;
          const sealWaveY = top + (6 + warmthVal * 16) * Math.sin(sealWorldX * 0.015 + state.time * (2.2 + warmthVal * 2.0)) - 10;
          const sealBob = Math.sin(state.time * 1.8) * 4;
          drawEmoji("🦭", sealX, sealWaveY + sealBob, 26);

          const whaleCycle = (state.time) % 24;
          if (whaleCycle < 4.0) {
            const progress = whaleCycle / 4.0;
            const whaleX = ((1400 - scrollVal) % (W + 600) + (W + 600)) % (W + 600) - 100;
            const whaleY = top - 10 - Math.sin(progress * Math.PI) * 45;
            ctx.save();
            ctx.translate(whaleX, whaleY);
            ctx.rotate(progress * Math.PI - Math.PI / 2);
            drawEmoji("🐋", 0, 0, 36);
            ctx.restore();
          }

          ctx.globalAlpha = 0.5 - warmthVal * 0.35;
          ctx.fillStyle = "#A0D5FF";
          ctx.beginPath(); // all bubbles share one fill
          for (let i = 0; i < waterBubbles.length; i++) {
            const b = waterBubbles[i];
            const bx = ((b.x - scrollVal) % (W + 100) + (W + 100)) % (W + 100) - 50;
            const by = top + b.depth + Math.sin(state.time * b.speed * 0.05 + b.phase) * 6;
            ctx.moveTo(bx + b.size, by);
            ctx.arc(bx, by, b.size, 0, TAU);
          }
          ctx.fill();

          for (const f of waterFish) {
            const fx = ((f.baseX + Math.sin(state.time * 0.5 + f.phase) * 110 - scrollVal) % (W + 200) + (W + 200)) % (W + 200) - 100;
            const fy = top + f.depth + Math.cos(state.time * 0.8 + f.phase) * 10;
            ctx.save();
            ctx.translate(fx, fy);
            ctx.scale(f.dir, 1);
            drawEmoji("🐟", 0, 0, 15);
            ctx.restore();
          }

          ctx.restore();
        }

        function drawWorldHud() {
          const nearValve =
            Math.hypot(
              state.player.x + state.player.w / 2 - state.valve.x,
              state.player.y + state.player.h / 2 - state.valve.y,
            ) < 78;
          if (nearValve && state.state === "playing") {
            const bounce = Math.sin(state.time * 6) * 3;
            const sx = state.valve.x - camX;
            const sy = state.valve.y - 70 + bounce;
            // "E" and "tap ☸️" shown together — a keyboard-only hint
            // would leave touch players (no keyboard) with no message
            // at all, so both input paths are spelled out every time.
            ctx.fillStyle = "#FFF7E8";
            roundedRect(sx - 68, sy - 18, 136, 32, 8, true, false);
            ctx.strokeStyle = "#111";
            ctx.lineWidth = 3;
            roundedRect(sx - 68, sy - 18, 136, 32, 8, false, true);
            ctx.fillStyle = "#111";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = "900 12px Arial";
            ctx.fillText("Tap SPIN / press E", sx, sy - 1);
          }
        }
        function drawCloud(x, y, scale, layer) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(scale, scale);

          // Back clouds are softer and more transparent
          ctx.globalAlpha = layer === "back" ? 0.45 : 1;
          ctx.fillStyle = layer === "back" ? "#eef6ff" : "#ffffff";
          ctx.strokeStyle = "#1e293b";
          ctx.lineWidth = 3;

          ctx.beginPath();

          ctx.moveTo(-20, 8);

          ctx.bezierCurveTo(-38, 8, -38, -12, -20, -12);

          ctx.bezierCurveTo(-20, -30, 20, -30, 20, -12);

          ctx.bezierCurveTo(38, -12, 38, 8, 20, 8);

          ctx.closePath();

          ctx.fill();

          if (layer !== "back") {
            ctx.stroke();
          }

          ctx.restore();
        }

        function roundedRect(x, y, w, h, r, fill, stroke) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          if (fill) ctx.fill();
          if (stroke) ctx.stroke();
        }

        function circle(x, y, r, fill) {
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          if (fill) ctx.fill();
          else ctx.stroke();
        }

        function ellipse(x, y, rx, ry, fill, stroke) {
          ctx.beginPath();
          ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
          if (fill) ctx.fill();
          if (stroke) ctx.stroke();
        }

        // Flat soft ellipse under a character's feet so it reads as standing ON
        // the ice rather than floating in front of it.
        // (No save/restore: every caller sets its own fill before the next fill.)
        function drawContactShadow(x, y, halfW) {
          ctx.fillStyle = "rgba(18, 40, 78, 0.3)";
          ctx.beginPath();
          ctx.ellipse(x, y, halfW, halfW * 0.26, 0, 0, TAU);
          ctx.fill();
        }

        // Inked emoji, drawn from a cached bitmap (see emojiSprite) centred on x, y.
        function drawEmoji(emoji, x, y, size) {
          const c = emojiSprite(emoji, size, true);
          ctx.drawImage(c, x - c.gw / 2, y - c.gh / 2, c.gw, c.gh);
        }

        function setControl(name, isDown) {
          if (name === "left") input.left = isDown;
          if (name === "right") input.right = isDown;
          if (name === "slide") input.slide = isDown; // T049
          if (name === "jump") {
            if (isDown && !input.jump) input.jumpPressed = true;
            input.jump = isDown;
          }
          if (name === "action" && isDown) input.actionPressed = true;
        }

        window.addEventListener(
          "keydown",
          (e) => {
            const k = e.key.toLowerCase();
            if (
              [
                "arrowleft",
                "arrowright",
                "arrowup",
                "arrowdown",
                " ",
                "a",
                "d",
                "w",
                "s",
                "e",
              ].includes(k)
            )
              e.preventDefault();
            if (k === "arrowleft" || k === "a") input.left = true;
            if (k === "arrowright" || k === "d") input.right = true;
            if (k === "arrowdown" || k === "s") input.slide = true; // T049
            if ((k === "arrowup" || k === "w" || k === " ") && !input.jump) {
              input.jump = true;
              input.jumpPressed = true;
            }
            if (k === "e") input.actionPressed = true;
          },
          { passive: false },
        );

        window.addEventListener("keyup", (e) => {
          const k = e.key.toLowerCase();
          if (k === "arrowleft" || k === "a") input.left = false;
          if (k === "arrowright" || k === "d") input.right = false;
          if (k === "arrowdown" || k === "s") input.slide = false; // T049
          if (k === "arrowup" || k === "w" || k === " ") input.jump = false;
        });

        document.querySelectorAll("[data-control]").forEach((btn) => {
          const name = btn.getAttribute("data-control");
          const onDown = (e) => {
            e.preventDefault();
            setControl(name, true);
          };
          const onUp = (e) => {
            e.preventDefault();
            setControl(name, false);
          };
          btn.addEventListener("pointerdown", onDown);
          btn.addEventListener("pointerup", onUp);
          btn.addEventListener("pointercancel", onUp);
          btn.addEventListener("pointerleave", onUp);
        });

        // Main loop: GOGEngine.GameLoop (fixed 60 Hz steps) instead of this stage's own
        // requestAnimationFrame. update() keeps its "dt in seconds" meaning (dt = 1/60 s
        // per step), so every speed is unchanged at 60 fps; below 30 fps the world now
        // catches up (up to 5 steps per frame) instead of crawling in slow motion under
        // the old 0.033 s dt clamp. The loop draws after a step (or a resize), and it
        // stops requesting animation frames while the page is hidden.
        function step(dt) {
          // "How to play" / "Did you know?" pop-up open: freeze the world (and skip drawing).
          if (GOGUi.paused) return;

          // Update background clouds position
          for (const cloud of clouds) {
            cloud.x += cloud.speed * dt;
            if (cloud.x > 800 + 120) {
              cloud.x = -120;
            }
          }

          if (gameRunning) {
            update(dt);
          } else {
            updatePenguinAnim(dt);
          }
        }

        const loop = new GOGEngine.GameLoop({
          update: step,
          draw: function () {
            if (!GOGUi.paused) render();
          },
        });

        if (ui.helpBtn) {
          // Replay the guided intro: a fresh run with the coach on.
          ui.helpBtn.addEventListener("click", function () {
            if (activeOverlay || !state || state.state !== "playing") return;
            resetGame();
            coach.start();
          });
        }

        state = createState();
        updateUI();
        render();
        loop.start();
        showPennyIntroBeat();
      })();
    </script>
  </body>
</html>

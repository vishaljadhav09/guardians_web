<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Penny on Thin Ice — Guardians of Gaia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/styles.css" />
    <style>
      .stage-wrap {
        width: min(1180px, calc(100vw - 28px));
        max-width: 1180px;
        margin: 0 auto;
        padding: 12px 0 32px;
        animation: pageFadeIn 0.5s ease both;
      }
      .stage-hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .stage-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .stage-title h1 {
        font-size: 1.25rem;
      }
      .stage-title small {
        display: block;
        font-family: var(--gog-font-hand);
        font-size: 1rem;
        color: #4d5c37;
      }
      .hud-mid {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .meter {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--gog-white);
        border: 3px solid var(--gog-ink);
        border-radius: 999px;
        padding: 6px 14px 6px 10px;
        box-shadow: var(--gog-shadow-sm);
        min-width: 168px;
        position: relative;
      }
      .meter .label,
      .meter .meter-track {
        position: relative;
        z-index: 2;
      }
      .meter .label {
        font-size: 0.78rem;
        font-weight: 700;
        white-space: nowrap;
      }
      .meter-track {
        flex: 1;
        height: 10px;
        border-radius: 999px;
        background: #d8e8f5;
        border: 2px solid var(--gog-ink);
        overflow: hidden;
      }
      .meter-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #3dd6c0, #2e5ee8);
        transition: width 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .timer-chip {
        font-weight: 700;
        min-width: 64px;
        text-align: center;
      }
      .canvas-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        max-height: calc(100vh - 220px);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        margin: 0 auto;
        /* max-width: 800px; */
      }
      @keyframes warmthPulse {
        0%,
        100% {
          box-shadow:
            4px 4px 0 var(--gog-ink),
            0 0 0 0 rgba(239, 68, 68, 0);
        }
        50% {
          box-shadow:
            4px 4px 0 var(--gog-ink),
            0 0 22px 6px rgba(239, 68, 68, 0.55);
        }
      }
      .canvas-frame.warmth-danger {
        animation: warmthPulse 1.1s ease-in-out infinite;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .controls {
        position: absolute;
        inset: auto 12px 12px 12px;
        display: flex;
        justify-content: space-between;
        align-items: end;
        pointer-events: none;
        z-index: 10;
      }
      .dpad,
      .jump-wrap {
        display: grid;
        grid-template-columns: repeat(3, 66px);
        grid-template-rows: repeat(3, 66px);
        gap: 5px;
        pointer-events: auto;
        align-items: center;
        justify-items: center;
      }
      .ctrl-btn {
        width: 76px;
        height: 76px;
        border: 3px solid var(--gog-ink);
        background: #fff;
        box-shadow: 5px 5px 0 var(--gog-ink);
        border-radius: 20px;
        font-size: 28px;
        font-weight: 900;
        color: var(--gog-ink);
        user-select: none;
        touch-action: none;
        cursor: pointer;
        transition:
          transform 0.08s,
          box-shadow 0.08s;
      }
      .ctrl-btn:active {
        transform: translate(4px, 4px);
        box-shadow: 1px 1px 0 var(--gog-ink);
      }
      @media (max-width: 700px) {
        .ctrl-btn {
          width: 62px;
          height: 62px;
          font-size: 22px;
        }
      }

      .calm-badge {
        font-size: 0.78rem;
        font-weight: 700;
        animation: fadeInUp 0.6s ease both;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        min-width: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--gog-white);
        border: 3px solid var(--gog-ink);
        border-radius: 50%;
        box-shadow: 3px 3px 0 var(--gog-ink);
        font-size: 1.15rem;
        line-height: 1;
        touch-action: manipulation;
      }

      @media (max-width: 700px) {
        .stage-wrap {
          width: calc(100vw - 12px);
          max-width: 100%;
          padding: 6px 0 18px;
        }

        .stage-hud {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 6px;
          margin-bottom: 8px;
        }

        .stage-title {
          gap: 6px;
          min-width: 0;
        }

        .stage-title .emoji-float {
          font-size: 1.35rem !important;
        }

        .stage-title h1 {
          font-size: 0.98rem;
          line-height: 1;
        }

        .stage-title small {
          display: none;
        }

        .hud-mid {
          display: grid;
          grid-template-columns: minmax(128px, 1fr) repeat(4, auto);
          gap: 5px;
          align-items: center;
          width: 100%;
        }

        .meter {
          min-width: 0;
          gap: 5px;
          padding: 4px 8px 4px 7px;
          border-width: 2px;
          box-shadow: 2px 2px 0 var(--gog-ink);
        }

        .meter .label {
          font-size: 0.66rem;
        }

        .meter-track {
          height: 8px;
          border-width: 2px;
        }

        .chip {
          padding: 4px 7px;
          border-width: 2px;
          box-shadow: 2px 2px 0 var(--gog-ink);
          font-size: 0.72rem;
          min-height: 30px;
        }

        .timer-chip {
          min-width: 44px;
        }

        .icon-btn {
          width: 32px;
          height: 32px;
          min-width: 32px;
          font-size: 0.92rem;
          border-width: 2px;
          box-shadow: 2px 2px 0 var(--gog-ink);
        }

        .guideBar {
          gap: 6px;
          padding: 3px 4px;
          margin-bottom: 8px;
          border-width: 2px;
          border-radius: 8px;
          box-shadow: 1px 1px 0 var(--gog-ink);
        }

        .guideAvatar {
          font-size: 1.25rem;
        }

        .guideBubble {
          padding: 5px 8px;
          border-width: 2px;
          border-radius: 10px;
          font-size: 1rem;
          line-height: 1.1;
        }

        .canvas-frame {
          border-width: 3px;
          border-radius: 12px;
          box-shadow: 4px 4px 0 var(--gog-ink);
        }

        .stage-controls {
          margin-top: 8px;
          gap: 6px;
        }

        .stage-controls .brutal-btn {
          padding: 8px 12px;
          min-height: 38px;
          border-width: 3px;
          border-radius: 10px;
          font-size: 0.86rem;
          box-shadow: 3px 3px 0 var(--gog-ink);
        }

        .calm-badge {
          font-size: 0.72rem;
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      body {
        position: relative;
      }

      .page-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at 50% -8%,
            #efffdd 0%,
            #d4f0bd 42%,
            #fdf6e6 100%
          ),
          linear-gradient(
            180deg,
            rgba(60, 135, 67, 0.1),
            rgba(36, 99, 55, 0.16)
          );
      }

      .page-bubble {
        position: absolute;
        bottom: -10vh;
        border-radius: 999px;
        background: radial-gradient(
          circle at 32% 28%,
          rgba(255, 255, 255, 0.95),
          rgba(201, 242, 61, 0.14) 70%
        );
        opacity: 0;
        animation: pageBubbleRise linear infinite;
      }

      @keyframes pageBubbleRise {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 0;
        }
        8% {
          opacity: 0.5;
        }
        90% {
          opacity: 0.35;
        }
        100% {
          transform: translateY(-125vh) translateX(var(--drift, 24px));
          opacity: 0;
        }
      }

      .page-fx {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .page-bubble {
          animation: none;
          opacity: 0;
        }
      }
    </style>
  </head>

    <div class="stage-wrap">
      <div class="stage-hud">
        <div class="stage-title">
          <span style="font-size: 1.8rem" class="emoji-float">🐧</span>
          <div>
            <h1>Penny on Thin Ice</h1>
            <small>Stage 4 · Polar Ice</small>
          </div>
        </div>
        <div class="hud-mid">
          <div class="meter" title="Ice Warmth" id="warmthMeter">

      <!-- Spika Mascot Guide Bar -->

      <div class="brutal-box canvas-frame" id="canvasFrame">

            <div></div>

            <div></div>
            <button
              class="ctrl-btn"
              data-control="right"
              aria-label="Move right"

            <button
              class="ctrl-btn"

    <script>
      (() => {
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const STAGE_ID = "stage04";
        const stageMeta = GOGContent.byId(STAGE_ID);
        let save = GOGSave.load();
        let calmMode = !!save.settings.calmMode;

        const audio = new GOGEngine.Audio(!save.settings.sound);

        const ui = {
          warmFill: document.getElementById("warmFill"),
          warmthText: document.getElementById("warmthText"),
          rescuedText: document.getElementById("rescuedChip"),
          iceText: document.getElementById("iceChip"),
          seaText: document.getElementById("seaChip"),
          muteBtn: document.getElementById("muteBtn"),
          calmBadge: document.getElementById("calmBadge"),
          guideText: document.getElementById("guideText"),
          canvasFrame: document.getElementById("canvasFrame"),
        };

        function syncMuteBtn() {
          if (ui.muteBtn) {
            ui.muteBtn.textContent = audio.muted ? "🔇" : "🔈";
          }
        }
        syncMuteBtn();

        if (ui.muteBtn) {
          ui.muteBtn.addEventListener("click", () => {
            const nowMuted = !audio.muted;
            audio.setMuted(nowMuted);
            syncMuteBtn();
            GOGSave.patch({ settings: { sound: !nowMuted } });
          });
        }

        // Preload and monitor state animations
        const spriteSheets = {
          idle: {
            img: new Image(),
            src: "assets/sprites/stage04/Penguin_idel.png",
            cols: 3,
            rows: 3,
            loaded: false,
            frameW: 0,
            frameH: 0,
          },
          running: {
            img: new Image(),
            src: "assets/sprites/stage04/penguin-running.png",
            cols: 3,
            rows: 3,
            loaded: false,
            frameW: 0,
            frameH: 0,
          },
          jump: {
            img: new Image(),
            src: "assets/sprites/stage04/Penguin_jump.png",
            cols: 3,
            rows: 3,
            loaded: false,
            frameW: 0,
            frameH: 0,
          },
        };

        Object.keys(spriteSheets).forEach((key) => {
          const sheet = spriteSheets[key];
          sheet.img.src = sheet.src;
          sheet.img.onload = function () {
            sheet.frameW = sheet.img.naturalWidth / sheet.cols;
            sheet.frameH = sheet.img.naturalHeight / sheet.rows;
            sheet.loaded = true;
          };
        });

        const penguinAnim = {
          frameIndex: 0,
          elapsed: 0,
          fps: 7,
        };

        // Determine active dynamic animation state sheet
        function getActiveSpriteSheet() {
          if (!state) return spriteSheets.idle;
          const p = state.player;
          if (!p.onGround) {
            return spriteSheets.jump;
          } else if (Math.abs(p.vx) > 15) {
            return spriteSheets.running;
          }
          return spriteSheets.idle;
        }

        function updatePenguinAnim(dt) {
          const sheet = getActiveSpriteSheet();
          penguinAnim.elapsed += dt;
          var frameTime = 1 / penguinAnim.fps;
          const totalFrames = sheet.cols * sheet.rows;

          while (penguinAnim.elapsed >= frameTime) {
            penguinAnim.elapsed -= frameTime;
            penguinAnim.frameIndex = (penguinAnim.frameIndex + 1) % totalFrames;
          }
        }

        const WORLD_W = 2000;
        const WORLD_H = 600;
        const CAMERA_LERP = 0.12;
        const TARGET_RESCUES = 5;

        const clouds = [
          // Far/Back clouds (slow, semi-transparent)
          { x: 80, y: 60, scale: 0.6, speed: 3, layer: "back" },
          { x: 300, y: 90, scale: 0.7, speed: 4, layer: "back" },
          { x: 580, y: 50, scale: 0.5, speed: 2.5, layer: "back" },
          { x: 780, y: 80, scale: 0.65, speed: 3.5, layer: "back" },

          // Near/Front clouds (faster, outline style)
          { x: 160, y: 110, scale: 0.9, speed: 8, layer: "front" },
          { x: 620, y: 145, scale: 1.15, speed: 6, layer: "front" },
          { x: 390, y: 80, scale: 0.7, speed: 10, layer: "front" },
        ];

        const input = {
          left: false,
          right: false,
          jump: false,
          jumpPressed: false,
          actionPressed: false,
        };

        let state;
        let lastTime = 0;
        let cameraX = 0;
        let gameRunning = false;

        let winWipeRadius = 0;
        let winWipeMax = Math.hypot(canvas.width, canvas.height) * 0.6;
        let winWiping = false;
        let winWipeDone = false;


        function rectsOverlap(a, b) {
          return (
            a.x < b.x + b.w &&
            a.x + a.w > b.x &&
            a.y < b.y + b.h &&
            a.y + a.h > b.y
          );
        }

        function clamp(v, min, max) {
          return Math.max(min, Math.min(max, v));
        }

        function createState() {
          const stableBase = { x: 40, y: 380, w: 240, h: 200, label: "home" };
          const valvePlatform = {
            x: 1040,
            y: 340,
            w: 260,
            h: 30,
            stable: true,
            label: "valveBase",
          };
          const meltPlatforms = [
            {
              x: 330,
              y: 396,
              w: 170,
              h: 26,
              baseW: 170,
              h0: 26,
              drift: 12,
              phase: 0.4,
              shrink: 0.0,
              gone: false,
            },
            {
              x: 560,
              y: 390,
              w: 150,
              h: 24,
              baseW: 150,
              h0: 24,
              drift: 16,
              phase: 1.8,
              shrink: 0.0,
              gone: false,
            },
            {
              x: 760,

              w: 140,
              h: 24,
              baseW: 140,
              h0: 24,
              drift: 10,
              phase: 3.1,
              shrink: 0.0,
              gone: false,
            },
            {
              x: 930,
              y: 420,
              w: 160,
              h: 24,
              baseW: 160,
              h0: 24,
              drift: 14,
              phase: 2.1,
              shrink: 0.0,
              gone: false,
            },
            {
              x: 1160,

              w: 140,
              h: 24,
              baseW: 140,
              h0: 24,
              drift: 9,
              phase: 0.9,

            },
            {
              x: 1360,
              y: 360,
              w: 170,
              h: 24,
              baseW: 170,
              h0: 24,
              drift: 18,
              phase: 2.6,
              shrink: 0.0,
              gone: false,
            },
            {
              x: 1600,
              y: 300,
              w: 145,
              h: 24,
              baseW: 145,
              h0: 24,
              drift: 11,
              phase: 4.2,
              shrink: 0.0,
              gone: false,
            },
          ];

          const chicks = [
            {
              x: 380,
              y: 380,
              rescued: false,
              delivered: false,
              carrier: false,
              bob: 0.0,
            },
            {
              x: 600,

              rescued: false,
              delivered: false,

              bob: 0.8,
            },
            {
              x: 805,

            },
            {
              x: 1405,

              rescued: false,

              carrier: false,
              bob: 2.1,
            },
            {
              x: 1635,
              y: 260,
              rescued: false,

              bob: 3.3,
            },
          ];

          return {
            time: 0,
            seaLevel: 560,
            warmth: 0,
            coolingTimer: 0,
            rescuedCount: 0,
            meltedCount: 0,
            player: {
              x: 96,
              y: 300,
              w: 42,
              h: 52,
              vx: 0,
              vy: 0,
              speed: 960,
              maxSpeed: 255,
              drag: 0.84,
              gravity: 1450,
              jumpPower: 520,
              onGround: false,
              facing: 1,
              carrying: [],
              spawnX: 96,
              spawnY: 300,
            },
            stableBase,
            valvePlatform,
            valve: {
              x: 1145,
              y: 284,
              r: 28,
              coolAmount: 0.28,
              activeFlash: 0,
              pulse: 0,
            },
            meltPlatforms,
            chicks,
            particles: [],
            floatingTexts: [],
            state: "playing",
            endTimer: 0,
          };
        }

        let activeOverlay = null;
        let cutsceneTimer = null;

        function showIntro() {
          GOGUi.say(
            "Help Penny rescue the chicks and bring them home to the safe iceberg! 🐧",
          );
          activeOverlay = GOGUi.showOverlay({
            accent: "var(--gog-lime)",
            title: "🐧 Penny on Thin Ice",
            body: "Penny wakes in a warming polar dream. The floating ice shrinks faster when she stands still, so keep hopping, cool the valve, rescue chicks, and bring them home to the safe iceberg.<br><br><strong>Move:</strong> Arrow keys / WASD or touch buttons.<br><strong>Jump:</strong> Up / W / Space.<br><strong>Cool Valve:</strong> Stand near the valve, press E (or tap ☸️).",
            primaryLabel: "Start Dream",
            onPrimary: function () {
              GOGUi.closeOverlay(activeOverlay);
              activeOverlay = null;
              startGame();
            },
          });
        }

        function triggerSeedReturnCutscene(onComplete) {
          const overlay = document.getElementById("cutscene");
          const treeIcon = document.getElementById("csTreeIcon");
          if (!overlay) {
            onComplete();
            return;
          }
          overlay.classList.add("show");
          if (treeIcon) {
            GOGUi.restartAnimation(treeIcon, "pulse");
          }
          GOGUi.say("A seed is heading home to the Tree… 🌱");

          function closeCutscene() {
            overlay.classList.remove("show");
            if (cutsceneTimer) clearTimeout(cutsceneTimer);
            onComplete();
          }

          const skipBtn = document.getElementById("csSkipBtn");
          if (skipBtn) {
            const newSkip = skipBtn.cloneNode(true);
            skipBtn.parentNode.replaceChild(newSkip, skipBtn);
            newSkip.addEventListener("click", closeCutscene);
          }

          cutsceneTimer = setTimeout(closeCutscene, 2200);
        }

        function resetGame() {
          state = createState();
          cameraX = 0;
          gameRunning = true;
          if (activeOverlay) {
            GOGUi.closeOverlay(activeOverlay);
            activeOverlay = null;
          }
        }

        function startGame() {
          resetGame();
        }

        // Set initial calm mode check in HUD on startup
        if (ui.calmBadge) {
          ui.calmBadge.textContent = calmMode
            ? "🧘 Calm mode: no sea level rise"
            : "";
        }

        function failGame(reason) {
          state.state = "failed";
          gameRunning = false;
          audio.oops();
          if (ui.canvasFrame) {
            ui.canvasFrame.classList.add("flash-lose");
          }
          GOGUi.say("Penny splashed! Let's try again 💙");
          activeOverlay = GOGUi.showOverlay({
            title: "Take Another Glide",
            body:
              reason ||
              "The water got too cozy. Try again with quicker rescues and a timely valve spin.",
            primaryLabel: "Try Again",
            secondaryLabel: "Back to Map",
            onPrimary: function () {
              if (ui.canvasFrame) {
                ui.canvasFrame.classList.remove("flash-lose");
              }
              GOGUi.closeOverlay(activeOverlay);
              activeOverlay = null;
              resetGame();
            },
            onSecondary: function () {
              window.location.href = "../index.html";
            },
          });
        }

        function winGame() {
          state.state = "won";
          state.endTimer = 0;
          audio.win();
        }

        let pendingStars = 1;

        function finishWinIce() {
          gameRunning = false;

          const nextSave = GOGSave.recordStageClear(STAGE_ID, {
            stars: pendingStars,
            sprouts: 15,
            smogDrop: 10,
          });
          save = nextSave;

          if (ui.canvasFrame) {
            ui.canvasFrame.classList.add("flash-win");
          }

          GOGUi.say("You did it! A seed is heading home to the Tree… 🌱");

          let confettiBursts = 0;
          const confettiInterval = setInterval(function () {
            GOGUi.confettiAt(
              window.innerWidth / 2,
              window.innerHeight / 2,
              16,
            );
            confettiBursts++;
            if (confettiBursts >= 3) clearInterval(confettiInterval);
          }, 220);

          setTimeout(function () {
            triggerSeedReturnCutscene(function () {
              activeOverlay = GOGUi.showOverlay({
                accent: "var(--gog-white)",
                title: "❄️ Polar Ice Restored!",
                body: "Penny wakes completely as the sea calms and the ice reforms.",
                stars: pendingStars,
                factText: stageMeta.fact,
                primaryLabel: "Back to Map",
                secondaryLabel: "Play Again",
                onPrimary: function () {
                  window.location.href = "../index.html";
                },
                onSecondary: function () {
                  window.location.reload();
                },
              });
            });
          }, 750);
        }

        function update(dt) {
          if (!state || state.state === "failed") return;

          state.time += dt;
          updatePenguinAnim(dt);
          const p = state.player;

          if (state.state === "won") {
            state.endTimer += dt;
            state.seaLevel = Math.min(600, state.seaLevel + 80 * dt);
            state.warmth = Math.max(0, state.warmth - 0.35 * dt);
            p.vx *= 0.92;
            p.vy += p.gravity * dt * 0.25;
            movePlayer(p, dt, true);
            if (state.endTimer > 1.1 && !winWiping && !winWipeDone) {
              let stars = 1;
              if (!calmMode) {
                if (state.warmth <= 0.25) stars = 3;
                else if (state.warmth <= 0.6) stars = 2;
              }
              pendingStars = stars;
              audio.win();
              winWipeRadius = 0;
              winWiping = true;
            }
            if (winWiping) {
              winWipeRadius += dt * winWipeMax * 1.6;
              if (winWipeRadius >= winWipeMax) {
                winWiping = false;
                winWipeDone = true;
                finishWinIce();
              }
            }
            updateUI();
            updateParticles(dt);
            updateFloatingTexts(dt);
            return;
          }

          const warmingRate = calmMode
            ? 0
            : state.coolingTimer > 0
              ? 0.005
              : 0.012;
          state.warmth = clamp(state.warmth + warmingRate * dt, 0, 1);
          if (state.coolingTimer > 0) {
            state.coolingTimer = Math.max(0, state.coolingTimer - dt);
            state.valve.activeFlash = Math.max(
              0,
              state.valve.activeFlash - dt * 1.7,
            );
          }
          state.valve.pulse += dt;

          const seaRise = calmMode ? 0 : 1.5 + state.warmth * 5;
          state.seaLevel = clamp(state.seaLevel - seaRise * dt, 480, 560);

          const accel = p.speed * dt;
          if (input.left) {
            p.vx -= accel;
            p.facing = -1;
          }
          if (input.right) {
            p.vx += accel;
            p.facing = 1;
          }
          if (!input.left && !input.right) {
            p.vx *= Math.pow(p.drag, dt * 60);
            if (Math.abs(p.vx) < 3) p.vx = 0;
          }
          p.vx = clamp(p.vx, -p.maxSpeed, p.maxSpeed);

          if (input.jumpPressed && p.onGround) {
            p.vy = -p.jumpPower;
            p.onGround = false;
            audio.blip(320, 60);
            spawnBurst(p.x + p.w / 2, p.y + p.h, 8, "#8FD3FF");
          }
          input.jumpPressed = false;

          p.vy += p.gravity * dt;

          updatePlatforms(dt);
          movePlayer(p, dt, false);
          updateChicks(dt);
          updateValve(dt);
          updateParticles(dt);
          updateFloatingTexts(dt);
          updateCamera(dt);
          updateUI();

          if (p.y > WORLD_H + 120 || p.y + p.h >= state.seaLevel) {
            failGame(
              "Penny splashed into the rising water. Try a faster route and cool the valve sooner.",
            );
            return;
          }
        }

        function updatePlatforms(dt) {
          const p = state.player;
          for (const pl of state.meltPlatforms) {
            if (pl.gone) {
              pl.refreezeTimer = (pl.refreezeTimer || 0) + dt;
              if (pl.refreezeTimer > 4.0) {
                pl.gone = false;
                pl.shrink = 0;
                pl.w = pl.baseW;
                pl.refreezeTimer = 0;
                spawnBurst(pl.x + pl.baseW / 2, pl.y + 6, 8, "#A0E0FF");
              }
              continue;
            }
            pl.t = (pl.t || 0) + dt;
            pl.y += Math.sin(state.time * 0.55 + pl.phase) * 4 * dt;

            const topBand = {
              x: pl.x + pl.shrink * 0.5,
              y: pl.y,
              w: pl.baseW - pl.shrink,
              h: pl.h,
            };

            const standing =
              p.onGround &&
              p.vy >= -10 &&
              p.x + p.w > topBand.x + 8 &&
              p.x < topBand.x + topBand.w - 8 &&
              Math.abs(p.y + p.h - topBand.y) < 8;
            const meltRate = calmMode
              ? standing
                ? 1
                : 0
              : 0.1 +
                state.warmth * 0.4 +
                (standing ? 3 + state.warmth * 5 : 0);
            pl.shrink += meltRate * dt;
            pl.w = Math.max(48, pl.baseW - pl.shrink);
            if (pl.shrink > pl.baseW - 42) {
              pl.gone = true;
              pl.refreezeTimer = 0;
              state.meltedCount += 1;
              spawnBurst(pl.x + pl.baseW / 2, pl.y + 6, 12, "#DFF6FF");
              if (standing) {
                p.onGround = false;
              }
            }
          }
        }

        function movePlayer(p, dt, soft) {
          const prevBottom = p.y + p.h;

          p.x += p.vx * dt;
          p.x = clamp(p.x, 0, WORLD_W - p.w);

          p.y += p.vy * dt;
          p.onGround = false;

          const solids = getSolids();
          for (const s of solids) {
            if (!rectsOverlap(p, s)) continue;
            if (p.vy >= 0 && prevBottom <= s.y + 6) {
              p.y = s.y - p.h;
              p.vy = 0;
              p.onGround = true;
            }
          }

          if (p.onGround && !soft) {
            const under = solids.find(
              (s) =>
                p.x + p.w > s.x &&
                p.x < s.x + s.w &&
                Math.abs(p.y + p.h - s.y) < 4,
            );
            if (under && under.drift) {
              p.x += under.drift * dt;
            }
          }
        }

        function getSolids() {
          const solids = [
            {
              x: state.stableBase.x,
              y: state.stableBase.y,
              w: state.stableBase.w,
              h: state.stableBase.h,
            },
            {
              x: state.valvePlatform.x,
              y: state.valvePlatform.y,
              w: state.valvePlatform.w,
              h: state.valvePlatform.h,
              stable: true,
            },
          ];
          for (const pl of state.meltPlatforms) {
            if (pl.gone) continue;
            const drift = Math.cos(state.time * 0.55 + pl.phase) * pl.drift;
            solids.push({
              x: pl.x + pl.shrink * 0.5,
              y: pl.y,
              w: pl.w,
              h: pl.h,
              drift,
            });
          }
          return solids;
        }

        function updateChicks(dt) {
          const p = state.player;
          for (const chick of state.chicks) {
            chick.bob += dt * 3;
            if (chick.delivered) continue;

            const carryIndex = p.carrying.indexOf(chick);
            if (carryIndex !== -1) {
              chick.x = p.x + p.w / 2 - 8;
              chick.y = p.y - 18 - carryIndex * 14;
              const homeZone = {
                x: state.stableBase.x,
                y: state.stableBase.y - 100,
                w: state.stableBase.w,
                h: 200,
              };
              if (rectsOverlap(p, homeZone) && p.onGround) {
                chick.delivered = true;
                chick.rescued = true;
                p.carrying = p.carrying.filter((c) => c !== chick);
                state.rescuedCount += 1;
                audio.heal();
                spawnBurst(chick.x, chick.y, 14, "#FFD84D");
                spawnFloatText(chick.x, chick.y - 12, "Safe! +1 💚", "#3aa655");
                if (state.rescuedCount >= TARGET_RESCUES) {
                  winGame();
                }
              }
              continue;
            }
            const chickRect = { x: chick.x, y: chick.y, w: 18, h: 18 };
            if (!chick.rescued && rectsOverlap(p, chickRect)) {
              chick.rescued = true;
              p.carrying.push(chick);
              audio.collect();
              spawnBurst(chick.x, chick.y, 10, "#FFE680");
              spawnFloatText(chick.x, chick.y - 12, "Got one! 🐥", "#2e5ee8");
            }
            if (chick.y + 16 >= state.seaLevel) {
              const homeRestock = state.chicks.find(
                (c) => !c.rescued && !c.delivered && c !== chick,
              );
              if (
                !homeRestock &&
                !chick.delivered &&
                !p.carrying.includes(chick)
              ) {
                failGame(
                  "A chick slipped into the water. Try shorter rescue routes and keep the floes from vanishing under you.",
                );
                return;
              }
            }
          }
        }

        function updateValve(dt) {
          const p = state.player;
          const dx = p.x + p.w / 2 - state.valve.x;
          const dy = p.y + p.h / 2 - state.valve.y;
          const near = Math.hypot(dx, dy) < 78;
          if (near && input.actionPressed) {
            state.warmth = Math.max(0, state.warmth - state.valve.coolAmount);
            state.coolingTimer = 8;
            state.valve.activeFlash = 1;
            audio.blip(520, 150);
            spawnBurst(state.valve.x, state.valve.y, 16, "#87E1FF");
          }
          input.actionPressed = false;
        }

        function updateParticles(dt) {
          for (let i = state.particles.length - 1; i >= 0; i--) {
            const pt = state.particles[i];
            pt.life -= dt;
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            pt.vy += 180 * dt;
            if (pt.life <= 0) state.particles.splice(i, 1);
          }
        }

        function updateCamera(dt) {
          const target = clamp(state.player.x - 240, 0, WORLD_W - canvas.width);
          cameraX += (target - cameraX) * Math.min(1, CAMERA_LERP * dt * 60);
        }

        function warmthGradient(w) {
          if (w < 0.4) return "linear-gradient(90deg, #3dd6c0, #2e5ee8)"; // cool & safe
          if (w < 0.7) return "linear-gradient(90deg, #ffd23f, #ff8c42)"; // caution
          return "linear-gradient(90deg, #ff8c42, #ef4444)"; // danger
        }

        function updateUI() {
          if (ui.warmFill) {
            ui.warmFill.style.width = (state.warmth * 100).toFixed(0) + "%";
            ui.warmFill.style.background = warmthGradient(state.warmth);
          }
          if (ui.canvasFrame) {
            ui.canvasFrame.classList.toggle(
              "warmth-danger",
              state.warmth >= 0.7 && state.state === "playing",
            );
          }
          if (ui.warmthText)
            ui.warmthText.textContent = (state.warmth * 100).toFixed(0) + "%";
          if (ui.rescuedText)
            ui.rescuedText.textContent =
              "🐥 " + state.rescuedCount + " / " + TARGET_RESCUES + " rescued";
          if (ui.iceText)
            ui.iceText.textContent =
              "🧊 " +
              state.meltPlatforms.filter((pl) => !pl.gone).length +
              " floes left";
          const seaPct = Math.round(((560 - state.seaLevel) / 140) * 100);
          if (ui.seaText)
            ui.seaText.textContent = "🌊 Sea " + Math.max(0, seaPct) + "%";
        }

        function spawnBurst(x, y, count, color) {
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 40 + Math.random() * 130;
            state.particles.push({
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 30,
              life: 0.4 + Math.random() * 0.45,
              color,
              size: 4 + Math.random() * 5,
            });
          }
        }

        // Floating reward-text pop-ups — short, bouncy, high-contrast
        // confirmation text ("Got one! 🐥") at the exact moment something
        // good happens, so the stage's message is felt instantly instead
        // of only showing up later as a HUD chip number.
        function spawnFloatText(x, y, text, color) {
          state.floatingTexts.push({
            x,
            y,
            text,
            color: color || "#241c30",
            life: 1.1,
            maxLife: 1.1,
          });
        }

        function updateFloatingTexts(dt) {
          for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
            const t = state.floatingTexts[i];
            t.life -= dt;
            t.y -= 34 * dt;
            if (t.life <= 0) state.floatingTexts.splice(i, 1);
          }
        }

        function drawFloatingTexts() {
          if (!state.floatingTexts.length) return;
          ctx.save();
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = "800 18px 'Baloo 2', Arial, sans-serif";
          ctx.lineJoin = "round";
          for (const t of state.floatingTexts) {
            const p = Math.max(0, t.life / t.maxLife);
            const bounce = 1 + Math.sin(p * Math.PI) * 0.15;
            ctx.save();
            ctx.globalAlpha = p;
            ctx.translate(t.x, t.y);
            ctx.scale(bounce, bounce);
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#241c30";
            ctx.fillStyle = t.color;
            ctx.strokeText(t.text, 0, 0);
            ctx.fillText(t.text, 0, 0);
            ctx.restore();
          }
          ctx.restore();
        }

        function render() {
          if (!state) {
            drawIdleScene();
            return;
          }

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          drawBackground();
          ctx.save();
          ctx.translate(-cameraX, 0);
          drawSmogFactory();
          drawHomeBase();
          drawValvePlatform();
          drawPlatforms();
          drawChicks();
          drawPlayer();
          drawParticles();
          drawFloatingTexts();
          ctx.restore();
          drawWater();
          drawWorldHud();
          drawWinWipe();
        }

        function drawWinWipe() {
          if (!winWiping && !winWipeDone) return;
          const r = winWipeDone ? winWipeMax : winWipeRadius;
          const cx = canvas.width / 2;
          const cy = canvas.height / 2;
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.clip();
          const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r || 1);
          grad.addColorStop(0, "#FFFFFF");
          grad.addColorStop(0.55, "#B9E3FF");
          grad.addColorStop(1, "#2C4BFF");
          ctx.globalAlpha = 0.85;
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.restore();

          if (winWiping) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#111";
            ctx.stroke();
            ctx.restore();
          }
        }

        function drawIdleScene() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          drawBackground();
          ctx.save();
          drawWater();
          ctx.restore();
        }

        function drawBackground() {
          ctx.fillStyle = "#FDFBF7";
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          ctx.fillStyle = "#FFE6F2";
          circle(120, 95, 52, true);
          ctx.fillStyle = "#DFF2FF";
          circle(700, 90, 58, true);

          for (const cloud of clouds) {
            drawCloud(cloud.x, cloud.y, cloud.scale, cloud.layer);
          }

          ctx.fillStyle = "#B7D9FF";
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 3;
          // roundedRect(-50, 445, 500, 120, 22, true, true);    this is base ices
          // roundedRect(420, 455, 540, 110, 22, true, true);
          // roundedRect(930, 430, 520, 140, 22, true, true);
        }

        function drawSmogFactory() {
          const x = 1720;
          const y = 150;

          // Body — a grimy rust-brown instead of candy pink, so the
          // building itself reads as "dirty machine", not a playhouse.
          ctx.fillStyle = "#8a7362";
          roundedRect(x, y + 120, 160, 130, 10, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(x, y + 120, 160, 130, 10, false, true);

          // Smokestacks — darker charcoal-grey, with a thin black/amber
          // hazard-stripe ring near the top of each. Same danger motif as
          // the Smog cloud in Stage 2, so kids read "this = bad" using one
          // shared visual language across the whole game.
          ctx.fillStyle = "#565a60";
          roundedRect(x + 24, y + 30, 42, 100, 8, true, false);
          roundedRect(x + 88, y, 42, 130, 8, true, false);
          ctx.strokeStyle = "#111";
          roundedRect(x + 24, y + 30, 42, 100, 8, false, true);
          roundedRect(x + 88, y, 42, 130, 8, false, true);

          ctx.save();
          ctx.strokeStyle = "#ffb020";
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(x + 24, y + 46);
          ctx.lineTo(x + 66, y + 46);
          ctx.moveTo(x + 88, y + 16);
          ctx.lineTo(x + 130, y + 16);
          ctx.stroke();
          ctx.restore();

          // A simple grumpy face on the body — no text required, kids
          // read "this place is unhappy/bad" at a glance, still soft
          // cartoon, never scary (per brand).
          ctx.fillStyle = "#241c30";
          circle(x + 55, y + 175, 7, true);
          circle(x + 105, y + 175, 7, true);
          ctx.save();
          ctx.strokeStyle = "#241c30";
          ctx.lineWidth = 5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.arc(x + 80, y + 210, 22, Math.PI * 1.1, Math.PI * 1.9);
          ctx.stroke();
          ctx.restore();

          // Smoke — sooty grey-brown with a sickly khaki tint, the same
          // palette family as the Smog itself, so factory smoke and the
          // Smog register as the same danger on sight.
          const smokePuffs = 3 + Math.floor(state.warmth * 5);
          for (let i = 0; i < smokePuffs; i++) {
            const sx = x + 46 + i * 20 + Math.sin(state.time * 1.4 + i) * 10;
            const sy =
              y + 20 - i * 10 - Math.cos(state.time * 1.5 + i * 0.5) * 8;
            ctx.globalAlpha = 0.2 + state.warmth * 0.25;
            ctx.fillStyle =
              i % 2 === 0 ? "rgba(70, 65, 55, 1)" : "rgba(150, 140, 108, 1)";
            circle(sx, sy, 18 + i * 3, true);
            ctx.globalAlpha = 1;
          }
        }

        function drawHomeBase() {
          const b = state.stableBase;
          ctx.fillStyle = "#DDF5FF";
          roundedRect(b.x, b.y, b.w, b.h, 20, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(b.x, b.y, b.w, b.h, 20, false, true);

          // A bright mint "safe zone" trim along the top edge — an
          // unmistakable "this is the good place" signal, readable before
          // any label text.
          ctx.fillStyle = "#7CE6A6";
          roundedRect(b.x, b.y, b.w, 14, 7, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 3;
          roundedRect(b.x, b.y, b.w, 14, 7, false, true);

          // A simple happy face — a friendly, always-smiling landmark
          // kids can spot from across the level without reading text.
          ctx.fillStyle = "#241c30";
          circle(b.x + b.w * 0.32, b.y + b.h * 0.42, 6, true);
          circle(b.x + b.w * 0.5, b.y + b.h * 0.42, 6, true);
          ctx.save();
          ctx.strokeStyle = "#241c30";
          ctx.lineWidth = 4;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.arc(
            b.x + b.w * 0.41,
            b.y + b.h * 0.55,
            16,
            Math.PI * 0.1,
            Math.PI * 0.9,
          );
          ctx.stroke();
          ctx.restore();

          ctx.fillStyle = "#fff";
          roundedRect(b.x + 22, b.y - 38, 150, 36, 8, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(b.x + 22, b.y - 38, 150, 36, 8, false, true);
          ctx.fillStyle = "#111";
          ctx.font = "900 14px Arial";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText("💚 SAFE ICEBERG", b.x + 30, b.y - 20);

          const delivered = state.chicks.filter((c) => c.delivered);
          delivered.forEach((c, i) => {
            drawEmoji("🐥", b.x + 52 + i * 28, b.y - 6 - (i % 2) * 6, 22);
          });
        }

        function drawValvePlatform() {
          const p = state.valvePlatform;
          ctx.fillStyle = "#CFEFFF";
          roundedRect(p.x, p.y, p.w, p.h, 12, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(p.x, p.y, p.w, p.h, 12, false, true);

          ctx.save();
          ctx.translate(state.valve.x, state.valve.y);
          const spin = state.valve.pulse * 1.3 + state.valve.activeFlash * 2.8;
          ctx.rotate(spin);
          ctx.fillStyle = state.coolingTimer > 0 ? "#87E1FF" : "#FFD84D";
          circle(0, 0, state.valve.r, true);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          circle(0, 0, state.valve.r, false);
          for (let i = 0; i < 4; i++) {
            ctx.rotate(Math.PI / 2);
            ctx.fillRect(-4, -state.valve.r - 12, 8, 22);
            ctx.strokeRect(-4, -state.valve.r - 12, 8, 22);
          }
          circle(0, 0, 8, true);
          circle(0, 0, 8, false);
          ctx.restore();

          ctx.fillStyle = "#fff";
          roundedRect(p.x + 105, p.y - 48, 120, 34, 8, true, false);
          ctx.strokeStyle = "#111";
          roundedRect(p.x + 105, p.y - 48, 120, 34, 8, false, true);
          ctx.fillStyle = "#111";
          ctx.font = "900 14px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(
            state.coolingTimer > 0 ? "COOLING!" : "SPIN VALVE",
            p.x + 165,
            p.y - 31,
          );
        }

        function drawPlatforms() {
          for (const pl of state.meltPlatforms) {
            if (pl.gone) continue;
            const x = pl.x + pl.shrink * 0.5;
            const meltRatio = 1 - pl.w / pl.baseW;
            const critical = meltRatio > 0.55;
            ctx.fillStyle = critical ? "#B7E2FF" : "#DDF6FF";
            roundedRect(x, pl.y, pl.w, pl.h, 12, true, false);
            ctx.strokeStyle = "#111";
            ctx.lineWidth = 4;
            roundedRect(x, pl.y, pl.w, pl.h, 12, false, true);

            if (critical) {
              // Hazard cue: a pulsing amber/red marching-dash outline so
              // kids read "get off, this one's about to go!" before it
              // actually vanishes — the same danger language as the Smog
              // and factory, applied to a shrinking hazard here.
              const pulse = 0.5 + Math.sin(state.time * 9) * 0.5;
              ctx.save();
              ctx.strokeStyle = `rgba(239, 68, 68, ${(0.5 + pulse * 0.4).toFixed(2)})`;
              ctx.lineWidth = 4;
              ctx.setLineDash([8, 6]);
              ctx.lineDashOffset = -state.time * 40;
              roundedRect(x - 3, pl.y - 3, pl.w + 6, pl.h + 6, 14, false, true);
              ctx.setLineDash([]);
              ctx.restore();
            }

            for (let i = 0; i < Math.max(2, Math.floor(pl.w / 38)); i++) {
              drawEmoji(
                "🧊",
                x + 22 + i * 32,
                pl.y + pl.h / 2 + Math.sin(i + state.time * 2) * 2,
                18,
              );
            }
          }
        }

        function drawChicks() {
          for (const chick of state.chicks) {
            if (chick.delivered) continue;
            const bob = Math.sin(chick.bob) * 3;
            drawEmoji("🐥", chick.x + 8, chick.y + 8 + bob, 22);
          }
        }

        function drawPlayer() {
          const p = state.player;
          const x = p.x;
          const y = p.y;
          const sheet = getActiveSpriteSheet();

          if (sheet.loaded) {
            const frame = penguinAnim.frameIndex;
            const col = frame % sheet.cols;
            const row = Math.floor(frame / sheet.cols);

            const sx = col * sheet.frameW;
            const sy = row * sheet.frameH;
            const destW = 60;
            const destH = (sheet.frameH / sheet.frameW) * destW;

            ctx.save();
            ctx.translate(x + p.w / 2, y + p.h);

            // FIX: If the running sheet naturally faces left, invert the scale multiplier for that state
            let faceDirection = p.facing;
            if (sheet === spriteSheets.running) {
              // Flipping the orientation specifically for the running animation sheet
              faceDirection = -p.facing;
            }

            ctx.scale(faceDirection, 1);
            ctx.drawImage(
              sheet.img,
              sx,
              sy,
              sheet.frameW,
              sheet.frameH,
              -destW / 2,
              -destH,
              destW,
              destH,
            );
            ctx.restore();
          } else {
            // Direct asset fallback layout to render instantly even if network paths differ locally
            const destW = 60;
            const destH = 60;
            ctx.save();
            ctx.translate(x + p.w / 2, y + p.h);

            let faceDirection = p.facing;
            if (sheet === spriteSheets.running) {
              faceDirection = -p.facing;
            }

            ctx.scale(faceDirection, 1);
            try {
              ctx.drawImage(sheet.img, -destW / 2, -destH, destW, destH);
            } catch (e) {
              // Safe secondary shape draw
              ctx.fillStyle = "#87D0FF";
              ctx.fillRect(-p.w / 2, -p.h, p.w, p.h);
            }
            ctx.restore();
          }

          if (p.carrying && p.carrying.length > 0) {
            p.carrying.forEach((chick, index) => {
              drawEmoji("🐥", x + p.w / 2, y - 8 - index * 14, 20);
            });
          }
        }

        function drawParticles() {
          for (const pt of state.particles) {
            ctx.globalAlpha = Math.max(0, pt.life / 0.8);
            ctx.fillStyle = pt.color;
            ctx.strokeStyle = "#111";
            ctx.lineWidth = 2;
            roundedRect(pt.x, pt.y, pt.size, pt.size, 3, true, false);
            roundedRect(pt.x, pt.y, pt.size, pt.size, 3, false, true);
            ctx.globalAlpha = 1;
          }
        }

        function drawWater() {
          const top = state.seaLevel;
          ctx.save();
          ctx.fillStyle = "#2F6FD0";
          ctx.beginPath();
          ctx.moveTo(0, canvas.height);
          ctx.lineTo(0, top);
          for (let x = 0; x <= canvas.width; x += 16) {
            const y = top + Math.sin(state.time * 2.8 + x * 0.02) * 7;
            ctx.lineTo(x, y);
          }
          ctx.lineTo(canvas.width, canvas.height);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          ctx.stroke();

          ctx.globalAlpha = 0.28;
          ctx.fillStyle = "#2F6FD0";
          ctx.fillRect(0, top + 12, canvas.width, canvas.height - top);
          ctx.globalAlpha = 1;
          ctx.restore();
        }

        function drawWorldHud() {
          const nearValve =
            Math.hypot(
              state.player.x + state.player.w / 2 - state.valve.x,
              state.player.y + state.player.h / 2 - state.valve.y,
            ) < 78;
          if (nearValve && state.state === "playing") {
            const bounce = Math.sin(state.time * 6) * 3;
            const sx = state.valve.x - cameraX;
            const sy = state.valve.y - 70 + bounce;
            // "E" and "tap ☸️" shown together — a keyboard-only hint
            // would leave touch players (no keyboard) with no message
            // at all, so both input paths are spelled out every time.
            ctx.fillStyle = "#FFF7E8";
            roundedRect(sx - 68, sy - 18, 136, 32, 8, true, false);
            ctx.strokeStyle = "#111";
            ctx.lineWidth = 3;
            roundedRect(sx - 68, sy - 18, 136, 32, 8, false, true);
            ctx.fillStyle = "#111";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = "900 12px Arial";
            ctx.fillText("Press E / tap ☸️", sx, sy - 1);
          }
        }
        function drawCloud(x, y, scale, layer) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(scale, scale);

          // Back clouds are softer and more transparent
          ctx.globalAlpha = layer === "back" ? 0.45 : 1;
          ctx.fillStyle = layer === "back" ? "#eef6ff" : "#ffffff";
          ctx.strokeStyle = "#1e293b";
          ctx.lineWidth = 3;

          ctx.beginPath();

          ctx.moveTo(-20, 8);

          ctx.bezierCurveTo(-38, 8, -38, -12, -20, -12);

          ctx.bezierCurveTo(-20, -30, 20, -30, 20, -12);

          ctx.bezierCurveTo(38, -12, 38, 8, 20, 8);

          ctx.closePath();

          ctx.fill();

          if (layer !== "back") {
            ctx.stroke();
          }

          ctx.restore();
        }

        function roundedRect(x, y, w, h, r, fill, stroke) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          if (fill) ctx.fill();
          if (stroke) ctx.stroke();
        }

        function circle(x, y, r, fill) {
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          if (fill) ctx.fill();
          else ctx.stroke();
        }

        function ellipse(x, y, rx, ry, fill, stroke) {
          ctx.beginPath();
          ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
          if (fill) ctx.fill();
          if (stroke) ctx.stroke();
        }

        function drawEmoji(emoji, x, y, size) {
          ctx.save();
          ctx.font = size + 'px "Segoe UI Emoji", "Apple Color Emoji", Arial';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#111";
          ctx.strokeText(emoji, x, y);
          ctx.fillText(emoji, x, y);
          ctx.restore();
        }

        function setControl(name, isDown) {
          if (name === "left") input.left = isDown;
          if (name === "right") input.right = isDown;
          if (name === "jump") {
            if (isDown && !input.jump) input.jumpPressed = true;
            input.jump = isDown;
          }
          if (name === "action" && isDown) input.actionPressed = true;
        }

        window.addEventListener(
          "keydown",
          (e) => {
            const k = e.key.toLowerCase();
            if (
              [
                "arrowleft",
                "arrowright",
                "arrowup",
                " ",
                "a",
                "d",
                "w",
                "e",
              ].includes(k)
            )
              e.preventDefault();
            if (k === "arrowleft" || k === "a") input.left = true;
            if (k === "arrowright" || k === "d") input.right = true;
            if ((k === "arrowup" || k === "w" || k === " ") && !input.jump) {
              input.jump = true;
              input.jumpPressed = true;
            }
            if (k === "e") input.actionPressed = true;
          },
          { passive: false },
        );

        window.addEventListener("keyup", (e) => {
          const k = e.key.toLowerCase();
          if (k === "arrowleft" || k === "a") input.left = false;
          if (k === "arrowright" || k === "d") input.right = false;
          if (k === "arrowup" || k === "w" || k === " ") input.jump = false;
        });

        document.querySelectorAll("[data-control]").forEach((btn) => {
          const name = btn.getAttribute("data-control");
          const onDown = (e) => {
            e.preventDefault();
            setControl(name, true);
          };
          const onUp = (e) => {
            e.preventDefault();
            setControl(name, false);
          };
          btn.addEventListener("pointerdown", onDown);
          btn.addEventListener("pointerup", onUp);
          btn.addEventListener("pointercancel", onUp);
          btn.addEventListener("pointerleave", onUp);
        });

        function frame(ts) {
          if (!lastTime) lastTime = ts;
          const dt = Math.min(0.033, (ts - lastTime) / 1000);
          lastTime = ts;

          // Update background clouds position
          for (const cloud of clouds) {
            cloud.x += cloud.speed * dt;
            if (cloud.x > 800 + 120) {
              cloud.x = -120;
            }
          }

          if (gameRunning) {
            update(dt);
          } else {
            updatePenguinAnim(dt);
          }
          render();
          requestAnimationFrame(frame);
        }

        state = createState();
        updateUI();
        render();
        requestAnimationFrame(frame);
        showIntro();
      })();
    </script>
  </body>
</html>

            } else {
              GOGCoach.arrow(ctx, sx, b.y - 128, t, "down");
              GOGCoach.tag(ctx, sx, b.y - 196, "Bring it here!");
            }
          } else if (coach.index === 4) {
            const v = state.valve;
            const sx = toScreen(v.x);
            if (sx > VIEW_W - 30) {
              GOGCoach.tag(ctx, VIEW_W - 80, v.y - 40, "Valve this way ▶");
            } else if (sx < 40) {
              GOGCoach.tag(ctx, 80, v.y - 40, "◀ Valve");
            } else {
              GOGCoach.arrow(ctx, sx, v.y - 56, t, "down");
              GOGCoach.tag(ctx, sx, v.y - 124, "Tap Spin here!");
            }
          }
          ctx.restore();
        }

        // Splashing during the lesson is only a gentle do-over: Penny hops
        // back to the safe iceberg and any chick she was carrying goes back
        // to its floe.
        function respawnPenny() {
          const p = state.player;
          p.carrying.forEach(function (c) {
            const pl = state.meltPlatforms[c.platformIndex];
            c.rescued = false;
            c.vy = 0;
            c.x = c.baseX;
            c.y = (pl ? pl.baseY : 380) - 18;
          });
          p.carrying = [];
          p.x = p.spawnX;
          p.y = p.spawnY;
          p.vx = 0;
          p.vy = 0;
          p.onGround = false;
          p.coyote = 0;
          p.jumpBuffer = 0;
          cameraX = 0;
          spawnFloatText(p.x + 20, p.y - 40, "Whoops! Try again 💙", "#2e5ee8");
          audio.blip(300, 80);
        }

        function update(dt) {
          if (!state || state.state === "failed") return;

          state.time += dt;
          updatePenguinAnim(dt);
          const p = state.player;
          const wasOnGround = p.onGround;
          // Guided intro: while the coach is teaching, the clock, warming, sea
          // rise and melting all wait, so nobody can lose the lesson.
          const learning = coach.active;

          // Update snowfall particles (screen-relative)
          for (const s of snowfallParticles) {
            s.y += s.speedY * dt;
            s.x += s.speedX * dt;
            if (s.y > VIEW_H) {
              s.y = -10;
              s.x = Math.random() * VIEW_W;
            }
            if (s.x < -10) {
              s.x = VIEW_W + 10;
              s.y = Math.random() * VIEW_H;
            }
          }

          if (state.state === "won") {
            state.endTimer += dt;
            
            // Phase 1 (0s to 1.5s): Recede sea level, freeze valve, blow wind
            if (state.endTimer <= 1.5) {
              state.seaLevel = Math.min(560, state.seaLevel + 120 * dt);
              state.warmth = Math.max(0, state.warmth - 0.7 * dt);
              state.valve.frozen = true;
              
              if (Math.random() < 0.15) {
                state.particles.push({
                  x: VIEW_W + Math.random() * 200,
                  y: 100 + Math.random() * 400,
                  vx: -350 - Math.random() * 200,
                  vy: (Math.random() - 0.5) * 10,
                  life: 2.0,
                  maxLife: 2.0,
                  kind: "wind",
                  color: "rgba(200, 245, 255, 0.55)",
                  size: 60 + Math.random() * 60,
                });
              }
            }
            // Phase 2 (1.5s to 3.5s): Reform ice platforms
            else if (state.endTimer <= 3.5) {
              for (const pl of state.meltPlatforms) {
                pl.gone = false;
                pl.shrink = Math.max(0, pl.shrink - 180 * dt);
                pl.w = pl.baseW - pl.shrink;
                pl.y = pl.baseY || pl.y;
              }
            }
            // Phase 3 (3.5s to 5.5s): Sparkles and dance
            else if (state.endTimer <= 5.5) {
              if (Math.random() < 0.25) {
                state.particles.push({
                  x: state.stableBase.x + Math.random() * state.stableBase.w,
                  y: state.stableBase.y - 30 - Math.random() * 40,
                  vx: (Math.random() - 0.5) * 15,
                  vy: -15 - Math.random() * 20,
                  life: 1.0,
                  maxLife: 1.0,
                  kind: "emoji",
                  text: "✨",
                  size: 12,
                });
              }
            }

            p.vx *= 0.92;
            p.vy += p.gravity * dt * 0.25;
            movePlayer(p, dt, true);

            if (state.endTimer > 5.5 && !winWiping && !winWipeDone) {
              let stars = 1;
              if (!calmMode) {
                if (state.warmth <= 0.25) stars = 3;
                else if (state.warmth <= 0.6) stars = 2;
              }
              pendingStars = stars;
              winWipeRadius = 0;
              winWiping = true;
            }
            if (winWiping) {
              winWipeRadius += dt * winWipeMax * 1.6;
              if (winWipeRadius >= winWipeMax) {
                winWiping = false;
                winWipeDone = true;
                finishWinIce();
              }
            }
            updateUI();
            updateParticles(dt);
            updateFloatingTexts(dt);
            return;
          }

          // Game loop countdown
          if (!learning) state.timeLeft = Math.max(0, state.timeLeft - dt);
          if (state.timeLeft <= 0) {
            failGame("Time is up! Try to rescue the chicks faster next time.");
            return;
          }

          const warmingRate = (calmMode || learning
            ? 0
            : state.coolingTimer > 0
              ? 0.005
              : 0.012) * diff.enemySpeedMul();
          state.warmth = clamp(state.warmth + warmingRate * dt, 0, 1);
          if (!valveTipShown && !learning && state.warmth >= 0.35) {
            valveTipShown = true;
            GOGUi.say("The ice is getting warm! Run to the SPIN VALVE and tap SPIN ☸️ to cool it ❄️");
          }
          if (state.warmth > 0.8 && (STAGE_DURATION - state.timeLeft) < 15 && !diff.softClutched) {
            diff.softClutch();
          }
          if (state.coolingTimer > 0) {
            state.coolingTimer = Math.max(0, state.coolingTimer - dt);
            state.valve.activeFlash = Math.max(
              0,
              state.valve.activeFlash - dt * 1.7,
            );
          }
          state.valve.pulse += dt;

          const seaRise = calmMode || learning ? 0 : 1.5 + state.warmth * 5;
          state.seaLevel = clamp(state.seaLevel - seaRise * dt, 368, 560);

          // Update fish jump timer
          if (state.fishJumpTimer > 0) {
            state.fishJumpTimer -= dt;
          }

          // Check if standing on melting ice to apply slippage
          let onIce = false;
          const under = findUnder(p, getSolids(), 4);
          if (under && under.drift !== undefined) {
            onIce = true;
          }

          // T049: Penny's belly slide — held while grounded, gives +50% speed
          // and slicker (reduced) friction; automatically ends the instant
          // she leaves the ground or lets go of the slide control.
          const isSliding = !!(input.slide && p.onGround);
          const slideSpeedMul = isSliding ? 1.5 : 1;
          const accel = p.speed * dt * slideSpeedMul;
          if (input.left) {
            p.vx -= accel;
            p.facing = -1;
          }
          if (input.right) {
            p.vx += accel;
            p.facing = 1;
          }
          if (!input.left && !input.right) {
            const currentDrag = onIce ? (0.94 - (0.94 - p.drag) * diff.gentleness()) : p.drag;
            // Reduced friction while sliding: drag pushed closer to 1 (slower decay).
            const slideDrag = isSliding ? currentDrag + (1 - currentDrag) * 0.5 : currentDrag;
            p.vx *= Math.pow(slideDrag, dt * 60);
            if (Math.abs(p.vx) < 3) p.vx = 0;
          }
          p.vx = clamp(p.vx, -p.maxSpeed * slideSpeedMul, p.maxSpeed * slideSpeedMul);

          if (isSliding && !p.wasSliding) {
            audio.tone(520, 0.3, "sine", 0.06, 180); // slick whoosh SFX
            spawnBurst(p.x + p.w / 2, p.y + p.h, 10, "#DCEFFF");
          }
          if (isSliding && Math.abs(p.vx) > 20) {
            p.slideTrailTimer = (p.slideTrailTimer || 0) - dt;
            if (p.slideTrailTimer <= 0) {
              p.slideTrailTimer = 0.06;
              state.particles.push({
                x: p.x + p.w / 2 - p.facing * 10,
                y: p.y + p.h - 2,
                vx: -p.facing * 20,
                vy: 0,
                life: 0.4,
                maxLife: 0.4,
                kind: "snow",
                color: "#EAF7FF",
                size: 3,
              });
            }
          }
          p.wasSliding = isSliding;
          p.isSliding = isSliding;

          // Forgiving jump (young players tap early/late): a tap is remembered for a
          // moment (buffer) and a jump still works just after leaving an edge (coyote).
          // p.onGround is last frame's result, so it is "standing" right now.
          const leniency = calmMode ? GOGConstants.STAGE4.jumpLeniencyCalm : 1;
          p.coyote = p.onGround
            ? GOGConstants.STAGE4.jumpCoyote * leniency
            : Math.max(0, (p.coyote || 0) - dt);
          p.jumpBuffer = input.jumpPressed
            ? GOGConstants.STAGE4.jumpBuffer * leniency
            : Math.max(0, (p.jumpBuffer || 0) - dt);
          if (p.jumpBuffer > 0 && p.coyote > 0) {
            p.jumpBuffer = 0;
            p.coyote = 0; // spent: no second jump until Penny lands again
            p.vy = -p.jumpPower;
            p.onGround = false;
            coachJumped = true;
            audio.blip(320, 60);
            spawnBurst(p.x + p.w / 2, p.y + p.h, 8, "#8FD3FF");
          }
          input.jumpPressed = false;

          p.vy += p.gravity * dt;

          updatePlatforms(dt);
          updateWaterLift(dt);
          movePlayer(p, dt, false);
          updateChicks(dt);
          updateCoach();
          updateValve(dt);
          updateParticles(dt);
          updateFloatingTexts(dt);
          updateCamera(dt);
          updateUI();

          // Spawning footprints when running on ice
          if (p.onGround && Math.abs(p.vx) > 30 && onIce) {
            if (!p.stepTimer) p.stepTimer = 0;
            p.stepTimer -= dt;
            if (p.stepTimer <= 0) {
              p.stepTimer = 0.22;
              state.particles.push({
                x: p.x + p.w / 2 + (p.facing === 1 ? -12 : 6),
                y: p.y + p.h - 2,
                vx: 0,
                vy: 0,
                life: 1.5,
                maxLife: 1.5,
                kind: "footprint",
                color: "rgba(100, 150, 200, 0.45)",
              });
            }
          }

          // Handle landing footprints & snow puff
          if (p.onGround && !wasOnGround) {
            spawnBurst(p.x + p.w / 2, p.y + p.h, 6, "#E4F7FF");
            if (onIce) {
              state.particles.push({
                x: p.x + p.w / 2 - 8,
                y: p.y + p.h - 2,
                vx: 0,
                vy: 0,
                life: 2.0,
                maxLife: 2.0,
                kind: "footprint",
                color: "rgba(100, 150, 200, 0.5)",
              });
              state.particles.push({
                x: p.x + p.w / 2 + 2,
                y: p.y + p.h - 2,
                vx: 0,
                vy: 0,
                life: 2.0,
                maxLife: 2.0,
                kind: "footprint",
                color: "rgba(100, 150, 200, 0.5)",
              });
            }
          }

          // Spawning carried chick emojis (hearts/sparkles)
          if (p.carrying && p.carrying.length > 0) {
            if (!p.carryHeartTimer) p.carryHeartTimer = 0;
            p.carryHeartTimer -= dt;
            if (p.carryHeartTimer <= 0) {
              p.carryHeartTimer = 0.5;
              state.particles.push({
                x: p.x + p.w / 2 + p.facing * 16 + (Math.random() - 0.5) * 10,
                y: p.y + p.h - 55,
                vx: (Math.random() - 0.5) * 15,
                vy: -35 - Math.random() * 20,
                life: 1.0,
                maxLife: 1.0,
                kind: "emoji",
                text: Math.random() < 0.65 ? "❤️" : "✨",
                size: 13,
              });
            }
          }

          const inWater = p.y + p.h >= state.seaLevel;
          const onSolid = p.onGround;
          const deeplySubmerged = inWater && state.seaLevel < p.y + p.h - 16;
          if (p.y > WORLD_H + 120 || (inWater && !onSolid) || deeplySubmerged) {
            if (learning) {
              // Splashing during the lesson is just a gentle do-over.
              respawnPenny();
              return;
            }
            failGame(
              "Penny splashed into the rising water. Try a faster route and cool the valve sooner.",
            );
            return;
          }
        }

        const AMBIENT_PARTICLE_CAP = 40;

        function updatePlatforms(dt) {
          const p = state.player;
          p.onCriticalIce = false;
          for (const pl of state.meltPlatforms) {
            if (pl.glowTimer > 0) pl.glowTimer -= dt;
            if (pl.baseY === undefined) pl.baseY = pl.y;

            if (pl.gone) {
              pl.refreezeTimer = (pl.refreezeTimer || 0) + dt;
              if (pl.refreezeTimer > 4.0) {
                pl.gone = false;
                pl.shrink = 0;
                pl.w = pl.baseW;
                pl.y = pl.baseY;
                pl.refreezeTimer = 0;
                pl.cachedCrackStage = -1;
                spawnBurst(pl.x + pl.baseW / 2, pl.y + 6, 8, "#A0E0FF");
              }
              continue;
            }

            if (pl.meltingState === "sinking") {
              pl.sinkTimer -= dt;
              pl.y += 45 * dt;
              
              if (Math.random() < 0.25) {
                state.particles.push({
                  x: pl.x + Math.random() * pl.w,
                  y: pl.y + pl.h,
                  vx: 0,
                  vy: 35,
                  life: 0.5,
                  maxLife: 0.5,
                  color: "#6FB6E8",
                  size: 3,
                  kind: "drip",
                });
              }
              
              if (pl.sinkTimer <= 0) {
                pl.gone = true;
                pl.meltingState = null;
                pl.meltStage = 0;
                state.meltedCount += 1;
                spawnBurst(pl.x + pl.w / 2, state.seaLevel, 16, "#E4F7FF");
                audio.blip(100, 160);
              }
              continue;
            }

            pl.t = (pl.t || 0) + dt;
            pl.y += Math.sin(state.time * 0.55 + pl.phase) * 4 * dt;
            
            const meltRatioNow = 1 - pl.w / pl.baseW;
            pl.rot =
              Math.sin(state.time * 0.4 + pl.phase) *
              0.045 *
              (1 + meltRatioNow);

            const topBand = {
              x: pl.x + pl.shrink * 0.5,
              y: pl.y,
              w: pl.baseW - pl.shrink,
              h: pl.h,
            };

            const standing =
              p.onGround &&
              p.vy >= -10 &&
              p.x + p.w > topBand.x + 8 &&
              p.x < topBand.x + topBand.w - 8 &&
              Math.abs(p.y + p.h - topBand.y) < 8;
            const meltRate = coach.active
              ? 0
              : (calmMode
                  ? standing
                    ? 1
                    : 0
                  : 0.1 +
                    state.warmth * 0.4 +
                    (standing ? 3 + state.warmth * 5 : 0)) * diff.enemySpeedMul();
            pl.shrink += meltRate * dt;
            pl.w = Math.max(48, pl.baseW - pl.shrink);

            const meltRatio = 1 - pl.w / pl.baseW;
            if (standing && meltRatio > 0.55) p.onCriticalIce = true;

            const stage =
              meltRatio < 0.15
                ? 1
                : meltRatio < 0.35
                  ? 2
                  : meltRatio < 0.52
                    ? 3
                    : meltRatio < 0.68
                      ? 4
                      : 5;
            if (stage > (pl.meltStage || 0)) {
              pl.meltStage = stage;
              if (stage >= 2) audio.blip(200 - stage * 12, 70);
              if (stage === 4) {
                for (let k = 0; k < 6; k++) {
                  state.particles.push({
                    x: pl.x + Math.random() * pl.w,
                    y: pl.y + 4,
                    vx: (Math.random() - 0.5) * 30,
                    vy: -10 - Math.random() * 20,
                    life: 0.9,
                    maxLife: 0.9,
                    color: "#DDF6FF",
                    size: 4 + Math.random() * 4,
                  });
                }
              }
            }

            if (state.particles.length < AMBIENT_PARTICLE_CAP) {
              pl.snowTimer -= dt;
              if (pl.snowTimer <= 0) {
                pl.snowTimer = 1.4 + Math.random() * 1.2;
                state.particles.push({
                  x: pl.x + Math.random() * pl.w,
                  y: pl.y + 4,
                  vx: (Math.random() - 0.5) * 10,
                  vy: 6 + Math.random() * 8,
                  life: 1.2,
                  maxLife: 1.2,
                  color: "#ffffff",
                  size: 2 + Math.random() * 2,
                  kind: "snow",
                });
              }
              pl.dripTimer -= dt * (1 + meltRatio * 2);
              if (pl.dripTimer <= 0 && meltRatio > 0.25) {
                pl.dripTimer = 0.9 + Math.random() * 0.7;
                state.particles.push({
                  x: pl.x + pl.w * 0.5 + (Math.random() - 0.5) * pl.w * 0.6,
                  y: pl.y + pl.h,
                  vx: 0,
                  vy: 30,
                  life: 0.5,
                  maxLife: 0.5,
                  color: "#6FB6E8",
                  size: 3,
                  kind: "drip",
                });
              }
            }

            if (pl.shrink > pl.baseW - 42) {
              // NEW: never let the last safe platform disappear — if every
              // other floe is already gone or mid-sink, hold this one right
              // at the brink instead of letting it vanish too.
              const otherSafeCount = state.meltPlatforms.filter(
                (o) => o !== pl && !o.gone && o.meltingState !== "sinking",
              ).length;
              if (otherSafeCount === 0) {
                pl.shrink = pl.baseW - 42;
              } else {
                pl.meltingState = "sinking";
                pl.sinkTimer = 1.0;
                if (standing) {
                  p.onGround = false;
                }
              }
            }
          }
        }

        // T051: friendly seal lift — surfaces on a cycle and becomes a real,
        // rideable solid while surfaced; submerges again afterward. Purely
        // additive to the existing floe path, so it can only help, not block.
        function updateWaterLift(dt) {
          const wl = state.waterLift;
          if (!wl) return;
          const wasSurfaced = wl.surfaced;
          wl.phase = (wl.phase + dt) % wl.cycle;
          wl.surfaced = wl.phase < wl.surfaceFor;
          const bob = wl.surfaced ? Math.sin(state.time * 3) * 3 : 0;
          wl.y = state.seaLevel - 16 + bob;
          if (wl.surfaced && !wasSurfaced) {
            spawnBurst(wl.x + wl.w / 2, state.seaLevel, 12, "#BEEFFF");
            audio.blip(360, 90);
          }
        }

        function movePlayer(p, dt, soft) {
          const prevBottom = p.y + p.h;

          p.x += p.vx * dt;
          p.x = clamp(p.x, 0, WORLD_W - p.w);

          p.y += p.vy * dt;
          p.onGround = false;

          const solids = getSolids();
          for (const s of solids) {
            if (!rectsOverlap(p, s)) continue;
            if (p.vy >= 0 && prevBottom <= s.y + 6) {
              p.y = s.y - p.h;
              p.vy = 0;
              p.onGround = true;
            }
          }

          if (p.onGround && !soft) {
            const under = findUnder(p, solids, 4);
            if (under && under.drift) {
              p.x += under.drift * dt;
            }
          }
        }

        // The solids list is rebuilt on every call (platforms move/shrink), but into
        // one persistent array of pooled objects instead of ~11 fresh ones per call.
        // Callers use the result immediately and never keep it across another call.
        // Slots 0-2 (home, valve platform, shore) never get a `drift`; floe and seal
        // slots (3+) always do, exactly like the old per-call literals.
        const solidsBuf = [];
        const solidPool = [];
        function solidSlot(i) {
          return solidPool[i] || (solidPool[i] = { x: 0, y: 0, w: 0, h: 0 });
        }

        function getSolids() {
          let n = 0;
          let s = solidSlot(n++);
          const sb = state.stableBase;
          s.x = sb.x;
          s.y = sb.y;
          s.w = sb.w;
          s.h = sb.h;
          s = solidSlot(n++);
          const vp = state.valvePlatform;
          s.x = vp.x;
          s.y = vp.y;
          s.w = vp.w;
          s.h = vp.h;
          s.stable = true;
          s = solidSlot(n++);
          s.x = SHORE.x;
          s.y = SHORE.y;
          s.w = SHORE.w;
          s.h = SHORE.h;
          s.stable = true;
          const mp = state.meltPlatforms;
          for (let i = 0; i < mp.length; i++) {
            const pl = mp[i];
            if (pl.gone) continue;
            s = solidSlot(n++);
            s.x = pl.x + pl.shrink * 0.5;
            s.y = pl.y;
            s.w = pl.w;
            s.h = pl.h;
            s.drift = Math.cos(state.time * 0.55 + pl.phase) * pl.drift;
          }
          const wl = state.waterLift;
          if (wl && wl.surfaced) {
            s = solidSlot(n++);
            s.x = wl.x;
            s.y = wl.y;
            s.w = wl.w;
            s.h = wl.h;
            s.drift = 0;
          }
          solidsBuf.length = n;
          for (let i = 0; i < n; i++) solidsBuf[i] = solidPool[i];
          return solidsBuf;
        }

        // First solid Penny stands on (same test the old solids.find closures used).
        function findUnder(p, solids, tol) {
          for (let i = 0; i < solids.length; i++) {
            const s = solids[i];
            if (p.x + p.w > s.x && p.x < s.x + s.w && Math.abs(p.y + p.h - s.y) < tol) return s;
          }
          return undefined;
        }

        function getMaxCarryingCapacity() {
          if (!state || !state.chicks) return 1;
          // NEW: calm mode lets Penny carry every rescued chick at once —
          // a "follow in a line" duckling formation instead of ferrying them
          // one trip at a time, so young kids aren't punished for exploring.
          if (calmMode) return state.chicks.length;
          let deliveredCount = 0;
          for (let i = 0; i < state.chicks.length; i++) {
            if (state.chicks[i].delivered) deliveredCount++;
          }
          if (deliveredCount === 0) return 1;
          if (deliveredCount === 1) return 2;
          return 3;
        }

        function updateChicks(dt) {
          const p = state.player;
          for (const chick of state.chicks) {
            chick.bob += dt * 3;
            if (chick.cheerTimer > 0) chick.cheerTimer -= dt; // T050
            if (chick.delivered) continue;

            const carryIndex = p.carrying.indexOf(chick);
            if (carryIndex !== -1) {
              const sheet = getActiveSpriteSheet();
              const destW = 72;
              const destH = sheet && sheet.loaded ? (sheet.frameH / sheet.frameW) * destW : 108;
              // Stagger offsets for multiple carried chicks:
              const baseOffsetX = -14 * p.facing;
              const offsetX = baseOffsetX - p.facing * carryIndex * 4;
              const offsetY = -destH * 0.65 - carryIndex * 12;
              
              chick.x = p.x + p.w / 2 + offsetX - 9;
              chick.y = p.y + p.h + offsetY - 18;
              const homeZone = {
                x: state.stableBase.x,
                y: state.stableBase.y - 100,
                w: state.stableBase.w,
                h: 200,
              };
              if (rectsOverlap(p, homeZone) && p.onGround) {
                chick.delivered = true;
                chick.rescued = true;
                p.carrying = p.carrying.filter((c) => c !== chick);
                state.rescuedCount += 1;
                // T050: join the animated huddle group on the safe iceberg —
                // takes the next open slot, and every chick already in the
                // huddle gets an extra celebratory hop as the new friend arrives.
                chick.huddleSlot = state.chicks.filter((c) => c.delivered).length - 1;
                cheerHuddle();
                audio.heal();
                spawnBurst(chick.x, chick.y, 14, "#FFD84D");
                spawnFloatText(chick.x, chick.y - 12, "Safe! +1 💚", "#3aa655");
                if (state.rescuedCount >= TARGET_RESCUES) {
                  winGame();
                }
              }
              continue;
            }

            // If not carried, make it slide back and forth with the platform or fall if gone
            if (!chick.rescued && chick.platformIndex !== undefined) {
              const pl = state.meltPlatforms[chick.platformIndex];
              if (pl) {
                if (!pl.gone) {
                  const drift = Math.cos(state.time * 0.55 + pl.phase) * pl.drift;
                  chick.x = chick.baseX + drift;
                } else {
                  // Platform has melted! Apply gravity to make the chick fall
                  chick.vy = (chick.vy || 0) + 1450 * dt;
                  chick.y += chick.vy * dt;
                }
              }
            }

            const nearChick = chickInReach(p, chick);
            if (!chick.rescued && nearChick) {
              const maxCarry = getMaxCarryingCapacity();
              if (p.carrying.length >= maxCarry) {
                continue;
              }
              // NEW: calm mode auto-grabs on contact — no button press needed —
              // so a young kid who's still learning the controls isn't stuck.
              if (input.actionPressed || calmMode) {
                chick.rescued = true;
                p.carrying.push(chick);
                audio.collect();
                spawnBurst(chick.x, chick.y, 10, "#FFE680");
                spawnFloatText(chick.x, chick.y - 12, "Got one! 🐥", "#2e5ee8");
                input.actionPressed = false;
              }
            }

            if (chick.y + 18 >= state.seaLevel) {
              const homeRestock = state.chicks.find(
                (c) => !c.rescued && !c.delivered && c !== chick,
              );
              if (
                !homeRestock &&
                !chick.delivered &&
                !p.carrying.includes(chick)
              ) {
                failGame(
                  "A chick slipped into the water. Try shorter rescue routes and keep the floes from vanishing under you.",
                );
                return;
              }
            }
          }
        }

        // T050: makes the whole existing huddle hop/cheer together whenever
        // a new chick is delivered to the iceberg.
        function cheerHuddle() {
          for (const c of state.chicks) {
            if (c.delivered) c.cheerTimer = 0.9;
          }
        }

        function updateValve(dt) {
          const p = state.player;
          const dx = p.x + p.w / 2 - state.valve.x;
          const dy = p.y + p.h / 2 - state.valve.y;
          const near = Math.hypot(dx, dy) < 78;
          if (near && input.actionPressed) {
            state.warmth = Math.max(0, state.warmth - state.valve.coolAmount * diff.forgivenessMul());
            state.coolingTimer = 8;
            state.valve.activeFlash = 1.0;
            audio.blip(520, 150);
            
            // Spawn dramatic snow sparks at the valve
            spawnBurst(state.valve.x, state.valve.y, 24, "#87E1FF");
            
            // Spawn wind streaks sweeping across the screen
            for (let k = 0; k < 12; k++) {
              state.particles.push({
                x: VIEW_W + Math.random() * 200,
                y: 50 + Math.random() * 450,
                vx: -300 - Math.random() * 250,
                vy: (Math.random() - 0.5) * 15,
                life: 2.2,
                maxLife: 2.2,
                kind: "wind",
                color: "rgba(180, 242, 255, 0.55)",
                size: 50 + Math.random() * 70
              });
            }

            // Heal ice platforms slightly
            for (const pl of state.meltPlatforms) {
              if (!pl.gone) {
                pl.shrink = Math.max(0, pl.shrink - pl.baseW * 0.25);
                pl.w = pl.baseW - pl.shrink;
                pl.glowTimer = 1.5;
                
                // Spawn healing particles rising from the platform
                for (let k = 0; k < 5; k++) {
                  state.particles.push({
                    x: pl.x + Math.random() * pl.w,
                    y: pl.y + 4,
                    vx: (Math.random() - 0.5) * 16,
                    vy: -15 - Math.random() * 15,
                    life: 0.7,
                    maxLife: 0.7,
                    color: "#80F5FF",
                    size: 2 + Math.random() * 2,
                    kind: "snow"
                  });
                }
              }
            }
          }
          input.actionPressed = false;
        }

        function updateParticles(dt) {
          for (let i = state.particles.length - 1; i >= 0; i--) {
            const pt = state.particles[i];
            pt.life -= dt;
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            pt.vy += (pt.kind === "snow" ? 25 : 180) * dt;
            if (pt.life <= 0) state.particles.splice(i, 1);
          }
        }

        function updateCamera(dt) {
          // On a narrow (phone-portrait) view keep Penny well inside the screen
          const lead = Math.min(240, VIEW_W * 0.38);
          const target = clamp(state.player.x - lead, 0, WORLD_W - VIEW_W);
          cameraX += (target - cameraX) * Math.min(1, CAMERA_LERP * dt * 60);
        }

        function warmthGradient(w) {
          if (w < 0.4) return "linear-gradient(90deg, #3dd6c0, #2e5ee8)"; // cool & safe
          if (w < 0.7) return "linear-gradient(90deg, #ffd23f, #ff8c42)"; // caution
          return "linear-gradient(90deg, #ff8c42, #ef4444)"; // danger
        }

        // Runs every fixed step, so every write is change-only (GOGUi.setText /
        // setStyle / setClass skip the DOM when the value is the same as last time).
        function updateUI() {
          const warmPct = (state.warmth * 100).toFixed(0) + "%";
          GOGUi.setStyle(ui.warmFill, "width", warmPct);
          GOGUi.setStyle(ui.warmFill, "background", warmthGradient(state.warmth));
          GOGUi.setClass(
            ui.canvasFrame,
            "warmth-danger",
            state.warmth >= 0.7 && state.state === "playing",
          );
          GOGUi.setText(ui.warmthText, warmPct);
          if (ui.warmthLabel) {
            let labelText = "WARMTH ";
            if (state.warmth <= 0.2) labelText += "❄️❄️❄️❄️❄️";
            else if (state.warmth <= 0.4) labelText += "❄️❄️❄️❄️";
            else if (state.warmth <= 0.6) labelText += "❄️❄️❄️";
            else if (state.warmth <= 0.8) labelText += "❄️❄️";
            else if (state.warmth <= 0.9) labelText += "❄️";
            else labelText += "🔥🔥🔥🔥🔥";
            GOGUi.setText(ui.warmthLabel, labelText);
          }
          GOGUi.setText(
            ui.rescuedText,
            "🐥 " + state.rescuedCount + " / " + TARGET_RESCUES + " rescued",
          );
          GOGUi.setText(ui.timerText, Math.ceil(state.timeLeft) + "s");
          GOGUi.setClass(ui.timerText, "timer-urgent", state.timeLeft <= 10);
          if (ui.iceText) {
            let floesLeft = 0;
            for (let i = 0; i < state.meltPlatforms.length; i++) {
              if (!state.meltPlatforms[i].gone) floesLeft++;
            }
            GOGUi.setText(ui.iceText, "🧊 " + floesLeft + " floes left");
          }
          const seaPct = Math.round(((560 - state.seaLevel) / 140) * 100);
          GOGUi.setText(ui.seaText, "🌊 Sea " + Math.max(0, seaPct) + "%");
          refreshActionButton();
        }

        // The round action button is "Grab" next to a chick and "Spin" at the
        // valve, and pulses whenever there is something in reach — so there is
        // never a mystery button.
        let actionStateKey = "";
        function refreshActionButton() {
          if (!ui.actionBtn) return;
          const p = state.player;
          const nearValve =
            Math.hypot(
              p.x + p.w / 2 - state.valve.x,
              p.y + p.h / 2 - state.valve.y,
            ) < 78;
          let nearChick = false;
          if (p.carrying.length < getMaxCarryingCapacity()) {
            for (let i = 0; i < state.chicks.length; i++) {
              const c = state.chicks[i];
              if (!c.rescued && !c.delivered && chickInReach(p, c)) {
                nearChick = true;
                break;
              }
            }
          }
          const key = nearValve ? "spin" : nearChick ? "grab" : "idle";
          if (key === actionStateKey) return;
          actionStateKey = key;
          ui.actionIco.textContent = key === "spin" ? "☸️" : "🐥";
          ui.actionCap.textContent = key === "spin" ? "Spin" : "Grab";
          ui.actionBtn.classList.toggle("ready", key !== "idle");
        }

        function spawnBurst(x, y, count, color) {
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 40 + Math.random() * 130;
            state.particles.push({
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 30,
              life: 0.4 + Math.random() * 0.45,
              color,
              size: 4 + Math.random() * 5,
            });
          }
        }

        // Floating reward-text pop-ups — short, bouncy, high-contrast
        // confirmation text ("Got one! 🐥") at the exact moment something
        // good happens, so the stage's message is felt instantly instead
        // of only showing up later as a HUD chip number.
        function spawnFloatText(x, y, text, color) {
          state.floatingTexts.push({
            x,
            y,
            text,
            color: color || "#241c30",
            life: 1.1,
            maxLife: 1.1,
          });
        }

        function updateFloatingTexts(dt) {
          for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
            const t = state.floatingTexts[i];
            t.life -= dt;
            t.y -= 34 * dt;
            if (t.life <= 0) state.floatingTexts.splice(i, 1);
          }
        }

        function drawFloatingTexts() {
          if (!state.floatingTexts.length) return;
          ctx.save();
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = "800 18px 'Baloo 2', Arial, sans-serif";
          ctx.lineJoin = "round";
          for (const t of state.floatingTexts) {
            const p = Math.max(0, t.life / t.maxLife);
            const bounce = 1 + Math.sin(p * Math.PI) * 0.15;
            ctx.save();
            ctx.globalAlpha = p;
            ctx.translate(t.x, t.y);
            ctx.scale(bounce, bounce);
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#241c30";
            ctx.fillStyle = t.color;
            ctx.strokeText(t.text, 0, 0);
            ctx.fillText(t.text, 0, 0);
            ctx.restore();
          }
          ctx.restore();
        }

        // World-space visibility test: is any part of [x0, x1] on screen? (margins are
        // baked into the numbers callers pass, so nothing pops in at the edge.)
        function inView(x0, x1) {
          return x1 > camX && x0 < camX + VIEW_W;
        }

        // The world scrolls on the device-pixel grid (see camX).
        function syncCamera() {
          const sc = hiDpi.scale;
          camX = Math.round(cameraX * sc) / sc;
        }

        // ---- Backdrop -------------------------------------------------------
        // Vector scenery (sky, glaciers, icebergs, far sea) is pre-rendered
        // into tileable offscreen canvases at the on-screen resolution and then
        // just scrolled each frame. That keeps it razor sharp at any window
        // size / pixel density and cheap to draw. (The old pixel-art PNG layers
        // were small bitmaps stretched ~2x, which is why they looked soft.)
        const BACKDROP_TILE = 1280; // logical px before a parallax layer repeats
        const HORIZON_Y = 452; // where the far sea meets the sky
        // Each parallax layer only has paint inside a horizontal band of the 600px-high
        // view (glaciers ~271-460, bergs ~394-500, sea 451-600), so only that band is
        // baked and blitted: about a quarter of the old full-height tiles in memory and
        // in fill. Band edges are multiples of 4 so they land on whole device pixels at
        // every canvas scale (1, 1.25, 1.5).
        const BAND = {
          far: { y: 260, h: 204 },
          mid: { y: 388, h: 116 },
          sea: { y: 448, h: 152 },
        };
        const SKY_H = 456; // sky bitmap height: the opaque sea takes over from HORIZON_Y
        const SUN_X = 590;
        const SUN_Y = 318;
        const backdrop = { far: null, mid: null, sea: null, clouds: [], sky: null, skyIdx: -1 };

        // Paints `paint(g)` (in full-view logical coordinates) into a BACKDROP_TILE x band.h bitmap.
        function makeBand(band, paint, scale) {
          return GOGEngine.bake(
            BACKDROP_TILE,
            band.h,
            function (g) {
              g.translate(0, -band.y);
              paint(g);
            },
            scale,
          );
        }

        // Free a baked canvas right away (rather than waiting for GC) when it is replaced.
        function releaseCanvas(c) {
          if (c) {
            c.width = 0;
            c.height = 0;
          }
        }

        // A rounded ice mountain: smooth dome, pale top, shaded right flank.
        function paintGlacier(g, cx, base, w, h) {
          const left = cx - w / 2;
          const right = cx + w / 2;
          g.beginPath();
          g.moveTo(left, base);
          g.bezierCurveTo(left + w * 0.1, base - h * 0.8, cx - w * 0.22, base - h * 1.05, cx - w * 0.05, base - h);
          g.bezierCurveTo(cx + w * 0.14, base - h * 0.97, right - w * 0.14, base - h * 0.6, right, base);
          g.closePath();
          const grad = g.createLinearGradient(0, base - h, 0, base);
          grad.addColorStop(0, "#F6FBFF");
          grad.addColorStop(0.5, "#D2E5FB");
          grad.addColorStop(1, "#A3C1EC");
          g.fillStyle = grad;
          g.fill();
          g.save();
          g.clip();
          g.fillStyle = "rgba(120, 160, 222, 0.38)";
          g.beginPath();
          g.moveTo(cx - w * 0.05, base - h);
          g.quadraticCurveTo(cx + w * 0.2, base - h * 0.55, cx + w * 0.08, base);
          g.lineTo(right + 12, base);
          g.lineTo(right + 12, base - h - 12);
          g.closePath();
          g.fill();
          g.restore();
        }

        // A chunky drifting iceberg: flat-ish snowy top, tinted underwater half.
        function paintBerg(g, cx, base, w, h) {
          const left = cx - w / 2;
          const right = cx + w / 2;
          const top = base - h;
          const r = Math.min(h * 0.55, w * 0.3);
          g.fillStyle = "rgba(70, 130, 200, 0.4)";
          g.beginPath();
          g.moveTo(left + w * 0.05, base);
          g.lineTo(right - w * 0.05, base);
          g.quadraticCurveTo(cx, base + h * 0.7, left + w * 0.05, base);
          g.closePath();
          g.fill();
          g.beginPath();
          g.moveTo(left, base);
          g.lineTo(left, top + r);
          g.quadraticCurveTo(left, top, left + r, top);
          g.lineTo(right - r, top);
          g.quadraticCurveTo(right, top, right, top + r);
          g.lineTo(right, base);
          g.closePath();
          const grad = g.createLinearGradient(0, top, 0, base);
          grad.addColorStop(0, "#FFFFFF");
          grad.addColorStop(1, "#BBD8F6");
          g.fillStyle = grad;
          g.fill();
          g.save();
          g.clip();
          g.fillStyle = "rgba(120, 165, 226, 0.4)";
          g.fillRect(cx + w * 0.12, top, w, h);
          g.restore();
        }

        function buildFarLayer(g) {
          const rand = seededRandom(4242);
          const count = 7;
          for (let i = 0; i < count; i++) {
            const w = 250 + rand() * 170;
            const h = 90 + rand() * 90;
            const cx = (i + 0.15 + rand() * 0.7) * (BACKDROP_TILE / count);
            for (const off of [-BACKDROP_TILE, 0, BACKDROP_TILE]) {
              paintGlacier(g, cx + off, HORIZON_Y + 8, w, h);
            }
          }
        }

        function buildMidLayer(g) {
          const rand = seededRandom(9001);
          const count = 6;
          for (let i = 0; i < count; i++) {
            const w = 110 + rand() * 110;
            const h = 34 + rand() * 40;
            const cx = (i + 0.2 + rand() * 0.6) * (BACKDROP_TILE / count);
            for (const off of [-BACKDROP_TILE, 0, BACKDROP_TILE]) {
              paintBerg(g, cx + off, HORIZON_Y + 16 + rand() * 6, w, h);
            }
          }
        }

        function buildSeaLayer(g) {
          const grad = g.createLinearGradient(0, HORIZON_Y, 0, VIEW_H);
          grad.addColorStop(0, "#C4E7FB");
          grad.addColorStop(0.3, "#86BEF0");
          grad.addColorStop(1, "#437FDC");
          g.fillStyle = grad;
          g.fillRect(0, HORIZON_Y, BACKDROP_TILE, VIEW_H - HORIZON_Y);
          g.fillStyle = "rgba(255, 255, 255, 0.6)";
          g.fillRect(0, HORIZON_Y - 1, BACKDROP_TILE, 3);
          const rand = seededRandom(77);
          g.lineCap = "round";
          for (let i = 0; i < 80; i++) {
            const y = HORIZON_Y + 10 + rand() * (VIEW_H - HORIZON_Y - 20);
            const depth = (y - HORIZON_Y) / (VIEW_H - HORIZON_Y);
            const len = 10 + depth * 38 * (0.5 + rand());
            const x = rand() * BACKDROP_TILE;
            g.strokeStyle = "rgba(255, 255, 255, " + (0.14 + 0.3 * rand()).toFixed(2) + ")";
            g.lineWidth = 1.5 + depth * 2;
            for (const off of [-BACKDROP_TILE, 0, BACKDROP_TILE]) {
              g.beginPath();
              g.moveTo(x + off, y);
              g.lineTo(x + off + len, y);
              g.stroke();
            }
          }
        }

        // Puffy cartoon cloud: white top, peach underside, flat base.
        function makeCloudSprite(scale, w, h, seed) {
          const c = document.createElement("canvas");
          c.width = Math.round(w * scale);
          c.height = Math.round(h * scale);
          const g = c.getContext("2d");
          g.setTransform(scale, 0, 0, scale, 0, 0);
          const rand = seededRandom(seed);
          const n = 5;
          g.fillStyle = "#FFFFFF";
          g.beginPath();
          for (let i = 0; i < n; i++) {
            const t = (i + 0.5) / n;
            const lift = Math.sin(t * Math.PI);
            const px = w * (0.12 + t * 0.76);
            const py = h * 0.62 - lift * h * 0.24 * (0.7 + rand() * 0.5);
            const pr = h * (0.2 + lift * 0.18 * (0.6 + rand() * 0.6));
            g.moveTo(px + pr, py);
            g.arc(px, py, pr, 0, Math.PI * 2);
          }
          g.fill();
          // peach shading on the underside, only where the cloud is
          g.globalCompositeOperation = "source-atop";
          const shade = g.createLinearGradient(0, h * 0.42, 0, h * 0.78);
          shade.addColorStop(0, "rgba(249, 207, 221, 0)");
          shade.addColorStop(1, "rgba(249, 207, 221, 1)");
          g.fillStyle = shade;
          g.fillRect(0, 0, w, h);
          // flatten the base
          g.globalCompositeOperation = "destination-out";
          g.fillRect(0, h * 0.78, w, h);
          return c;
        }

        // The polluted shore that ends the level: a solid rocky island with
        // dirty snow, a drain pipe and a few drips. It gives the factory
        // somewhere to stand and the world a visible, finished right-hand edge.
        function drawShore() {
          const s = SHORE;
          ctx.save();
          const rock = ctx.createLinearGradient(0, s.y, 0, s.y + s.h);
          rock.addColorStop(0, "#9A8878");
          rock.addColorStop(1, "#4E4038");
          ctx.fillStyle = rock;
          roundedRect(s.x, s.y, s.w, s.h, 26, true, false);
          ctx.fillStyle = "#DAD6D0"; // dirty snow cap
          roundedRect(s.x, s.y, s.w, 16, 8, true, false);
          ctx.strokeStyle = "rgba(30, 22, 18, 0.35)";
          ctx.lineWidth = 3;
          ctx.lineCap = "round";
          for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(s.x + 40 + i * 48, s.y + 30);
            ctx.lineTo(s.x + 32 + i * 48 + (i % 2 ? 14 : -8), s.y + 90 + (i % 3) * 18);
            ctx.stroke();
          }
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(s.x, s.y, s.w, s.h, 26, false, true);

          // drain pipe spilling dirty water into the sea
          ctx.fillStyle = "#6C7077";
          roundedRect(s.x - 26, s.y + 40, 52, 24, 8, true, false);
          roundedRect(s.x - 26, s.y + 40, 52, 24, 8, false, true);
          ctx.restore();
        }

        function drawSmogFactory() {
          drawShore();
          const x = 1835;
          const y = 180;

          // Body — a grimy rust-brown instead of candy pink, so the
          // building itself reads as "dirty machine", not a playhouse.
          ctx.fillStyle = "#8a7362";
          roundedRect(x, y + 120, 160, 130, 10, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(x, y + 120, 160, 130, 10, false, true);

          // Smokestacks — darker charcoal-grey, with a thin black/amber
          // hazard-stripe ring near the top of each. Same danger motif as
          // the Smog cloud in Stage 2, so kids read "this = bad" using one
          // shared visual language across the whole game.
          ctx.fillStyle = "#565a60";
          roundedRect(x + 24, y + 30, 42, 100, 8, true, false);
          roundedRect(x + 88, y, 42, 130, 8, true, false);
          ctx.strokeStyle = "#111";
          roundedRect(x + 24, y + 30, 42, 100, 8, false, true);
          roundedRect(x + 88, y, 42, 130, 8, false, true);

          ctx.save();
          ctx.strokeStyle = "#ffb020";
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(x + 24, y + 46);
          ctx.lineTo(x + 66, y + 46);
          ctx.moveTo(x + 88, y + 16);
          ctx.lineTo(x + 130, y + 16);
          ctx.stroke();
          ctx.restore();

          // A simple grumpy face on the body — no text required, kids
          // read "this place is unhappy/bad" at a glance, still soft
          // cartoon, never scary (per brand).
          ctx.fillStyle = "#241c30";
          circle(x + 55, y + 175, 7, true);
          circle(x + 105, y + 175, 7, true);
          ctx.save();
          ctx.strokeStyle = "#241c30";
          ctx.lineWidth = 5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.arc(x + 80, y + 210, 22, Math.PI * 1.1, Math.PI * 1.9);
          ctx.stroke();
          ctx.restore();
        }

        // The home iceberg's static look: warm halo, ice block, face, grass cap and the
        // welcome sign. Baked once (HOME_BOX) by drawHomeBase(); the parent penguins,
        // the jumping fish and the sparkles stay live.
        function drawHomeStatic() {
          const b = state.stableBase;
          
          // 1. Warm cozy sun glow halo over the safe iceberg
          ctx.save();
          const safeGrad = ctx.createRadialGradient(b.x + b.w/2, b.y - 10, 10, b.x + b.w/2, b.y - 10, 150);
          safeGrad.addColorStop(0, "rgba(255, 226, 110, 0.32)");
          safeGrad.addColorStop(0.5, "rgba(255, 185, 90, 0.12)");
          safeGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
          ctx.fillStyle = safeGrad;
          ctx.beginPath();
          ctx.arc(b.x + b.w/2, b.y - 10, 150, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // 2. Draw main safe base platform (3D block)
          ctx.save();
          const ibGrad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
          ibGrad.addColorStop(0, "#DDF5FF");
          ibGrad.addColorStop(0.3, "#A8DAF0");
          ibGrad.addColorStop(1, "#2C5E7A");
          
          ctx.fillStyle = ibGrad;
          roundedRect(b.x, b.y, b.w, b.h, 20, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(b.x, b.y, b.w, b.h, 20, false, true);

          // Crevice texture lines on the front face
          ctx.strokeStyle = "rgba(40, 110, 150, 0.4)";
          ctx.lineWidth = 3.5;
          for (let offset = 40; offset < b.w; offset += 55) {
            ctx.beginPath();
            ctx.moveTo(b.x + offset, b.y + 15);
            ctx.lineTo(b.x + offset + (offset % 12 - 6), b.y + b.h - 10);
            ctx.stroke();
          }
          ctx.restore();

          ctx.fillStyle = "#7CE6A6";
          roundedRect(b.x, b.y, b.w, 14, 7, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 3;
          roundedRect(b.x, b.y, b.w, 14, 7, false, true);

          ctx.fillStyle = "#241c30";
          circle(b.x + b.w * 0.32, b.y + b.h * 0.42, 6, true);
          circle(b.x + b.w * 0.5, b.y + b.h * 0.42, 6, true);
          ctx.save();
          ctx.strokeStyle = "#241c30";
          ctx.lineWidth = 4;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.arc(
            b.x + b.w * 0.41,
            b.y + b.h * 0.55,
            16,
            Math.PI * 0.1,
            Math.PI * 0.9,
          );
          ctx.stroke();
          ctx.restore();

          // Welcome sign on a little post, held high enough to clear the huddle.
          const signW = 156;
          const signH = 34;
          const signX = b.x + b.w / 2 - signW / 2;
          const signY = b.y - 118;
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(b.x + b.w / 2, signY + signH);
          ctx.lineTo(b.x + b.w / 2, b.y + 2);
          ctx.stroke();
          ctx.fillStyle = "#fff";
          roundedRect(signX, signY, signW, signH, 9, true, false);
          ctx.lineWidth = 4;
          roundedRect(signX, signY, signW, signH, 9, false, true);
          ctx.fillStyle = "#111";
          ctx.font = "900 14px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("💚 SAFE ICEBERG", b.x + b.w / 2, signY + signH / 2 + 1);
        }

        // Run drawFn with every ctx-based helper (roundedRect, circle, ...) painting into g.
        function withCtx(g, drawFn) {
          const prev = ctx;
          ctx = g;
          try {
            drawFn();
          } finally {
            ctx = prev;
          }
        }

        // World rect of the baked home sprite: halo (r=150 around x=160,y=370), block,
        // sign. Origin on multiples of 4 so it lands on whole device pixels.
        const HOME_BOX = { x: 8, y: 216, w: 304, h: 372 };
        // Snow sparkles rising off the home iceberg (spawned each frame, drawn as particles).
        function spawnHomeSparkles() {
          if (Math.random() < 0.12) {
            const b = state.stableBase;
            state.particles.push({
              x: b.x + Math.random() * b.w,
              y: b.y,
              vx: (Math.random() - 0.5) * 8,
              vy: -15 - Math.random() * 20,
              life: 1.0,
              maxLife: 1.0,
              color: "#FFF59D",
              size: 2 + Math.random() * 2,
              kind: "snow"
            });
          }
        }

        // Small deterministic PRNG so each floe's jagged edge and crack
        // pattern is generated once, cached, and never reshuffles frame
        // to frame (real Math.random() would make the ice "boil").
        function seededRandom(seed) {
          let s = seed % 2147483647;
          if (s <= 0) s += 2147483646;
          return function () {
            s = (s * 16807) % 2147483647;
            return (s - 1) / 2147483646;
          };
        }

        // Builds an irregular, organic outline for a floe (as normalized
        // 0..1 offsets around a rounded rect) plus a jagged snow-cap line
        // along the top edge, so no two platforms read as the same shape.
        function getIceShapePoints(pl) {
          if (pl.shapePts) return pl.shapePts;
          const rand = seededRandom(pl.seed || 1);
          const N = 14;
          const outline = [];
          for (let i = 0; i < N; i++) {
            const t = i / N;
            const bulge = 0.82 + rand() * 0.22;
            outline.push({ t, bulge });
          }
          const snowTeeth = [];
          const teeth = 6 + Math.floor(rand() * 3);
          for (let i = 0; i <= teeth; i++) {
            snowTeeth.push(0.55 + rand() * 0.45);
          }
          pl.shapePts = { outline, snowTeeth };
          return pl.shapePts;
        }

        // Cracks are generated once per melt-stage (not every frame) and
        // cached on the platform so they hold still until the ice actually
        // worsens to the next stage.
        function getCrackLines(pl, stage) {
          if (pl.cachedCrackStage === stage && pl.cachedCracks) {
            return pl.cachedCracks;
          }
          const rand = seededRandom((pl.crackSeed || 1) + stage * 911);
          const count = Math.min(stage * 2, 8);
          const lines = [];
          for (let i = 0; i < count; i++) {
            const cx = 0.15 + rand() * 0.7;
            const cy = 0.2 + rand() * 0.6;
            const len = 0.12 + rand() * 0.22;
            const ang = rand() * Math.PI * 2;
            lines.push({ cx, cy, len, ang, branch: rand() > 0.5 });
          }
          pl.cachedCrackStage = stage;
          pl.cachedCracks = lines;
          return lines;
        }

        const FLOE_PALETTE = [
          null,
          { lip: "#FFFFFF", top: "#E9F8FF", bot: "#80C6EE" },
          { lip: "#F2FAFF", top: "#D4EFFB", bot: "#6DB5E1" },
          { lip: "#DDEBF5", top: "#BADAEC", bot: "#5B9DC9" },
          { lip: "#C6D9E8", top: "#9FC5DE", bot: "#4B83AF" },
          { lip: "#B2C6DA", top: "#87AFCC", bot: "#3B6B94" },
        ];
        // One vertical gradient per (melt stage, slab height), created once. It is
        // defined in the floe's local space, so it follows the translate/rotate.
        const floeGradients = {};
        function floeBodyGradient(stage, palette, h) {
          const key = stage + "|" + h;
          let g = floeGradients[key];
          if (!g) {
            g = ctx.createLinearGradient(0, 0, 0, h);
            g.addColorStop(0, palette.top);
            g.addColorStop(1, palette.bot);
            floeGradients[key] = g;
          }
          return g;
        }
        // Critical-floe warning outline: 41 pre-built alphas (0.50 .. 0.90) instead of a
        // template string per frame.
        const CRITICAL_STROKES = [];
        for (let i = 50; i <= 90; i++) {
          CRITICAL_STROKES.push("rgba(239, 68, 68, " + (i / 100).toFixed(2) + ")");
        }

        // Draws one organic ice floe: jagged silhouette, snow cap, interior
        // shading, and stage-appropriate cracks/puddles/fragment gaps.
        function drawIceFloe(pl, x, w, meltRatio) {
          const h = pl.h + SLAB_DEPTH; // whole visible slab; only the top pl.h is walkable
          const stage =
            meltRatio < 0.15
              ? 1
              : meltRatio < 0.35
                ? 2
                : meltRatio < 0.52
                  ? 3
                  : meltRatio < 0.68
                    ? 4
                    : 5;

          // Fresh white-blue ice greys and thins out as it melts.
          const palette = FLOE_PALETTE[stage];

          ctx.save();
          ctx.translate(x + w / 2, pl.y + pl.h / 2);
          ctx.rotate(pl.rot || 0);
          ctx.translate(-w / 2, -pl.h / 2);

          // 1. Hard offset shadow (flat, no blur)
          ctx.fillStyle = "rgba(10, 28, 60, 0.38)";
          roundedRect(4, 5, w, h, 14, true, false);

          // 2. One solid slab with a vertical ice gradient
          ctx.fillStyle = floeBodyGradient(stage, palette, h);
          roundedRect(0, 0, w, h, 14, true, false);

          // 3. Details, clipped to the slab
          ctx.save();
          roundedRect(0, 0, w, h, 14, false, false);
          ctx.clip();

          // snow lip along the top with a scalloped lower edge
          ctx.fillStyle = palette.lip;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(w, 0);
          ctx.lineTo(w, SLAB_LIP);
          const bumps = Math.max(4, Math.round(w / 26));
          const bw = w / bumps;
          for (let i = bumps - 1; i >= 0; i--) {
            ctx.quadraticCurveTo(i * bw + bw / 2, SLAB_LIP + 5 + (i % 2) * 2, i * bw, SLAB_LIP);
          }
          ctx.closePath();
          ctx.fill();

          // glossy streaks on the ice face
          ctx.globalAlpha = 0.42;
          ctx.strokeStyle = "#FFFFFF";
          ctx.lineWidth = 3;
          ctx.lineCap = "round";
          const streaks = Math.max(2, Math.floor(w / 60));
          ctx.beginPath(); // the streaks never overlap: one path, one stroke
          for (let i = 0; i < streaks; i++) {
            const sx = w * (0.14 + ((i + 0.3) / streaks) * 0.7);
            ctx.moveTo(sx, SLAB_LIP + 8);
            ctx.lineTo(sx + 9, SLAB_LIP + 20);
          }
          ctx.stroke();
          ctx.globalAlpha = 1;

          // cracks appear as the slab melts
          if (stage >= 2) {
            ctx.strokeStyle = stage >= 4 ? "#1D4F73" : "#3B7FB8";
            ctx.lineWidth = stage >= 4 ? 2.4 : 1.6;
            const cracks = getCrackLines(pl, stage);
            ctx.beginPath(); // all cracks share one colour/width: one path, one stroke
            for (let i = 0; i < cracks.length; i++) {
              const c = cracks[i];
              const cx = c.cx * w;
              const cy = SLAB_LIP + 4 + c.cy * (h - SLAB_LIP - 8);
              const dx = Math.cos(c.ang) * c.len * w;
              const dy = Math.sin(c.ang) * c.len * (h - SLAB_LIP);
              ctx.moveTo(cx - dx / 2, cy - dy / 2);
              ctx.lineTo(cx + dx / 2, cy + dy / 2);
              if (c.branch) {
                ctx.lineTo(cx + dx / 2 + dy * 0.3, cy + dy / 2 - dx * 0.3);
              }
            }
            ctx.stroke();
          }
          ctx.restore();

          // healing flash: a flat cyan ring just outside the outline
          if (pl.glowTimer > 0) {
            ctx.strokeStyle = "rgba(135, 225, 255, " + Math.min(1, pl.glowTimer / 1.5).toFixed(2) + ")";
            ctx.lineWidth = 10;
            roundedRect(0, 0, w, h, 14, false, true);
          }

          // 4. Outline
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(0, 0, w, h, 14, false, true);
          ctx.restore();
        }

        function roundedRect(x, y, w, h, r, fill, stroke) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          if (fill) ctx.fill();
          if (stroke) ctx.stroke();
        }

        function circle(x, y, r, fill) {
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          if (fill) ctx.fill();
          else ctx.stroke();
        }

        function ellipse(x, y, rx, ry, fill, stroke) {
          ctx.beginPath();
          ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
          if (fill) ctx.fill();
          if (stroke) ctx.stroke();
        }

        // Flat soft ellipse under a character's feet so it reads as standing ON
        // the ice rather than floating in front of it.
        // (No save/restore: every caller sets its own fill before the next fill.)
        function drawContactShadow(x, y, halfW) {
          ctx.fillStyle = "rgba(18, 40, 78, 0.3)";
          ctx.beginPath();
          ctx.ellipse(x, y, halfW, halfW * 0.26, 0, 0, TAU);
          ctx.fill();
        }

        // Inked emoji, drawn from a cached bitmap (see emojiSprite) centred on x, y.
        function drawEmoji(emoji, x, y, size) {
          const c = emojiSprite(emoji, size, true);
          ctx.drawImage(c, x - c.gw / 2, y - c.gh / 2, c.gw, c.gh);
        }

        /* ================= render (PixiJS) =================
           Retained scene graph. The ORIGINAL Stage 4 art is unchanged: every painter above
           (sky, glaciers, bergs, clouds, factory, home iceberg, floes, chick/Penny sheets, emoji)
           still runs through Canvas2D, but only ONCE per resolution/state, into a texture.
           Per frame Pixi just moves sprites. On top, Pixi adds the cinematic layer (GPU only):
             - DisplacementFilter  : heat shimmer on the far sea + glaciers, stronger as Warmth rises
             - additive blend      : sun glitter on the sea, drifting diamond dust
             - FillGradient        : the aurora ribbons are live gradient Graphics
           ?fx=0 turns the extras off, ?fx=1 forces them on. */
        const WATER_BAND_TOP = 24; // the water gradient starts this far above the sea level
        let R = null;
        let sceneReady = false;
        const nodes = {};
        let art = null;
        let tracked = new Set(); // textures made from baked canvases (destroyed on resize)

        let FX_FULL = true;
        (function () {
          let reduced = false;
          try { reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}
          const lowEnd = !!navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2;
          FX_FULL = !(reduced || lowEnd);
          const m = /[?&]fx=([01])/.exec(window.location.search);
          if (m) FX_FULL = m[1] === "1";
        })();

        function track(canvas) {
          const t = GOGRender.tex(canvas);
          tracked.add(t);
          return t;
        }
        // canvas -> { tex, w, h } with logical size (gw/gh set by bake / frameSprite / emojiSprite)
        function ct(c) {
          return c._pt || (c._pt = { tex: track(c), w: c.gw != null ? c.gw : c.width, h: c.gh != null ? c.gh : c.height });
        }
        function emojiT(glyph, size, outlined) {
          return ct(emojiSprite(glyph, size, outlined));
        }
        function frameT(sheet, frame, destW) {
          return ct(frameSprite(sheet, frame, destW));
        }
        // a baked texture drawn at its logical size (fx/fy: extra scale, negative = flip)
        function fit(spr, o, fx, fy) {
          spr.texture = o.tex;
          spr.scale.set((o.w / o.tex.orig.width) * (fx || 1), (o.h / o.tex.orig.height) * (fy || 1));
        }

        const colCache = {};
        function css(str) {
          let c = colCache[str];
          if (c) return c;
          const m = /^rgba?\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*(?:,\s*([\d.]+)\s*)?\)$/.exec(str);
          if (m) {
            c = { n: (Math.round(+m[1]) << 16) | (Math.round(+m[2]) << 8) | Math.round(+m[3]), a: m[4] == null ? 1 : +m[4] };
          } else {
            const h = parseHex(str);
            c = { n: (h[0] << 16) | (h[1] << 8) | h[2], a: 1 };
          }
          colCache[str] = c;
          return c;
        }

        /* ---------- baking (Canvas2D painters -> textures) ---------- */
        function bakeTex(w, h, scale, fn) {
          return ct(GOGEngine.bake(w, h, fn, scale));
        }
        function bakeWith(w, h, scale, fn) {
          return bakeTex(w, h, scale, function (g) {
            withCtx(g, function () { fn(g); });
          });
        }

        const FACT_BOX = { x: 1780, y: 148, w: 324, h: 480 };
        const SIGN_LABELS = ["SPIN VALVE", "COOLING!", "FROZEN ❄️"];
        function bakeArt(scale) {
          const a = { sky: null, clouds: [], sign: [], wheel: [] };
          a.far = ct(makeBand(BAND.far, buildFarLayer, scale));
          a.mid = ct(makeBand(BAND.mid, buildMidLayer, scale));
          a.sea = ct(makeBand(BAND.sea, buildSeaLayer, scale));
          const cs = [[190, 84, 11], [150, 70, 23], [220, 92, 37]];
          for (let i = 0; i < cs.length; i++) {
            const cv = makeCloudSprite(scale, cs[i][0], cs[i][1], cs[i][2]);
            cv.gw = cs[i][0];
            cv.gh = cs[i][1];
            a.clouds.push(ct(cv));
          }
          a.sun = bakeTex(68, 68, scale, function (g) { g.fillStyle = "#fff"; g.beginPath(); g.arc(34, 34, 34, 0, TAU); g.fill(); });
          a.dot = bakeTex(32, 32, scale, function (g) { g.fillStyle = "#fff"; g.beginPath(); g.arc(16, 16, 15, 0, TAU); g.fill(); });
          a.soft = bakeTex(64, 64, 1, function (g) {
            const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, "rgba(255,255,255,1)");
            grad.addColorStop(0.35, "rgba(255,255,255,0.45)");
            grad.addColorStop(1, "rgba(255,255,255,0)");
            g.fillStyle = grad;
            g.fillRect(0, 0, 64, 64);
          });
          a.shadow = bakeTex(64, 16, scale, function (g) { g.fillStyle = "#fff"; g.beginPath(); g.ellipse(32, 8, 32, 8, 0, 0, TAU); g.fill(); });
          a.wipe = bakeTex(256, 256, 1, function (g) {
            const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
            grad.addColorStop(0, "#FFFFFF");
            grad.addColorStop(0.55, "#B9E3FF");
            grad.addColorStop(1, "#2C4BFF");
            g.fillStyle = grad;
            g.beginPath();
            g.arc(128, 128, 128, 0, TAU);
            g.fill();
          });
          // the home iceberg + the polluted shore/factory (static looks; everything live is separate)
          a.home = bakeWith(HOME_BOX.w, HOME_BOX.h, scale, function (g) { ctx.translate(-HOME_BOX.x, -HOME_BOX.y); drawHomeStatic(); });
          a.factory = bakeWith(FACT_BOX.w, FACT_BOX.h, scale, function (g) { ctx.translate(-FACT_BOX.x, -FACT_BOX.y); drawSmogFactory(); });
          const p = state.valvePlatform;
          a.platform = bakeWith(p.w + 8, p.h + 8, scale, function (g) {
            ctx.translate(4 - p.x, 4 - p.y);
            ctx.fillStyle = "#CFEFFF";
            roundedRect(p.x, p.y, p.w, p.h, 12, true, false);
            ctx.strokeStyle = "#111";
            ctx.lineWidth = 4;
            roundedRect(p.x, p.y, p.w, p.h, 12, false, true);
          });
          for (let i = 0; i < SIGN_LABELS.length; i++) {
            a.sign.push(bakeWith(128, 42, scale, function (g) {
              ctx.translate(4 - (p.x + 105), 4 - (p.y - 48));
              ctx.fillStyle = "#fff";
              roundedRect(p.x + 105, p.y - 48, 120, 34, 8, true, false);
              ctx.strokeStyle = "#111";
              ctx.lineWidth = 4;
              roundedRect(p.x + 105, p.y - 48, 120, 34, 8, false, true);
              ctx.fillStyle = "#111";
              ctx.font = "900 14px Arial";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(SIGN_LABELS[i], p.x + 165, p.y - 31);
            }));
          }
          const vr = state.valve.r;
          const wsz = (vr + 18) * 2;
          const wheelFills = ["#FFD84D", "#87E1FF", "#B3F0FF"]; // normal, cooling, frozen
          for (let v = 0; v < 3; v++) {
            a.wheel.push(bakeWith(wsz, wsz, scale, function (g) {
              ctx.translate(wsz / 2, wsz / 2);
              ctx.fillStyle = wheelFills[v];
              circle(0, 0, vr, true);
              ctx.strokeStyle = "#111";
              ctx.lineWidth = 4;
              circle(0, 0, vr, false);
              for (let i = 0; i < 4; i++) {
                ctx.rotate(Math.PI / 2);
                ctx.fillRect(-4, -vr - 12, 8, 22);
                ctx.strokeRect(-4, -vr - 12, 8, 22);
              }
              if (v === 2) {
                ctx.save();
                ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
                for (let j = 0; j < 6; j++) {
                  ctx.rotate(Math.PI / 3);
                  ctx.fillRect(-2, -vr + 4, 4, 14);
                }
                ctx.restore();
              }
              circle(0, 0, 8, true);
              circle(0, 0, 8, false);
            }));
          }
          return a;
        }

        // sky + sun glow: one opaque bitmap per warmth step, repainted in place (texture re-uploaded)
        function repaintSky(idx) {
          const sc = hiDpi.scale;
          const pw = Math.max(1, Math.ceil(VIEW_W * sc));
          const ph = Math.ceil(SKY_H * sc);
          if (!nodes.skyCanvas || nodes.skyCanvas.width !== pw || nodes.skyCanvas.height !== ph || nodes.skyEpoch !== rasterEpoch) {
            if (nodes.skyTex) { tracked.delete(nodes.skyTex); nodes.skyTex.destroy(true); }
            nodes.skyCanvas = document.createElement("canvas");
            nodes.skyCanvas.width = pw;
            nodes.skyCanvas.height = ph;
            nodes.skyTex = track(nodes.skyCanvas);
            nodes.sky.texture = nodes.skyTex;
            nodes.sky.width = VIEW_W;
            nodes.sky.height = SKY_H;
            nodes.skyEpoch = rasterEpoch;
          }
          const g = nodes.skyCanvas.getContext("2d");
          g.setTransform(sc, 0, 0, sc, 0, 0);
          const sky = g.createLinearGradient(0, 0, 0, HORIZON_Y);
          sky.addColorStop(0, RAMP.sky0[idx]);
          sky.addColorStop(0.55, RAMP.sky1[idx]);
          sky.addColorStop(1, RAMP.sky2[idx]);
          g.fillStyle = sky;
          g.fillRect(0, 0, VIEW_W, SKY_H);
          const glow = g.createRadialGradient(SUN_X, SUN_Y, 10, SUN_X, SUN_Y, 190);
          glow.addColorStop(0, RAMP.glow[idx]);
          glow.addColorStop(1, "rgba(255, 246, 200, 0)");
          g.save();
          g.globalAlpha = 0.65;
          g.fillStyle = glow;
          g.fillRect(SUN_X - 200, SUN_Y - 200, 400, 400);
          g.restore();
          nodes.skyTex.source.update();
          nodes.skyIdx = idx;
        }

        /* ---------- scene graph ---------- */
        function spr(parent, ax, ay) {
          const s = new PIXI.Sprite(PIXI.Texture.EMPTY);
          s.anchor.set(ax == null ? 0.5 : ax, ay == null ? 0.5 : ay);
          if (parent) parent.addChild(s);
          return s;
        }
        function box(parent) {
          const c = new PIXI.Container();
          if (parent) parent.addChild(c);
          return c;
        }
        function pool(parent, make) {
          return R.pool(parent, make || function () { return spr(null); });
        }
        function gfx(parent) {
          const g = new PIXI.Graphics();
          parent.addChild(g);
          return g;
        }
        function mkGrad(c0, c1) {
          return new PIXI.FillGradient({
            type: "linear",
            start: { x: 0, y: 0 },
            end: { x: 0, y: 190 },

        function buildNodes() {
          const w = R.world;

          nodes.homeSpr = spr(nodes.home, 0, 0);

          nodes.chicks = pool(nodes.chickLayer, function () {

          nodes.chickEmoji = pool(nodes.chickLayer);
          nodes.playerLayer = box(cam);
          nodes.pShadow = spr(nodes.playerLayer);

          nodes.pShadow.alpha = 0.3;
          nodes.pBody = spr(nodes.playerLayer, 0.5, 1);
          nodes.pExtra = pool(nodes.playerLayer);
          nodes.partG = gfx(cam);

          nodes.snow = pool(w);

          /* ---- water (over the world) ---- */

          nodes.dust = box(w);

          nodes.wipeDisc = spr(R.fx);

          nodes.wipeDisc.visible = nodes.wipeRing.visible = false;

          if (FX_FULL) {
            const mapC = pixelMap(256, function (u, v, x, y, n, o) {
              o[0] = 128 + 127 * Math.sin(3 * v + 1.3 * Math.sin(2 * u + 0.6));
              o[1] = 128 + 127 * 0.5 * Math.sin(2 * u + 1.1 * Math.sin(3 * v + 1.1));
              o[2] = 128;
              o[3] = 255;
            });
            const mapT = GOGRender.tex(mapC);
            mapT.source.style.addressMode = "repeat";
            nodes.dispSprite = new PIXI.Sprite(mapT);
            nodes.dispSprite.width = nodes.dispSprite.height = 512;

            nodes.glints.visible = false;
            nodes.dust.visible = false;

        // per-pixel map painter (tileable: integer frequencies only)
        function pixelMap(size, fn) {
          const c = document.createElement("canvas");
          c.width = c.height = size;
          const g = c.getContext("2d");
          const img = g.createImageData(size, size);
          const o = [0, 0, 0, 0];
          for (let y = 0; y < size; y++) {
            for (let x = 0; x < size; x++) {
              fn((x / size) * TAU, (y / size) * TAU, x, y, size, o);
              const i = (y * size + x) * 4;
              img.data[i] = o[0] < 0 ? 0 : o[0] > 255 ? 255 : o[0];
              img.data[i + 1] = o[1] < 0 ? 0 : o[1] > 255 ? 255 : o[1];
              img.data[i + 2] = o[2];
              img.data[i + 3] = o[3];
            }
          }
          g.putImageData(img, 0, 0);
          return c;
        }

        function applyArt() {
          nodes.far.texture = art.far.tex;
          nodes.sea.texture = art.sea.tex;
          nodes.mid.texture = art.mid.tex;
          for (const t of [nodes.far, nodes.sea, nodes.mid]) t.tileScale.set(1 / hiDpi.scale, 1 / hiDpi.scale);
          fit(nodes.sun, art.sun);
          fit(nodes.factorySpr, art.factory);
          nodes.factorySpr.position.set(FACT_BOX.x, FACT_BOX.y);
          fit(nodes.homeSpr, art.home);
          nodes.homeSpr.position.set(HOME_BOX.x, HOME_BOX.y);

          fit(nodes.platSpr, art.platform);
          nodes.platSpr.position.set(p.x - 4, p.y - 4);
          nodes.signSpr.position.set(p.x + 105 - 4, p.y - 48 - 4);
          nodes.skyIdx = -1;
          for (const v of nodes.floeViews) v.key = "";
          nodes.waterKey = "";
          const gs = nodes.glints.children;
          for (let i = 0; i < gs.length; i++) { gs[i].texture = art.soft.tex; gs[i].width = gs[i].height = 26; }
          const ds = nodes.dust.children;
          for (let i = 0; i < ds.length; i++) { ds[i].texture = art.soft.tex; ds[i].width = ds[i].height = 6 + (i % 4) * 3; }
          nodes.wipeDisc.texture = art.wipe.tex;
          nodes.wipeDisc.anchor.set(0.5);
          nodes.wipeDisc.position.set(VIEW_W / 2, VIEW_H / 2);

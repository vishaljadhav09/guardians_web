        function buildScene() {
          hiDpi.scale = R.scale;
          art = bakeArt(hiDpi.scale);
          buildNodes();
          applyArt();
          R.onResize(function () {
            hiDpi.scale = R.scale;
            rasterEpoch++;
            const old = tracked;
            tracked = new Set();
            art = bakeArt(hiDpi.scale);
            applyArt();
            renderScene();
            old.forEach(function (t) { try { t.destroy(true); } catch (e) {} });
          });
          nodes.overlay = R.overlay2d();
          sceneReady = true;
        }

        /* ---------- per-frame sync ---------- */
        // how far a dashed rounded-rect outline travels (animated marching ants on a critical floe)
        function rrPoints(x, y, w, h, r) {
          const pts = [];
          const q = function (x0, y0, cx, cy, x1, y1) {
            for (let i = 1; i <= 4; i++) {
              const t = i / 4, u = 1 - t;
              pts.push(u * u * x0 + 2 * u * t * cx + t * t * x1, u * u * y0 + 2 * u * t * cy + t * t * y1);
            }
          };
          pts.push(x + r, y, x + w - r, y);
          q(x + w - r, y, x + w, y, x + w, y + r);
          pts.push(x + w, y + h - r);
          q(x + w, y + h - r, x + w, y + h, x + w - r, y + h);
          pts.push(x + r, y + h);
          q(x + r, y + h, x, y + h, x, y + h - r);
          pts.push(x, y + r);
          q(x, y + r, x, y, x + r, y);
          return pts;
        }
        function dashPath(g, pts, dash, gap, shift, style) {
          const n = pts.length / 2;
          const cum = [0];
          for (let i = 0; i < n; i++) {
            const j = (i + 1) % n;
            cum.push(cum[i] + Math.hypot(pts[j * 2] - pts[i * 2], pts[j * 2 + 1] - pts[i * 2 + 1]));
          }
          const total = cum[n];
          const period = dash + gap;
          const at = function (s) {
            let i = 0;
            while (i < n - 1 && cum[i + 1] < s) i++;
            const j = (i + 1) % n;
            const f = (s - cum[i]) / (cum[i + 1] - cum[i] || 1);
            return [pts[i * 2] + (pts[j * 2] - pts[i * 2]) * f, pts[i * 2 + 1] + (pts[j * 2 + 1] - pts[i * 2 + 1]) * f, i];
          };
          for (let s0 = shift - period; s0 < total; s0 += period) {
            const a = Math.max(0, s0), b = Math.min(total, s0 + dash);
            if (b <= a) continue;
            const pa = at(a), pb = at(b);
            g.moveTo(pa[0], pa[1]);
            for (let k = pa[2] + 1; k <= pb[2]; k++) g.lineTo(pts[(k % n) * 2], pts[(k % n) * 2 + 1]);
            g.lineTo(pb[0], pb[1]);
          }
          g.stroke(style);
        }

        function syncBackdrop() {
          const sc = hiDpi.scale;
          const warmthVal = state.warmth;
          const wi = warmIdx(warmthVal);
          const t = state.time;
          const scrollVal = gameRunning ? camX : camX + performance.now() * 0.02;
          if (nodes.skyIdx !== wi) repaintSky(wi);

          // aurora ribbons: live gradient Graphics (+ an additive twin for a richer glow)
          const won = state.state === "won";
          const grad = won ? nodes.gradWon : nodes.gradIdle;
          const aa = 0.35 + (1 - warmthVal) * 0.45;
          for (let k = 0; k < 2; k++) {
            const g = k === 0 ? nodes.auroraG : nodes.auroraG2;
            g.clear();
            if (k === 1 && !FX_FULL) continue;
            const tt = k === 0 ? t : t * 0.7 + 2.5;
            for (let j = 0; j < 2; j++) {
              const pts = [0, 0];
              for (let x = 0; x <= VIEW_W + 20; x += 20) {
                pts.push(x, 70 + j * 34 + Math.sin(tt * 0.9 + x * 0.004 + j * 1.5) * 24 * Math.cos(tt * 0.35 + x * 0.002));
              }
              pts.push(VIEW_W, 0);
              g.poly(pts).fill(grad);
            }
            g.alpha = k === 0 ? aa : aa * 0.45;
          }

          // low sun behind the glaciers (glow is part of the sky bitmap)
          nodes.sun.tint = css(RAMP.sun[wi]).n;
          nodes.sun.position.set(SUN_X, SUN_Y + Math.sin(t * 0.4) * 3);

          for (let i = 0; i < clouds.length; i++) {
            const c = clouds[i];
            const o = art.clouds[i % art.clouds.length];
            const s = nodes.clouds[i];
            s.texture = o.tex;
            s.scale.set((o.w / o.tex.orig.width) * c.scale, (o.h / o.tex.orig.height) * c.scale);
            s.position.set(c.x - (o.w * c.scale) / 2, c.y);
            s.alpha = c.layer === "back" ? 0.75 : 0.95;
          }

          nodes.far.tilePosition.x = -(scrollVal * 0.08);
          nodes.sea.tilePosition.x = -(scrollVal * 0.3);
          nodes.mid.tilePosition.x = -(scrollVal * 0.22);

          nodes.haze.visible = warmthVal > 0.05;
          nodes.haze.alpha = (wi / WSTEPS) * 0.2;

          if (FX_FULL) {
            // the horizon shimmers like heat haze, wilder as Warmth climbs
            nodes.dispSprite.position.set(-((t * 26) % 512), (t * 11) % 512);
            const ds = 3 + warmthVal * 13;
            nodes.dispFilter.scale.set(ds, ds * 0.6);
            const gs = nodes.glints.children;
            for (let i = 0; i < gs.length; i++) {
              const ph = i * 1.7;
              gs[i].position.set(SUN_X - 150 + i * 20 + Math.sin(t * 0.8 + ph) * 8, 466 + ((i * 37) % 70) + Math.sin(t * 1.3 + ph) * 3);
              gs[i].alpha = Math.max(0, 0.55 * Math.sin(t * 2.2 + ph)) * (1 - warmthVal * 0.5);
              gs[i].tint = 0xfff6c8;
            }
            const du = nodes.dust.children;
            for (let i = 0; i < du.length; i++) {
              const sp = 6 + (i % 5) * 3;
              du[i].position.set((((i * 97) % VIEW_W) - t * sp + VIEW_W * 4) % VIEW_W, (((i * 61) % VIEW_H) + t * (3 + (i % 3) * 2) + VIEW_H * 4) % VIEW_H);
              du[i].alpha = 0.14 * (0.5 + 0.5 * Math.sin(t * 1.5 + i));
            }
          }
        }

        function setSpriteFrame(s, sheet, frame, destW, fx, fy, x, y, rot) {
          const o = frameT(sheet, frame, destW);
          fit(s, o, fx, fy);
          s.position.set(x, y);
          s.rotation = rot || 0;
        }

        function syncFactory() {
          const f = nodes.factory;
          f.visible = inView(1770, 2100);
          if (!f.visible) return;
          const g = nodes.factoryG;
          g.clear();
          const s = SHORE;
          // drain-pipe drips
          const drip = (state.time * 1.4) % 1;
          g.ellipse(s.x - 20, s.y + 70 + drip * 90, 4, 6 + drip * 3).fill({ color: 0x605846, alpha: 0.85 });
          g.ellipse(s.x - 12, s.y + 70 + ((drip + 0.5) % 1) * 90, 3.5, 5.5).fill({ color: 0x605846, alpha: 0.85 });
          const x = 1835, y = 180;
          const smokePuffs = 3 + Math.floor(state.warmth * 5);
          for (let i = 0; i < smokePuffs; i++) {
            const sx = x + 46 + i * 20 + Math.sin(state.time * 1.4 + i) * 10;
            const sy = y + 20 - i * 10 - Math.cos(state.time * 1.5 + i * 0.5) * 8;
            g.circle(sx, sy, 18 + i * 3).fill({ color: i % 2 === 0 ? 0x464137 : 0x968c6c, alpha: 0.2 + state.warmth * 0.25 });
          }
          if (state.warmth > 0.15) {
            const a = (0.12 + state.warmth * 0.28) * 0.8;
            for (let w = 0; w < 3; w++) {
              const wx = x + 30 + w * 45;
              const topY = y - 90 - state.warmth * 40;
              let first = true;
              for (let hy = y - 10; hy > topY; hy -= 6) {
                const wobble = Math.sin(state.time * 6 + hy * 0.15 + w * 2) * (3 + state.warmth * 5);
                if (first) { g.moveTo(wx + wobble, hy); first = false; } else g.lineTo(wx + wobble, hy);
              }
              g.stroke({ width: 2, color: 0xffd28c, alpha: a });
            }
          }
        }

        function syncHome() {
          const h = nodes.home;
          h.visible = inView(-10, 340);
          if (!h.visible) return;
          const b = state.stableBase;
          const idle = spriteSheets.idle;
          nodes.dad.visible = nodes.mom.visible = idle.loaded;
          if (idle.loaded) {
            const dadWaddle = Math.sin(state.time * 2.5) * 3;
            setSpriteFrame(nodes.dad, idle, Math.floor(state.time * 1.5) % 2 % idle.cols, 44, 1, 1, b.x + b.w * 0.72, b.y + FOOT_SINK + Math.abs(dadWaddle), dadWaddle * 0.05);
            const momWave = Math.sin(state.time * 4.5) * 4;
            setSpriteFrame(nodes.mom, idle, Math.floor(state.time * 1.2 + 1) % 2 % idle.cols, 40, -1, 1, b.x + b.w * 0.85, b.y + FOOT_SINK + Math.abs(momWave), 0);
          }
          const fs = nodes.fish;
          if (state.fishJumpTimer > 0) {
            const progress = (1.5 - state.fishJumpTimer) / 1.5;
            fit(fs, emojiT("🐟", 18, true));
            fs.visible = true;
            fs.position.set(b.x + b.w * 0.5 + (progress * 80 - 40), b.y - Math.sin(progress * Math.PI) * 75 - 10);
            fs.rotation = progress * Math.PI - Math.PI / 2;
          } else fs.visible = false;
        }

        function syncValve() {
          const v = nodes.valve;
          v.visible = inView(1020, 1320);
          if (!v.visible) return;
          const vv = state.valve;
          const variant = vv.frozen ? 2 : state.coolingTimer > 0 ? 1 : 0;
          fit(nodes.wheel, art.wheel[variant]);
          nodes.wheel.position.set(vv.x, vv.y);
          nodes.wheel.rotation = vv.pulse * 1.3 + vv.activeFlash * 12.0;
          fit(nodes.signSpr, art.sign[variant]);
        }

        function floeView(i) {
          let v = nodes.floeViews[i];
          if (!v) {
            v = { c: box(nodes.floes), s: spr(null, 0, 0), key: "", tex: null };
            v.c.addChild(v.s);
            nodes.floeViews[i] = v;
          }
          return v;
        }
        const FLOE_PAD = 8;
        function syncPlatforms() {
          const bg = nodes.floeG;
          bg.clear();
          const pls = state.meltPlatforms;
          for (let i = 0; i < pls.length; i++) {
            const pl = pls[i];
            const v = floeView(i);
            const x = pl.x + pl.shrink * 0.5;
            if (pl.gone || !inView(x - 30, x + pl.w + 30)) { v.c.visible = false; continue; }
            v.c.visible = true;
            const meltRatio = 1 - pl.w / pl.baseW;
            const wr = Math.max(8, Math.round(pl.w));
            const glowQ = pl.glowTimer > 0 ? Math.round(Math.min(1, pl.glowTimer / 1.5) * 20) + 1 : 0;
            const stage = meltRatio < 0.15 ? 1 : meltRatio < 0.35 ? 2 : meltRatio < 0.52 ? 3 : meltRatio < 0.68 ? 4 : 5;
            const key = stage + "|" + wr + "|" + glowQ + "|" + rasterEpoch;
            if (key !== v.key) {
              const fp = Object.create(pl); // slab drawn at (PAD, PAD), unrotated, into its own bitmap
              fp.y = FLOE_PAD;
              fp.rot = 0;
              const h = pl.h + SLAB_DEPTH;
              const o = bakeWith(wr + FLOE_PAD * 2, h + FLOE_PAD * 2, hiDpi.scale, function () { drawIceFloe(fp, FLOE_PAD, wr, meltRatio); });
              if (v.tex) { tracked.delete(v.tex.tex); try { v.tex.tex.destroy(true); } catch (e) {} }
              v.tex = o;
              v.key = key;
              fit(v.s, o);
            }
            v.c.position.set(x + pl.w / 2, pl.y + pl.h / 2);
            v.c.rotation = pl.rot || 0;
            v.s.position.set(-wr / 2 - FLOE_PAD, -pl.h / 2 - FLOE_PAD);

            if (meltRatio > 0.55) {
              const pulse = 0.5 + Math.sin(state.time * 9) * 0.5;
              const cc = css(CRITICAL_STROKES[Math.round((0.5 + pulse * 0.4) * 100) - 50]);
              dashPath(bg, rrPoints(x - 3, pl.y - 3, pl.w + 6, pl.h + SLAB_DEPTH + 6, 16), 8, 6, state.time * 40, { width: 4, color: cc.n, alpha: cc.a });
            }
            if (meltRatio > 0.05) {
              const barW = pl.w * 0.65;
              const barH = 7;
              const bx = x + (pl.w - barW) / 2;
              const by = pl.y + pl.h + SLAB_DEPTH + 10 + Math.sin(state.time * 2.0 + pl.phase) * 2;
              bg.rect(bx - 2, by - 2, barW + 4, barH + 4).fill(0x1e293b);
              const healthPct = 1 - meltRatio;
              bg.rect(bx, by, barW * healthPct, barH).fill(healthPct < 0.35 ? 0xff3b30 : healthPct < 0.65 ? 0xffcc00 : 0x7ce6a6);
            }
          }
        }

        function syncLift() {
          const wl = state.waterLift;
          const g = nodes.liftG;
          g.clear();
          nodes.liftSeal.visible = false;
          if (!wl || !inView(wl.x - 60, wl.x + wl.w + 60)) return;
          if (wl.surfaced) {
            fit(nodes.liftSeal, emojiT("🦭", 46, true));
            nodes.liftSeal.visible = true;
            nodes.liftSeal.alpha = 0.9;
            nodes.liftSeal.position.set(wl.x + wl.w / 2, wl.y + wl.h / 2 - 4);
          } else {
            const nextIn = wl.cycle - wl.phase;
            if (nextIn < 1.2) {
              g.circle(wl.x + wl.w / 2, state.seaLevel, 14 + (1.2 - nextIn) * 10).stroke({ width: 2, color: 0xbeefff, alpha: 0.35 * (1 - nextIn / 1.2) });
            }
          }
        }

        const promptList = [];
        function chickShadow(c, x, y, halfW) {
          fit(c.shadow, art.shadow, (halfW * 2) / art.shadow.w, (halfW * 0.52) / art.shadow.h);
          c.shadow.position.set(x, y);
        }
        function syncChicks() {
          const p = state.player;
          promptList.length = 0;
          nodes.chicks.begin();
          nodes.chickEmoji.begin();
          const b = state.stableBase;
          const loaded = chickSprite.loaded;
          for (const chick of state.chicks) {
            if (p.carrying.includes(chick)) continue;
            if (chick.delivered) {
              if (!inView(-10, 340)) continue;
              const slot = chick.huddleSlot || 0;
              const col = slot % 3;
              const row = Math.floor(slot / 3);
              const baseX = b.x + b.w * 0.28 + col * 30;
              const baseY = b.y + FOOT_SINK - row * 14;
              const cheering = chick.cheerTimer > 0;
              const hop = Math.abs(Math.sin(chick.bob * 1.8)) * (cheering ? 12 : 5);
              const view = nodes.chicks.next();
              view.position.set(baseX, baseY - hop);
              view.rotation = 0;
              view.bar.clear();
              chickShadow(view, 0, hop - 5, 16);
              if (loaded) {
                const frame = cheering ? (Math.floor(chick.bob * 4) % 2 === 0 ? 4 : 5) : Math.floor(chick.bob) % 6 === 5 ? 2 : 0;
                fit(view.body, frameT(chickSprite, frame, CHICK_W));
                view.body.visible = true;
              } else view.body.visible = false;
              if (cheering && Math.random() < 0.12) {
                state.particles.push({
                  x: baseX, y: baseY - hop - 20,
                  vx: (Math.random() - 0.5) * 20, vy: -30 - Math.random() * 15,
                  life: 0.7, maxLife: 0.7, kind: "emoji", text: "🎉", size: 12,
                });
              }
              continue;
            }
            if (!inView(chick.x - 60, chick.x + 80)) continue;
            const bob = Math.sin(chick.bob) * 3;
            let shiver = 0;
            let crying = false;
            let nearest = null;
            let bestDist = Infinity;
            for (const pl of state.meltPlatforms) {
              if (pl.gone) continue;
              const d = Math.abs(pl.x + pl.w / 2 - chick.x);
              if (d < bestDist) { bestDist = d; nearest = pl; }
            }
            if (nearest && bestDist < 120) {
              const ratio = 1 - nearest.w / nearest.baseW;
              if (ratio > 0.35) {
                shiver = Math.sin(state.time * 26 + chick.bob) * 2.8;
                crying = ratio > 0.55;
              }
            }
            const destW = CHICK_W;
            const destH = loaded ? (chickSprite.frameH / chickSprite.frameW) * destW : 34;
            let drawX = chick.x + 9 + shiver;
            let drawY = chick.y + 18 + bob + FOOT_SINK;
            let drawRot = 0;
            if (!chick.rescued && chick.platformIndex !== undefined) {
              const pl = state.meltPlatforms[chick.platformIndex];
              if (pl && !pl.gone) {
                const plX = pl.x + pl.shrink * 0.5;
                const plCenterW = pl.w / 2;
                const plCenterH = pl.h / 2;
                const relX = chick.x + 9 - (plX + plCenterW);
                const relY = -plCenterH;
                const rot = pl.rot || 0;
                const cos = Math.cos(rot);
                const sin = Math.sin(rot);
                drawX = plX + plCenterW + (relX * cos - relY * sin) + shiver;
                drawY = pl.y + plCenterH + (relX * sin + relY * cos) + bob + FOOT_SINK;
                drawRot = rot;
              }
            }
            const view = nodes.chicks.next();
            view.position.set(drawX, drawY);
            view.rotation = drawRot;
            const bar = view.bar;
            bar.clear();
            chickShadow(view, 0, -bob - (FOOT_SINK - 4), 17);
            if (loaded) {
              let frame = 0;
              if (crying) {
                const worryTime = (state.time * 4.0 + chick.bob) % 3.0;
                frame = worryTime < 1.5 ? 1 : worryTime < 2.0 ? 2 : 0;
              } else {
                const chickTime = (state.time * 1.5 + chick.bob) % 5.0;
                frame = chickTime < 3.5 ? 0 : chickTime < 3.7 ? 1 : chickTime < 3.95 ? 2 : chickTime < 4.15 ? 1 : 0;
              }
              fit(view.body, frameT(chickSprite, frame, destW));
              view.body.visible = true;
              if (!chick.rescued && nearest && bestDist < 120) {
                const icePct = Math.round((nearest.w / nearest.baseW) * 100);
                if (icePct < 100) {
                  const bx = -destW / 2;
                  const by = -destH - 8;
                  bar.rect(bx, by, destW, 5).fill({ color: 0x0f172a, alpha: 0.65 });
                  bar.rect(bx, by, (icePct / 100) * destW, 5).fill(icePct < 35 ? 0xff3b30 : icePct < 65 ? 0xffcc00 : 0x80e0ff);
                  bar.rect(bx, by, destW, 5).stroke({ width: 1, color: 0x1e293b });
                }
              }
            } else {
              fit(view.body, emojiT("🐥", 26, true));
              view.body.visible = true;
              view.body.anchor.set(0.5, 0.5);
              view.body.y = -11;
            }
            if (loaded) { view.body.anchor.set(0.5, 1); view.body.y = 0; }
            const maxCarry = getMaxCarryingCapacity();
            if (!calmMode && !chick.rescued && chickInReach(p, chick) && p.carrying.length < maxCarry) {
              promptList.push({ x: drawX, y: drawY - destH - 16 });
            }
            if (crying) {
              const ts = nodes.chickEmoji.next();
              fit(ts, emojiT("💧", 12, true));
              ts.position.set(chick.x + 16, chick.y + 20);
              ts.rotation = 0;
              ts.alpha = 1;
            }
          }
          nodes.chicks.end();
          nodes.chickEmoji.end();
        }

        function syncPlayer() {
          const p = state.player;
          const x = p.x, y = p.y;
          const sheet = getActiveSpriteSheet();
          const nervous = !!p.onCriticalIce;
          const jitterX = nervous ? Math.sin(state.time * 30) * 2.2 : 0;
          const tilt = nervous ? Math.sin(state.time * 16) * 0.06 : 0;
          let waddleTilt = 0;
          let waddleY = 0;
          if (sheet === spriteSheets.running) {
            const runCycle = state.time * Math.max(9, Math.abs(p.vx) * 0.08);
            waddleTilt = Math.sin(runCycle) * 0.16;
            waddleY = -Math.abs(Math.cos(runCycle)) * 4.5;
          }
          const destW = 72;
          let destH = 108;
          const sh = nodes.pShadow;
          if (p.onGround && state.state !== "failed") {
            sh.visible = true;
            fit(sh, art.shadow, (56) / art.shadow.w, (56 * 0.26) / art.shadow.h);
            sh.position.set(x + p.w / 2 + jitterX, y + p.h + FOOT_SINK - 5);
          } else sh.visible = false;

          const body = nodes.pBody;
          if (sheet.loaded) {
            destH = (sheet.frameH / sheet.frameW) * destW;
            let frame = penguinAnim.frameIndex;
            if (state.state === "failed") frame = 0;
            else if (sheet === spriteSheets.jump) frame = p.vy < 0 ? 1 : 2;
            else frame = frame % (sheet.cols * sheet.rows);
            fit(body, frameT(sheet, frame, destW), p.facing, p.isSliding ? 0.82 : 1);
            body.position.set(x + p.w / 2 + jitterX, y + p.h + waddleY + FOOT_SINK);
            body.rotation = tilt + waddleTilt;
            body.visible = true;
          } else body.visible = false;

          nodes.pExtra.begin();
          const ex = function (glyph, size, px, py) {
            const s = nodes.pExtra.next();
            s.anchor.set(0.5, 0.5);
            fit(s, emojiT(glyph, size, true));
            s.position.set(px, py);
            s.rotation = 0;
            s.alpha = 1;
          };
          if (nervous) ex("💦", 16, x + p.w / 2 + 18, y + p.h - destH + 8 + Math.sin(state.time * 10) * 2);
          if (p.carrying && p.carrying.length > 0) {
            ex("🤗", 18, x + p.w / 2 - p.facing * 18, y + p.h - destH - 12 + Math.sin(state.time * 6) * 3);
            for (let index = 0; index < p.carrying.length; index++) {
              const cW = 34;
              const offsetX = 12 + index * 4;
              const offsetY = -destH * 0.4 - index * 12;
              const cs = nodes.pExtra.next();
              cs.alpha = 1;
              cs.rotation = 0;
              if (chickSprite.loaded) {
                const frame = Math.floor(state.time * 8 + index) % 2 === 0 ? 4 : 5;
                cs.anchor.set(0.5, 1);
                fit(cs, frameT(chickSprite, frame, cW), p.facing, 1);
                cs.position.set(x + p.w / 2 + p.facing * offsetX, y + p.h + waddleY + FOOT_SINK + offsetY);
              } else {
                cs.anchor.set(0.5, 0.5);
                fit(cs, emojiT("🐥", 20, true));
                cs.position.set(x + p.w / 2 + offsetX * p.facing, y + p.h + waddleY + offsetY - 10);
              }
            }
          }
          nodes.pExtra.end();
        }

        function syncParticles() {
          const g = nodes.partG;
          g.clear();
          nodes.partEmoji.begin();
          for (let i = 0; i < state.particles.length; i++) {
            const pt = state.particles[i];
            if (pt.x + (pt.kind === "wind" ? pt.size : 30) < camX || pt.x - 30 > camX + VIEW_W) continue;
            const alpha = Math.max(0, Math.min(1, pt.life / (pt.maxLife || 0.8)));
            if (pt.kind === "emoji") {
              const es = nodes.partEmoji.next();
              es.anchor.set(0.5, 0.5);
              fit(es, emojiT(pt.text, pt.size || 14, false));
              es.position.set(pt.x, pt.y);
              es.rotation = 0;
              es.alpha = alpha;
              continue;
            }
            const c = css(pt.color || "#ffffff");
            const a = alpha * c.a;
            if (pt.kind === "snow") g.circle(pt.x, pt.y, pt.size).fill({ color: c.n, alpha: a });
            else if (pt.kind === "drip") g.ellipse(pt.x, pt.y, pt.size * 0.6, pt.size * 1.3).fill({ color: c.n, alpha: a });
            else if (pt.kind === "wind") {
              g.moveTo(pt.x, pt.y).lineTo(pt.x + pt.size, pt.y).stroke({ width: 3, color: c.n, alpha: a });
            } else if (pt.kind === "footprint") g.ellipse(pt.x, pt.y, 4, 2).fill({ color: c.n, alpha: a });
            else {
              g.roundRect(pt.x, pt.y, pt.size, pt.size, 3).fill({ color: c.n, alpha: a });
              g.roundRect(pt.x, pt.y, pt.size, pt.size, 3).stroke({ width: 2, color: 0x111111, alpha: alpha });
            }
          }
          nodes.partEmoji.end();
        }

        function syncSnow() {
          nodes.snow.begin();
          for (let i = 0; i < snowfallParticles.length; i++) {
            const s = snowfallParticles[i];
            const sp = nodes.snow.next();
            sp.texture = art.dot.tex;
            sp.width = sp.height = s.size * 2;
            sp.position.set(s.x, s.y);
            sp.alpha = 1;
          }
          nodes.snow.end();
        }

        function syncWater() {
          const top = state.seaLevel;
          const warmthVal = state.warmth;
          const wi = warmIdx(warmthVal);
          const t = state.time;
          const W = VIEW_W, H = VIEW_H;
          const scrollVal = camX;
          const qTop = Math.round(top);
          const wave = function (x) {
            const worldX = x + scrollVal;
            return top + (6 + warmthVal * 16) * Math.sin(worldX * 0.015 + t * (2.2 + warmthVal * 2.0)) + 3 * Math.cos(worldX * 0.04 - t * 3.5);
          };
          // body: gradient strip, clipped to the wave polygon
          const key = qTop + "|" + wi + "|" + rasterEpoch;
          if (key !== nodes.waterKey) {
            const old = nodes.waterTex;
            const o = bakeTex(4, 64, 1, function (g) {
              const grad = g.createLinearGradient(0, 0, 0, 64);
              grad.addColorStop(0, RAMP.water0[wi]);
              grad.addColorStop(1, RAMP.water1[wi]);
              g.fillStyle = grad;
              g.fillRect(0, 0, 4, 64);
            });
            nodes.waterTex = o;
            nodes.waterFill.texture = o.tex;
            nodes.waterFill.position.set(0, qTop - WATER_BAND_TOP);
            nodes.waterFill.width = W;
            nodes.waterFill.height = H - (qTop - WATER_BAND_TOP);
            nodes.waterKey = key;
            if (old) { tracked.delete(old.tex); try { old.tex.destroy(true); } catch (e) {} }
          }
          const pts = [];
          for (let x = 0; x <= W + 20; x += 15) pts.push(x, wave(x));
          const m = nodes.waterMask;
          m.clear();
          m.poly(pts.concat([W + 20, H + 4, 0, H + 4])).fill(0xffffff);

          const g = nodes.waterG;
          g.clear();
          for (let i = 0; i < pts.length; i += 2) {
            if (i === 0) g.moveTo(pts[0], pts[1]);
            else g.lineTo(pts[i], pts[i + 1]);
          }
          g.stroke({ width: 3.5, color: css(RAMP.foam[wi]).n, join: "miter" });

          for (const chunk of waterIceChunks) {
            const cx = ((((chunk.x - scrollVal) % (W + 200)) + (W + 200)) % (W + 200)) - 100;
            const wy = top + (6 + warmthVal * 16) * Math.sin((cx + scrollVal) * 0.015 + t * (2.2 + warmthVal * 2.0)) - 4 + Math.sin(t * 2.5 + chunk.wobble) * 3;
            g.poly([cx - chunk.w / 2, wy, cx - chunk.w / 4, wy - chunk.h, cx + chunk.w / 4, wy - chunk.h, cx + chunk.w / 2, wy])
              .fill({ color: 0xe6f8ff, alpha: 0.85 })
              .stroke({ width: 1.5, color: 0x64b4dc, alpha: 0.5 });
          }

          g.beginPath();
          const bAlpha = 0.5 - warmthVal * 0.35;
          for (let i = 0; i < waterBubbles.length; i++) {
            const b = waterBubbles[i];
            const bx = ((((b.x - scrollVal) % (W + 100)) + (W + 100)) % (W + 100)) - 50;
            const by = top + b.depth + Math.sin(t * b.speed * 0.05 + b.phase) * 6;
            g.circle(bx, by, b.size);
          }
          g.fill({ color: 0xa0d5ff, alpha: bAlpha });

          nodes.waterEmoji.begin();
          const sealX = ((((900 - scrollVal) % (W + 500)) + (W + 500)) % (W + 500)) - 100;
          const sealWaveY = top + (6 + warmthVal * 16) * Math.sin((sealX + scrollVal) * 0.015 + t * (2.2 + warmthVal * 2.0)) - 10;
          const put = function (glyph, size, px, py, rot, flip) {
            const s = nodes.waterEmoji.next();
            s.anchor.set(0.5, 0.5);
            fit(s, emojiT(glyph, size, true), flip || 1, 1);
            s.position.set(px, py);
            s.rotation = rot || 0;
            s.alpha = 1;
          };
          put("🦭", 26, sealX, sealWaveY + Math.sin(t * 1.8) * 4);
          const whaleCycle = t % 24;
          if (whaleCycle < 4.0) {
            const progress = whaleCycle / 4.0;
            const whaleX = ((((1400 - scrollVal) % (W + 600)) + (W + 600)) % (W + 600)) - 100;
            put("🐋", 36, whaleX, top - 10 - Math.sin(progress * Math.PI) * 45, progress * Math.PI - Math.PI / 2);
          }
          for (const f of waterFish) {
            const fx = ((((f.baseX + Math.sin(t * 0.5 + f.phase) * 110 - scrollVal) % (W + 200)) + (W + 200)) % (W + 200)) - 100;
            put("🐟", 15, fx, top + f.depth + Math.cos(t * 0.8 + f.phase) * 10, 0, f.dir);
          }
          nodes.waterEmoji.end();
        }

        // text / hint layer that stays a 2D overlay (same Canvas2D code as before)
        function syncOverlay() {
          const p = state.player;
          const nearValve = Math.hypot(p.x + p.w / 2 - state.valve.x, p.y + p.h / 2 - state.valve.y) < 78 && state.state === "playing";
          const coachOn = coach.active && state.state === "playing";
          if (!state.floatingTexts.length && !promptList.length && !nearValve && !coachOn) {
            nodes.overlay.hide();
            return;
          }
          const g = nodes.overlay.begin();
          withCtx(g, function () {
            ctx.save();
            ctx.translate(-camX, 0);
            drawFloatingTexts();
            for (const pr of promptList) GOGCoach.tag(ctx, pr.x, pr.y, "Tap GRAB / press E");
            ctx.restore();
            if (nearValve) {
              const bounce = Math.sin(state.time * 6) * 3;
              const sx = state.valve.x - camX;
              const sy = state.valve.y - 70 + bounce;
              ctx.fillStyle = "#FFF7E8";
              roundedRect(sx - 68, sy - 18, 136, 32, 8, true, false);
              ctx.strokeStyle = "#111";
              ctx.lineWidth = 3;
              roundedRect(sx - 68, sy - 18, 136, 32, 8, false, true);
              ctx.fillStyle = "#111";
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.font = "900 12px Arial";
              ctx.fillText("Tap SPIN / press E", sx, sy - 1);
            }
            drawCoachHints();
          });
        }

        function syncWipe() {
          if (!winWiping && !winWipeDone) {
            nodes.wipeDisc.visible = nodes.wipeRing.visible = false;
            return;
          }
          const r = winWipeDone ? winWipeMax : winWipeRadius;
          nodes.wipeDisc.visible = true;
          nodes.wipeDisc.alpha = 0.85;
          nodes.wipeDisc.width = nodes.wipeDisc.height = Math.max(2, r * 2);
          nodes.wipeRing.visible = winWiping;
          nodes.wipeRing.clear();
          if (winWiping) nodes.wipeRing.circle(VIEW_W / 2, VIEW_H / 2, r).stroke({ width: 6, color: 0x111111 });
        }

        function renderScene() {
          syncCamera();
          syncBackdrop();
          nodes.cam.x = -camX;
          syncFactory();
          syncHome();
          spawnHomeSparkles();
          syncValve();
          syncPlatforms();
          syncLift();
          syncChicks();
          syncPlayer();
          syncParticles();
          syncSnow();
          syncWater();
          syncOverlay();
          syncWipe();
          R.render();
        }
        function render() {
          if (!sceneReady) return;
          renderScene();
        }

        function setControl(name, isDown) {
          if (name === "left") input.left = isDown;
          if (name === "right") input.right = isDown;
          if (name === "slide") input.slide = isDown; // T049
          if (name === "jump") {
            if (isDown && !input.jump) input.jumpPressed = true;
            input.jump = isDown;
          }
          if (name === "action" && isDown) input.actionPressed = true;
        }

        window.addEventListener(
          "keydown",
          (e) => {
            const k = e.key.toLowerCase();
            if (
              [
                "arrowleft",
                "arrowright",
                "arrowup",
                "arrowdown",
                " ",
                "a",
                "d",
                "w",
                "s",
                "e",
              ].includes(k)
            )
              e.preventDefault();
            if (k === "arrowleft" || k === "a") input.left = true;
            if (k === "arrowright" || k === "d") input.right = true;
            if (k === "arrowdown" || k === "s") input.slide = true; // T049
            if ((k === "arrowup" || k === "w" || k === " ") && !input.jump) {
              input.jump = true;
              input.jumpPressed = true;
            }
            if (k === "e") input.actionPressed = true;
          },
          { passive: false },
        );

        window.addEventListener("keyup", (e) => {
          const k = e.key.toLowerCase();
          if (k === "arrowleft" || k === "a") input.left = false;
          if (k === "arrowright" || k === "d") input.right = false;
          if (k === "arrowdown" || k === "s") input.slide = false; // T049
          if (k === "arrowup" || k === "w" || k === " ") input.jump = false;
        });

        document.querySelectorAll("[data-control]").forEach((btn) => {
          const name = btn.getAttribute("data-control");
          const onDown = (e) => {
            e.preventDefault();
            setControl(name, true);
          };
          const onUp = (e) => {
            e.preventDefault();
            setControl(name, false);
          };
          btn.addEventListener("pointerdown", onDown);
          btn.addEventListener("pointerup", onUp);
          btn.addEventListener("pointercancel", onUp);
          btn.addEventListener("pointerleave", onUp);
        });

        // Main loop: GOGEngine.GameLoop (fixed 60 Hz steps) instead of this stage's own
        // requestAnimationFrame. update() keeps its "dt in seconds" meaning (dt = 1/60 s
        // per step), so every speed is unchanged at 60 fps; below 30 fps the world now
        // catches up (up to 5 steps per frame) instead of crawling in slow motion under
        // the old 0.033 s dt clamp. The loop draws after a step (or a resize), and it
        // stops requesting animation frames while the page is hidden.
        function step(dt) {
          // "How to play" / "Did you know?" pop-up open: freeze the world (and skip drawing).
          if (GOGUi.paused) return;

          // Update background clouds position
          for (const cloud of clouds) {
            cloud.x += cloud.speed * dt;
            if (cloud.x > VIEW_W + 120) {
              cloud.x = -120;
            }
          }

          if (gameRunning) {
            update(dt);
          } else {
            updatePenguinAnim(dt);
          }
        }

        const loop = new GOGEngine.GameLoop({
          update: step,
          draw: function () {
            if (!GOGUi.paused) render();
          },
        });

        if (ui.helpBtn) {
          // Replay the guided intro: a fresh run with the coach on.
          ui.helpBtn.addEventListener("click", function () {
            if (activeOverlay || !state || state.state !== "playing") return;
            resetGame();
            coach.start();
          });
        }

        state = createState();
        updateUI();
        // Pixi v8 needs WebGL; GOGRender explains on screen when it is missing and the stage then stays idle.
        GOGRender.create(canvas, VIEW_W, VIEW_H).then(
          function (r) {
            R = r;
            buildScene();
            renderScene();
            loop.start();
            showPennyIntroBeat();
          },
          function () {}
        );
      })();
    </script>
  </body>
</html>

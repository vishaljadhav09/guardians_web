        function triggerSeedReturnCutscene(onComplete) {
          const overlay = document.getElementById("cutscene");
          const treeIcon = document.getElementById("csTreeIcon");
          if (!overlay) {
            onComplete();
            return;
          }
          overlay.classList.add("show");
          if (treeIcon) {
            GOGUi.restartAnimation(treeIcon, "pulse");
          }
          GOGUi.say("A seed is heading home to the Tree… 🌱");

          function closeCutscene() {
            overlay.classList.remove("show");
            if (cutsceneTimer) clearTimeout(cutsceneTimer);
            onComplete();
          }

          const skipBtn = document.getElementById("csSkipBtn");
          if (skipBtn) {
            const newSkip = skipBtn.cloneNode(true);
            skipBtn.parentNode.replaceChild(newSkip, skipBtn);
            newSkip.addEventListener("click", closeCutscene);
          }

          cutsceneTimer = setTimeout(closeCutscene, 2200);
        }

        function resetGame() {
          state = createState();
          cameraX = 0;
          gameRunning = true;
          audio.playBgm();
          if (activeOverlay) {
            GOGUi.closeOverlay(activeOverlay);
            activeOverlay = null;
          }
        }

        function startGame() {
          resetGame();
        }

        // Set initial calm mode check in HUD on startup
        if (ui.calmBadge) {
          ui.calmBadge.textContent = calmMode
            ? "🧘 Calm mode: no sea level rise"
            : "";
        }

        function failGame(reason) {
          audio.stopBgm();
          state.state = "failed";
          gameRunning = false;
          audio.lose();
          if (ui.canvasFrame) {
            ui.canvasFrame.classList.add("flash-lose");
          }
          GOGUi.say("Penny splashed! Let's try again 💙");
          activeOverlay = GOGUi.showOverlay({
            title: "Take Another Glide",
            body:
              reason ||
              "The water got too cozy. Try again with quicker rescues and a timely valve spin.",
            primaryLabel: "Try Again",
            secondaryLabel: "Back to Map",
            onPrimary: function () {
              if (ui.canvasFrame) {
                ui.canvasFrame.classList.remove("flash-lose");
              }
              GOGUi.closeOverlay(activeOverlay);
              activeOverlay = null;
              resetGame();
            },
            onSecondary: function () {
              window.location.href = "../index.html";
            },
          });
        }

        function winGame() {
          audio.stopBgm();
          state.state = "won";
          state.endTimer = 0;
          audio.win();
        }

        let pendingStars = 1;

        function finishWinIce() {
          gameRunning = false;

          const nextSave = GOGSave.recordStageClear(STAGE_ID, {
            stars: pendingStars,
            sprouts: 15,
            smogDrop: 10,
          });
          save = nextSave;

          if (ui.canvasFrame) {
            ui.canvasFrame.classList.add("flash-win");
          }

          GOGUi.say("You did it! A seed is heading home to the Tree… 🌱");

          let confettiBursts = 0;
          const confettiInterval = setInterval(function () {
            GOGUi.confettiAt(
              window.innerWidth / 2,
              window.innerHeight / 2,
              16,
            );
            confettiBursts++;
            if (confettiBursts >= 3) clearInterval(confettiInterval);
          }, 220);

          setTimeout(function () {
            triggerSeedReturnCutscene(function () {
              activeOverlay = GOGUi.showOverlay({
                accent: "var(--gog-white)",
                title: "❄️ Polar Ice Restored!",
                body: "Penny wakes completely as the sea calms and the ice reforms.",
                stars: pendingStars,
                factText: stageMeta.fact,
                primaryLabel: "Back to Map",
                secondaryLabel: "Play Again",
                onPrimary: function () {
                  window.location.href = "../index.html";
                },
                onSecondary: function () {
                  window.location.reload();
                },
              });
            });
          }, 750);
        }

        function update(dt) {
          if (!state || state.state === "failed") return;

          state.time += dt;
          updatePenguinAnim(dt);
          const p = state.player;
          const wasOnGround = p.onGround;

          // Update snowfall particles (screen-relative)
          for (const s of snowfallParticles) {
            s.y += s.speedY * dt;
            s.x += s.speedX * dt;
            if (s.y > canvas.height) {
              s.y = -10;
              s.x = Math.random() * canvas.width;
            }
            if (s.x < -10) {
              s.x = canvas.width + 10;
              s.y = Math.random() * canvas.height;
            }
          }

          if (state.state === "won") {
            state.endTimer += dt;
            
            // Phase 1 (0s to 1.5s): Recede sea level, freeze valve, blow wind
            if (state.endTimer <= 1.5) {
              state.seaLevel = Math.min(560, state.seaLevel + 120 * dt);
              state.warmth = Math.max(0, state.warmth - 0.7 * dt);
              state.valve.frozen = true;
              
              if (Math.random() < 0.15) {
                state.particles.push({
                  x: canvas.width + Math.random() * 200,
                  y: 100 + Math.random() * 400,
                  vx: -350 - Math.random() * 200,
                  vy: (Math.random() - 0.5) * 10,
                  life: 2.0,
                  maxLife: 2.0,
                  kind: "wind",
                  color: "rgba(200, 245, 255, 0.55)",
                  size: 60 + Math.random() * 60,
                });
              }
            }
            // Phase 2 (1.5s to 3.5s): Reform ice platforms
            else if (state.endTimer <= 3.5) {
              for (const pl of state.meltPlatforms) {
                pl.gone = false;
                pl.shrink = Math.max(0, pl.shrink - 180 * dt);
                pl.w = pl.baseW - pl.shrink;
                pl.y = pl.baseY || pl.y;
              }
            }
            // Phase 3 (3.5s to 5.5s): Sparkles and dance
            else if (state.endTimer <= 5.5) {
              if (Math.random() < 0.25) {
                state.particles.push({
                  x: state.stableBase.x + Math.random() * state.stableBase.w,
                  y: state.stableBase.y - 30 - Math.random() * 40,
                  vx: (Math.random() - 0.5) * 15,
                  vy: -15 - Math.random() * 20,
                  life: 1.0,
                  maxLife: 1.0,
                  kind: "emoji",
                  text: "✨",
                  size: 12,
                });
              }
            }

            p.vx *= 0.92;
            p.vy += p.gravity * dt * 0.25;
            movePlayer(p, dt, true);

            if (state.endTimer > 5.5 && !winWiping && !winWipeDone) {
              let stars = 1;
              if (!calmMode) {
                if (state.warmth <= 0.25) stars = 3;
                else if (state.warmth <= 0.6) stars = 2;
              }
              pendingStars = stars;
              audio.win();
              winWipeRadius = 0;
              winWiping = true;
            }
            if (winWiping) {
              winWipeRadius += dt * winWipeMax * 1.6;
              if (winWipeRadius >= winWipeMax) {
                winWiping = false;
                winWipeDone = true;
                finishWinIce();
              }
            }
            updateUI();
            updateParticles(dt);
            updateFloatingTexts(dt);
            return;
          }

          // Game loop countdown
          state.timeLeft = Math.max(0, state.timeLeft - dt);
          if (state.timeLeft <= 0) {
            failGame("Time is up! Try to rescue the chicks faster next time.");
            return;
          }

          const warmingRate = calmMode
            ? 0
            : state.coolingTimer > 0
              ? 0.005
              : 0.012;
          state.warmth = clamp(state.warmth + warmingRate * dt, 0, 1);
          if (state.coolingTimer > 0) {
            state.coolingTimer = Math.max(0, state.coolingTimer - dt);
            state.valve.activeFlash = Math.max(
              0,
              state.valve.activeFlash - dt * 1.7,
            );
          }
          state.valve.pulse += dt;

          const seaRise = calmMode ? 0 : 1.5 + state.warmth * 5;
          state.seaLevel = clamp(state.seaLevel - seaRise * dt, 368, 560);

          // Update fish jump timer
          if (state.fishJumpTimer > 0) {
            state.fishJumpTimer -= dt;
          }

          // Check if standing on melting ice to apply slippage
          let onIce = false;
          const solids = getSolids();
          const under = solids.find(
            (s) =>
              p.x + p.w > s.x &&
              p.x < s.x + s.w &&
              Math.abs(p.y + p.h - s.y) < 4,
          );
          if (under && under.drift !== undefined) {
            onIce = true;
          }

          const accel = p.speed * dt;
          if (input.left) {
            p.vx -= accel;
            p.facing = -1;
          }
          if (input.right) {
            p.vx += accel;
            p.facing = 1;
          }
          if (!input.left && !input.right) {
            const currentDrag = onIce ? 0.94 : p.drag;
            p.vx *= Math.pow(currentDrag, dt * 60);
            if (Math.abs(p.vx) < 3) p.vx = 0;
          }
          p.vx = clamp(p.vx, -p.maxSpeed, p.maxSpeed);

          if (input.jumpPressed && p.onGround) {
            p.vy = -p.jumpPower;
            p.onGround = false;
            audio.blip(320, 60);
            spawnBurst(p.x + p.w / 2, p.y + p.h, 8, "#8FD3FF");
          }
          input.jumpPressed = false;

          p.vy += p.gravity * dt;

          updatePlatforms(dt);
          movePlayer(p, dt, false);
          updateChicks(dt);
          updateValve(dt);
          updateParticles(dt);
          updateFloatingTexts(dt);
          updateCamera(dt);
          updateUI();

          // Spawning footprints when running on ice
          if (p.onGround && Math.abs(p.vx) > 30 && onIce) {
            if (!p.stepTimer) p.stepTimer = 0;
            p.stepTimer -= dt;
            if (p.stepTimer <= 0) {
              p.stepTimer = 0.22;
              state.particles.push({
                x: p.x + p.w / 2 + (p.facing === 1 ? -12 : 6),
                y: p.y + p.h - 2,
                vx: 0,
                vy: 0,
                life: 1.5,
                maxLife: 1.5,
                kind: "footprint",
                color: "rgba(100, 150, 200, 0.45)",
              });
            }
          }

          // Handle landing footprints & snow puff
          if (p.onGround && !wasOnGround) {
            spawnBurst(p.x + p.w / 2, p.y + p.h, 6, "#E4F7FF");
            if (onIce) {
              state.particles.push({
                x: p.x + p.w / 2 - 8,
                y: p.y + p.h - 2,
                vx: 0,
                vy: 0,
                life: 2.0,
                maxLife: 2.0,
                kind: "footprint",
                color: "rgba(100, 150, 200, 0.5)",
              });
              state.particles.push({
                x: p.x + p.w / 2 + 2,
                y: p.y + p.h - 2,
                vx: 0,
                vy: 0,
                life: 2.0,
                maxLife: 2.0,
                kind: "footprint",
                color: "rgba(100, 150, 200, 0.5)",
              });
            }
          }

          // Spawning carried chick emojis (hearts/sparkles)
          if (p.carrying && p.carrying.length > 0) {
            if (!p.carryHeartTimer) p.carryHeartTimer = 0;
            p.carryHeartTimer -= dt;
            if (p.carryHeartTimer <= 0) {
              p.carryHeartTimer = 0.5;
              state.particles.push({
                x: p.x + p.w / 2 + p.facing * 16 + (Math.random() - 0.5) * 10,
                y: p.y + p.h - 55,
                vx: (Math.random() - 0.5) * 15,
                vy: -35 - Math.random() * 20,
                life: 1.0,
                maxLife: 1.0,
                kind: "emoji",
                text: Math.random() < 0.65 ? "❤️" : "✨",
                size: 13,
              });
            }
          }

          const inWater = p.y + p.h >= state.seaLevel;
          const onSolid = p.onGround;
          const deeplySubmerged = inWater && state.seaLevel < p.y + p.h - 16;
          if (p.y > WORLD_H + 120 || (inWater && !onSolid) || deeplySubmerged) {
            failGame(
              "Penny splashed into the rising water. Try a faster route and cool the valve sooner.",
            );
            return;
          }
        }

        const AMBIENT_PARTICLE_CAP = 40;

        function updatePlatforms(dt) {
          const p = state.player;
          p.onCriticalIce = false;
          for (const pl of state.meltPlatforms) {
            if (pl.glowTimer > 0) pl.glowTimer -= dt;
            if (pl.baseY === undefined) pl.baseY = pl.y;

            if (pl.gone) {
              pl.refreezeTimer = (pl.refreezeTimer || 0) + dt;
              if (pl.refreezeTimer > 4.0) {
                pl.gone = false;
                pl.shrink = 0;
                pl.w = pl.baseW;
                pl.y = pl.baseY;
                pl.refreezeTimer = 0;
                pl.cachedCrackStage = -1;
                spawnBurst(pl.x + pl.baseW / 2, pl.y + 6, 8, "#A0E0FF");
              }
              continue;
            }

            if (pl.meltingState === "sinking") {
              pl.sinkTimer -= dt;
              pl.y += 45 * dt;
              
              if (Math.random() < 0.25) {
                state.particles.push({
                  x: pl.x + Math.random() * pl.w,
                  y: pl.y + pl.h,
                  vx: 0,
                  vy: 35,
                  life: 0.5,
                  maxLife: 0.5,
                  color: "#6FB6E8",
                  size: 3,
                  kind: "drip",
                });
              }
              
              if (pl.sinkTimer <= 0) {
                pl.gone = true;
                pl.meltingState = null;
                pl.meltStage = 0;
                state.meltedCount += 1;
                spawnBurst(pl.x + pl.w / 2, state.seaLevel, 16, "#E4F7FF");
                audio.blip(100, 160);
              }
              continue;
            }

            pl.t = (pl.t || 0) + dt;
            pl.y += Math.sin(state.time * 0.55 + pl.phase) * 4 * dt;
            
            const meltRatioNow = 1 - pl.w / pl.baseW;
            pl.rot =
              Math.sin(state.time * 0.4 + pl.phase) *
              0.045 *
              (1 + meltRatioNow);

            const topBand = {
              x: pl.x + pl.shrink * 0.5,
              y: pl.y,
              w: pl.baseW - pl.shrink,
              h: pl.h,
            };

            const standing =
              p.onGround &&
              p.vy >= -10 &&
              p.x + p.w > topBand.x + 8 &&
              p.x < topBand.x + topBand.w - 8 &&
              Math.abs(p.y + p.h - topBand.y) < 8;
            const meltRate = calmMode
              ? standing
                ? 1
                : 0
              : 0.1 +
                state.warmth * 0.4 +
                (standing ? 3 + state.warmth * 5 : 0);
            pl.shrink += meltRate * dt;
            pl.w = Math.max(48, pl.baseW - pl.shrink);

            const meltRatio = 1 - pl.w / pl.baseW;
            if (standing && meltRatio > 0.55) p.onCriticalIce = true;

            const stage =
              meltRatio < 0.15
                ? 1
                : meltRatio < 0.35
                  ? 2
                  : meltRatio < 0.52
                    ? 3
                    : meltRatio < 0.68
                      ? 4
                      : 5;
            if (stage > (pl.meltStage || 0)) {
              pl.meltStage = stage;
              if (stage >= 2) audio.blip(200 - stage * 12, 70);
              if (stage === 4) {
                for (let k = 0; k < 6; k++) {
                  state.particles.push({
                    x: pl.x + Math.random() * pl.w,
                    y: pl.y + 4,
                    vx: (Math.random() - 0.5) * 30,
                    vy: -10 - Math.random() * 20,
                    life: 0.9,
                    maxLife: 0.9,
                    color: "#DDF6FF",
                    size: 4 + Math.random() * 4,
                  });
                }
              }
            }

            if (state.particles.length < AMBIENT_PARTICLE_CAP) {
              pl.snowTimer -= dt;
              if (pl.snowTimer <= 0) {
                pl.snowTimer = 1.4 + Math.random() * 1.2;
                state.particles.push({
                  x: pl.x + Math.random() * pl.w,
                  y: pl.y + 4,
                  vx: (Math.random() - 0.5) * 10,
                  vy: 6 + Math.random() * 8,
                  life: 1.2,
                  maxLife: 1.2,
                  color: "#ffffff",
                  size: 2 + Math.random() * 2,
                  kind: "snow",
                });
              }
              pl.dripTimer -= dt * (1 + meltRatio * 2);
              if (pl.dripTimer <= 0 && meltRatio > 0.25) {
                pl.dripTimer = 0.9 + Math.random() * 0.7;
                state.particles.push({
                  x: pl.x + pl.w * 0.5 + (Math.random() - 0.5) * pl.w * 0.6,
                  y: pl.y + pl.h,
                  vx: 0,
                  vy: 30,
                  life: 0.5,
                  maxLife: 0.5,
                  color: "#6FB6E8",
                  size: 3,
                  kind: "drip",
                });
              }
            }

            if (pl.shrink > pl.baseW - 42) {
              pl.meltingState = "sinking";
              pl.sinkTimer = 1.0;
              if (standing) {
                p.onGround = false;
              }
            }
          }
        }

        function movePlayer(p, dt, soft) {
          const prevBottom = p.y + p.h;

          p.x += p.vx * dt;
          p.x = clamp(p.x, 0, WORLD_W - p.w);

          p.y += p.vy * dt;
          p.onGround = false;

          const solids = getSolids();
          for (const s of solids) {
            if (!rectsOverlap(p, s)) continue;
            if (p.vy >= 0 && prevBottom <= s.y + 6) {
              p.y = s.y - p.h;
              p.vy = 0;
              p.onGround = true;
            }
          }

          if (p.onGround && !soft) {
            const under = solids.find(
              (s) =>
                p.x + p.w > s.x &&
                p.x < s.x + s.w &&
                Math.abs(p.y + p.h - s.y) < 4,
            );
            if (under && under.drift) {
              p.x += under.drift * dt;
            }
          }
        }

        function getSolids() {
          const solids = [
            {
              x: state.stableBase.x,
              y: state.stableBase.y,
              w: state.stableBase.w,
              h: state.stableBase.h,
            },
            {
              x: state.valvePlatform.x,
              y: state.valvePlatform.y,
              w: state.valvePlatform.w,
              h: state.valvePlatform.h,
              stable: true,
            },
          ];
          for (const pl of state.meltPlatforms) {
            if (pl.gone) continue;
            const drift = Math.cos(state.time * 0.55 + pl.phase) * pl.drift;
            solids.push({
              x: pl.x + pl.shrink * 0.5,
              y: pl.y,
              w: pl.w,
              h: pl.h,
              drift,
            });
          }
          return solids;
        }

        function getMaxCarryingCapacity() {
          if (!state || !state.chicks) return 1;
          const deliveredCount = state.chicks.filter((c) => c.delivered).length;
          if (deliveredCount === 0) return 1;
          if (deliveredCount === 1) return 2;
          return 3;
        }

        function updateChicks(dt) {
          const p = state.player;
          for (const chick of state.chicks) {
            chick.bob += dt * 3;
            if (chick.delivered) continue;

            const carryIndex = p.carrying.indexOf(chick);
            if (carryIndex !== -1) {
              const sheet = getActiveSpriteSheet();
              const destW = 72;
              const destH = sheet && sheet.loaded ? (sheet.frameH / sheet.frameW) * destW : 108;
              // Stagger offsets for multiple carried chicks:
              const baseOffsetX = -14 * p.facing;
              const offsetX = baseOffsetX - p.facing * carryIndex * 4;
              const offsetY = -destH * 0.65 - carryIndex * 12;
              
              chick.x = p.x + p.w / 2 + offsetX - 9;
              chick.y = p.y + p.h + offsetY - 18;
              const homeZone = {
                x: state.stableBase.x,
                y: state.stableBase.y - 100,
                w: state.stableBase.w,
                h: 200,
              };
              if (rectsOverlap(p, homeZone) && p.onGround) {
                chick.delivered = true;
                chick.rescued = true;
                p.carrying = p.carrying.filter((c) => c !== chick);
                state.rescuedCount += 1;
                audio.heal();
                spawnBurst(chick.x, chick.y, 14, "#FFD84D");
                spawnFloatText(chick.x, chick.y - 12, "Safe! +1 💚", "#3aa655");
                if (state.rescuedCount >= TARGET_RESCUES) {
                  winGame();
                }
              }
              continue;
            }

            // If not carried, make it slide back and forth with the platform or fall if gone
            if (!chick.rescued && chick.platformIndex !== undefined) {
              const pl = state.meltPlatforms[chick.platformIndex];
              if (pl) {
                if (!pl.gone) {
                  const drift = Math.cos(state.time * 0.55 + pl.phase) * pl.drift;
                  chick.x = chick.baseX + drift;
                } else {
                  // Platform has melted! Apply gravity to make the chick fall
                  chick.vy = (chick.vy || 0) + 1450 * dt;
                  chick.y += chick.vy * dt;
                }
              }
            }

            const chickRect = { x: chick.x, y: chick.y, w: 18, h: 18 };
            const nearChick = rectsOverlap(p, chickRect);
            if (!chick.rescued && nearChick) {
              const maxCarry = getMaxCarryingCapacity();
              if (p.carrying.length >= maxCarry) {
                continue;
              }
              if (input.actionPressed) {
                chick.rescued = true;
                p.carrying.push(chick);
                audio.collect();
                spawnBurst(chick.x, chick.y, 10, "#FFE680");
                spawnFloatText(chick.x, chick.y - 12, "Got one! 🐥", "#2e5ee8");
                input.actionPressed = false;
              }
            }

            if (chick.y + 18 >= state.seaLevel) {
              const homeRestock = state.chicks.find(
                (c) => !c.rescued && !c.delivered && c !== chick,
              );
              if (
                !homeRestock &&
                !chick.delivered &&
                !p.carrying.includes(chick)
              ) {
                failGame(
                  "A chick slipped into the water. Try shorter rescue routes and keep the floes from vanishing under you.",
                );
                return;
              }
            }
          }
        }

        function updateValve(dt) {
          const p = state.player;
          const dx = p.x + p.w / 2 - state.valve.x;
          const dy = p.y + p.h / 2 - state.valve.y;
          const near = Math.hypot(dx, dy) < 78;
          if (near && input.actionPressed) {
            state.warmth = Math.max(0, state.warmth - state.valve.coolAmount);
            state.coolingTimer = 8;
            state.valve.activeFlash = 1.0;
            audio.blip(520, 150);
            
            // Spawn dramatic snow sparks at the valve
            spawnBurst(state.valve.x, state.valve.y, 24, "#87E1FF");
            
            // Spawn wind streaks sweeping across the screen
            for (let k = 0; k < 12; k++) {
              state.particles.push({
                x: canvas.width + Math.random() * 200,
                y: 50 + Math.random() * 450,
                vx: -300 - Math.random() * 250,
                vy: (Math.random() - 0.5) * 15,
                life: 2.2,
                maxLife: 2.2,
                kind: "wind",
                color: "rgba(180, 242, 255, 0.55)",
                size: 50 + Math.random() * 70
              });
            }

            // Heal ice platforms slightly
            for (const pl of state.meltPlatforms) {
              if (!pl.gone) {
                pl.shrink = Math.max(0, pl.shrink - pl.baseW * 0.25);
                pl.w = pl.baseW - pl.shrink;
                pl.glowTimer = 1.5;
                
                // Spawn healing particles rising from the platform
                for (let k = 0; k < 5; k++) {
                  state.particles.push({
                    x: pl.x + Math.random() * pl.w,
                    y: pl.y + 4,
                    vx: (Math.random() - 0.5) * 16,
                    vy: -15 - Math.random() * 15,
                    life: 0.7,
                    maxLife: 0.7,
                    color: "#80F5FF",
                    size: 2 + Math.random() * 2,
                    kind: "snow"
                  });
                }
              }
            }
          }
          input.actionPressed = false;
        }

        function updateParticles(dt) {
          for (let i = state.particles.length - 1; i >= 0; i--) {
            const pt = state.particles[i];
            pt.life -= dt;
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            pt.vy += (pt.kind === "snow" ? 25 : 180) * dt;
            if (pt.life <= 0) state.particles.splice(i, 1);
          }
        }

        function updateCamera(dt) {
          const target = clamp(state.player.x - 240, 0, WORLD_W - canvas.width);
          cameraX += (target - cameraX) * Math.min(1, CAMERA_LERP * dt * 60);
        }

        function warmthGradient(w) {
          if (w < 0.4) return "linear-gradient(90deg, #3dd6c0, #2e5ee8)"; // cool & safe
          if (w < 0.7) return "linear-gradient(90deg, #ffd23f, #ff8c42)"; // caution
          return "linear-gradient(90deg, #ff8c42, #ef4444)"; // danger
        }

        function updateUI() {
          if (ui.warmFill) {
            ui.warmFill.style.width = (state.warmth * 100).toFixed(0) + "%";
            ui.warmFill.style.background = warmthGradient(state.warmth);
          }
          if (ui.canvasFrame) {
            ui.canvasFrame.classList.toggle(
              "warmth-danger",
              state.warmth >= 0.7 && state.state === "playing",
            );
          }
          if (ui.warmthText)
            ui.warmthText.textContent = (state.warmth * 100).toFixed(0) + "%";
          if (ui.warmthLabel) {
            let labelText = "WARMTH ";
            if (state.warmth <= 0.2) labelText += "❄️❄️❄️❄️❄️";
            else if (state.warmth <= 0.4) labelText += "❄️❄️❄️❄️";
            else if (state.warmth <= 0.6) labelText += "❄️❄️❄️";
            else if (state.warmth <= 0.8) labelText += "❄️❄️";
            else if (state.warmth <= 0.9) labelText += "❄️";
            else labelText += "🔥🔥🔥🔥🔥";
            ui.warmthLabel.textContent = labelText;
          }
          if (ui.rescuedText)
            ui.rescuedText.textContent =
              "🐥 " + state.rescuedCount + " / " + TARGET_RESCUES + " rescued";
          if (ui.timerText) {
            ui.timerText.textContent = Math.ceil(state.timeLeft) + "s";
            if (state.timeLeft <= 10) {
              ui.timerText.classList.add("timer-urgent");
            } else {
              ui.timerText.classList.remove("timer-urgent");
            }
          }
          if (ui.iceText)
            ui.iceText.textContent =
              "🧊 " +
              state.meltPlatforms.filter((pl) => !pl.gone).length +
              " floes left";
          const seaPct = Math.round(((560 - state.seaLevel) / 140) * 100);
          if (ui.seaText)
            ui.seaText.textContent = "🌊 Sea " + Math.max(0, seaPct) + "%";
        }

        function spawnBurst(x, y, count, color) {
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 40 + Math.random() * 130;
            state.particles.push({
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 30,
              life: 0.4 + Math.random() * 0.45,
              color,
              size: 4 + Math.random() * 5,
            });
          }
        }

        // Floating reward-text pop-ups — short, bouncy, high-contrast
        // confirmation text ("Got one! 🐥") at the exact moment something
        // good happens, so the stage's message is felt instantly instead
        // of only showing up later as a HUD chip number.
        function spawnFloatText(x, y, text, color) {
          state.floatingTexts.push({
            x,
            y,
            text,
            color: color || "#241c30",
            life: 1.1,
            maxLife: 1.1,
          });
        }

        function updateFloatingTexts(dt) {
          for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
            const t = state.floatingTexts[i];
            t.life -= dt;
            t.y -= 34 * dt;
            if (t.life <= 0) state.floatingTexts.splice(i, 1);
          }
        }

        function drawFloatingTexts() {
          if (!state.floatingTexts.length) return;
          ctx.save();
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = "800 18px 'Baloo 2', Arial, sans-serif";
          ctx.lineJoin = "round";
          for (const t of state.floatingTexts) {
            const p = Math.max(0, t.life / t.maxLife);
            const bounce = 1 + Math.sin(p * Math.PI) * 0.15;
            ctx.save();
            ctx.globalAlpha = p;
            ctx.translate(t.x, t.y);
            ctx.scale(bounce, bounce);
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#241c30";
            ctx.fillStyle = t.color;
            ctx.strokeText(t.text, 0, 0);
            ctx.fillText(t.text, 0, 0);
            ctx.restore();
          }
          ctx.restore();
        }

        function drawSnowfall() {
          ctx.save();
          ctx.fillStyle = "#ffffff";
          for (const s of snowfallParticles) {
            circle(s.x, s.y, s.size, true);
          }
          ctx.restore();
        }

        function render() {
          if (!state) {
            drawIdleScene();
            return;
          }

          ctx.clearRect(0, 0, canvas.width, canvas.height);
          drawBackground();
          ctx.save();
          ctx.translate(-cameraX, 0);
          drawSmogFactory();
          drawHomeBase();
          drawValvePlatform();
          drawPlatforms();
          drawChicks();
          drawPlayer();
          drawParticles();
          drawFloatingTexts();
          ctx.restore();
          drawSnowfall();
          drawWater();
          drawWorldHud();
          drawWinWipe();
        }

        function drawWinWipe() {
          if (!winWiping && !winWipeDone) return;
          const r = winWipeDone ? winWipeMax : winWipeRadius;
          const cx = canvas.width / 2;
          const cy = canvas.height / 2;
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.clip();
          const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r || 1);
          grad.addColorStop(0, "#FFFFFF");
          grad.addColorStop(0.55, "#B9E3FF");
          grad.addColorStop(1, "#2C4BFF");
          ctx.globalAlpha = 0.85;
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.restore();

          if (winWiping) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#111";
            ctx.stroke();
            ctx.restore();
          }
        }

        function drawIdleScene() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          drawBackground();
          ctx.save();
          drawWater();
          ctx.restore();
        }

        function lerpColor(c1, c2, pct) {
          const parseHex = (hex) => {
            const h = hex.replace("#", "");
            if (h.length === 3) {
              return [
                parseInt(h[0] + h[0], 16),
                parseInt(h[1] + h[1], 16),
                parseInt(h[2] + h[2], 16),
              ];
            }
            return [
              parseInt(h.substring(0, 2), 16),
              parseInt(h.substring(2, 4), 16),
              parseInt(h.substring(4, 6), 16),
            ];
          };
          const rgb1 = parseHex(c1);
          const rgb2 = parseHex(c2);
          const r = Math.round(rgb1[0] + (rgb2[0] - rgb1[0]) * pct);
          const g = Math.round(rgb1[1] + (rgb2[1] - rgb1[1]) * pct);
          const b = Math.round(rgb1[2] + (rgb2[2] - rgb1[2]) * pct);
          return `rgb(${r}, ${g}, ${b})`;
        }

        function drawBackground() {
          const W = canvas.width;
          const H = canvas.height;
          const warmthVal = state ? state.warmth : 0.0;
          const timeVal = state ? state.time : Date.now() * 0.001;
          const scrollVal = gameRunning ? cameraX : (state ? cameraX + state.time * 25 : Date.now() * 0.025);

          // 1. Sky Gradient
          const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
          const skyColor1 = lerpColor("#0A1C40", "#4B286C", warmthVal);
          const skyColor2 = lerpColor("#1C3A73", "#D27D2D", warmthVal);
          skyGrad.addColorStop(0, skyColor1);
          skyGrad.addColorStop(1, skyColor2);
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, W, H);

          // 2. Aurora Borealis (Layer 1)
          ctx.save();
          ctx.globalAlpha = 0.15 + (1 - warmthVal) * 0.25;
          const aurColor = (state && state.state === "won") ? "rgba(0, 255, 127, 0.4)" : "rgba(80, 240, 210, 0.25)";
          ctx.fillStyle = aurColor;
          for (let j = 0; j < 2; j++) {
            ctx.beginPath();
            ctx.moveTo(0, 60 + j * 30);
            for (let x = 0; x <= W + 20; x += 20) {
              const y = 60 + j * 30 + Math.sin(timeVal * 1.0 + x * 0.004 + j * 1.5) * 22 * Math.cos(timeVal * 0.35 + x * 0.002);
              ctx.lineTo(x, y);
            }
            ctx.lineTo(W, 0);
            ctx.lineTo(0, 0);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();

          // 3. Preloaded Background images
          // 3. Preloaded Background images
          bgLayers.forEach(layer => {
            const img = layer.img;
            if (!img.complete || img.naturalWidth === 0) return;
            const scale = H / img.naturalHeight;
            const tileW = img.naturalWidth * scale;
            let x = -(scrollVal * layer.speed) % tileW;
            if (x > 0) x -= tileW;
            ctx.save();
            ctx.globalAlpha = 0.85; // Increased opacity for rich background display
            for (let dx = x; dx < W; dx += tileW) {
              ctx.drawImage(img, dx, 0, tileW, H);
            }
            ctx.restore();
          });
        }

        function drawSmogFactory() {
          const x = 1720;
          const y = 150;

          // Body — a grimy rust-brown instead of candy pink, so the
          // building itself reads as "dirty machine", not a playhouse.
          ctx.fillStyle = "#8a7362";
          roundedRect(x, y + 120, 160, 130, 10, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(x, y + 120, 160, 130, 10, false, true);

          // Smokestacks — darker charcoal-grey, with a thin black/amber
          // hazard-stripe ring near the top of each. Same danger motif as
          // the Smog cloud in Stage 2, so kids read "this = bad" using one
          // shared visual language across the whole game.
          ctx.fillStyle = "#565a60";
          roundedRect(x + 24, y + 30, 42, 100, 8, true, false);
          roundedRect(x + 88, y, 42, 130, 8, true, false);
          ctx.strokeStyle = "#111";
          roundedRect(x + 24, y + 30, 42, 100, 8, false, true);
          roundedRect(x + 88, y, 42, 130, 8, false, true);

          ctx.save();
          ctx.strokeStyle = "#ffb020";
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(x + 24, y + 46);
          ctx.lineTo(x + 66, y + 46);
          ctx.moveTo(x + 88, y + 16);
          ctx.lineTo(x + 130, y + 16);
          ctx.stroke();
          ctx.restore();

          // A simple grumpy face on the body — no text required, kids
          // read "this place is unhappy/bad" at a glance, still soft
          // cartoon, never scary (per brand).
          ctx.fillStyle = "#241c30";
          circle(x + 55, y + 175, 7, true);
          circle(x + 105, y + 175, 7, true);
          ctx.save();
          ctx.strokeStyle = "#241c30";
          ctx.lineWidth = 5;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.arc(x + 80, y + 210, 22, Math.PI * 1.1, Math.PI * 1.9);
          ctx.stroke();
          ctx.restore();

          // Smoke — sooty grey-brown with a sickly khaki tint, the same
          // palette family as the Smog itself, so factory smoke and the
          // Smog register as the same danger on sight.
          const smokePuffs = 3 + Math.floor(state.warmth * 5);
          for (let i = 0; i < smokePuffs; i++) {
            const sx = x + 46 + i * 20 + Math.sin(state.time * 1.4 + i) * 10;
            const sy =
              y + 20 - i * 10 - Math.cos(state.time * 1.5 + i * 0.5) * 8;
            ctx.globalAlpha = 0.2 + state.warmth * 0.25;
            ctx.fillStyle =
              i % 2 === 0 ? "rgba(70, 65, 55, 1)" : "rgba(150, 140, 108, 1)";
            circle(sx, sy, 18 + i * 3, true);
            ctx.globalAlpha = 1;
          }
        }

        function drawHomeBase() {
          const b = state.stableBase;
          
          // 1. Warm cozy sun glow halo over the safe iceberg
          ctx.save();
          const safeGrad = ctx.createRadialGradient(b.x + b.w/2, b.y - 10, 10, b.x + b.w/2, b.y - 10, 150);
          safeGrad.addColorStop(0, "rgba(255, 226, 110, 0.32)");
          safeGrad.addColorStop(0.5, "rgba(255, 185, 90, 0.12)");
          safeGrad.addColorStop(1, "rgba(255, 255, 255, 0)");
          ctx.fillStyle = safeGrad;
          ctx.beginPath();
          ctx.arc(b.x + b.w/2, b.y - 10, 150, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // 2. Draw main safe base platform (3D block)
          ctx.save();
          const ibGrad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
          ibGrad.addColorStop(0, "#DDF5FF");
          ibGrad.addColorStop(0.3, "#A8DAF0");
          ibGrad.addColorStop(1, "#2C5E7A");
          
          ctx.fillStyle = ibGrad;
          roundedRect(b.x, b.y, b.w, b.h, 20, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(b.x, b.y, b.w, b.h, 20, false, true);

          // Crevice texture lines on the front face
          ctx.strokeStyle = "rgba(40, 110, 150, 0.4)";
          ctx.lineWidth = 3.5;
          for (let offset = 40; offset < b.w; offset += 55) {
            ctx.beginPath();
            ctx.moveTo(b.x + offset, b.y + 15);
            ctx.lineTo(b.x + offset + (offset % 12 - 6), b.y + b.h - 10);
            ctx.stroke();
          }
          ctx.restore();

          ctx.fillStyle = "#7CE6A6";
          roundedRect(b.x, b.y, b.w, 14, 7, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 3;
          roundedRect(b.x, b.y, b.w, 14, 7, false, true);

          ctx.fillStyle = "#241c30";
          circle(b.x + b.w * 0.32, b.y + b.h * 0.42, 6, true);
          circle(b.x + b.w * 0.5, b.y + b.h * 0.42, 6, true);
          ctx.save();
          ctx.strokeStyle = "#241c30";
          ctx.lineWidth = 4;
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.arc(
            b.x + b.w * 0.41,
            b.y + b.h * 0.55,
            16,
            Math.PI * 0.1,
            Math.PI * 0.9,
          );
          ctx.stroke();
          ctx.restore();

          // 3. Draw Parent Penguins
          // Dad: waddles slightly
          const dadWaddle = Math.sin(state.time * 2.5) * 3;
          const dadX = b.x + b.w * 0.72;
          const dadY = b.y;
          ctx.save();
          ctx.translate(dadX, dadY + Math.abs(dadWaddle));
          ctx.rotate(dadWaddle * 0.05);
          if (spriteSheets.idle.loaded) {
            const frame = Math.floor(state.time * 1.5) % 2; // alternates standing/smiling
            const col = frame % spriteSheets.idle.cols;
            const sx = col * spriteSheets.idle.frameW;
            const sy = 0;
            const destW = 44; // Larger Dad
            const destH = (spriteSheets.idle.frameH / spriteSheets.idle.frameW) * destW;
            ctx.drawImage(
              spriteSheets.idle.img,
              sx,
              sy,
              spriteSheets.idle.frameW,
              spriteSheets.idle.frameH,
              -destW / 2,
              -destH,
              destW,
              destH,
            );
          } else {
            drawEmoji("🐧", 0, -18, 42); // Fallback Larger Dad
          }
          ctx.restore();

          // Mom: waves happily
          const momWave = Math.sin(state.time * 4.5) * 4;
          const momX = b.x + b.w * 0.85;
          const momY = b.y;
          ctx.save();
          ctx.translate(momX, momY + Math.abs(momWave));
          ctx.scale(-1, 1);
          if (spriteSheets.idle.loaded) {
            const frame = Math.floor(state.time * 1.2 + 1) % 2;
            const col = frame % spriteSheets.idle.cols;
            const sx = col * spriteSheets.idle.frameW;
            const sy = 0;
            const destW = 40; // Smaller Mom
            const destH = (spriteSheets.idle.frameH / spriteSheets.idle.frameW) * destW;
            ctx.drawImage(
              spriteSheets.idle.img,
              sx,
              sy,
              spriteSheets.idle.frameW,
              spriteSheets.idle.frameH,
              -destW / 2,
              -destH,
              destW,
              destH,
            );
          } else {
            drawEmoji("🐧", 0, -16, 38); // Fallback Mom
          }
          ctx.restore();

          // 4. Draw Rescued fish jumping
          if (state.fishJumpTimer > 0) {
            const progress = (1.5 - state.fishJumpTimer) / 1.5;
            const jumpHeight = 75;
            const fishX = b.x + b.w * 0.5 + (progress * 80 - 40);
            const fishY = b.y - Math.sin(progress * Math.PI) * jumpHeight - 10;
            ctx.save();
            ctx.translate(fishX, fishY);
            ctx.rotate(progress * Math.PI - Math.PI / 2);
            drawEmoji("🐟", 0, 0, 18);
            ctx.restore();
          }

          // 5. Draw snow sparkles rising from base
          if (Math.random() < 0.12) {
            state.particles.push({
              x: b.x + Math.random() * b.w,
              y: b.y,
              vx: (Math.random() - 0.5) * 8,
              vy: -15 - Math.random() * 20,
              life: 1.0,
              maxLife: 1.0,
              color: "#FFF59D",
              size: 2 + Math.random() * 2,
              kind: "snow"
            });
          }

          ctx.fillStyle = "#fff";
          roundedRect(b.x + 22, b.y - 38, 150, 36, 8, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(b.x + 22, b.y - 38, 150, 36, 8, false, true);
          ctx.fillStyle = "#111";
          ctx.font = "900 14px Arial";
          ctx.textAlign = "left";
          ctx.textBaseline = "middle";
          ctx.fillText("💚 SAFE ICEBERG", b.x + 30, b.y - 20);

          // 6. Draw Delivered chicks dancing
          const delivered = state.chicks.filter((c) => c.delivered);
          delivered.forEach((c, i) => {
            const dance = Math.sin(state.time * 6.5 + i * 1.5) * 8; // Higher jump!
            const destW = 32;
            const destH = chickSprite.loaded
              ? (chickSprite.frameH / chickSprite.frameW) * destW
              : 34;

            if (chickSprite.loaded) {
              const danceCycle = Math.floor(state.time * 7 + i) % 3;
              let frame = 0;
              if (danceCycle === 1) frame = 4;
              else if (danceCycle === 2) frame = 5;

              const col = frame % chickSprite.cols;
              const row = Math.floor(frame / chickSprite.cols);
              const sx = col * chickSprite.frameW;
              const sy = row * chickSprite.frameH;

              ctx.save();
              ctx.translate(b.x + 48 + i * 26, b.y - (i % 2) * 4 + dance);
              ctx.drawImage(
                chickSprite.img,
                sx,
                sy,
                chickSprite.frameW,
                chickSprite.frameH,
                -destW / 2,
                -destH,
                destW,
                destH,
              );
              ctx.restore();
            } else {
              drawEmoji("🐥", b.x + 48 + i * 26, b.y - 6 - (i % 2) * 4 + dance, 22);
            }

            // Celebratory particles
            if (Math.random() < 0.02) {
              state.particles.push({
                x: b.x + 48 + i * 26 + (Math.random() - 0.5) * 8,
                y: b.y - 45 + dance,
                vx: (Math.random() - 0.5) * 12,
                vy: -20 - Math.random() * 20,
                life: 1.0,
                maxLife: 1.0,
                kind: "emoji",
                text: Math.random() < 0.55 ? "❤️" : "✨",
                size: 11
              });
            }
          });
        }

        function drawValvePlatform() {
          const p = state.valvePlatform;
          ctx.fillStyle = "#CFEFFF";
          roundedRect(p.x, p.y, p.w, p.h, 12, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(p.x, p.y, p.w, p.h, 12, false, true);

          ctx.save();
          ctx.translate(state.valve.x, state.valve.y);
          const spin = state.valve.pulse * 1.3 + state.valve.activeFlash * 12.0;
          ctx.rotate(spin);
          
          if (state.valve.frozen) {
            ctx.fillStyle = "#B3F0FF";
          } else {
            ctx.fillStyle = state.coolingTimer > 0 ? "#87E1FF" : "#FFD84D";
          }
          
          circle(0, 0, state.valve.r, true);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          circle(0, 0, state.valve.r, false);
          
          for (let i = 0; i < 4; i++) {
            ctx.rotate(Math.PI / 2);
            ctx.fillRect(-4, -state.valve.r - 12, 8, 22);
            ctx.strokeRect(-4, -state.valve.r - 12, 8, 22);
          }
          
          if (state.valve.frozen) {
            ctx.save();
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            for (let j = 0; j < 6; j++) {
              ctx.rotate(Math.PI / 3);
              ctx.fillRect(-2, -state.valve.r + 4, 4, 14);
            }
            ctx.restore();
          }

          circle(0, 0, 8, true);
          circle(0, 0, 8, false);
          ctx.restore();

          ctx.fillStyle = "#fff";
          roundedRect(p.x + 105, p.y - 48, 120, 34, 8, true, false);
          ctx.strokeStyle = "#111";
          roundedRect(p.x + 105, p.y - 48, 120, 34, 8, false, true);
          ctx.fillStyle = "#111";
          ctx.font = "900 14px Arial";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(
            state.valve.frozen ? "FROZEN ❄️" : (state.coolingTimer > 0 ? "COOLING!" : "SPIN VALVE"),
            p.x + 165,
            p.y - 31,
          );
        }

        // Small deterministic PRNG so each floe's jagged edge and crack
        // pattern is generated once, cached, and never reshuffles frame
        // to frame (real Math.random() would make the ice "boil").
        function seededRandom(seed) {
          let s = seed % 2147483647;
          if (s <= 0) s += 2147483646;
          return function () {
            s = (s * 16807) % 2147483647;
            return (s - 1) / 2147483646;
          };
        }

        // Builds an irregular, organic outline for a floe (as normalized
        // 0..1 offsets around a rounded rect) plus a jagged snow-cap line
        // along the top edge, so no two platforms read as the same shape.
        function getIceShapePoints(pl) {
          if (pl.shapePts) return pl.shapePts;
          const rand = seededRandom(pl.seed || 1);
          const N = 14;
          const outline = [];
          for (let i = 0; i < N; i++) {
            const t = i / N;
            const bulge = 0.82 + rand() * 0.22;
            outline.push({ t, bulge });
          }
          const snowTeeth = [];
          const teeth = 6 + Math.floor(rand() * 3);
          for (let i = 0; i <= teeth; i++) {
            snowTeeth.push(0.55 + rand() * 0.45);
          }
          pl.shapePts = { outline, snowTeeth };
          return pl.shapePts;
        }

        // Cracks are generated once per melt-stage (not every frame) and
        // cached on the platform so they hold still until the ice actually
        // worsens to the next stage.
        function getCrackLines(pl, stage) {
          if (pl.cachedCrackStage === stage && pl.cachedCracks) {
            return pl.cachedCracks;
          }
          const rand = seededRandom((pl.crackSeed || 1) + stage * 911);
          const count = Math.min(stage * 2, 8);
          const lines = [];
          for (let i = 0; i < count; i++) {
            const cx = 0.15 + rand() * 0.7;
            const cy = 0.2 + rand() * 0.6;
            const len = 0.12 + rand() * 0.22;
            const ang = rand() * Math.PI * 2;
            lines.push({ cx, cy, len, ang, branch: rand() > 0.5 });
          }
          pl.cachedCrackStage = stage;
          pl.cachedCracks = lines;
          return lines;
        }

        // Draws one organic ice floe: jagged silhouette, snow cap, interior
        // shading, and stage-appropriate cracks/puddles/fragment gaps.
        function drawIceFloe(pl, x, w, meltRatio) {
          const h = pl.h;
          const stage =
            meltRatio < 0.15
              ? 1
              : meltRatio < 0.35
                ? 2
                : meltRatio < 0.52
                  ? 3
                  : meltRatio < 0.68
                    ? 4
                    : 5;

          ctx.save();
          ctx.translate(x + w / 2, pl.y + h / 2);
          ctx.rotate(pl.rot || 0);
          ctx.translate(-w / 2, -h / 2);

          // Apply blue healing glow if active
          if (pl.glowTimer > 0) {
            ctx.shadowColor = "#87E1FF";
            ctx.shadowBlur = 15 * (pl.glowTimer / 1.5);
          }

          // Shading colors
          let topColor = "#ffffff";
          let sideColor1 = "#A8DAF0";
          let sideColor2 = "#2C5E7A";
          
          if (stage === 1) {
            topColor = "#ffffff";
            sideColor1 = "#BCE3F7";
            sideColor2 = "#3E7E9E";
          } else if (stage === 2) {
            topColor = "#E4F7FF";
            sideColor1 = "#A8DCEF";
            sideColor2 = "#2C5E7A";
          } else if (stage === 3) {
            topColor = "#C2DCEE";
            sideColor1 = "#8CBED9";
            sideColor2 = "#1E475E";
          } else if (stage === 4) {
            topColor = "#A5C6DC";
            sideColor1 = "#739FBD";
            sideColor2 = "#123042";
          } else {
            topColor = "#92AFCE";
            sideColor1 = "#5E82A1";
            sideColor2 = "#081E2E";
          }

          const thickness = 16;

          // 1. Draw 3D side/front face (extruded downward)
          ctx.save();
          ctx.fillStyle = sideColor2;
          roundedRect(0, thickness, w, h, 12, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(0, thickness, w, h, 12, false, true);
          ctx.restore();

          // 2. Draw Top surface
          ctx.save();
          ctx.fillStyle = topColor;
          roundedRect(0, 0, w, h, 12, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(0, 0, w, h, 12, false, true);
          ctx.restore();
          
          // Reset shadow blur
          ctx.shadowBlur = 0;

          // 3. Draw clean ice cube emojis lined up on top
          for (let i = 0; i < Math.max(2, Math.floor(w / 38)); i++) {
            drawEmoji(
              "🧊",
              22 + i * 32,
              h / 2 + Math.sin(i + state.time * 2) * 1.5,
              18,
            );
          }

          // 4. Cracks / puddles
          if (stage >= 2) {
            const cracks = getCrackLines(pl, stage);
            ctx.strokeStyle = stage >= 4 ? "#1D4F73" : "#3B7FB8";
            ctx.lineWidth = stage >= 4 ? 2.4 : 1.6;
            for (const c of cracks) {
              const cx = c.cx * w;
              const cy = c.cy * h;
              const dx = Math.cos(c.ang) * c.len * w;
              const dy = Math.sin(c.ang) * c.len * h;
              ctx.beginPath();
              ctx.moveTo(cx - dx / 2, cy - dy / 2);
              ctx.lineTo(cx + dx / 2, cy + dy / 2);
              if (c.branch) {
                ctx.lineTo(cx + dx / 2 + dy * 0.3, cy + dy / 2 - dx * 0.3);
              }
              ctx.stroke();
            }
          }
          ctx.restore();
        }

        function drawPlatforms() {
          for (const pl of state.meltPlatforms) {
            if (pl.gone) continue;
            const x = pl.x + pl.shrink * 0.5;
            const meltRatio = 1 - pl.w / pl.baseW;
            
            // Draw the beautiful, organic, bobbing/rotating ice floe!
            drawIceFloe(pl, x, pl.w, meltRatio);

            const critical = meltRatio > 0.55;
            if (critical) {
              const pulse = 0.5 + Math.sin(state.time * 9) * 0.5;
              ctx.save();
              ctx.strokeStyle = `rgba(239, 68, 68, ${(0.5 + pulse * 0.4).toFixed(2)})`;
              ctx.lineWidth = 4;
              ctx.setLineDash([8, 6]);
              ctx.lineDashOffset = -state.time * 40;
              roundedRect(x - 3, pl.y - 3, pl.w + 6, pl.h + 6, 14, false, true);
              ctx.setLineDash([]);
              ctx.restore();
            }

            // Draw visual segmented health bar underneath if it is melting
            if (meltRatio > 0.05) {
              const barW = pl.w * 0.65;
              const barH = 7;
              const bx = x + (pl.w - barW) / 2;
              const by = pl.y + pl.h + 9 + (Math.sin(state.time * 2.0 + pl.phase) * 2);
              
              ctx.save();
              // Neo-brutalist health bar container
              ctx.fillStyle = "#1e293b";
              ctx.fillRect(bx - 2, by - 2, barW + 4, barH + 4);
              
              // Fill bar
              const healthPct = 1 - meltRatio;
              let fillCol = "#7CE6A6";
              if (healthPct < 0.35) {
                fillCol = "#FF3B30";
              } else if (healthPct < 0.65) {
                fillCol = "#FFCC00";
              }
              ctx.fillStyle = fillCol;
              ctx.fillRect(bx, by, barW * healthPct, barH);
              ctx.restore();
            }
          }
        }

        function drawChicks() {
          const p = state.player;
          for (const chick of state.chicks) {
            if (chick.delivered || state.player.carrying.includes(chick)) continue;
            const bob = Math.sin(chick.bob) * 3;
            let shiver = 0;
            let crying = false;

            // Find the nearest floe under the chick to decide if it
            // should look scared (shiver + tear) or just wave happily.
            let nearest = null;
            let bestDist = Infinity;
            for (const pl of state.meltPlatforms) {
              if (pl.gone) continue;
              const d = Math.abs(pl.x + pl.w / 2 - chick.x);
              if (d < bestDist) {
                bestDist = d;
                nearest = pl;
              }
            }
            if (nearest && bestDist < 120) {
              const ratio = 1 - nearest.w / nearest.baseW;
              if (ratio > 0.35) {
                shiver = Math.sin(state.time * 26 + chick.bob) * 2.8;
                crying = ratio > 0.55;
              }
            }

            const destW = 32;
            let destH = 34;
            if (chickSprite.loaded) {
              destH = (chickSprite.frameH / chickSprite.frameW) * destW;
            }

            // Calculate exact rotated positioning to stay glued to bobbing/tilting platforms
            let drawX = chick.x + 9 + shiver;
            let drawY = chick.y + 18 + bob;
            let drawRot = 0;
            
            if (!chick.rescued && chick.platformIndex !== undefined) {
              const pl = state.meltPlatforms[chick.platformIndex];
              if (pl && !pl.gone) {
                const plX = pl.x + pl.shrink * 0.5;
                const plCenterW = pl.w / 2;
                const plCenterH = pl.h / 2;
                
                const relX = (chick.x + 9) - (plX + plCenterW);
                const relY = -plCenterH;
                
                const rot = pl.rot || 0;
                const cos = Math.cos(rot);
                const sin = Math.sin(rot);
                
                const rotX = relX * cos - relY * sin;
                const rotY = relX * sin + relY * cos;
                
                drawX = plX + plCenterW + rotX + shiver;
                drawY = pl.y + plCenterH + rotY + bob;
                drawRot = rot;
              }
            }

            if (chickSprite.loaded) {
              let frame = 3; // Default standing
              if (crying) {
                // Worried fast-blink animation when platform is melting
                const worryTime = (state.time * 4.0 + chick.bob) % 3.0;
                if (worryTime < 1.5) {
                  frame = 1; // Worried eyes
                } else if (worryTime < 2.0) {
                  frame = 2; // Eyes shut tight
                } else {
                  frame = 3; // Normal standing
                }
              } else {
                // Happy normal idle cycle
                const chickTime = (state.time * 1.5 + chick.bob) % 5.0;
                if (chickTime < 3.5) {
                  frame = 3; // Normal look
                } else if (chickTime < 3.7) {
                  frame = 1; // Eyes half closed
                } else if (chickTime < 3.95) {
                  frame = 2; // Eyes closed
                } else if (chickTime < 4.15) {
                  frame = 1; // Eyes half closed
                } else {
                  frame = 0; // Happy open mouth
                }
              }

              const col = frame % chickSprite.cols;
              const row = Math.floor(frame / chickSprite.cols);
              const sx = col * chickSprite.frameW;
              const sy = row * chickSprite.frameH;

              ctx.save();
              ctx.translate(drawX, drawY);
              ctx.rotate(drawRot);
              ctx.drawImage(
                chickSprite.img,
                sx,
                sy,
                chickSprite.frameW,
                chickSprite.frameH,
                -destW / 2,
                -destH,
                destW,
                destH,
              );

              // Draw Ice Left progress bar inside coordinate space so it tilts & stays glued
              if (!chick.rescued && nearest && bestDist < 120) {
                const icePct = Math.round((nearest.w / nearest.baseW) * 100);
                if (icePct < 100) {
                  const barW = 32;
                  const barH = 5;
                  const bx = -barW / 2;
                  const by = -destH - 8;

                  ctx.fillStyle = "rgba(15, 23, 42, 0.65)";
                  ctx.fillRect(bx, by, barW, barH);

                  let fillColor = "#80E0FF";
                  if (icePct < 35) {
                    fillColor = "#FF3B30";
                  } else if (icePct < 65) {
                    fillColor = "#FFCC00";
                  }

                  const fillW = (icePct / 100) * barW;
                  ctx.fillStyle = fillColor;
                  ctx.fillRect(bx, by, fillW, barH);

                  ctx.strokeStyle = "#1e293b";
                  ctx.lineWidth = 1;
                  ctx.strokeRect(bx, by, barW, barH);
                }
              }
              ctx.restore();
            } else {
              ctx.save();
              ctx.translate(drawX, drawY);
              ctx.rotate(drawRot);
              drawEmoji("🐥", 0, -11, 22);
              ctx.restore();
            }

            // Draw "Press E / ☸️" prompt when overlapping (upright, at drawX/drawY)
            const maxCarry = getMaxCarryingCapacity();
            if (!chick.rescued && rectsOverlap(p, { x: chick.x, y: chick.y, w: 18, h: 18 }) && p.carrying.length < maxCarry) {
              ctx.save();
              ctx.fillStyle = "#ffffff";
              ctx.strokeStyle = "#111111";
              ctx.lineWidth = 3;
              ctx.font = 'bold 12px "Quicksand", sans-serif';
              ctx.textAlign = "center";
              const promptText = "Press E / ☸️";
              ctx.strokeText(promptText, drawX, drawY - destH - 12);
              ctx.fillText(promptText, drawX, drawY - destH - 12);
              ctx.restore();
            }

            if (crying) {
              drawEmoji("💧", chick.x + 16, chick.y + 20, 12);
            }
          }
        }

        function drawPlayer() {
          const p = state.player;
          const x = p.x;
          const y = p.y;
          const sheet = getActiveSpriteSheet();

          // Nervous cue: a quick foot-slip jitter and a worried tilt while
          // standing on ice that's about to give way, so kids can read
          // "this spot is dangerous" straight from Penny's body language.
          const nervous = !!p.onCriticalIce;
          const jitterX = nervous ? Math.sin(state.time * 30) * 2.2 : 0;
          const tilt = nervous ? Math.sin(state.time * 16) * 0.06 : 0;

          // Exaggerated penguin waddle sway (tilt & lift feet)
          let waddleTilt = 0;
          let waddleY = 0;
          if (sheet === spriteSheets.running) {
            const runCycle = state.time * Math.max(9, Math.abs(p.vx) * 0.08);
            waddleTilt = Math.sin(runCycle) * 0.16; // side-to-side body tilt
            waddleY = -Math.abs(Math.cos(runCycle)) * 4.5; // waddle bounce
          }

          // Match tilt of bobbing/rotating platforms if standing on one
          let platformRot = 0;
          if (p.onGround) {
            const solids = getSolids();
            const under = solids.find(
              (s) =>
                p.x + p.w > s.x &&
                p.x < s.x + s.w &&
                Math.abs(p.y + p.h - s.y) < 6,
            );
            if (under && under.rot !== undefined) {
              platformRot = under.rot;
            }
          }

          // Mother penguin is visually larger
          const destW = 72;
          let destH = 108; // Fallback size

          if (sheet.loaded) {
            destH = (sheet.frameH / sheet.frameW) * destW;
            let frame = penguinAnim.frameIndex;

            // Physics-based jump frame selection & fail frame override
            if (state.state === "failed") {
              frame = 0; // Crying
            } else if (sheet === spriteSheets.jump) {
              frame = p.vy < 0 ? 1 : 2; // Rising: Soaring (1), Falling/Landing: Sliding (2)
            } else {
              const totalFrames = sheet.cols * sheet.rows;
              frame = frame % totalFrames;
            }

            const col = frame % sheet.cols;
            const row = Math.floor(frame / sheet.cols);

            const sx = col * sheet.frameW;
            const sy = row * sheet.frameH;

            ctx.save();
            ctx.translate(x + p.w / 2 + jitterX, y + p.h + waddleY);
            ctx.rotate(tilt + waddleTilt + platformRot);

            // Penny sprite sheets face right naturally, so scale direction directly matches facing
            let faceDirection = p.facing;

            ctx.scale(faceDirection, 1);
            ctx.drawImage(
              sheet.img,
              sx,
              sy,
              sheet.frameW,
              sheet.frameH,
              -destW / 2,
              -destH,
              destW,
              destH,
            );
            ctx.restore();
          } else {
            // Fallback render
            ctx.save();
            ctx.translate(x + p.w / 2 + jitterX, y + p.h + waddleY);
            ctx.rotate(tilt + waddleTilt + platformRot);

            let faceDirection = p.facing;

            ctx.scale(faceDirection, 1);
            try {
              ctx.drawImage(sheet.img, -destW / 2, -destH, destW, destH);
            } catch (e) {
              // Safe secondary shape draw
              ctx.fillStyle = "#87D0FF";
              ctx.fillRect(-p.w / 2, -p.h, p.w, p.h);
            }
            ctx.restore();
          }

          if (nervous) {
            // Draw sweat drop relative to Mother Penguin's visual head height
            drawEmoji("💦", x + p.w / 2 + 18, y + p.h - destH + 8 + Math.sin(state.time * 10) * 2, 16);
          }

          if (p.carrying && p.carrying.length > 0) {
            // Draw hugging emoji above Penny
            drawEmoji("🤗", x + p.w / 2 - p.facing * 18, y + p.h - destH - 12 + Math.sin(state.time * 6) * 3, 18);

            p.carrying.forEach((chick, index) => {
              const cW = 28; // slightly smaller than ground chicks (32)
              const cH = chickSprite.loaded
                ? (chickSprite.frameH / chickSprite.frameW) * cW
                : 30;

              // Hold the chick above the belly in front! Staggered for multiple carried chicks
              const offsetX = 12 + index * 4;
              const offsetY = -destH * 0.4 - index * 12;

              if (chickSprite.loaded) {
                // Alternately flap wings/cycle walking frames
                const flapCycle = Math.floor(state.time * 8 + index) % 2;
                let frame = flapCycle === 0 ? 0 : 4; // Alternate smile/happy frame 0 and flapping waddle frame 4!

                const col = frame % chickSprite.cols;
                const row = Math.floor(frame / chickSprite.cols);
                const sx = col * chickSprite.frameW;
                const sy = row * chickSprite.frameH;

                ctx.save();
                ctx.translate(x + p.w / 2, y + p.h + waddleY);
                ctx.scale(p.facing, 1); // Face same direction as Mother!
                ctx.translate(offsetX, offsetY);
                ctx.drawImage(
                  chickSprite.img,
                  sx,
                  sy,
                  chickSprite.frameW,
                  chickSprite.frameH,
                  -cW / 2,
                  -cH,
                  cW,
                  cH,
                );
                ctx.restore();
              } else {
                drawEmoji("🐥", x + p.w / 2 + offsetX * p.facing, y + p.h + waddleY + offsetY - 10, 20);
              }
            });
          }
        }

        function drawParticles() {
          for (const pt of state.particles) {
            const alpha = Math.max(0, Math.min(1, pt.life / (pt.maxLife || 0.8)));
            ctx.globalAlpha = alpha;
            if (pt.kind === "snow") {
              ctx.fillStyle = pt.color;
              circle(pt.x, pt.y, pt.size, true);
            } else if (pt.kind === "drip") {
              ctx.fillStyle = pt.color;
              ellipse(pt.x, pt.y, pt.size * 0.6, pt.size * 1.3, true, false);
            } else if (pt.kind === "wind") {
              ctx.strokeStyle = pt.color;
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.moveTo(pt.x, pt.y);
              ctx.lineTo(pt.x + pt.size, pt.y);
              ctx.stroke();
            } else if (pt.kind === "emoji") {
              ctx.fillStyle = "#111"; // Fallback color, though filled emojis don't care
              ctx.font = `${pt.size || 14}px Arial`;
              ctx.textAlign = "center";
              ctx.textBaseline = "middle";
              ctx.fillText(pt.text, pt.x, pt.y);
            } else if (pt.kind === "footprint") {
              ctx.fillStyle = pt.color;
              ctx.beginPath();
              ctx.ellipse(pt.x, pt.y, 4, 2, 0, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillStyle = pt.color;
              ctx.strokeStyle = "#111";
              ctx.lineWidth = 2;
              roundedRect(pt.x, pt.y, pt.size, pt.size, 3, true, false);
              roundedRect(pt.x, pt.y, pt.size, pt.size, 3, false, true);
            }
            ctx.globalAlpha = 1;
          }
        }

        function drawWater() {
          const top = state.seaLevel;
          const warmthVal = state ? state.warmth : 0;
          const roughness = 1 + warmthVal * 2.2;
          
          ctx.save();
          ctx.fillStyle = lerpColor("#2F6FD0", "#0D1B3E", warmthVal);
          ctx.beginPath();

          const W = canvas.width;
          const H = canvas.height;
          const scrollVal = cameraX;

          ctx.moveTo(0, H);
          for (let x = 0; x <= W + 20; x += 15) {
            const worldX = x + scrollVal;
            const amp = (6 + warmthVal * 16) * Math.sin(worldX * 0.015 + state.time * (2.2 + warmthVal * 2.0));
            const amp2 = 3 * Math.cos(worldX * 0.04 - state.time * 3.5);
            ctx.lineTo(x, top + amp + amp2);
          }
          ctx.lineTo(W, H);
          ctx.closePath();
          ctx.fill();

          ctx.strokeStyle = lerpColor("#76C4FF", "#2E5088", warmthVal);
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          for (let x = 0; x <= W + 20; x += 15) {
            const worldX = x + scrollVal;
            const amp = (6 + warmthVal * 16) * Math.sin(worldX * 0.015 + state.time * (2.2 + warmthVal * 2.0));
            const amp2 = 3 * Math.cos(worldX * 0.04 - state.time * 3.5);
            if (x === 0) ctx.moveTo(0, top + amp + amp2);
            else ctx.lineTo(x, top + amp + amp2);
          }
          ctx.stroke();

          ctx.fillStyle = "rgba(230, 248, 255, 0.85)";
          ctx.strokeStyle = "rgba(100, 180, 220, 0.5)";
          ctx.lineWidth = 1.5;
          for (const chunk of waterIceChunks) {
            const cx = ((chunk.x - scrollVal) % (W + 200) + (W + 200)) % (W + 200) - 100;
            const worldX = cx + scrollVal;
            const amp = (6 + warmthVal * 16) * Math.sin(worldX * 0.015 + state.time * (2.2 + warmthVal * 2.0));
            const cy = top + amp - 4 + Math.sin(state.time * 2.5 + chunk.wobble) * 3;
            
            ctx.beginPath();
            ctx.moveTo(cx - chunk.w/2, cy);
            ctx.lineTo(cx - chunk.w/4, cy - chunk.h);
            ctx.lineTo(cx + chunk.w/4, cy - chunk.h);
            ctx.lineTo(cx + chunk.w/2, cy);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }

          const sealX = ((900 - scrollVal) % (W + 500) + (W + 500)) % (W + 500) - 100;
          const sealWorldX = sealX + scrollVal;
          const sealWaveY = top + (6 + warmthVal * 16) * Math.sin(sealWorldX * 0.015 + state.time * (2.2 + warmthVal * 2.0)) - 10;
          const sealBob = Math.sin(state.time * 1.8) * 4;
          drawEmoji("🦭", sealX, sealWaveY + sealBob, 26);

          const whaleCycle = (state.time) % 24;
          if (whaleCycle < 4.0) {
            const progress = whaleCycle / 4.0;
            const whaleX = ((1400 - scrollVal) % (W + 600) + (W + 600)) % (W + 600) - 100;
            const whaleY = top - 10 - Math.sin(progress * Math.PI) * 45;
            ctx.save();
            ctx.translate(whaleX, whaleY);
            ctx.rotate(progress * Math.PI - Math.PI / 2);
            drawEmoji("🐋", 0, 0, 36);
            ctx.restore();
          }

          ctx.globalAlpha = 0.5 - warmthVal * 0.35;
          ctx.fillStyle = "#A0D5FF";
          for (const b of waterBubbles) {
            const bx = ((b.x - scrollVal) % (W + 100) + (W + 100)) % (W + 100) - 50;
            const by = top + b.depth + Math.sin(state.time * b.speed * 0.05 + b.phase) * 6;
            circle(bx, by, b.size, true);
          }

          for (const f of waterFish) {
            const fx = ((f.baseX + Math.sin(state.time * 0.5 + f.phase) * 110 - scrollVal) % (W + 200) + (W + 200)) % (W + 200) - 100;
            const fy = top + f.depth + Math.cos(state.time * 0.8 + f.phase) * 10;
            ctx.save();
            ctx.translate(fx, fy);
            ctx.scale(f.dir, 1);
            drawEmoji("🐟", 0, 0, 15);
            ctx.restore();
          }

          ctx.restore();
        }

        function drawWorldHud() {
          const nearValve =
            Math.hypot(
              state.player.x + state.player.w / 2 - state.valve.x,
              state.player.y + state.player.h / 2 - state.valve.y,
            ) < 78;
          if (nearValve && state.state === "playing") {
            const bounce = Math.sin(state.time * 6) * 3;
            const sx = state.valve.x - cameraX;
            const sy = state.valve.y - 70 + bounce;
            // "E" and "tap ☸️" shown together — a keyboard-only hint
            // would leave touch players (no keyboard) with no message
            // at all, so both input paths are spelled out every time.
            ctx.fillStyle = "#FFF7E8";
            roundedRect(sx - 68, sy - 18, 136, 32, 8, true, false);
            ctx.strokeStyle = "#111";
            ctx.lineWidth = 3;
            roundedRect(sx - 68, sy - 18, 136, 32, 8, false, true);
            ctx.fillStyle = "#111";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.font = "900 12px Arial";
            ctx.fillText("Press E / tap ☸️", sx, sy - 1);
          }
        }
        function drawCloud(x, y, scale, layer) {
          ctx.save();
          ctx.translate(x, y);
          ctx.scale(scale, scale);

          // Back clouds are softer and more transparent
          ctx.globalAlpha = layer === "back" ? 0.45 : 1;
          ctx.fillStyle = layer === "back" ? "#eef6ff" : "#ffffff";
          ctx.strokeStyle = "#1e293b";
          ctx.lineWidth = 3;

          ctx.beginPath();

          ctx.moveTo(-20, 8);

          ctx.bezierCurveTo(-38, 8, -38, -12, -20, -12);

          ctx.bezierCurveTo(-20, -30, 20, -30, 20, -12);

          ctx.bezierCurveTo(38, -12, 38, 8, 20, 8);

          ctx.closePath();

          ctx.fill();

          if (layer !== "back") {
            ctx.stroke();
          }

          ctx.restore();
        }

        function roundedRect(x, y, w, h, r, fill, stroke) {
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.lineTo(x + w - r, y);
          ctx.quadraticCurveTo(x + w, y, x + w, y + r);
          ctx.lineTo(x + w, y + h - r);
          ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
          ctx.lineTo(x + r, y + h);
          ctx.quadraticCurveTo(x, y + h, x, y + h - r);
          ctx.lineTo(x, y + r);
          ctx.quadraticCurveTo(x, y, x + r, y);
          if (fill) ctx.fill();
          if (stroke) ctx.stroke();
        }

        function circle(x, y, r, fill) {
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          if (fill) ctx.fill();
          else ctx.stroke();
        }

        function ellipse(x, y, rx, ry, fill, stroke) {
          ctx.beginPath();
          ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
          if (fill) ctx.fill();
          if (stroke) ctx.stroke();
        }

        function drawEmoji(emoji, x, y, size) {
          ctx.save();
          ctx.font = size + 'px "Segoe UI Emoji", "Apple Color Emoji", Arial';
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#111";
          ctx.strokeText(emoji, x, y);
          ctx.fillText(emoji, x, y);
          ctx.restore();
        }

        function setControl(name, isDown) {
          if (name === "left") input.left = isDown;
          if (name === "right") input.right = isDown;
          if (name === "jump") {
            if (isDown && !input.jump) input.jumpPressed = true;
            input.jump = isDown;
          }
          if (name === "action" && isDown) input.actionPressed = true;
        }

        window.addEventListener(
          "keydown",
          (e) => {
            const k = e.key.toLowerCase();
            if (
              [
                "arrowleft",
                "arrowright",
                "arrowup",
                " ",
                "a",
                "d",
                "w",
                "e",
              ].includes(k)
            )
              e.preventDefault();
            if (k === "arrowleft" || k === "a") input.left = true;
            if (k === "arrowright" || k === "d") input.right = true;
            if ((k === "arrowup" || k === "w" || k === " ") && !input.jump) {
              input.jump = true;
              input.jumpPressed = true;
            }
            if (k === "e") input.actionPressed = true;
          },
          { passive: false },
        );

        window.addEventListener("keyup", (e) => {
          const k = e.key.toLowerCase();
          if (k === "arrowleft" || k === "a") input.left = false;
          if (k === "arrowright" || k === "d") input.right = false;
          if (k === "arrowup" || k === "w" || k === " ") input.jump = false;
        });

        document.querySelectorAll("[data-control]").forEach((btn) => {
          const name = btn.getAttribute("data-control");
          const onDown = (e) => {
            e.preventDefault();
            setControl(name, true);
          };
          const onUp = (e) => {
            e.preventDefault();
            setControl(name, false);
          };
          btn.addEventListener("pointerdown", onDown);
          btn.addEventListener("pointerup", onUp);
          btn.addEventListener("pointercancel", onUp);
          btn.addEventListener("pointerleave", onUp);
        });

        function frame(ts) {
          if (!lastTime) lastTime = ts;
          const dt = Math.min(0.033, (ts - lastTime) / 1000);
          lastTime = ts;

          // Update background clouds position
          for (const cloud of clouds) {
            cloud.x += cloud.speed * dt;
            if (cloud.x > 800 + 120) {
              cloud.x = -120;
            }
          }

          if (gameRunning) {
            update(dt);
          } else {
            updatePenguinAnim(dt);
          }
          render();
          requestAnimationFrame(frame);
        }

        state = createState();
        updateUI();
        render();
        requestAnimationFrame(frame);
        showIntro();
      })();
    </script>
  </body>
</html>

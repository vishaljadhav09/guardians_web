<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Penny on Thin Ice — Guardians of Gaia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&family=Caveat:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/styles.css" />
    <style>
      .stage-wrap {
        width: min(1180px, calc(100vw - 28px));
        max-width: 1180px;
        margin: 0 auto;
        padding: 12px 0 32px;
        animation: pageFadeIn 0.5s ease both;
      }
      .stage-hud {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .stage-title {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .stage-title h1 {
        font-size: 1.25rem;
      }
      .stage-title small {
        display: block;
        font-family: var(--gog-font-hand);
        font-size: 1rem;
        color: #4d5c37;
      }
      .hud-mid {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
      }
      .meter {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--gog-white);
        border: 3px solid var(--gog-ink);
        border-radius: 999px;
        padding: 6px 14px 6px 10px;
        box-shadow: var(--gog-shadow-sm);
        min-width: 168px;
        position: relative;
      }
      .meter .label,
      .meter .meter-track {
        position: relative;
        z-index: 2;
      }
      .meter .label {
        font-size: 0.78rem;
        font-weight: 700;
        white-space: nowrap;
      }
      .meter-track {
        flex: 1;
        height: 10px;
        border-radius: 999px;
        background: #d8e8f5;
        border: 2px solid var(--gog-ink);
        overflow: hidden;
      }
      .meter-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #3dd6c0, #2e5ee8);
        transition: width 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .timer-chip {
        font-weight: 700;
        min-width: 64px;
        text-align: center;
        position: relative;
      }
      .timer-chip::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: inherit;
        box-shadow: 0 0 16px rgba(232, 46, 93, 0.65);
        opacity: 0;
        pointer-events: none;
        z-index: -1;
      }
      .timer-chip.timer-urgent {
        animation: timerPulseScale 0.8s ease-in-out infinite;
        color: #e82e5d;
      }
      .timer-chip.timer-urgent::after {
        animation: timerPulseGlow 0.8s ease-in-out infinite;
      }
      @keyframes timerPulseScale {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.14);
        }
      }
      @keyframes timerPulseGlow {
        0%,
        100% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
      }
      .canvas-frame {
        position: relative;
        width: 100%;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        max-height: calc(100vh - 220px);
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        margin: 0 auto;
        /* max-width: 800px; */
      }
      @keyframes warmthPulse {
        0%,
        100% {
          box-shadow:
            4px 4px 0 var(--gog-ink),
            0 0 0 0 rgba(239, 68, 68, 0);
        }
        50% {
          box-shadow:
            4px 4px 0 var(--gog-ink),
            0 0 22px 6px rgba(239, 68, 68, 0.55);
        }
      }
      .canvas-frame.warmth-danger {
        animation: warmthPulse 1.1s ease-in-out infinite;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .controls {
        position: absolute;
        inset: auto 12px 12px 12px;
        display: flex;
        justify-content: space-between;
        align-items: end;
        pointer-events: none;
        z-index: 10;
      }
      .dpad,
      .jump-wrap {
        display: grid;
        grid-template-columns: repeat(3, 66px);
        grid-template-rows: repeat(3, 66px);
        gap: 5px;
        pointer-events: auto;
        align-items: center;
        justify-items: center;
      }
      .ctrl-btn {
        width: 76px;
        height: 76px;
        border: 3px solid var(--gog-ink);
        background: #fff;
        box-shadow: 5px 5px 0 var(--gog-ink);
        border-radius: 20px;
        font-size: 28px;
        font-weight: 900;
        color: var(--gog-ink);
        user-select: none;
        touch-action: none;
        cursor: pointer;
        transition:
          transform 0.08s,
          box-shadow 0.08s;
      }
      .ctrl-btn:active {
        transform: translate(4px, 4px);
        box-shadow: 1px 1px 0 var(--gog-ink);
      }
      @media (max-width: 700px) {
        .ctrl-btn {
          width: 62px;
          height: 62px;
          font-size: 22px;
        }
      }

      .calm-badge {
        font-size: 0.78rem;
        font-weight: 700;
        animation: fadeInUp 0.6s ease both;
      }

      .icon-btn {
        width: 42px;
        height: 42px;
        min-width: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--gog-white);
        border: 3px solid var(--gog-ink);
        border-radius: 50%;
        box-shadow: 3px 3px 0 var(--gog-ink);
        font-size: 1.15rem;
        line-height: 1;
        touch-action: manipulation;
      }

      @media (max-width: 700px) {
        .stage-wrap {
          width: calc(100vw - 12px);
          max-width: 100%;
          padding: 6px 0 18px;
        }

        .stage-hud {
          display: grid;
          grid-template-columns: minmax(0, 1fr);
          gap: 6px;
          margin-bottom: 8px;
        }

        .stage-title {
          gap: 6px;
          min-width: 0;
        }

        .stage-title .emoji-float {
          font-size: 1.35rem !important;
        }

        .stage-title h1 {
          font-size: 0.98rem;
          line-height: 1;
        }

        .stage-title small {
          display: none;
        }

        .hud-mid {
          display: grid;
          grid-template-columns: minmax(128px, 1fr) repeat(4, auto);
          gap: 5px;
          align-items: center;
          width: 100%;
        }

        .meter {
          min-width: 0;
          gap: 5px;
          padding: 4px 8px 4px 7px;
          border-width: 2px;
          box-shadow: 2px 2px 0 var(--gog-ink);
        }

        .meter .label {
          font-size: 0.66rem;
        }

        .meter-track {
          height: 8px;
          border-width: 2px;
        }

        .chip {
          padding: 4px 7px;
          border-width: 2px;
          box-shadow: 2px 2px 0 var(--gog-ink);
          font-size: 0.72rem;
          min-height: 30px;
        }

        .timer-chip {
          min-width: 44px;
        }

        .icon-btn {
          width: 32px;
          height: 32px;
          min-width: 32px;
          font-size: 0.92rem;
          border-width: 2px;
          box-shadow: 2px 2px 0 var(--gog-ink);
        }

        .guideBar {
          gap: 6px;
          padding: 3px 4px;
          margin-bottom: 8px;
          border-width: 2px;
          border-radius: 8px;
          box-shadow: 1px 1px 0 var(--gog-ink);
        }

        .guideAvatar {
          font-size: 1.25rem;
        }

        .guideBubble {
          padding: 5px 8px;
          border-width: 2px;
          border-radius: 10px;
          font-size: 1rem;
          line-height: 1.1;
        }

        .canvas-frame {
          border-width: 3px;
          border-radius: 12px;
          box-shadow: 4px 4px 0 var(--gog-ink);
        }

        .stage-controls {
          margin-top: 8px;
          gap: 6px;
        }

        .stage-controls .brutal-btn {
          padding: 8px 12px;
          min-height: 38px;
          border-width: 3px;
          border-radius: 10px;
          font-size: 0.86rem;
          box-shadow: 3px 3px 0 var(--gog-ink);
        }

        .calm-badge {
          font-size: 0.72rem;
        }
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      body {
        position: relative;
      }

      .page-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at 50% -8%,
            #efffdd 0%,
            #d4f0bd 42%,
            #fdf6e6 100%
          ),
          linear-gradient(
            180deg,
            rgba(60, 135, 67, 0.1),
            rgba(36, 99, 55, 0.16)
          );
      }

      .page-bubble {
        position: absolute;
        bottom: -10vh;
        border-radius: 999px;
        background: radial-gradient(
          circle at 32% 28%,
          rgba(255, 255, 255, 0.95),
          rgba(201, 242, 61, 0.14) 70%
        );
        opacity: 0;
        animation: pageBubbleRise linear infinite;
      }

      @keyframes pageBubbleRise {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 0;
        }
        8% {
          opacity: 0.5;
        }
        90% {
          opacity: 0.35;
        }
        100% {
          transform: translateY(-125vh) translateX(var(--drift, 24px));
          opacity: 0;
        }
      }

      .page-fx {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .page-bubble {
          animation: none;
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-bg" aria-hidden="true">
      <span

          left: 6%;

          animation-duration: 14s;
          animation-delay: 0s;
          --drift: 18px;

      ></span>
      <span
        class="page-bubble"

      ></span>
      <span
        class="page-bubble"

          left: 32%;

      ></span>
      <span
        class="page-bubble"

      <span

      ></span>
      <span
        class="page-bubble"

    <div class="page-fx" id="pageFx" aria-hidden="true"></div>

    <div class="stage-wrap">

    <!-- Seed Returns Cutscene Overlay -->

    <script src="../data/content.js"></script>
    <script src="../src/constants.js"></script>

    <script src="../src/engine.js"></script>
    <script src="../src/ui.js"></script>
    <script>
      (() => {
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const STAGE_ID = "stage04";
        const stageMeta = GOGContent.byId(STAGE_ID);
        let save = GOGSave.load();
        let calmMode = !!save.settings.calmMode;

        const audio = new GOGEngine.Audio(!save.settings.sound);
        audio.initBgm("assets/audio/stage04/stage_4.mp3");

        const ui = {
          warmFill: document.getElementById("warmFill"),
          warmthText: document.getElementById("warmthText"),
          warmthLabel: document.getElementById("warmthLabel"),
          rescuedText: document.getElementById("rescuedChip"),
          timerText: document.getElementById("timerChip"),
          iceText: document.getElementById("iceChip"),
          seaText: document.getElementById("seaChip"),
          muteBtn: document.getElementById("muteBtn"),
          calmBadge: document.getElementById("calmBadge"),
          guideText: document.getElementById("guideText"),
          canvasFrame: document.getElementById("canvasFrame"),
        };

        function syncMuteBtn() {
          if (ui.muteBtn) {
            ui.muteBtn.textContent = audio.muted ? "🔇" : "🔈";
          }
        }
        syncMuteBtn();

        if (ui.muteBtn) {
          ui.muteBtn.addEventListener("click", () => {
            const nowMuted = !audio.muted;
            audio.setMuted(nowMuted);
            syncMuteBtn();
            GOGSave.patch({ settings: { sound: !nowMuted } });
          });
        }

        // Preload and monitor state animations
        const spriteSheets = {
          idle: {
            img: new Image(),
            src: "assets/sprites/stage04/penny_idle.png",
            cols: 3,
            rows: 1,
            loaded: false,
            frameW: 0,
            frameH: 0,
          },
          running: {
            img: new Image(),
            src: "assets/sprites/stage04/penny_running.png",
            cols: 5,
            rows: 1,
            loaded: false,
            frameW: 0,
            frameH: 0,
          },
          jump: {
            img: new Image(),
            src: "assets/sprites/stage04/penny_jump.png",
            cols: 3,
            rows: 1,
            loaded: false,
            frameW: 0,
            frameH: 0,
          },
        };

        Object.keys(spriteSheets).forEach((key) => {
          const sheet = spriteSheets[key];
          sheet.img.src = sheet.src;
          sheet.img.onload = function () {
            sheet.frameW = sheet.img.naturalWidth / sheet.cols;
            sheet.frameH = sheet.img.naturalHeight / sheet.rows;
            sheet.loaded = true;
          };
        });

        const chickSprite = {
          img: new Image(),
          src: "assets/sprites/stage04/penny_chicks_idel.png",
          cols: 3,
          rows: 2,
          loaded: false,
          frameW: 0,
          frameH: 0,
        };
        chickSprite.img.src = chickSprite.src;
        chickSprite.img.onload = function () {
          chickSprite.frameW = chickSprite.img.naturalWidth / chickSprite.cols;
          chickSprite.frameH = chickSprite.img.naturalHeight / chickSprite.rows;
          chickSprite.loaded = true;
        };

        const bgLayers = [
          { img: new Image(), speed: 0.15 },
          { img: new Image(), speed: 1 },
          { img: new Image(), speed: 2 },
          { img: new Image(), speed: 3 }
        ];
        bgLayers[0].img.src = 'assets/background/stage04/1.png';
        bgLayers[1].img.src = 'assets/background/stage04/2.png';
        bgLayers[2].img.src = 'assets/background/stage04/3.png';
        bgLayers[3].img.src = 'assets/background/stage04/4.png';

        const penguinAnim = {
          frameIndex: 0,
          elapsed: 0,
          fps: 7,
        };

        // Determine active dynamic animation state sheet
        function getActiveSpriteSheet() {
          if (!state) return spriteSheets.idle;
          if (state.state === "failed") {
            return spriteSheets.jump; // Return jump sheet because it has the crying frame
          }
          const p = state.player;
          if (!p.onGround) {
            return spriteSheets.jump;
          } else if (Math.abs(p.vx) > 15) {
            return spriteSheets.running;
          }
          return spriteSheets.idle;
        }

        let lastActiveSheet = null;
        let idleTimer = 0;

        function updatePenguinAnim(dt) {
          const sheet = getActiveSpriteSheet();
          if (sheet !== lastActiveSheet) {
            penguinAnim.frameIndex = 0;
            penguinAnim.elapsed = 0;
            lastActiveSheet = sheet;
          }

          if (sheet === spriteSheets.idle) {
            idleTimer += dt;
            // Realistic idle cycle (4 seconds):
            // 0s to 3s: Stand still looking forward (Frame 0)
            // 3s to 3.15s: Quick blink (Frame 2)
            // 3.15s to 3.5s: Stand still looking forward (Frame 0)
            // 3.5s to 4.0s: Warm happy smile (Frame 1)
            const cycleTime = idleTimer % 4.0;
            if (cycleTime < 3.0) {
              penguinAnim.frameIndex = 0;
            } else if (cycleTime < 3.15) {
              penguinAnim.frameIndex = 2; // Blink
            } else if (cycleTime < 3.5) {
              penguinAnim.frameIndex = 0;
            } else {
              penguinAnim.frameIndex = 1; // Smile
            }
          } else if (sheet === spriteSheets.running) {
            const p = state.player;
            // Dynamically scale running animation speed based on velocity
            const fps = Math.max(6, Math.abs(p.vx) * 0.07);
            penguinAnim.elapsed += dt;
            var frameTime = 1 / fps;
            const totalFrames = sheet.cols * sheet.rows;

            while (penguinAnim.elapsed >= frameTime) {
              penguinAnim.elapsed -= frameTime;
              penguinAnim.frameIndex = (penguinAnim.frameIndex + 1) % totalFrames;
            }
          } else {
            // Jump sheet frames (crying/soaring/sliding) are physics-selected in drawPlayer
            penguinAnim.frameIndex = 0;
          }
        }

        const WORLD_W = 2000;
        const WORLD_H = 600;
        const CAMERA_LERP = 0.12;
        const TARGET_RESCUES = 5;

        const clouds = [
          // Far/Back clouds (slow, semi-transparent)
          { x: 80, y: 60, scale: 0.6, speed: 3, layer: "back" },
          { x: 300, y: 90, scale: 0.7, speed: 4, layer: "back" },
          { x: 580, y: 50, scale: 0.5, speed: 2.5, layer: "back" },
          { x: 780, y: 80, scale: 0.65, speed: 3.5, layer: "back" },

          // Near/Front clouds (faster, outline style)
          { x: 160, y: 110, scale: 0.9, speed: 8, layer: "front" },
          { x: 620, y: 145, scale: 1.15, speed: 6, layer: "front" },
          { x: 390, y: 80, scale: 0.7, speed: 10, layer: "front" },
        ];

        // Fixed-size ambient water dressing — positions/phases are set once
        // and animated purely from state.time, so drawWater never has to
        // allocate or push/pop arrays every frame.
        const waterBubbles = [];
        for (let i = 0; i < 14; i++) {
          waterBubbles.push({
            x: (i * 137) % WORLD_W,
            depth: 20 + ((i * 53) % 90),
            speed: 12 + (i % 5) * 6,
            size: 2 + (i % 3) * 1.5,
            phase: i * 0.9,
          });
        }
        const waterFish = [];
        for (let i = 0; i < 5; i++) {
          waterFish.push({
            baseX: (i * 340 + 120) % WORLD_W,
            depth: 40 + ((i * 71) % 70),
            speed: 26 + (i % 3) * 10,
            dir: i % 2 === 0 ? 1 : -1,
            phase: i * 1.3,
          });
        }

        const snowfallParticles = [];
        for (let i = 0; i < 60; i++) {
          snowfallParticles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: 1.5 + Math.random() * 2.5,
            speedY: 25 + Math.random() * 25,
            speedX: -15 - Math.random() * 20,
          });
        }

        const waterIceChunks = [];
        for (let i = 0; i < 6; i++) {
          waterIceChunks.push({

            a.y < b.y + b.h &&

          return {

        let activeOverlay = null;
        let cutsceneTimer = null;

        function showIntro() {
          GOGUi.say(
            "Help Penny rescue the chicks and bring them home to the safe iceberg! 🐧",
          );
          activeOverlay = GOGUi.showOverlay({
            accent: "var(--gog-lime)",
            title: "🐧 Penny on Thin Ice",
            body: "Penny wakes in a warming polar dream. The floating ice shrinks faster when she stands still, so keep hopping, cool the valve, rescue chicks, and bring them home to the safe iceberg.<br><br><strong>Move:</strong> Arrow keys / WASD or touch buttons.<br><strong>Jump:</strong> Up / W / Space.<br><strong>Cool Valve:</strong> Stand near the valve, press E (or tap ☸️).<br><strong>Rescue Chick:</strong> Stand near a chick, press E (or tap ☸️) to pick them up.",

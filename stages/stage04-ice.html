<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Penny on Thin Ice — Guardians of Gaia</title>
    <link rel="stylesheet" href="../src/styles.css" />
    <style>
      :root {
        --gog-frame-aspect: 1.33333; /* 800x600 canvas: keeps the frame 4:3 on short windows */
      }
      /* Page shell (HUD, title, meters, chips, buttons, canvas-frame base, the
         <=1200px compact HUD) lives in src/styles.css — only stage colours and
         stage-only widgets are styled here. */
      .stage-title small {
        color: #4d5c37;
      }
      .meter-track {
        background: #d8e8f5;
      }
      .meter-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #3dd6c0, #2e5ee8);
        transition: width 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      .timer-chip {
        position: relative;
      }
      .timer-chip::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: inherit;
        box-shadow: 0 0 16px rgba(232, 46, 93, 0.65);
        opacity: 0;
        pointer-events: none;
        z-index: -1;
      }
      .timer-chip.timer-urgent {
        animation: timerPulseScale 0.8s ease-in-out infinite;
        color: #e82e5d;
      }
      .timer-chip.timer-urgent::after {
        animation: timerPulseGlow 0.8s ease-in-out infinite;
      }
      @keyframes timerPulseScale {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.14);
        }
      }
      @keyframes timerPulseGlow {
        0%,
        100% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
      }
      /* Low-warmth warning: a hard-edged red ring INSIDE the frame whose
         opacity pulses (replaces an animated blurred box-shadow that repainted
         the whole frame every tick). */
      .canvas-frame::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        box-shadow: inset 0 0 0 7px rgba(239, 68, 68, 0.8);
        opacity: 0;
        pointer-events: none;
        z-index: 12;
      }
      @keyframes warmthPulse {
        0%,
        100% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
      }
      .canvas-frame.warmth-danger::after {
        animation: warmthPulse 1.1s ease-in-out infinite;
      }
      /* The touch pad is not a mouse game: keep the plain arrow cursor */
      .canvas-frame canvas {
        cursor: default;
      }
      /* On-screen controls: walk pad bottom-left, Grab/Jump bottom-right.
         Every button carries a word as well as an icon, so nothing is a
         mystery symbol (the old ☸️ button had no label at all). */
      .controls {
        position: absolute;
        inset: auto 10px 10px 10px;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        pointer-events: none;
        z-index: 10;
        /* Base button size. Where container units exist it scales with the
           frame (below) so the pad never swallows a small frame. */
        --ctl: 62px;
      }
      @media (max-width: 700px) {
        .controls {
          --ctl: 52px;
        }
      }
      @supports (width: 1cqw) {
        #canvasFrame {
          container-type: inline-size;
        }
        /* 48px on small frames (mouse / keyboard users), up to 62px on big
           ones; touch screens never go below 52px. */
        .controls {
          --ctl: clamp(48px, 7.2cqw, 62px);
        }
        @media (pointer: coarse) {
          .controls {
            --ctl: clamp(52px, 8.4cqw, 62px);
          }
        }
      }
      .pad {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        pointer-events: auto;
      }
      .ctrl-btn {
        position: relative;
        width: var(--ctl);
        height: var(--ctl);
        padding: 0;
        border: 3px solid var(--gog-ink);
        background: #fff;
        box-shadow: 4px 4px 0 var(--gog-ink);
        border-radius: 18px;
        color: var(--gog-ink);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 1;
        user-select: none;
        touch-action: none;
        cursor: pointer;
        opacity: 0.95;
        transition:
          transform 0.08s,
          box-shadow 0.08s;
      }
      .ctrl-btn .ico {
        font-size: calc(var(--ctl) * 0.39);
        font-weight: 900;
      }
      .ctrl-btn .cap {
        margin-top: 3px;
        font-family: var(--gog-font-head);
        font-size: max(9px, calc(var(--ctl) * 0.18));
        font-weight: 800;
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }
      .ctrl-btn:active {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--gog-ink);
      }
      .ctrl-btn.jump {
        width: calc(var(--ctl) * 1.2);
        height: calc(var(--ctl) * 1.2);
        background: var(--gog-lavender);
      }
      .ctrl-btn.act {
        width: calc(var(--ctl) * 1.35);
        height: calc(var(--ctl) * 1.35);
        border-radius: 50%;
        background: var(--gog-lime);
      }
      .ctrl-btn.act .ico {
        font-size: calc(var(--ctl) * 0.52);
      }
      /* "Something to grab / spin is in reach" and the guided-coach highlight:
         the button scales (compositor-only) and a hard lime ring fades in. */
      .ctrl-btn::after {
        content: "";
        position: absolute;
        inset: -3px;
        border-radius: inherit;
        box-shadow: 0 0 0 7px var(--gog-lime);
        opacity: 0;
        pointer-events: none;
      }
      .ctrl-btn.ready,
      .ctrl-btn.coach-pulse {
        animation: ctrlPulse 0.85s ease-in-out infinite;
      }
      .ctrl-btn.ready::after,
      .ctrl-btn.coach-pulse::after {
        animation: ctrlRing 0.85s ease-in-out infinite;
      }
      @keyframes ctrlPulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }
      @keyframes ctrlRing {
        0%,
        100% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
      }

      body {
        position: relative;
      }

      .page-bg {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
        background:
          radial-gradient(
            ellipse at 50% -8%,
            #efffdd 0%,
            #d4f0bd 42%,
            #fdf6e6 100%
          ),
          linear-gradient(
            180deg,
            rgba(60, 135, 67, 0.1),
            rgba(36, 99, 55, 0.16)
          );
      }

      .page-bubble {
        position: absolute;
        bottom: -10vh;
        border-radius: 999px;
        background: radial-gradient(
          circle at 32% 28%,
          rgba(255, 255, 255, 0.95),
          rgba(201, 242, 61, 0.14) 70%
        );
        opacity: 0;
        animation: pageBubbleRise linear infinite;
      }

      @keyframes pageBubbleRise {
        0% {
          transform: translateY(0) translateX(0);
          opacity: 0;
        }
        8% {
          opacity: 0.5;
        }
        90% {
          opacity: 0.35;
        }
        100% {
          transform: translateY(-125vh) translateX(var(--drift, 24px));
          opacity: 0;
        }
      }

      .page-fx {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        opacity: 0;
      }

      /* Phone portrait: the Warmth meter's snowflake label is long, so give it
         its own HUD row instead of letting it collide with the chips */
      @media (max-width: 768px) and (orientation: portrait) {
        #warmthMeter {
          flex: 1 1 100% !important;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .page-bubble {
          animation: none;
          opacity: 0;
        }
      }
    </style>
  </head>

    <script>
      (() => {
        const canvas = document.getElementById("game");
        // Phone portrait: canvas fills the screen (see GOGEngine.fitCanvasToScreen)
        GOGEngine.fitCanvasToScreen(canvas, document.getElementById("canvasFrame"));
        let ctx = canvas.getContext("2d"); // swapped by withCtx() while baking

        // Logical play-field size. The canvas bitmap is sized to the pixels
        // actually on screen (see GOGEngine.fitCanvas) so art stays crisp, but
        // all game code keeps drawing in these logical coordinates: 800x600, or on
        // a phone held upright a narrower view of the same height (the canvas aspect
        // follows the full-screen frame, so nothing is stretched).
        const VIEW_W = canvas.width;
        const VIEW_H = 600;
        let backdropDirty = true; // rebuild the pre-rendered backdrop after a resize
        // Every cached raster below (backdrop strips, sky, emoji, sprite frames,
        // floes) is baked at the on-screen bitmap scale; a resize that changes the
        // scale just bumps this and each cache rebuilds lazily on its next use.
        let rasterEpoch = 0;
        const hiDpi = GOGEngine.fitCanvas(canvas, ctx, VIEW_W, VIEW_H, {
          onResize: function () {
            backdropDirty = true;
            rasterEpoch++;
          },
        });

        const STAGE_ID = "stage04";
        const stageMeta = GOGContent.byId(STAGE_ID);
        let save = GOGSave.load();
        const diff = GOGProgress.difficulty(STAGE_ID);
        let calmMode = !!save.settings.calmMode;

        const audio = new GOGEngine.Audio(!save.settings.sound);
        audio.initBgm("assets/audio/stage04/stage_4.mp3");

        const ui = {
          warmFill: document.getElementById("warmFill"),
          warmthText: document.getElementById("warmthText"),
          warmthLabel: document.getElementById("warmthLabel"),
          rescuedText: document.getElementById("rescuedChip"),
          timerText: document.getElementById("timerChip"),
          iceText: document.getElementById("iceChip"),
          seaText: document.getElementById("seaChip"),
          muteBtn: document.getElementById("muteBtn"),
          calmBadge: document.getElementById("calmBadge"),
          guideText: document.getElementById("guideText"),
          canvasFrame: document.getElementById("canvasFrame"),
          helpBtn: document.getElementById("helpBtn"),
          actionBtn: document.getElementById("actionBtn"),
          actionIco: document.getElementById("actionIco"),
          actionCap: document.getElementById("actionCap"),
        };

        function syncMuteBtn() {
          if (ui.muteBtn) {
            ui.muteBtn.textContent = audio.muted ? "🔇" : "🔈";
          }
        }
        syncMuteBtn();

        if (ui.muteBtn) {
          ui.muteBtn.addEventListener("click", () => {
            const nowMuted = !audio.muted;
            audio.setMuted(nowMuted);
            syncMuteBtn();
            GOGSave.patch({ settings: { sound: !nowMuted } });
          });
        }

        // Preload and monitor state animations
        const spriteSheets = {
          idle: {
            img: new Image(),
            src: "assets/sprites/stage04/penny_idle.png",
            cols: 3,
            rows: 1,
            loaded: false,
            frameW: 0,
            frameH: 0,
          },
          running: {
            img: new Image(),
            src: "assets/sprites/stage04/penny_running.png",
            cols: 5,
            rows: 1,
            loaded: false,
            frameW: 0,
            frameH: 0,
          },
          jump: {
            img: new Image(),
            src: "assets/sprites/stage04/penny_jump.png",
            cols: 3,
            rows: 1,
            loaded: false,
            frameW: 0,
            frameH: 0,
          },
        };

        // A sheet counts as loaded only once it is decoded, so the first frame
        // that uses it never pays for a synchronous decode in the middle of play.
        function whenDecoded(img, done) {
          if (img.decode) img.decode().then(done, done);
          else done();
        }

        Object.keys(spriteSheets).forEach((key) => {
          const sheet = spriteSheets[key];
          sheet.key = key;
          sheet.img.onload = function () {
            sheet.frameW = sheet.img.naturalWidth / sheet.cols;
            sheet.frameH = sheet.img.naturalHeight / sheet.rows;
            whenDecoded(sheet.img, function () {
              sheet.loaded = true;
              GOGEngine.requestDraw();
            });
          };
          sheet.img.src = sheet.src;
        });

        // Baby-chick sheet (3x2): 0 open eyes, 1 flat/worried eyes, 2 eyes shut,
        // 3 open eyes (arms down), 4-5 hop/step. Distinct from Penny's own
        // sheet so a chick never reads as a miniature Penny.
        const chickSprite = {
          img: new Image(),
          src: "assets/sprites/stage04/penny_chicks_idel.png",
          cols: 3,
          rows: 2,
          loaded: false,
          frameW: 0,
          frameH: 0,
        };
        chickSprite.key = "chick";
        chickSprite.img.onload = function () {
          chickSprite.frameW = chickSprite.img.naturalWidth / chickSprite.cols;
          chickSprite.frameH = chickSprite.img.naturalHeight / chickSprite.rows;
          whenDecoded(chickSprite.img, function () {
            chickSprite.loaded = true;
            GOGEngine.requestDraw();
          });
        };
        chickSprite.img.src = chickSprite.src;

        const penguinAnim = {
          frameIndex: 0,
          elapsed: 0,
          fps: 7,
        };

        // Determine active dynamic animation state sheet
        function getActiveSpriteSheet() {
          if (!state) return spriteSheets.idle;
          if (state.state === "failed") {
            return spriteSheets.jump; // Return jump sheet because it has the crying frame
          }
          const p = state.player;
          if (!p.onGround) {
            return spriteSheets.jump;
          } else if (Math.abs(p.vx) > 15) {
            return spriteSheets.running;
          }
          return spriteSheets.idle;
        }

        let lastActiveSheet = null;
        let idleTimer = 0;

        function updatePenguinAnim(dt) {
          const sheet = getActiveSpriteSheet();
          if (sheet !== lastActiveSheet) {
            penguinAnim.frameIndex = 0;
            penguinAnim.elapsed = 0;
            lastActiveSheet = sheet;
          }

          if (sheet === spriteSheets.idle) {
            idleTimer += dt;
            // Realistic idle cycle (4 seconds):
            // 0s to 3s: Stand still looking forward (Frame 0)
            // 3s to 3.15s: Quick blink (Frame 2)
            // 3.15s to 3.5s: Stand still looking forward (Frame 0)
            // 3.5s to 4.0s: Warm happy smile (Frame 1)
            const cycleTime = idleTimer % 4.0;
            if (cycleTime < 3.0) {
              penguinAnim.frameIndex = 0;
            } else if (cycleTime < 3.15) {
              penguinAnim.frameIndex = 2; // Blink
            } else if (cycleTime < 3.5) {
              penguinAnim.frameIndex = 0;
            } else {
              penguinAnim.frameIndex = 1; // Smile
            }
          } else if (sheet === spriteSheets.running) {
            const p = state.player;
            // Dynamically scale running animation speed based on velocity
            const fps = Math.max(6, Math.abs(p.vx) * 0.07);
            penguinAnim.elapsed += dt;
            var frameTime = 1 / fps;
            const totalFrames = sheet.cols * sheet.rows;

            while (penguinAnim.elapsed >= frameTime) {
              penguinAnim.elapsed -= frameTime;
              penguinAnim.frameIndex = (penguinAnim.frameIndex + 1) % totalFrames;
            }
          } else {
            // Jump sheet frames (crying/soaring/sliding) are physics-selected in drawPlayer
            penguinAnim.frameIndex = 0;
          }
        }

        const WORLD_W = 2000;
        const WORLD_H = 600;
        const CAMERA_LERP = 0.12;
        const TARGET_RESCUES = 5;
        const STAGE_DURATION = GOGConstants.STAGE4.gameTime;
        // The polluted shore that closes the level on the right: a solid rocky
        // island the factory stands on, so the world ends in a place instead
        // of an empty edge of sea.
        const SHORE = { x: 1815, y: 430, w: 260, h: 190 };
        // Slab look: the walkable top sits at platform.y; a thin snow lip is
        // drawn there and feet are planted FOOT_SINK px into it so characters
        // read as standing ON the slab (not behind it). The sprites carry a few
        // px of empty padding under the feet, hence the larger number.
        const SLAB_LIP = 9;
        const SLAB_DEPTH = 14;
        const FOOT_SINK = 9;
        const CHICK_W = 48; // on-screen width of a baby chick (Penny herself is 72)

        const clouds = [
          // Far/Back clouds (slow, semi-transparent)
          { x: 80, y: 60, scale: 0.6, speed: 3, layer: "back" },
          { x: 300, y: 90, scale: 0.7, speed: 4, layer: "back" },
          { x: 580, y: 50, scale: 0.5, speed: 2.5, layer: "back" },
          { x: 780, y: 80, scale: 0.65, speed: 3.5, layer: "back" },

          // Near/Front clouds (faster, outline style)
          { x: 160, y: 110, scale: 0.9, speed: 8, layer: "front" },
          { x: 620, y: 145, scale: 1.15, speed: 6, layer: "front" },
          { x: 390, y: 80, scale: 0.7, speed: 10, layer: "front" },
        ];

        // Fixed-size ambient water dressing — positions/phases are set once
        // and animated purely from state.time, so drawWater never has to
        // allocate or push/pop arrays every frame.
        const waterBubbles = [];
        for (let i = 0; i < 14; i++) {
          waterBubbles.push({
            x: (i * 137) % WORLD_W,
            depth: 20 + ((i * 53) % 90),
            speed: 12 + (i % 5) * 6,

        const TAU = Math.PI * 2;

        // font-family list on every call). outlined=true is drawEmoji's inked look;
        // false is the plain particle emoji. Bitmap is centred on (x, y) like the text was.
        function emojiSprite(glyph, size, outlined) {
          if (emojiEpoch !== rasterEpoch) {
            for (const k in emojiCache) delete emojiCache[k];
            emojiEpoch = rasterEpoch;
          }
          const key = glyph + "|" + size + "|" + (outlined ? 1 : 0);
          let c = emojiCache[key];
          if (c) return c;
          const box = Math.ceil(size * 2 + 8);
          c = GOGEngine.bake(
            box,
            box,
            function (g) {
              g.textAlign = "center";
              g.textBaseline = "middle";
              g.fillStyle = "#111";
              if (outlined) {
                g.font = size + 'px "Segoe UI Emoji", "Apple Color Emoji", Arial';
                g.lineWidth = 3;
                g.strokeStyle = "#111";
                g.strokeText(glyph, box / 2, box / 2);
              } else {
                g.font = size + "px Arial";
              }
              g.fillText(glyph, box / 2, box / 2);
            },
            hiDpi.scale,
          );
          emojiCache[key] = c;
          return c;
        }

        const frameCache = {};
        let frameEpoch = -1;
        // One sprite-sheet frame scaled ONCE (high quality) to its draw size at the
        // bitmap scale, so each frame is a 1:1 blit instead of a 4-12x downscale of
        // the whole sheet. Draw it with ctx.drawImage(c, -c.gw / 2, -c.gh, c.gw, c.gh).
        function frameSprite(sheet, frame, destW) {
          if (frameEpoch !== rasterEpoch) {
            for (const k in frameCache) delete frameCache[k];
            frameEpoch = rasterEpoch;
          }
          const key = sheet.key + ":" + frame + ":" + destW;
          let c = frameCache[key];
          if (c) return c;
          const s = hiDpi.scale;
          const destH = (sheet.frameH / sheet.frameW) * destW;
          const dw = Math.max(1, Math.round(destW * s));
          const dh = Math.max(1, Math.round(destH * s));
          c = document.createElement("canvas");
          c.width = dw;
          c.height = dh;
          const g = c.getContext("2d");
          g.imageSmoothingEnabled = true;
          if ("imageSmoothingQuality" in g) g.imageSmoothingQuality = "high";
          g.drawImage(
            sheet.img,
            (frame % sheet.cols) * sheet.frameW,
            Math.floor(frame / sheet.cols) * sheet.frameH,
            sheet.frameW,
            sheet.frameH,
            0,
            0,
            dw,
            dh,
          );
          c.gw = dw / s;
          c.gh = dh / s;
          frameCache[key] = c;
          return c;
        }

        // Warmth (0..1) goes through WSTEPS quantised steps; every colour that used
        // to be lerped + re-parsed per frame is looked up in a precomputed ramp.
        const WSTEPS = 64;
        const hexParts = {};
        function parseHex(hex) {
          let v = hexParts[hex];
          if (v) return v;
          const h = hex.replace("#", "");
          v =
            h.length === 3
              ? [parseInt(h[0] + h[0], 16), parseInt(h[1] + h[1], 16), parseInt(h[2] + h[2], 16)]
              : [parseInt(h.substring(0, 2), 16), parseInt(h.substring(2, 4), 16), parseInt(h.substring(4, 6), 16)];
          hexParts[hex] = v;
          return v;
        }
        function lerpColor(c1, c2, pct) {
          const rgb1 = parseHex(c1);
          const rgb2 = parseHex(c2);
          const r = Math.round(rgb1[0] + (rgb2[0] - rgb1[0]) * pct);
          const g = Math.round(rgb1[1] + (rgb2[1] - rgb1[1]) * pct);
          const b = Math.round(rgb1[2] + (rgb2[2] - rgb1[2]) * pct);
          return "rgb(" + r + ", " + g + ", " + b + ")";
        }
        function makeRamp(c1, c2) {
          const ramp = [];
          for (let i = 0; i <= WSTEPS; i++) ramp.push(lerpColor(c1, c2, i / WSTEPS));
          return ramp;
        }

          return Math.round((w < 0 ? 0 : w > 1 ? 1 : w) * WSTEPS);

            const sx = toScreen(b.x + b.w / 2);
            if (sx < 40) {
              GOGCoach.tag(ctx, 90, b.y - 60, "◀ Safe iceberg");
            } else {
              GOGCoach.arrow(ctx, sx, b.y - 128, t, "down");
              GOGCoach.tag(ctx, sx, b.y - 196, "Bring it here!");
            }
          } else if (coach.index === 4) {
            const v = state.valve;
            const sx = toScreen(v.x);
            if (sx > VIEW_W - 30) {
              GOGCoach.tag(ctx, VIEW_W - 80, v.y - 40, "Valve this way ▶");
            } else if (sx < 40) {
              GOGCoach.tag(ctx, 80, v.y - 40, "◀ Valve");
            } else {
              GOGCoach.arrow(ctx, sx, v.y - 56, t, "down");
              GOGCoach.tag(ctx, sx, v.y - 124, "Tap Spin here!");
            }
          }
          ctx.restore();
        }

        // Splashing during the lesson is only a gentle do-over: Penny hops
        // back to the safe iceberg and any chick she was carrying goes back
        // to its floe.
        function respawnPenny() {
          const p = state.player;
          p.carrying.forEach(function (c) {
            const pl = state.meltPlatforms[c.platformIndex];
            c.rescued = false;
            c.vy = 0;
            c.x = c.baseX;
            c.y = (pl ? pl.baseY : 380) - 18;
          });
          p.carrying = [];
          p.x = p.spawnX;
          p.y = p.spawnY;
          p.vx = 0;
          p.vy = 0;
          p.onGround = false;
          cameraX = 0;
          spawnFloatText(p.x + 20, p.y - 40, "Whoops! Try again 💙", "#2e5ee8");
          audio.blip(300, 80);
        }

        function update(dt) {
          if (!state || state.state === "failed") return;

          state.time += dt;
          updatePenguinAnim(dt);
          const p = state.player;
          const wasOnGround = p.onGround;
          // Guided intro: while the coach is teaching, the clock, warming, sea
          // rise and melting all wait, so nobody can lose the lesson.
          const learning = coach.active;

          // Update snowfall particles (screen-relative)
          for (const s of snowfallParticles) {
            s.y += s.speedY * dt;
            s.x += s.speedX * dt;
            if (s.y > VIEW_H) {
              s.y = -10;
              s.x = Math.random() * VIEW_W;
            }
            if (s.x < -10) {
              s.x = VIEW_W + 10;
              s.y = Math.random() * VIEW_H;
            }
          }

          if (state.state === "won") {
            state.endTimer += dt;
            
            // Phase 1 (0s to 1.5s): Recede sea level, freeze valve, blow wind
            if (state.endTimer <= 1.5) {
              state.seaLevel = Math.min(560, state.seaLevel + 120 * dt);
              state.warmth = Math.max(0, state.warmth - 0.7 * dt);
              state.valve.frozen = true;
              
              if (Math.random() < 0.15) {
                state.particles.push({
                  x: VIEW_W + Math.random() * 200,
                  y: 100 + Math.random() * 400,
                  vx: -350 - Math.random() * 200,
                  vy: (Math.random() - 0.5) * 10,
                  life: 2.0,
                  maxLife: 2.0,
                  kind: "wind",
                  color: "rgba(200, 245, 255, 0.55)",
                  size: 60 + Math.random() * 60,
                });
              }
            }
            // Phase 2 (1.5s to 3.5s): Reform ice platforms
            else if (state.endTimer <= 3.5) {
              for (const pl of state.meltPlatforms) {
                pl.gone = false;
                pl.shrink = Math.max(0, pl.shrink - 180 * dt);
                pl.w = pl.baseW - pl.shrink;
                pl.y = pl.baseY || pl.y;
              }
            }
            // Phase 3 (3.5s to 5.5s): Sparkles and dance
            else if (state.endTimer <= 5.5) {
              if (Math.random() < 0.25) {
                state.particles.push({
                  x: state.stableBase.x + Math.random() * state.stableBase.w,
                  y: state.stableBase.y - 30 - Math.random() * 40,
                  vx: (Math.random() - 0.5) * 15,
                  vy: -15 - Math.random() * 20,
                  life: 1.0,
                  maxLife: 1.0,
                  kind: "emoji",
                  text: "✨",
                  size: 12,
                });
              }
            }

            p.vx *= 0.92;
            p.vy += p.gravity * dt * 0.25;
            movePlayer(p, dt, true);

            if (state.endTimer > 5.5 && !winWiping && !winWipeDone) {
              let stars = 1;
              if (!calmMode) {
                if (state.warmth <= 0.25) stars = 3;
                else if (state.warmth <= 0.6) stars = 2;
              }
              pendingStars = stars;
              winWipeRadius = 0;
              winWiping = true;
            }
            if (winWiping) {
              winWipeRadius += dt * winWipeMax * 1.6;
              if (winWipeRadius >= winWipeMax) {
                winWiping = false;
                winWipeDone = true;
                finishWinIce();
              }
            }
            updateUI();
            updateParticles(dt);
            updateFloatingTexts(dt);
            return;
          }

          // Game loop countdown
          if (!learning) state.timeLeft = Math.max(0, state.timeLeft - dt);
          if (state.timeLeft <= 0) {
            failGame("Time is up! Try to rescue the chicks faster next time.");
            return;
          }

          const warmingRate = (calmMode || learning
            ? 0
            : state.coolingTimer > 0
              ? 0.005
              : 0.012) * diff.enemySpeedMul();
          state.warmth = clamp(state.warmth + warmingRate * dt, 0, 1);
          if (!valveTipShown && !learning && state.warmth >= 0.35) {
            valveTipShown = true;
            GOGUi.say("The ice is getting warm! Run to the SPIN VALVE and tap SPIN ☸️ to cool it ❄️");
          }
          if (state.warmth > 0.8 && (STAGE_DURATION - state.timeLeft) < 15 && !diff.softClutched) {
            diff.softClutch();
          }
          if (state.coolingTimer > 0) {
            state.coolingTimer = Math.max(0, state.coolingTimer - dt);
            state.valve.activeFlash = Math.max(
              0,
              state.valve.activeFlash - dt * 1.7,
            );
          }
          state.valve.pulse += dt;

          const seaRise = calmMode || learning ? 0 : 1.5 + state.warmth * 5;
          state.seaLevel = clamp(state.seaLevel - seaRise * dt, 368, 560);

          // Update fish jump timer
          if (state.fishJumpTimer > 0) {
            state.fishJumpTimer -= dt;
          }

          // Check if standing on melting ice to apply slippage
          let onIce = false;
          const under = findUnder(p, getSolids(), 4);
          if (under && under.drift !== undefined) {
            onIce = true;
          }

          // T049: Penny's belly slide — held while grounded, gives +50% speed
          // and slicker (reduced) friction; automatically ends the instant
          // she leaves the ground or lets go of the slide control.
          const isSliding = !!(input.slide && p.onGround);
          const slideSpeedMul = isSliding ? 1.5 : 1;
          const accel = p.speed * dt * slideSpeedMul;
          if (input.left) {
            p.vx -= accel;
            p.facing = -1;
          }
          if (input.right) {
            p.vx += accel;
            p.facing = 1;
          }
          if (!input.left && !input.right) {
            const currentDrag = onIce ? (0.94 - (0.94 - p.drag) * diff.gentleness()) : p.drag;
            // Reduced friction while sliding: drag pushed closer to 1 (slower decay).
            const slideDrag = isSliding ? currentDrag + (1 - currentDrag) * 0.5 : currentDrag;
            p.vx *= Math.pow(slideDrag, dt * 60);
            if (Math.abs(p.vx) < 3) p.vx = 0;
          }
          p.vx = clamp(p.vx, -p.maxSpeed * slideSpeedMul, p.maxSpeed * slideSpeedMul);

          if (isSliding && !p.wasSliding) {
            audio.tone(520, 0.3, "sine", 0.06, 180); // slick whoosh SFX
            spawnBurst(p.x + p.w / 2, p.y + p.h, 10, "#DCEFFF");
          }
          if (isSliding && Math.abs(p.vx) > 20) {
            p.slideTrailTimer = (p.slideTrailTimer || 0) - dt;
            if (p.slideTrailTimer <= 0) {
              p.slideTrailTimer = 0.06;
              state.particles.push({
                x: p.x + p.w / 2 - p.facing * 10,
                y: p.y + p.h - 2,
                vx: -p.facing * 20,
                vy: 0,
                life: 0.4,
                maxLife: 0.4,
                kind: "snow",
                color: "#EAF7FF",
                size: 3,
              });
            }
          }
          p.wasSliding = isSliding;
          p.isSliding = isSliding;

          if (input.jumpPressed && p.onGround) {
            p.vy = -p.jumpPower;
            p.onGround = false;
            coachJumped = true;
            audio.blip(320, 60);
            spawnBurst(p.x + p.w / 2, p.y + p.h, 8, "#8FD3FF");
          }
          input.jumpPressed = false;

          p.vy += p.gravity * dt;

          updatePlatforms(dt);
          updateWaterLift(dt);
          movePlayer(p, dt, false);
          updateChicks(dt);
          updateCoach();
          updateValve(dt);
          updateParticles(dt);
          updateFloatingTexts(dt);
          updateCamera(dt);
          updateUI();

          // Spawning footprints when running on ice
          if (p.onGround && Math.abs(p.vx) > 30 && onIce) {
            if (!p.stepTimer) p.stepTimer = 0;
            p.stepTimer -= dt;
            if (p.stepTimer <= 0) {
              p.stepTimer = 0.22;
              state.particles.push({
                x: p.x + p.w / 2 + (p.facing === 1 ? -12 : 6),
                y: p.y + p.h - 2,
                vx: 0,
                vy: 0,
                life: 1.5,
                maxLife: 1.5,
                kind: "footprint",
                color: "rgba(100, 150, 200, 0.45)",
              });
            }
          }

          // Handle landing footprints & snow puff
          if (p.onGround && !wasOnGround) {
            spawnBurst(p.x + p.w / 2, p.y + p.h, 6, "#E4F7FF");
            if (onIce) {
              state.particles.push({
                x: p.x + p.w / 2 - 8,
                y: p.y + p.h - 2,
                vx: 0,
                vy: 0,
                life: 2.0,
                maxLife: 2.0,
                kind: "footprint",
                color: "rgba(100, 150, 200, 0.5)",
              });
              state.particles.push({
                x: p.x + p.w / 2 + 2,
                y: p.y + p.h - 2,
                vx: 0,
                vy: 0,
                life: 2.0,
                maxLife: 2.0,
                kind: "footprint",
                color: "rgba(100, 150, 200, 0.5)",
              });
            }
          }

          // Spawning carried chick emojis (hearts/sparkles)
          if (p.carrying && p.carrying.length > 0) {
            if (!p.carryHeartTimer) p.carryHeartTimer = 0;
            p.carryHeartTimer -= dt;
            if (p.carryHeartTimer <= 0) {
              p.carryHeartTimer = 0.5;
              state.particles.push({
                x: p.x + p.w / 2 + p.facing * 16 + (Math.random() - 0.5) * 10,
                y: p.y + p.h - 55,
                vx: (Math.random() - 0.5) * 15,
                vy: -35 - Math.random() * 20,
                life: 1.0,
                maxLife: 1.0,
                kind: "emoji",
                text: Math.random() < 0.65 ? "❤️" : "✨",
                size: 13,
              });
            }
          }

          const inWater = p.y + p.h >= state.seaLevel;
          const onSolid = p.onGround;
          const deeplySubmerged = inWater && state.seaLevel < p.y + p.h - 16;
          if (p.y > WORLD_H + 120 || (inWater && !onSolid) || deeplySubmerged) {
            if (learning) {
              // Splashing during the lesson is just a gentle do-over.
              respawnPenny();
              return;
            }
            failGame(
              "Penny splashed into the rising water. Try a faster route and cool the valve sooner.",
            );
            return;
          }
        }

        const AMBIENT_PARTICLE_CAP = 40;

        function updatePlatforms(dt) {
          const p = state.player;
          p.onCriticalIce = false;
          for (const pl of state.meltPlatforms) {
            if (pl.glowTimer > 0) pl.glowTimer -= dt;
            if (pl.baseY === undefined) pl.baseY = pl.y;

            if (pl.gone) {
              pl.refreezeTimer = (pl.refreezeTimer || 0) + dt;
              if (pl.refreezeTimer > 4.0) {
                pl.gone = false;
                pl.shrink = 0;
                pl.w = pl.baseW;
                pl.y = pl.baseY;
                pl.refreezeTimer = 0;
                pl.cachedCrackStage = -1;
                spawnBurst(pl.x + pl.baseW / 2, pl.y + 6, 8, "#A0E0FF");
              }
              continue;
            }

            if (pl.meltingState === "sinking") {
              pl.sinkTimer -= dt;
              pl.y += 45 * dt;
              
              if (Math.random() < 0.25) {
                state.particles.push({
                  x: pl.x + Math.random() * pl.w,
                  y: pl.y + pl.h,
                  vx: 0,
                  vy: 35,
                  life: 0.5,
                  maxLife: 0.5,
                  color: "#6FB6E8",
                  size: 3,
                  kind: "drip",
                });
              }
              
              if (pl.sinkTimer <= 0) {
                pl.gone = true;
                pl.meltingState = null;
                pl.meltStage = 0;
                state.meltedCount += 1;
                spawnBurst(pl.x + pl.w / 2, state.seaLevel, 16, "#E4F7FF");
                audio.blip(100, 160);
              }
              continue;
            }

            pl.t = (pl.t || 0) + dt;
            pl.y += Math.sin(state.time * 0.55 + pl.phase) * 4 * dt;
            
            const meltRatioNow = 1 - pl.w / pl.baseW;
            pl.rot =
              Math.sin(state.time * 0.4 + pl.phase) *
              0.045 *
              (1 + meltRatioNow);

            const topBand = {
              x: pl.x + pl.shrink * 0.5,
              y: pl.y,
              w: pl.baseW - pl.shrink,
              h: pl.h,
            };

            const standing =
              p.onGround &&
              p.vy >= -10 &&
              p.x + p.w > topBand.x + 8 &&
              p.x < topBand.x + topBand.w - 8 &&
              Math.abs(p.y + p.h - topBand.y) < 8;
            const meltRate = coach.active
              ? 0
              : (calmMode
                  ? standing
                    ? 1
                    : 0
                  : 0.1 +
                    state.warmth * 0.4 +
                    (standing ? 3 + state.warmth * 5 : 0)) * diff.enemySpeedMul();
            pl.shrink += meltRate * dt;
            pl.w = Math.max(48, pl.baseW - pl.shrink);

            const meltRatio = 1 - pl.w / pl.baseW;
            if (standing && meltRatio > 0.55) p.onCriticalIce = true;

            const stage =
              meltRatio < 0.15
                ? 1
                : meltRatio < 0.35
                  ? 2
                  : meltRatio < 0.52
                    ? 3
                    : meltRatio < 0.68
                      ? 4
                      : 5;
            if (stage > (pl.meltStage || 0)) {
              pl.meltStage = stage;
              if (stage >= 2) audio.blip(200 - stage * 12, 70);
              if (stage === 4) {
                for (let k = 0; k < 6; k++) {
                  state.particles.push({
                    x: pl.x + Math.random() * pl.w,
                    y: pl.y + 4,
                    vx: (Math.random() - 0.5) * 30,
                    vy: -10 - Math.random() * 20,
                    life: 0.9,
                    maxLife: 0.9,
                    color: "#DDF6FF",
                    size: 4 + Math.random() * 4,
                  });
                }
              }
            }

            if (state.particles.length < AMBIENT_PARTICLE_CAP) {
              pl.snowTimer -= dt;
              if (pl.snowTimer <= 0) {
                pl.snowTimer = 1.4 + Math.random() * 1.2;
                state.particles.push({
                  x: pl.x + Math.random() * pl.w,
                  y: pl.y + 4,
                  vx: (Math.random() - 0.5) * 10,
                  vy: 6 + Math.random() * 8,
                  life: 1.2,
                  maxLife: 1.2,
                  color: "#ffffff",
                  size: 2 + Math.random() * 2,
                  kind: "snow",
                });
              }
              pl.dripTimer -= dt * (1 + meltRatio * 2);
              if (pl.dripTimer <= 0 && meltRatio > 0.25) {
                pl.dripTimer = 0.9 + Math.random() * 0.7;
                state.particles.push({
                  x: pl.x + pl.w * 0.5 + (Math.random() - 0.5) * pl.w * 0.6,
                  y: pl.y + pl.h,
                  vx: 0,
                  vy: 30,
                  life: 0.5,
                  maxLife: 0.5,
                  color: "#6FB6E8",
                  size: 3,
                  kind: "drip",
                });
              }
            }

            if (pl.shrink > pl.baseW - 42) {
              // NEW: never let the last safe platform disappear — if every
              // other floe is already gone or mid-sink, hold this one right
              // at the brink instead of letting it vanish too.
              const otherSafeCount = state.meltPlatforms.filter(
                (o) => o !== pl && !o.gone && o.meltingState !== "sinking",
              ).length;
              if (otherSafeCount === 0) {
                pl.shrink = pl.baseW - 42;
              } else {
                pl.meltingState = "sinking";
                pl.sinkTimer = 1.0;
                if (standing) {
                  p.onGround = false;
                }
              }
            }
          }
        }

        // T051: friendly seal lift — surfaces on a cycle and becomes a real,
        // rideable solid while surfaced; submerges again afterward. Purely
        // additive to the existing floe path, so it can only help, not block.
        function updateWaterLift(dt) {
          const wl = state.waterLift;
          if (!wl) return;
          const wasSurfaced = wl.surfaced;
          wl.phase = (wl.phase + dt) % wl.cycle;
          wl.surfaced = wl.phase < wl.surfaceFor;
          const bob = wl.surfaced ? Math.sin(state.time * 3) * 3 : 0;
          wl.y = state.seaLevel - 16 + bob;
          if (wl.surfaced && !wasSurfaced) {
            spawnBurst(wl.x + wl.w / 2, state.seaLevel, 12, "#BEEFFF");
            audio.blip(360, 90);
          }
        }

        function movePlayer(p, dt, soft) {
          const prevBottom = p.y + p.h;

          p.x += p.vx * dt;
          p.x = clamp(p.x, 0, WORLD_W - p.w);

          p.y += p.vy * dt;
          p.onGround = false;

          const solids = getSolids();
          for (const s of solids) {
            if (!rectsOverlap(p, s)) continue;
            if (p.vy >= 0 && prevBottom <= s.y + 6) {
              p.y = s.y - p.h;
              p.vy = 0;
              p.onGround = true;
            }
          }

          if (p.onGround && !soft) {
            const under = findUnder(p, solids, 4);
            if (under && under.drift) {
              p.x += under.drift * dt;
            }
          }
        }

        // The solids list is rebuilt on every call (platforms move/shrink), but into
        // one persistent array of pooled objects instead of ~11 fresh ones per call.
        // Callers use the result immediately and never keep it across another call.
        // Slots 0-2 (home, valve platform, shore) never get a `drift`; floe and seal
        // slots (3+) always do, exactly like the old per-call literals.
        const solidsBuf = [];
        const solidPool = [];
        function solidSlot(i) {
          return solidPool[i] || (solidPool[i] = { x: 0, y: 0, w: 0, h: 0 });
        }

        function getSolids() {
          let n = 0;
          let s = solidSlot(n++);
          const sb = state.stableBase;
          s.x = sb.x;
          s.y = sb.y;
          s.w = sb.w;
          s.h = sb.h;
          s = solidSlot(n++);
          const vp = state.valvePlatform;
          s.x = vp.x;
          s.y = vp.y;
          s.w = vp.w;
          s.h = vp.h;
          s.stable = true;
          s = solidSlot(n++);
          s.x = SHORE.x;
          s.y = SHORE.y;
          s.w = SHORE.w;
          s.h = SHORE.h;
          s.stable = true;
          const mp = state.meltPlatforms;
          for (let i = 0; i < mp.length; i++) {
            const pl = mp[i];
            if (pl.gone) continue;
            s = solidSlot(n++);
            s.x = pl.x + pl.shrink * 0.5;
            s.y = pl.y;
            s.w = pl.w;
            s.h = pl.h;
            s.drift = Math.cos(state.time * 0.55 + pl.phase) * pl.drift;
          }
          const wl = state.waterLift;
          if (wl && wl.surfaced) {
            s = solidSlot(n++);
            s.x = wl.x;
            s.y = wl.y;
            s.w = wl.w;
            s.h = wl.h;
            s.drift = 0;
          }
          solidsBuf.length = n;
          for (let i = 0; i < n; i++) solidsBuf[i] = solidPool[i];
          return solidsBuf;
        }

        // First solid Penny stands on (same test the old solids.find closures used).
        function findUnder(p, solids, tol) {
          for (let i = 0; i < solids.length; i++) {
            const s = solids[i];
            if (p.x + p.w > s.x && p.x < s.x + s.w && Math.abs(p.y + p.h - s.y) < tol) return s;
          }
          return undefined;
        }

        function getMaxCarryingCapacity() {
          if (!state || !state.chicks) return 1;
          // NEW: calm mode lets Penny carry every rescued chick at once —
          // a "follow in a line" duckling formation instead of ferrying them
          // one trip at a time, so young kids aren't punished for exploring.
          if (calmMode) return state.chicks.length;
          let deliveredCount = 0;
          for (let i = 0; i < state.chicks.length; i++) {
            if (state.chicks[i].delivered) deliveredCount++;
          }
          if (deliveredCount === 0) return 1;
          if (deliveredCount === 1) return 2;
          return 3;
        }

        function updateChicks(dt) {
          const p = state.player;
          for (const chick of state.chicks) {
            chick.bob += dt * 3;
            if (chick.cheerTimer > 0) chick.cheerTimer -= dt; // T050
            if (chick.delivered) continue;

            const carryIndex = p.carrying.indexOf(chick);
            if (carryIndex !== -1) {
              const sheet = getActiveSpriteSheet();
              const destW = 72;
              const destH = sheet && sheet.loaded ? (sheet.frameH / sheet.frameW) * destW : 108;
              // Stagger offsets for multiple carried chicks:
              const baseOffsetX = -14 * p.facing;
              const offsetX = baseOffsetX - p.facing * carryIndex * 4;
              const offsetY = -destH * 0.65 - carryIndex * 12;
              
              chick.x = p.x + p.w / 2 + offsetX - 9;
              chick.y = p.y + p.h + offsetY - 18;
              const homeZone = {
                x: state.stableBase.x,
                y: state.stableBase.y - 100,
                w: state.stableBase.w,
                h: 200,
              };
              if (rectsOverlap(p, homeZone) && p.onGround) {
                chick.delivered = true;
                chick.rescued = true;
                p.carrying = p.carrying.filter((c) => c !== chick);
                state.rescuedCount += 1;
                // T050: join the animated huddle group on the safe iceberg —
                // takes the next open slot, and every chick already in the
                // huddle gets an extra celebratory hop as the new friend arrives.
                chick.huddleSlot = state.chicks.filter((c) => c.delivered).length - 1;
                cheerHuddle();
                audio.heal();
                spawnBurst(chick.x, chick.y, 14, "#FFD84D");
                spawnFloatText(chick.x, chick.y - 12, "Safe! +1 💚", "#3aa655");
                if (state.rescuedCount >= TARGET_RESCUES) {
                  winGame();
                }
              }
              continue;
            }

            // If not carried, make it slide back and forth with the platform or fall if gone
            if (!chick.rescued && chick.platformIndex !== undefined) {
              const pl = state.meltPlatforms[chick.platformIndex];
              if (pl) {
                if (!pl.gone) {
                  const drift = Math.cos(state.time * 0.55 + pl.phase) * pl.drift;
                  chick.x = chick.baseX + drift;
                } else {
                  // Platform has melted! Apply gravity to make the chick fall
                  chick.vy = (chick.vy || 0) + 1450 * dt;
                  chick.y += chick.vy * dt;
                }
              }
            }

            const nearChick = chickInReach(p, chick);
            if (!chick.rescued && nearChick) {
              const maxCarry = getMaxCarryingCapacity();
              if (p.carrying.length >= maxCarry) {
                continue;
              }
              // NEW: calm mode auto-grabs on contact — no button press needed —
              // so a young kid who's still learning the controls isn't stuck.
              if (input.actionPressed || calmMode) {
                chick.rescued = true;
                p.carrying.push(chick);
                audio.collect();
                spawnBurst(chick.x, chick.y, 10, "#FFE680");
                spawnFloatText(chick.x, chick.y - 12, "Got one! 🐥", "#2e5ee8");
                input.actionPressed = false;
              }
            }

            if (chick.y + 18 >= state.seaLevel) {
              const homeRestock = state.chicks.find(
                (c) => !c.rescued && !c.delivered && c !== chick,
              );
              if (
                !homeRestock &&
                !chick.delivered &&
                !p.carrying.includes(chick)
              ) {
                failGame(
                  "A chick slipped into the water. Try shorter rescue routes and keep the floes from vanishing under you.",
                );
                return;
              }
            }
          }
        }

        // T050: makes the whole existing huddle hop/cheer together whenever
        // a new chick is delivered to the iceberg.
        function cheerHuddle() {
          for (const c of state.chicks) {
            if (c.delivered) c.cheerTimer = 0.9;
          }
        }

        function updateValve(dt) {
          const p = state.player;
          const dx = p.x + p.w / 2 - state.valve.x;
          const dy = p.y + p.h / 2 - state.valve.y;
          const near = Math.hypot(dx, dy) < 78;
          if (near && input.actionPressed) {
            state.warmth = Math.max(0, state.warmth - state.valve.coolAmount * diff.forgivenessMul());
            state.coolingTimer = 8;
            state.valve.activeFlash = 1.0;
            audio.blip(520, 150);
            
            // Spawn dramatic snow sparks at the valve
            spawnBurst(state.valve.x, state.valve.y, 24, "#87E1FF");
            
            // Spawn wind streaks sweeping across the screen
            for (let k = 0; k < 12; k++) {
              state.particles.push({
                x: VIEW_W + Math.random() * 200,
                y: 50 + Math.random() * 450,
                vx: -300 - Math.random() * 250,
                vy: (Math.random() - 0.5) * 15,
                life: 2.2,
                maxLife: 2.2,
                kind: "wind",
                color: "rgba(180, 242, 255, 0.55)",
                size: 50 + Math.random() * 70
              });
            }

            // Heal ice platforms slightly
            for (const pl of state.meltPlatforms) {
              if (!pl.gone) {
                pl.shrink = Math.max(0, pl.shrink - pl.baseW * 0.25);
                pl.w = pl.baseW - pl.shrink;
                pl.glowTimer = 1.5;
                
                // Spawn healing particles rising from the platform
                for (let k = 0; k < 5; k++) {
                  state.particles.push({
                    x: pl.x + Math.random() * pl.w,
                    y: pl.y + 4,
                    vx: (Math.random() - 0.5) * 16,
                    vy: -15 - Math.random() * 15,
                    life: 0.7,
                    maxLife: 0.7,
                    color: "#80F5FF",
                    size: 2 + Math.random() * 2,
                    kind: "snow"
                  });
                }
              }
            }
          }
          input.actionPressed = false;
        }

        function updateParticles(dt) {
          for (let i = state.particles.length - 1; i >= 0; i--) {
            const pt = state.particles[i];
            pt.life -= dt;
            pt.x += pt.vx * dt;
            pt.y += pt.vy * dt;
            pt.vy += (pt.kind === "snow" ? 25 : 180) * dt;
            if (pt.life <= 0) state.particles.splice(i, 1);
          }
        }

        function updateCamera(dt) {
          // On a narrow (phone-portrait) view keep Penny well inside the screen
          const lead = Math.min(240, VIEW_W * 0.38);
          const target = clamp(state.player.x - lead, 0, WORLD_W - VIEW_W);
          cameraX += (target - cameraX) * Math.min(1, CAMERA_LERP * dt * 60);
        }

        function warmthGradient(w) {
          if (w < 0.4) return "linear-gradient(90deg, #3dd6c0, #2e5ee8)"; // cool & safe
          if (w < 0.7) return "linear-gradient(90deg, #ffd23f, #ff8c42)"; // caution
          return "linear-gradient(90deg, #ff8c42, #ef4444)"; // danger
        }

        // Runs every fixed step, so every write is change-only (GOGUi.setText /
        // setStyle / setClass skip the DOM when the value is the same as last time).
        function updateUI() {
          const warmPct = (state.warmth * 100).toFixed(0) + "%";
          GOGUi.setStyle(ui.warmFill, "width", warmPct);
          GOGUi.setStyle(ui.warmFill, "background", warmthGradient(state.warmth));
          GOGUi.setClass(
            ui.canvasFrame,
            "warmth-danger",
            state.warmth >= 0.7 && state.state === "playing",
          );
          GOGUi.setText(ui.warmthText, warmPct);
          if (ui.warmthLabel) {
            let labelText = "WARMTH ";
            if (state.warmth <= 0.2) labelText += "❄️❄️❄️❄️❄️";
            else if (state.warmth <= 0.4) labelText += "❄️❄️❄️❄️";
            else if (state.warmth <= 0.6) labelText += "❄️❄️❄️";
            else if (state.warmth <= 0.8) labelText += "❄️❄️";
            else if (state.warmth <= 0.9) labelText += "❄️";
            else labelText += "🔥🔥🔥🔥🔥";
            GOGUi.setText(ui.warmthLabel, labelText);
          }
          GOGUi.setText(
            ui.rescuedText,
            "🐥 " + state.rescuedCount + " / " + TARGET_RESCUES + " rescued",
          );
          GOGUi.setText(ui.timerText, Math.ceil(state.timeLeft) + "s");
          GOGUi.setClass(ui.timerText, "timer-urgent", state.timeLeft <= 10);
          if (ui.iceText) {
            let floesLeft = 0;
            for (let i = 0; i < state.meltPlatforms.length; i++) {
              if (!state.meltPlatforms[i].gone) floesLeft++;
            }
            GOGUi.setText(ui.iceText, "🧊 " + floesLeft + " floes left");
          }
          const seaPct = Math.round(((560 - state.seaLevel) / 140) * 100);
          GOGUi.setText(ui.seaText, "🌊 Sea " + Math.max(0, seaPct) + "%");
          refreshActionButton();
        }

        // The round action button is "Grab" next to a chick and "Spin" at the
        // valve, and pulses whenever there is something in reach — so there is
        // never a mystery button.
        let actionStateKey = "";
        function refreshActionButton() {
          if (!ui.actionBtn) return;
          const p = state.player;
          const nearValve =
            Math.hypot(
              p.x + p.w / 2 - state.valve.x,
              p.y + p.h / 2 - state.valve.y,
            ) < 78;
          let nearChick = false;
          if (p.carrying.length < getMaxCarryingCapacity()) {
            for (let i = 0; i < state.chicks.length; i++) {
              const c = state.chicks[i];
              if (!c.rescued && !c.delivered && chickInReach(p, c)) {
                nearChick = true;
                break;
              }
            }
          }
          const key = nearValve ? "spin" : nearChick ? "grab" : "idle";
          if (key === actionStateKey) return;
          actionStateKey = key;
          ui.actionIco.textContent = key === "spin" ? "☸️" : "🐥";
          ui.actionCap.textContent = key === "spin" ? "Spin" : "Grab";
          ui.actionBtn.classList.toggle("ready", key !== "idle");
        }

        function spawnBurst(x, y, count, color) {
          for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 40 + Math.random() * 130;
            state.particles.push({
              x,
              y,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed - 30,
              life: 0.4 + Math.random() * 0.45,
              color,
              size: 4 + Math.random() * 5,
            });
          }
        }

        // Floating reward-text pop-ups — short, bouncy, high-contrast
        // confirmation text ("Got one! 🐥") at the exact moment something
        // good happens, so the stage's message is felt instantly instead
        // of only showing up later as a HUD chip number.
        function spawnFloatText(x, y, text, color) {
          state.floatingTexts.push({
            x,
            y,
            text,
            color: color || "#241c30",
            life: 1.1,
            maxLife: 1.1,
          });
        }

        function updateFloatingTexts(dt) {
          for (let i = state.floatingTexts.length - 1; i >= 0; i--) {
            const t = state.floatingTexts[i];
            t.life -= dt;
            t.y -= 34 * dt;
            if (t.life <= 0) state.floatingTexts.splice(i, 1);
          }
        }

        function drawFloatingTexts() {
          if (!state.floatingTexts.length) return;
          ctx.save();
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.font = "800 18px 'Baloo 2', Arial, sans-serif";
          ctx.lineJoin = "round";
          for (const t of state.floatingTexts) {
            const p = Math.max(0, t.life / t.maxLife);
            const bounce = 1 + Math.sin(p * Math.PI) * 0.15;
            ctx.save();
            ctx.globalAlpha = p;
            ctx.translate(t.x, t.y);
            ctx.scale(bounce, bounce);
            ctx.lineWidth = 4;
            ctx.strokeStyle = "#241c30";
            ctx.fillStyle = t.color;
            ctx.strokeText(t.text, 0, 0);
            ctx.fillText(t.text, 0, 0);
            ctx.restore();
          }
          ctx.restore();
        }

        // All flakes are one colour, so they go into a single path / single fill.
        function drawSnowfall() {
          ctx.save();
          ctx.fillStyle = "#ffffff";
          ctx.beginPath();
          for (let i = 0; i < snowfallParticles.length; i++) {
            const s = snowfallParticles[i];
            ctx.moveTo(s.x + s.size, s.y);
            ctx.arc(s.x, s.y, s.size, 0, TAU);
          }
          ctx.fill();
          ctx.restore();
        }

        // World-space visibility test: is any part of [x0, x1] on screen? (margins are
        // baked into the numbers callers pass, so nothing pops in at the edge.)
        function inView(x0, x1) {
          return x1 > camX && x0 < camX + VIEW_W;
        }

        // The world scrolls on the device-pixel grid (see camX).
        function syncCamera() {
          const sc = hiDpi.scale;
          camX = Math.round(cameraX * sc) / sc;
        }

        // The backdrop paints every pixel (opaque sky down to the horizon, opaque sea
        // below it), so the frame no longer needs a clearRect first. The 2000px world
        // is culled: the factory, home iceberg and valve platform (and every floe,
        // chick and particle, inside their own draw functions) only paint when in view.
        function render() {
          if (!state) {
            drawIdleScene();
            return;
          }

          syncCamera();
          drawBackground();
          ctx.save();
          ctx.translate(-camX, 0);
          if (inView(1770, 2100)) drawSmogFactory();
          if (inView(-10, 340)) drawHomeBase();
          spawnHomeSparkles();
          if (inView(1020, 1320)) drawValvePlatform();
          drawPlatforms();
          drawWaterLift();
          drawChicks();
          drawPlayer();
          drawChickPrompts();
          drawParticles();
          drawFloatingTexts();
          ctx.restore();
          drawSnowfall();
          drawWater();
          drawWorldHud();
          drawCoachHints();
          drawWinWipe();
        }

        function drawWinWipe() {
          if (!winWiping && !winWipeDone) return;
          const r = winWipeDone ? winWipeMax : winWipeRadius;
          const cx = VIEW_W / 2;
          const cy = VIEW_H / 2;
          ctx.save();
          ctx.beginPath();
          ctx.arc(cx, cy, r, 0, Math.PI * 2);
          ctx.clip();
          const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r || 1);
          grad.addColorStop(0, "#FFFFFF");
          grad.addColorStop(0.55, "#B9E3FF");
          grad.addColorStop(1, "#2C4BFF");
          ctx.globalAlpha = 0.85;
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, VIEW_W, VIEW_H);
          ctx.restore();

          if (winWiping) {
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.lineWidth = 6;
            ctx.strokeStyle = "#111";
            ctx.stroke();
            ctx.restore();
          }
        }

        function drawIdleScene() {
          syncCamera();
          drawBackground();
          ctx.save();
          drawWater();
          ctx.restore();
        }

        // ---- Backdrop -------------------------------------------------------
        // Vector scenery (sky, glaciers, icebergs, far sea) is pre-rendered
        // into tileable offscreen canvases at the on-screen resolution and then
        // just scrolled each frame. That keeps it razor sharp at any window
        // size / pixel density and cheap to draw. (The old pixel-art PNG layers
        // were small bitmaps stretched ~2x, which is why they looked soft.)
        const BACKDROP_TILE = 1280; // logical px before a parallax layer repeats
        const HORIZON_Y = 452; // where the far sea meets the sky
        // Each parallax layer only has paint inside a horizontal band of the 600px-high
        // view (glaciers ~271-460, bergs ~394-500, sea 451-600), so only that band is
        // baked and blitted: about a quarter of the old full-height tiles in memory and
        // in fill. Band edges are multiples of 4 so they land on whole device pixels at
        // every canvas scale (1, 1.25, 1.5).
        const BAND = {
          far: { y: 260, h: 204 },
          mid: { y: 388, h: 116 },
          sea: { y: 448, h: 152 },
        };
        const SKY_H = 456; // sky bitmap height: the opaque sea takes over from HORIZON_Y
        const SUN_X = 590;
        const SUN_Y = 318;
        const backdrop = { far: null, mid: null, sea: null, clouds: [], sky: null, skyIdx: -1 };

        // Paints `paint(g)` (in full-view logical coordinates) into a BACKDROP_TILE x band.h bitmap.
        function makeBand(band, paint, scale) {
          return GOGEngine.bake(
            BACKDROP_TILE,
            band.h,
            function (g) {
              g.translate(0, -band.y);
              paint(g);
            },
            scale,
          );
        }

        // Free a baked canvas right away (rather than waiting for GC) when it is replaced.
        function releaseCanvas(c) {
          if (c) {
            c.width = 0;
            c.height = 0;
          }
        }

        // A rounded ice mountain: smooth dome, pale top, shaded right flank.
        function paintGlacier(g, cx, base, w, h) {
          const left = cx - w / 2;
          const right = cx + w / 2;
          g.beginPath();
          g.moveTo(left, base);
          g.bezierCurveTo(left + w * 0.1, base - h * 0.8, cx - w * 0.22, base - h * 1.05, cx - w * 0.05, base - h);
          g.bezierCurveTo(cx + w * 0.14, base - h * 0.97, right - w * 0.14, base - h * 0.6, right, base);
          g.closePath();
          const grad = g.createLinearGradient(0, base - h, 0, base);
          grad.addColorStop(0, "#F6FBFF");
          grad.addColorStop(0.5, "#D2E5FB");
          grad.addColorStop(1, "#A3C1EC");
          g.fillStyle = grad;
          g.fill();
          g.save();
          g.clip();
          g.fillStyle = "rgba(120, 160, 222, 0.38)";
          g.beginPath();
          g.moveTo(cx - w * 0.05, base - h);
          g.quadraticCurveTo(cx + w * 0.2, base - h * 0.55, cx + w * 0.08, base);
          g.lineTo(right + 12, base);
          g.lineTo(right + 12, base - h - 12);
          g.closePath();
          g.fill();
          g.restore();
        }

        // A chunky drifting iceberg: flat-ish snowy top, tinted underwater half.
        function paintBerg(g, cx, base, w, h) {
          const left = cx - w / 2;
          const right = cx + w / 2;
          const top = base - h;
          const r = Math.min(h * 0.55, w * 0.3);
          g.fillStyle = "rgba(70, 130, 200, 0.4)";
          g.beginPath();
          g.moveTo(left + w * 0.05, base);
          g.lineTo(right - w * 0.05, base);
          g.quadraticCurveTo(cx, base + h * 0.7, left + w * 0.05, base);
          g.closePath();
          g.fill();
          g.beginPath();
          g.moveTo(left, base);
          g.lineTo(left, top + r);
          g.quadraticCurveTo(left, top, left + r, top);
          g.lineTo(right - r, top);
          g.quadraticCurveTo(right, top, right, top + r);
          g.lineTo(right, base);
          g.closePath();
          const grad = g.createLinearGradient(0, top, 0, base);
          grad.addColorStop(0, "#FFFFFF");
          grad.addColorStop(1, "#BBD8F6");
          g.fillStyle = grad;
          g.fill();
          g.save();
          g.clip();
          g.fillStyle = "rgba(120, 165, 226, 0.4)";
          g.fillRect(cx + w * 0.12, top, w, h);
          g.restore();
        }

        function buildFarLayer(g) {
          const rand = seededRandom(4242);
          const count = 7;
          for (let i = 0; i < count; i++) {
            const w = 250 + rand() * 170;
            const h = 90 + rand() * 90;
            const cx = (i + 0.15 + rand() * 0.7) * (BACKDROP_TILE / count);
            for (const off of [-BACKDROP_TILE, 0, BACKDROP_TILE]) {
              paintGlacier(g, cx + off, HORIZON_Y + 8, w, h);
            }
          }
        }

        function buildMidLayer(g) {
          const rand = seededRandom(9001);
          const count = 6;
          for (let i = 0; i < count; i++) {
            const w = 110 + rand() * 110;
            const h = 34 + rand() * 40;
            const cx = (i + 0.2 + rand() * 0.6) * (BACKDROP_TILE / count);
            for (const off of [-BACKDROP_TILE, 0, BACKDROP_TILE]) {
              paintBerg(g, cx + off, HORIZON_Y + 16 + rand() * 6, w, h);
            }
          }
        }

        function buildSeaLayer(g) {
          const grad = g.createLinearGradient(0, HORIZON_Y, 0, VIEW_H);
          grad.addColorStop(0, "#C4E7FB");
          grad.addColorStop(0.3, "#86BEF0");
          grad.addColorStop(1, "#437FDC");
          g.fillStyle = grad;
          g.fillRect(0, HORIZON_Y, BACKDROP_TILE, VIEW_H - HORIZON_Y);
          g.fillStyle = "rgba(255, 255, 255, 0.6)";
          g.fillRect(0, HORIZON_Y - 1, BACKDROP_TILE, 3);
          const rand = seededRandom(77);
          g.lineCap = "round";
          for (let i = 0; i < 80; i++) {
            const y = HORIZON_Y + 10 + rand() * (VIEW_H - HORIZON_Y - 20);
            const depth = (y - HORIZON_Y) / (VIEW_H - HORIZON_Y);
            const len = 10 + depth * 38 * (0.5 + rand());
            const x = rand() * BACKDROP_TILE;
            g.strokeStyle = "rgba(255, 255, 255, " + (0.14 + 0.3 * rand()).toFixed(2) + ")";
            g.lineWidth = 1.5 + depth * 2;
            for (const off of [-BACKDROP_TILE, 0, BACKDROP_TILE]) {
              g.beginPath();
              g.moveTo(x + off, y);
              g.lineTo(x + off + len, y);
              g.stroke();
            }
          }
        }

        // Puffy cartoon cloud: white top, peach underside, flat base.
        function makeCloudSprite(scale, w, h, seed) {
          const c = document.createElement("canvas");
          c.width = Math.round(w * scale);
          c.height = Math.round(h * scale);
          const g = c.getContext("2d");
          g.setTransform(scale, 0, 0, scale, 0, 0);
          const rand = seededRandom(seed);
          const n = 5;
          g.fillStyle = "#FFFFFF";
          g.beginPath();
          for (let i = 0; i < n; i++) {
            const t = (i + 0.5) / n;
            const lift = Math.sin(t * Math.PI);
            const px = w * (0.12 + t * 0.76);
            const py = h * 0.62 - lift * h * 0.24 * (0.7 + rand() * 0.5);
            const pr = h * (0.2 + lift * 0.18 * (0.6 + rand() * 0.6));
            g.moveTo(px + pr, py);
            g.arc(px, py, pr, 0, Math.PI * 2);
          }
          g.fill();
          // peach shading on the underside, only where the cloud is
          g.globalCompositeOperation = "source-atop";
          const shade = g.createLinearGradient(0, h * 0.42, 0, h * 0.78);
          shade.addColorStop(0, "rgba(249, 207, 221, 0)");
          shade.addColorStop(1, "rgba(249, 207, 221, 1)");
          g.fillStyle = shade;
          g.fillRect(0, 0, w, h);
          // flatten the base
          g.globalCompositeOperation = "destination-out";
          g.fillRect(0, h * 0.78, w, h);
          return c;
        }

        function buildBackdrop(scale) {
          releaseCanvas(backdrop.far);
          releaseCanvas(backdrop.mid);
          releaseCanvas(backdrop.sea);
          releaseCanvas(backdrop.sky);
          backdrop.clouds.forEach(releaseCanvas);
          backdrop.sky = null;
          backdrop.skyIdx = -1; // sky is rebuilt at the new scale on next use
          backdrop.far = makeBand(BAND.far, buildFarLayer, scale);
          backdrop.mid = makeBand(BAND.mid, buildMidLayer, scale);
          backdrop.sea = makeBand(BAND.sea, buildSeaLayer, scale);
          backdrop.clouds = [
            makeCloudSprite(scale, 190, 84, 11),
            makeCloudSprite(scale, 150, 70, 23),
            makeCloudSprite(scale, 220, 92, 37),
          ];
          backdropDirty = false;
        }

        // Sky gradient + the soft sun glow, painted ONCE per warmth step (64 steps over
        // 0..1, ~1 colour level apart) into a bitmap that is then a single opaque blit.
        // This replaces a per-frame 3-stop gradient (3 hex re-parses) + a 400x400
        // radial-gradient glow. The glow is baked at the sun's resting height; the sun
        // disc itself still bobs in drawBackground().
        function buildSky(idx, scale) {
          const pw = Math.max(1, Math.ceil(VIEW_W * scale));
          const ph = Math.ceil(SKY_H * scale);
          let c = backdrop.sky;
          if (!c || c.width !== pw || c.height !== ph) {
            releaseCanvas(c);
            c = document.createElement("canvas");
            c.width = pw;
            c.height = ph;
            backdrop.sky = c;
          }
          const g = c.getContext("2d");
          g.setTransform(scale, 0, 0, scale, 0, 0);
          const sky = g.createLinearGradient(0, 0, 0, HORIZON_Y);
          sky.addColorStop(0, RAMP.sky0[idx]);
          sky.addColorStop(0.55, RAMP.sky1[idx]);
          sky.addColorStop(1, RAMP.sky2[idx]);
          g.fillStyle = sky;
          g.fillRect(0, 0, VIEW_W, SKY_H);
          const glow = g.createRadialGradient(SUN_X, SUN_Y, 10, SUN_X, SUN_Y, 190);
          glow.addColorStop(0, RAMP.glow[idx]);
          glow.addColorStop(1, "rgba(255, 246, 200, 0)");
          g.save();
          g.globalAlpha = 0.65;
          g.fillStyle = glow;
          g.fillRect(SUN_X - 200, SUN_Y - 200, 400, 400);
          g.restore();
          backdrop.skyIdx = idx;
        }

        // One parallax band, 1:1 in DEVICE pixels (identity transform, integer offsets):
        // no resampling, and at most two blits per layer (tile seam).
        function drawBand(layer, band, scroll) {
          const sc = hiDpi.scale;
          const tile = layer.width;
          const x0 = -(((Math.floor(scroll * sc) % tile) + tile) % tile);
          const y = Math.round(band.y * sc);
          const vw = canvas.width;
          for (let dx = x0; dx < vw; dx += tile) ctx.drawImage(layer, dx, y);
        }

        // Aurora gradients never change (only the paths and alpha move), so they are
        // created once instead of every frame.
        let auroraIdle = null;
        let auroraWon = null;
        function auroraGradient(won) {
          if (won) {
            if (!auroraWon) {
              auroraWon = ctx.createLinearGradient(0, 0, 0, 190);
              auroraWon.addColorStop(0, "rgba(90, 255, 160, 0.55)");
              auroraWon.addColorStop(1, "rgba(255, 140, 220, 0)");
            }
            return auroraWon;
          }
          if (!auroraIdle) {
            auroraIdle = ctx.createLinearGradient(0, 0, 0, 190);
            auroraIdle.addColorStop(0, "rgba(120, 255, 214, 0.38)");
            auroraIdle.addColorStop(1, "rgba(255, 140, 220, 0)");
          }
          return auroraIdle;
        }

        // The two ribbons are big alpha gradient fills (the priciest part of the sky), and
        // they only drift ~20 px/s, so they are painted into a small offscreen bitmap at
        // most every 50 ms (and whenever the scale / win state changes) and that bitmap is
        // blitted 1:1 each frame. Same shapes, sampled 20x per second.
        const AURORA_H = 136; // ribbons stay above y = 128; multiple of 4 -> whole device px
        const aurora = { c: null, t: -1, won: false, epoch: -1 };
        function drawAurora(timeVal, warmthVal, won) {
          const sc = hiDpi.scale;
          const stale =
            !aurora.c ||
            aurora.epoch !== rasterEpoch ||
            aurora.won !== won ||
            Math.abs(timeVal - aurora.t) >= 0.05;
          if (stale) {
            if (!aurora.c || aurora.epoch !== rasterEpoch) {
              releaseCanvas(aurora.c);
              aurora.c = document.createElement("canvas");
              aurora.c.width = Math.max(1, Math.ceil(VIEW_W * sc));
              aurora.c.height = Math.ceil(AURORA_H * sc);
            }
            const g = aurora.c.getContext("2d");
            g.setTransform(1, 0, 0, 1, 0, 0);
            g.clearRect(0, 0, aurora.c.width, aurora.c.height);
            g.setTransform(sc, 0, 0, sc, 0, 0);
            g.globalAlpha = 0.35 + (1 - warmthVal) * 0.45;
            g.fillStyle = auroraGradient(won);
            for (let j = 0; j < 2; j++) {
              g.beginPath();
              g.moveTo(0, 0);
              for (let x = 0; x <= VIEW_W + 20; x += 20) {
                const y = 70 + j * 34 + Math.sin(timeVal * 0.9 + x * 0.004 + j * 1.5) * 24 * Math.cos(timeVal * 0.35 + x * 0.002);
                g.lineTo(x, y);
              }
              g.lineTo(VIEW_W, 0);
              g.closePath();
              g.fill();
            }
            aurora.t = timeVal;
            aurora.won = won;
            aurora.epoch = rasterEpoch;
          }
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(aurora.c, 0, 0);
          ctx.restore();
        }

        function drawBackground() {
          if (backdropDirty) buildBackdrop(hiDpi.scale);
          const W = VIEW_W;
          const H = VIEW_H;
          const sc = hiDpi.scale;
          const warmthVal = state ? state.warmth : 0.0;
          const wi = warmIdx(warmthVal);
          const timeVal = state ? state.time : performance.now() * 0.001;
          const scrollVal = gameRunning ? camX : camX + performance.now() * 0.02;
          if (backdrop.skyIdx !== wi) buildSky(wi, sc);

          // 1. Sky: cobalt -> lilac -> peach horizon (dusky purple/orange as warmth
          // climbs) with the sun glow baked in. Opaque, so no clearRect is needed.
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.drawImage(backdrop.sky, 0, 0);
          ctx.restore();

          // 2. Aurora ribbons (painted offscreen at ~20 Hz, see drawAurora)
          drawAurora(timeVal, warmthVal, state && state.state === "won");

          // 3. Low sun behind the glaciers (glow is part of the sky bitmap)
          ctx.fillStyle = RAMP.sun[wi];
          circle(SUN_X, SUN_Y + Math.sin(timeVal * 0.4) * 3, 34, true);

          // 4. Drifting clouds
          for (let i = 0; i < clouds.length; i++) {
            const c = clouds[i];
            const sprite = backdrop.clouds[i % backdrop.clouds.length];
            const cw = sprite.width / sc;
            const ch = sprite.height / sc;
            ctx.globalAlpha = c.layer === "back" ? 0.75 : 0.95;
            ctx.drawImage(sprite, c.x - (cw * c.scale) / 2, c.y, cw * c.scale, ch * c.scale);
          }
          ctx.globalAlpha = 1;

          // 5. Parallax scenery: glaciers, far sea, drifting bergs (device-pixel blits)
          ctx.save();
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          drawBand(backdrop.far, BAND.far, scrollVal * 0.08);
          drawBand(backdrop.sea, BAND.sea, scrollVal * 0.3);
          drawBand(backdrop.mid, BAND.mid, scrollVal * 0.22);
          ctx.restore();

          // 6. Heat haze as warmth rises
          if (warmthVal > 0.05) {
            ctx.fillStyle = HAZE[wi];
            ctx.fillRect(0, 0, W, H);
          }
        }

        // The polluted shore that ends the level: a solid rocky island with
        // dirty snow, a drain pipe and a few drips. It gives the factory
        // somewhere to stand and the world a visible, finished right-hand edge.
        function drawShore() {
          const s = SHORE;
          ctx.save();
          const rock = ctx.createLinearGradient(0, s.y, 0, s.y + s.h);
          rock.addColorStop(0, "#9A8878");
          rock.addColorStop(1, "#4E4038");
          ctx.fillStyle = rock;
          roundedRect(s.x, s.y, s.w, s.h, 26, true, false);
          ctx.fillStyle = "#DAD6D0"; // dirty snow cap
          roundedRect(s.x, s.y, s.w, 16, 8, true, false);
          ctx.strokeStyle = "rgba(30, 22, 18, 0.35)";
          ctx.lineWidth = 3;
          ctx.lineCap = "round";
          for (let i = 0; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(s.x + 40 + i * 48, s.y + 30);
            ctx.lineTo(s.x + 32 + i * 48 + (i % 2 ? 14 : -8), s.y + 90 + (i % 3) * 18);
            ctx.stroke();
          }
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(s.x, s.y, s.w, s.h, 26, false, true);

          // drain pipe spilling dirty water into the sea
          ctx.fillStyle = "#6C7077";
          roundedRect(s.x - 26, s.y + 40, 52, 24, 8, true, false);
          roundedRect(s.x - 26, s.y + 40, 52, 24, 8, false, true);
          const drip = (state.time * 1.4) % 1;
          ctx.fillStyle = "rgba(96, 88, 70, 0.85)";
          ellipse(s.x - 20, s.y + 70 + drip * 90, 4, 6 + drip * 3, true, false);
          ellipse(s.x - 12, s.y + 70 + ((drip + 0.5) % 1) * 90, 3.5, 5.5, true, false);
          ctx.restore();
        }

        function drawSmogFactory() {
          drawShore();
          const x = 1835;
          const y = 180;

          // Body — a grimy rust-brown instead of candy pink, so the
          // building itself reads as "dirty machine", not a playhouse.
          ctx.fillStyle = "#8a7362";
          roundedRect(x, y + 120, 160, 130, 10, true, false);
          ctx.strokeStyle = "#111";
          ctx.lineWidth = 4;
          roundedRect(x, y + 120, 160, 130, 10, false, true);

          // Smokestacks — darker charcoal-grey, with a thin black/amber
          // hazard-stripe ring near the top of each. Same danger motif as
          // the Smog cloud in Stage 2, so kids read "this = bad" using one
          // shared visual language across the whole game.
          ctx.fillStyle = "#565a60";
          roundedRect(x + 24, y + 30, 42, 100, 8, true, false);
          roundedRect(x + 88, y, 42, 130, 8, true, false);
          ctx.strokeStyle = "#111";
          roundedRect(x + 24, y + 30, 42, 100, 8, false, true);
          roundedRect(x + 88, y, 42, 130, 8, false, true);

          ctx.save();
          ctx.strokeStyle = "#ffb020";
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(x + 24, y + 46);
          ctx.lineTo(x + 66, y + 46);
          ctx.moveTo(x + 88, y + 16);
          ctx.lineTo(x + 130, y + 16);
          ctx.stroke();
          ctx.restore();

          // A simple grumpy face on the body — no text required, kids

    // glow ring when boosted / smog haze when coughing
    if(glowing || smokeOverlapThisFrame){
      const gl = glowing ? getGlowArt().boost : getGlowArt().smoke;
      ctx.drawImage(gl, player.x - gl.gw / 2, player.y - gl.gh / 2, gl.gw, gl.gh);
    }

    // Breezy sprite: happy pose while boosted, flight loop otherwise.
    ctx.save();
    ctx.translate(player.x, player.y);

    // Squash & Stretch based on vertical velocity and wind riding
    const dy = player.y - player.prevY;
    const stretch = clamp(Math.abs(dy) * 0.03, 0, 0.12);
    const scaleX = 1 - stretch + wi * 0.05;
    const scaleY = 1 + stretch - wi * 0.05;
    ctx.scale(scaleX, scaleY);

    ctx.rotate(player.angle*0.35 + wi * 0.12);

    const sheet = (player.boostTimer > 0 && !smokeOverlapThisFrame) ? sprites.breezyHappy : sprites.breezyFly;

    if(smokeOverlapThisFrame) {
      ctx.globalAlpha = 0.55; // ...and Breezy goes grey (a pre-made grayscale copy)
    }

    const drawn = drawBreezy(sheet, player.animFrame, smokeOverlapThisFrame);

    if(!drawn){
      // fallback while sprite loads: original neo-brutalist disc
      ctx.fillStyle = glowing ? COLORS.lime : (smokeOverlapThisFrame ? '#888' : COLORS.cream);
      ctx.strokeStyle = COLORS.ink;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0,0, player.radius, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      ctx.font = '30px Arial';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(smokeOverlapThisFrame ? '😷' : '🌀', 0, 2);
    }
    ctx.restore();

    // NEW: clear "rising / falling" cue — a small colored chevron beside
    // Breezy, shown only once vertical motion is clearly noticeable so it
    // doesn't jitter while gliding roughly level.
    if (Math.abs(dy) > 0.15) {
      ctx.save();
      ctx.translate(player.x + player.radius + 14, player.y);
      const climbing = dy < 0;
      ctx.globalAlpha = clamp(Math.abs(dy) * 0.08, 0.35, 1);
      ctx.font = '900 22px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = climbing ? COLORS.lime : COLORS.cobalt;
      ctx.fillText(climbing ? '▲' : '▼', 0, 0);
      ctx.restore();
    }

    // Coughing speech bubble above Breezy when she hits smoke
    if (smokeOverlapThisFrame) {
      ctx.save();
      ctx.translate(player.x, player.y - player.radius * 1.75);

      // Bubble box shadow
      ctx.fillStyle = COLORS.ink;
      roundRectPath(-32 + 3, -18 + 3, 64, 20, 6);
      ctx.fill();

      // Bubble box
      ctx.fillStyle = COLORS.cream;
      ctx.strokeStyle = COLORS.ink;
      ctx.lineWidth = 3;
      roundRectPath(-32, -18, 64, 20, 6);
      ctx.fill(); ctx.stroke();

      // Little pointer at bottom
      ctx.beginPath();
      ctx.moveTo(-6, 2); ctx.lineTo(0, 8); ctx.lineTo(6, 2);
      ctx.fillStyle = COLORS.cream; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-6, 2); ctx.lineTo(0, 8); ctx.lineTo(6, 2);
      ctx.strokeStyle = COLORS.ink; ctx.lineWidth = 3;
      ctx.stroke();

      // Text inside bubble
      ctx.fillStyle = '#ff3d8a'; // pink/red text
      ctx.font = "800 11px 'Quicksand', sans-serif";
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText("😷 *cough*", 0, -8);
      ctx.restore();
    }
  }

  // The smoke vignette is a smooth radial ramp, so it is painted once at 1/4 size and
  // stretched over the frame instead of a full-screen gradient every frame.
  let vignetteArt = null;
  function drawSmokeVignette(){
    if(!smokeOverlapThisFrame) return;
    if(!vignetteArt){
      vignetteArt = GOGEngine.bake(W, H, (g) => {
        const vig = g.createRadialGradient(W/2, H/2, W*0.35, W/2, H/2, W*0.7);
        vig.addColorStop(0, 'rgba(40, 40, 40, 0)');
        vig.addColorStop(1, 'rgba(15, 15, 15, 0.45)');
        g.fillStyle = vig;
        g.fillRect(0, 0, W, H);
      }, 0.25);
    }
    ctx.drawImage(vignetteArt, 0, 0, W, H);
  }

  // T059: explicit reactive contrast — smoothly gray-tints the whole scene
  // toward smog contact, or washes it radiant-blue right after a clean
  // touch (updraft/orb). Layered on top of drawSky()'s existing
  // progress-based clean/dirty split, not a replacement for it.
  function drawSkyReactTint(){
    if(Math.abs(skyReactTint) < 0.02) return;
    ctx.save();
    if(skyReactTint < 0){
      ctx.globalAlpha = -skyReactTint * 0.4;
      ctx.fillStyle = '#6b6f76';
    } else {
      ctx.globalAlpha = skyReactTint * 0.22;
      ctx.fillStyle = '#bfe4ff';
    }
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  // T056: full-screen speed lines while leaning into a steep dive.
  function drawSpeedLines(){
    if(!player.diving) return;
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    const count = 10;
    const phase = scrollX * 3;
    for(let i=0;i<count;i++){
      const lx = ((i * 97 + phase) % (W + 200)) - 100;
      const ly = (i * 173) % H;
      const len = 40 + (i % 3) * 20;
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(lx - len * 0.25, ly - len);
      ctx.stroke();
    }
    ctx.restore();
  }

  function render(time){
    frameNow = Date.now();
    drawCount++;
    ctx.clearRect(0,0,W,H);
    
    // Base Sky & Landscape
    drawSky();
    
    // Layer 1: Very distant clouds
    drawAmbientClouds();
    
    // Layer 2: Birds
    drawBirds();
    drawBirdFlocks(); // T058
    
    // Victory Rainbow (drawn behind buildings and player)
    if (gameState === 'winning' && winTimer >= 160) {
      const alpha = clamp((winTimer - 160) / 65, 0, 1);
      drawRainbow(alpha);
    }
    
    // Skyline buildings (stands in middle-ground behind wind/player/smoke)
    drawSkyline();
    
    // Layer 3: Wind ribbons, wind turbines, ambient flyers
    drawWind(time);
    
    // Collectible Orbs
    drawOrbs(time);
    
    // Surfing glow behind Breezy
    drawWindAura();
    
    // Layer 4: Breezy (the player)
    drawPlayer();
    
    // Layer 5: Smoke plumes (overlaps Breezy & buildings)
    drawSmokes();
    
    // Particles & Floating texts
    drawParticles();
    drawFloatTexts();
    
    // Victory Seed of Life (drawn in front of Breezy)
    if (gameState === 'winning' && winTimer >= 320) {
      const alpha = clamp((winTimer - 320) / 45, 0, 1);
      drawSeedOfLife(alpha);
    }
    
    // Layer 6: Foreground clouds (overlaps everything)
    drawForegroundClouds();
    
    // HUD overlays
    drawSkyReactTint(); // T059
    drawSpeedLines();   // T056
    drawSmokeVignette();
    drawCoachHints();
    drawWinWipe();
  }

  function drawWinWipe(){
    if(gameState !== 'winning' && gameState !== 'win') return;
    const r = winWipeDone ? winWipeMax : winWipeRadius;
    ctx.save();
    ctx.beginPath();
    ctx.arc(W/2, H/2, r, 0, Math.PI*2);
    ctx.clip();
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, r || 1);
    grad.addColorStop(0, '#FFD23F');
    grad.addColorStop(0.55, '#A6C9FF');
    grad.addColorStop(1, '#2C4BFF');
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,W,H);
    ctx.restore();

    if(gameState === 'winning'){
      ctx.save();
      ctx.beginPath();
      ctx.arc(W/2, H/2, r, 0, Math.PI*2);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#111';
      ctx.stroke();
      ctx.restore();
    }
  }

  // =================================================================
  // CLEAN WIND CURRENTS  (added gameplay system)
  // -----------------------------------------------------------------
  // Self-contained "air river" mechanic: renewable-energy sources
  // (wind turbines / solar updraft towers) emit flowing magical wind
  // ribbons that Breezy can ride for a smoother, faster, glowing
  // glide. Nothing above this section was changed — this system only
  // plugs into the existing loop through a few marked WIND HOOK
  // call-sites in update(), render() and initGame().
  // =================================================================

  // ---- tunables ---------------------------------------------------
  const WIND_MAX_CURRENTS   = 20;   // hard safety cap (spec limit)
  const WIND_MAX_CONCURRENT = 3;    // additionally bounded by MAX_VISIBLE_AIR_WAVES
  const WIND_MAX_PARTICLES  = 100;  // hard safety cap (spec limit)
  const WIND_SAMPLES        = 14;   // points sampled along each ribbon's spine

  const WIND_COLORS = {
    ribbon: 'rgba(255,255,255,0.92)',
    ribbonSoft: 'rgba(255,255,255,0.4)',
    glow: 'rgba(173,216,255,0.55)',
    sparkle: '#FFFFFF',
    leaf: '#8DD35F',
    leafDark: '#5FAE3A',
    feather: '#FFE7B3',
    pollen: '#FFE066',
    turbineBody: '#F4F7FB',
    turbineAccent: COLORS.cobalt
  };

  const WIND_TIER_CONFIG = {
    easy:   { lenMin:650, lenMax:800, thickMin:65, thickMax:85, ampMin:15, ampMax:25, freqMin:0.4, freqMax:0.7, speedMin:0.85, speedMax:1.0,  driftMin:5,  driftMax:10, driftSpeedMin:0.15, driftSpeedMax:0.28, bendMin:4,  bendMax:10 },
    medium: { lenMin:550, lenMax:700, thickMin:55, thickMax:70, ampMin:25, ampMax:40, freqMin:0.7, freqMax:1.2, speedMin:1.0,  speedMax:1.15, driftMin:10, driftMax:18, driftSpeedMin:0.28, driftSpeedMax:0.45, bendMin:10, bendMax:18 },
    hard:   { lenMin:450, lenMax:600, thickMin:45, thickMax:55, ampMin:35, ampMax:55, freqMin:1.2, freqMax:1.8, speedMin:1.15, speedMax:1.35, driftMin:15, driftMax:25, driftSpeedMin:0.45, driftSpeedMax:0.75, bendMin:18, bendMax:28 }
  };

  // ---- state (all new, does not touch any existing variable) -----
  let windCurrents = [];       // active air-river ribbons
  let windCurrentPool = [];    // free-list, reused instead of reallocated
  let windParticles = [];      // active pooled particles
  let windParticlePool = [];   // free-list
  let windSpawnTimer = rand(120,200);
  let windTime = 0;            // slow clock driving all wind animation phases
  let ambientFlyers = [];      // butterflies / leaves / pollen / dandelion seeds
  let ambientFlyerTimer = rand(60,120);
  let windLastScore = 0;       // used only to detect "orb collected while riding wind"

  // reusable scratch objects so influence/sampling queries never allocate mid-frame
  const _windInfluenceScratch = { influence:0, current:null, centerY:0 };
  const _sampleScratch = { y:0, thick:0, splitOff:0 };

  // ---- wind audio, built on the SHARED AudioContext (audio.ctx, the one Howler uses) so the
  // stage never opens a second context. audio.ctx is null until the first user gesture, so
  // each use re-checks. The looped noise source only exists while the wind is audible:
  // it is stopped when Breezy leaves the wind, on mute, and when the tab is hidden.
  let windCtx = null, windNoiseSource = null, windNoiseGain = null, windNoiseFilter = null, windNoiseBuffer = null;

  function ensureWindAudioCtx(){
    const c = audio.ctx;
    if(c !== windCtx){ // first use, or the shared context was replaced
      windCtx = c;
      windNoiseSource = windNoiseGain = windNoiseFilter = windNoiseBuffer = null;
    }
    return windCtx;
  }

  function stopWindNoise(){
    if(windNoiseSource){
      try { windNoiseSource.stop(); windNoiseSource.disconnect(); } catch(e){}
      windNoiseSource = null;
    }
  }
  GOGEngine.onVisibility(function(visible){ if(!visible) stopWindNoise(); });

  function initWindAmbientSound(){
    const ctx2 = ensureWindAudioCtx();
    if(!ctx2 || windNoiseSource) return;
    if(!windNoiseBuffer){
      const bufferSize = ctx2.sampleRate * 2;
      windNoiseBuffer = ctx2.createBuffer(1, bufferSize, ctx2.sampleRate);
      const data = windNoiseBuffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1)*0.6;
    }
    if(!windNoiseFilter){
      windNoiseFilter = ctx2.createBiquadFilter();
      windNoiseFilter.type = 'bandpass';
      windNoiseFilter.frequency.value = 900;
      windNoiseFilter.Q.value = 0.6;
      windNoiseGain = ctx2.createGain();
      windNoiseGain.gain.value = 0;
      windNoiseFilter.connect(windNoiseGain).connect(ctx2.destination);
    }
    windNoiseSource = ctx2.createBufferSource();
    windNoiseSource.buffer = windNoiseBuffer;
    windNoiseSource.loop = true;
    windNoiseSource.connect(windNoiseFilter);
    windNoiseSource.start();
  }

  function updateWindAudio(influence, dt){
    if(audio.muted){
      if(windNoiseGain) windNoiseGain.gain.value = 0;
      stopWindNoise();
      return;
    }
    if(influence > 0.05){
      initWindAmbientSound();
      if(windNoiseGain){
        const targetGain = clamp(influence,0,1) * 0.18; // whoosh volume
        windNoiseGain.gain.value = lerp(windNoiseGain.gain.value, targetGain, clamp(0.12*dt,0,1));
      }
      if(windNoiseFilter){
        const targetFreq = 600 + influence * 1200; // sweep frequency from 600Hz to 1800Hz
        windNoiseFilter.frequency.value = lerp(windNoiseFilter.frequency.value, targetFreq, clamp(0.15*dt,0,1));
      }
    } else if(windNoiseSource && windNoiseGain){
      const g = lerp(windNoiseGain.gain.value, 0, clamp(0.12*dt,0,1));
      windNoiseGain.gain.value = g;
      if(g < 0.002){ windNoiseGain.gain.value = 0; stopWindNoise(); } // silent: let the source go
    }
  }

  function playWindChime(){
    if(audio.muted) return;
    const ctx2 = ensureWindAudioCtx();
    if(!ctx2) return;
    const now = ctx2.currentTime;
    [0,1,2].forEach((i)=>{
      const osc = ctx2.createOscillator();
      const g = ctx2.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880 * Math.pow(1.25, i);
      g.gain.value = 0;
      osc.connect(g).connect(ctx2.destination);
      const t0 = now + i*0.06;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.12, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t0+0.35);
      osc.start(t0); osc.stop(t0+0.4);
    });
  }

  function playWindCollectChime(){
    if(audio.muted) return;
    const ctx2 = ensureWindAudioCtx();
    if(!ctx2) return;
    const now = ctx2.currentTime;
    const osc = ctx2.createOscillator();
    const g = ctx2.createGain();
    osc.type = 'triangle';
    osc.frequency.value = 1400;
    g.gain.value = 0;
    osc.connect(g).connect(ctx2.destination);
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.15, now+0.015);
    g.gain.exponentialRampToValueAtTime(0.001, now+0.25);
    osc.start(now); osc.stop(now+0.3);
  }

  // -----------------------------------------------------------------
  // WindParticle — pooled particle used for sparkles / leaves /
  // feathers / glowing dust / tiny cloudlets. Objects are recycled
  // via windParticlePool so nothing is allocated once the pool warms up.
  // -----------------------------------------------------------------
  class WindParticle {
    constructor(){ this.reset('sparkle',0,0,0,0,1,3,WIND_COLORS.sparkle); }
    reset(type,x,y,vx,vy,life,size,color){
      this.type = type; this.x = x; this.y = y; this.vx = vx; this.vy = vy;
      this.life = life; this.maxLife = life; this.size = size; this.color = color;
      this.angle = Math.random()*Math.PI*2;
      this.spin = (Math.random()-0.5)*0.1;
      this.sway = Math.random()*Math.PI*2;
    }
  }

  function spawnWindParticle(type,x,y,vx,vy,life,size,color){
    if(windParticles.length >= WIND_MAX_PARTICLES) return null;
    let p = windParticlePool.pop();
    if(!p) p = new WindParticle();
    p.reset(type,x,y,vx,vy,life,size,color);
    windParticles.push(p);
    return p;
  }

  function updateWindParticles(dt){
    for(let i=windParticles.length-1;i>=0;i--){
      const p = windParticles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.angle += p.spin*dt;
      p.sway += 0.05*dt;
      if(p.type === 'leaf' || p.type === 'feather'){
        p.x += Math.sin(p.sway)*0.4*dt; // gentle flutter, not a straight fall
      }
      p.life -= dt/60/p.maxLife;
      if(p.life <= 0 || p.x < -60){
        windParticles.splice(i,1);
        windParticlePool.push(p);
      }
    }
  }

  function drawWindParticles(){
    const n = windParticles.length;
    if(!n) return;
    const S = hiDpi.scale;
    ctx.save();
    for(let i=0;i<n;i++){
      const p = windParticles[i];
      const a = clamp(p.life,0,1);
      const c = Math.cos(p.angle) * S, sn = Math.sin(p.angle) * S;
      ctx.setTransform(c, sn, -sn, c, S * p.x, S * p.y); // translate + rotate without save/restore
      ctx.globalAlpha = a;
      if(p.type === 'sparkle'){
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(0,-p.size); ctx.lineTo(p.size*0.3,0); ctx.lineTo(0,p.size); ctx.lineTo(-p.size*0.3,0);
        ctx.closePath(); ctx.fill();
      } else if(p.type === 'leaf'){
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.ellipse(0,0,p.size,p.size*0.55,0,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 0.6;
        ctx.beginPath(); ctx.moveTo(-p.size,0); ctx.lineTo(p.size,0); ctx.stroke();
      } else if(p.type === 'feather'){
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.moveTo(0,-p.size);
        ctx.quadraticCurveTo(p.size*0.6,0,0,p.size);
        ctx.quadraticCurveTo(-p.size*0.6,0,0,-p.size);
        ctx.fill();
      } else if(p.type === 'dust'){
        ctx.globalAlpha = a * 0.55;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(0,0,p.size*1.4,0,Math.PI*2); ctx.fill();
      } else { // cloudlet
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(-p.size*0.5,0,p.size*0.6,0,Math.PI*2);
        ctx.arc(p.size*0.5,0,p.size*0.6,0,Math.PI*2);
        ctx.arc(0,-p.size*0.3,p.size*0.7,0,Math.PI*2);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // -----------------------------------------------------------------
  // WindCurrent — one flowing "air river". Its spine is sampled into
  // a reused points buffer (no per-frame allocation) each update.
  // Difficulty tiers (easy/medium/hard) control width, curve, speed,
  // and whether it can split into two braided paths that reconnect.
  // -----------------------------------------------------------------
  class WindCurrent {
    constructor(){
      this.points = [];
      for(let i=0;i<WIND_SAMPLES;i++) this.points.push({x:0,y:0,thick:0,splitOff:0});
      this.bladeAngle = 0;
    }
  }

  function pickWindTier(){
    let wEasy=0.6, wMedium=0.3, wHard=0.1;
    if(score >= 3 && score < 6){ wEasy=0.4; wMedium=0.4; wHard=0.2; }
    else if(score >= 6){ wEasy=0.25; wMedium=0.4; wHard=0.35; }
    const r = Math.random()*(wEasy+wMedium+wHard);
    if(r < wEasy) return 'easy';
    if(r < wEasy+wMedium) return 'medium';
    return 'hard';
  }

  function configureWindCurrent(cur, forceTier){
    const tier = forceTier || pickWindTier();
    const cfg = WIND_TIER_CONFIG[tier];
    cur.tier = tier;
    cur.x = W + rand(40,120);
    cur.length = rand(cfg.lenMin, cfg.lenMax);
    cur.thickness = rand(cfg.thickMin, cfg.thickMax);
    cur.amplitude = rand(cfg.ampMin, cfg.ampMax);
    cur.freq = rand(cfg.freqMin, cfg.freqMax);
    cur.speedMult = rand(cfg.speedMin, cfg.speedMax);
    cur.driftAmp = rand(cfg.driftMin, cfg.driftMax);
    cur.driftSpeed = rand(cfg.driftSpeedMin, cfg.driftSpeedMax);
    cur.bendAmount = rand(cfg.bendMin, cfg.bendMax);
    cur.phase = rand(0, Math.PI*2);
    cur.driftPhase = rand(0, Math.PI*2);
    cur.bendPhase = rand(0, Math.PI*2);
    cur.waveSpeed = rand(0.5,0.9);
    cur.thickWobbleSpeed = rand(0.6,1.1);
    cur.thickWobblePhase = rand(0, Math.PI*2);
    const safeMargin = cur.amplitude + cur.driftAmp + 40;
    cur.baseY = rand(PLAY_TOP+safeMargin, PLAY_BOTTOM-safeMargin);
    cur.canSplit = tier === 'hard' ? Math.random() < 0.6 : (tier === 'medium' ? Math.random() < 0.2 : false);
    cur.splitGap = cur.canSplit ? rand(18,32) : 0;
    cur.sourceType = Math.random() < 0.6 ? 'turbine' : 'tower';
    cur.bladeAngle = rand(0, Math.PI*2);
  }

  function spawnWindCurrent(forceTier){
    if(windCurrents.length >= WIND_MAX_CURRENTS) return null;
    let cur = windCurrentPool.pop();
    if(!cur) cur = new WindCurrent();
    configureWindCurrent(cur, forceTier);
    windCurrents.push(cur);
    return cur;
  }

  function updateWindCurrentSamples(cur){
    const n = cur.points.length;
    const hubY = GROUND_Y - 80;
    for(let i=0;i<n;i++){
      const u = i/(n-1); // 0 at left (tail), 1 at right (source/turbine)
      const worldX = cur.x + u*cur.length;
      
      const wave = Math.sin(u*cur.freq*Math.PI*2 + cur.phase + windTime*cur.waveSpeed) * cur.amplitude;
      const drift = Math.sin(windTime*cur.driftSpeed + cur.driftPhase) * cur.driftAmp;
      const bend = Math.sin(u*Math.PI) * cur.bendAmount * Math.sin(windTime*0.35 + cur.bendPhase);
      const targetY = cur.baseY + wave + drift + bend;
      
      // Bends down towards the turbine hub on the right side
      const blend = Math.pow(u, 3.0); // Bends more near the right end
      const y = lerp(targetY, hubY, blend);
      
      // Tapers at both ends: thin at the tail (left) and thin at the hub (right)
      const taper = Math.sin(u * Math.PI);
      const thick = cur.thickness * (0.8 + 0.2*Math.sin(u*4 + windTime*cur.thickWobbleSpeed + cur.thickWobblePhase)) * (0.3 + 0.7 * taper);
      
      const splitOff = cur.canSplit
        ? cur.splitGap * Math.sin(u*Math.PI) * (0.7 + 0.3*Math.sin(windTime*0.6 + cur.phase))
        : 0;
      
      const p = cur.points[i];
      p.x = worldX; p.y = y; p.thick = thick; p.splitOff = splitOff;
    }
  }

  // samples a current's spine at an arbitrary world X (interpolated between the
  // nearest two buffer points). Returns a shared scratch object — use immediately.
  function sampleWindCurrentAt(cur, worldX){
    const n = cur.points.length;
    const u = clamp((worldX - cur.x)/cur.length, 0, 1);
    const fi = u*(n-1);
    const i0 = Math.floor(fi), i1 = Math.min(n-1, i0+1);
    const t = fi - i0;
    const a = cur.points[i0], b = cur.points[i1];
    _sampleScratch.y = lerp(a.y,b.y,t);
    _sampleScratch.thick = lerp(a.thick,b.thick,t);
    _sampleScratch.splitOff = lerp(a.splitOff,b.splitOff,t);
    return _sampleScratch;
  }

  // checkWindInfluence(px,py) — the smooth "influence zone" collision
  // requested in the spec: 1.0 dead-center, easing down to 0 near the
  // ribbon's edge, instead of an on/off rectangle. Returns a shared
  // scratch object — read it immediately, don't hold a reference.
  function checkWindInfluence(px, py){
    const r = _windInfluenceScratch;
    r.influence = 0; r.current = null; r.centerY = py;
    for(let i=0;i<windCurrents.length;i++){
      const cur = windCurrents[i];
      if(px < cur.x || px > cur.x + cur.length) continue;
      const s = sampleWindCurrentAt(cur, px);
      let centerY = s.y;
      if(s.splitOff > 1){
        const dTop = Math.abs(py - (s.y - s.splitOff));
        const dBot = Math.abs(py - (s.y + s.splitOff));
        centerY = dTop < dBot ? s.y - s.splitOff : s.y + s.splitOff;
      }
      // NEW: calm mode gets a bigger, more forgiving updraft catch zone.
      const halfSpan = (s.thick*0.70 + 40) * (calmMode ? 1.6 : 1.0);
      const dist = Math.abs(py - centerY);
      let infl = clamp(1 - dist/halfSpan, 0, 1);
      infl = infl*infl*(3-2*infl); // smoothstep for a soft, non-linear falloff
      if(infl > r.influence){ r.influence = infl; r.current = cur; r.centerY = centerY; }
    }
    return r;
  }

  function maybeEmitAmbientWindParticles(cur, dt){
    if(windParticles.length >= WIND_MAX_PARTICLES) return;
    if(Math.random() < 0.06*dt){
      const idx = Math.floor(Math.random()*cur.points.length);
      const p = cur.points[idx];
      const roll = Math.random();
      if(roll < 0.4){
        spawnWindParticle('sparkle', p.x, p.y+rand(-6,6), rand(-0.6,-0.2), rand(-0.3,0.3), rand(0.8,1.4), rand(2,4), WIND_COLORS.sparkle);
      } else if(roll < 0.7){
        spawnWindParticle('leaf', p.x, p.y+rand(-8,8), rand(-1.2,-0.5), rand(-0.2,0.2), rand(1.2,2), rand(4,6), Math.random()<0.5?WIND_COLORS.leaf:WIND_COLORS.leafDark);
      } else {
        spawnWindParticle('dust', p.x, p.y+rand(-10,10), rand(-0.5,-0.15), rand(-0.15,0.15), rand(1,1.8), rand(2,4), WIND_COLORS.glow);
      }
    }
  }

  function updateWindManager(dt, effScroll){
    windTime += dt/60;
    windSpawnTimer -= dt;
    if(windSpawnTimer <= 0 && windCurrents.length < WIND_MAX_CONCURRENT && visibleAirWaveCount() < MAX_VISIBLE_AIR_WAVES){
      spawnWindCurrent();
      windSpawnTimer = rand(110,160); // spawn more frequently!
    }
    for(let i=windCurrents.length-1;i>=0;i--){
      const cur = windCurrents[i];
      cur.x -= effScroll * cur.speedMult * dt;
      
      // Spinning blades rotate faster if player is riding wind!
      const rideSpeed = (player.windInfluence || 0) * 0.24;
      cur.bladeAngle += (0.08 + rideSpeed) * dt;
      
      if(cur.x + cur.length < -80){
        windCurrents.splice(i,1);
        windCurrentPool.push(cur);
        continue;
      }
      updateWindCurrentSamples(cur);
      maybeEmitAmbientWindParticles(cur, dt);
    }
  }

  // -----------------------------------------------------------------
  // Gameplay effects: riding a current smooths Breezy's tilt, lifts
  // her gently, boosts speed, trails feathers, and plays soft audio.
  // Runs after the existing player-movement code each frame, so it
  // only *adds* a gentle influence on top rather than overriding it.
  // -----------------------------------------------------------------
  function applyWindEffectsToPlayer(dt){
    if(player.windInfluence === undefined){
      player.windInfluence = 0; player.windMultiplierActive = false; player.windFeatherTimer = 0;
    }
    const res = checkWindInfluence(player.x, player.y);
    const target = res.influence;
    const wasActive = player.windInfluence > 0.15;
    player.windInfluence = lerp(player.windInfluence, target, clamp(0.18*dt,0,1));
    const wi = player.windInfluence;
    const nowActive = wi > 0.15;

    if(nowActive && !wasActive){
      playWindChime();
      updateGuide("Ooh, a clean wind current! Ride it, Breezy! 🌬️✨");
    }
    
    if(nowActive) {
      clarity = clamp(clarity + 0.18 * dt, 0, 100); // wind currents clean the sky!
    }
    updateWindAudio(wi, dt);

    if(wi > 0.02){
      // gentle upward float — this stage has no explicit gravity value,
      // so "lighter" is expressed as a soft upward nudge to the target
      player.targetY = clamp(player.targetY - wi*0.5*dt, PLAY_TOP, PLAY_BOTTOM);
      // calmer tilt while riding, applied on top of the existing angle
      player.angle = lerp(player.angle, player.angle*0.5, clamp(wi*0.4,0,1));
      // playful speed lift — takes the max with the existing green-updraft
      // boost so the two systems stack nicely instead of fighting
      player.speedFactor = Math.max(player.speedFactor, lerp(1, 1.45, wi));
      // feather trail, denser the deeper into the current
      player.windFeatherTimer -= dt;
      if(player.windFeatherTimer <= 0){
        spawnWindParticle('feather', player.x - player.radius*0.7, player.y+rand(-6,6), rand(-1.6,-0.8), rand(-0.3,0.3), rand(0.7,1.1), rand(4,7), WIND_COLORS.feather);
        player.windFeatherTimer = lerp(14, 4, wi);
      }
    }
    player.windMultiplierActive = wi > 0.3;
  }

  // energy orbs get pulled gently toward Breezy while she's in a current
  function applyOrbMagnetism(dt){
    const wi = player.windInfluence || 0;
    if(wi < 0.12) return;
    const radius = 70 + wi*90;
    const pull = 0.10 + wi*0.16;
    for(let i=0;i<orbs.length;i++){
      const o = orbs[i];
      const dx = player.x - o.x, dy = player.y - o.y;
      const d = Math.hypot(dx,dy);
      if(d < radius && d > 1){
        o.x += (dx/d) * pull * dt * 6;
        o.y += (dy/d) * pull * dt * 6;
      }
    }
  }

  // Detects "an orb was just collected" purely by watching the existing
  // score variable change — zero edits needed to the orb-collision code
  // above. When it happens while riding a current, layers on a cosmetic
  // "wind bonus" celebration (sound + burst + label) without touching
  // the real score or the building/win progression.
  function detectWindOrbBonus(){
    if(score !== windLastScore){
      if(score > windLastScore && (player.windInfluence||0) > 0.25){
        spawnBurst(player.x, player.y - 6, 'rainbow', 10);
        spawnFloatText(player.x, player.y - 34, 'Wind Boost! ✨', WIND_COLORS.pollen);
        playWindCollectChime();
      }
      windLastScore = score;
    }
  }

  // -----------------------------------------------------------------
  // Ambient environmental life: butterflies, leaves, pollen and
  // dandelion seeds drift across the sky and get swept along whenever
  // they pass through a wind current — purely decorative, no collision.
  // -----------------------------------------------------------------
  function spawnAmbientFlyer(){
    const kinds = ['butterfly','leaf','pollen','dandelion'];
    const kind = kinds[Math.floor(Math.random()*kinds.length)];
    ambientFlyers.push({
      kind, x: W+rand(20,80), y: rand(PLAY_TOP, PLAY_BOTTOM),
      baseSpeed: rand(0.5,1.1), wobble: rand(0,Math.PI*2), flap: 0,
      hue: rand(0,1)
    });
  }

  function updateAmbientFlyers(dt, effScroll){
    ambientFlyerTimer -= dt;
    if(ambientFlyerTimer <= 0 && ambientFlyers.length < 10){
      spawnAmbientFlyer();
      ambientFlyerTimer = rand(90,160);
    }
    for(let i=ambientFlyers.length-1;i>=0;i--){
      const f = ambientFlyers[i];
      f.wobble += 0.06*dt;
      let vx = -f.baseSpeed*effScroll*0.5*dt;
      let vy = Math.sin(f.wobble)*0.4*dt;
      const res = checkWindInfluence(f.x, f.y);
      if(res.influence > 0.15){
        vx -= res.influence*effScroll*0.9*dt;
        vy += (res.centerY - f.y) * 0.02 * res.influence * dt;
        if(Math.random() < 0.06*dt){
          spawnWindParticle('dust', f.x, f.y, rand(-1,-0.4), rand(-0.3,0.3), rand(0.4,0.7), rand(2,3), WIND_COLORS.sparkle);
        }
      }
      f.x += vx; f.y += vy;
      f.flap += dt/60*8;
      if(f.x < -40) ambientFlyers.splice(i,1);
    }
  }

  function drawAmbientFlyers(){
    ambientFlyers.forEach(f=>{
      ctx.save();
      ctx.translate(f.x,f.y);
      if(f.kind === 'butterfly'){
        const wing = Math.sin(f.flap)*0.6+0.6;
        ctx.fillStyle = f.hue>0.5 ? '#FF9F6B' : '#8DD9FF';
        ctx.strokeStyle = COLORS.ink; ctx.lineWidth = 1;
        ctx.save(); ctx.scale(wing,1);
        ctx.beginPath(); ctx.ellipse(-4,0,4,6,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.restore();
        ctx.save(); ctx.scale(wing,1);
        ctx.beginPath(); ctx.ellipse(4,0,4,6,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.restore();
      } else if(f.kind === 'leaf'){
        ctx.rotate(f.wobble);
        ctx.fillStyle = WIND_COLORS.leaf; ctx.strokeStyle = WIND_COLORS.leafDark; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(0,0,7,4,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
      } else if(f.kind === 'pollen'){
        ctx.fillStyle = WIND_COLORS.pollen; ctx.globalAlpha = 0.85;
        ctx.beginPath(); ctx.arc(0,0,2.4,0,Math.PI*2); ctx.fill();
      } else {
        ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 0.8;
        for(let a=0;a<8;a++){
          const ang = a*Math.PI/4 + f.wobble;
          ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(ang)*5, Math.sin(ang)*5); ctx.stroke();
        }
        ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(0,0,1.5,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    });
  }

  // -----------------------------------------------------------------
  // Rendering: renewable-energy source glyph, the ribbon itself
  // (glow + gradient strokes + flow-direction glints), and the aura
  // drawn behind Breezy while she's riding a current.
  // -----------------------------------------------------------------
  function drawWindSource(cur){
    const p = cur.points[cur.points.length-1];
    if(p.x > W+70 || p.x < -70) return;
    ctx.save();
    ctx.translate(p.x, p.y);
    
    const groundH = GROUND_Y - p.y;
    
    if(cur.sourceType === 'turbine'){
      // Draw tower shadow
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.beginPath();
      ctx.moveTo(-5, 0); ctx.lineTo(-2, groundH); ctx.lineTo(10, groundH); ctx.lineTo(3, 0);
      ctx.fill();

      // Tower
      ctx.fillStyle = WIND_COLORS.turbineBody;
      ctx.strokeStyle = COLORS.ink;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(-6, groundH);
      ctx.lineTo(-2.5, 0);
      ctx.lineTo(2.5, 0);
      ctx.lineTo(6, groundH);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      
      // Hub
      ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2);
      ctx.fillStyle = WIND_COLORS.turbineAccent; ctx.fill(); ctx.stroke();
      
      // Blades
      for(let b=0;b<3;b++){
        const a = cur.bladeAngle + b*(Math.PI*2/3);
        ctx.save();
        ctx.rotate(a);
        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.quadraticCurveTo(5,-15,2.5,-35);
        ctx.quadraticCurveTo(-2,-15,0,0);
        ctx.fillStyle = WIND_COLORS.turbineBody;
        ctx.strokeStyle = COLORS.ink; ctx.lineWidth = 2;
        ctx.fill(); ctx.stroke();
        ctx.restore();
      }
    } else { // Solar updraft tower
      // Draw glass canopy shadow
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillRect(-35, groundH - 4, 70, 4);

      // Solar canopy at the base (glass collector)
      ctx.fillStyle = 'rgba(46, 94, 232, 0.45)'; // glass blue canopy
      ctx.strokeStyle = COLORS.ink;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-35, groundH);
      ctx.quadraticCurveTo(0, groundH - 24, 35, groundH);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      
      // Support pillars for canopy
      ctx.fillStyle = COLORS.ink;
      ctx.fillRect(-32, groundH - 4, 3, 4);
      ctx.fillRect(-16, groundH - 6, 3, 6);
      ctx.fillRect(16, groundH - 6, 3, 6);
      ctx.fillRect(29, groundH - 4, 3, 4);

      // Tower chimney
      ctx.fillStyle = WIND_COLORS.turbineBody;
      ctx.strokeStyle = COLORS.ink;
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(-10, groundH - 12);
      ctx.lineTo(-6, 0);
      ctx.lineTo(6, 0);
      ctx.lineTo(10, groundH - 12);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      
      // Solar collector thermal core glow
      const pulse = 0.7 + Math.sin(windTime*4 + cur.phase)*0.3;
      ctx.fillStyle = `rgba(255, 170, 50, ${0.55*pulse})`;
      ctx.beginPath(); ctx.arc(0, groundH - 12, 16, 0, Math.PI*2); ctx.fill();
      
      // Top rim
      ctx.fillStyle = WIND_COLORS.turbineAccent;
      ctx.fillRect(-8, -4, 16, 6);
      ctx.strokeRect(-8, -4, 16, 6);
    }
    ctx.restore();
  }

  // traces a smooth quadratic path through the ribbon's sample points,
  // offset vertically by `sign*splitOff` (0 for a single unsplit ribbon)
  function tracePath(pts, sign, widthFactor){
    const wf = widthFactor || 1;
    ctx.beginPath();
    const first = pts[0];
    ctx.moveTo(first.x, first.y + sign*first.splitOff*wf);
    for(let i=1;i<pts.length;i++){
      const p0 = pts[i-1], p1 = pts[i];
      const y0 = p0.y + sign*p0.splitOff*wf, y1 = p1.y + sign*p1.splitOff*wf;
      const midX = (p0.x+p1.x)/2, midY = (y0+y1)/2;
      ctx.quadraticCurveTo(p0.x, y0, midX, midY);
    }
    const last = pts[pts.length-1];
    ctx.lineTo(last.x, last.y + sign*last.splitOff*wf);
  }

  // Ribbon outline helper: the band is filled between a top and bottom edge
  // built from the same sampled spine, smoothed with midpoint quadratics.
  const _rib = [];
  function ribbonPath(n, k, dx, dy){
    ctx.beginPath();
    ctx.moveTo(_rib[0].x + dx, _rib[0].c - _rib[0].hw * k + dy);
    for (let i = 1; i < n - 1; i++) {
      const mx = (_rib[i].x + _rib[i+1].x) / 2 + dx;
      const my = ((_rib[i].c - _rib[i].hw * k) + (_rib[i+1].c - _rib[i+1].hw * k)) / 2 + dy;
      ctx.quadraticCurveTo(_rib[i].x + dx, _rib[i].c - _rib[i].hw * k + dy, mx, my);
    }
    ctx.lineTo(_rib[n-1].x + dx, _rib[n-1].c - _rib[n-1].hw * k + dy);
    ctx.lineTo(_rib[n-1].x + dx, _rib[n-1].c + _rib[n-1].hw * k + dy);
    for (let i = n - 2; i > 0; i--) {
      const mx = (_rib[i].x + _rib[i-1].x) / 2 + dx;
      const my = ((_rib[i].c + _rib[i].hw * k) + (_rib[i-1].c + _rib[i-1].hw * k)) / 2 + dy;
      ctx.quadraticCurveTo(_rib[i].x + dx, _rib[i].c + _rib[i].hw * k + dy, mx, my);
    }
    ctx.lineTo(_rib[0].x + dx, _rib[0].c + _rib[0].hw * k + dy);
    ctx.closePath();
  }

  function drawWindRibbon(cur){
    const pts = cur.points;
    const n = pts.length;
    if(pts[n-1].x < -80 || pts[0].x > W+80) return;
    while (_rib.length < n) _rib.push({ x: 0, c: 0, hw: 0 });

    const branches = cur.canSplit ? [-1, 1] : [0];
    branches.forEach(sign=>{
      for (let i = 0; i < n; i++) {
        const p = pts[i];
        _rib[i].x = p.x;
        _rib[i].c = p.y + sign * p.splitOff;
        _rib[i].hw = Math.max(5, p.thick * 0.58);
      }
      ctx.save();
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      // hard offset shadow, then a solid candy-blue band with a light core
      ribbonPath(n, 1, 5, 6);
      ctx.fillStyle = 'rgba(17,17,17,0.28)'; ctx.fill();
      ribbonPath(n, 1, 0, 0);
      ctx.fillStyle = '#8FE6FF'; ctx.fill();
      ribbonPath(n, 0.5, 0, 0);
      ctx.fillStyle = '#D9F8FF'; ctx.fill();
      ribbonPath(n, 1, 0, 0);
      ctx.lineWidth = 4; ctx.strokeStyle = COLORS.ink; ctx.stroke();

      // chevrons slide along the band: "fly this way"
      for (let g = 0; g < 5; g++) {
        const u = ((windTime * 0.1 + g / 5) % 1 + 1) % 1;
        const wx = cur.x + u * cur.length;
        if (wx < -20 || wx > W + 20) continue;
        const s = sampleWindCurrentAt(cur, wx);
        const hw = Math.max(5, s.thick * 0.58);
        if (hw < 14) continue;
        const cy = s.y + sign * s.splitOff;
        const sz = hw * 0.5;
        ctx.beginPath();
        ctx.moveTo(wx - sz * 0.5, cy - sz); ctx.lineTo(wx + sz * 0.5, cy); ctx.lineTo(wx - sz * 0.5, cy + sz);
        ctx.lineWidth = 8; ctx.strokeStyle = COLORS.ink; ctx.stroke();
        ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.stroke();
      }
      ctx.restore();
    });
  }

  function drawWind(time){
    if(!windCurrents.length && !windParticles.length && !ambientFlyers.length) return;
    windCurrents.forEach(cur=>drawWindSource(cur));
    windCurrents.forEach(cur=>drawWindRibbon(cur));
    drawAmbientFlyers();
    drawWindParticles();
  }

  // Radial light-blue glow behind Breezy: painted once at full strength and faded with
  // globalAlpha (the gradient's alpha stops all scale with the wind influence).
  let auraArt = null;
  function drawWindAura(){
    const wi = player.windInfluence || 0;
    if(wi < 0.03) return;

    if(!auraArt){
      const R = player.radius, r = R * 2.4;
      auraArt = GOGEngine.bake(r * 2, r * 2, (g) => {
        const grad = g.createRadialGradient(r, r, R * 0.4, r, r, r);
        grad.addColorStop(0, 'rgba(255,255,255,0.6)');
        grad.addColorStop(0.5, 'rgba(135,206,250,0.4)');
        grad.addColorStop(1, 'rgba(135,206,255,0)');
        g.fillStyle = grad;
        g.beginPath(); g.arc(r, r, r, 0, TAU); g.fill();
      }, 3);
    }
    ctx.save();
    ctx.globalAlpha = wi;
    ctx.drawImage(auraArt, player.x - auraArt.gw / 2, player.y - auraArt.gh / 2, auraArt.gw, auraArt.gh);

    // Flowing wind streaks (trails) trailing from Breezy
    ctx.globalAlpha = 1;
    ctx.strokeStyle = 'rgba(173, 216, 255, ' + (0.85 * wi) + ')';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';

    const time = frameNow * 0.015;
    for (let i = 0; i < 3; i++) {
      const dy = -16 + i * 16 + Math.sin(time + i * 2) * 4;
      const length = 55 + Math.sin(time + i) * 15;
      ctx.beginPath();
      ctx.moveTo(player.x - player.radius*0.5, player.y + dy);
      ctx.quadraticCurveTo(
        player.x - player.radius*0.5 - length/2, player.y + dy + Math.sin(time + i)*5,
        player.x - player.radius*0.5 - length, player.y + dy
      );
      ctx.stroke();
    }
    ctx.restore();
  }

  // WIND HOOK — called once from initGame() to clear/reset the system on every new run
  function resetWindSystem(){
    windCurrents.forEach(c=>windCurrentPool.push(c));
    windCurrents.length = 0;
    windParticles.forEach(p=>windParticlePool.push(p));
    windParticles.length = 0;
    ambientFlyers.length = 0;
    windSpawnTimer = rand(120,200);
    ambientFlyerTimer = rand(60,120);
    windTime = 0;
    windLastScore = 0;
    player.windInfluence = 0;
    player.windMultiplierActive = false;
    player.windFeatherTimer = 0;
    if(windNoiseGain) windNoiseGain.gain.value = 0;
    stopWindNoise();
  }


  function drawRainbow(alpha) {
    ctx.save();
    ctx.globalAlpha = alpha * 0.85;
    const colors = ['#ff3d8a', '#ff8a3d', '#ffc93c', '#c6ff3d', '#2c4bff', '#b6a6ff'];
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    
    // Draw arc from x=80 to x=720, curving up
    const startX = 80, endX = 720;
    const centerX = (startX + endX) / 2;
    const centerY = H - 120;
    const radius = 280;
    
    for (let i = 0; i < colors.length; i++) {
      ctx.strokeStyle = colors[i];
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius + i * 9, Math.PI, 0, false);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSeedOfLife(alpha) {
    ctx.save();
    
    // 1. Draw glowing vertical light beam
    ctx.globalAlpha = alpha * 0.4;
    const beamGrad = ctx.createLinearGradient(W/2, 0, W/2, H);
    beamGrad.addColorStop(0, 'rgba(198, 255, 61, 0.45)');
    beamGrad.addColorStop(1, 'rgba(198, 255, 61, 0)');
    ctx.fillStyle = beamGrad;
    ctx.fillRect(W/2 - 40, 0, 80, H);
    
    // 2. Draw glowing Seed leaf droplet icon bobbing in the center
    ctx.globalAlpha = alpha;
    ctx.translate(W/2, H/2 + 25 + Math.sin(frameNow * 0.005) * 8);
    ctx.rotate(frameNow * 0.0015);
    
    // Outer radial aura
    const sg = ctx.createRadialGradient(0, 0, 2, 0, 0, 36);
    sg.addColorStop(0, 'rgba(198, 255, 61, 0.9)');
    sg.addColorStop(1, 'rgba(198, 255, 61, 0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(0, 0, 36, 0, Math.PI * 2); ctx.fill();
    
    // leaf outline + body (neo-brutalist styling)
    ctx.fillStyle = COLORS.lime;
    ctx.strokeStyle = COLORS.ink;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, -18);
    ctx.quadraticCurveTo(12, 0, 0, 18);
    ctx.quadraticCurveTo(-12, 0, 0, -18);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    
    // Draw leaf vein line
    ctx.strokeStyle = COLORS.ink;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, -10); ctx.lineTo(0, 10);
    ctx.stroke();
    
    ctx.restore();
  }

  // ---------------------------------------------------------------
  // MAIN LOOP
  // ---------------------------------------------------------------
  // One fixed 1/60 s step of the world (GOGEngine.GameLoop calls this at 60 Hz, so every
  // speed below is exactly what it was at 60 fps; dt stays in "frames" units).
  function stepWorld(){
    const dt = 1;
    frameNow = Date.now();
    if(gameState === 'playing'){
      update(dt);
    } else {
      if(windNoiseSource) updateWindAudio(0, dt); // let the whoosh fade out after a win/fail
      // idle background motion on start/win/fail screens
      bgOffset1 = (bgOffset1 + 0.4*dt) % W;
      bgOffset2 = (bgOffset2 + 0.8*dt) % W;
      scrollX += 0.45 * dt;
      for(let i=ambientClouds.length-1;i>=0;i--){
        const c = ambientClouds[i];
        c.x -= c.speed*1.2*dt;
        c.blinkTimer -= dt/60;
        if(c.blinkTimer <= 0){ c.frame = 1 - c.frame; c.blinkTimer = rand(2.5,5); }
        if(c.x < -100){ ambientClouds.splice(i,1); spawnAmbientCloud(W+rand(20,80)); }
      }
      if(Math.random() < 0.01*dt) spawnBird();
      for(let i=birds.length-1;i>=0;i--){
        const b = birds[i];
        b.x -= b.speed*1.2*dt;
        b.flapTimer += dt/60*b.flapRate;
        if(b.x < -60){ birds.splice(i,1); }
      }

      // 1. Update Breezy's wing flapping animation
      const frameCount = sprites.breezyFly.frameCount;
      player.animTimer += dt / 60 * 11;
      player.animFrame = Math.floor(player.animTimer) % frameCount;

      // 2. Gentle hover bobbing in place
      player.y = 280 + Math.sin(frameNow * 0.0035) * 10;
      player.prevY = player.y; // keep previous y aligned to prevent stretch triggers
      player.angle = Math.sin(frameNow * 0.002) * 0.04;
    }
    if(gameState === 'winning'){
      winTimer += dt;
      
      // Update background scrolling slightly during win celebration
      scrollX += 0.5 * dt;
      bgOffset1 = (bgOffset1 + 0.15 * dt) % W;
      bgOffset2 = (bgOffset2 + 0.3 * dt) % W;
      
      // Update ambient clouds
      for(let i=ambientClouds.length-1;i>=0;i--){
        const c = ambientClouds[i];
        c.x -= c.speed*0.6*dt;
        if(c.x < -100){ ambientClouds.splice(i,1); spawnAmbientCloud(W+rand(20,80)); }
      }
      
      // Update birds
      for(let i=birds.length-1;i>=0;i--){
        const b = birds[i];
        b.x -= b.speed*1.2*dt;
        b.flapTimer += dt/60*b.flapRate;
        if(b.x < -60) birds.splice(i,1);
      }

      // Update particles
      for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt;
        p.life -= dt/60/p.maxLife*3.6;
        if(p.life <= 0) particles.splice(i,1);
      }
      updateFloatTexts(dt);

      // 1. Spawning birds flock
      if (winTimer >= 45 && winTimer < 45 + dt * 1.5) {
        for (let i = 0; i < 9; i++) {
          birds.push({
            x: W + rand(20, 240),
            y: rand(PLAY_TOP, PLAY_TOP + 120),
            baseY: rand(PLAY_TOP, PLAY_TOP + 120),
            speed: rand(1.3, 1.9),
            h: rand(22, 32),
            flapTimer: rand(0, 1),
            flapRate: rand(8, 12),
            wobble: rand(0, Math.PI*2)
          });
        }
      }

      // 2. Happy clouds conversion
      if (winTimer >= 100 && winTimer < 100 + dt * 1.5) {
        ambientClouds.forEach(c => { c.frame = 0; });
        for (let i = 0; i < 3; i++) {
          spawnAmbientCloud(W + rand(10, 120));
        }
      }

      // 3. Move Breezy to center and celebrate
      if (winTimer >= 240) {
        player.x = lerp(player.x, W/2, clamp(0.06*dt, 0, 1));
        player.y = lerp(player.y, H/2 - 40, clamp(0.06*dt, 0, 1));
        player.targetY = player.y;
        player.angle = Math.sin(winTimer * 0.15) * 0.15;
        player.boostTimer = 999; // happy anim
        
        // Spawn party sparkles!
        if (Math.random() < 0.18 * dt) {
          spawnBurst(player.x + rand(-20, 20), player.y + rand(-20, 20), 'rainbow', 6);
        }
      }

      // 4. Wipe transition
      if (winTimer >= 400) {
        winWipeRadius += dt * (winWipeMax * 1.6 / 60);
        if(winWipeRadius >= winWipeMax){
          winWipeDone = true;
          finishWin();
        }
      }
    }
  }

  // Fixed-step loop: skips draw() on frames without a step, stops while the tab is hidden.
  // The "How to play" pop-up (GOGUi.paused) freezes both the world and the drawing.
  const loop = new GOGEngine.GameLoop({
    update: function(){ if(!GOGUi.paused) stepWorld(); },
    draw: function(){ if(!GOGUi.paused) render(performance.now()); }
  });

  // STREAMLINED: start/replay/retry are now driven entirely by the single
  // GOGUi popup at each moment (the guardian beat's onDone for the first
  // start, and the win/fail overlay's buttons — a page reload, matching
  // stages 1-4 — for "Play Again"/"Try Again"), so the old dedicated
  // button listeners for the removed overlay markup are gone too.

  buildBuildings();
  seedAmbientClouds();
  updateHUD();
  loop.start();
  
})();
</script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Breezy & the Two Skies - Guardians of Gaia</title>
<link rel="stylesheet" href="../src/styles.css">
<style>
  /* Stage-private tokens only: --cream / --ink / --lime / --cobalt / --gold used
     to be redefined here and leaked into every shared widget that reads them. */
  :root{
    --lime-dark: #8FCB1A;
    --cobalt-dark: #1830B0;
    --grey: #8b8b8b;
    --grey-dark: #4a4a4a;
    --grey-light: #d9d9d3;
  }

  body { position: relative; }

  /* Page shell (HUD, title, meters, chips, buttons, guide bar, canvas-frame skin,
     the <=1200px compact HUD) lives in src/styles.css — only sky colours and
     stage-only widgets are styled here. */
  .stage-title small { color: #5a6b9a; }

  .timer-chip.timer-urgent {
    animation: timerPulseScale 0.8s ease-in-out infinite;
    color: #e82e5d;
    background: #ffcbd8;
  }
  @keyframes timerPulseScale {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  /* two long-labelled meters: give them room on the big-screen HUD row */
  @media (min-width: 1201px) {
    #cityPowerMeter, #skyHealthMeter { min-width: 205px; }
  }
  /* ...and keep that row on one line at 1201-1330px (title + 2 meters + buttons
     leave no room for the "Standard Mode" label there). */
  @media (min-width: 1201px) and (max-width: 1330px) {
    .calm-badge { display: none; }
  }
  /* "Flying Together!" appears mid-game: float it under the HUD row so it never
     reflows the HUD (and with it the canvas frame). */
  .hud-mid { position: relative; }
  #flockBadge {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 4px;
    z-index: 41;
    pointer-events: none;
  }
  .meter-track { background: var(--grey-light); }
  .meter-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #FFD23F, #FF9F1C);
    transition: width 0.25s ease-out;
  }
  #clarityFill {
    background: linear-gradient(90deg, #00C6FF, #0072FF);
    transition: width 0.2s linear;
  }

  /* Smog-danger warning: a hard-edged pink ring inside the frame whose opacity
     pulses (replaces an animated blurred box-shadow that repainted the frame). */
  .canvas-frame::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 6px rgba(255, 59, 125, 0.55);
    opacity: 0;
    pointer-events: none;
    z-index: 12;
  }
  @keyframes skyDangerPulse {
    0%, 100% { opacity: 0; }
    50% { opacity: 1; }
  }
  .canvas-frame.sky-danger::after {
    animation: skyDangerPulse 1.2s ease-in-out infinite;
  }

  .canvas-frame canvas { cursor: grab; }
  .canvas-frame canvas:active { cursor: grabbing; }

  .calm-badge { color: var(--gog-cobalt); }

  .page-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% -8%, #eaf1ff 0%, #cfe0ff 42%, #fdf6e6 100%),
      linear-gradient(180deg, rgba(44, 75, 255, 0.08), rgba(24, 48, 176, 0.14));
  }

  .page-bubble {
    position: absolute;
    bottom: -10vh;
    border-radius: 999px;
    background: radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.95), rgba(198, 255, 61, 0.14) 70%);
    opacity: 0;
    animation: pageBubbleRise linear infinite;
  }

  @keyframes pageBubbleRise {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    8% { opacity: 0.5; }
    90% { opacity: 0.35; }
    100% { transform: translateY(-125vh) translateX(var(--drift, 24px)); opacity: 0; }
  }

  .page-fx {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
    opacity: 0;
  }

  @media (prefers-reduced-motion: reduce) {
    .page-bubble { animation: none; opacity: 0; }
  }

  /* STREAMLINED: the old start/win/fail overlay markup (custom sprite
     panels, legend, seed card) has been removed — all three moments now
     use the single shared GOGUi popup (showGuardianBeat for the intro,
     showOverlay for win/fail), matching stages 1-4. Only the meter
     pop-juice animation remains local to this stage. */
  .chip-pop { animation: chipPop .4s cubic-bezier(.34,1.56,.64,1); }
  @keyframes chipPop {
    0% { transform: scale(1); }
    45% { transform: scale(1.22); }
    100% { transform: scale(1); }
  }

</style>

<script>
(function(){
  "use strict";

  // ---------------------------------------------------------------
  // SETUP
  // ---------------------------------------------------------------
  const STAGE_ID = 'stage05';
  const stageMeta = GOGContent.byId(STAGE_ID);
  let save = GOGSave.load();
  const diff = GOGProgress.difficulty(STAGE_ID);
  let calmMode = !!save.settings.calmMode;

  const canvas = document.getElementById('game');
  // Phone portrait: canvas fills the screen (see GOGEngine.fitCanvasToScreen)
  GOGEngine.fitCanvasToScreen(canvas, document.getElementById('canvasFrame'));
  const W = canvas.width, H = canvas.height;
  // PixiJS draws the world (GOGRender). Cached art (backdrop layers, smog puffs, clouds,
  // the town) is painted once per resolution and rebuilt when the on-screen size changes.
  let backdrop = null;
  let cloudArt = null;
  let skyline = null; // baked static skyline strip: rebuilt on resize and for every new run
  const hiDpi = { scale: 1 }; // = R.scale once Pixi is up (the bitmap is sized by GOGRender)
  // One clock reading per update step / drawn frame (instead of Date.now() in dozens of places).
  let frameNow = Date.now();
  let drawCount = 0;
  const TAU = Math.PI * 2;

  const progressFill = document.getElementById('progressFill');
  const progressText = document.getElementById('progressText');
  const clarityFill = document.getElementById('clarityFill');
  const clarityText = document.getElementById('clarityText');
  const canvasFrame = document.getElementById('canvasFrame');
  const cityPowerMeter = document.getElementById('cityPowerMeter');
  const skyHealthMeter = document.getElementById('skyHealthMeter');

  // NEW: calm mode foregrounds Clear Skies (the meter that actually needs
  // watching moment-to-moment) and de-emphasizes City Power — it still
  // tracks real orb progress toward the win goal, just visually quieter,
  // so a young kid has one thing to watch instead of two. We don't fake
  // or auto-fill City Power itself: that's the real win condition, and
  // silently completing it for the player would remove the game entirely.
  if (calmMode && cityPowerMeter) {
    cityPowerMeter.style.opacity = '0.55';
    cityPowerMeter.style.transform = 'scale(0.85)';
  }

  const COLORS = {
    ink:'#12120F', cream:'#FDFBF7', lime:'#C6FF3D', limeDark:'#8FCB1A',
    cobalt:'#2C4BFF', cobaltDark:'#1830B0', grey:'#8b8b8b', greyDark:'#4a4a4a',
    greyLight:'#d9d9d3', gold:'#FFC93C'
  };

  // ---------------------------------------------------------------
  // SPRITE SHEETS (GOGSpriteSheet convention: single-row frame strips)
  // ---------------------------------------------------------------
  const SPRITE_BASE = 'assets/sprites/stage05/';

  function GOGSpriteSheet(src, frameCount, customFrames){
    const img = new Image();
    let ready = false;
    img.onload = () => { ready = true; GOGEngine.requestDraw(); };
    img.src = SPRITE_BASE + src;
    return {
      img,
      frameCount,
      frames: customFrames,
      get ready(){ return ready; },
      get frameW(){ return Math.round(img.naturalWidth / frameCount); },
      get frameH(){ return Math.round(img.naturalHeight); }
    };
  }

  // Breezy's two sheets are huge (2172x471 and 1827x861) but she is drawn only ~72px
  // tall, so every frame was being downscaled 6-12x on every draw. Instead each frame
  // is scaled ONCE (at 2x her draw size) into a small canvas after the sheet decodes,
  // and the big Image is dropped so its decoded bitmap can be freed.
  const BREEZY_H = 72; // = player.radius * 3
  function BreezySheet(src, frameCount, frames){
    const sheet = { frameCount, frames, ready: false, baked: null };
    const img = new Image();
    function bakeFrames(){
      try {
        const fh = img.naturalHeight, scale = BREEZY_H / fh;
        const out = [];
        for (let i = 0; i < frameCount; i++) {
          const f = frames[i];
          const dw = Math.round(f.sw * scale), dh = Math.round(fh * scale);
          const c = GOGEngine.bake(dw, dh, (g) => {
            if ('imageSmoothingQuality' in g) g.imageSmoothingQuality = 'high';
            g.drawImage(img, f.sx, 0, f.sw, fh, 0, 0, dw, dh);
          }, 2);
          c.dx = Math.round(-(f.cx - f.sx) * scale);
          c.dy = Math.round(-dh / 2);
          out.push(c);
        }
        sheet.baked = out;
        sheet.ready = true;
      } catch (e) { sheet.ready = false; }
      img.onload = null;
      GOGEngine.requestDraw();
    }
    img.onload = () => {
      if (img.decode) img.decode().then(bakeFrames, bakeFrames); else bakeFrames();
    };
    img.src = SPRITE_BASE + src;
    return sheet;
  }

  // Breezy's baked frame centred on the current origin; gray = the smog-hit look
  // (a grayscale copy made once by GOGEngine.tint, never ctx.filter per frame).


  const sprites = {
    breezyFly: BreezySheet('flying_breezy_v1.png', 5, [
      { sx: 36, sw: 334, cx: 203 },
      { sx: 456, sw: 360, cx: 636 },
      { sx: 898, sw: 359, cx: 1078 },
      { sx: 1334, sw: 361, cx: 1514 },
      { sx: 1784, sw: 364, cx: 1966 }
    ]),
    breezyHappy: BreezySheet('happy-breezy.png', 3, [
      { sx: 30, sw: 600, cx: 330 },
      { sx: 744, sw: 489, cx: 989 },
      { sx: 1330, sw: 459, cx: 1560 }
    ]),
    birds: GOGSpriteSheet('flying-birds.png', 2),        // 2-frame wing flap
    cloudHappy: GOGSpriteSheet('happy-clouds.png', 2),   // 2-frame ambient cloud
    windOrbit: GOGSpriteSheet('wind-orbit.png', 1),      // 1-frame wind updraft
    sunOrbit: GOGSpriteSheet('sun-orbit.png', 1),        // 1-frame collectible energy orb
    buildingLit: GOGSpriteSheet('lit-buildings.png', 2), // 2 lit building variants
    buildingUnlit: GOGSpriteSheet('unlit-buildings.png', 2) // 2 unlit building variants
  };

  // ---------------------------------------------------------------
  // AUDIO (using shared GOGEngine.Audio)
  // ---------------------------------------------------------------
  const audio = new GOGEngine.Audio(!save.settings.sound);
  audio.initBgm("assets/audio/stage05/stage_5.mp3");

  // Sync mute button
  const muteBtn = document.getElementById('muteBtn');
  function syncMuteBtn() {
    if (muteBtn) {
      muteBtn.textContent = audio.muted ? "🔇" : "🔈";
    }
  }
  syncMuteBtn();
  if (muteBtn) {
    muteBtn.addEventListener('click', () => {
      const nowMuted = !audio.muted;
      audio.setMuted(nowMuted);
      GOGSave.patch({ settings: { sound: !nowMuted } });
      syncMuteBtn();
    });
  }

  // Display calm mode badge status
  const calmBadge = document.getElementById('calmBadge');
  if (calmBadge && calmMode) {
    calmBadge.textContent = "🧘 Calm Mode";
  }

  // STREAMLINED: one popup before play, matching stage01's pattern — the
  // guardian beat is the only pre-game dialog and starts play directly
  // (no separate start panel/legend afterward). The intro line auto-plays like
  // every other stage's; see audioPath/fallbackSpeech below.
  function showIntro() {
  GOGUi.showGuardianBeat({
    emoji: "🌬️",
    name: "Breezy",
    role: "Guardian of the Sky",
    line: "The sky turned so grey and heavy with smoke… Will you help me clear it again?",
    audio: audio,
    // Breezy's recorded line isn't delivered yet (see the stage 5 asset brief).
    // Until breezy_intro_lines.mp3 lands, the 404 falls back to the browser voice.
    audioPath: "assets/audio/stage05/breezy_intro_lines.mp3",
    fallbackSpeech: true,
    buttonLabel: "Let's clear the sky!",
    autoDismissMs: 10000,
    onDone: function () {
      audio._ensureCtx();
      initGame();
      gameState = 'playing';
      if (GOGCoach.shouldAutoStart(STAGE_ID)) coach.start();
    }
  });
  }

  function sfxOrb(){ audio.collect(); }
  function sfxBoost(){ audio.heal(); }
  function sfxSmoke(){ audio.hazard(); }
  function sfxWin(){ audio.win(); }
  function sfxFail(){ audio.lose(); }

  // ---------------------------------------------------------------
  // GAME STATE
  // ---------------------------------------------------------------
  let gameState = 'start'; // start | playing | winning | win | fail

  let winWipeRadius = 0;
  let winWipeMax = Math.hypot(W, H) * 0.6;
  let winWipeDone = false;
  let winTimer = 0;

  const GROUND_Y = 520; // top of skyline band
  const PLAY_TOP = 50;
  const PLAY_BOTTOM = 555;

  const BUILDING_COUNT = 6;
  const ENERGY_TARGET = Math.round(BUILDING_COUNT * diff.goalMul());
  const STAGE_DURATION = 60; // 60 seconds stage timer
  let timeLeft = STAGE_DURATION;

  let scrollBase = 2.4;
  let bgOffset1 = 0, bgOffset2 = 0, groundOffset = 0;
  let scrollX = 0;

  const player = {
    x: 170, y: 300, targetY: 300, prevY: 300,
    radius: 24,
    speedFactor: 1,
    boostTimer: 0,
    dragActive: false,
    angle: 0,
    trailTimer: 0,
    animFrame: 0,
    animTimer: 0,
    diving: false // T056: steep-dive state
  };

  let score = 0;
  let clarity = 35;
  let lastScoreForPop = 0; // NEW: drives the City Power chip's pop-juice
  let lastClarityBracket = Math.floor(35 / 25); // NEW: drives the Sky Health chip's pop-juice
  let smokeOverlapThisFrame = false;

  // T059: smoothed reactive sky tint — dips toward smog-gray on contact,
  // pulses toward radiant-blue on a clean touch (updraft/orb), decays to 0
  // otherwise. Separate from the existing progress-based drawSky() split.
  let skyReactTint = 0;

  // T058: migratory bird V-formations — a rarer, separate system from the
  // purely decorative ambient `birds` array above (left untouched).
  let birdFlocks = [];
  let flockSpawnTimer = rand(1500, 2400);
  let playerNearFlock = false;
  const flockBadge = document.getElementById('flockBadge');

  let updrafts = [], smokes = [], orbs = [], particles = [];
  let birds = [], ambientClouds = [], floatTexts = [];
  let foregroundClouds = [];
  let spawnTimers = { updraft: 40, smoke: 60, orb: 20, bird: 30, cloud: 5 };
  let solarSpawnTimer = 100;

  // -----------------------------------------------------------------
  // SOFT SMOG CURRENTS — same flowing-ribbon length language as clean wind,
  // but with soft black/grey smoke colors, fewer overlaps, and wide passable gaps.
  // -----------------------------------------------------------------
  const SMOG_CURRENT_TIERS = {
    easy:   { lenMin:480, lenMax:1620, thickMin:34, thickMax:44, ampMin:8,  ampMax:16, speedMin:0.58, speedMax:0.72, gapMin:255, gapMax:325 },
    medium: { lenMin:340, lenMax:440, thickMin:30, thickMax:40, ampMin:14, ampMax:24, speedMin:0.72, speedMax:0.90, gapMin:230, gapMax:290 },
    hard:   { lenMin:260, lenMax:360, thickMin:26, thickMax:36, ampMin:20, ampMax:32, speedMin:0.88, speedMax:1.05, gapMin:200, gapMax:250 }
  };
  const MAX_VISIBLE_AIR_WAVES = 4;
  const MAX_SMOG_CURRENTS = 2;

  function visibleAirWaveCount(){
    return smokes.length + (typeof windCurrents !== 'undefined' ? windCurrents.length : 0);
  }

  function pickSmogCurrentTier(){
    let wEasy=0.78, wMedium=0.20, wHard=0.02;
    if(score >= 3 && score < 6){ wEasy=0.62; wMedium=0.32; wHard=0.06; }
    else if(score >= 6){ wEasy=0.48; wMedium=0.40; wHard=0.12; }
    const r = Math.random()*(wEasy+wMedium+wHard);
    if(r < wEasy) return 'easy';
    if(r < wEasy+wMedium) return 'medium';
    return 'hard';
  }

  const buildings = [];
  const _solarScratch = []; // reused by the solar-spawn timer (no per-spawn filter() array)

  // Input
  const input = { up:false, down:false, pointerActive:false, pointerY: 300 };

  function rand(a,b){ return a + Math.random()*(b-a); }
  function clamp(v,a,b){ return Math.max(a, Math.min(b,v)); }
  function lerp(a,b,t){ return a + (b-a)*t; }

  // ---------------------------------------------------------------
  // BUILDINGS (static skyline, lights up as orbs collected)
  // ---------------------------------------------------------------

  // ---------------------------------------------------------------
  // BUILDINGS (the town: shoulder to shoulder on one pavement, lights up as suns are collected)
  // ---------------------------------------------------------------
  function buildBuildings(){
    buildings.length = 0;
    skyline = null; // the baked town art belongs to the old layout
    // one building per sun, packed into a tidy row in the middle of the world (the painted
    // sheets have wide empty margins, so spacing is worked out from the building BODY width)
    const n = ENERGY_TARGET;
    const gap = 5, margin = 30;
    const visW = clamp((W - margin * 2 - gap * (n - 1)) / n, 40, 112);
    const total = n * visW + gap * (n - 1);
    const x0 = Math.round((W - total) / 2);
    // a gentle skyline - lower at the ends, tallest just right of the middle (same every run)
    const profile = [0.9, 1.04, 1.2, 1.12, 1.0, 0.92, 1.08, 0.96];
    for(let i=0;i<n;i++){
      const w = visW;
      const h = Math.round(w * 1.28 * profile[i % profile.length]);
      // the 2nd and 5th buildings have solar panels on the roof
      buildings.push({
        x: x0 + i * (visW + gap), w, h, y: H - 12 - h,
        lit:false, litProgress:0, variant: i % 2,
        hasSolar: (i === 1 || i === 4), solarGlowTimer: 0
      });
    }
  }

  const guideText = document.getElementById('guideText');
  let currentMsg = '';
  let msgCooldown = 0;

  function updateGuide(msg, force = false) {
    if (msgCooldown > 0 && !force) return;
    if (currentMsg === msg) return;
    currentMsg = msg;
    guideText.textContent = msg;
    const bubble = guideText.closest('.guideBubble') || guideText;
    bubble.classList.remove('pop');
    void bubble.offsetWidth; // trigger reflow
    bubble.classList.add('pop');
    if (!force) {
      msgCooldown = 120; // 2 seconds cooldown
    }
  }

  function lightNextBuilding(){
    for(let i=0;i<buildings.length;i++){
      if(!buildings[i].lit){
        buildings[i].lit = true;
        const bx = buildings[i].x + buildings[i].w/2;
        const by = buildings[i].y;
        spawnBurst(bx, by, COLORS.gold, 12);
        spawnBurst(bx, by, COLORS.lime, 10); // green leaf particles!
        spawnFloatText(bx, by - 14, '+1 ⚡', COLORS.gold);
        
        // Increase sky health when building lights up!
        clarity = clamp(clarity + 15, 0, 100);
        spawnFloatText(bx - 30, by - 32, '+15% 🌤️', '#7fa0ff');
        return;
      }
    }
  }

  // ---------------------------------------------------------------
  // INIT / RESET
  // ---------------------------------------------------------------
  function initGame(){
    score = 0;
    clarity = 35;
    lastScoreForPop = 0;
    lastClarityBracket = Math.floor(35 / 25);
    timeLeft = STAGE_DURATION;
    player.y = 300; player.targetY = 300; player.prevY = 300;
    player.speedFactor = 1; player.boostTimer = 0; player.angle = 0;
    player.animFrame = 0; player.animTimer = 0;
    updrafts = []; smokes = []; orbs = []; particles = [];
    birds = []; ambientClouds = []; floatTexts = [];
    foregroundClouds = [];
    spawnTimers = { updraft: 40, smoke: 90, orb: 20, bird: 30, cloud: 5, fgCloud: 120 };
    msgCooldown = 0;
    skyReactTint = 0; // T059
    birdFlocks = []; flockSpawnTimer = rand(1500, 2400); playerNearFlock = false; // T058
    GOGUi.setStyle(flockBadge, 'display', 'none');
    player.diving = false; // T056
    scrollX = 0;
    seedAmbientClouds();
    buildBuildings();
    resetWindSystem(); // WIND HOOK — clear/reset Clean Wind Currents on every new run
    updateHUD();
    updateGuide("Let's light up the city! Fly into the blue wind, then touch a sun ☀️", true);
    audio.playBgm();
  }

  const timerChip = document.getElementById('timerChip');
  function updateHUD(){
    // NEW: a quick chunky "pop" on the City Power meter whenever a new
    // orb lands — cheap DOM-only juice, doesn't touch the canvas/physics.
    if (score > lastScoreForPop) {
      lastScoreForPop = score;
      if (cityPowerMeter) GOGUi.restartAnimation(cityPowerMeter, 'chip-pop');
    }
    // DOM writes go through GOGUi.set* so an unchanged HUD costs no style work
    // (this runs every update step; the Sky Health bar is nudged in 0.5% steps).
    const pct = clamp(score/ENERGY_TARGET,0,1)*100;
    GOGUi.setStyle(progressFill, 'width', pct + '%');
    GOGUi.setText(progressText, score + '/' + ENERGY_TARGET);
    const clarityPct = clamp(clarity,0,100);
    GOGUi.setStyle(clarityFill, 'width', (Math.round(clarityPct * 2) / 2) + '%');
    GOGUi.setText(clarityText, Math.round(clarityPct) + '%');
    // NEW: pop the Sky Health chip only when it climbs into a new 25%
    // bracket (not every frame — clarity drifts continuously, so a
    // per-frame pop would just be noise instead of a felt milestone).
    const clarityBracket = Math.floor(clarityPct / 25);
    if (clarityBracket > lastClarityBracket) {
      lastClarityBracket = clarityBracket;
      if (skyHealthMeter) GOGUi.restartAnimation(skyHealthMeter, 'chip-pop');
    } else if (clarityBracket < lastClarityBracket) {
      lastClarityBracket = clarityBracket;
    }
    GOGUi.setStyle(clarityFill, 'background', clarity < 30
      ? 'linear-gradient(90deg, #888, #bbb)'
      : 'linear-gradient(90deg, var(--gog-cobalt), #7fa0ff)');

    // Update Timer Chip
    GOGUi.setText(timerChip, Math.ceil(timeLeft) + 's');
    GOGUi.setClass(timerChip, 'timer-urgent', timeLeft <= 10);

    // Full-frame pulse once the skies are dangerously smoggy or time is running out
    GOGUi.setClass(canvasFrame, 'sky-danger', (clarity < 30 || timeLeft <= 10) && gameState === 'playing');
  }

  // ---------------------------------------------------------------
  // INPUT HANDLING
  // ---------------------------------------------------------------
  window.addEventListener('keydown', (e)=>{
    if(e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') input.up = true;
    if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') input.down = true;
  });
  window.addEventListener('keyup', (e)=>{
    if(e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') input.up = false;
    if(e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') input.down = false;
  });

  function canvasRelativeY(clientY){
    const rect = canvas.getBoundingClientRect();
    const ratio = H / rect.height;
    return (clientY - rect.top) * ratio;
  }

  canvas.addEventListener('pointerdown', (e)=>{
    input.pointerActive = true;
    input.pointerY = canvasRelativeY(e.clientY);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', (e)=>{
    if(input.pointerActive){
      input.pointerY = canvasRelativeY(e.clientY);
    }
  });
  canvas.addEventListener('pointerup', ()=>{ input.pointerActive = false; });
  canvas.addEventListener('pointercancel', ()=>{ input.pointerActive = false; });

  // ---------------------------------------------------------------
  // SPAWNING
  // ---------------------------------------------------------------
  function spawnUpdraft(){
    const y = rand(PLAY_TOP+40, PLAY_BOTTOM-100);
    updrafts.push({
      x: W + 60, y, baseY: y,
      radius: rand(30,42),
      wobble: rand(0, Math.PI*2),
      speed: rand(1.6, 2.2),
      spin: 0
    });
  }
  function spawnSmoke(x, force){
    if(!force){
      if(smokes.length >= MAX_SMOG_CURRENTS) return null;
      if(score >= 5) return null; // Environmental progression: stop spawning dirty factories!
    }
    const smogTier = pickSmogCurrentTier();
    const tCfg = SMOG_CURRENT_TIERS[smogTier];
    // Wide clean opening (GOGConstants.STAGE5.smogGap) so the 4-6 end of the
    // audience can thread it; calm mode widens it a further 20%.
    const gapCfg = GOGConstants.STAGE5.smogGap;
    const gapWidth = rand(gapCfg.min, gapCfg.max) * (calmMode ? gapCfg.calmMul : 1);
    const smoke = {
      x: x === undefined ? W + 120 : x,
      y: GROUND_Y,
      radius: rand(tCfg.thickMin, tCfg.thickMax) * 0.9,
      wobble: rand(0, Math.PI*2),
      speed: 1.0, // scroll at matching speed with ground
      smogTier: smogTier,
      gapY: rand(180, 340),
      gapWidth: gapWidth,
      glintOffset: rand(0, 1)
    };
    smokes.push(smoke);
    return smoke;
  }
  function spawnOrb(){
    const y = rand(PLAY_TOP+20, PLAY_BOTTOM-40);
    orbs.push({ x: W+50, y, baseY: y, radius: 18, wobble: rand(0,Math.PI*2), collected:false });
  }

  // ambient decorative flock (purely visual, no collisions)
  function spawnBird(){
    const y = rand(PLAY_TOP-10, PLAY_TOP+140);
    const baseSpeed = rand(1.1, 1.9);
    birds.push({
      x: W + rand(20,90), y, baseY: y,
      speed: baseSpeed,
      h: rand(20,30),
      flapTimer: rand(0,1),
      flapRate: rand(7,11),
      wobble: rand(0,Math.PI*2)
    });
  }

  // ambient far-background friendly clouds (purely visual, drift slowly)
  function spawnAmbientCloud(x){
    ambientClouds.push({
      x: x !== undefined ? x : W + rand(30,120),
      y: rand(PLAY_TOP-10, PLAY_BOTTOM*0.55),
      h: rand(46,74),
      speed: rand(0.35,0.6),
      blinkTimer: rand(0,6),
      frame: 0
    });
  }
  function seedAmbientClouds(){
    for(let i=0;i<4;i++){
      spawnAmbientCloud(rand(0, W));
    }
  }

  // ---------------------------------------------------------------
  // PARTICLES
  // ---------------------------------------------------------------
  function spawnTrailParticle(){
    particles.push({
      x: player.x - player.radius*0.6, y: player.y + rand(-8,8),
      vx: rand(-1.5,-0.5), vy: rand(-0.5,0.5),
      life: 1, maxLife: rand(0.4,0.7),
      color: Math.random() < 0.5 ? COLORS.lime : COLORS.cobalt,
      size: rand(3,6)
    });
  }
  const RAINBOW_COLORS = ['#FFD23F', '#FF9F1C', '#FF4A75', '#00C6FF', '#C6FF3D', '#E040FB'];
  function spawnBurst(x,y,color,count){
    const colors = color === 'rainbow' ? RAINBOW_COLORS : [color];
    for(let i=0;i<count;i++){
      const a = rand(0, Math.PI*2);
      const spd = rand(2.0,6.0);
      const col = colors[Math.floor(Math.random() * colors.length)];
      particles.push({
        x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd,
        life: 1, maxLife: rand(0.6,1.2), color: col, size: rand(4,8)
      });
    }
  }

  // Floating reward-text pop-ups — a short, bouncy, high-contrast label
  // right at the spot something good happened, so the win is felt
  // immediately instead of only announced in the guide bar up top.
  function spawnFloatText(x, y, text, color){
    floatTexts.push({ x, y, text, color: color || COLORS.ink, life: 1, maxLife: 1 });
  }
  function updateFloatTexts(dt){
    for(let i=floatTexts.length-1;i>=0;i--){
      const t = floatTexts[i];
      t.life -= dt/60*1.1;
      t.y -= 0.6*dt;
      if(t.life <= 0) floatTexts.splice(i,1);
    }
  }

  // ---------------------------------------------------------------
  // UPDATE
  // ---------------------------------------------------------------
  function update(dt){
    // Guided intro (see GUIDED COACH below): "learning" pauses the countdown and
    // keeps smoke from draining Sky Health to zero; "coachHold" also freezes the
    // scrolling world until the player has tried steering once.
    const learning = coach.active;
    const coachHold = learning && coach.index === 0;

    if (msgCooldown > 0) {
      msgCooldown -= dt;
    }
    
    if (gameState === 'playing' && !learning) {
      timeLeft = Math.max(0, timeLeft - dt / 60);
    }
    
    // --- solar panels ticking & spawning orbs ---
    for (let i = 0; i < buildings.length; i++) {
      if (buildings[i].solarGlowTimer > 0) buildings[i].solarGlowTimer -= dt;
    }
    if (gameState === 'playing' && !learning) {
      solarSpawnTimer -= dt;
      if (solarSpawnTimer <= 0) {
        const activeSolar = _solarScratch;
        activeSolar.length = 0;
        for (let i = 0; i < buildings.length; i++) {
          const sb = buildings[i];
          if (sb.hasSolar && sb.x > 50 && sb.x < W - 50) activeSolar.push(sb);
        }
        if (activeSolar.length > 0) {
          const b = activeSolar[Math.floor(Math.random() * activeSolar.length)];
          b.solarGlowTimer = 45;
          const orbX = b.x + b.w / 2;
          const orbY = b.y - 18;
          orbs.push({
            x: orbX,
            y: orbY,
            baseY: orbY,
            radius: 18,
            wobble: rand(0, Math.PI * 2),
            collected: false,
            floatUpSpeed: rand(1.1, 1.8) // floats upwards!
          });
          spawnFloatText(orbX, orbY - 14, "Solar Energy! ☀️", '#FFC93C');
          spawnBurst(orbX, orbY, '#FFC93C', 8);
        }
        solarSpawnTimer = rand(150, 240);
      }
    }

    // --- background scroll ---
    const effScroll = coachHold ? 0 : scrollBase * player.speedFactor;
    bgOffset1 = (bgOffset1 + effScroll*0.3*dt) % W;
    bgOffset2 = (bgOffset2 + effScroll*0.6*dt) % W;
    groundOffset = (groundOffset + effScroll*1.0*dt) % 40;
    scrollX += effScroll * dt;

    // --- player target Y from input ---
    if(input.pointerActive){
      player.targetY = clamp(input.pointerY, PLAY_TOP, PLAY_BOTTOM);
    } else if(input.up || input.down){
      const dir = (input.up ? -1 : 0) + (input.down ? 1 : 0);
      player.targetY = clamp(player.targetY + dir*4.6*dt, PLAY_TOP, PLAY_BOTTOM);
    }

    player.prevY = player.y;
    player.y = lerp(player.y, player.targetY, clamp(0.14*dt,0,1));
    const dy = player.y - player.prevY;
    player.angle = clamp(dy*0.05, -0.5, 0.5);

    // T056: leaning into a steep dive triggers full-screen speed lines +
    // a one-shot whoosh. `dy` is per-frame vertical movement (~60fps units),
    // so a sustained fast downward glide crosses this threshold.
    const wasDiving = player.diving;
    player.diving = dy > 3.2 && gameState === 'playing';
    if (player.diving && !wasDiving) {
      audio.tone(220, 0.35, 'sawtooth', 0.05, 90);
    }

    // --- speed factor decay / boost handling ---
    if(player.boostTimer > 0){
      player.boostTimer -= dt;
      player.speedFactor = lerp(player.speedFactor, 2.0, 0.15*dt);
    } else {
      player.speedFactor = lerp(player.speedFactor, 1, 0.03*dt);
    }

    // --- sprite animation frame ---
    const frameCount = (player.boostTimer > 0) ? sprites.breezyHappy.frameCount : sprites.breezyFly.frameCount;
    const fps = (player.boostTimer > 0) ? 8 : 11;
    player.animTimer += dt/60*fps;
    player.animFrame = Math.floor(player.animTimer) % frameCount;

    // --- trail particles: subtle always-on wind trail, denser while boosted ---
    player.trailTimer -= dt;
    if(player.trailTimer <= 0){
      spawnTrailParticle();
      player.trailTimer = player.boostTimer > 0 ? 2 : 6;
    }

    // --- spawn timers ---
    if(!coachHold){
      spawnTimers.smoke -= dt;
      spawnTimers.orb -= dt;
    }
    spawnTimers.bird -= dt;
    spawnTimers.cloud -= dt;
    spawnTimers.fgCloud -= dt;
    if(spawnTimers.smoke <= 0){
      const spawnGap = GOGConstants.STAGE5.smogSpawnFrames;
      spawnSmoke();
      spawnTimers.smoke = rand(spawnGap.min, spawnGap.max) * diff.spawnIntervalMul();
    }
    if(spawnTimers.orb <= 0){ spawnOrb(); spawnTimers.orb = rand(55,90); }
    // Birds spawn more frequently as clean energy progress increases!
    if(spawnTimers.bird <= 0){ spawnBird(); spawnTimers.bird = rand(90,160) / (1.0 + score * 0.35); }
    if(spawnTimers.cloud <= 0){ spawnAmbientCloud(); spawnTimers.cloud = rand(140,220); }
    if(spawnTimers.fgCloud <= 0){ spawnForegroundCloud(); spawnTimers.fgCloud = rand(180,300); }

    // T058: rarer migratory bird V-formations
    flockSpawnTimer -= dt;
    if(flockSpawnTimer <= 0){ spawnBirdFlock(); flockSpawnTimer = rand(1500, 2400); }

    // --- update updrafts ---
    smokeOverlapThisFrame = false;
    for(let i=updrafts.length-1;i>=0;i--){
      const u = updrafts[i];
      u.x -= u.speed * effScroll * dt;
      u.wobble += 0.05*dt;
      u.y = u.baseY + Math.sin(u.wobble)*10;
      u.spin += 0.08*dt;
      if(u.x < -80){ updrafts.splice(i,1); continue; }
      const d = Math.hypot(u.x-player.x, u.y-player.y);
      if(d < u.radius + player.radius*0.7){
        player.boostTimer = 55;
        player.speedFactor = Math.max(player.speedFactor, 1.6);
        clarity = clamp(clarity + 6, 0, 100);
        skyReactTint = 1; // T059: instantly clears to radiant blue on a clean touch
        spawnBurst(player.x, player.y, COLORS.lime, 12);
        sfxBoost();
        updrafts.splice(i,1);
        updateGuide("Wheeeee! Super wind power! Go Breezy, go! 🌪️💨");
      }
    }

    // --- update smokes ---
    for(let i=smokes.length-1;i>=0;i--){
      const s = smokes[i];
      s.x -= s.speed * effScroll * dt;
      s.wobble += 0.02 * dt;

      // Spawn ambient smoke particles rising from the chimney
      if (gameState === 'playing' && Math.random() < 0.2 * dt) {
        const chimneyY = GROUND_Y - 56;
        const ry = rand(PLAY_TOP, chimneyY);
        // If the particle is not inside the gap
        if (Math.abs(ry - s.gapY) > s.gapWidth / 2) {
          const age = (chimneyY - ry) / (chimneyY + 40);
          const twist = Math.sin(age * Math.PI * 1.8 - frameNow * 0.0025 + s.wobble) * 45 * age;
          particles.push({
            x: s.x + twist + rand(-10, 10),
            y: ry,
            vx: -s.speed * effScroll - rand(0.2, 0.8),
            vy: rand(-0.4, -0.1), // slowly rising
            life: 1, maxLife: rand(0.5, 0.9),
            color: Math.random() < 0.5 ? '#363a40' : '#52575f',
            size: rand(3, 6)
          });
        }
      }

      if(s.x < -150){ smokes.splice(i,1); continue; }

      let hit = false;
      const chimneyY = GROUND_Y - 56;
      if (player.y < chimneyY && player.y > -50) {
        const inGap = Math.abs(player.y - s.gapY) < s.gapWidth / 2;
        if (!inGap) {
          const age = (chimneyY - player.y) / (chimneyY + 40);
          const twist = Math.sin(age * Math.PI * 1.8 - frameNow * 0.0025 + s.wobble) * 45 * age;
          const plumeX = s.x + twist;
          const pr = s.radius * (1.0 + age * 1.6) * diff.enemySpeedMul();
          
          if (Math.abs(player.x - plumeX) < (player.radius * 0.45 + pr * 0.50)) {
            hit = true;
          }
        }
      }

      if(hit){
        smokeOverlapThisFrame = true;
        player.boostTimer = 0;
        player.speedFactor = Math.max(0.4, player.speedFactor - 0.04*dt);
        const clarityDrop = (calmMode ? 0.15 * dt : 0.45 * dt) * diff.enemySpeedMul();
        const minClarity = (calmMode || learning) ? 25 : 0;
        clarity = clamp(clarity - clarityDrop, minClarity, 100);
        updateGuide("Uh-oh! Watch out for the dirty smoke! Catch a green breeze to go fast! 🌤️🌫️");
      }
    }
    if(smokeOverlapThisFrame){
      if(Math.random() < 0.04*dt) sfxSmoke();
      skyReactTint = lerp(skyReactTint, -1, clamp(0.12*dt, 0, 1)); // T059: sky turns gray on contact
    } else {
      // passive gentle regen when clear
      clarity = clamp(clarity + 0.10*dt, 0, 100);
      skyReactTint = lerp(skyReactTint, 0, clamp(0.05*dt, 0, 1)); // T059: fades back to neutral
    }

    // --- update orbs ---
    for(let i=orbs.length-1;i>=0;i--){
      const o = orbs[i];
      o.x -= effScroll * dt;
      if (o.floatUpSpeed) {
        o.baseY = clamp(o.baseY - o.floatUpSpeed * dt, PLAY_TOP + 10, GROUND_Y - 40);
      }
      o.wobble += 0.08*dt;
      o.y = o.baseY + Math.sin(o.wobble)*8;
      if(o.x < -40){ orbs.splice(i,1); continue; }
      const d = Math.hypot(o.x-player.x, o.y-player.y);
      if(d < (o.radius + player.radius*0.75) * diff.forgivenessMul()){
        const canCollect = (player.windInfluence || 0) > 0.15;
        if (canCollect) {
          orbs.splice(i,1);
          score++;
          clarity = clamp(clarity + 12, 0, 100); // Clean energy heals the sky!
          skyReactTint = 1; // T059: clears to radiant blue
          player.boostTimer = Math.max(player.boostTimer, 30); // T059: orbs now also give a speed surge
          player.speedFactor = Math.max(player.speedFactor, 1.35);
          lightNextBuilding();
          spawnBurst(player.x, player.y, 'rainbow', 18);
          sfxOrb();
          
          if (score === 1) {
            updateGuide("Awesome! The first building is lit! 🏠💛", true);
          } else if (score === 3) {
            updateGuide("Look at the city glow! You are doing great! ⚡✨", true);
          } else if (score === 5) {
            updateGuide("More than half way! Breezy is flying like a superstar! 🌤️🎈", true);
          } else if (score === 7) {
            updateGuide("Just one more sun to light the whole city! You can do it! 🏆🚀", true);
          } else if (score < ENERGY_TARGET) {
            updateGuide("Yay! Another building is lit! Keep going! 🌟🎉", true);
          }
          
          if(score >= ENERGY_TARGET){
            triggerWin();
          }
        } else {
          // Play a tiny warning effect so they know it can only be collected in the wind wave
          if (Math.random() < 0.12 * dt) {
            spawnFloatText(o.x, o.y - 12, "Need Wind! 💨", '#ff5555');
            updateGuide("Fly into the blue wind first, then touch the sun! 🌬️☀️");
          }
        }
      }
    }

    // --- update ambient birds (decorative, no collision) ---
    for(let i=birds.length-1;i>=0;i--){
      const b = birds[i];
      b.x -= b.speed * effScroll * dt;
      b.wobble += 0.04*dt;
      b.y = b.baseY + Math.sin(b.wobble)*6;
      b.flapTimer += dt/60*b.flapRate;
      if(b.x < -60){ birds.splice(i,1); }
    }

    // --- update ambient clouds (decorative, no collision) ---
    for(let i=ambientClouds.length-1;i>=0;i--){
      const c = ambientClouds[i];
      c.x -= c.speed * effScroll * dt;
      c.blinkTimer -= dt/60;
      if(c.blinkTimer <= 0){ c.frame = 1 - c.frame; c.blinkTimer = rand(2.5,5); }
      if(c.x < -100){ ambientClouds.splice(i,1); }
    }

    // --- update foreground clouds (decorative, Layer 6) ---
    for(let i=foregroundClouds.length-1;i>=0;i--){
      const c = foregroundClouds[i];
      c.x -= c.speed * effScroll * dt;
      if(c.x < -160){ foregroundClouds.splice(i,1); }
    }

    // --- particles ---
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.life -= dt/60/p.maxLife*3.6;
      if(p.life <= 0) particles.splice(i,1);
    }
    updateFloatTexts(dt);

    // --- soft clutch check ---
    if (clarity < 20 && (STAGE_DURATION - timeLeft) < 15 && !diff.softClutched && gameState === 'playing') {
      diff.softClutch();
    }

    // --- fail check ---
    if(clarity <= 0 && gameState === 'playing'){
      triggerFail();
    }

    // --- low clarity warning ---
    if (clarity < 35 && gameState === 'playing') {
      updateGuide("Brrr, it's a bit smoggy! Let's catch a green updraft to clean the sky! 🍃💚");
    }

    // WIND HOOK — Clean Wind Currents system (see section above render()).
    // Runs after everything else this frame so it only layers gentle
    // extra effects on top of the player's already-computed movement.
    updateWindManager(dt, effScroll);
    applyWindEffectsToPlayer(dt);
    applyOrbMagnetism(dt);
    updateWindParticles(dt);
    updateAmbientFlyers(dt, effScroll);
    detectWindOrbBonus();
    updateBirdFlocks(dt, effScroll); // T058

    updateCoach(dt);
    updateHUD();
  }

  let pendingStars = 1;

  function triggerWin(){
    audio.stopBgm();
    gameState = 'winning';
    winWipeRadius = 0;
    winTimer = 0;
    smokes = []; // Clear all smoke instantly!
    buildings.forEach(b => {
      b.lit = true;
    });
    sfxWin();

    var stars = GOGProgress.stars.fromRules([
      { stars: 3, when: clarity >= 90 },
      { stars: 2, when: clarity >= 60 },
      { stars: 1, when: true }
    ]);
    var rec = GOGProgress.finishStage(STAGE_ID, { stars: stars, diff: diff });
    pendingStars = rec.stars;

    GOGSave.recordStageClear(STAGE_ID, {
      stars: stars,
      sprouts: 15,
      smogDrop: 10
    });
    updateGuide("Hooray! The city is fully lit and the sky is beautiful! You did it! 🏆🎉🌈", true);
  }
  function finishWin(){
    gameState = 'win';
    // STREAMLINED: one popup on win, matching stages 1-4 — Breezy's
    // grateful line, the star rating, and the fact card all live in a
    // single shared GOGUi.showOverlay card instead of a separate
    // guardian-beat dialog first.
    const winOverlay = GOGUi.showOverlay({
      accent: "var(--gog-white)",
      title: "⚡ The City is Powered!",
      body: "“The city is glowing and the sky is clear and blue again! Thank you for the clean wind. 🌈”<br><br>Breezy wakes completely as the clean winds sweep away the smog.",
      stars: pendingStars,
      factText: stageMeta ? stageMeta.fact : "Wind and sun make electricity without polluting the air.",
      primaryLabel: "Back to Map",
      secondaryLabel: "Play Again",
      onPrimary: function () {
        window.location.href = "../index.html";
      },
      onSecondary: function () {
        restartInPage(winOverlay);
      },
    });
  }

  // Retry without reloading the page, so the "meet Breezy" intro and its
  // narration don't replay every time (a reload also restarted the coach).
  function restartInPage(overlayEl){
    GOGUi.closeOverlay(overlayEl);
    winWipeRadius = 0; winWipeDone = false; winTimer = 0;
    initGame();
    gameState = 'playing';
  }

  function triggerFail(){
    audio.stopBgm();
    gameState = 'fail';
    sfxFail();
    GOGProgress.failStage(STAGE_ID, { diff: diff });

    // STREAMLINED: one popup on fail, matching stages 1-4's plain retry card.
    const failOverlay = GOGUi.showOverlay({
      title: "Let's Catch Some Air!",
      body: "The skies got a bit foggy — take a breath and try gliding through those clean updrafts again.",
      primaryLabel: "Try Again",
      secondaryLabel: "Back to Map",
      onPrimary: function () {
        restartInPage(failOverlay);
      },
      onSecondary: function () {
        window.location.href = "../index.html";
      },
    });
    updateGuide("It's okay! Let's take a deep breath and try gliding together again! 💖", true);

  // ---------------------------------------------------------------
  // GUIDED COACH — three short, doable steps the first time the stage is
  // opened in a session (the ❓ button replays it). The countdown is paused and
  // smoke can't empty Sky Health while it runs, so nobody can fail the lesson.
  // ---------------------------------------------------------------
  const COACH_STEPS = [
    { icon: '👆', title: 'Fly Breezy', text: 'Slide your finger <b>up and down</b>.', keys: 'Keys: <kbd>↑</kbd> <kbd>↓</kbd>', say: 'Slide your finger up and down to fly Breezy.' },
    { icon: '☁️', title: 'Dodge the smoke', text: 'Grey smoke hurts the sky. Fly through the <b>green gap</b>!', say: 'Grey smoke hurts the sky. Fly through the green gap.' },
    { icon: '☀️', title: 'Ride the wind', text: 'Fly into the <b>blue wind</b>. Then touch the <b>sun</b>!', say: 'Fly into the blue wind. Then touch the sun to light up a building.' }
  ];
  let coachSmoke = null;   // the smoke column step 2 points at
  let coachSunTimer = 0;   // frames until another demo sun may be placed

  const coach = GOGCoach.create({
    stageId: STAGE_ID,
    frame: canvasFrame,
    steps: COACH_STEPS,
    onStep: function (i) {
      if (i === 1) {
        coachSmoke = smokes.find(s => s.x > player.x + 60) || spawnSmoke(W - 20, true);
      } else if (i === 2) {
        coachSunTimer = 0;
        spawnCoachSun();
      }
    },
    onFinish: function (reason) {
      coachSmoke = null;
      updateGuide(reason === 'done'
        ? "Great flying! Now light every building before time runs out! ⚡"
        : "Let's go! Light every building with clean sun power! ⚡", true);
    }
  });

  // A wind ribbon with a sun parked inside it, so the whole "ride the wind,
  // grab the sun" idea is visible at once instead of waiting on random spawns.
  function spawnCoachSun(){
    const cur = spawnWindCurrent('easy');
    if(!cur) return;
    cur.x = W - 60;
    updateWindCurrentSamples(cur);
    const ox = cur.x + cur.length * 0.3;
    const sp = sampleWindCurrentAt(cur, ox);
    orbs.push({ x: ox, y: sp.y, baseY: sp.y, radius: 18, wobble: 0, collected: false });
  }

  function updateCoach(dt){
    if(!coach.active) return;
    const i = coach.index;
    if(i === 0){
      if(Math.abs(player.targetY - 300) > 45) coach.advance();
    } else if(i === 1){
      if(!coachSmoke || !smokes.includes(coachSmoke) || coachSmoke.x < player.x - 40) coach.advance();
    } else if(i === 2){
      if(score >= 1){ coach.advance(); return; }
      coachSunTimer -= dt;
      if(coachSunTimer <= 0 && !orbs.some(o => o.x > player.x - 10)){
        spawnCoachSun();
        coachSunTimer = 120;
      }
    }
  }


  const helpBtn = document.getElementById('helpBtn');

  // ---------------------------------------------------------------
  // RENDER
  // ---------------------------------------------------------------
  // ---------------------------------------------------------------
  // BACKDROP — painted once per resolution into cached "sick" and "well"
  // layers (GOGScenery) and cross-faded by progress. Same recipe as Stage 3:
  // bright sky, hills with trees, grass. Polluted = a soft lilac-grey haze,
  // never dark; healed = candy blue. No per-frame gradients.
  // ---------------------------------------------------------------
  const SKY_TOP = 300; // far / mid hill layers are painted from this y down

  function buildBackdrop(){
    const S = GOGScenery, sc = hiDpi.scale;
    backdrop = {
      sky: S.layerPair(W, H, sc, paintSkyLayer),
      far: S.layerPair(W, H - SKY_TOP, sc, paintFarLayer),
      mid: S.layerPair(W, H - SKY_TOP, sc, paintMidLayer),
      ground: S.layerPair(W, H - GROUND_Y, sc, paintGroundLayer)
    };
  }

  function paintSkyLayer(g, P){
    const grad = g.createLinearGradient(0, 0, 0, GROUND_Y + 40);
    grad.addColorStop(0, P('#AEB3D8', '#4FB0F5'));
    grad.addColorStop(0.6, P('#CBC4DA', '#BDE5FB'));
    grad.addColorStop(1, P('#EBCFBE', '#FFF1CF'));
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);
    if (P(false, true)) {
      GOGScenery.sun(g, 80, 80, 38, { rays: 12 });
    } else {
      // hazy, rayless sun: the pollution is hiding it
      g.fillStyle = '#F2DCC8';
      g.beginPath(); g.arc(80, 80, 40, 0, Math.PI * 2); g.fill();
    }
  }

  function paintTurbine(g, x, baseY, h, body, angle){
    g.fillStyle = body;
    g.beginPath();
    g.moveTo(x - 3, baseY); g.lineTo(x - 1.5, baseY - h); g.lineTo(x + 1.5, baseY - h); g.lineTo(x + 3, baseY);
    g.closePath(); g.fill();
    for (let b = 0; b < 3; b++) {
      g.save();
      g.translate(x, baseY - h);
      g.rotate(angle + b * Math.PI * 2 / 3);
      g.beginPath();
      g.moveTo(0, 0); g.quadraticCurveTo(4, -h * 0.28, 1.5, -h * 0.6); g.quadraticCurveTo(-1.5, -h * 0.28, 0, 0);
      g.fill();
      g.restore();
    }
  }

  function paintFarLayer(g, P){
    g.translate(0, -SKY_TOP);
    const crest = GOGScenery.hills(g, W, H, 420, 95, P('#C2BDD6', '#B5E0AE'), P('#B7B2CD', '#9ED496'), 11);
    const body = P('#DAD6E6', '#F4F7FB');
    paintTurbine(g, 210, crest(210) + 4, 52, body, 0.5);
    paintTurbine(g, 585, crest(585) + 4, 44, body, 1.7);
  }

  function paintMidLayer(g, P){
    g.translate(0, -SKY_TOP);
    const crest = GOGScenery.hills(g, W, H, 488, 62, P('#AFAA9C', '#8CCB78'), P('#A3A090', '#74BC61'), 29);
    const rng = GOGScenery.seededRng(77);
    for (let i = 0; i < 8; i++) {
      const tx = 55 + i * 92 + rng() * 34;
      GOGScenery.roundTree(g, tx, crest(tx) + 6, 0.8 + rng() * 0.5, {
        main: P('#9AA58C', '#5FAE4E'), dark: P('#86917A', '#4A9440'), lite: P('#B1BBA3', '#80CE69'),
        trunk: P('#9A8E80', '#8B6B4A')
      });
    }
  }

  function paintGroundLayer(g, P){
    const h = H - GROUND_Y;
    const grad = g.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, P('#B2B79B', '#8ED04F'));
    grad.addColorStop(1, P('#999E85', '#5A9A2E'));
    g.fillStyle = grad;
    g.fillRect(0, 0, W, h);
    g.fillStyle = 'rgba(255,255,255,0.2)';
    g.fillRect(0, 4, W, 9);
    g.fillStyle = '#111';
    g.fillRect(0, 0, W, 4);
    const rng = GOGScenery.seededRng(5);
    g.strokeStyle = P('rgba(90,90,70,0.2)', 'rgba(40,90,20,0.22)');
    g.lineWidth = 3; g.lineCap = 'round';
    for (let k = 0; k < 16; k++) {
      const gx = 20 + rng() * (W - 80), gy = 22 + rng() * (h - 30);
      g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx + 16 + rng() * 20, gy); g.stroke();
    }
    if (P(false, true)) {
      const cols = ['#FF7FB5', '#FFD23F', '#fff'];
      for (let f = 0; f < 10; f++) {
        g.fillStyle = cols[f % 3];
        g.beginPath(); g.arc(30 + rng() * (W - 60), 18 + rng() * (h - 24), 3, 0, Math.PI * 2); g.fill();
      }
    }
  }

  // One parallax strip, only for the dest columns x0..x1. Everything is snapped to whole
  // bitmap pixels: a fractional x forces a bilinear resample of the whole strip on every
  // frame (the most expensive thing the CPU rasteriser does here), a whole-pixel x is a
  // plain copy. The src rect keeps the same dest->src mapping as a full-tile draw.

  // The whole backdrop in one palette for the dest columns x0..x1 (multiples of 4 logical
  // px, i.e. whole bitmap pixels at every supported scale).


  function getCloudArt(){
    if (!cloudArt) {
      const sc = hiDpi.scale;
      cloudArt = {
        smog: GOGScenery.paintLayer(130, 80, sc, (g) => { GOGScenery.smogPuff(g, 65, 42, 1.35); }, 'sick'),
        white: GOGScenery.paintLayer(130, 80, sc, (g) => { GOGScenery.cloud(g, 65, 38, 1.2, { ink: true }); }, 'sick')
      };
    }
    return cloudArt;
  }

  function starPath(x, y, r, g){
    g = g;
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5;
      const rr = i % 2 === 0 ? r : r * 0.45;
      if (i === 0) g.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
      else g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    g.closePath();
  }


  // The ink strip, every contact shadow and every unlit building never change during a
  // run, so they are painted ONCE into a single strip (at the on-screen resolution) and
  // blitted. Only what animates is drawn per frame: the lit overlay, the bobbing star,
  // the spinning turbine, ivy while it grows, and the solar glow.

  // Small ink-outlined decorations, painted once (4x) and drawn as sprites.
  let skyArt = null;
  function getSkyArt(){
    if (skyArt) return skyArt;
    function mk(w, h, ox, oy, scale, paint){
      const c = GOGEngine.bake(w, h, (g) => { g.translate(-ox, -oy); paint(g); }, scale);
      c.ox = ox; c.oy = oy;
      return c;
    }
    const INK = COLORS.ink;
    skyArt = {
      star: mk(32, 32, -16, -16, 4, (g) => {
        starPath(0, 0, 12, g);
        g.fillStyle = COLORS.gold; g.strokeStyle = INK; g.lineWidth = 3; g.lineJoin = 'round';
        g.fill(); g.stroke();
      }),
      tower: mk(12, 30, -6, -26, 4, (g) => {
        g.strokeStyle = INK; g.lineWidth = 2.5;
        g.fillStyle = '#f4f7fb';
        g.beginPath();
        g.moveTo(-3, 0); g.lineTo(-1.5, -24); g.lineTo(1.5, -24); g.lineTo(3, 0);
        g.closePath(); g.fill(); g.stroke();
      }),
      rotor: mk(32, 32, -16, -16, 4, (g) => {
        g.strokeStyle = INK; g.lineWidth = 2.5; g.fillStyle = '#ffffff';
        for (let i = 0; i < 3; i++) {
          g.rotate(Math.PI * 2 / 3);
          g.beginPath();
          g.moveTo(0, 0);
          g.quadraticCurveTo(3, -5, 1.5, -12);
          g.quadraticCurveTo(-1.5, -5, 0, 0);
          g.closePath();
          g.fill(); g.stroke();
        }
      }),
      leaf: mk(16, 16, -8, -8, 4, (g) => {
        g.fillStyle = COLORS.limeDark; g.strokeStyle = INK; g.lineWidth = 2;
        g.beginPath(); g.arc(0, 0, 5.5, 0, TAU); g.fill(); g.stroke();
      }),
      panel: mk(56, 26, -28, -22, 4, (g) => {
        g.strokeStyle = INK;
        g.lineWidth = 3.5;
        g.beginPath();
        g.moveTo(-16, 0); g.lineTo(-12, -8);
        g.moveTo(16, 0); g.lineTo(12, -8);
        g.stroke();
        g.rotate(-0.15);
        g.fillStyle = '#1c34a1';
        g.fillRect(-22, -14, 44, 10);
        g.strokeRect(-22, -14, 44, 10);
        g.strokeStyle = 'rgba(255,255,255,0.7)';
        g.lineWidth = 1;
        g.beginPath();
        g.moveTo(-11, -14); g.lineTo(-11, -4);
        g.moveTo(0, -14); g.lineTo(0, -4);
        g.moveTo(11, -14); g.lineTo(11, -4);
        g.stroke();
      })
    };
    return skyArt;
  }

  // the solar glow circle centre, in the panel's -0.15 rad tilted frame
  const PANEL_GLOW_DX = 12 * Math.sin(-0.15), PANEL_GLOW_DY = -12 * Math.cos(-0.15);


  function spawnForegroundCloud(x){
    foregroundClouds.push({
      x: x !== undefined ? x : W + 120,
      y: rand(22, 96), // high up, so they decorate the sky without hiding the play area
      h: rand(70, 105),

    });

  // T058: migratory bird V-formations — a rarer special event, separate
  // from the purely ambient `birds` array. Flying alongside the leader
  // grants a speed bonus and a "Flying Together" HUD badge.
  function spawnBirdFlock(){
    const baseY = rand(PLAY_TOP + 60, PLAY_BOTTOM - 120);
    const speed = rand(1.4, 1.8);
    const count = 5;
    const offsets = [];
    for(let i=0;i<count;i++){
      const side = i % 2 === 0 ? 1 : -1;
      const rank = Math.ceil(i/2);
      offsets.push({ dx: -rank*26, dy: side*rank*16 });
    }
    birdFlocks.push({
      x: W + 100, y: baseY, speed, offsets,
      flapTimer: rand(0,1), flapRate: rand(7,10)
    });
  }

  function updateBirdFlocks(dt, effScroll){
    for(let i=birdFlocks.length-1;i>=0;i--){
      const f = birdFlocks[i];
      f.x -= f.speed * effScroll * dt;
      f.flapTimer += dt/60 * f.flapRate;
      if(f.x < -160){ birdFlocks.splice(i,1); }
    }

    let alongside = false;
    for(const f of birdFlocks){
      if(Math.hypot(f.x - player.x, f.y - player.y) < 90){ alongside = true; break; }
    }
    if(alongside && !playerNearFlock){
      updateGuide("Flying together! ✨🐦", true);
    }
    playerNearFlock = alongside;
    if(alongside){
      player.speedFactor = Math.max(player.speedFactor, 1.5);
    }
    GOGUi.setStyle(flockBadge, 'display', alongside ? '' : 'none');
  }


  // A friendly-looking, faceless factory that sits on the grass.
  // Smoke art, baked once. The plume is ~25 soft puffs per column, and each used to build
  // two radial gradients every frame. The puffs now share two pre-rendered sprites
  // (outer haze + inner core) that are scaled to the puff size and faded with globalAlpha:
  // a gradient's alpha stops scale linearly, so this is the same picture. Painted at 3x
  // because they get scaled up to ~110px radius.
  const SMOKE_U = 40; // unit "size" the sprites are baked at
  let smokeArt = null;
  function getSmokeArt(){
    if (smokeArt) return smokeArt;
    const U = SMOKE_U, oR = U * 1.3;
    smokeArt = {
      // (outer) haze: focus slightly up-left of centre
      outer: GOGEngine.bake(oR * 2, oR * 2, (g) => {
        const grad = g.createRadialGradient(oR - U * 0.1, oR - U * 0.1, 0, oR, oR, oR);
        grad.addColorStop(0, 'rgba(45, 48, 55, 0.45)');
        grad.addColorStop(0.5, 'rgba(35, 37, 42, 0.25)');
        grad.addColorStop(1, 'rgba(20, 20, 22, 0)');
        g.fillStyle = grad;
        g.beginPath(); g.arc(oR, oR, oR, 0, TAU); g.fill();
      }, 4),
      // heavy billowing core with a lighter highlight
      core: GOGEngine.bake(U * 2, U * 2, (g) => {
        const grad = g.createRadialGradient(U - U * 0.2, U - U * 0.2, 0, U, U, U);
        grad.addColorStop(0, 'rgba(75, 78, 85, 0.85)');
        grad.addColorStop(0.5, 'rgba(35, 37, 42, 0.75)');
        grad.addColorStop(0.9, 'rgba(20, 21, 23, 0.45)');
        grad.addColorStop(1, 'rgba(15, 15, 17, 0)');
        g.fillStyle = grad;
        g.beginPath(); g.arc(U, U, U, 0, TAU); g.fill();
      }, 4),
      // soft lime glow behind the clean gap
      gap: GOGEngine.bake(200, 200, (g) => {
        const grad = g.createRadialGradient(100, 100, 0, 100, 100, 100);
        grad.addColorStop(0, 'rgba(198, 255, 61, 0.15)');
        grad.addColorStop(1, 'rgba(198, 255, 61, 0)');
        g.fillStyle = grad;
        g.beginPath(); g.arc(100, 100, 100, 0, TAU); g.fill();
      }, 2),
      // the factory body (everything that does not animate); origin = (s.x, GROUND_Y)
      factory: GOGEngine.bake(62, 62, (g) => {
        g.translate(30, 60);
        g.fillStyle = 'rgba(0,0,0,0.15)';
        g.fillRect(-20, -30, 48, 30);
        g.fillStyle = '#3c4046';
        g.strokeStyle = COLORS.ink;
        g.lineWidth = 4;
        g.beginPath();
        g.rect(-24, -32, 48, 32);
        g.fill(); g.stroke();
        g.fillStyle = '#52575f';
        g.beginPath();
        g.rect(-16, -52, 10, 20);
        g.rect(6, -52, 10, 20);
        g.fill(); g.stroke();
        g.fillStyle = '#ff3d3d';
        g.fillRect(-17, -56, 12, 4);
        g.fillRect(5, -56, 12, 4);
        g.strokeRect(-17, -56, 12, 4);
        g.strokeRect(5, -56, 12, 4);
      }, 3)
    };
    return smokeArt;
  }

  // cheap deterministic [0,1) noise (replaces Math.random() inside render)
  function hash01(a, b){
    const v = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453;
    return v - Math.floor(v);
  }


  // Breezy's glow discs, painted once (the radial gradients used to be rebuilt every frame).
  let glowArt = null;
  function getGlowArt(){
    if (glowArt) return glowArt;
    const R = player.radius;
    function disc(rOuter, rInner, c0){
      const gr = GOGEngine.bake(rOuter * 2, rOuter * 2, (g) => {
        const grad = g.createRadialGradient(rOuter, rOuter, rInner, rOuter, rOuter, rOuter);
        grad.addColorStop(0, c0);
        grad.addColorStop(1, c0.replace(/[\d.]+\)$/, '0)'));
        g.fillStyle = grad;
        g.beginPath(); g.arc(rOuter, rOuter, rOuter, 0, TAU); g.fill();
      }, 3);
      return gr;
    }
    glowArt = {
      boost: disc(R * 1.9, R * 0.6, 'rgba(198,255,61,0.55)'),
      smoke: disc(R * 1.7, R * 0.6, 'rgba(80,80,80,0.6)')
    };
    return glowArt;
  }


  // =================================================================
  // CLEAN WIND CURRENTS  (added gameplay system)
  // -----------------------------------------------------------------
  // Self-contained "air river" mechanic: renewable-energy sources
  // (wind turbines / solar updraft towers) emit flowing magical wind
  // ribbons that Breezy can ride for a smoother, faster, glowing
  // glide. Nothing above this section was changed — this system only
  // plugs into the existing loop through a few marked WIND HOOK
  // call-sites in update(), render() and initGame().
  // =================================================================

  // ---- tunables ---------------------------------------------------
  const WIND_MAX_CURRENTS   = 20;   // hard safety cap (spec limit)
  const WIND_MAX_CONCURRENT = 3;    // additionally bounded by MAX_VISIBLE_AIR_WAVES
  const WIND_MAX_PARTICLES  = 100;  // hard safety cap (spec limit)
  const WIND_SAMPLES        = 14;   // points sampled along each ribbon's spine

  const WIND_COLORS = {
    ribbon: 'rgba(255,255,255,0.92)',
    ribbonSoft: 'rgba(255,255,255,0.4)',
    glow: 'rgba(173,216,255,0.55)',
    sparkle: '#FFFFFF',
    leaf: '#8DD35F',
    leafDark: '#5FAE3A',
    feather: '#FFE7B3',
    pollen: '#FFE066',
    turbineBody: '#F4F7FB',
    turbineAccent: COLORS.cobalt
  };

  const WIND_TIER_CONFIG = {
    easy:   { lenMin:650, lenMax:800, thickMin:65, thickMax:85, ampMin:15, ampMax:25, freqMin:0.4, freqMax:0.7, speedMin:0.85, speedMax:1.0,  driftMin:5,  driftMax:10, driftSpeedMin:0.15, driftSpeedMax:0.28, bendMin:4,  bendMax:10 },
    medium: { lenMin:550, lenMax:700, thickMin:55, thickMax:70, ampMin:25, ampMax:40, freqMin:0.7, freqMax:1.2, speedMin:1.0,  speedMax:1.15, driftMin:10, driftMax:18, driftSpeedMin:0.28, driftSpeedMax:0.45, bendMin:10, bendMax:18 },
    hard:   { lenMin:450, lenMax:600, thickMin:45, thickMax:55, ampMin:35, ampMax:55, freqMin:1.2, freqMax:1.8, speedMin:1.15, speedMax:1.35, driftMin:15, driftMax:25, driftSpeedMin:0.45, driftSpeedMax:0.75, bendMin:18, bendMax:28 }
  };

  // ---- state (all new, does not touch any existing variable) -----
  let windCurrents = [];       // active air-river ribbons
  let windCurrentPool = [];    // free-list, reused instead of reallocated
  let windParticles = [];      // active pooled particles
  let windParticlePool = [];   // free-list
  let windSpawnTimer = rand(120,200);
  let windTime = 0;            // slow clock driving all wind animation phases
  let ambientFlyers = [];      // butterflies / leaves / pollen / dandelion seeds
  let ambientFlyerTimer = rand(60,120);
  let windLastScore = 0;       // used only to detect "orb collected while riding wind"

  // reusable scratch objects so influence/sampling queries never allocate mid-frame
  const _windInfluenceScratch = { influence:0, current:null, centerY:0 };
  const _sampleScratch = { y:0, thick:0, splitOff:0 };

  // ---- wind audio, built on the SHARED AudioContext (audio.ctx, the one Howler uses) so the
  // stage never opens a second context. audio.ctx is null until the first user gesture, so
  // each use re-checks. The looped noise source only exists while the wind is audible:
  // it is stopped when Breezy leaves the wind, on mute, and when the tab is hidden.
  let windCtx = null, windNoiseSource = null, windNoiseGain = null, windNoiseFilter = null, windNoiseBuffer = null;

  function ensureWindAudioCtx(){
    const c = audio.ctx;
    if(c !== windCtx){ // first use, or the shared context was replaced
      windCtx = c;
      windNoiseSource = windNoiseGain = windNoiseFilter = windNoiseBuffer = null;
    }
    return windCtx;
  }

  function stopWindNoise(){
    if(windNoiseSource){
      try { windNoiseSource.stop(); windNoiseSource.disconnect(); } catch(e){}
      windNoiseSource = null;
    }
  }
  GOGEngine.onVisibility(function(visible){ if(!visible) stopWindNoise(); });

  function initWindAmbientSound(){
    const ctx2 = ensureWindAudioCtx();
    if(!ctx2 || windNoiseSource) return;
    if(!windNoiseBuffer){
      const bufferSize = ctx2.sampleRate * 2;
      windNoiseBuffer = ctx2.createBuffer(1, bufferSize, ctx2.sampleRate);
      const data = windNoiseBuffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1)*0.6;
    }
    if(!windNoiseFilter){
      windNoiseFilter = ctx2.createBiquadFilter();
      windNoiseFilter.type = 'bandpass';
      windNoiseFilter.frequency.value = 900;
      windNoiseFilter.Q.value = 0.6;
      windNoiseGain = ctx2.createGain();
      windNoiseGain.gain.value = 0;
      windNoiseFilter.connect(windNoiseGain).connect(ctx2.destination);
    }
    windNoiseSource = ctx2.createBufferSource();
    windNoiseSource.buffer = windNoiseBuffer;
    windNoiseSource.loop = true;
    windNoiseSource.connect(windNoiseFilter);
    windNoiseSource.start();
  }

  function updateWindAudio(influence, dt){
    if(audio.muted){
      if(windNoiseGain) windNoiseGain.gain.value = 0;
      stopWindNoise();
      return;
    }
    if(influence > 0.05){
      initWindAmbientSound();
      if(windNoiseGain){
        const targetGain = clamp(influence,0,1) * 0.18; // whoosh volume
        windNoiseGain.gain.value = lerp(windNoiseGain.gain.value, targetGain, clamp(0.12*dt,0,1));
      }
      if(windNoiseFilter){
        const targetFreq = 600 + influence * 1200; // sweep frequency from 600Hz to 1800Hz
        windNoiseFilter.frequency.value = lerp(windNoiseFilter.frequency.value, targetFreq, clamp(0.15*dt,0,1));
      }
    } else if(windNoiseSource && windNoiseGain){
      const g = lerp(windNoiseGain.gain.value, 0, clamp(0.12*dt,0,1));
      windNoiseGain.gain.value = g;
      if(g < 0.002){ windNoiseGain.gain.value = 0; stopWindNoise(); } // silent: let the source go
    }
  }

  function playWindChime(){
    if(audio.muted) return;
    const ctx2 = ensureWindAudioCtx();
    if(!ctx2) return;
    const now = ctx2.currentTime;
    [0,1,2].forEach((i)=>{
      const osc = ctx2.createOscillator();
      const g = ctx2.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880 * Math.pow(1.25, i);
      g.gain.value = 0;
      osc.connect(g).connect(ctx2.destination);
      const t0 = now + i*0.06;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.12, t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t0+0.35);
      osc.start(t0); osc.stop(t0+0.4);
    });
  }

  function playWindCollectChime(){
    if(audio.muted) return;
    const ctx2 = ensureWindAudioCtx();
    if(!ctx2) return;
    const now = ctx2.currentTime;
    const osc = ctx2.createOscillator();
    const g = ctx2.createGain();
    osc.type = 'triangle';
    osc.frequency.value = 1400;
    g.gain.value = 0;
    osc.connect(g).connect(ctx2.destination);
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(0.15, now+0.015);
    g.gain.exponentialRampToValueAtTime(0.001, now+0.25);
    osc.start(now); osc.stop(now+0.3);
  }

  // -----------------------------------------------------------------
  // WindParticle — pooled particle used for sparkles / leaves /
  // feathers / glowing dust / tiny cloudlets. Objects are recycled
  // via windParticlePool so nothing is allocated once the pool warms up.
  // -----------------------------------------------------------------
  class WindParticle {
    constructor(){ this.reset('sparkle',0,0,0,0,1,3,WIND_COLORS.sparkle); }
    reset(type,x,y,vx,vy,life,size,color){
      this.type = type; this.x = x; this.y = y; this.vx = vx; this.vy = vy;
      this.life = life; this.maxLife = life; this.size = size; this.color = color;
      this.angle = Math.random()*Math.PI*2;
      this.spin = (Math.random()-0.5)*0.1;
      this.sway = Math.random()*Math.PI*2;
    }
  }

  function spawnWindParticle(type,x,y,vx,vy,life,size,color){
    if(windParticles.length >= WIND_MAX_PARTICLES) return null;
    let p = windParticlePool.pop();
    if(!p) p = new WindParticle();
    p.reset(type,x,y,vx,vy,life,size,color);
    windParticles.push(p);
    return p;
  }

  function updateWindParticles(dt){
    for(let i=windParticles.length-1;i>=0;i--){
      const p = windParticles[i];
      p.x += p.vx*dt; p.y += p.vy*dt;
      p.angle += p.spin*dt;
      p.sway += 0.05*dt;
      if(p.type === 'leaf' || p.type === 'feather'){
        p.x += Math.sin(p.sway)*0.4*dt; // gentle flutter, not a straight fall
      }
      p.life -= dt/60/p.maxLife;
      if(p.life <= 0 || p.x < -60){
        windParticles.splice(i,1);
        windParticlePool.push(p);
      }
    }
  }


  // -----------------------------------------------------------------
  // WindCurrent — one flowing "air river". Its spine is sampled into
  // a reused points buffer (no per-frame allocation) each update.
  // Difficulty tiers (easy/medium/hard) control width, curve, speed,
  // and whether it can split into two braided paths that reconnect.
  // -----------------------------------------------------------------
  class WindCurrent {
    constructor(){
      this.points = [];
      for(let i=0;i<WIND_SAMPLES;i++) this.points.push({x:0,y:0,thick:0,splitOff:0});
      this.bladeAngle = 0;
    }
  }

  function pickWindTier(){
    let wEasy=0.6, wMedium=0.3, wHard=0.1;
    if(score >= 3 && score < 6){ wEasy=0.4; wMedium=0.4; wHard=0.2; }
    else if(score >= 6){ wEasy=0.25; wMedium=0.4; wHard=0.35; }
    const r = Math.random()*(wEasy+wMedium+wHard);
    if(r < wEasy) return 'easy';
    if(r < wEasy+wMedium) return 'medium';
    return 'hard';
  }

  function configureWindCurrent(cur, forceTier){
    const tier = forceTier || pickWindTier();
    const cfg = WIND_TIER_CONFIG[tier];
    cur.tier = tier;
    cur.x = W + rand(40,120);
    cur.length = rand(cfg.lenMin, cfg.lenMax);
    cur.thickness = rand(cfg.thickMin, cfg.thickMax);
    cur.amplitude = rand(cfg.ampMin, cfg.ampMax);
    cur.freq = rand(cfg.freqMin, cfg.freqMax);
    cur.speedMult = rand(cfg.speedMin, cfg.speedMax);
    cur.driftAmp = rand(cfg.driftMin, cfg.driftMax);
    cur.driftSpeed = rand(cfg.driftSpeedMin, cfg.driftSpeedMax);
    cur.bendAmount = rand(cfg.bendMin, cfg.bendMax);
    cur.phase = rand(0, Math.PI*2);
    cur.driftPhase = rand(0, Math.PI*2);
    cur.bendPhase = rand(0, Math.PI*2);
    cur.waveSpeed = rand(0.5,0.9);
    cur.thickWobbleSpeed = rand(0.6,1.1);
    cur.thickWobblePhase = rand(0, Math.PI*2);
    const safeMargin = cur.amplitude + cur.driftAmp + 40;
    cur.baseY = rand(PLAY_TOP+safeMargin, PLAY_BOTTOM-safeMargin);
    cur.canSplit = tier === 'hard' ? Math.random() < 0.6 : (tier === 'medium' ? Math.random() < 0.2 : false);
    cur.splitGap = cur.canSplit ? rand(18,32) : 0;
    cur.sourceType = Math.random() < 0.6 ? 'turbine' : 'tower';
    cur.bladeAngle = rand(0, Math.PI*2);
  }

  function spawnWindCurrent(forceTier){
    if(windCurrents.length >= WIND_MAX_CURRENTS) return null;
    let cur = windCurrentPool.pop();
    if(!cur) cur = new WindCurrent();
    configureWindCurrent(cur, forceTier);
    windCurrents.push(cur);
    return cur;
  }

  function updateWindCurrentSamples(cur){
    const n = cur.points.length;
    const hubY = GROUND_Y - 80;
    for(let i=0;i<n;i++){
      const u = i/(n-1); // 0 at left (tail), 1 at right (source/turbine)
      const worldX = cur.x + u*cur.length;
      
      const wave = Math.sin(u*cur.freq*Math.PI*2 + cur.phase + windTime*cur.waveSpeed) * cur.amplitude;
      const drift = Math.sin(windTime*cur.driftSpeed + cur.driftPhase) * cur.driftAmp;
      const bend = Math.sin(u*Math.PI) * cur.bendAmount * Math.sin(windTime*0.35 + cur.bendPhase);
      const targetY = cur.baseY + wave + drift + bend;
      
      // Leans down a little towards the turbine hub on the right side
      const blend = 0.5 * Math.pow(u, 4.0); // leans toward the turbine hub near the right end
      const y = lerp(targetY, hubY, blend);
      
      // Tapers at both ends: thin at the tail (left) and thin at the hub (right)
      const taper = Math.sin(u * Math.PI);
      const thick = cur.thickness * (0.8 + 0.2*Math.sin(u*4 + windTime*cur.thickWobbleSpeed + cur.thickWobblePhase)) * (0.3 + 0.7 * taper);
      
      const splitOff = cur.canSplit
        ? cur.splitGap * Math.sin(u*Math.PI) * (0.7 + 0.3*Math.sin(windTime*0.6 + cur.phase))
        : 0;
      
      const p = cur.points[i];
      p.x = worldX; p.y = y; p.thick = thick; p.splitOff = splitOff;
    }
  }

  // samples a current's spine at an arbitrary world X (interpolated between the
  // nearest two buffer points). Returns a shared scratch object — use immediately.
  function sampleWindCurrentAt(cur, worldX){
    const n = cur.points.length;
    const u = clamp((worldX - cur.x)/cur.length, 0, 1);
    const fi = u*(n-1);
    const i0 = Math.floor(fi), i1 = Math.min(n-1, i0+1);
    const t = fi - i0;
    const a = cur.points[i0], b = cur.points[i1];
    _sampleScratch.y = lerp(a.y,b.y,t);
    _sampleScratch.thick = lerp(a.thick,b.thick,t);
    _sampleScratch.splitOff = lerp(a.splitOff,b.splitOff,t);
    return _sampleScratch;
  }

  // checkWindInfluence(px,py) — the smooth "influence zone" collision
  // requested in the spec: 1.0 dead-center, easing down to 0 near the
  // ribbon's edge, instead of an on/off rectangle. Returns a shared
  // scratch object — read it immediately, don't hold a reference.
  function checkWindInfluence(px, py){
    const r = _windInfluenceScratch;
    r.influence = 0; r.current = null; r.centerY = py;
    for(let i=0;i<windCurrents.length;i++){
      const cur = windCurrents[i];
      if(px < cur.x || px > cur.x + cur.length) continue;
      const s = sampleWindCurrentAt(cur, px);
      let centerY = s.y;
      if(s.splitOff > 1){
        const dTop = Math.abs(py - (s.y - s.splitOff));
        const dBot = Math.abs(py - (s.y + s.splitOff));
        centerY = dTop < dBot ? s.y - s.splitOff : s.y + s.splitOff;
      }
      // NEW: calm mode gets a bigger, more forgiving updraft catch zone.
      const halfSpan = (s.thick*0.70 + 40) * (calmMode ? 1.6 : 1.0);
      const dist = Math.abs(py - centerY);
      let infl = clamp(1 - dist/halfSpan, 0, 1);
      infl = infl*infl*(3-2*infl); // smoothstep for a soft, non-linear falloff
      if(infl > r.influence){ r.influence = infl; r.current = cur; r.centerY = centerY; }
    }
    return r;
  }

  function maybeEmitAmbientWindParticles(cur, dt){
    if(windParticles.length >= WIND_MAX_PARTICLES) return;
    if(Math.random() < 0.06*dt){
      const idx = Math.floor(Math.random()*cur.points.length);
      const p = cur.points[idx];
      const roll = Math.random();
      if(roll < 0.4){
        spawnWindParticle('sparkle', p.x, p.y+rand(-6,6), rand(-0.6,-0.2), rand(-0.3,0.3), rand(0.8,1.4), rand(2,4), WIND_COLORS.sparkle);
      } else if(roll < 0.7){
        spawnWindParticle('leaf', p.x, p.y+rand(-8,8), rand(-1.2,-0.5), rand(-0.2,0.2), rand(1.2,2), rand(4,6), Math.random()<0.5?WIND_COLORS.leaf:WIND_COLORS.leafDark);
      } else {
        spawnWindParticle('dust', p.x, p.y+rand(-10,10), rand(-0.5,-0.15), rand(-0.15,0.15), rand(1,1.8), rand(2,4), WIND_COLORS.glow);
      }
    }
  }

  function updateWindManager(dt, effScroll){
    windTime += dt/60;
    windSpawnTimer -= dt;
    if(windSpawnTimer <= 0 && windCurrents.length < WIND_MAX_CONCURRENT && visibleAirWaveCount() < MAX_VISIBLE_AIR_WAVES){
      spawnWindCurrent();
      windSpawnTimer = rand(110,160); // spawn more frequently!
    }
    for(let i=windCurrents.length-1;i>=0;i--){
      const cur = windCurrents[i];
      cur.x -= effScroll * cur.speedMult * dt;
      
      // Spinning blades rotate faster if player is riding wind!
      const rideSpeed = (player.windInfluence || 0) * 0.24;
      cur.bladeAngle += (0.08 + rideSpeed) * dt;
      
      if(cur.x + cur.length < -80){
        windCurrents.splice(i,1);
        windCurrentPool.push(cur);
        continue;
      }
      updateWindCurrentSamples(cur);
      maybeEmitAmbientWindParticles(cur, dt);
    }
  }

  // -----------------------------------------------------------------
  // Gameplay effects: riding a current smooths Breezy's tilt, lifts
  // her gently, boosts speed, trails feathers, and plays soft audio.
  // Runs after the existing player-movement code each frame, so it
  // only *adds* a gentle influence on top rather than overriding it.
  // -----------------------------------------------------------------
  function applyWindEffectsToPlayer(dt){
    if(player.windInfluence === undefined){
      player.windInfluence = 0; player.windMultiplierActive = false; player.windFeatherTimer = 0;
    }
    const res = checkWindInfluence(player.x, player.y);
    const target = res.influence;
    const wasActive = player.windInfluence > 0.15;
    player.windInfluence = lerp(player.windInfluence, target, clamp(0.18*dt,0,1));
    const wi = player.windInfluence;
    const nowActive = wi > 0.15;

    if(nowActive && !wasActive){
      playWindChime();
      updateGuide("Ooh, a clean wind current! Ride it, Breezy! 🌬️✨");
    }
    
    if(nowActive) {
      clarity = clamp(clarity + 0.18 * dt, 0, 100); // wind currents clean the sky!
    }
    updateWindAudio(wi, dt);

    if(wi > 0.02){
      // gentle upward float — this stage has no explicit gravity value,
      // so "lighter" is expressed as a soft upward nudge to the target
      player.targetY = clamp(player.targetY - wi*0.5*dt, PLAY_TOP, PLAY_BOTTOM);
      // calmer tilt while riding, applied on top of the existing angle
      player.angle = lerp(player.angle, player.angle*0.5, clamp(wi*0.4,0,1));
      // playful speed lift — takes the max with the existing green-updraft
      // boost so the two systems stack nicely instead of fighting
      player.speedFactor = Math.max(player.speedFactor, lerp(1, 1.45, wi));
      // feather trail, denser the deeper into the current
      player.windFeatherTimer -= dt;
      if(player.windFeatherTimer <= 0){
        spawnWindParticle('feather', player.x - player.radius*0.7, player.y+rand(-6,6), rand(-1.6,-0.8), rand(-0.3,0.3), rand(0.7,1.1), rand(4,7), WIND_COLORS.feather);
        player.windFeatherTimer = lerp(14, 4, wi);
      }
    }
    player.windMultiplierActive = wi > 0.3;
  }

  // energy orbs get pulled gently toward Breezy while she's in a current
  function applyOrbMagnetism(dt){
    const wi = player.windInfluence || 0;
    if(wi < 0.12) return;
    const radius = 70 + wi*90;
    const pull = 0.10 + wi*0.16;
    for(let i=0;i<orbs.length;i++){
      const o = orbs[i];
      const dx = player.x - o.x, dy = player.y - o.y;
      const d = Math.hypot(dx,dy);
      if(d < radius && d > 1){
        o.x += (dx/d) * pull * dt * 6;
        o.y += (dy/d) * pull * dt * 6;
      }
    }
  }

  // Detects "an orb was just collected" purely by watching the existing
  // score variable change — zero edits needed to the orb-collision code
  // above. When it happens while riding a current, layers on a cosmetic
  // "wind bonus" celebration (sound + burst + label) without touching
  // the real score or the building/win progression.
  function detectWindOrbBonus(){
    if(score !== windLastScore){
      if(score > windLastScore && (player.windInfluence||0) > 0.25){
        spawnBurst(player.x, player.y - 6, 'rainbow', 10);
        spawnFloatText(player.x, player.y - 34, 'Wind Boost! ✨', WIND_COLORS.pollen);
        playWindCollectChime();
      }
      windLastScore = score;
    }
  }

  // -----------------------------------------------------------------
  // Ambient environmental life: butterflies, leaves, pollen and
  // dandelion seeds drift across the sky and get swept along whenever
  // they pass through a wind current — purely decorative, no collision.
  // -----------------------------------------------------------------
  function spawnAmbientFlyer(){
    const kinds = ['butterfly','leaf','pollen','dandelion'];
    const kind = kinds[Math.floor(Math.random()*kinds.length)];
    ambientFlyers.push({
      kind, x: W+rand(20,80), y: rand(PLAY_TOP, PLAY_BOTTOM),
      baseSpeed: rand(0.5,1.1), wobble: rand(0,Math.PI*2), flap: 0,
      hue: rand(0,1)
    });
  }

  function updateAmbientFlyers(dt, effScroll){
    ambientFlyerTimer -= dt;
    if(ambientFlyerTimer <= 0 && ambientFlyers.length < 10){
      spawnAmbientFlyer();
      ambientFlyerTimer = rand(90,160);
    }
    for(let i=ambientFlyers.length-1;i>=0;i--){
      const f = ambientFlyers[i];
      f.wobble += 0.06*dt;
      let vx = -f.baseSpeed*effScroll*0.5*dt;
      let vy = Math.sin(f.wobble)*0.4*dt;
      const res = checkWindInfluence(f.x, f.y);
      if(res.influence > 0.15){
        vx -= res.influence*effScroll*0.9*dt;
        vy += (res.centerY - f.y) * 0.02 * res.influence * dt;
        if(Math.random() < 0.06*dt){
          spawnWindParticle('dust', f.x, f.y, rand(-1,-0.4), rand(-0.3,0.3), rand(0.4,0.7), rand(2,3), WIND_COLORS.sparkle);
        }
      }
      f.x += vx; f.y += vy;
      f.flap += dt/60*8;
      if(f.x < -40) ambientFlyers.splice(i,1);
    }
  }


  // -----------------------------------------------------------------
  // Rendering: renewable-energy source glyph, the ribbon itself
  // (glow + gradient strokes + flow-direction glints), and the aura
  // drawn behind Breezy while she's riding a current.
  // -----------------------------------------------------------------

  // traces a smooth quadratic path through the ribbon's sample points,
  // offset vertically by `sign*splitOff` (0 for a single unsplit ribbon)

  // Ribbon outline helper: the band is filled between a top and bottom edge
  // built from the same sampled spine, smoothed with midpoint quadratics.

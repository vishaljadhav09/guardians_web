  // WIND HOOK — called once from initGame() to clear/reset the system on every new run
  function resetWindSystem(){
    windCurrents.forEach(c=>windCurrentPool.push(c));
    windCurrents.length = 0;
    windParticles.forEach(p=>windParticlePool.push(p));
    windParticles.length = 0;
    ambientFlyers.length = 0;
    windSpawnTimer = rand(120,200);
    ambientFlyerTimer = rand(60,120);
    windTime = 0;
    windLastScore = 0;
    player.windInfluence = 0;
    player.windMultiplierActive = false;
    player.windFeatherTimer = 0;
    if(windNoiseGain) windNoiseGain.gain.value = 0;
    stopWindNoise();
  }


  // ---------------------------------------------------------------
  // RENDER (PixiJS)
  // Retained scene graph. The art is the same as before (painted sky/hills,
  // the painted building / sun / cloud / bird / Breezy sheets); every painter
  // still runs through Canvas2D, but only ONCE (per resolution) into a texture.
  // Per frame Pixi just moves sprites. The wind is new: flowing streak-lines
  // with curled tips (rope meshes) instead of a solid blue band.
  // Pixi extras on top (GPU only, ?fx=0 turns them off): a gentle air-wobble
  // DisplacementFilter on the wind, additive sun halos, clean-air sparkles.
  // ---------------------------------------------------------------
  let R = null;
  let sceneReady = false;
  const N = {};
  const INK_N = 0x12120F;

  let FX_FULL = true;
  (function () {
    let reduced = false;
    try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    const lowEnd = !!navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 2;
    FX_FULL = !(reduced || lowEnd);
    const m = /[?&]fx=([01])/.exec(window.location.search);
    if (m) FX_FULL = m[1] === '1';
  })();

  const _col = {};
  function colNum(s) {
    let c = _col[s];
    if (c === undefined) { c = parseInt(s.charAt(0) === '#' ? s.slice(1) : s, 16); _col[s] = c; }
    return c;
  }

  // canvas -> { tex, w, h } (logical size from bake's gw/gh or the layer's logicalW/H)
  function ct(c) {
    return c._pt || (c._pt = {
      tex: GOGRender.tex(c),
      w: c.gw != null ? c.gw : (c.logicalW != null ? c.logicalW : c.width),
      h: c.gh != null ? c.gh : (c.logicalH != null ? c.logicalH : c.height)
    });
  }
  // a baked texture drawn at its logical size (fx/fy: extra scale, negative = flip)
  function fit(spr, o, fx, fy) {
    spr.texture = o.tex;
    spr.scale.set((o.w / o.tex.orig.width) * (fx || 1), (o.h / o.tex.orig.height) * (fy || 1));
  }
  function mkSprite(parent, anchor) {
    const s = new PIXI.Sprite();
    s.anchor.set(anchor == null ? 0.5 : anchor);
    if (parent) parent.addChild(s);
    return s;
  }
  function gfx(parent) {
    const g = new PIXI.Graphics();
    if (parent) parent.addChild(g);
    return g;
  }
  function cont(parent) {
    const c = new PIXI.Container();
    if (parent) parent.addChild(c);
    return c;
  }
  function pool(parent) {
    return R.pool(parent, function () { const s = new PIXI.Sprite(); s.anchor.set(0.5); return s; });
  }

  // ---- sheets (image sprite sheets: frames cut once, sprites reuse them) ----
  function sheetTex(sheet) {
    if (!sheet.ready) return null;
    if (!sheet._tx) {
      const fw = sheet.frameW, fh = sheet.frameH;
      sheet._tx = [];
      for (let i = 0; i < sheet.frameCount; i++) sheet._tx.push(GOGRender.frame(sheet.img, i * fw, 0, fw, fh));
      sheet._fh = fh;
    }
    return sheet._tx;
  }
  // one frame centred on (x,y), displayH tall; flip mirrors it (birds face left)
  function putFrame(spr, sheet, idx, x, y, displayH, flip) {
    const tx = sheetTex(sheet);
    if (!tx) { spr.visible = false; return false; }
    const fc = sheet.frameCount;
    spr.texture = tx[((idx % fc) + fc) % fc];
    const k = displayH / sheet._fh;
    spr.scale.set(flip ? -k : k, k);
    spr.position.set(x, y);
    spr.visible = true;
    return true;
  }

  // ---------------------------------------------------------------
  // BAKED ART (Canvas2D -> textures, once)
  // ---------------------------------------------------------------
  let miscArt = null;
  function getMiscArt() {
    if (miscArt) return miscArt;
    const A = {};
    A.disc = ct(GOGEngine.bake(16, 16, (g) => { g.fillStyle = '#fff'; g.beginPath(); g.arc(8, 8, 8, 0, TAU); g.fill(); }, 4));
    A.soft = ct(GOGEngine.bake(64, 64, (g) => {
      const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, 'rgba(255,255,255,1)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    }, 2));
    A.sparkle = ct(GOGEngine.bake(16, 16, (g) => {
      g.fillStyle = '#fff';
      g.beginPath();
      g.moveTo(8, 0); g.lineTo(10, 6); g.lineTo(16, 8); g.lineTo(10, 10);
      g.lineTo(8, 16); g.lineTo(6, 10); g.lineTo(0, 8); g.lineTo(6, 6);
      g.closePath(); g.fill();
    }, 4));
    A.leaf = ct(GOGEngine.bake(20, 12, (g) => {
      g.fillStyle = '#fff';
      g.beginPath(); g.ellipse(10, 6, 10, 5.5, 0, 0, TAU); g.fill();
      g.strokeStyle = 'rgba(0,0,0,0.22)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(1, 6); g.lineTo(19, 6); g.stroke();
    }, 3));
    A.feather = ct(GOGEngine.bake(14, 28, (g) => {
      g.fillStyle = '#fff';
      g.beginPath();
      g.moveTo(7, 0); g.quadraticCurveTo(15, 14, 7, 28); g.quadraticCurveTo(-1, 14, 7, 0);
      g.fill();
    }, 3));
    A.cloudlet = ct(GOGEngine.bake(30, 20, (g) => {
      g.fillStyle = '#fff';
      g.beginPath();
      g.arc(9, 12, 7, 0, TAU); g.arc(21, 12, 7, 0, TAU); g.arc(15, 8, 8, 0, TAU);
      g.fill();
    }, 3));
    // wind streaks: a tapered lens with a blue outline and a white core. 'curl' keeps its
    // thickest part at ~55% of the rope and tapers into the curl at the tip.
    function streak(kind) {
      const w = 256, h = 32;
      return ct(GOGEngine.bake(w, h, (g) => {
        const prof = kind === 'curl'
          ? (u) => (u < 0.4 ? Math.pow(Math.sin(Math.PI / 2 * u / 0.4), 0.8) : u < 0.55 ? 1 : 1 - 0.68 * Math.pow((u - 0.55) / 0.45, 1.1))
          : (u) => (u < 0.4 ? Math.pow(Math.sin(Math.PI / 2 * u / 0.4), 0.8) : u < 0.65 ? 1 : Math.cos(Math.PI / 2 * (u - 0.65) / 0.35));
        function lens(inset, col) {
          const steps = 64;
          g.fillStyle = col;
          g.beginPath();
          for (let i = 0; i <= steps; i++) {
            const u = i / steps, hh = Math.max(0, prof(u) * h / 2 - inset);
            if (i === 0) g.moveTo(u * w, h / 2 - hh); else g.lineTo(u * w, h / 2 - hh);
          }
          for (let i = steps; i >= 0; i--) {
            const u = i / steps, hh = Math.max(0, prof(u) * h / 2 - inset);
            g.lineTo(u * w, h / 2 + hh);
          }
          g.closePath(); g.fill();
        }
        lens(0, '#2F7FD8');
        lens(3.6, '#FFFFFF');
      }, 2));
    }
    A.streakPlain = streak('plain');
    A.streakCurl = streak('curl');
    // "ride the wind first" pill over a sun that Breezy cannot catch yet
    A.badge = ct(GOGEngine.bake(44, 30, (g) => {
      g.translate(22, 15);
      g.lineJoin = 'round'; g.lineCap = 'round';
      GOGScenery.roundRect(g, -19, -12, 38, 24, 12);
      g.fillStyle = '#fff'; g.fill();
      g.lineWidth = 3; g.strokeStyle = COLORS.ink; g.stroke();
      g.strokeStyle = '#27B7E8'; g.lineWidth = 3;
      [-4.5, 4.5].forEach(k => {
        g.beginPath();
        g.moveTo(-11, k); g.quadraticCurveTo(-5, k - 6, 1, k); g.quadraticCurveTo(7, k + 6, 12, k);
        g.stroke();
      });
    }, 3));
    const glow = getGlowArt();
    A.glowBoost = ct(glow.boost);
    A.glowSmoke = ct(glow.smoke);
    // light-blue aura behind Breezy while she rides the wind
    A.aura = (function () {
      const Rr = player.radius, r = Rr * 2.4;
      return ct(GOGEngine.bake(r * 2, r * 2, (g) => {
        const grad = g.createRadialGradient(r, r, Rr * 0.4, r, r, r);
        grad.addColorStop(0, 'rgba(255,255,255,0.6)');
        grad.addColorStop(0.5, 'rgba(135,206,250,0.4)');
        grad.addColorStop(1, 'rgba(135,206,255,0)');
        g.fillStyle = grad;
        g.beginPath(); g.arc(r, r, r, 0, TAU); g.fill();
      }, 3));
    })();
    // soft vignette painted at 1/4 size and stretched
    A.vignette = ct(GOGEngine.bake(W, H, (g) => {
      const vig = g.createRadialGradient(W / 2, H / 2, W * 0.35, W / 2, H / 2, W * 0.7);
      vig.addColorStop(0, 'rgba(40, 40, 40, 0)');
      vig.addColorStop(1, 'rgba(15, 15, 15, 0.45)');
      g.fillStyle = vig;
      g.fillRect(0, 0, W, H);
    }, 0.25));
    // win: expanding gradient disc, light beam, the Seed of Life
    A.wipe = ct(GOGEngine.bake(256, 256, (g) => {
      g.beginPath(); g.arc(128, 128, 128, 0, TAU); g.clip();
      const grad = g.createRadialGradient(128, 128, 0, 128, 128, 128);
      grad.addColorStop(0, '#FFD23F');
      grad.addColorStop(0.55, '#A6C9FF');
      grad.addColorStop(1, '#2C4BFF');
      g.fillStyle = grad; g.fillRect(0, 0, 256, 256);
    }, 1));
    A.beam = ct(GOGEngine.bake(80, 256, (g) => {
      const grad = g.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0, 'rgba(198, 255, 61, 0.45)');
      grad.addColorStop(1, 'rgba(198, 255, 61, 0)');
      g.fillStyle = grad; g.fillRect(0, 0, 80, 256);
    }, 1));
    A.seed = ct(GOGEngine.bake(80, 80, (g) => {
      g.translate(40, 40);
      const sg = g.createRadialGradient(0, 0, 2, 0, 0, 36);
      sg.addColorStop(0, 'rgba(198, 255, 61, 0.9)');
      sg.addColorStop(1, 'rgba(198, 255, 61, 0)');
      g.fillStyle = sg; g.beginPath(); g.arc(0, 0, 36, 0, TAU); g.fill();
      g.fillStyle = COLORS.lime; g.strokeStyle = COLORS.ink; g.lineWidth = 4; g.lineJoin = 'round';
      g.beginPath(); g.moveTo(0, -18); g.quadraticCurveTo(12, 0, 0, 18); g.quadraticCurveTo(-12, 0, 0, -18);
      g.closePath(); g.fill(); g.stroke();
      g.lineWidth = 2.5; g.beginPath(); g.moveTo(0, -10); g.lineTo(0, 10); g.stroke();
    }, 3));
    miscArt = A;
    return A;
  }

  // ---------------------------------------------------------------
  // SCENE
  // ---------------------------------------------------------------
  function makeBackdropGroup() {
    const c = cont(null);
    const g = { c, sky: mkSprite(c, 0), far: [mkSprite(null, 0), mkSprite(null, 0)], mid: [mkSprite(null, 0), mkSprite(null, 0)], ground: [mkSprite(null, 0), mkSprite(null, 0)] };
    c.addChild(g.far[0], g.far[1], g.mid[0], g.mid[1], g.ground[0], g.ground[1]);
    return g;
  }

  function buildScene() {
    hiDpi.scale = R.scale;
    const A = getMiscArt();
    const w = R.world;

    // 1. sky + parallax + clean-air reveal
    N.skyC = cont(w);
    N.sick = makeBackdropGroup();
    N.well = makeBackdropGroup();
    N.wellMask = gfx(N.skyC);
    N.skyC.addChildAt(N.sick.c, 0);
    N.skyC.addChildAt(N.well.c, 1);
    N.well.c.mask = N.wellMask;
    N.maskOn = true;
    N.edgeG = gfx(N.skyC);
    N.haze = gfx(N.skyC);
    N.haze.rect(0, 0, W, H).fill(0xBEB8D6);
    N.haze.alpha = 0;
    N.bdTex = [];

    // 2. soft clouds + birds + victory rainbow
    N.cloudP = pool(cont(w));
    N.birdP = pool(cont(w));
    N.rainbowG = gfx(w);
    (function () {
      const colors = ['#ff3d8a', '#ff8a3d', '#ffc93c', '#c6ff3d', '#2c4bff', '#b6a6ff'];
      const cx = W / 2, cy = H - 120, rad = Math.min(280, W * 0.36);
      for (let i = 0; i < colors.length; i++) {
        const r = rad + i * 9;
        N.rainbowG.moveTo(cx - r, cy).arc(cx, cy, r, Math.PI, 0, false).stroke({ width: 9, color: colNum(colors[i]), cap: 'round' });
      }
      N.rainbowG.visible = false;
    })();

    // 3. smoke plumes (puffs under the gap marks and the factory) — before the town so it renders behind
    N.smokeC = cont(w);
    N.plumeP = pool(cont(N.smokeC));
    N.gapP = pool(cont(N.smokeC));
    N.factoryP = pool(cont(N.smokeC));
    N.smokeG = gfx(N.smokeC);

    // 4. wind turbines / towers stand behind the town
    N.srcG = gfx(w);

    // 5. the town
    N.cityC = cont(w);
    N.bn = [];

    // 6. wind (band + streaks with the air wobble, particles, drifting flyers)
    N.windFxC = cont(w);
    N.bandG = gfx(N.windFxC);
    N.streakC = cont(N.windFxC);
    N.ropes = {};
    N.flyG = gfx(w);
    N.windPartP = pool(cont(w));
    if (FX_FULL) {
      const S = 128, mc = document.createElement('canvas');
      mc.width = mc.height = S;
      const g = mc.getContext('2d'), img = g.createImageData(S, S);
      for (let y = 0; y < S; y++) {
        for (let x = 0; x < S; x++) {
          const u = (x / S) * TAU, v = (y / S) * TAU, i = (y * S + x) * 4;
          img.data[i] = 128 + 127 * Math.sin(3 * v + 1.3 * Math.sin(2 * u + 0.6));
          img.data[i + 1] = 128 + 127 * 0.6 * Math.sin(2 * u + 1.1 * Math.sin(3 * v + 1.1));
          img.data[i + 2] = 128; img.data[i + 3] = 255;
        }
      }
      g.putImageData(img, 0, 0);
      const mt = GOGRender.tex(mc);
      mt.source.style.addressMode = 'repeat';
      N.dispSprite = new PIXI.Sprite(mt);
      N.dispSprite.width = N.dispSprite.height = 384;
      N.dispSprite.renderable = false;
      w.addChild(N.dispSprite);
      N.dispFilter = new PIXI.DisplacementFilter({ sprite: N.dispSprite, scale: 5 });
      N.windFxC.filterArea = new PIXI.Rectangle(0, 0, W, H);
      N.windFxC.filters = [N.dispFilter];
    }

    // 7. suns (collectibles)
    N.haloP = pool(cont(w));
    N.sunP = pool(cont(w));
    N.ringG = gfx(w);
    N.badgeP = pool(cont(w));

    // 8. Breezy
    N.auraC = cont(w);
    N.aura = mkSprite(N.auraC);
    fit(N.aura, A.aura);
    N.auraG = gfx(N.auraC);
    N.pShadow = gfx(w);
    N.pShadow.circle(0, 0, player.radius).fill({ color: 0x000000, alpha: 0.18 });
    N.pGlow = mkSprite(w);
    N.pBody = cont(w);
    N.pSpr = mkSprite(N.pBody, 0);
    N.grayF = new PIXI.ColorMatrixFilter();
    N.grayF.saturate(-1, false);
    N.chev = gfx(w);
    N.bubble = cont(w);
    (function () {
      const g = gfx(N.bubble);
      g.roundRect(-32 + 3, -18 + 3, 64, 20, 6).fill(INK_N);
      g.roundRect(-32, -18, 64, 20, 6).fill(0xFDFBF7).stroke({ width: 3, color: INK_N });
      g.poly([-6, 2, 0, 8, 6, 2]).fill(0xFDFBF7).stroke({ width: 3, color: INK_N, join: 'round' });
      g.rect(-5, 0, 10, 3).fill(0xFDFBF7);
      const t = GOGRender.text('\u{1F637} *cough*', { fontSize: 12, fontWeight: '800', fill: '#ff3d8a', fontFamily: 'Quicksand, sans-serif' }, { anchor: 0.5 });
      t.position.set(0, -8);
      N.bubble.addChild(t);
      N.bubble.visible = false;
    })();

    // 9. sparks + floating words + victory seed + foreground clouds
    N.partP = pool(cont(w));
    N.floatP = R.pool(cont(w), function () {
      return GOGRender.text('', { fontSize: 20, fontWeight: '800', fill: '#ffffff', stroke: { color: '#12120F', width: 4, join: 'round' } }, { anchor: 0.5 });
    });
    N.seedC = cont(w);
    N.beam = mkSprite(N.seedC, 0);
    fit(N.beam, A.beam);
    N.beam.position.set(W / 2 - 40, 0);
    N.beam.height = H;
    N.seed = mkSprite(N.seedC);
    fit(N.seed, A.seed);
    N.seedC.visible = false;
    N.fgP = pool(cont(w));
    N.fgP.parent.alpha = 0.5;

    // pixi-only extras: clean-air sparkles along the healed edge
    N.sparkP = pool(cont(w));

    // 10. fx layer (above the world, never shaken)
    N.vig = mkSprite(R.fx, 0);
    fit(N.vig, A.vignette);
    N.vig.alpha = 0;
    N.speedG = gfx(R.fx);
    N.wipe = mkSprite(R.fx);
    N.wipe.texture = A.wipe.tex;
    N.wipe.position.set(W / 2, H / 2);
    N.wipe.alpha = 0.85;
    N.wipe.visible = false;
    N.wipeRing = gfx(R.fx);
    N.wipeRing.visible = false;
    N.vigA = 0;

    N.overlay = R.overlay2d();

    R.onResize(function () {
      hiDpi.scale = R.scale;
      backdrop = null;
      cloudArt = null;
      skyline = null;
    });
    sceneReady = true;
  }

  // sky/hills/ground pairs -> sprites (rebuilt when the on-screen resolution changes)
  function rebuildBackdrop() {
    buildBackdrop();
    const old = N.bdTex, fresh = [];
    function T(c) { const o = ct(c); fresh.push(o.tex); return o; }
    ['sick', 'well'].forEach(function (st) {
      const g = N[st];
      fit(g.sky, T(backdrop.sky[st]));
      for (let i = 0; i < 2; i++) {
        fit(g.far[i], T(backdrop.far[st]));
        fit(g.mid[i], T(backdrop.mid[st]));
        fit(g.ground[i], T(backdrop.ground[st]));
        g.far[i].y = g.mid[i].y = SKY_TOP;
        g.ground[i].y = GROUND_Y;
      }
    });
    N.bdTex = fresh;
    old.forEach(function (t) { try { t.destroy(true); } catch (e) {} });
  }

  function placeTiles(pair, offset) {
    const s = hiDpi.scale;
    let x = -(((offset % W) + W) % W);
    x = Math.round(x * s) / s;
    pair[0].x = x;
    pair[1].x = x + W;
  }

  const _edgeX = [];
  function syncSky() {
    const progress = clamp(score / ENERGY_TARGET, 0, 1);
    const front = progress * W;
    const t = frameNow * 0.002;
    const sick = N.sick, well = N.well;
    N.sparkOn = false;
    if (front <= 1) {
      sick.c.visible = true; well.c.visible = false; N.edgeG.visible = false;
    } else if (front >= W - 1) {
      sick.c.visible = false; well.c.visible = true; N.edgeG.visible = false;
      if (N.maskOn) { well.c.mask = null; N.maskOn = false; }
    } else {
      sick.c.visible = true; well.c.visible = true; N.edgeG.visible = true;
      if (!N.maskOn) { well.c.mask = N.wellMask; N.maskOn = true; }
      let n = 0;
      for (let y = -2; y <= H + 2; y += 10) _edgeX[n++] = front + Math.sin(y * 0.035 + t) * 9;
      const m = N.wellMask;
      m.clear();
      m.moveTo(0, -2);
      for (let k = 0, y = -2; k < n; k++, y += 10) m.lineTo(_edgeX[k], y);
      m.lineTo(0, H + 2);
      m.closePath();
      m.fill(0xffffff);
      // "fresh air" edge: a cream stripe with an ink outline
      const e = N.edgeG;
      e.clear();
      for (let pass = 0; pass < 2; pass++) {
        for (let k = 0, y = -2; k < n; k++, y += 10) {
          if (k === 0) e.moveTo(_edgeX[k], y); else e.lineTo(_edgeX[k], y);
        }
        e.stroke(pass === 0 ? { width: 9, color: INK_N, join: 'round', cap: 'round' } : { width: 4.5, color: 0xFFF6D6, join: 'round', cap: 'round' });
      }
      N.sparkOn = true;
      N.front = front;
    }
    placeTiles(sick.far, scrollX * 0.12); placeTiles(sick.mid, scrollX * 0.3); placeTiles(sick.ground, scrollX * 0.9);
    placeTiles(well.far, scrollX * 0.12); placeTiles(well.mid, scrollX * 0.3); placeTiles(well.ground, scrollX * 0.9);
    // a flat lilac haze while Sky Health is low (soft and light, never dark)
    const haze = (100 - clarity) / 100 * 0.3;
    N.haze.visible = haze > 0.01;
    N.haze.alpha = haze;
    // reactive tint: grey on smoke contact, radiant blue after a clean touch
    if (Math.abs(skyReactTint) < 0.02) R.flash(0xffffff, 0, 'react');
    else if (skyReactTint < 0) R.flash(0x6b6f76, -skyReactTint * 0.4, 'react');
    else R.flash(0xbfe4ff, skyReactTint * 0.22, 'react');
  }

  function syncSparkles() {
    const P = N.sparkP;
    P.begin();
    if (FX_FULL && N.sparkOn) {
      const A = getMiscArt(), t = frameNow * 0.001;
      for (let i = 0; i < 12; i++) {
        const s = P.next();
        fit(s, A.sparkle);
        const ph = i * 1.9;
        s.position.set(N.front + 16 + Math.sin(t * 1.3 + ph) * 12 + (i % 3) * 8,
          60 + ((i * 53 + frameNow * 0.025 * (1 + (i % 3) * 0.4)) % (GROUND_Y - 80)));
        s.scale.x = s.scale.y = s.scale.x * (0.35 + 0.3 * Math.abs(Math.sin(t * 2 + ph)));
        s.blendMode = 'add';
        s.tint = i % 2 ? 0xFFF6D6 : 0xC6FF3D;
        s.alpha = 0.25 + 0.4 * Math.abs(Math.sin(t * 2.4 + ph));
      }
    }
    P.end();
  }

  // ---- ambient life ----
  function syncClouds() {
    const progress = clamp(score / ENERGY_TARGET, 0, 1);
    const cleanZoneX = progress * W;
    const art = getCloudArt();
    const sm = ct(art.smog), wh = ct(art.white);
    const P = N.cloudP;
    P.begin();
    for (let i = 0; i < ambientClouds.length; i++) {
      const c = ambientClouds[i];
      const s = P.next();
      if (c.x > cleanZoneX) {
        // faceless soft-grey Smog cloud
        const w = c.h * 2.0, h = w * sm.h / sm.w;
        s.texture = sm.tex;
        s.scale.set(w / sm.tex.orig.width, h / sm.tex.orig.height);
        s.position.set(c.x, c.y);
      } else if (!putFrame(s, sprites.cloudHappy, c.frame, c.x, c.y, c.h)) {
        const w = c.h * 2.0, h = w * wh.h / wh.w;
        s.texture = wh.tex;
        s.scale.set(w / wh.tex.orig.width, h / wh.tex.orig.height);
        s.position.set(c.x, c.y);
        s.visible = true;
      }
    }
    P.end();
  }

  function syncBirds() {
    const P = N.birdP;
    P.begin();
    for (let i = 0; i < birds.length; i++) {
      const b = birds[i];
      putFrame(P.next(), sprites.birds, Math.floor(b.flapTimer) % 2, b.x, b.y, b.h, true);
    }
    for (let i = 0; i < birdFlocks.length; i++) {
      const f = birdFlocks[i], frame = Math.floor(f.flapTimer) % 2;
      for (let k = 0; k < f.offsets.length; k++) {
        putFrame(P.next(), sprites.birds, frame, f.x + f.offsets[k].dx, f.y + f.offsets[k].dy, 24, true);
      }
    }
    P.end();
  }

  function syncForegroundClouds() {
    const P = N.fgP;
    P.begin();
    for (let i = 0; i < foregroundClouds.length; i++) {
      const c = foregroundClouds[i];
      putFrame(P.next(), sprites.cloudHappy, c.frame, c.x, c.y, c.h);
    }
    P.end();
  }

  // ---------------------------------------------------------------
  // TOWN — the buildings stand shoulder to shoulder on a little pavement,
  // with a tree at each end, so the lit-up "city" reads as one place.
  // ---------------------------------------------------------------
  // The painted sheets have a lot of empty margin and the body sits at a different spot in each
  // frame, so the body rectangles (measured once from the art) are what get placed and spaced.
  const BODY_UNLIT = [{ x: 41, y: 9, w: 99, h: 123 }, { x: 17, y: 0, w: 97, h: 133 }];
  const BODY_LIT = [{ x: 41, y: 7, w: 98, h: 122 }, { x: 22, y: 20, w: 99, h: 110 }];
  const LAMP_PAD = 14; // the lit art has street lamps just outside the body
  const TOWN_STRIP = 16;
  let townTex = null;

  function rebuildCity() {
    if (!buildings.length) return false;
    const uT = sheetTex(sprites.buildingUnlit), lT = sheetTex(sprites.buildingLit);
    if (!uT || !lT) return false;
    const art = getSkyArt(), A = getMiscArt();
    const C = N.cityC;
    C.removeChildren().forEach(function (ch) { ch.destroy({ children: true }); });
    N.bn = [];
    if (townTex) { try { townTex.destroy(true); } catch (e) {} townTex = null; }

    // pavement + contact shadows + end trees, painted once at the on-screen resolution
    const first = buildings[0], last = buildings[buildings.length - 1];
    const x0 = Math.max(0, first.x - 34), x1 = Math.min(W, last.x + last.w + 34);
    const th = TOWN_STRIP + 64, ty = H - th;
    const base = GOGEngine.bake(x1 - x0, th, (g) => {
      g.translate(-x0, -ty);
      GOGScenery.roundTree(g, x0 + 16, H - TOWN_STRIP + 8, 1.15, { ink: true, main: '#5FAE4E', dark: '#4A9440', lite: '#80CE69', trunk: '#8B6B4A' });
      GOGScenery.roundTree(g, x1 - 16, H - TOWN_STRIP + 8, 1.0, { ink: true, main: '#5FAE4E', dark: '#4A9440', lite: '#80CE69', trunk: '#8B6B4A' });
      g.fillStyle = '#D8D3E8';
      g.fillRect(x0, H - TOWN_STRIP, x1 - x0, TOWN_STRIP);
      g.fillStyle = '#C3BDD9';
      g.fillRect(x0, H - 5, x1 - x0, 5);
      g.fillStyle = COLORS.ink;
      g.fillRect(x0, H - TOWN_STRIP, x1 - x0, 3);
      for (let i = 0; i < buildings.length; i++) {
        const b = buildings[i];
        GOGScenery.contactShadow(g, b.x + b.w / 2 + 6, b.y + b.h + 1, b.w * 0.58, 6, 0.26);
      }
    }, hiDpi.scale);
    townTex = ct(base).tex;
    const baseSpr = mkSprite(C, 0);
    fit(baseSpr, ct(base));
    baseSpr.position.set(x0, ty);

    const fwU = sprites.buildingUnlit.frameW, fwL = sprites.buildingLit.frameW, fhL = sprites.buildingLit.frameH;
    for (let i = 0; i < buildings.length; i++) {
      const b = buildings[i], v = b.variant;
      const root = cont(C);
      root.position.set(b.x, b.y);
      const bu = BODY_UNLIT[v], bl = BODY_LIT[v];
      const node = { root: root };

      node.unlit = mkSprite(root, 0);
      node.unlit.texture = GOGRender.frame(sprites.buildingUnlit.img, v * fwU + bu.x, bu.y, bu.w, bu.h);
      node.unlit.width = b.w; node.unlit.height = b.h;

      // the sun beam when a solar roof is charging (static shape, alpha toggled)
      if (b.hasSolar) {
        node.beam = gfx(root);
        const cx = b.w / 2;
        node.beam.poly([80 - 16 - b.x, 80 - b.y, cx - 22, -12, cx + 22, -12, 80 + 16 - b.x, 80 - b.y]).fill({ color: 0xFFE064, alpha: 0.26 });
        node.beam.visible = false;
      }

      node.litC = cont(root);
      const lx0 = Math.max(0, bl.x - LAMP_PAD), lx1 = Math.min(fwL, bl.x + bl.w + LAMP_PAD);
      const ly1 = Math.min(fhL, bl.y + bl.h + 3);
      node.lit = mkSprite(node.litC, 0);
      node.lit.texture = GOGRender.frame(sprites.buildingLit.img, v * fwL + lx0, bl.y, lx1 - lx0, ly1 - bl.y);
      const sx = b.w / bl.w, sy = b.h / bl.h;
      node.lit.scale.set(sx, sy);
      node.lit.position.set(-(bl.x - lx0) * sx, 0);
      node.star = mkSprite(node.litC, 0);
      fit(node.star, ct(art.star));
      node.litC.visible = false;

      // rooftop turbine (kept clear of the solar panel)
      const tx = b.w * (b.hasSolar ? 0.86 : 0.2);
      node.tower = mkSprite(root, 0);
      fit(node.tower, ct(art.tower));
      node.tower.position.set(tx + art.tower.ox, art.tower.oy);
      node.rotor = mkSprite(root);
      fit(node.rotor, ct(art.rotor));
      node.rotor.position.set(tx, -24);
      node.tower.visible = node.rotor.visible = false;
      node.tx = tx;

      node.leaves = [];
      for (let k = 0; k < 3; k++) {
        const lf = mkSprite(root);
        fit(lf, ct(art.leaf));
        lf.position.set(k % 2 === 0 ? 4 : b.w - 4, b.h * (0.28 + k * 0.2));
        lf.visible = false;
        node.leafK = lf.scale.x;
        node.leaves.push(lf);
      }

      if (b.hasSolar) {
        node.panel = mkSprite(root, 0);
        fit(node.panel, ct(art.panel));
        node.panel.position.set(b.w / 2 + art.panel.ox, art.panel.oy);
        node.glow = mkSprite(root);
        node.glow.texture = A.soft.tex;
        node.glow.scale.set(60 / A.soft.tex.orig.width);
        node.glow.tint = 0xFFE664;
        node.glow.position.set(b.w / 2 + PANEL_GLOW_DX, PANEL_GLOW_DY);
        node.glow.visible = false;
        if (FX_FULL) node.glow.blendMode = 'add';
      }
      N.bn.push(node);
    }
    skyline = { ok: true };
    return true;
  }

  function syncCity() {
    if (!skyline && !rebuildCity()) return;
    for (let i = 0; i < buildings.length; i++) {
      const b = buildings[i], n = N.bn[i];
      if (!n) continue;
      b.litProgress = lerp(b.litProgress, b.lit ? 1 : 0, 0.08);
      const lp = b.litProgress, on = lp > 0.02;
      n.litC.visible = on;
      n.tower.visible = n.rotor.visible = on;
      if (on) {
        n.litC.alpha = lp;
        // a bobbing ink-outlined gold star says "this one is lit!"
        const bob = Math.sin(frameNow * 0.004 + b.x) * 3, st = getSkyArt().star;
        n.star.position.set(b.w * 0.5 + st.ox, -22 + bob + st.oy);
        n.rotor.rotation = frameNow * 0.003 * lp + b.x;
        const grown = lp > 0.985;
        for (let k = 0; k < 3; k++) { n.leaves[k].visible = true; n.leaves[k].scale.set(n.leafK * (grown ? 1 : Math.max(0.05, lp))); }
      } else {
        for (let k = 0; k < 3; k++) n.leaves[k].visible = false;
      }
      if (b.hasSolar) {
        const glowing = b.solarGlowTimer > 0;
        n.glow.visible = glowing;
        n.beam.visible = glowing;
        if (glowing) n.glow.alpha = clamp(b.solarGlowTimer / 30, 0, 1) * 0.85;
      }
    }
  }

  // ---------------------------------------------------------------
  // WIND — flowing streak-lines with curled tips (like a picture-book breeze)
  // over a pale "wind lane" that shows where Breezy can ride. Each streak is a
  // rope mesh whose points are re-laid along the current's spine every frame.
  // ---------------------------------------------------------------
  function cr(a, b, c, d, t) {
    return 0.5 * ((2 * b) + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t * t + (-a + 3 * b - 3 * c + d) * t * t * t);
  }
  const _sp = { y: 0, hw: 0 };
  // smooth spine position + half-width at world X (Catmull-Rom through the sampled points)
  function spineAt(cur, wx, sign) {
    const pts = cur.points, n = pts.length;
    let u = (wx - cur.x) / cur.length;
    u = u < 0 ? 0 : u > 1 ? 1 : u;
    const f = u * (n - 1);
    let i = Math.floor(f);
    if (i >= n - 1) i = n - 2;
    const t = f - i;
    const p0 = pts[i > 0 ? i - 1 : 0], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2 < n ? i + 2 : n - 1];
    _sp.y = cr(p0.y + sign * p0.splitOff, p1.y + sign * p1.splitOff, p2.y + sign * p2.splitOff, p3.y + sign * p3.splitOff, t);
    _sp.hw = Math.max(5, cr(p0.thick, p1.thick, p2.thick, p3.thick, t) * 0.58);
  }

  const ROPE_W = [17, 13];
  function getRope(kind, wcls) {
    const key = kind + wcls;
    let p = N.ropes[key];
    if (!p) p = N.ropes[key] = { items: [], used: 0 };
    let r = p.items[p.used];
    if (!r) {
      const cnt = kind === 'curl' ? 22 : 14, pts = [];
      for (let i = 0; i < cnt; i++) pts.push(new PIXI.Point(0, 0));
      const geo = new PIXI.RopeGeometry({ width: ROPE_W[wcls], points: pts, textureScale: 0 });
      r = new PIXI.Mesh({ geometry: geo, texture: (kind === 'curl' ? getMiscArt().streakCurl : getMiscArt().streakPlain).tex });
      r.pts = pts;
      N.streakC.addChild(r);
      p.items.push(r);
    }
    p.used++;
    r.visible = true;
    return r;
  }

  function layStreak(cur, sign, k, L) {
    const lane = L === 1 ? 0 : (k - (L - 1) / 2) / ((L - 1) / 2);
    const spd = 0.22 + 0.06 * ((k * 5 + 1) % 4);
    const len = 0.28 + 0.06 * ((k * 3 + 1) % 3);
    const cycle = 1 + len + 0.12;
    const off = ((k * 0.61 + cur.phase * 0.159) % 1 + 1) % 1;
    const head = (windTime * spd + off * cycle) % cycle;
    const tail = head - len;
    const a = tail > 0 ? tail : 0, b = head < 1 ? head : 1;
    const curl = k % 2 === 0;
    if (b - a < (curl ? 0.12 : 0.04)) return;
    const wxA = cur.x + a * cur.length, wxB = cur.x + b * cur.length;
    if (wxB < -30 || wxA > W + 30) return;
    const rope = getRope(curl ? 'curl' : 'plain', Math.abs(lane) < 0.5 ? 0 : 1);
    const pts = rope.pts, nb = 14;
    for (let i = 0; i < nb; i++) {
      const u = a + (b - a) * (i / (nb - 1));
      const wx = cur.x + u * cur.length;
      spineAt(cur, wx, sign);
      pts[i].x = wx;
      pts[i].y = _sp.y + lane * _sp.hw * 0.62 + Math.sin(u * 9 + windTime * 2.2 + k * 1.7) * _sp.hw * 0.1;
    }
    if (curl) {
      let x = pts[nb - 1].x, y = pts[nb - 1].y;
      const th = Math.atan2(y - pts[nb - 2].y, x - pts[nb - 2].x);
      const dir = lane <= 0 ? 1 : -1; // curl away from the middle of the wind
      for (let j = 1; j <= 8; j++) {
        const phi = th - dir * Math.pow(j / 8, 1.15) * Math.PI * 1.8;
        x += Math.cos(phi) * 5.2;
        y += Math.sin(phi) * 5.2;
        pts[nb - 1 + j].x = x;
        pts[nb - 1 + j].y = y;
      }
    }
    rope.geometry.update();
  }

  function syncWindSources() {
    const g = N.srcG;
    g.clear();
    for (let c = 0; c < windCurrents.length; c++) {
      const cur = windCurrents[c];
      const p = cur.points[cur.points.length - 1];
      if (p.x > W + 70 || p.x < -70) continue;
      const gh = GROUND_Y - p.y, x = p.x, y = p.y;
      if (cur.sourceType === 'turbine') {
        g.poly([x - 5, y, x - 2, y + gh, x + 10, y + gh, x + 3, y]).fill({ color: 0x000000, alpha: 0.12 });
        g.poly([x - 6, y + gh, x - 2.5, y, x + 2.5, y, x + 6, y + gh]).fill(colNum(WIND_COLORS.turbineBody)).stroke({ width: 3.5, color: INK_N, join: 'round' });
        g.circle(x, y, 7).fill(colNum(WIND_COLORS.turbineAccent)).stroke({ width: 3.5, color: INK_N });
        for (let b = 0; b < 3; b++) {
          const a = cur.bladeAngle + b * (Math.PI * 2 / 3), cs = Math.cos(a), sn = Math.sin(a);
          const rx = (px, py) => x + px * cs - py * sn, ry = (px, py) => y + px * sn + py * cs;
          g.moveTo(x, y)
            .quadraticCurveTo(rx(5, -15), ry(5, -15), rx(2.5, -35), ry(2.5, -35))
            .quadraticCurveTo(rx(-2, -15), ry(-2, -15), x, y)
            .closePath()
            .fill(colNum(WIND_COLORS.turbineBody)).stroke({ width: 2, color: INK_N, join: 'round' });
        }
      } else { // solar updraft tower
        g.rect(x - 35, y + gh - 4, 70, 4).fill({ color: 0x000000, alpha: 0.12 });
        g.moveTo(x - 35, y + gh).quadraticCurveTo(x, y + gh - 24, x + 35, y + gh).closePath()
          .fill({ color: 0x2E5EE8, alpha: 0.45 }).stroke({ width: 3, color: INK_N, join: 'round' });
        g.rect(x - 32, y + gh - 4, 3, 4).fill(INK_N);
        g.rect(x - 16, y + gh - 6, 3, 6).fill(INK_N);
        g.rect(x + 16, y + gh - 6, 3, 6).fill(INK_N);
        g.rect(x + 29, y + gh - 4, 3, 4).fill(INK_N);
        g.poly([x - 10, y + gh - 12, x - 6, y, x + 6, y, x + 10, y + gh - 12]).fill(colNum(WIND_COLORS.turbineBody)).stroke({ width: 3.5, color: INK_N, join: 'round' });
        const pulse = 0.7 + Math.sin(windTime * 4 + cur.phase) * 0.3;
        g.circle(x, y + gh - 12, 16).fill({ color: 0xFFAA32, alpha: 0.55 * pulse });
        g.rect(x - 8, y - 4, 16, 6).fill(colNum(WIND_COLORS.turbineAccent)).stroke({ width: 3, color: INK_N });
      }
    }
  }

  function syncWind() {
    const band = N.bandG;
    band.clear();
    for (const k in N.ropes) N.ropes[k].used = 0;
    for (let c = 0; c < windCurrents.length; c++) {
      const cur = windCurrents[c], pts = cur.points, n = pts.length;
      if (pts[n - 1].x < -80 || pts[0].x > W + 80) continue;
      const branches = cur.canSplit ? [-1, 1] : [0];
      for (let bi = 0; bi < branches.length; bi++) {
        const sign = branches[bi];
        // the pale wind lane
        const top = [], bot = [], NS = 20;
        for (let i = 0; i <= NS; i++) {
          const wx = cur.x + (i / NS) * cur.length;
          spineAt(cur, wx, sign);
          top.push(wx, _sp.y - _sp.hw);
          bot.push(wx, _sp.y + _sp.hw);
        }
        const poly = top.slice();
        for (let i = NS; i >= 0; i--) poly.push(bot[i * 2], bot[i * 2 + 1]);
        band.poly(poly).fill({ color: 0xE3F7FF, alpha: 0.5 }).stroke({ width: 3, color: 0xFFFFFF, alpha: 0.85, join: 'round' });
        // the flowing streaks
        const L = cur.canSplit ? 3 : (cur.thickness > 72 ? 5 : 4);
        for (let k = 0; k < L; k++) layStreak(cur, sign, k, L);
      }
    }
    for (const k in N.ropes) {
      const p = N.ropes[k];
      for (let i = p.used; i < p.items.length; i++) p.items[i].visible = false;
    }
    syncWindSources();
    if (FX_FULL && N.dispSprite) {
      N.dispSprite.position.set(-((windTime * 34) % 384), (windTime * 13) % 384);
      const ds = 4 + (player.windInfluence || 0) * 3;
      N.dispFilter.scale.set(ds, ds * 0.7);
    }
    // butterflies, leaves, pollen and dandelion seeds swept along
    const g = N.flyG;
    g.clear();
    for (let i = 0; i < ambientFlyers.length; i++) {
      const f = ambientFlyers[i];
      if (f.kind === 'butterfly') {
        const wing = Math.sin(f.flap) * 0.6 + 0.6, col = f.hue > 0.5 ? 0xFF9F6B : 0x8DD9FF;
        g.ellipse(f.x - 4 * wing, f.y, Math.max(0.3, 4 * wing), 6).fill(col).stroke({ width: 1, color: INK_N });
        g.ellipse(f.x + 4 * wing, f.y, Math.max(0.3, 4 * wing), 6).fill(col).stroke({ width: 1, color: INK_N });
      } else if (f.kind === 'leaf') {
        const cs = Math.cos(f.wobble), sn = Math.sin(f.wobble), pl = [];
        for (let a = 0; a < 10; a++) {
          const t = a / 10 * TAU, ex = Math.cos(t) * 7, ey = Math.sin(t) * 4;
          pl.push(f.x + ex * cs - ey * sn, f.y + ex * sn + ey * cs);
        }
        g.poly(pl).fill(colNum(WIND_COLORS.leaf)).stroke({ width: 1, color: colNum(WIND_COLORS.leafDark) });
      } else if (f.kind === 'pollen') {
        g.circle(f.x, f.y, 2.4).fill({ color: colNum(WIND_COLORS.pollen), alpha: 0.85 });
      } else {
        for (let a = 0; a < 8; a++) {
          const ang = a * Math.PI / 4 + f.wobble;
          g.moveTo(f.x, f.y).lineTo(f.x + Math.cos(ang) * 5, f.y + Math.sin(ang) * 5);
        }
        g.stroke({ width: 0.8, color: 0xFFFFFF, alpha: 0.8 });
        g.circle(f.x, f.y, 1.5).fill(0xFFFFFF);
      }
    }
    // sparkles, leaves, feathers, dust
    const P = N.windPartP, A = getMiscArt();
    P.begin();
    for (let i = 0; i < windParticles.length; i++) {
      const p = windParticles[i], s = P.next();
      const a = clamp(p.life, 0, 1);
      s.rotation = p.angle;
      s.position.set(p.x, p.y);
      s.alpha = a;
      s.tint = 0xFFFFFF;
      if (p.type === 'sparkle') { fit(s, A.sparkle, (p.size * 3.4) / 16); s.rotation = 0; }
      else if (p.type === 'leaf') { fit(s, A.leaf, (p.size * 2) / 20); s.tint = colNum(p.color); }
      else if (p.type === 'feather') { fit(s, A.feather, (p.size * 2) / 14); s.tint = colNum(p.color); }
      else if (p.type === 'dust') { fit(s, A.disc, (p.size * 2.8) / 16); s.alpha = a * 0.55; s.tint = 0xCFEAFF; }
      else { fit(s, A.cloudlet, (p.size * 2) / 20); s.alpha = a * 0.6; }
    }
    P.end();
  }

  // ---------------------------------------------------------------
  // SUNS, BREEZY, SMOKE, SPARKS
  // ---------------------------------------------------------------
  function syncOrbs(time) {
    const A = getMiscArt();
    const inCurrent = (player.windInfluence || 0) > 0.15;
    N.haloP.begin(); N.sunP.begin(); N.badgeP.begin();
    const rg = N.ringG;
    rg.clear();
    for (let i = 0; i < orbs.length; i++) {
      const o = orbs[i];
      const pulse = 1 + Math.sin(time * 0.006 + o.wobble) * 0.1;
      const r = o.radius * 1.35 * pulse;
      if (FX_FULL) {
        const h = N.haloP.next();
        h.texture = A.soft.tex;
        h.scale.set((r * 5.2) / A.soft.tex.orig.width);
        h.position.set(o.x, o.y);
        h.tint = 0xFFE066;
        h.alpha = 0.55 + 0.2 * Math.sin(time * 0.005 + o.wobble);
        h.blendMode = 'add';
      }
      putFrame(N.sunP.next(), sprites.sunOrbit, 0, o.x, o.y, r * 2.6);
      if (inCurrent) {
        // marching dashes round the sun: "you can grab it now"
        const rad = r * 1.9, off = time * 0.0006 * TAU;
        for (let d = 0; d < 12; d++) {
          const a0 = off + d * (TAU / 12);
          rg.moveTo(o.x + Math.cos(a0) * rad, o.y + Math.sin(a0) * rad).arc(o.x, o.y, rad, a0, a0 + TAU / 12 * 0.55);
        }
        rg.stroke({ width: 3.5, color: colNum(COLORS.lime), cap: 'round' });
      } else {
        const b = N.badgeP.next();
        fit(b, A.badge);
        b.position.set(o.x, o.y - r * 1.9 - 12 + Math.sin(frameNow * 0.006) * 2);
      }
    }
    N.haloP.end(); N.sunP.end(); N.badgeP.end();
  }

  function syncPlayer() {
    const A = getMiscArt();
    const Rr = player.radius;
    const hit = smokeOverlapThisFrame;
    const glowing = player.boostTimer > 0 && !hit;
    const wi = player.windInfluence || 0;
    const rot = player.angle + wi * 0.18;
    const cs = Math.cos(rot), sn = Math.sin(rot);

    // surfing aura + soft swooshes trailing behind
    if (wi >= 0.03) {
      N.auraC.visible = true;
      N.aura.alpha = wi;
      N.aura.position.set(player.x, player.y);
      const g = N.auraG, tt = frameNow * 0.015;
      g.clear();
      for (let pass = 0; pass < 2; pass++) {
        for (let i = 0; i < 3; i++) {
          const dy = -16 + i * 16 + Math.sin(tt + i * 2) * 4;
          const length = 55 + Math.sin(tt + i) * 15;
          const sx = player.x - Rr * 0.5, sy = player.y + dy;
          g.moveTo(sx, sy).quadraticCurveTo(sx - length / 2, sy + Math.sin(tt + i) * 5, sx - length, sy);
        }
        g.stroke(pass === 0 ? { width: 7, color: 0x2F7FD8, alpha: 0.6 * wi, cap: 'round' } : { width: 3.5, color: 0xFFFFFF, alpha: 0.95 * wi, cap: 'round' });
      }
    } else {
      N.auraC.visible = false;
    }

    N.pShadow.position.set(player.x + 5 * cs - 6 * sn, player.y + 5 * sn + 6 * cs);
    if (glowing || hit) {
      const gl = glowing ? A.glowBoost : A.glowSmoke;
      N.pGlow.visible = true;
      fit(N.pGlow, gl);
      N.pGlow.position.set(player.x, player.y);
    } else {
      N.pGlow.visible = false;
    }

    const sheet = glowing ? sprites.breezyHappy : sprites.breezyFly;
    if (sheet.ready) {
      const fc = sheet.frameCount, c = sheet.baked[((player.animFrame % fc) + fc) % fc];
      fit(N.pSpr, ct(c));
      N.pSpr.position.set(c.dx, c.dy);
      N.pBody.visible = true;
      const dy = player.y - player.prevY;
      const stretch = clamp(Math.abs(dy) * 0.03, 0, 0.12);
      N.pBody.position.set(player.x, player.y);
      N.pBody.scale.set(1 - stretch + wi * 0.05, 1 + stretch - wi * 0.05);
      N.pBody.rotation = player.angle * 0.35 + wi * 0.12;
      N.pBody.alpha = hit ? 0.55 : 1; // ...and Breezy goes grey when she coughs
      N.pBody.filters = hit ? [N.grayF] : null;

      // rising / falling cue
      const ch = N.chev;
      ch.clear();
      if (Math.abs(dy) > 0.15) {
        const climbing = dy < 0, cx = player.x + Rr + 14, cy = player.y;
        const pl = climbing ? [cx - 8, cy + 6, cx, cy - 8, cx + 8, cy + 6] : [cx - 8, cy - 6, cx, cy + 8, cx + 8, cy - 6];
        ch.poly(pl).fill(climbing ? colNum(COLORS.lime) : colNum(COLORS.cobalt)).stroke({ width: 2.5, color: INK_N, join: 'round' });
        ch.alpha = clamp(Math.abs(dy) * 0.08, 0.45, 1);
      }
    } else {
      N.pBody.visible = false;
      N.chev.clear();
    }

    N.bubble.visible = hit;
    if (hit) N.bubble.position.set(player.x, player.y - Rr * 1.75);
  }

  function syncSmokes() {
    const art = getSmokeArt();
    const oT = ct(art.outer), cT = ct(art.core), gT = ct(art.gap), fT = ct(art.factory);
    const chimneyY = GROUND_Y - 56, span = chimneyY + 40;
    const tw = frameNow * 0.0025, bt = frameNow * 0.003;
    const P = N.plumeP, GP = N.gapP, g = N.smokeG;
    P.begin(); GP.begin();
    g.clear();
    let factories = 0;
    for (let si = 0; si < smokes.length; si++) {
      const s = smokes[si], gapHalf = s.gapWidth / 2;
      // the plume: overlapping puffs that grow and twist; the safe gap stays clean
      for (let y = chimneyY, j = 0; y >= -40; y -= 10, j++) {
        if (Math.abs(y - s.gapY) < gapHalf) {
          // a clean air pocket: now and then a little lime spark
          if (hash01(j + s.wobble * 7.1, drawCount) < 0.1) {
            const rr = 3 + 4 * hash01(j * 1.7 + 3.1 + s.wobble * 5.3, drawCount * 1.3 + 7);
            g.circle(s.x + Math.sin((GROUND_Y - y) * 0.01 + s.wobble) * 10, y, rr).fill({ color: 0xC6FF3D, alpha: 0.3 });
          }
          continue;
        }
        const age = (chimneyY - y) / span;
        const px = s.x + Math.sin(age * Math.PI * 1.8 - tw + s.wobble) * 45 * age;
        const size = s.radius * (1.0 + age * 1.6) + Math.sin(y * 0.03 + bt + s.wobble) * 8;
        const so = size * 1.3;
        if (px + so < 0 || px - so > W) continue;
        const a = P.next();
        a.texture = oT.tex;
        a.scale.set((so * 2) / oT.tex.orig.width);
        a.position.set(px, y);
        a.alpha = 1 - age * 0.4;
        const c = P.next();
        c.texture = cT.tex;
        c.scale.set((size * 2) / cT.tex.orig.width);
        c.position.set(px, y);
        c.alpha = 1 - age * 0.45;
      }
      // the green gap: a soft lime glow and dotted rings above and below it
      const gr = s.gapWidth * 0.7;
      const gs = GP.next();
      gs.texture = gT.tex;
      gs.scale.set((gr * 2) / gT.tex.orig.width);
      gs.position.set(s.x, s.gapY);
      gs.alpha = 1;
      for (let side = -1; side <= 1; side += 2) {
        const cy = s.gapY + side * s.gapWidth / 2;
        for (let d = 0; d < 8; d++) {
          const a0 = d * (TAU / 8);
          g.moveTo(s.x + Math.cos(a0) * 16, cy + Math.sin(a0) * 16).arc(s.x, cy, 16, a0, a0 + TAU / 8 * 0.4);
        }
      }
      g.stroke({ width: 2.5, color: 0xC6FF3D, alpha: 0.5, cap: 'round' });
    }
    P.end(); GP.end();
    // factory on the grass, on top of the plume base
    const F = N.factoryP;
    F.begin();
    for (let si = 0; si < smokes.length; si++) {
      const s = smokes[si];
      if (s.x <= -100 || s.x >= W + 100) continue;
      const f = F.next();
      fit(f, fT);
      f.anchor.set(0);
      f.position.set(s.x - 30, GROUND_Y - 60);
      const pulse = 0.7 + Math.sin(frameNow * 0.005 + s.wobble) * 0.3;
      g.rect(s.x - 16, GROUND_Y - 22, 10, 10).fill({ color: 0xFF7C3B, alpha: pulse }).stroke({ width: 4, color: INK_N });
      g.rect(s.x + 6, GROUND_Y - 22, 10, 10).fill({ color: 0xFF7C3B, alpha: pulse }).stroke({ width: 4, color: INK_N });
      const puffTime = frameNow * 0.004 + s.wobble, pr = 13 + Math.sin(puffTime) * 3;
      g.circle(s.x - 11, GROUND_Y - 56, pr).fill({ color: 0x2D3036, alpha: 0.9 });
      g.circle(s.x - 11 + Math.sin(puffTime) * 4, GROUND_Y - 68, pr * 0.8).fill({ color: 0x2D3036, alpha: 0.9 });
      g.circle(s.x + 11, GROUND_Y - 56, pr).fill({ color: 0x2D3036, alpha: 0.9 });
      g.circle(s.x + 11 - Math.sin(puffTime) * 4, GROUND_Y - 68, pr * 0.8).fill({ color: 0x2D3036, alpha: 0.9 });
    }
    F.end();
  }

  function syncParticles() {
    const A = getMiscArt();
    const P = N.partP;
    P.begin();
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i], s = P.next();
      s.texture = A.disc.tex;
      s.scale.set((p.size * 2) / A.disc.tex.orig.width);
      s.position.set(p.x, p.y);
      s.tint = colNum(p.color);
      s.alpha = clamp(p.life, 0, 1);
    }
    P.end();
    // floating "+1 ⚡" words
    const F = N.floatP;
    F.begin();
    for (let i = 0; i < floatTexts.length; i++) {
      const t = floatTexts[i], s = F.next();
      const p = clamp(t.life / t.maxLife, 0, 1);
      if (s._txt !== t.text) { s.text = t.text; s._txt = t.text; }
      if (s._col !== t.color) { s.style.fill = t.color; s._col = t.color; }
      const bounce = 1 + Math.sin(p * Math.PI) * 0.18;
      s.position.set(t.x, t.y);
      s.scale.set(bounce);
      s.alpha = p;
    }
    F.end();
  }

  function syncFx() {
    // dive speed lines
    const sg = N.speedG;
    sg.clear();
    if (player.diving) {
      const phase = scrollX * 3;
      for (let i = 0; i < 10; i++) {
        const lx = ((i * 97 + phase) % (W + 200)) - 100, ly = (i * 173) % H, len = 40 + (i % 3) * 20;
        sg.moveTo(lx, ly).lineTo(lx - len * 0.25, ly - len);
      }
      sg.stroke({ width: 3, color: 0xFFFFFF, alpha: 0.6, cap: 'round' });
    }
    // smoke vignette eases in and out
    N.vigA = lerp(N.vigA, smokeOverlapThisFrame ? 1 : 0, 0.18);
    N.vig.alpha = N.vigA < 0.01 ? 0 : N.vigA;
    N.vig.visible = N.vigA >= 0.01;

    const winning = gameState === 'winning', won = gameState === 'win';
    // victory rainbow (behind the town and Breezy)
    const showRb = winning && winTimer >= 160;
    N.rainbowG.visible = showRb;
    if (showRb) N.rainbowG.alpha = clamp((winTimer - 160) / 65, 0, 1) * 0.85;
    // victory Seed of Life (in front of Breezy)
    const showSeed = winning && winTimer >= 320;
    N.seedC.visible = showSeed;
    if (showSeed) {
      const al = clamp((winTimer - 320) / 45, 0, 1);
      N.beam.alpha = al * 0.4;
      N.seed.alpha = al;
      N.seed.position.set(W / 2, H / 2 + 25 + Math.sin(frameNow * 0.005) * 8);
      N.seed.rotation = frameNow * 0.0015;
    }
    // expanding win wipe
    if (winning || won) {
      const r = winWipeDone ? winWipeMax : winWipeRadius;
      N.wipe.visible = r > 1;
      N.wipe.scale.set((r * 2) / N.wipe.texture.orig.width);
      N.wipeRing.visible = winning && r > 1;
      if (N.wipeRing.visible) {
        N.wipeRing.clear();
        N.wipeRing.circle(W / 2, H / 2, r).stroke({ width: 6, color: 0x111111 });
      }
    } else {
      N.wipe.visible = false;
      N.wipeRing.visible = false;
    }
  }

  // text / hint layer that stays a 2D overlay (the coach helpers draw on a Canvas2D context)
  function drawCoachHints() {
    const ov = N.overlay;
    if (!ov) return;
    if (!coach.active || gameState !== 'playing') { ov.hide(); return; }
    const ctx = ov.begin();
    const t = coach.t, i = coach.index;
    ctx.save();
    if (i === 0) {
      const x = player.x + 110;
      GOGCoach.dragDemo(ctx, { x, y: 400 }, { x, y: 200 }, t, { arc: 0, radius: 30, period: 2.6 });
      GOGCoach.tag(ctx, x, 150, 'Slide up & down');
    } else if (i === 1 && coachSmoke) {
      const s = coachSmoke;
      const tx = clamp(s.x, 100, W - 100);
      if (s.x < W - 10) GOGCoach.ring(ctx, s.x, s.gapY, Math.min(60, s.gapWidth * 0.3), t);
      GOGCoach.tag(ctx, tx, Math.max(110, s.gapY - s.gapWidth / 2 - 22), s.x > W - 30 ? 'Smoke coming →' : 'Fly through the gap!');
    } else if (i === 2) {
      if ((player.windInfluence || 0) > 0.15) {
        let o = null;
        for (const c of orbs) { if (c.x > player.x - 30 && (!o || c.x < o.x)) o = c; }
        if (o) {
          GOGCoach.ring(ctx, o.x, o.y, 32, t);
          GOGCoach.tag(ctx, clamp(o.x, 90, W - 90), Math.max(110, o.y - 52), 'Touch the sun! ☀️');
        }
      } else {
        const cur = windCurrents.find(c => c.x + c.length > player.x + 40);
        if (cur) {
          const px = clamp(Math.max(cur.x + 60, player.x + 120), 60, W - 60);
          if (px >= cur.x && px <= cur.x + cur.length) {
            const sample = sampleWindCurrentAt(cur, px);
            const edgeY = sample.y - sample.thick * 0.5; // top edge of the wind
            GOGCoach.arrow(ctx, px, edgeY - 4, t, 'down');
            GOGCoach.tag(ctx, px, Math.max(110, edgeY - 98), 'Fly into the wind 🌬️');
          }
        }
      }
    }
    ctx.restore();
  }

  function syncScene(time) {
    if (!backdrop) rebuildBackdrop();
    syncSky();
    syncSparkles();
    syncClouds();
    syncBirds();
    syncCity();
    syncWind();
    syncOrbs(time);
    syncPlayer();
    syncSmokes();
    syncParticles();
    syncForegroundClouds();
    syncFx();
    drawCoachHints();
  }

  function render(time) {
    frameNow = Date.now();
    drawCount++;
    if (!sceneReady) return;
    syncScene(time);
    R.render();
  }

  // ---------------------------------------------------------------
  // MAIN LOOP
  // ---------------------------------------------------------------
  // One fixed 1/60 s step of the world (GOGEngine.GameLoop calls this at 60 Hz, so every
  // speed below is exactly what it was at 60 fps; dt stays in "frames" units).
  function stepWorld(){
    const dt = 1;
    frameNow = Date.now();
    if(gameState === 'playing'){
      update(dt);
    } else {
      if(windNoiseSource) updateWindAudio(0, dt); // let the whoosh fade out after a win/fail
      // idle background motion on start/win/fail screens
      bgOffset1 = (bgOffset1 + 0.4*dt) % W;
      bgOffset2 = (bgOffset2 + 0.8*dt) % W;
      scrollX += 0.45 * dt;
      for(let i=ambientClouds.length-1;i>=0;i--){
        const c = ambientClouds[i];
        c.x -= c.speed*1.2*dt;
        c.blinkTimer -= dt/60;
        if(c.blinkTimer <= 0){ c.frame = 1 - c.frame; c.blinkTimer = rand(2.5,5); }
        if(c.x < -100){ ambientClouds.splice(i,1); spawnAmbientCloud(W+rand(20,80)); }
      }
      if(Math.random() < 0.01*dt) spawnBird();
      for(let i=birds.length-1;i>=0;i--){
        const b = birds[i];
        b.x -= b.speed*1.2*dt;
        b.flapTimer += dt/60*b.flapRate;
        if(b.x < -60){ birds.splice(i,1); }
      }

      // 1. Update Breezy's wing flapping animation
      const frameCount = sprites.breezyFly.frameCount;
      player.animTimer += dt / 60 * 11;
      player.animFrame = Math.floor(player.animTimer) % frameCount;

      // 2. Gentle hover bobbing in place
      player.y = 280 + Math.sin(frameNow * 0.0035) * 10;
      player.prevY = player.y; // keep previous y aligned to prevent stretch triggers
      player.angle = Math.sin(frameNow * 0.002) * 0.04;
    }
    if(gameState === 'winning'){
      winTimer += dt;
      
      // Update background scrolling slightly during win celebration
      scrollX += 0.5 * dt;
      bgOffset1 = (bgOffset1 + 0.15 * dt) % W;
      bgOffset2 = (bgOffset2 + 0.3 * dt) % W;
      
      // Update ambient clouds
      for(let i=ambientClouds.length-1;i>=0;i--){
        const c = ambientClouds[i];
        c.x -= c.speed*0.6*dt;
        if(c.x < -100){ ambientClouds.splice(i,1); spawnAmbientCloud(W+rand(20,80)); }
      }
      
      // Update birds
      for(let i=birds.length-1;i>=0;i--){
        const b = birds[i];
        b.x -= b.speed*1.2*dt;
        b.flapTimer += dt/60*b.flapRate;
        if(b.x < -60) birds.splice(i,1);
      }

      // Update particles
      for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt;
        p.life -= dt/60/p.maxLife*3.6;
        if(p.life <= 0) particles.splice(i,1);
      }
      updateFloatTexts(dt);

      // 1. Spawning birds flock
      if (winTimer >= 45 && winTimer < 45 + dt * 1.5) {
        for (let i = 0; i < 9; i++) {
          birds.push({
            x: W + rand(20, 240),
            y: rand(PLAY_TOP, PLAY_TOP + 120),
            baseY: rand(PLAY_TOP, PLAY_TOP + 120),
            speed: rand(1.3, 1.9),
            h: rand(22, 32),
            flapTimer: rand(0, 1),
            flapRate: rand(8, 12),
            wobble: rand(0, Math.PI*2)
          });
        }
      }

      // 2. Happy clouds conversion
      if (winTimer >= 100 && winTimer < 100 + dt * 1.5) {
        ambientClouds.forEach(c => { c.frame = 0; });
        for (let i = 0; i < 3; i++) {
          spawnAmbientCloud(W + rand(10, 120));
        }
      }

      // 3. Move Breezy to center and celebrate
      if (winTimer >= 240) {
        player.x = lerp(player.x, W/2, clamp(0.06*dt, 0, 1));
        player.y = lerp(player.y, H/2 - 40, clamp(0.06*dt, 0, 1));
        player.targetY = player.y;
        player.angle = Math.sin(winTimer * 0.15) * 0.15;
        player.boostTimer = 999; // happy anim
        
        // Spawn party sparkles!
        if (Math.random() < 0.18 * dt) {
          spawnBurst(player.x + rand(-20, 20), player.y + rand(-20, 20), 'rainbow', 6);
        }
      }

      // 4. Wipe transition
      if (winTimer >= 400) {
        winWipeRadius += dt * (winWipeMax * 1.6 / 60);
        if(winWipeRadius >= winWipeMax){
          winWipeDone = true;
          finishWin();
        }
      }
    }
  }

  // Fixed-step loop: skips draw() on frames without a step, stops while the tab is hidden.
  // The "How to play" pop-up (GOGUi.paused) freezes both the world and the drawing.
  const loop = new GOGEngine.GameLoop({
    update: function(){ if(!GOGUi.paused) stepWorld(); },
    draw: function(){ if(!GOGUi.paused) render(performance.now()); }
  });

  // STREAMLINED: start/replay/retry are now driven entirely by the single
  // GOGUi popup at each moment (the guardian beat's onDone for the first
  // start, and the win/fail overlay's buttons — a page reload, matching
  // stages 1-4 — for "Play Again"/"Try Again"), so the old dedicated
  // button listeners for the removed overlay markup are gone too.

  buildBuildings();
  seedAmbientClouds();
  updateHUD();
  // Pixi v8 needs WebGL; GOGRender explains on screen when it is missing and the stage then stays idle.
  GOGRender.create(canvas, W, H).then(function (r) {
    R = r;
    buildScene();
    render(performance.now());
    loop.start();
    showIntro();
  }, function () {});
  
})();
</script>

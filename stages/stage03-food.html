<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Buzz &amp; the Last Blooms — Guardians of Gaia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&family=Caveat:wght@600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="../src/styles.css" />
  <style>
    .stage-wrap {
      width: min(1180px, calc(100vw - 28px));
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 0 32px;
      animation: pageFadeIn 0.5s ease both;
    }

    .stage-hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .stage-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stage-title h1 {
      font-size: 1.25rem;
    }

    .stage-title small {
      display: block;
      font-family: var(--gog-font-hand);
      font-size: 1rem;
      color: #72624c;
    }

    .hud-mid {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .meter {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--gog-white);
      border: 3px solid var(--gog-ink);
      border-radius: 999px;
      padding: 6px 14px 6px 10px;
      box-shadow: var(--gog-shadow-sm);
      min-width: 168px;
      position: relative;
    }

    .meter .label,
    .meter .meter-track {
      position: relative;
      z-index: 2;
    }

    .meter .label {
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .meter-track {
      flex: 1;
      height: 10px;
      border-radius: 999px;
      background: #fdf5e6;
      border: 2px solid var(--gog-ink);
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ffd23f, var(--gog-tangerine));
      transition: width 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .timer-chip {
      font-weight: 700;
      min-width: 64px;
      text-align: center;
    }

    .canvas-frame {
      position: relative;
      width: 100%;
      max-height: calc(100vh - 220px);
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      overflow: hidden;
      transition:
        border-color 0.2s,
        box-shadow 0.2s;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      cursor: crosshair;
    }

    .stage-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    @keyframes pageFadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .emoji-float {
      display: inline-block;
      animation: emojiFloat 2.6s ease-in-out infinite;
    }

    @keyframes emojiFloat {
      0%,
      100% {
        transform: translateY(0) rotate(-4deg);
      }
      50% {
        transform: translateY(-5px) rotate(5deg);
      }
    }

    @keyframes comboPop {
      0% { transform: scale(1); }
      40% { transform: scale(1.35) rotate(-4deg); }
      100% { transform: scale(1); }
    }
    .combo-pop {
      animation: comboPop 0.28s ease;
    }

    .calm-badge {
      font-size: 0.78rem;
      font-weight: 700;
      animation: fadeInUp 0.6s ease both;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      min-width: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gog-white);
      border: 3px solid var(--gog-ink);
      border-radius: 50%;
      box-shadow: 3px 3px 0 var(--gog-ink);
      font-size: 1.15rem;
      line-height: 1;
      touch-action: manipulation;
    }

    /* ================================================================
       COCOMELON-STYLE CLARITY PASS
       Bigger, bolder, brighter, with obvious escalating-color + bounce
       feedback so every HUD element reads at a glance even for a
       pre-reader — the same "big bold icon + one bright color state +
       a bounce" language that toddler shows use so nothing needs to be
       read to be understood.
       ================================================================ */
    .stage-hud .chip {
      font-size: 1.05rem;
      font-weight: 800;
      padding: 8px 16px;
      border-width: 3px;
      box-shadow: 4px 4px 0 var(--gog-ink);
    }

    #progressVal {
      display: inline-block;
      font-size: 1.15rem;
      font-weight: 800;
    }
    .progress-pop {
      animation: progressPop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes progressPop {
      0% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.65);
        color: var(--gog-tangerine);
      }
      100% {
        transform: scale(1);
      }
    }

    /* Timer turns loud red + pulses once time is running low — a color
       AND motion cue together, never color alone. */
    .timer-chip {
      transition:
        background 0.3s,
        color 0.3s,
        border-color 0.3s;
    }
    .timer-chip.timer-danger {
      background: #ff4d4d;
      color: #fff;
      border-color: #7a0000;
      animation: timerPulse 0.6s ease-in-out infinite;
    }
    @keyframes timerPulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.14);
      }
    }

    /* Combo chip visibly heats up as the streak climbs — cool green at
       the start, warm gold mid-streak, hot pink/tangerine + a little
       shake once it's really cooking. */
    .combo-chip {
      transition:
        background 0.25s,
        color 0.25s;
    }
    .combo-chip.combo-warm {
      background: #ffd23f;
      color: #241c30;
      border-color: #7a5a00;
    }
    .combo-chip.combo-hot {
      background: linear-gradient(90deg, #ff5e94, var(--gog-tangerine));
      color: #fff;
      border-color: #7a0033;
      animation: comboHotShake 0.5s ease-in-out infinite;
    }
    @keyframes comboHotShake {
      0%,
      100% {
        transform: rotate(0deg) scale(1);
      }
      25% {
        transform: rotate(-5deg) scale(1.1);
      }
      75% {
        transform: rotate(5deg) scale(1.1);
      }
    }

    /* Guide mascot — idles with a friendly bounce, then reacts big and
       obviously happy/oops on key beats, so the lesson lands even for
       a kid who isn't reading the bubble yet. */
    .guideBar {
      padding: 10px 14px;
      border-width: 4px;
      box-shadow: 5px 5px 0 var(--gog-ink);
      transition: box-shadow 0.2s;
    }
    .guideAvatar {
      font-size: 2.1rem;
      display: inline-block;
      animation: guideIdleBounce 2.4s ease-in-out infinite;
    }
    @keyframes guideIdleBounce {
      0%,
      100% {
        transform: translateY(0) rotate(-3deg);
      }
      50% {
        transform: translateY(-4px) rotate(3deg);
      }
    }
    .guideAvatar.guide-happy {
      animation: guideHappyBounce 0.5s ease-in-out 2;
    }
    @keyframes guideHappyBounce {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-12px) scale(1.25);
      }
    }
    .guideAvatar.guide-oops {
      animation: guideOopsShake 0.4s ease-in-out;
    }
    @keyframes guideOopsShake {
      0%,
      100% {
        transform: translateX(0) rotate(0deg);
      }
      25% {
        transform: translateX(-6px) rotate(-10deg);
      }
      75% {
        transform: translateX(6px) rotate(10deg);
      }
    }
    .guideBubble {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.25;
    }

    @media (max-width: 700px) {
      .stage-wrap {
        width: calc(100vw - 12px);
        max-width: 100%;
        padding: 6px 0 18px;
      }

      .stage-hud {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
        margin-bottom: 8px;
      }

      .stage-title {
        gap: 6px;
        min-width: 0;
      }

      .stage-title .emoji-float {
        font-size: 1.35rem !important;
      }

      .stage-title h1 {
        font-size: 0.98rem;
        line-height: 1;
      }

      .stage-title small {
        display: none;
      }

      .hud-mid {
        display: grid;
        grid-template-columns: minmax(128px, 1fr) repeat(4, auto);
        gap: 5px;
        align-items: center;
        width: 100%;
      }

      .meter {
        min-width: 0;
        gap: 5px;
        padding: 4px 8px 4px 7px;
        border-width: 2px;
        box-shadow: 2px 2px 0 var(--gog-ink);
      }

      .meter .label {
        font-size: 0.66rem;
      }

      .meter-track {
        height: 8px;
        border-width: 2px;
      }

      .chip {
        padding: 4px 7px;
        border-width: 2px;
        box-shadow: 2px 2px 0 var(--gog-ink);
        font-size: 0.72rem;
        min-height: 30px;
      }

      .timer-chip {
        min-width: 44px;
      }

      .icon-btn {
        width: 32px;
        height: 32px;
        min-width: 32px;
        font-size: 0.92rem;
        border-width: 2px;
        box-shadow: 2px 2px 0 var(--gog-ink);
      }

      .guideBar {
        gap: 6px;
        padding: 3px 4px;
        margin-bottom: 8px;
        border-width: 2px;
        border-radius: 8px;
        box-shadow: 1px 1px 0 var(--gog-ink);
      }

      .guideAvatar {
        font-size: 1.25rem;
      }

      .guideBubble {
        padding: 5px 8px;
        border-width: 2px;
        border-radius: 10px;
        font-size: 1rem;
        line-height: 1.1;
      }

      .canvas-frame {
        border-width: 3px;
        border-radius: 12px;
        box-shadow: 4px 4px 0 var(--gog-ink);
      }

      .stage-controls {
        margin-top: 8px;
        gap: 6px;
      }

      .stage-controls .brutal-btn {
        padding: 8px 12px;
        min-height: 38px;
        border-width: 3px;
        border-radius: 10px;
        font-size: 0.86rem;
        box-shadow: 3px 3px 0 var(--gog-ink);
      }

      .calm-badge {
        font-size: 0.72rem;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body {
      position: relative;
    }

    .page-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at 50% -8%,
          #efffdd 0%,
          #d4f0bd 42%,
          #fdf6e6 100%
        ),
        linear-gradient(
          180deg,
          rgba(60, 135, 67, 0.1),
          rgba(36, 99, 55, 0.16)
        );
    }

    .page-bubble {
      position: absolute;
      bottom: -10vh;
      border-radius: 999px;
      background: radial-gradient(
        circle at 32% 28%,
        rgba(255, 255, 255, 0.95),
        rgba(201, 242, 61, 0.14) 70%
      );
      opacity: 0;
      animation: pageBubbleRise linear infinite;
    }

    @keyframes pageBubbleRise {
      0% {
        transform: translateY(0) translateX(0);
        opacity: 0;
      }
      8% {
        opacity: 0.5;
      }
      90% {
        opacity: 0.35;
      }
      100% {
        transform: translateY(-125vh) translateX(var(--drift, 24px));
        opacity: 0;
      }
    }

    .page-fx {
      position: fixed;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .page-bubble {
        animation: none;
        opacity: 0;
      }
    }
  </style>

</head>
<body>
    <div class="page-bg" aria-hidden="true">
      <span class="page-bubble" style="left: 6%; width: 14px; height: 14px; animation-duration: 14s; animation-delay: 0s; --drift: 18px;"></span>
      <span class="page-bubble" style="left: 18%; width: 9px; height: 9px; animation-duration: 11s; animation-delay: 2.4s; --drift: -14px;"></span>
      <span class="page-bubble" style="left: 32%; width: 18px; height: 18px; animation-duration: 17s; animation-delay: 5s; --drift: 22px;"></span>
      <span class="page-bubble" style="left: 48%; width: 11px; height: 11px; animation-duration: 13s; animation-delay: 1.2s; --drift: -10px;"></span>
      <span class="page-bubble" style="left: 64%; width: 16px; height: 16px; animation-duration: 16s; animation-delay: 7s; --drift: 16px;"></span>
      <span class="page-bubble" style="left: 78%; width: 10px; height: 10px; animation-duration: 12s; animation-delay: 3.6s; --drift: -18px;"></span>
      <span class="page-bubble" style="left: 90%; width: 13px; height: 13px; animation-duration: 15s; animation-delay: 6.2s; --drift: 12px;"></span>
    </div>
    <div class="page-fx" id="pageFx" aria-hidden="true"></div>

  <div class="stage-wrap">
    <div class="stage-hud">
      <div class="stage-title">
        <span style="font-size: 1.8rem" class="emoji-float">🐝</span>
        <div>
          <h1>Buzz &amp; the Last Blooms</h1>
          <small>Stage 3 · Meadow</small>
        </div>
      </div>
      <div class="hud-mid">
        <div class="meter" title="Meadow Blooms">
          <span class="label">BLOOMED</span>
          <div class="meter-track">
            <div class="meter-fill" id="progressFill"></div>
          </div>
          <span class="label"><span id="progressVal">0</span> / 15</span>
        </div>
        <span class="chip timer-chip" id="timerChip">60s</span>
        <span class="chip">🌼 <span id="scoreChip">0</span></span>
        <span class="chip combo-chip" id="comboChip">🔥 x0</span>
        <button
          class="icon-btn"
          id="muteBtn"
          title="Toggle sound"
          aria-label="Toggle sound"
        >
          🔊
        </button>
        <div class="stage-controls">
          <a class="brutal-btn ghost" href="../index.html">⬅ Back to Map</a>
          <span class="hand calm-badge" id="calmBadge"></span>
        </div>
      </div>
    </div>

    <!-- Mascot Guide Bar -->
    <div class="guideBar">
      <div class="guideAvatar" aria-hidden="true">🐝</div>
      <div class="guideBubble" id="guideText">
        Help Buzz pollinate flowers and feed the forest critters! 🌸
      </div>
    </div>

    <div class="brutal-box canvas-frame" id="canvasFrame">
      <canvas id="gameCanvas" width="800" height="600" style="width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair;"></canvas>
    </div>
  </div>

  <!-- Seed Returns Cutscene Overlay -->
  <div class="cutscene-overlay" id="cutscene">
    <div class="csSeed">🌱</div>
    <div class="csTree" id="csTreeIcon">🌳</div>
    <div class="csText">A seed returns to the Tree…</div>
    <button class="btn small csSkip" id="csSkipBtn">Skip ⏭</button>
  </div>

  <script src="../data/content.js"></script>
  <script src="../src/constants.js"></script>
  <script src="../src/save.js"></script>
  <script src="../src/engine.js"></script>
  <script src="../src/ui.js"></script>

<script>
/* ============================================================
   STAGE 3 — BUZZ & THE LAST BLOOMS
   Rhythm-tracing pollination mini-game built on GOGEngine.
   ============================================================ */
(function () {
  "use strict";

  var canvas = document.getElementById("gameCanvas");
  var ctx = canvas.getContext("2d");
  var W = canvas.width, H = canvas.height;

  var Collision = window.GOGEngine.Collision;
  var particles = new window.GOGEngine.ParticleSystem(160);
  var audio = new window.GOGEngine.Audio(false);
  var EmojiSprite = window.EmojiSprite;

  // Buzz flying sprite sheet — loaded ONCE and reused every frame
  // Sprite sheet uses grid layout: 4 columns × 2 rows (8 frames total)
  // Each frame shows bee wing flapping positions for smooth animation
  var beesFlyingSpriteSheet = new Image();
  beesFlyingSpriteSheet.src = "assets/sprites/stage03/bees-flying.png";
  var beeSheetLoaded = false;
  beesFlyingSpriteSheet.onload = function () {
    beeSheetLoaded = true;
    console.log("✓ Bee sprite sheet loaded successfully at", beesFlyingSpriteSheet.src);
  };
  beesFlyingSpriteSheet.onerror = function () {
    console.warn("⚠ Bee sprite sheet not found at:", "assets/sprites/stage03/bees-flying.png");
    console.warn("Using procedural bee animation fallback.");
  };
  var BEES_SHEET_COLS = 4;
  var BEES_SHEET_ROWS = 2;
  var BEES_FRAME_COUNT = 8;          // 4 cols × 2 rows
  var BEES_SHEET_FRAME_WIDTH = 256;  // pixel width of one frame in the sheet (adjust if needed)
  var BEES_SHEET_FRAME_HEIGHT = 256; // pixel height of one frame in the sheet (adjust if needed)
  var BUZZ_SPRITE_SIZE = 64;         // how big to draw on canvas (increased for better visibility)
  var BUZZ_ANIM_FPS = 12;            // frames per second for wing flap (12 fps = smooth wing flapping)

  // Same fetch-once-scale-at-draw-time pattern for background ambient life.
  var butterflySpriteImg = EmojiSprite.get("🦋", 22);
  var ladybugSpriteImg = EmojiSprite.get("🐞", 16);

  /* ---------------- DOM refs ---------------- */
  var scoreChip = document.getElementById("scoreChip");
  var comboChip = document.getElementById("comboChip");
  var progressFill = document.getElementById("progressFill");
  var progressVal = document.getElementById("progressVal");
  var timerChip = document.getElementById("timerChip");
  var muteBtn = document.getElementById("muteBtn");
  var guideAvatarEl = document.querySelector(".guideBar .guideAvatar");

  // Makes the mascot visibly happy or concerned at key beats, so the
  // stage's feedback reads through expression + motion, not just text.
  function reactGuide(mood) {
    if (!guideAvatarEl || !window.GOGUi) return;
    window.GOGUi.restartAnimation(guideAvatarEl, mood === "happy" ? "guide-happy" : "guide-oops");
  }

  /* ---------------- Save & Sound State ---------------- */
  var STAGE_ID = "stage03";
  var save = window.GOGSave ? window.GOGSave.load() : { settings: { sound: true } };
  var muted = save.settings ? !save.settings.sound : false;
  audio.setMuted(muted);
  muteBtn.textContent = muted ? "🔇" : "🔊";

  var activeOverlay = null;

  function showIntro() {
    activeOverlay = GOGUi.showOverlay({
      accent: "var(--gog-tangerine)",
      title: "🐝 Buzz & the Last Blooms",
      body: '<p>Trace flight paths between blooming flowers before they wilt. Keep Buzz busy, and watch the whole meadow come alive.</p>' +
            '<ul style="text-align:left;font-size:0.9rem;margin:10px 0;padding-left:20px;">' +
            '<li>🌱 A new flower appears on every beat — it wilts in 3 seconds!</li>' +
            '<li>🖱️ Drag from one glowing flower to another to fly Buzz between them.</li>' +
            '<li>🌸 Both flowers bloom, drop fruit, and feed a hungry critter.</li>' +
            '<li>💨 Miss 3 in a row and the meadow gets smoggy — no bees, no food.</li>' +
            '<li>🎯 Pollinate 15 flowers to make the whole meadow bloom!</li>' +
            '</ul>',
      primaryLabel: "Start Buzzing ▶",
      onPrimary: function () {
        GOGUi.closeOverlay(activeOverlay);
        activeOverlay = null;
        resetGame();
      }
    });
  }

  /* ---------------- Constants ---------------- */
  var WIN_TARGET = 15;
  var SESSION_MS = GOGConstants.STAGE3.gameTimeMs; // 60 seconds from constants
  var WILT_MS = 3000;
  var BEAT_MS = 2000;
  var BEAT_JITTER = 300;
  var MAX_ACTIVE_FLOWERS = 4;
  var SMOG_MISS_THRESHOLD = 3;
  var FAIL_MISS_THRESHOLD = 6;
  var GROUND_Y = H - 78;
  var FLOWER_R = 32;

  // --- Buzz (the player bee) tuning -------------------------------------
  var BUZZ_TRAIL_MAX = 20;       // sampled ribbon points while dragging
  var BUZZ_TRAIL_LIFE = 0.35;    // seconds a motion-blur dot stays visible
  var BUZZ_LAND_MS = 0.22;       // landing squash duration
  var BUZZ_TAKEOFF_MS = 0.22;    // takeoff stretch duration
  var BUZZ_EMIT_INTERVAL = 0.07; // spark particle spacing while flying

  // --- Ambient background tuning -----------------------------------------
  var CLOUD_COUNT = 4;
  var POLLEN_COUNT = 16;
  var FIREFLY_COUNT = 8;
  var PETAL_COUNT = 8;
  var BG_BUTTERFLY_COUNT = 3;
  var BG_LADYBUG_COUNT = 2;
  var GRASS_SPACING = 22;

  var CRITTERS = ["🐸", "🐰"];
  var FRUITS = ["🍎", "🍇", "🍒", "🍓", "🍑"];

  /* ---------------- Sprites preloading ---------------- */
  var boarImg = new Image();
  boarImg.src = "assets/sprites/stage03/Boar_Run_with_shadow.png";

  var deerImg = new Image();
  deerImg.src = "assets/sprites/stage03/Deer_Run_with_shadow.png";

  var hareImg = new Image();
  hareImg.src = "assets/sprites/stage03/Hare_Run_with_shadow.png";

  var flowerGrowingImg = new Image();
  flowerGrowingImg.src = "assets/sprites/stage03/flower_1.png";

  var flowerWiltingImg = new Image();
  flowerWiltingImg.src = "assets/sprites/stage03/flower_2.png";


  var CRITTER_DEFS = {
    boar: { img: boarImg, frames: 5, emoji: "🐗", defaultFacing: -1 },
    deer: { img: deerImg, frames: 6, emoji: "🦌", defaultFacing: 1 },
    hare: { img: hareImg, frames: 6, emoji: "🐇", defaultFacing: -1 }
  };

  /* ---------------- Mutable game state ---------------- */
  var gameState = "idle"; // idle | playing | winning | win | fail
  var flowers = [];
  var fruits = [];
  var critters = [];
  var flowerIdSeq = 1;
  var fruitIdSeq = 1;

  var score = 0, combo = 0, pollinatedCount = 0, consecutiveMisses = 0;
  var beatTimer = 0, nextBeatMs = BEAT_MS;
  var sessionTimeLeft = SESSION_MS;
  var smogActive = false, smogTimer = 0, smogAlpha = 0;
  var smogClouds = [];
  var flightPaths = [];

  // One-shot flags for the milestone call-outs below — each fires once per
  // session so the lesson lands clearly without turning into noise.
  var saidFirstPollinate = false;
  var saidCritterFed = false;

  // Short bouncy on-canvas captions ("+50!", "Yum!", "Oops!") that pop up
  // right where the thing happened — a Cocomelon-style visual+verbal
  // double-reinforcement so the cause-and-effect reads even without
  // reading the guide bubble. Same life/maxLife pattern as flightPaths.
  var floatLabels = [];
  function spawnFloatLabel(x, y, text, color) {
    floatLabels.push({ x: x, y: y, text: text, color: color || "#241c30", life: 0, maxLife: 0.9 });
  }
  function updateFloatLabels(dt) {
    for (var i = floatLabels.length - 1; i >= 0; i--) {
      floatLabels[i].life += dt;
      if (floatLabels[i].life >= floatLabels[i].maxLife) floatLabels.splice(i, 1);
    }
  }
  function drawFloatLabels() {
    if (!floatLabels.length) return;
    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "800 20px 'Baloo 2', sans-serif";
    ctx.lineJoin = "round";
    for (var i = 0; i < floatLabels.length; i++) {
      var fl = floatLabels[i];
      var t = fl.life / fl.maxLife;
      var y = fl.y - t * 46; // drifts upward as it lives
      var alpha = 1 - t * t; // eases out toward the end
      // Bouncy pop-in (overshoot past 1x) then a gentle settle down.
      var scale = t < 0.25 ? 0.7 + (t / 0.25) * 0.55 : 1.25 - (t - 0.25) * 0.33;
      ctx.save();
      ctx.globalAlpha = Math.max(0, alpha);
      ctx.translate(fl.x, y);
      ctx.scale(scale, scale);
      ctx.lineWidth = 4;
      ctx.strokeStyle = "#241c30";
      ctx.fillStyle = fl.color;
      ctx.strokeText(fl.text, 0, 0);
      ctx.fillText(fl.text, 0, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  var dragging = false;
  var dragSourceId = null;
  var dragTrail = [];
  var dragCurrent = { x: 0, y: 0 };
  var hoverTargetId = null;

  var ambientBee = { x: W * 0.5, y: H * 0.22, t: Math.random() * 100 };

  // Buzz — the player-controlled bee. This is a persistent character that
  // exists in EVERY state (idle hover, mid-flight, landing), not just while
  // a drag is active. See updateBuzz()/drawBuzz() for behavior.
  var buzz = {
    x: W * 0.5, y: GROUND_Y - 160,     // current smoothed screen position
    restX: W * 0.5, restY: GROUND_Y - 160, // idle hover anchor point
    vx: 0, vy: 0,                       // velocity, drives bank angle
    angle: 0,                           // current bank/rotation (radians)
    wingPhase: 0,                       // wing-flap oscillation phase (legacy, kept for compatibility)
    scaleX: 1, scaleY: 1,               // squash & stretch
    state: "idle",                      // idle | flying | landing
    landTimer: 0,
    takeoffTimer: 0,
    idleT: Math.random() * 10,
    emitTimer: 0,
    frameIndex: 0,                      // current frame in sprite sheet (0-11)
    elapsedFrameTime: 0,                // accumulated time for frame advancement
    trail: []                           // {x,y,age} buzzing motion-blur trail
  };

  var winWipeRadius = 0;
  var winWipeMax = Math.hypot(W, H) * 0.6;

  /* ---------------- Ambient background state ----------------
     All of these are decorative, gameplay-independent, and live for the
     lifetime of the page (not reset per game) — the meadow should never
     look empty, even on the intro/win/fail overlays. Pools are small,
     fixed-size, and built once here; nothing here allocates per frame. */
  var windPhase = 0;          // shared clock driving grass sway + light drift
  var ambientVividness = 1;   // 1 = full life, fades toward 0 as smog rises

  function makeCloud() {
    return { x: rand(-100, W + 100), y: rand(30, 110), scale: rand(0.7, 1.3), speed: rand(6, 14) };
  }
  var clouds = [];
  for (var ci = 0; ci < CLOUD_COUNT; ci++) clouds.push(makeCloud());

  function makePollenMote() {
    return { x: rand(0, W), y: rand(0, GROUND_Y), vy: -rand(8, 20), swayPhase: rand(0, Math.PI * 2), r: rand(1.5, 3) };
  }
  var pollenMotes = [];
  for (var pi = 0; pi < POLLEN_COUNT; pi++) pollenMotes.push(makePollenMote());

  function makeFirefly() {
    return { x: rand(0, W), y: rand(GROUND_Y * 0.4, GROUND_Y - 10), pulsePhase: rand(0, Math.PI * 2), driftPhase: rand(0, Math.PI * 2), speed: rand(6, 14) };
  }
  var fireflies = [];
  for (var fj = 0; fj < FIREFLY_COUNT; fj++) fireflies.push(makeFirefly());

  function makePetal() {
    return { x: rand(0, W), y: rand(-GROUND_Y, 0), vy: rand(26, 46), rot: rand(0, Math.PI * 2), rotSpeed: rand(-1.4, 1.4), swayPhase: rand(0, Math.PI * 2), size: rand(6, 10) };
  }
  var petals = [];
  for (var pk = 0; pk < PETAL_COUNT; pk++) petals.push(makePetal());

  function makeBgButterfly() {
    return { x: rand(60, W - 60), y: rand(90, GROUND_Y - 60), phase: rand(0, Math.PI * 2), speed: rand(0.5, 0.9), wingPhase: rand(0, 10) };
  }
  var bgButterflies = [];
  for (var bb = 0; bb < BG_BUTTERFLY_COUNT; bb++) bgButterflies.push(makeBgButterfly());

  function makeBgLadybug() {
    return { x: rand(60, W - 60), y: GROUND_Y - rand(4, 14), dir: Math.random() < 0.5 ? 1 : -1, pauseTimer: rand(1, 3), walking: true };
  }
  var bgLadybugs = [];
  for (var lb = 0; lb < BG_LADYBUG_COUNT; lb++) bgLadybugs.push(makeBgLadybug());

  // Bird flocks are occasional, not continuous — a single reusable object,
  // spawned on a timer, rather than a pool.
  var birdFlock = null;
  var birdSpawnTimer = rand(8, 16);

  /* ---------------- Helpers ---------------- */
  function rand(min, max) { return min + Math.random() * (max - min); }

  function canvasPointFromEvent(e) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = W / rect.width;
    var scaleY = H / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  function activeFlowers() {
    return flowers.filter(function (f) { return f.state === "active"; });
  }

  /* ---------------- Buzz (player bee) ---------------- */
  // Call when the player grabs a flower and starts a drag: snaps Buzz to the
  // source flower and kicks off a takeoff "stretch" so launches feel springy.
  function buzzTakeoff(x, y) {
    buzz.x = x; buzz.y = y;
    buzz.state = "flying";
    buzz.takeoffTimer = BUZZ_TAKEOFF_MS;
    buzz.trail = [];
    buzz.emitTimer = 0;
  }

  // Call when a drag ends. `success` triggers a landing squash; a miss just
  // eases Buzz back into idle hover from wherever he currently is.
  function buzzArrive(success) {
    buzz.state = success ? "landing" : "idle";
    buzz.landTimer = success ? BUZZ_LAND_MS : 0;
    buzz.restX = buzz.x;
    buzz.restY = buzz.y;
  }

  // Frame-rate independent exponential ease: returns the fraction of the
  // remaining distance to close this frame, given a "half-life"-ish rate.
  function easeAmount(dt, rate) {
    return 1 - Math.pow(0.001, dt * rate);
  }

  function updateBuzz(dt) {
    // Advance sprite animation frame based on accumulated time
    // Uses FPS-based frame advancement for frame-perfect timing
    buzz.elapsedFrameTime += dt;
    while (buzz.elapsedFrameTime >= 1 / BUZZ_ANIM_FPS) {
      buzz.frameIndex++;
      if (buzz.frameIndex >= BEES_FRAME_COUNT) {
        buzz.frameIndex = 0;  // loop animation
      }
      buzz.elapsedFrameTime -= 1 / BUZZ_ANIM_FPS;
    }

    // Wings flap continuously regardless of state — a resting bee still
    // flutters. ~7-8 visible flaps/sec at this multiplier.
    buzz.wingPhase += dt * 46;

    if (dragging) {
      buzz.state = "flying";
      var prevX = buzz.x, prevY = buzz.y;
      // Ease toward the pointer instead of snapping to it — this is what
      // makes the flight path curve naturally (the trail below samples
      // this eased position, not the raw pointer).
      var ease = easeAmount(dt, 9);
      buzz.x += (dragCurrent.x - buzz.x) * ease;
      buzz.y += (dragCurrent.y - buzz.y) * ease;
      buzz.vx = (buzz.x - prevX) / Math.max(dt, 0.0001);
      buzz.vy = (buzz.y - prevY) / Math.max(dt, 0.0001);

      // Bank into turns based on horizontal velocity, clamped so Buzz never
      // flips past a believable roll angle.
      var targetAngle = Collision.clamp(buzz.vx * 0.0025, -0.6, 0.6);
      buzz.angle += (targetAngle - buzz.angle) * Math.min(1, dt * 10);

      // Sample the buzzing/motion-blur trail from the EASED position.
      buzz.trail.push({ x: buzz.x, y: buzz.y, age: 0 });
      if (buzz.trail.length > BUZZ_TRAIL_MAX) buzz.trail.shift();

      // Also feed the ribbon polyline (dragTrail) from the same eased
      // position — this is what gives the ribbon its natural curve, since
      // Buzz always lags slightly behind the raw pointer.
      dragTrail.push({ x: buzz.x, y: buzz.y });
      if (dragTrail.length > BUZZ_TRAIL_MAX) dragTrail.shift();

      // Periodic spark particles along the flight path (pooled system).
      buzz.emitTimer -= dt;
      if (buzz.emitTimer <= 0) {
        buzz.emitTimer = BUZZ_EMIT_INTERVAL;
        particles.burst(buzz.x, buzz.y, { glyphs: ["✨"], count: 1, life: 320, minSpeed: 15, maxSpeed: 45, gravity: 30 });
      }
    } else if (buzz.state === "landing") {
      buzz.landTimer -= dt;
      var lt = Collision.clamp(buzz.landTimer / BUZZ_LAND_MS, 0, 1);
      buzz.scaleY = 1 - Math.sin(lt * Math.PI) * 0.4; // squash flat on arrival
      buzz.scaleX = 1 + Math.sin(lt * Math.PI) * 0.3; // ...and bulge sideways
      buzz.angle *= 0.85;
      if (buzz.landTimer <= 0) {
        buzz.state = "idle";
        buzz.scaleX = 1; buzz.scaleY = 1;
      }
    } else {
      // Idle hover: a gentle figure-eight (Lissajous curve) around the rest
      // point, so Buzz never looks frozen while waiting for the next move.
      buzz.state = "idle";
      buzz.idleT += dt;
      var fx = Math.sin(buzz.idleT * 1.1) * 22;
      var fy = Math.sin(buzz.idleT * 2.2) * 10;
      buzz.x += (buzz.restX + fx - buzz.x) * Math.min(1, dt * 4);
      buzz.y += (buzz.restY + fy - buzz.y) * Math.min(1, dt * 4);
      buzz.angle *= 0.9;
      buzz.scaleX += (1 - buzz.scaleX) * Math.min(1, dt * 6);
      buzz.scaleY += (1 - buzz.scaleY) * Math.min(1, dt * 6);
    }

    // Takeoff stretch layers on top of whichever branch just ran.
    if (buzz.takeoffTimer > 0) {
      buzz.takeoffTimer -= dt;
      var tt = Collision.clamp(buzz.takeoffTimer / BUZZ_TAKEOFF_MS, 0, 1);
      buzz.scaleY = 1 + Math.sin(tt * Math.PI) * 0.35; // stretch tall
      buzz.scaleX = 1 - Math.sin(tt * Math.PI) * 0.25; // ...and thin
    }

    // Age out and cull the motion-blur trail.
    for (var bt = buzz.trail.length - 1; bt >= 0; bt--) {
      buzz.trail[bt].age += dt;
      if (buzz.trail[bt].age > BUZZ_TRAIL_LIFE) buzz.trail.splice(bt, 1);
    }
  }

  /* ---------------- Ambient background ----------------
     Runs every frame REGARDLESS of gameState — the meadow stays alive
     behind the intro/win/fail overlays instead of freezing. Every loop
     here walks a small fixed-size pool; nothing is created or destroyed
     per frame (elements wrap/respawn in place instead). */
  function updateAmbient(dt) {
    windPhase += dt;

    // Smog scares off the delicate stuff and mutes the rest — ties into
    // the existing smogAlpha value so this reacts to Stage 3's smog waves
    // without needing to know how smog itself is implemented.
    ambientVividness = 1 - Collision.clamp(smogAlpha / 0.34, 0, 1);

    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      c.x += c.speed * dt;
      if (c.x - 90 * c.scale > W + 40) c.x = -90 * c.scale - 40;
    }

    for (var p = 0; p < pollenMotes.length; p++) {
      var m = pollenMotes[p];
      m.y += m.vy * dt;
      m.swayPhase += dt * 1.4;
      if (m.y < -10) { m.y = GROUND_Y + rand(0, 20); m.x = rand(0, W); }
    }

    for (var fI = 0; fI < fireflies.length; fI++) {
      var fl = fireflies[fI];
      fl.driftPhase += dt * fl.speed * 0.12;
      fl.pulsePhase += dt * 2.4;
      fl.x += Math.sin(fl.driftPhase) * 8 * dt;
      fl.y += Math.cos(fl.driftPhase * 1.3) * 6 * dt;
      fl.x = Collision.clamp(fl.x, 10, W - 10);
      fl.y = Collision.clamp(fl.y, GROUND_Y * 0.35, GROUND_Y - 6);
    }

    for (var pe = 0; pe < petals.length; pe++) {
      var pt2 = petals[pe];
      pt2.y += pt2.vy * dt;
      pt2.rot += pt2.rotSpeed * dt;
      pt2.swayPhase += dt * 1.8;
      if (pt2.y > GROUND_Y) { pt2.y = rand(-80, -10); pt2.x = rand(0, W); }
    }

    for (var bI = 0; bI < bgButterflies.length; bI++) {
      var bf = bgButterflies[bI];
      bf.phase += dt * bf.speed;
      bf.wingPhase += dt * 18;
    }

    // Ladybugs walk a few steps, pause, and turn around at random — no
    // pathfinding needed, just enough randomness to not look mechanical.
    for (var lI = 0; lI < bgLadybugs.length; lI++) {
      var lg = bgLadybugs[lI];
      if (lg.walking) {
        lg.x += lg.dir * 12 * dt;
        if (Math.random() < 0.01) { lg.walking = false; lg.pauseTimer = rand(0.6, 2); }
        if (lg.x < 40 || lg.x > W - 40) lg.dir *= -1;
      } else {
        lg.pauseTimer -= dt;
        if (lg.pauseTimer <= 0) { lg.walking = true; lg.dir = Math.random() < 0.5 ? 1 : -1; }
      }
    }

    // Occasional bird flock crossing the upper sky (paused during smog).
    if (!birdFlock) {
      birdSpawnTimer -= dt;
      if (birdSpawnTimer <= 0 && ambientVividness > 0.5) {
        var fromLeft = Math.random() < 0.5;
        birdFlock = { x: fromLeft ? -60 : W + 60, y: rand(40, 100), dir: fromLeft ? 1 : -1, speed: rand(70, 100), flapPhase: 0 };
      }
    } else {
      birdFlock.x += birdFlock.dir * birdFlock.speed * dt;
      birdFlock.flapPhase += dt * 10;
      if (birdFlock.x < -80 || birdFlock.x > W + 80) {
        birdFlock = null;
        birdSpawnTimer = rand(14, 26);
      }
    }
  }

  function findFlowerAt(x, y, excludeId) {
    var list = flowers;
    var best = null, bestDist = Infinity;
    for (var i = 0; i < list.length; i++) {
      var f = list[i];
      if (f.state !== "active") continue;
      if (excludeId != null && f.id === excludeId) continue;
      var d = Collision.distance(x, y, f.x, f.y);
      if (d <= f.r + 12 && d < bestDist) { best = f; bestDist = d; }
    }
    return best;
  }

  function spawnFlower() {
    if (activeFlowers().length >= MAX_ACTIVE_FLOWERS) return;
    var x, y, ok, tries = 0;
    do {
      x = rand(70, W - 70);
      y = rand(130, GROUND_Y - 40);
      ok = true;
      for (var i = 0; i < flowers.length; i++) {
        if (Collision.distance(x, y, flowers[i].x, flowers[i].y) < 100) { ok = false; break; }
      }
      tries++;
    } while (!ok && tries < 24);

flowers.push({
  id: flowerIdSeq++,
  x: x,
  y: y,
  r: FLOWER_R,
  state: "active",
  timeLeft: WILT_MS,
  bornAt: performance.now(),
  showUntil: 0,

  // sprite animation
  spriteFrame: 0,
  spriteAnimDone: false
});
  }

  function popFruitAt(x, y) {
    fruits.push({
      id: fruitIdSeq++,
      x: x, y: y,
      vx: rand(-30, 30),
      vy: rand(-260, -200),
      emoji: FRUITS[Math.floor(Math.random() * FRUITS.length)],
      size: 26,
      rotation: 0,
      state: "falling"
    });
  }

  function pollinate(flower) {
    if (!flower || flower.state !== "active") return;
    flower.state = "pollinated";
    flower.showUntil = performance.now() + 650;
    pollinatedCount++;
    combo++;
    consecutiveMisses = 0;
    var gain = 50 + combo * 5;
    score += gain;
    audio.collect();
    particles.burst(flower.x, flower.y - 6, { glyphs: ["✨", "💮", "🌟"], count: 10, life: 620, minSpeed: 40, maxSpeed: 150, gravity: 120 });
    popFruitAt(flower.x, flower.y);
    pulseCombo();
    reactGuide("happy");
    spawnFloatLabel(flower.x, flower.y - 40, "+" + gain + "!", "#2fbf71");

    // Cocomelon-style reinforcement: short, cheerful call-outs fired at
    // the exact moment they become true, so the lesson ("bees make
    // flowers bloom") lands through repetition, not one buried mention.
    if (!saidFirstPollinate) {
      saidFirstPollinate = true;
      GOGUi.say("🐝 Yay! Buzz made a flower bloom!");
    } else if (combo === 5) {
      GOGUi.say("🔥 5 in a row! Buzz is on fire!");
    } else if (combo === 10) {
      GOGUi.say("🌟 Wow, 10 in a row, Buzz!");
    } else if (pollinatedCount === WIN_TARGET - 2) {
      GOGUi.say("🎯 So close! Just 2 more flowers!");
    }

    if (pollinatedCount >= WIN_TARGET) triggerWin();
  }

  function wiltFlower(flower) {
    flower.state = "wilted";
    flower.showUntil = performance.now() + 850;
    consecutiveMisses++;
    combo = 0;
    audio.oops();
    particles.burst(flower.x, flower.y, { glyphs: ["💨"], count: 6, life: 500, minSpeed: 20, maxSpeed: 60, gravity: 30 });
    reactGuide("oops");
    spawnFloatLabel(flower.x, flower.y - 20, "Oops!", "#e82e5d");
    if (consecutiveMisses === 2) {
      GOGUi.say("😮 A flower wilted — catch the next one, Buzz!");
    }
    if (consecutiveMisses === SMOG_MISS_THRESHOLD) triggerSmog();
    if (consecutiveMisses >= FAIL_MISS_THRESHOLD) triggerFail();
  }

  function triggerSmog() {
    smogActive = true;
    smogTimer = 2500;
    critters = []; // "no bees, no food" — helpers vanish
    smogClouds = [];
    for (var i = 0; i < 6; i++) {
      smogClouds.push({
        x: rand(0, W), y: rand(60, GROUND_Y),
        r: rand(70, 140),
        vx: rand(-24, 24), vy: rand(-6, 6)
      });
    }
    reactGuide("oops");
    GOGUi.say("😷 Uh-oh! No bees, no fruit, no food!");
  }

  function pulseCombo() {
    if (window.GOGUi) {
      window.GOGUi.restartAnimation(comboChip, 'combo-pop');
    }
  }

  function spawnCritter(fruit) {
    var fromLeft = fruit.x < W / 2;
    var types = ["boar", "deer", "hare"];
    var selectedType = types[Math.floor(Math.random() * types.length)];
    critters.push({
      type: selectedType,
      x: fromLeft ? -30 : W + 30,
      y: GROUND_Y,
      targetX: fruit.x,
      targetFruitId: fruit.id,
      phase: "approach",
      hop: Math.random() * Math.PI * 2,
      life: 0,
      maxLife: 1.6,
      facing: fromLeft ? 1 : -1
    });
  }

  /* ---------------- State transitions ---------------- */
  function resetGame() {
    flowers = []; fruits = []; critters = [];
    score = 0; combo = 0; pollinatedCount = 0; consecutiveMisses = 0;
    beatTimer = 0; nextBeatMs = BEAT_MS;
    sessionTimeLeft = SESSION_MS;
    smogActive = false; smogTimer = 0; smogAlpha = 0; smogClouds = []; flightPaths = [];
    floatLabels = []; saidFirstPollinate = false; saidCritterFed = false;
    dragging = false; dragSourceId = null; dragTrail = [];
    // reset Buzz to a calm idle hover in the middle of the meadow
    buzz.x = buzz.restX = W * 0.5;
    buzz.y = buzz.restY = GROUND_Y - 160;
    buzz.vx = 0; buzz.vy = 0; buzz.angle = 0;
    buzz.scaleX = 1; buzz.scaleY = 1;
    buzz.state = "idle"; buzz.landTimer = 0; buzz.takeoffTimer = 0;
    buzz.trail = []; buzz.emitTimer = 0;
    winWipeRadius = 0;
    gameState = "playing";
    fruitIdSeq = 1;
    if (activeOverlay) {
      GOGUi.closeOverlay(activeOverlay);
      activeOverlay = null;
    }
    // give the player two flowers immediately instead of waiting out two full beats
    spawnFlower();
    spawnFlower();
  }

  function triggerWin() {
    if (gameState !== "playing") return;
    gameState = "winning";
    winWipeRadius = 0;
    audio.win();

    if (window.GOGSave) {
      GOGSave.recordStageClear(STAGE_ID, {
        stars: 3,
        sprouts: 15,
        smogDrop: 10
      });
    }
    GOGUi.say("Buzz has saved the meadow! 🌸🎉");
  }

  function triggerFail() {
    if (gameState !== "playing") return;
    gameState = "fail";
    dragging = false; dragTrail = [];
    
    activeOverlay = GOGUi.showOverlay({
      accent: "var(--gog-tangerine)",
      title: "🐝 Buzz Needs a Rest",
      body: "The meadow's still a little sleepy — some flowers didn't get visited in time. Buzz would love another go!",
      primaryLabel: "Try Again ▶",
      onPrimary: function () {
        GOGUi.closeOverlay(activeOverlay);
        activeOverlay = null;
        resetGame();
      },
      secondaryLabel: "Back to Map",
      onSecondary: function () {
        window.location.href = "../index.html";
      }
    });
  }

  var cutsceneTimer = null;
  function triggerSeedReturnCutscene(onComplete) {
    var overlay = document.getElementById("cutscene");
    var treeIcon = document.getElementById("csTreeIcon");
    if (!overlay) {
      onComplete();
      return;
    }
    overlay.classList.add("show");
    if (treeIcon) {
      GOGUi.restartAnimation(treeIcon, "pulse");
    }
    GOGUi.say("A seed is heading home to the Tree… 🌱");

    function closeCutscene() {
      overlay.classList.remove("show");
      if (cutsceneTimer) clearTimeout(cutsceneTimer);
      onComplete();
    }

    var skipBtn = document.getElementById("csSkipBtn");
    if (skipBtn) {
      var newSkip = skipBtn.cloneNode(true);
      skipBtn.parentNode.replaceChild(newSkip, skipBtn);
      newSkip.addEventListener("click", closeCutscene);
    }

    cutsceneTimer = setTimeout(closeCutscene, 2200);
  }

  /* ---------------- Update ---------------- */
  function update(dt) {
    var dtMs = dt * 1000;
    var now = performance.now();

    ambientBee.t += dt;
    updateAmbient(dt); // meadow stays alive behind overlays too — no empty frames

    if (gameState === "playing") {
      // session timer
      sessionTimeLeft -= dtMs;
      if (sessionTimeLeft <= 0) {
        sessionTimeLeft = 0;
        if (pollinatedCount < WIN_TARGET) triggerFail();
      }

      // beat / spawn
      beatTimer += dtMs;
      if (beatTimer >= nextBeatMs) {
        beatTimer = 0;
        nextBeatMs = BEAT_MS + rand(-BEAT_JITTER, BEAT_JITTER);
        spawnFlower();
      }

      // flower timers
      for (var i = flowers.length - 1; i >= 0; i--) {
        var f = flowers[i];
        if (f.state === "active") {
          f.timeLeft -= dtMs;
          if (f.timeLeft <= 0) wiltFlower(f);
        } else if (f.state === "wilted" || f.state === "pollinated") {
          if (now >= f.showUntil) flowers.splice(i, 1);
        }
      }

      // smog timer
      if (smogActive) {
        smogTimer -= dtMs;
        if (smogTimer <= 0) { smogActive = false; }
      }
      var targetSmogAlpha = smogActive ? 0.34 : 0;
      smogAlpha += (targetSmogAlpha - smogAlpha) * Math.min(1, dt * 4);

      if (smogClouds.length) {
        for (var sc = 0; sc < smogClouds.length; sc++) {
          var cl = smogClouds[sc];
          cl.x += cl.vx * dt;
          cl.y += cl.vy * dt;
          if (cl.x < -cl.r) cl.x = W + cl.r;
          if (cl.x > W + cl.r) cl.x = -cl.r;
          cl.y = Collision.clamp(cl.y, 40, GROUND_Y - 20);
        }
        if (!smogActive && smogAlpha <= 0.01) smogClouds = [];
      }

      // Buzz: idle hover, in-flight easing/banking, landing squash, trail
      updateBuzz(dt);

      // fading flight-path lines
      for (var fp = flightPaths.length - 1; fp >= 0; fp--) {
        flightPaths[fp].life += dt;
        if (flightPaths[fp].life >= flightPaths[fp].maxLife) flightPaths.splice(fp, 1);
      }

      // fruits falling
      for (var j = fruits.length - 1; j >= 0; j--) {
        var fr = fruits[j];
        if (fr.state === "falling") {
          fr.vy += 480 * dt;
          fr.x += fr.vx * dt;
          fr.y += fr.vy * dt;
          fr.rotation += dt * 2;
          if (fr.y >= GROUND_Y) {
            fr.y = GROUND_Y;
            fr.vx = 0;
            fr.vy = 0;
            if (!smogActive && critters.length < 6) {
              fr.state = "onGround";
              spawnCritter(fr);
            } else {
              particles.burst(fr.x, GROUND_Y, { glyphs: ["🍃"], count: 4, life: 400, minSpeed: 10, maxSpeed: 40 });
              fruits.splice(j, 1);
            }
          }
        }
      }

      // critters
      for (var k = critters.length - 1; k >= 0; k--) {
        var c = critters[k];
        c.life += dt;
        c.hop += dt * 8;
        if (c.phase === "approach") {
          var dir = c.targetX > c.x ? 1 : -1;
          c.x += dir * 90 * dt;
          if (Math.abs(c.targetX - c.x) < 6) {
            c.phase = "eat";
            c.eatUntil = c.life + 0.6;
            // Eat the fruit: find it and remove it
            for (var fIdx = 0; fIdx < fruits.length; fIdx++) {
              if (fruits[fIdx].id === c.targetFruitId) {
                particles.burst(fruits[fIdx].x, GROUND_Y, { glyphs: ["🍃"], count: 4, life: 400, minSpeed: 10, maxSpeed: 40 });
                fruits.splice(fIdx, 1);
                break;
              }
            }
            // Make the pollination → fruit → food-chain link explicit and
            // impossible to miss, right at the moment it happens.
            spawnFloatLabel(c.x, c.y - 46, "Yum! 🍎", "#ffb020");
            if (!saidCritterFed) {
              saidCritterFed = true;
              GOGUi.say("🦌 Look! The fruit fed a hungry friend!");
            }
          }
        } else if (c.phase === "eat") {
          if (c.life >= c.eatUntil) {
            c.phase = "leave";
          }
        } else if (c.phase === "leave") {
          var awayDir = c.x < W / 2 ? -1 : 1;
          c.x += awayDir * 110 * dt;
          c.facing = awayDir;
        }
        if ((c.phase === "leave" && (c.x < -60 || c.x > W + 60)) || c.life > 15) critters.splice(k, 1);
      }
    }

    if (gameState === "winning") {
      winWipeRadius += dt * winWipeMax * 1.6;
      if (winWipeRadius >= winWipeMax) {
        gameState = "win";
        
        triggerSeedReturnCutscene(function () {
          activeOverlay = GOGUi.showOverlay({
            accent: "var(--gog-tangerine)",
            title: "🌼 The Meadow Blooms!",
            body: "Buzz did it — every last flower is blooming again.",
            factText: "About 1 in 3 bites of the food we eat depends on pollinators like bees!",
            primaryLabel: "Play Again ▶",
            onPrimary: function () {
              GOGUi.closeOverlay(activeOverlay);
              activeOverlay = null;
              resetGame();
            },
            secondaryLabel: "Back to Map",
            onSecondary: function () {
              window.location.href = "../index.html";
            }
          });
        });
      }
    }

    updateFloatLabels(dt);
    particles.update(dt);
    updateHUD();
  }

  var lastShownPollinated = 0;
  function updateHUD() {
    scoreChip.textContent = score;

    comboChip.textContent = "🔥 x" + combo;
    comboChip.classList.remove("combo-warm", "combo-hot");
    if (combo >= 8) comboChip.classList.add("combo-hot");
    else if (combo >= 4) comboChip.classList.add("combo-warm");

    var shownPollinated = Math.min(pollinatedCount, WIN_TARGET);
    progressVal.textContent = shownPollinated;
    if (shownPollinated !== lastShownPollinated) {
      lastShownPollinated = shownPollinated;
      if (window.GOGUi) window.GOGUi.restartAnimation(progressVal, "progress-pop");
    }
    progressFill.style.width = Math.min(100, (pollinatedCount / WIN_TARGET) * 100) + "%";

    var secs = Math.ceil(sessionTimeLeft / 1000);
    timerChip.textContent = Math.max(0, secs) + "s";
    timerChip.classList.toggle("timer-danger", secs <= 15 && gameState === "playing");
  }

  /* ---------------- Draw ---------------- */
  // Static gradients are built ONCE and reused — only the sun glow below is
  // rebuilt per frame, because its center actually drifts. This is the same
  // lesson from Stage 1: per-frame gradient object creation causes GC
  // stutter, so anything that doesn't change gets cached.
  var skyGradientCache = null;
  function getSkyGradient() {
    if (!skyGradientCache) {
      skyGradientCache = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
      skyGradientCache.addColorStop(0, "rgba(207,235,255,0.55)");
      skyGradientCache.addColorStop(1, "rgba(207,235,255,0.05)");
    }
    return skyGradientCache;
  }

  var depthFogGradientCache = null;
  function getDepthFogGradient() {
    if (!depthFogGradientCache) {
      depthFogGradientCache = ctx.createLinearGradient(0, GROUND_Y - 90, 0, GROUND_Y);
      depthFogGradientCache.addColorStop(0, "rgba(255,255,255,0)");
      depthFogGradientCache.addColorStop(1, "rgba(255,255,255,0.28)");
    }
    return depthFogGradientCache;
  }

  function drawSunlight() {
    // A soft glow that drifts slowly across the sky, plus three faint
    // sweeping rays — cheap (one radial gradient + three low-alpha rects).
    var sx = W * 0.78 + Math.sin(windPhase * 0.05) * 40;
    var sy = 70 + Math.cos(windPhase * 0.04) * 12;
    var glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, 190);
    glow.addColorStop(0, "rgba(255,246,200,0.55)");
    glow.addColorStop(1, "rgba(255,246,200,0)");
    ctx.save();
    ctx.globalAlpha = ambientVividness;
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, GROUND_Y);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = 0.06 * ambientVividness;
    ctx.fillStyle = "#fff";
    for (var r = 0; r < 3; r++) {
      var rx = sx - 60 + r * 70 + Math.sin(windPhase * 0.06 + r) * 20;
      ctx.save();
      ctx.translate(rx, 0);
      ctx.rotate(0.18);
      ctx.fillRect(-14, -20, 28, GROUND_Y + 40);
      ctx.restore();
    }
    ctx.restore();
  }

  function drawClouds() {
    ctx.save();
    ctx.globalAlpha = 0.8 * ambientVividness + 0.2;
    ctx.fillStyle = "#ffffff";
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      ctx.beginPath();
      ctx.arc(c.x, c.y, 22 * c.scale, 0, Math.PI * 2);
      ctx.arc(c.x + 26 * c.scale, c.y + 6 * c.scale, 26 * c.scale, 0, Math.PI * 2);
      ctx.arc(c.x - 24 * c.scale, c.y + 8 * c.scale, 18 * c.scale, 0, Math.PI * 2);
      ctx.arc(c.x + 6 * c.scale, c.y - 8 * c.scale, 16 * c.scale, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawCloudShadows() {
    ctx.save();
    ctx.globalAlpha = 0.10 * ambientVividness;
    ctx.fillStyle = "#2c3a1f";
    for (var i = 0; i < clouds.length; i++) {
      var c = clouds[i];
      ctx.beginPath();
      ctx.ellipse(c.x, GROUND_Y + 14, 46 * c.scale, 9 * c.scale, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawGrass() {
    ctx.save();
    ctx.lineCap = "round";
    for (var x = 6; x < W; x += GRASS_SPACING) {
      var wind = Math.sin(windPhase * 1.6 + x * 0.06);
      var bend = wind * 6;

      // --- Rear blades (darker green, slightly offset/shorter for depth) ---
      ctx.strokeStyle = "#4d7424";
      ctx.lineWidth = 2.5;

      // Left rear blade
      var hRearLeft = 10;
      ctx.beginPath();
      ctx.moveTo(x - 3, GROUND_Y + 1);
      ctx.quadraticCurveTo(x - 3 - hRearLeft * 0.2 + bend * 0.6, GROUND_Y - hRearLeft * 0.4, x - 3 - 3 + bend * 0.8, GROUND_Y - hRearLeft);
      ctx.stroke();

      // Right rear blade
      var hRearRight = 11;
      ctx.beginPath();
      ctx.moveTo(x + 3, GROUND_Y + 1);
      ctx.quadraticCurveTo(x + 3 + hRearRight * 0.2 + bend * 0.6, GROUND_Y - hRearRight * 0.4, x + 3 + 2 + bend * 0.8, GROUND_Y - hRearRight);
      ctx.stroke();

      // --- Front blades (brighter/standard green) ---
      ctx.strokeStyle = "#689F38";
      ctx.lineWidth = 3;

      // Tall center blade
      var hCenter = 16;
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 1);
      ctx.quadraticCurveTo(x + bend * 0.6, GROUND_Y - hCenter * 0.4, x + bend, GROUND_Y - hCenter);
      ctx.stroke();

      // Left front blade
      var hLeft = 12;
      ctx.beginPath();
      ctx.moveTo(x - 2, GROUND_Y + 1);
      ctx.quadraticCurveTo(x - 2 - hLeft * 0.1 + bend * 0.6, GROUND_Y - hLeft * 0.4, x - 2 - 2 + bend * 0.8, GROUND_Y - hLeft);
      ctx.stroke();

      // Right front blade
      var hRight = 13;
      ctx.beginPath();
      ctx.moveTo(x + 2, GROUND_Y + 1);
      ctx.quadraticCurveTo(x + 2 + hRight * 0.1 + bend * 0.6, GROUND_Y - hRight * 0.4, x + 2 + 2 + bend * 0.8, GROUND_Y - hRight);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawDepthFog() {
    ctx.save();
    ctx.fillStyle = getDepthFogGradient();
    ctx.fillRect(0, GROUND_Y - 90, W, 90);
    ctx.restore();
  }

  function drawBackground() {
    ctx.fillStyle = "#FDFBF7";
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = getSkyGradient();
    ctx.fillRect(0, 0, W, GROUND_Y);

    drawSunlight();
    drawClouds();

    // ground
    ctx.fillStyle = "#7CB342";
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

    drawCloudShadows();
    drawDepthFog();

    // ground outline
    ctx.strokeStyle = "#111";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(W, GROUND_Y);
    ctx.stroke();

    // grass on top of ground outline
    drawGrass();
  }

  /* ---------------- Ambient background drawing ---------------- */
  function drawPollenMotes() {
    ctx.save();
    ctx.fillStyle = "#FFE9A8";
    for (var i = 0; i < pollenMotes.length; i++) {
      var m = pollenMotes[i];
      var sway = Math.sin(m.swayPhase) * 10;
      ctx.globalAlpha = 0.5 * ambientVividness;
      ctx.beginPath();
      ctx.arc(m.x + sway, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFireflies() {
    ctx.save();
    for (var i = 0; i < fireflies.length; i++) {
      var f = fireflies[i];
      var pulse = 0.35 + Math.sin(f.pulsePhase) * 0.35 + 0.35; // roughly 0..1
      ctx.globalAlpha = pulse * 0.7 * ambientVividness;
      ctx.fillStyle = "#FFD23F";
      ctx.shadowColor = "#FFD23F";
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(f.x, f.y, 2.4, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawFallingPetals() {
    ctx.save();
    ctx.fillStyle = "#FF9FC7";
    for (var i = 0; i < petals.length; i++) {
      var p = petals[i];
      var sway = Math.sin(p.swayPhase) * 14;
      ctx.save();
      ctx.globalAlpha = 0.75 * ambientVividness;
      ctx.translate(p.x + sway, p.y);
      ctx.rotate(p.rot);
      ctx.beginPath();
      ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawBgButterflies() {
    for (var i = 0; i < bgButterflies.length; i++) {
      var b = bgButterflies[i];
      var x = b.x + Math.sin(b.phase) * 60;
      var y = b.y + Math.sin(b.phase * 2.3) * 24;
      var flap = 0.6 + Math.abs(Math.sin(b.wingPhase)) * 0.4;
      ctx.save();
      ctx.globalAlpha = 0.85 * ambientVividness;
      ctx.translate(x, y);
      ctx.scale(flap, 1); // cheap "wing flap" via horizontal squash, no re-fetch
      ctx.drawImage(butterflySpriteImg, -butterflySpriteImg.width / 2, -butterflySpriteImg.height / 2);
      ctx.restore();
    }
  }

  function drawBgLadybugs() {
    for (var i = 0; i < bgLadybugs.length; i++) {
      var l = bgLadybugs[i];
      ctx.save();
      ctx.globalAlpha = 0.9 * ambientVividness;
      ctx.translate(l.x, l.y);
      if (l.dir < 0) ctx.scale(-1, 1);
      ctx.drawImage(ladybugSpriteImg, -ladybugSpriteImg.width / 2, -ladybugSpriteImg.height / 2);
      ctx.restore();
    }
  }

  function drawBirdFlock() {
    if (!birdFlock) return;
    ctx.save();
    ctx.globalAlpha = 0.55 * ambientVividness;
    ctx.strokeStyle = "#3a3a3a";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    for (var i = 0; i < 4; i++) {
      var ox = birdFlock.x - i * 16 * birdFlock.dir;
      var oy = birdFlock.y + i * 7;
      var flap = Math.sin(birdFlock.flapPhase + i * 0.6) * 5;
      ctx.beginPath();
      ctx.moveTo(ox - 8, oy + flap);
      ctx.lineTo(ox, oy - 3);
      ctx.lineTo(ox + 8, oy + flap);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawAmbientBee() {
    if (gameState !== "playing" && gameState !== "winning") return;
    var x = W * 0.5 + Math.sin(ambientBee.t * 0.6) * 220;
    var y = H * 0.16 + Math.cos(ambientBee.t * 1.3) * 22;
    var sprite = EmojiSprite.get("🐝", 22);
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.translate(x, y);
    ctx.rotate(Math.sin(ambientBee.t * 3) * 0.15);
    ctx.drawImage(sprite, -sprite.width / 2, -sprite.height / 2);
    ctx.restore();
  }

  function drawFlowerRing(f) {
    var t = Collision.clamp(f.timeLeft / WILT_MS, 0, 1);
    var col = t > 0.5 ? "#3F8F29" : (t > 0.22 ? "#FFD23F" : "#E23B3B");
    ctx.save();
    ctx.lineWidth = 5;
    ctx.strokeStyle = col;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.r + 10, -Math.PI / 2, -Math.PI / 2 + t * Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Point on a quadratic bezier at t in [0,1]. Pure/allocation-light: reused
  // by both the flight-path arcs and (in a later patch) other ribbon FX.
  function bezierPoint(t, x1, y1, cx, cy, x2, y2) {
    var mt = 1 - t;
    return {
      x: mt * mt * x1 + 2 * mt * t * cx + t * t * x2,
      y: mt * mt * y1 + 2 * mt * t * cy + t * t * y2
    };
  }

  function drawFlightPaths() {
    for (var i = 0; i < flightPaths.length; i++) {
      var p = flightPaths[i];
      var t = p.life / p.maxLife;
      var fade = Math.max(0, 1 - t);

      // Glowing pollen-ribbon arc (quadratic bezier, not a straight line —
      // this is the "swoop" a bee actually flies between two flowers).
      ctx.save();
      ctx.globalAlpha = fade * 0.85;
      ctx.lineCap = "round";
      ctx.shadowColor = "#FF9FC7";
      ctx.shadowBlur = 16;
      ctx.strokeStyle = "#FF007F";
      ctx.lineWidth = 5 * fade + 1.5;
      ctx.beginPath();
      ctx.moveTo(p.x1, p.y1);
      ctx.quadraticCurveTo(p.cx, p.cy, p.x2, p.y2);
      ctx.stroke();
      ctx.restore();

      // Three staggered glowing dots travel along the curve as it fades,
      // tracing the path Buzz just flew.
      for (var d = 0; d < 3; d++) {
        var dt2 = Collision.clamp(t * 1.4 - d * 0.18, 0, 1);
        if (dt2 <= 0 || dt2 >= 1) continue;
        var pos = bezierPoint(dt2, p.x1, p.y1, p.cx, p.cy, p.x2, p.y2);
        ctx.save();
        ctx.globalAlpha = fade;
        ctx.fillStyle = "#FFD23F";
        ctx.shadowColor = "#FFD23F";
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }
  }

  function drawFlowers() {
    for (var i = 0; i < flowers.length; i++) {
      var f = flowers[i];
      var glyph, scale = 1, alpha = 1;

      // Base dimensions for alignment
      var baseWidth = f.r * 2.2;
      var baseHeight = baseWidth * (154 / 152); // Normal growing height
      var baseYOffset = baseHeight / 2; // Offset to bottom baseline

      // Check if we can use our spritesheets
      var useSprite = false;
      if (f.state === "active" || f.state === "pollinated") {
        if (flowerGrowingImg.complete && flowerGrowingImg.naturalWidth > 0) {
          useSprite = true;
        }
      } else if (f.state === "wilted") {
        if (flowerWiltingImg.complete && flowerWiltingImg.naturalWidth > 0) {
          useSprite = true;
        }
      }

      if (f.state === "active") {
        var isHover = hoverTargetId === f.id;
        var isSource = dragSourceId === f.id;
        ctx.save();
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r + 6, 0, Math.PI * 2);
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = "#111";
        ctx.stroke();
        if (isHover || isSource) {
          ctx.beginPath();
          ctx.arc(f.x, f.y, f.r + 14, 0, Math.PI * 2);
          ctx.strokeStyle = "#FF007F";
          ctx.lineWidth = 4;
          ctx.setLineDash([6, 6]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
        ctx.restore();
        drawFlowerRing(f);

        if (useSprite) {
          var frameDuration = 220; // ms per frame
          var frame = Math.floor((performance.now() - f.bornAt) / frameDuration);
          var frameIndex = Math.min(3, frame); // Frames 0, 1, 2, 3

          var sw = 152;
          var sh = 154;
          var sx = frameIndex * sw;
          var sy = 0;

          var dw = baseWidth;
          var dh = baseHeight;

          ctx.save();
          ctx.translate(f.x, f.y);
          ctx.drawImage(
            flowerGrowingImg,
            sx, sy, sw, sh,
            -dw / 2, baseYOffset - dh, dw, dh
          );
          ctx.restore();
          continue;
        }

        glyph = "🌱";
      } else if (f.state === "pollinated") {
        var pT = 1 - Collision.clamp((f.showUntil - performance.now()) / 650, 0, 1);
        scale = 1 + Math.sin(pT * Math.PI) * 0.35;

        if (useSprite) {
          var sw = 152;
          var sh = 154;
          var sx = 4 * sw; // Frame 4 is pollinated
          var sy = 0;

          var dw = baseWidth * scale;
          var dh = baseHeight * scale;

          ctx.save();
          ctx.translate(f.x, f.y);
          ctx.drawImage(
            flowerGrowingImg,
            sx, sy, sw, sh,
            -dw / 2, baseYOffset - dh, dw, dh
          );
          ctx.restore();
          continue;
        }

        glyph = "🌸";
      } else if (f.state === "wilted") {
        alpha = Collision.clamp((f.showUntil - performance.now()) / 850, 0.35, 1);

        if (useSprite) {
          var elapsed = 850 - (f.showUntil - performance.now());
          var frameIndex = Math.max(0, Math.min(4, Math.floor(elapsed / 170)));

          var sw = 153.2;
          var sh = 119;
          var sx = frameIndex * sw;
          var sy = 0;

          var dw = baseWidth;
          var dh = dw * (sh / sw);

          ctx.save();
          ctx.globalAlpha = alpha;
          ctx.translate(f.x, f.y);
          ctx.drawImage(
            flowerWiltingImg,
            sx, sy, sw, sh,
            -dw / 2, baseYOffset - dh, dw, dh
          );
          ctx.restore();
          continue;
        }

        glyph = "🥀";
      }

      var sprite = EmojiSprite.get(glyph, f.r * 1.5 * scale);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(f.x, f.y);
      ctx.drawImage(sprite, -sprite.width / 2, -sprite.height / 2);
      ctx.restore();
    }
  }

  // Live "pollen ribbon" while actively dragging. Drawn as short segments
  // (not one long stroke) so each segment can fade independently by age —
  // dragTrail is capped at BUZZ_TRAIL_MAX points, so this is at most ~19
  // segments × 2 stroke calls, only while a drag is in progress.
  function drawFlightRibbon() {
    if (!dragging || dragTrail.length < 2) return;
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    var n = dragTrail.length;
    for (var i = 1; i < n; i++) {
      var a = i / n; // 0 = oldest/tail (faded), 1 = newest/head (bright)
      var p0 = dragTrail[i - 1], p1 = dragTrail[i];

      // outer glow pass
      ctx.globalAlpha = a * 0.5;
      ctx.shadowColor = "#FF9FC7";
      ctx.shadowBlur = 18;
      ctx.strokeStyle = "#FF007F";
      ctx.lineWidth = 10 * a + 2;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.y);
      ctx.lineTo(p1.x, p1.y);
      ctx.stroke();

      // bright pollen-gold core on top, no glow (keeps it readable)
      ctx.shadowBlur = 0;
      ctx.globalAlpha = a * 0.9;
      ctx.strokeStyle = "#FFD23F";
      ctx.lineWidth = 3 * a + 1;
      ctx.stroke();
    }
    ctx.restore();
  }

  // Buzz himself: motion-blur trail dots and the animated sprite sheet
  // — all transformed with a single translate/rotate/scale so banking +
  // squash/stretch apply consistently to every part.
  function drawBuzz() {
    if (gameState !== "playing") return;

    for (var i = 0; i < buzz.trail.length; i++) {
      var pt = buzz.trail[i];
      var a = 1 - pt.age / BUZZ_TRAIL_LIFE;
      ctx.save();
      ctx.globalAlpha = a * 0.35;
      ctx.fillStyle = "#FFD23F";
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 5 * a, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    ctx.save();
    ctx.translate(buzz.x, buzz.y);
    ctx.rotate(buzz.angle);
    ctx.scale(buzz.scaleX, buzz.scaleY);

    // Use sprite sheet with better error handling and frame calculation
    if (beeSheetLoaded && beesFlyingSpriteSheet.complete && beesFlyingSpriteSheet.naturalWidth > 0) {
      try {
        var col = buzz.frameIndex % BEES_SHEET_COLS;
        var row = Math.floor(buzz.frameIndex / BEES_SHEET_COLS);
        var sx = col * BEES_SHEET_FRAME_WIDTH;
        var sy = row * BEES_SHEET_FRAME_HEIGHT;

        ctx.drawImage(
          beesFlyingSpriteSheet,
          sx, sy,
          BEES_SHEET_FRAME_WIDTH, BEES_SHEET_FRAME_HEIGHT,
          -BUZZ_SPRITE_SIZE / 2, -BUZZ_SPRITE_SIZE / 2,
          BUZZ_SPRITE_SIZE, BUZZ_SPRITE_SIZE
        );
      } catch (e) {
        console.warn("Sprite sheet rendering error:", e.message);
        drawBeeFallback(buzz.frameIndex);
      }
    } else {
      // Fallback: draw animated bee with procedural animation
      drawBeeFallback(buzz.frameIndex);
    }
    ctx.restore();
  }

  // Procedural bee drawing with frame-based animation — used when sprite sheet unavailable
  function drawBeeFallback(frameIndex) {
    var frame = frameIndex % 8;  // 8-frame wing flap cycle
    var wingFlap = Math.sin((frame / 8) * Math.PI * 2) * 0.5;  // smooth sine wave flap
    
    ctx.save();
    
    // Body (rounded yellow rectangle)
    ctx.fillStyle = "#FFD700";
    ctx.beginPath();
    ctx.ellipse(0, 0, 16, 24, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Black stripes on body
    ctx.fillStyle = "#000000";
    ctx.fillRect(-14, -10, 28, 4);
    ctx.fillRect(-14, 2, 28, 4);
    ctx.fillRect(-14, 14, 28, 4);
    
    // Head (small circle)
    ctx.fillStyle = "#FFD700";
    ctx.beginPath();
    ctx.arc(0, -22, 7, 0, Math.PI * 2);
    ctx.fill();
    
    // Eyes
    ctx.fillStyle = "#000000";
    ctx.beginPath();
    ctx.arc(-4, -24, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(4, -24, 2, 0, Math.PI * 2);
    ctx.fill();
    
    // Antennae
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-3, -27);
    ctx.quadraticCurveTo(-6, -34, -4, -38);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(3, -27);
    ctx.quadraticCurveTo(6, -34, 4, -38);
    ctx.stroke();
    
    // Wings - animated flapping with more pronounced motion
    ctx.globalAlpha = 0.7;
    ctx.fillStyle = "#87CEEB";  // Sky blue
    
    // Left wing with rotation animation
    ctx.save();
    ctx.translate(-12, -8);
    ctx.rotate((Math.sin(wingFlap * Math.PI) * 0.8));
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 16, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    
    // Right wing with opposite rotation
    ctx.save();
    ctx.translate(12, -8);
    ctx.rotate((-Math.sin(wingFlap * Math.PI) * 0.8));
    ctx.beginPath();
    ctx.ellipse(0, 0, 10, 16, -0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    
    // Legs
    ctx.globalAlpha = 1;
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    
    // Front legs
    ctx.beginPath();
    ctx.moveTo(-8, 16);
    ctx.lineTo(-14, 24);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(8, 16);
    ctx.lineTo(14, 24);
    ctx.stroke();
    
    // Middle legs
    ctx.beginPath();
    ctx.moveTo(-10, 18);
    ctx.lineTo(-16, 26);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(10, 18);
    ctx.lineTo(16, 26);
    ctx.stroke();
    
    ctx.restore();
  }

  function drawFruits() {
    for (var i = 0; i < fruits.length; i++) {
      var fr = fruits[i];
      var sprite = EmojiSprite.get(fr.emoji, fr.size);
      ctx.save();
      ctx.translate(fr.x, fr.y);
      ctx.rotate(fr.rotation);
      ctx.drawImage(sprite, -sprite.width / 2, -sprite.height / 2);
      ctx.restore();
    }
  }

  function drawCritters() {
    for (var i = 0; i < critters.length; i++) {
      var c = critters[i];
      var def = CRITTER_DEFS[c.type];
      if (!def) continue;

      ctx.save();
      ctx.globalAlpha = c.phase === "leave" ? Collision.clamp(1 - (c.life - c.maxLife) / 1, 0, 1) : 1;

      var img = def.img;
      var hasImage = img.complete && img.naturalWidth > 0;

      if (hasImage) {
        var totalFrames = def.frames;
        var frameIndex = 0;
        if (c.phase === "approach" || c.phase === "leave") {
          var fps = 12;
          frameIndex = Math.floor(c.life * fps) % totalFrames;
        } else {
          frameIndex = 0;
        }

        var sw = 32;
        var sh = 32;
        var sx = frameIndex * sw;
        var sy = 0;

        var dw = 64;
        var dh = 64;

        ctx.translate(c.x, c.y);
        ctx.scale(c.facing * def.defaultFacing, 1);

        // drawImage(image, sx, sy, sWidth, sHeight, dx, dy, dWidth, dHeight)
        // With dh = 64, the feet are ~8px up from bottom of frame, so -dh + 8 aligns it nicely on ground
        ctx.drawImage(img, sx, sy, sw, sh, -dw / 2, -dh + 8, dw, dh);
      } else {
        var sprite = EmojiSprite.get(def.emoji, 40);
        var hopOffset = c.phase === "approach" ? Math.abs(Math.sin(c.hop)) * 16 : 0;
        ctx.translate(c.x, c.y - hopOffset);
        if (c.facing === -1) ctx.scale(-1, 1);
        ctx.drawImage(sprite, -sprite.width / 2, -sprite.height);
      }
      ctx.restore();
    }
  }

  function drawSmog() {
    if (smogAlpha <= 0.001) return;
    ctx.save();
    ctx.globalAlpha = smogAlpha;
    var grad = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, W * 0.7);
    grad.addColorStop(0, "#8a8a8a");
    grad.addColorStop(1, "#4a4a4a");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    for (var i = 0; i < smogClouds.length; i++) {
      var cl = smogClouds[i];
      var cg = ctx.createRadialGradient(cl.x, cl.y, 0, cl.x, cl.y, cl.r);
      cg.addColorStop(0, "rgba(60,60,60,0.65)");
      cg.addColorStop(1, "rgba(60,60,60,0)");
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.arc(cl.x, cl.y, cl.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawWinWipe() {
    if (gameState !== "winning" && gameState !== "win") return;
    var r = gameState === "win" ? winWipeMax : winWipeRadius;
    ctx.save();
    ctx.beginPath();
    ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2);
    ctx.clip();
    var grad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, r || 1);
    grad.addColorStop(0, "#FFD23F");
    grad.addColorStop(0.55, "#FF9FC7");
    grad.addColorStop(1, "#7CB342");
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    // ring edge for juice
    if (gameState === "winning") {
      ctx.save();
      ctx.beginPath();
      ctx.arc(W / 2, H / 2, r, 0, Math.PI * 2);
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#111";
      ctx.stroke();
      ctx.restore();
    }
  }

  function draw() {
    drawBackground();    // sky, sun glow, light rays, clouds+shadows, ground, wind grass, depth fog
    drawFireflies();
    drawPollenMotes();
    drawFallingPetals();
    drawBgButterflies();
    drawBgLadybugs();
    drawBirdFlock();
    drawAmbientBee();
    drawFruits();
    drawCritters();
    drawFlightPaths();   // completed pollination arcs (bezier + traveling dots)
    drawFlowers();
    drawFlightRibbon();  // live drag ribbon while actively pollinating
    drawBuzz();          // Buzz himself, always drawn on top
    particles.draw(ctx);
    drawSmog();
    drawFloatLabels();   // "+50!" / "Yum!" / "Oops!" — stays legible over smog
    drawWinWipe();
  }

  /* ---------------- Pointer / input ---------------- */
  canvas.addEventListener("pointerdown", function (e) {
    if (gameState !== "playing") return;
    var p = canvasPointFromEvent(e);
    var f = findFlowerAt(p.x, p.y, null);
    if (f) {
      dragging = true;
      dragSourceId = f.id;
      dragTrail = [{ x: f.x, y: f.y }];
      dragCurrent = { x: p.x, y: p.y };
      buzzTakeoff(f.x, f.y); // Buzz launches from the source flower with a takeoff stretch
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    }
    e.preventDefault();
  }, { passive: false });

  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var p = canvasPointFromEvent(e);
    // Only the target point is recorded here — the actual ribbon trail is
    // sampled from Buzz's EASED position inside updateBuzz(), once per
    // animation frame, so the path curves naturally instead of jittering
    // with raw pointer-event frequency.
    dragCurrent = p;

    var target = findFlowerAt(p.x, p.y, dragSourceId);
    hoverTargetId = target ? target.id : null;
    e.preventDefault();
  }, { passive: false });

  function endDrag(e) {
    if (!dragging) return;
    var p = e ? canvasPointFromEvent(e) : dragCurrent;
    var target = findFlowerAt(p.x, p.y, dragSourceId);
    var source = flowers.filter(function (f) { return f.id === dragSourceId; })[0];
    var success = !!(target && source && source.state === "active" && target.state === "active");

    if (success) {
      // Arc the flight path upward like a real bee swoop, not a straight
      // line — cx/cy is the quadratic bezier control point.
      var cx = (source.x + target.x) / 2;
      var cy = (source.y + target.y) / 2 - rand(30, 70);
      flightPaths.push({ x1: source.x, y1: source.y, cx: cx, cy: cy, x2: target.x, y2: target.y, life: 0, maxLife: 0.65 });
      particles.burst(cx, cy, { glyphs: ["🍃"], count: 2, life: 700, minSpeed: 10, maxSpeed: 40, gravity: 20 });
      pollinate(source);
      pollinate(target);
    } else {
      // missed connection — small fizzle so the drag doesn't feel like it silently failed
      particles.burst(p.x, p.y, { glyphs: ["💫"], count: 4, life: 350, minSpeed: 30, maxSpeed: 70, gravity: 60 });
    }

    buzzArrive(success);

    dragging = false;
    dragSourceId = null;
    dragTrail = [];
    hoverTargetId = null;
  }

  canvas.addEventListener("pointerup", function (e) { endDrag(e); e.preventDefault(); }, { passive: false });
  canvas.addEventListener("pointercancel", function (e) { endDrag(e); });
  window.addEventListener("blur", function () {
    dragging = false;
    dragTrail = [];
    buzzArrive(false); // interrupted mid-flight — ease back to idle, no crash-land
  });

  /* ---------------- UI buttons ---------------- */
  muteBtn.addEventListener("click", function () {
    muted = !muted;
    audio.setMuted(muted);
    muteBtn.textContent = muted ? "🔇" : "🔊";
    if (window.GOGSave) {
      GOGSave.patch({ settings: { sound: !muted } });
    }
  });

  /* ---------------- Boot ---------------- */
  var loop = new window.GOGEngine.GameLoop({ update: update, draw: draw, stepMs: 1000 / 60 });
  loop.start();
  showIntro();
})();
</script>
</body>
